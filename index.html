  if(q.type==="write")body=`${audio}${q.done?`<p class="sub">あなたの入力：${esc(q.text)}</p>`:`<input id="wr" class="wr" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="聞こえた英語を入力" aria-label="聞こえた英語を入力">`}`;
  if(q.type==="cloze")body=`<p class="sub">${p.ja}</p><p class="prompt">${q.done?p.en:q.blank}</p>${q.done?audio:""}${opts("w")}`;
  if(q.type==="meaning")body=`<p class="prompt">${p.en}</p>${audio}${opts("ja")}`;
  if(q.type==="reply")body=`${sit}<p class="sub">相手</p><p class="line">${q.line}</p>${audio}<p class="sub">あなたの返事を選ぶ</p>${opts("en")}`;
  if(q.type==="build"||q.type==="listen")body=`${q.type==="build"?`<p class="prompt">${ja}</p>`:audio}
    <div class="slot tiles">${q.pick.map((k,n)=>`<button class="tile" data-un="${n}">${q.tiles[k]}</button>`).join("")}</div>
    <div class="tiles">${q.tiles.map((w,k)=>q.pick.includes(k)?"":`<button class="tile" data-tile="${k}">${w}</button>`).join("")}</div>`;
  if(q.type==="speak")body=`<p class="sub">${p.ja}</p><p class="prompt">${p.en}</p>${audio}
    ${q.done?"":recUI()}`;
  if(q.type==="flash")body=(q.hear?(q.open?`<p class="sub">相手</p><p class="line">${q.line}</p>`:`${sit}<p class="sub">相手の英語を聞いて、英語で返事をします。</p>${audio}`):`<p class="prompt">${ja}</p>`)+(q.open
    ?`<p class="prompt">${p.en}</p>${q.hear?`<p class="sub">${p.ja}（返事の一例）</p>`:""}${audio}${q.done?"":recUI()}`
    :`${q.timed?`<div class="bar timer"><i></i></div>`:""}<p class="sub">${q.timed?"6秒以内に":"時間は気にせず、"}${q.hear?"声に出してから答えを見ます。":"英語で声に出してから答えを見ます。"}</p>${recUI()}`);
  let foot="";
  if(q.done)foot=`<div class="shh"><img src="${IMG_F}" alt=""><div><b>${q.msg||""}</b><span class="xp">${q.ok?`+10 XP${L.combo>=2?`　🔥 ${L.combo}連続`:""}`:"明日もう一度確認します"}</span></div></div>${q.type==="match"?"":`<p>${p.en}<br><span class="sub">${p.ja}</span></p>`}<button class="btn" data-next>次へ</button>`;
  else if(q.type==="match")foot="";
  else if(q.type==="write")foot=`<button class="btn" data-check>答え合わせ</button>`;
  else if(q.opts||q.tiles)foot=`<button class="btn" data-check ${(q.opts?q.sel===null:!q.pick.length)?"disabled":""}>答え合わせ</button>`;
  else if(q.type==="flash"&&!q.open)foot=`<button class="btn" data-reveal>答えを見る</button>`;
  else foot=self; // 声に出す問題・答えを開いた後は、自己判定を親指の届く下部に置く
  app.innerHTML=`<div class="top"><button class="x" data-quit aria-label="やめる">×</button><div class="bar"><i style="width:${L.pw||0}%" data-w="${pw}"></i></div>${L.combo>=2?`<span class="combo">🔥 ${L.combo}</span>`:`<span class="left">あと${L.q.length-L.i-(q.done?1:0)}問</span>`}</div>
  <span class="kind">${L.mode==="weak"?`苦手特訓　${KIND[q.type]}`:L.mode==="dict"?"聞き取り特訓　聞いて書く":L.mode==="check"?`ステージ${L.unit+1} 確認テスト　${KIND[q.type]}`:L.mode==="place"?`レベル判定　${KIND[q.type]}`:L.mode==="talk"?(q.turn&&!q.retry?`つながる会話 ${q.turn} / 3`:"3往復の会話　聞いて返す"):q.hear?"聞いて返す":p.base?"型を見ながら入れ替えて言う（補助練習）":KIND[q.type]}</span>${body}${foot?`<div class="dock${q.done?` sheet ${q.ok?"ok":"ng"}`:""}">${foot}</div>`:""}`;
  L.pw=pw;if(typeof requestAnimationFrame!=="undefined"&&document.querySelector)requestAnimationFrame(()=>{const e=document.querySelector(".top .bar i");if(e)e.style.width=e.dataset.w+"%"});
}
let ac=null;
function sfx(ok,cb){const up=1+Math.min(cb||0,8)*.06; // 正誤の短い効果音。タップ操作のあとだけ鳴る。S.sfx===false で消音
  if(S.sfx===false)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
    (ok==="win"?[[523,0],[659,.12],[784,.24],[1047,.38]]:ok?[[660*up,0],[880*up,.09]]:[[220,0]]).forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+t;
      o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.12,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);
      o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.2)});
  }catch(e){}
}
const PRAISE=["正解！","いいですね！","その調子です！","きれいです！","ばっちりです！","すばらしい！"];
function grade(ok){
  const q=L.q[L.i],id=q.p.id,r=S.rev[id],m=q.type==="match";if(m)ok=true;recClear();roll();q.done=true;q.ok=ok;L.total++;
  if(L.mode==="place"){q.msg=ok?"正解！":"おしい！";sfx(ok);if(ok){L.right++;speak(q.p.en)}else L.missN=(L.missN||0)+1;return draw()} // 判定中は記録もXPも変えない
  L.combo=ok?(L.combo||0)+1:0;L.best=Math.max(L.best||0,L.combo);if(L.combo>(S.bestCombo||0))S.bestCombo=L.combo;
  if(ok){qadd("xp",10);qadd("combo",L.combo,1)}if(q.type==="speak"||q.type==="flash")qadd("say",1);
  if(!m){if(!ok)S.mc[id]=Math.min(99,(S.mc[id]||0)+1);else if(L.mode==="weak"&&S.mc[id]){S.mc[id]--;if(!S.mc[id])delete S.mc[id]}}
  q.msg=m?"ペア完成！":ok?([3,5,10,15].includes(L.combo)?`${L.combo}連続正解！`:PRAISE[Math.random()*PRAISE.length|0]):"おしい！";
  sfx(ok,L.combo);try{navigator.vibrate&&navigator.vibrate(ok?12:[30,40,30])}catch(e){}
  if(ok){L.right++;S.xp+=10;S.dayXp+=10;S.days[day(0)]=(S.days[day(0)]||0)+10;
    if(!m){if(!r)S.rev[id]={step:0,due:day(1)};
    else if(L.mode==="review"&&!q.retry){r.step=Math.min(r.step+1,4);r.due=day(GAP[r.step])}}
    if(q.type==="reply"||q.type==="cloze")speak(q.p.en);
  }else{(L.miss=L.miss||new Set()).add(id);S.rev[id]={step:0,due:day(1)};if(!q.retry&&L.mode!=="check")L.q.push({...q,retry:true})}
  save();draw();
}
function placed(){ // レベル判定の結果：正解したステージの数だけ先を開く
  const sk=Math.min(L.right*5,UNITS.length-1);if(sk>(S.skip||0))S.skip=sk;S.seen=1;save();const st=S.skip||0;
  app.innerHTML=`<header class="done"><img class="pic s" src="${IMG_B}" alt="すずね"><h1>レベル判定の結果</h1><p class="sub">${L.right} 問正解</p></header>
  ${gd(st?`${UNITS[st].t} から始められます。前の歩みも、いつでも学べます。`:"最初の歩みから、いっしょに始めましょう。")}
  <div class="dock"><button class="btn" data-unit="${st}">${UNITS[st].t} をはじめる</button><button class="btn ghost" data-home>道を見る</button></div>`;
}
function result(){
  if(L.mode==="place")return placed();
  if(S.last!==day(0)){S.streak=S.last===day(-1)?S.streak+1:1;S.last=day(0)}
  S.maxStreak=Math.max(S.maxStreak||0,S.streak);
  if(L.mode==="unit")S.done[L.unit]=(S.done[L.unit]||0)+1;
  if(L.mode==="talk")S.talk[L.unit]=(S.talk[L.unit]||0)+1;
  const pass=L.mode==="check"&&L.right>=8;if(pass)S.ck[L.unit]=1;
  const first=L.q.filter(x=>!x.retry).length,miss=[...(L.miss||[])].map(id=>ALL.concat(VARS).find(a=>a.id===id)).filter(Boolean);
  if(L.mode==="unit"&&!miss.length)S.perfect=(S.perfect||0)+1;
  if(L.mode==="unit"){qadd("les",1);if(!miss.length)qadd("perf",1)}if(L.mode==="review")qadd("rev",1);if(L.mode==="talk")qadd("talk",1);
  const fresh=badges().filter(b=>b[4]&&!S.bg[b[0]]);fresh.forEach(b=>S.bg[b[0]]=1);
  const keys=Object.keys(S.days).sort();while(keys.length>90)delete S.days[keys.shift()];
  save();sfx("win");
  const nx=L.mode==="unit"&&UNITS[L.unit+1]?L.unit+1:-1,xp=L.right*10,acc=Math.round((first-miss.length)/first*100);
  const cf=`<div class="cf" aria-hidden="true">${Array.from({length:30},(_,k)=>`<i style="left:${(k*37+5)%100}%;background:${["#f3e3a6","#4fb4ff","#c9a6ff","#6fe0a8"][k%4]};animation-delay:${(k%7)*.13}s;animation-duration:${2+(k%5)*.35}s"></i>`).join("")}</div>`;
  app.innerHTML=`${cf}<header class="done"><img class="pic s" src="${IMG_B}" alt="すずね"><h1>${L.mode==="check"?(pass?"確認テスト、合格。":"あと少し。"):L.mode==="talk"?"会話が、つながった。":miss.length?"一歩、進んだ。":"満ちた一歩。"}</h1><p class="sub">${first-miss.length} / ${first} 問を一度で通過</p></header>
  ${gd(L.mode==="check"?(pass?"このステージの言葉が、しっかり身についていますね。":"10問中8問で合格です。迷った文を確かめて、もう一度挑戦しましょう。"):L.mode==="talk"?"最後まで会話を続けられましたね。本番でも、きっと同じように話せます。":miss.length?"迷った文は、明日もう一度いっしょに確かめましょう。つまずいた所ほど、よく残ります。":"ぜんぶ一度で言えましたね。とてもきれいな一歩でした。")}
  <div class="stats g4"><div class="stat"><b>⭐ +<i id="cu" style="font-style:normal">${xp}</i></b><span>獲得XP</span></div><div class="stat"><b>${acc}%</b><span>一度で通過</span></div><div class="stat"><b>⚡ ${L.best||0}</b><span>最大の連続正解</span></div><div class="stat"><b>🔥 ${S.streak}</b><span>連続日数</span></div></div>
  ${(L.qdone||[]).map(k=>`<div class="newb"><i>🌙</i><div><span>クエスト達成</span><b>${QD[k][0].replace("{n}",goalOf(k))}</b><p class="sub">月のかけら 💎+10</p></div></div>`).join("")}
  ${fresh.map(b=>`<div class="newb"><i>${b[1]}</i><div><span>新しい実績</span><b>${b[2]}</b><p class="sub">${b[3]}</p></div></div>`).join("")}
  ${miss.length?`<h2>明日もう一度確認する文</h2><div class="opts">${miss.map(a=>`<button class="opt" data-hear="${a.id}">${a.en}<br><span class="sub">${a.ja}</span></button>`).join("")}</div>`:""}
  <div class="dock">${nx>=0?`<button class="btn" data-unit="${nx}">次の歩みへ：${UNITS[nx].t}</button><button class="btn ghost" data-home>道にもどる</button>`:`<button class="btn" data-home>道にもどる</button>`}</div>`;
  if(typeof requestAnimationFrame!=="undefined"&&document.getElementById("cu")){let v=0;const t=setInterval(()=>{v=Math.min(xp,v+Math.max(1,xp/20|0));const e=document.getElementById("cu");if(!e||v>=xp)clearInterval(t);if(e)e.textContent=v},35)}
}
const canRec=typeof navigator!=="undefined"&&navigator.mediaDevices&&typeof MediaRecorder!=="undefined";
const player=typeof Audio!=="undefined"?new Audio():{pause(){},play(){}};
const voice=typeof Audio!=="undefined"?new Audio():null; // 模範音声の再生用
// recState: idle | pending（許可待ち） | rec | done | blocked。recSeq は録音要求の番号で、画面移動・採点・非表示・エラーのたびに進めて古い要求を無効にする
let rec=null,recUrl="",recState="idle",recSeq=0,recNote="";
const redraw=()=>{if(L&&L.q[L.i])draw()};
const tracksOff=st=>{try{st&&st.getTracks().forEach(t=>t.stop())}catch(e){}};
async function recStart(){
  if(recState==="pending"||recState==="rec")return; // 連打で要求を重ねない
  recClear();speechSynthesis.cancel();if(voice)voice.pause();
  const my=++recSeq,live=()=>my===recSeq;
  let st=null;
  recState="pending";redraw();
  try{
    st=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!live()||document.hidden){tracksOff(st);if(live()){recState="idle";redraw()}return} // 待機中に移動・非表示になった要求は開始しない
    const chunks=[],r=new MediaRecorder(st);r.st=st;
    r.onerror=()=>{tracksOff(st);if(!live())return;recSeq++;rec=null;recState="blocked";redraw()}; // 要求を無効化するので、後から届く停止イベントは再生用データを作らない
    r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=()=>{tracksOff(st);if(!live())return;rec=null;if(r.keep){recUrl=URL.createObjectURL(new Blob(chunks,{type:r.mimeType}));recState="done"}else recState="idle";redraw()};
    rec=r;r.start();recState="rec";
  }catch(e){tracksOff(st);if(!live())return;rec=null;recState="blocked"} // 拒否、または許可後の開始失敗。どちらもマイクを離す
  redraw();
}
function recStop(keep){if(rec&&rec.state!=="inactive"){rec.keep=keep;try{rec.stop()}catch(e){tracksOff(rec.st);recSeq++;rec=null;recState="blocked";redraw()}}} // 保存して停止
function recCancelPending(){if(recState==="pending"){recSeq++;recState="idle"}} // 許可待ちだけを取り消す
function recClear(){ // 破棄：現在の要求・録音を無効化し、マイクをその場で離す
  const r=rec;recSeq++;rec=null;recNote="";
  if(r){r.keep=false;try{if(r.state!=="inactive")r.stop()}catch(e){}finally{tracksOff(r.st)}}
  player.pause();if(recUrl){URL.revokeObjectURL(recUrl);recUrl=""}
  recState="idle";
}
function recPlay(){
  const my=recSeq,fail=()=>{if(my!==recSeq)return;recNote="録音を再生できませんでした。録音なしでも続けられます。";redraw()}; // 古い再生の失敗は新しい画面に出さない
  speechSynthesis.cancel();if(voice)voice.pause();player.src=recUrl;
  try{const pr=player.play();if(pr&&pr.catch)pr.catch(fail)}catch(e){fail()}
}
function recUI(){
  if(!canRec)return "";
  if(recState==="blocked")return `<p class="heard">マイクを使えませんでした。録音なしでも進めます。許可の画面が出ない場合は、ブラウザーの設定でこのサイトのマイクを許可してください。</p><button class="btn ghost" data-rec>録音を再試行</button>`;
  if(recState==="pending")return `<button class="btn ghost" disabled>マイクを準備中…</button>`;
  if(recState==="rec")return `<button class="btn" data-recstop>■ 停止（録音中）</button>`;
  if(recState==="done")return `<div class="row"><button class="btn ghost" data-recplay>自分の声を聞く</button><button class="btn ghost" data-rec>録り直す</button></div>${recNote?`<p class="heard">${recNote}</p>`:""}`;
  return `<button class="btn ghost" data-rec>自分の声を録音する</button>`;
}
if(document.addEventListener)document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)return;
  if(recState==="pending"){recCancelPending();redraw()}
  else recStop(true);
});
UNITS.forEach(u=>{if(u.c&&(u.c.t.length!==3||new Set(u.c.t.map(t=>t[1])).size!==3||!u.c.t.every(t=>u.p[t[1]])))console.error("会話台本の条件違反（3往復・別々の有効な返事）:",u.t);const ok=u.r.filter(r=>Number.isInteger(r[1])&&u.p[r[1]]).map(r=>r[1]);if(u.p.length!==8||ok.length!==u.r.length||new Set(ok).size<2)console.error("教材データの条件違反（8文・会話の対象は有効な番号で、異なるものが2つ以上）:",u.t)});
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset,q=L&&L.q[L.i];
  if("unit" in d)start("unit",+d.unit);
  else if("talk" in d)start("talk",+d.talk);
  else if("review" in d)start("review");
  else if("ck" in d)start("check",+d.ck);
  else if("place" in d){S.seen=1;save();start("place")}
  else if("flash" in d)start("flash");
  else if("practice" in d)practice();
  else if("weak" in d)start("weak");
  else if("dict" in d)start("dict");
  else if("talkr" in d){const du=UNITS.map((u,i)=>i).filter(i=>S.done[i]);if(du.length)start("talk",du[Math.random()*du.length|0])}
  else if("buy" in d){if((S.gem||0)>=50&&(S.frz||0)<2){S.gem-=50;S.frz=(S.frz||0)+1;save()}stats()}
  else if("home" in d||"quit" in d)home();
  else if("book" in d)book();
  else if("stats" in d)stats();
  else if("settings" in d){askReset=false;settings()}
  else if("intro" in d)intro(+d.intro);
  else if("introdone" in d){S.seen=1;save();home()}
  else if("set" in d){const k=d.set.split(":")[0],v=d.set.slice(k.length+1);S[k]=k==="sfx"?v==="true":k==="goal"?+v:v;save();settings()}
  else if("hearsample" in d)speak("Nice to meet you.");
  else if("copy" in d){
    const sel=()=>{const x=document.getElementById("exp");if(x){x.focus();x.select()}};
    const fail=()=>{setMsg="自動でコピーできませんでした。文字列を選択したので、そのままコピーしてください。";settings();sel()};
    try{navigator.clipboard.writeText(document.getElementById("exp").value).then(()=>{setMsg="コピーしました。";settings()},fail)}catch(e){fail()}
  }
  else if("import" in d){if(importCode(document.getElementById("imp").value))setMsg="学習記録を読み込みました。";else setErr="読み込めませんでした。文字列が途中で切れていないか確かめてください。";settings()}
  else if("reset" in d){askReset=true;settings()}
  else if("resetno" in d){askReset=false;settings()}
  else if("resetyes" in d){S=Object.assign(BLANK(),{rate:S.rate,sfx:S.sfx,goal:S.goal,seen:1});roll();save();askReset=false;setMsg="学習記録を消しました。";settings()}
  else if("hear" in d){const a=ALL.concat(VARS).find(a=>a.id===d.hear);if(a)speak(a.en)}
  else if("say" in d)(q.line&&!q.done&&!q.open?speak(q.line,1):speak(q.p.en));
  else if("go" in d)show();
  else if("next" in d){L.i++;show()}
  else if(q.done)return;
  else if("reveal" in d)reveal();
  else if("m" in d){const a=d.m.split(":");pickM(+a[0],+a[1])}
  else if("opt" in d){q.sel=+d.opt;draw()}
  else if("tile" in d){q.pick.push(+d.tile);draw()}
  else if("un" in d){q.pick.splice(+d.un,1);draw()}
  else if("check" in d&&q.type==="write"){const e=document.getElementById("wr");q.text=e&&e.value||"";grade(wn(q.text)===wn(q.p.en))}
  else if("check" in d)grade(q.opts?q.opts[q.sel].id===q.p.id:norm(q.pick.map(k=>q.tiles[k]).join(" "))===norm(q.p.en));
  else if("self" in d)grade(d.self==="1");
  else if("rec" in d)recStart();
  else if("recstop" in d)recStop(true);
  else if("recplay" in d)recPlay();
});
(S.seen||S.xp>0||Object.keys(S.done).length)?home():intro(0);
