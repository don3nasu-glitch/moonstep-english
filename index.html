  r:[["Why are you giving this to me?", 1],["When should I update you?", 4],["Can I make decisions without asking you?", 3]],
  c:{sit:"新しい案件をチームの若手メンバーに任せる",t:[["I'm not sure what you expect exactly.", 2],["What if I hit a problem?", 5],["I could use a bit more support.", 7]]}},
 {t:"第四百九十歩 具体的にほめる",d:"部下の仕事ぶりを具体的にほめる",p:[
  ["p3913", "You did a fantastic job yesterday.", "昨日は素晴らしい仕事ぶりでした。"],["p3914", "The client was really impressed.", "お客様がとても感心していました。"],["p3915", "Your slides were crystal clear.", "あなたのスライドはとても分かりやすかった。"],["p3916", "You handled that question perfectly.", "あの質問への対応は完璧でした。"],["p3917", "I noticed how hard you worked.", "あなたの頑張りはちゃんと見ていました。"],["p3918", "That made a real difference.", "あれが大きな違いを生みました。"],["p3919", "Keep up the great work.", "この調子で頑張ってください。"],["p3920", "I'll mention this to the director.", "このことは部長にも伝えておきます。"]],
  r:[["Was the client happy with it?", 1],["I was worried about that tough question.", 3],["I stayed late every night last week.", 4]],
  c:{sit:"大事な商談を終えた部下に、良かった点を具体的に伝える",t:[["Do you think my slides were okay?", 2],["I hope the extra work was worth it.", 5],["Do you think senior management will notice?", 7]]}},
 {t:"第四百九十一歩 延長をお願いする",d:"上司に締め切りの延長を頼む",p:[
  ["p3921", "Could I ask for a short extension?", "少し延長をお願いできますか？"],["p3922", "I underestimated the workload.", "作業量を見誤っていました。"],["p3923", "The data came in late.", "データが届くのが遅れました。"],["p3924", "I'd rather not rush it.", "急いで質を落としたくないんです。"],["p3925", "Would Thursday be acceptable?", "木曜日でもよろしいでしょうか？"],["p3926", "I can send a draft today.", "今日、下書きをお送りできます。"],["p3927", "I'll make sure it's worth the wait.", "待っていただく価値のあるものにします。"],["p3928", "I apologize for the inconvenience.", "ご迷惑をおかけして申し訳ありません。"]],
  r:[["Is the report still on schedule?", 0],["Were you waiting on someone else?", 2],["When can you realistically deliver it?", 4]],
  c:{sit:"上司に報告書の締め切りを延ばしてもらえないか相談する",t:[["Can I at least see something now?", 5],["You know this delays the whole team.", 7],["Why not just finish it quickly?", 3]]}},
 {t:"第四百九十二歩 年次面談",d:"上司と一年の評価と目標を話す",p:[
  ["p3929", "Thanks for making time for this.", "時間を取っていただきありがとうございます。"],["p3930", "I'm proud of what I achieved.", "達成できたことを誇りに思っています。"],["p3931", "Where do you think I can improve?", "どこを改善できると思いますか？"],["p3932", "That's fair feedback.", "もっともなご指摘です。"],["p3933", "I'd like to take on more responsibility.", "もっと責任のある仕事を担いたいです。"],["p3934", "Could I get some leadership training?", "リーダー研修を受けられますか？"],["p3935", "Let's set clear goals for next year.", "来年の目標を明確にしましょう。"],["p3936", "I appreciate your honest feedback.", "率直なご意見に感謝します。"]],
  r:[["You sometimes miss small details. Do you agree?", 3],["What are your ambitions for next year?", 4],["Shall we talk about targets now?", 6]],
  c:{sit:"年に一度の評価面談で、上司と成果と今後を話し合う",t:[["So how do you feel about this year?", 1],["Is there any support you need?", 5],["Anything you'd like to ask me?", 2]]}},
 {t:"第四百九十三歩 新入社員の案内役",d:"入社したばかりの同僚を案内する",p:[
  ["p3937", "Welcome aboard, it's great to have you.", "ようこそ、来てくれてうれしいです。"],["p3938", "I'll be your buddy this month.", "今月は私があなたのサポート役です。"],["p3939", "Let me show you around.", "社内を案内しますね。"],["p3940", "This is where we keep supplies.", "ここに備品が置いてあります。"],["p3941", "Your laptop should be ready today.", "パソコンは今日中に用意できるはずです。"],["p3942", "Don't worry about remembering everyone's names.", "全員の名前を覚えなくても大丈夫ですよ。"],["p3943", "There's no such thing as a dumb question.", "ばかな質問なんてありませんよ。"],["p3944", "Let's grab lunch together.", "いっしょにランチに行きましょう。"]],
  r:[["Hi, I'm the new hire. Today's my first day.", 0],["Where can I find pens and notebooks?", 3],["Sorry, I keep asking basic things.", 6]],
  c:{sit:"入社初日の新入社員を、案内役として社内に迎える",t:[["I don't even know where anything is.", 2],["When will I get a computer?", 4],["So many new faces today!", 5]]}},
 {t:"第四百九十四歩 取引先との会食",d:"取引先を夕食に招いてもてなす",p:[
  ["p3945", "Thank you for joining us tonight.", "今夜はお越しいただきありがとうございます。"],["p3946", "Please order whatever you like.", "何でもお好きなものを頼んでください。"],["p3947", "The fish here is excellent.", "ここの魚料理は絶品です。"],["p3948", "How was your flight over?", "こちらへのフライトはいかがでしたか？"],["p3949", "Let's not talk shop all night.", "一晩じゅう仕事の話をするのはやめましょう。"],["p3950", "Here's to a great partnership.", "素晴らしいパートナーシップに乾杯。"],["p3951", "We really value your business.", "御社とのお取引を本当に大切に思っています。"],["p3952", "Let me take care of the check.", "お会計は私が持ちます。"]],
  r:[["What would you recommend here?", 2],["Shall we raise our glasses?", 5],["Please, let me pay for dinner.", 7]],
  c:{sit:"出張で来た取引先を夕食に招いてもてなす",t:[["I don't want to order anything too pricey.", 1],["I just landed this afternoon, actually.", 3],["So, about the contract terms...", 4]]}},
 {t:"第四百九十五歩 カンファレンスの雑談",d:"業界イベントで初対面の人と話す",p:[
  ["p3953", "Mind if I join you?", "ご一緒してもいいですか？"],["p3954", "What brings you to the conference?", "このカンファレンスにはどういうご用で？"],["p3955", "Which talk did you enjoy most?", "どの講演が一番良かったですか？"],["p3956", "We're in the same industry, then.", "では同じ業界ですね。"],["p3957", "I'd love to hear more about that.", "その話、もっと聞きたいです。"],["p3958", "Are you on LinkedIn?", "LinkedInはやっていますか？"],["p3959", "Let's stay in touch.", "連絡を取り合いましょう。"],["p3960", "I'll let you get back to it.", "それではこの辺で失礼しますね。"]],
  r:[["Lots of interesting speakers this year.", 2],["We make software for hospitals.", 4],["Here's my card.", 6]],
  c:{sit:"業界カンファレンスの休憩中に、初対面の参加者と話す",t:[["I'm in logistics, too.", 3],["I should head to my next session.", 6],["How can I find you online later?", 5]]}},
 {t:"第四百九十六歩 やんわり催促",d:"返事のない相手に丁寧に催促する",p:[
  ["p3961", "Just following up on my email.", "先日のメールの件でご連絡しました。"],["p3962", "I wanted to check in on this.", "この件の状況を確認したくて。"],["p3963", "I know you're very busy.", "お忙しいのは承知しています。"],["p3964", "Did you get a chance to review it?", "ご確認いただけましたか？"],["p3965", "We need an answer by Friday.", "金曜日までにお返事が必要です。"],["p3966", "Is anything holding it up?", "何か支障になっていることはありますか？"],["p3967", "Happy to jump on a quick call.", "よければ手短に電話でお話しします。"],["p3968", "Thanks in advance for your help.", "どうぞよろしくお願いいたします。"]],
  r:[["It's been a crazy week here.", 2],["It's easier to talk than to write.", 6],["When do you need my answer?", 4]],
  c:{sit:"返事が来ない取引先に、電話で丁寧に確認を入れる",t:[["Hello, this is Mark speaking.", 0],["We're still deciding internally.", 5],["I'll get back to you soon.", 7]]}},
 {t:"第四百九十七歩 プロジェクト始動",d:"キックオフ会議で方向性をそろえる",p:[
  ["p3969", "Welcome to the kickoff meeting.", "キックオフ会議へようこそ。"],["p3970", "Let's align on our goals.", "目標をすり合わせましょう。"],["p3971", "Here's the big picture.", "全体像はこうです。"],["p3972", "Each of you has a key role.", "皆さん一人ひとりに重要な役割があります。"],["p3973", "We launch in early spring.", "春の初めにリリースします。"],["p3974", "Let's flag risks early.", "リスクは早めに共有しましょう。"],["p3975", "We'll meet every Monday morning.", "毎週月曜の朝に集まります。"],["p3976", "I'm excited to work with you all.", "皆さんと働けるのが楽しみです。"]],
  r:[["When is the target launch date?", 4],["How often will we sync?", 6],["What if something goes wrong?", 5]],
  c:{sit:"新プロジェクトのキックオフ会議でメンバーに方針を伝える",t:[["Can you give us an overview first?", 2],["Does everyone here have a part to play?", 3],["This is going to be a fun project.", 7]]}},
 {t:"第四百九十八歩 納期の危機",d:"納期に間に合わないとわかったときの対応",p:[
  ["p3977", "We have a serious problem.", "深刻な問題が起きました。"],["p3978", "We're not going to hit the deadline.", "締め切りに間に合いそうにありません。"],["p3979", "Let's focus on what matters most.", "一番大事なことに集中しましょう。"],["p3980", "Can we cut this feature for now?", "この機能はいったん外せますか？"],["p3981", "I'll talk to the client myself.", "お客様には私から話します。"],["p3982", "It's all hands on deck.", "全員総出で取りかかりましょう。"],["p3983", "Let's regroup at five.", "五時に集まって立て直しましょう。"],["p3984", "No blame, just solutions.", "責めるのではなく、解決策を考えよう。"]],
  r:[["What's wrong? You look pale.", 0],["Who's going to tell the client?", 4],["We can't ship everything in time.", 3]],
  c:{sit:"納期に間に合わないことがわかり、チームで立て直しを図る",t:[["How bad is the delay, honestly?", 1],["This was Tom's mistake, you know.", 7],["When should we meet again?", 6]]}},
 {t:"第四百九十九歩 チームの成功を祝う",d:"大型契約をチームで祝う",p:[
  ["p3985", "We did it, everyone!", "みんな、やったね！"],["p3986", "This was a true team effort.", "本当にチーム全員の力でした。"],["p3987", "I couldn't be prouder of you.", "これ以上ないほど誇りに思います。"],["p3988", "The client signed the contract.", "お客様が契約にサインしました。"],["p3989", "Drinks are on me tonight.", "今夜の飲み代は私のおごりです。"],["p3990", "Let's take a moment to celebrate.", "少しお祝いの時間を取りましょう。"],["p3991", "Special thanks to the design team.", "デザインチームには特に感謝します。"],["p3992", "This sets us up for next year.", "これで来年への弾みがつきます。"]],
  r:[["So, did we get the deal?", 3],["Are we going out for drinks after work?", 4],["Who deserves the most credit?", 1]],
  c:{sit:"大型契約が決まり、チームで成功を祝う",t:[["The client just called. It's official!", 0],["The designers worked so hard on this.", 6],["What does this mean for the future?", 7]]}},
 {t:"第五百歩 五百の歩み",d:"五百歩目の節目を祝う",p:[
  ["p3993", "Five hundred steps, can you believe it?", "五百歩だよ、信じられる？"],["p3994", "Every step really added up.", "一歩一歩が確かに積み重なった。"],["p3995", "I remember being so nervous at first.", "最初はすごく緊張していたのを覚えてる。"],["p3996", "Now I speak up in meetings.", "今では会議で発言できる。"],["p3997", "Mistakes were part of the journey.", "失敗も道のりの一部だった。"],["p3998", "I'm proud of how far I've come.", "ここまで来た自分を誇りに思う。"],["p3999", "Thank you for walking with me.", "いっしょに歩いてくれてありがとう。"],["p4000", "Here's to the next five hundred!", "次の五百歩に乾杯！"]],
  r:[["What milestone are we celebrating today?", 0],["Do you still get nervous speaking up?", 3],["Shall we make a toast?", 7]],
  c:{sit:"英語学習の五百歩目を、ずっと支えてくれた仲間と祝う",t:[["Do you remember your very first day?", 2],["I've always been right here with you.", 6],["You've changed so much since then.", 5]]}},
 {t:"第五百一歩 悪い知らせを上司に",d:"上司に悪い知らせを自分から伝える",p:[
  ["p4001", "Do you have a minute?", "少しお時間いいですか？"],["p4002", "I'm afraid I have bad news.", "残念ながら悪い知らせがあります。"],["p4003", "The supplier just pulled out.", "仕入れ先が手を引いてしまいました。"],["p4004", "I wanted you to hear it from me.", "私の口から先にお伝えしたかったんです。"],["p4005", "Here's what I've done so far.", "これまでに打った手はこうです。"],["p4006", "I have a backup plan.", "代わりの案があります。"],["p4007", "It could delay us by a week.", "一週間遅れる可能性があります。"],["p4008", "I'll keep you posted.", "随時ご報告します。"]],
  r:[["Sure, come in. What's up?", 1],["How much will this set us back?", 6],["Do we have any other options?", 5]],
  c:{sit:"問題が起きたことを、上司に自分から報告しに行く",t:[["You look worried. What happened?", 2],["Does anyone else know about this yet?", 3],["Let me know how it develops.", 7]]}},
 {t:"第五百二歩 他部署に協力を頼む",d:"別の部署にデータ提供をお願いする",p:[
  ["p4009", "I need a favor from your team.", "あなたのチームにお願いがあります。"],["p4010", "We're putting together a customer report.", "お客様向けの報告書をまとめています。"],["p4011", "Could you share last month's sales data?", "先月の売上データを共有してもらえますか？"],["p4012", "I know it's not your priority.", "そちらの優先事項ではないのは承知しています。"],["p4013", "It would save us days of work.", "それで何日分もの作業が省けます。"],["p4014", "Happy to return the favor.", "このお返しは必ずします。"],["p4015", "Who's the best person to ask?", "誰に聞くのが一番いいですか？"],["p4016", "Would end of week work?", "週末まででも大丈夫ですか？"]],
  r:[["What exactly do you need from us?", 2],["We're swamped with our own projects.", 3],["When do you need it by?", 7]],
  c:{sit:"他部署の担当者に、データ提供への協力をお願いする",t:[["Sure. What's the data for?", 1],["I'm not sure I'm the right contact.", 6],["That's a lot to ask, you know.", 5]]}},
 {t:"第五百三歩 画面共有でデモ",d:"オンライン商談で製品を実演する",p:[
  ["p4017", "Can everyone see my screen?", "皆さん画面は見えていますか？"],["p4018", "Let me walk you through it.", "順を追ってご説明します。"],["p4019", "This dashboard updates in real time.", "このダッシュボードはリアルタイムで更新されます。"],["p4020", "Feel free to stop me anytime.", "いつでも遠慮なく止めてください。"],["p4021", "Let me zoom in a bit.", "少し拡大しますね。"],["p4022", "That's exactly what this solves.", "まさにそれをこれが解決します。"],["p4023", "I'll send you the recording.", "録画をお送りします。"],["p4024", "Shall we book a follow-up call?", "次回の打ち合わせを決めましょうか？"]],
  r:[["Yes, your screen is up now.", 1],["The text is a little small.", 4],["Our team keeps losing track of orders.", 5]],
  c:{sit:"オンライン会議で、見込み客に自社ツールのデモを見せる",t:[["Okay, I think you're sharing now.", 0],["Some of my colleagues missed this.", 6],["I'd like to see more next week.", 7]]}},
 {t:"第五百四歩 予算の承認を得る",d:"部長に追加予算の承認をお願いする",p:[
  ["p4025", "I'm requesting additional budget.", "追加予算をお願いしたいです。"],["p4026", "It pays for itself within a year.", "一年以内に元が取れます。"],["p4027", "Here's the cost breakdown.", "費用の内訳はこちらです。"],["p4028", "We've already cut where we could.", "削れるところはすでに削りました。"],["p4029", "The risk of waiting is higher.", "待つほうがリスクは高いです。"],["p4030", "We could start with a pilot.", "まず試験導入から始められます。"],["p4031", "Can I count on your support?", "ご支援をいただけますか？"],["p4032", "What would it take to approve this?", "承認には何が必要でしょうか？"]],
  r:[["That's a lot of money.", 1],["Where does all this money go?", 2],["Why not just wait until next year?", 4]],
  c:{sit:"部長に、新しいツール導入のための予算承認を求める",t:[["Can't you reduce the cost at all?", 3],["It's too big a commitment right now.", 5],["I'm not convinced yet.", 7]]}},
 {t:"第五百五歩 再発防止を説明する",d:"トラブルの原因と対策を説明する",p:[
  ["p4033", "I take full responsibility.", "全責任は私にあります。"],["p4034", "Here's what went wrong.", "何が問題だったかご説明します。"],["p4035", "It was a process issue.", "手順の問題でした。"],["p4036", "We've put new checks in place.", "新しい確認体制を導入しました。"],["p4037", "We'll prevent this from happening again.", "再発は必ず防ぎます。"],["p4038", "We've already informed affected customers.", "影響を受けたお客様にはすでにお知らせしました。"],["p4039", "We'll review it again next month.", "来月もう一度見直します。"],["p4040", "We've learned a lot from this.", "今回のことから多くを学びました。"]],
  r:[["Whose fault was this, exactly?", 0],["Can you be sure this is fixed?", 3],["Do the customers know about it?", 5]],
  c:{sit:"システム障害のあと、関係者に原因と対策を説明する",t:[["So what actually happened?", 1],["Was someone careless?", 2],["Will this happen again?", 4]]}},
 {t:"第五百六歩 結末は言わずに薦める",d:"結末を明かさずに小説を薦める",p:[
  ["p4041", "I'll avoid any spoilers.", "ネタバレはしないようにするね。"],["p4042", "The first chapter hooks you instantly.", "第一章でいきなり引き込まれるよ。"],["p4043", "The narrator isn't entirely reliable.", "語り手は完全には信用できないんだ。"],["p4044", "It's slow at first, but stick with it.", "最初はゆっくりだけど、読み続けて。"],["p4045", "The ending completely reframes everything.", "結末ですべての見え方が変わるよ。"],["p4046", "I couldn't put it down.", "読み始めたら止まらなかった。"],["p4047", "You'd love the main character.", "主人公をきっと気に入るよ。"],["p4048", "I'll lend you my copy.", "私の本を貸すよ。"]],
  r:[["Don't tell me how it ends!", 0],["I almost quit after a few pages.", 3],["Do you have it at home?", 7]],
  c:{sit:"友人に、結末を明かさずにお気に入りの小説を薦める",t:[["Did you finish it quickly?", 5],["Can you trust whoever's telling the story?", 2],["Will I like the main character?", 6]]}},
 {t:"第五百七歩 期待外れの映画",d:"評判の映画が好みでなかった感想を伝える",p:[
  ["p4049", "It didn't live up to the hype.", "評判ほどではなかった。"],["p4050", "The plot was all over the place.", "話があちこちに飛んでいた。"],["p4051", "The visuals were stunning, though.", "映像は見事だったけどね。"],["p4052", "It dragged in the middle.", "中盤がだらだらしていた。"],["p4053", "The dialogue felt forced.", "セリフが不自然に感じた。"],["p4054", "I just couldn't connect with anyone.", "誰にも感情移入できなかった。"],["p4055", "Maybe I had the wrong expectations.", "期待の仕方がまちがっていたのかも。"],["p4056", "I'd wait for it to stream.", "配信を待てばいいと思う。"]],
  r:[["Everyone says it's a masterpiece.", 0],["Was anything about it good?", 2],["Should I see it in theaters?", 7]],
  c:{sit:"話題作の映画を観たが、好みではなかった感想を友人に伝える",t:[["Was the story easy to follow?", 1],["Did you care about the characters?", 5],["How was the pacing?", 3]]}},
 {t:"第五百八歩 一枚の絵の前で",d:"美術館で一枚の絵について語り合う",p:[
  ["p4057", "Look at how the light falls.", "光の当たり方を見て。"],["p4058", "The brushwork is so loose.", "筆づかいがすごく自由だね。"],["p4059", "Her expression is hard to read.", "彼女の表情は読み取りにくい。"],["p4060", "It feels almost melancholy.", "どこか物悲しい感じがする。"],["p4061", "The colors pull you in.", "色に引き込まれる。"],["p4062", "I wonder what she's thinking.", "彼女は何を考えているんだろう。"],["p4063", "Let's step back a little.", "少し下がって見よう。"],["p4064", "It's smaller than I expected.", "思っていたより小さいね。"]],
  r:[["We're standing way too close.", 6],["What mood do you get from it?", 3],["I thought it would be huge.", 7]],
  c:{sit:"美術館で有名な肖像画をじっくり鑑賞する",t:[["The light from that window is beautiful.", 0],["The strokes look almost unfinished up close.", 1],["She seems lost in thought.", 5]]}},
 {t:"第五百九歩 大人のピアノ入門",d:"大人になってから始めたピアノの話をする",p:[
  ["p4065", "I finally started piano lessons.", "ついにピアノのレッスンを始めたの。"],["p4066", "My fingers just don't cooperate.", "指が思うように動かない。"],["p4067", "I practice for twenty minutes daily.", "毎日二十分練習しているよ。"],["p4068", "Reading music is the hardest part.", "楽譜を読むのが一番難しい。"],["p4069", "My teacher is incredibly patient.", "先生がとても辛抱強いの。"],["p4070", "It's never too late to start.", "始めるのに遅すぎることはない。"],["p4071", "I'm working on a simple waltz.", "簡単なワルツを練習中なんだ。"],["p4072", "Don't expect a concert anytime soon.", "当分演奏会は期待しないでね。"]],
  r:[["Aren't you a bit old to begin?", 5],["How often do you play?", 2],["Can I hear you play sometime?", 7]],
  c:{sit:"大人になってから習い始めたピアノについて友人に話す",t:[["Can you read the notes yet?", 3],["What piece are you learning?", 6],["Is your instructor strict?", 4]]}},
 {t:"第五百十歩 写真の腕を上げる",d:"写真がうまくなるコツを教える",p:[
  ["p4073", "Shoot during the golden hour.", "朝夕の光がやわらかい時間に撮って。"],["p4074", "Put your subject off-center.", "被写体を中心からずらして。"],["p4075", "Get down to their eye level.", "相手の目線の高さまで下がって。"],["p4076", "Turn off the flash indoors.", "室内ではフラッシュを切って。"],["p4077", "Don't zoom, just walk closer.", "ズームせずに近づいて。"],["p4078", "Keep the horizon straight.", "水平線をまっすぐに。"],["p4079", "Take more shots than you need.", "必要以上にたくさん撮って。"],["p4080", "Editing makes a huge difference.", "編集で大きく変わるよ。"]],
  r:[["I always shoot my cat from above.", 2],["The light at noon is so harsh.", 0],["My beach photos look tilted.", 5]],
  c:{sit:"写真が上手な友人として、撮り方のコツを教える",t:[["Everything I shoot looks too centered.", 1],["My indoor shots look washed out and harsh.", 3],["I only take one photo of each thing.", 6]]}},
 {t:"第五百十一歩 歴史博物館をめぐる",d:"歴史博物館で展示を見ながら話す",p:[
  ["p4081", "This dates back to the Edo period.", "これは江戸時代までさかのぼる。"],["p4082", "It's remarkably well preserved.", "驚くほど保存状態がいい。"],["p4083", "Imagine using this every day.", "これを毎日使うところを想像してみて。"],["p4084", "The audio guide explains it well.", "音声ガイドの説明がわかりやすい。"],["p4085", "Is that the original or a replica?", "それは本物？複製？"],["p4086", "History class never felt like this.", "歴史の授業はこんなふうじゃなかった。"],["p4087", "Let's check the map for the next wing.", "次の展示棟を地図で確認しよう。"],["p4088", "I could spend all day here.", "ここなら一日中いられる。"]],
  r:[["How old is this sword?", 0],["It looks almost brand new.", 1],["Are you getting tired yet?", 7]],
  c:{sit:"歴史博物館で友人と展示を見て回る",t:[["Did you rent the headphones?", 3],["School made history so boring.", 5],["Where do we go after this room?", 6]]}},
 {t:"第五百十二歩 科学ニュースをかみくだく",d:"話題の科学ニュースをわかりやすく説明する",p:[
  ["p4089", "Let me put it simply.", "簡単に言うとね。"],["p4090", "Scientists found water on a distant planet.", "科学者が遠くの惑星で水を見つけたの。"],["p4091", "Think of it like a sponge.", "スポンジみたいなものだと思って。"],["p4092", "It doesn't mean there's life.", "生命がいるという意味じゃないよ。"],["p4093", "It's still an early finding.", "まだ初期段階の発見なんだ。"],["p4094", "Other teams need to confirm it.", "他の研究チームが確かめる必要がある。"],["p4095", "The headline oversimplified it.", "見出しは単純化しすぎていた。"],["p4096", "That's what makes it exciting.", "そこがわくわくするところなんだ。"]],
  r:[["So, aliens exist now?", 3],["That sounds way too technical.", 0],["Who checks if it's right?", 5]],
  c:{sit:"話題の科学ニュースを友人にわかりやすく説明する",t:[["What was the big news today?", 1],["How can rock hold water?", 2],["The article said everything had changed.", 6]]}},
 {t:"第五百十三歩 使い捨てを減らす暮らし",d:"環境に配慮した暮らしの工夫を話す",p:[
  ["p4097", "I've cut out single-use plastic.", "使い捨てプラスチックをやめたの。"],["p4098", "I carry my own bottle everywhere.", "どこでも自分のボトルを持ち歩いてる。"],["p4099", "Small changes add up.", "小さな変化が積み重なるんだ。"],["p4100", "I buy secondhand clothes now.", "今は古着を買ってる。"],["p4101", "Composting was easier than I thought.", "堆肥づくりは思ったより簡単だった。"],["p4102", "I'm not perfect about it.", "完璧にできてるわけじゃないよ。"],["p4103", "It actually saves me money.", "実はお金の節約にもなるの。"],["p4104", "I'm not trying to preach.", "説教するつもりはないよ。"]],
  r:[["Does one person really make a difference?", 2],["Isn't it expensive to live green?", 6],["So you never use plastic at all?", 5]],
  c:{sit:"環境に配慮した暮らしの工夫について友人と話す",t:[["What do you do with food scraps?", 4],["Where'd you get that vintage jacket?", 3],["Are you judging my paper coffee cup?", 7]]}},
 {t:"第五百十四歩 職場でAIを使う",d:"仕事でのAIツールの使い方を同僚と話す",p:[
  ["p4105", "I use it for first drafts.", "下書きに使ってる。"],["p4106", "It saves me hours each week.", "毎週何時間も節約できる。"],["p4107", "I always double-check the facts.", "事実関係は必ず確認する。"],["p4108", "It's a tool, not a replacement.", "道具であって代わりではない。"],["p4109", "Never paste confidential data into it.", "機密データは絶対に貼りつけないで。"],["p4110", "It's great for summarizing long reports.", "長い報告書の要約に便利。"],["p4111", "The output still needs a human touch.", "出力にはまだ人の手が必要。"],["p4112", "Our team set clear guidelines.", "チームで明確なルールを決めた。"]],
  r:[["Can I trust everything it says?", 2],["Will it take our jobs?", 3],["Is it okay to upload client files?", 4]],
  c:{sit:"同僚と、仕事でのAIツールの使い方について話す",t:[["How do you start a big document?", 0],["Is it actually worth the time?", 1],["Can I just send what it writes?", 6]]}},
 {t:"第五百十五歩 焼き目のつけ方",d:"肉に香ばしい焼き目をつけるコツを教える",p:[
  ["p4113", "Pat the meat dry first.", "まず肉の水気をふき取って。"],["p4114", "Get the pan really hot.", "フライパンをしっかり熱して。"],["p4115", "Don't crowd the pan.", "フライパンに詰め込まないで。"],["p4116", "Leave it alone for a minute.", "少しの間さわらないで。"],["p4117", "It'll release when it's ready.", "焼ければ自然にはがれるよ。"],["p4118", "Let it rest before slicing.", "切る前に休ませて。"],["p4119", "That crust is where the flavor is.", "その焼き目が味の決め手。"],["p4120", "Season it more than you think.", "思ったより多めに味つけして。"]],
  r:[["Can I cook all the steaks at once?", 2],["It's stuck to the pan!", 4],["Can I cut it right away?", 5]],
  c:{sit:"友人にステーキに香ばしい焼き目をつけるコツを教える",t:[["Should I keep flipping it?", 3],["The steak is still wet from the package.", 0],["Should I add the meat to a cold pan?", 1]]}},
 {t:"第五百十六歩 将棋の感想戦",d:"対局のあと、一局をふり返る",p:[
  ["p4121", "That was a close game.", "接戦だったね。"],["p4122", "I didn't see that move coming.", "あの手は読めなかった。"],["p4123", "Where did I go wrong?", "どこで間違えたんだろう。"],["p4124", "You were too aggressive early on.", "序盤で攻めすぎたね。"],["p4125", "Your defense was rock solid.", "守りがかたかったよ。"],["p4126", "I was in time trouble.", "時間が足りなくなってた。"],["p4127", "Let's replay the last few moves.", "最後の数手を並べ直そう。"],["p4128", "Rematch next weekend?", "来週末に再戦する？"]],
  r:[["You rushed your last moves.", 5],["I almost had you there.", 0],["I'm not done with you yet.", 7]],
  c:{sit:"将棋の対局を終えて、相手と一局をふり返る",t:[["I could barely hold off your attack.", 4],["Did that bishop drop surprise you?", 1],["Want to figure out your losing move?", 2]]}},
 {t:"第五百十七歩 野鳥観察デビュー",d:"早朝の公園で初めて野鳥観察をする",p:[
  ["p4129", "Keep your voice down.", "声を落として。"],["p4130", "There, on the lowest branch.", "ほら、一番下の枝。"],["p4131", "Can I borrow your binoculars?", "双眼鏡を借りていい？"],["p4132", "I hear it but can't spot it.", "声はするけど見つけられない。"],["p4133", "That's a kingfisher, I think.", "あれはカワセミだと思う。"],["p4134", "Let me check the field guide.", "図鑑で確かめさせて。"],["p4135", "Early morning is the best time.", "早朝が一番いい時間。"],["p4136", "I'm adding it to my list.", "記録リストに加えるね。"]],
  r:[["Where is it? I don't see it.", 1],["What kind of bird is that?", 4],["Why did we have to come so early?", 6]],
  c:{sit:"早朝の公園で、友人と初めて野鳥観察をする",t:[["Is that a new species for you?", 7],["Are you sure what it is?", 5],["Listen, that call is beautiful.", 3]]}},
 {t:"第五百十八歩 望遠鏡をのぞく",d:"天体望遠鏡で星空を観察する",p:[
  ["p4137", "Let your eyes adjust first.", "まず目を暗さに慣らして。"],["p4138", "You can see Saturn's rings.", "土星の輪が見えるよ。"],["p4139", "Hold still while I focus.", "ピントを合わせるから動かないで。"],["p4140", "That bright one is Jupiter.", "あの明るいのは木星。"],["p4141", "There's a satellite passing over.", "人工衛星が通っていく。"],["p4142", "That starlight is thousands of years old.", "その星の光は何千年も前のものだよ。"],["p4143", "It makes me feel tiny.", "自分がちっぽけに感じる。"],["p4144", "Clear nights like this are rare.", "こんな晴れた夜はめったにない。"]],
  r:[["I can't see anything at all.", 0],["Is that star moving?", 4],["What's so special about Saturn?", 1]],
  c:{sit:"夜の公園で天体望遠鏡を使って星を見る",t:[["The image is all blurry.", 2],["Which planet is that shining one?", 3],["We're so lucky with the weather.", 7]]}},
 {t:"第五百十九歩 言語交換の集い",d:"言語交換会で初対面の相手と話す",p:[
  ["p4145", "Shall we switch languages halfway?", "途中で言語を交代しない？"],["p4146", "Feel free to correct me.", "遠慮なく直してね。"],["p4147", "How do you say that naturally?", "それを自然に言うには？"],["p4148", "Your Japanese is really fluent.", "日本語、本当に流暢だね。"],["p4149", "I'm still working on my listening.", "リスニングはまだ練習中。"],["p4150", "Could you slow down a bit?", "もう少しゆっくり話してもらえる？"],["p4151", "That's a useful expression.", "便利な表現だね。"],["p4152", "Let's swap contacts and practice again.", "連絡先を交換してまた練習しよう。"]],
  r:[["Should I fix your mistakes?", 1],["How should we split our time?", 0],["Same time next week?", 7]],
  c:{sit:"言語交換会で、初めて会った相手と練習する",t:[["Sorry, am I talking too fast?", 5],["That phrase sounds a bit stiff in English.", 2],["I've lived in Osaka for years.", 3]]}},
 {t:"第五百二十歩 ドキュメンタリーを語る",d:"観たドキュメンタリーについて話し合う",p:[
  ["p4153", "It really changed my perspective.", "見方が本当に変わった。"],["p4154", "The footage was incredible.", "映像がすごかった。"],["p4155", "It felt a bit one-sided.", "少し一方的に感じた。"],["p4156", "The narration was a bit dramatic.", "ナレーションが少し大げさだった。"],["p4157", "I read up on it afterward.", "後で自分でもっと調べた。"],["p4158", "It left me with questions.", "疑問が残った。"],["p4159", "Everyone should watch it.", "みんな観るべきだよ。"],["p4160", "Was it accurate, though?", "でも正確だったのかな。"]],
  r:[["Did it make you think differently?", 0],["Was it fair to everyone?", 2],["Did you do any research after?", 4]],
  c:{sit:"話題のドキュメンタリーを観た友人と感想を話し合う",t:[["How were the visuals?", 1],["Would you recommend it to others?", 6],["Did it answer everything?", 5]]}},
 {t:"第五百二十一歩 パブのクイズナイト",d:"パブのクイズ大会にチームで参加する",p:[
  ["p4161", "Let's come up with a team name.", "チーム名を考えよう。"],["p4162", "It's on the tip of my tongue.", "のどまで出かかってる。"],["p4163", "Trust me, I know this one.", "任せて、これはわかる。"],["p4164", "Just write something down.", "とりあえず何か書いて。"],["p4165", "We're only two points behind.", "たった二点差だよ。"],["p4166", "History is my strong suit.", "歴史は得意分野なんだ。"],["p4167", "I should've gone with my gut.", "直感に従えばよかった。"],["p4168", "Same team next month?", "来月も同じチームで？"]],
  r:[["Should we leave this one blank?", 3],["How far behind are we?", 4],["Your first answer was right!", 6]],
  c:{sit:"パブのクイズ大会に友人とチームで参加する",t:[["The host needs our name now.", 0],["Next round is all about the past.", 5],["That was fun. Let's do it again.", 7]]}},
 {t:"第五百二十二歩 クロスワードの習慣",d:"毎朝のクロスワードの習慣について話す",p:[
  ["p4169", "I do one every morning.", "毎朝一つ解いてるの。"],["p4170", "It's like coffee for my brain.", "脳にとってのコーヒーみたいなもの。"],["p4171", "I'm stuck on this clue.", "このヒントで行き詰まってる。"],["p4172", "Seven letters, starts with B.", "七文字で、Bで始まる。"],["p4173", "Wait, that fits perfectly!", "待って、ぴったり当てはまる！"],["p4174", "I refuse to look up answers.", "答えを調べるのは絶対いや。"],["p4175", "The weekend ones are brutal.", "週末のは鬼のように難しい。"],["p4176", "I learn so many new words.", "新しい単語をたくさん覚えるよ。"]],
  r:[["Why not just search online?", 5],["Need some help?", 2],["Does it help your vocabulary?", 7]],
  c:{sit:"毎朝のクロスワードパズルの習慣について話す",t:[["How often do you do these?", 0],["How long is the word?", 3],["Is Sunday's puzzle harder?", 6]]}},
 {t:"第五百二十三歩 感謝日記をつける",d:"寝る前に感謝日記を書く習慣を話す",p:[
  ["p4177", "I write three good things nightly.", "毎晩よかったことを三つ書くの。"],["p4178", "It only takes five minutes.", "たった五分で終わる。"],["p4179", "It helps me sleep better.", "よく眠れるようになる。"],["p4180", "Some days it's just my coffee.", "コーヒーのことだけの日もある。"],["p4181", "I notice small things more now.", "小さなことに気づくようになった。"],["p4182", "Sometimes I read my old entries again.", "時々昔のページを読み返す。"],["p4183", "It's private, not for anyone else.", "人に見せるものじゃないの。"],["p4184", "You should give it a try.", "やってみるといいよ。"]],
  r:[["What if nothing good happened?", 3],["I'm too busy for that.", 1],["Can I see what you wrote?", 6]],
  c:{sit:"寝る前に感謝日記を書く習慣を友人に話す",t:[["Has it changed how you see things?", 4],["Do you ever look back at it?", 5],["Does it affect your sleep?", 2]]}},
 {t:"第五百二十四歩 はじめてのオーケストラ",d:"クラシックの演奏会に初めて行く",p:[
  ["p4185", "Don't clap between movements.", "楽章の間は拍手しないで。"],["p4186", "The strings gave me chills.", "弦楽器に鳥肌が立った。"],["p4187", "I didn't know the piece.", "知らない曲だった。"],["p4188", "The conductor was so expressive.", "指揮者の表現力がすごかった。"],["p4189", "The second half flew by.", "後半はあっという間だった。"],["p4190", "I almost dozed off once.", "一度うとうとしかけた。"],["p4191", "Live sound is completely different.", "生の音はまるで違う。"],["p4192", "Let's grab a drink and talk.", "一杯飲みながら話そう。"]],
  r:[["When am I allowed to applaud?", 0],["Did you ever get bored?", 5],["Why not just listen at home?", 6]],
  c:{sit:"初めてクラシックの演奏会に行き、終演後に感想を話す",t:[["Which part moved you most?", 1],["Had you heard it before?", 2],["Did you watch the man with the baton?", 3]]}},
 {t:"第五百二十五歩 俳句を英語で紹介する",d:"外国の友人に俳句の魅力を説明する",p:[
  ["p4193", "It's a very short poem.", "とても短い詩なの。"],["p4194", "It follows a five-seven-five rhythm.", "五・七・五のリズムなんだ。"],["p4195", "It usually includes a seasonal word.", "たいてい季語が入るよ。"],["p4196", "It captures a single moment.", "一瞬をとらえるんだ。"],["p4197", "What's left unsaid matters most.", "言わないことが一番大事なの。"],["p4198", "Translation loses some of the sound.", "翻訳すると音の響きが少し失われる。"],["p4199", "Basho is the most famous haiku poet.", "芭蕉が一番有名な俳人だよ。"],["p4200", "Want to try writing one?", "一句詠んでみる？"]],
  r:[["How many syllables does it have?", 1],["Why mention autumn leaves?", 2],["Who should I read first?", 6]],
  c:{sit:"外国の友人に俳句の魅力を英語で説明する",t:[["It sounds less magical in English.", 5],["It barely says anything directly.", 4],["Could I make my own?", 7]]}},
 {t:"第五百二十六歩 ふたりで家計簿を組む",d:"パートナーと毎月の予算を一緒に立てる",p:[
  ["p4201", "Let's list our fixed costs first.", "まず固定費を書き出そう。"],["p4202", "Rent and utilities eat up half.", "家賃と光熱費で半分が消えるね。"],["p4203", "We spend way too much eating out.", "外食にお金を使いすぎだね。"],["p4204", "Let's set aside some for savings.", "貯金用に少し取っておこう。"],["p4205", "How about a monthly fun budget?", "月々のお楽しみ予算を作らない？"],["p4206", "We need some wiggle room.", "ある程度の余裕が必要だね。"],["p4207", "Let's track everything in an app.", "全部アプリで記録しよう。"],["p4208", "Let's check in at month's end.", "月末に見直そう。"]],
  r:[["Where should we even begin?", 0],["What if something unexpected comes up?", 5],["How will we know if it's working?", 7]],
  c:{sit:"パートナーと一緒に、毎月の家計の予算を立てる",t:[["I can never keep paper receipts organized.", 6],["Can we still go to concerts sometimes?", 4],["Takeout three nights a week really adds up.", 2]]}},
 {t:"第五百二十七歩 ネットか店頭か",d:"ネットと店頭の値段を比べながら買い物を決める",p:[
  ["p4209", "It's cheaper online, actually.", "実はネットの方が安いよ。"],["p4210", "But shipping isn't included.", "でも送料が含まれていないよ。"],["p4211", "I want to see it in person.", "実物を見てみたい。"],["p4212", "The store might match the price.", "お店が値段を合わせてくれるかも。"],["p4213", "Returns are easier in store.", "返品は店頭の方が簡単だよ。"],["p4214", "Let's read a few reviews first.", "まずレビューをいくつか読もう。"],["p4215", "The price drops every weekend.", "毎週末に値下がりするんだ。"],["p4216", "I'd rather support the local shop.", "地元のお店を応援したいな。"]],
  r:[["What if it doesn't fit right?", 4],["Should we buy it right now?", 6],["Photos can be misleading, though.", 2]],
  c:{sit:"欲しい家電をネットで買うか店で買うか、友人と迷う",t:[["The online deal looks so much better.", 1],["I wonder what other buyers thought of it.", 5],["This little shop has been here for decades.", 7]]}},
 {t:"第五百二十八歩 骨董市をのぞく",d:"週末の骨董市で古い品物を見て回る",p:[
  ["p4217", "This teacup has real character.", "この湯のみ、味があるね。"],["p4218", "How old do you think it is?", "どれくらい古いと思う？"],["p4219", "There's a tiny chip here.", "ここに小さな欠けがあるよ。"],["p4220", "Would you take a little less?", "少しまけてもらえますか。"],["p4221", "I'll take both if that helps.", "よければ両方買います。"],["p4222", "It's one of a kind.", "一点ものだね。"],["p4223", "Let's do one more lap.", "もう一周しよう。"],["p4224", "I'll come back after I look around.", "ひと回りしてから戻ってきます。"]],
  r:[["Is it in good condition?", 2],["I can't go lower for just one.", 4],["Are there others like it?", 5]],
  c:{sit:"週末の骨董市で、古い茶器を見て回る",t:[["Do you want to buy it now?", 7],["That one's three thousand yen.", 3],["Did we see every stall?", 6]]}},
 {t:"第五百二十九歩 出品ページを作る",d:"フリマアプリに不要品を出品する準備をする",p:[
  ["p4225", "Take photos in natural light.", "自然光で写真を撮って。"],["p4226", "Mention every scratch honestly.", "傷はすべて正直に書いて。"],["p4227", "Price it a bit below others.", "他より少し安くしよう。"],["p4228", "Someone already asked for a discount.", "もう値下げ交渉が来たよ。"],["p4229", "I'll ship it tomorrow morning.", "明日の朝に発送するね。"],["p4230", "Bundle the cables with it.", "ケーブルも一緒にまとめて。"],["p4231", "Wrap it well so it arrives safely.", "無事に届くようしっかり包んで。"],["p4232", "It sold within an hour!", "一時間以内に売れた！"]],
  r:[["My pictures look so dark.", 0],["When will the buyer get it?", 4],["How fast did it go?", 7]],
  c:{sit:"フリマアプリに使わなくなったゲーム機を出品する",t:[["Should I hide the little scratches?", 1],["Nobody's clicking on my listing.", 2],["Should I sell the charger separately?", 5]]}},
 {t:"第五百三十歩 賃貸か持ち家か",d:"友人と、賃貸と持ち家のどちらがいいか話し合う",p:[
  ["p4233", "Renting gives you more freedom.", "賃貸の方が自由がきくよ。"],["p4234", "But you're paying someone else's mortgage.", "でも他人のローンを払っているようなものだよ。"],["p4235", "As an owner, you fix everything yourself.", "持ち家だと何でも自分で直すことになる。"],["p4236", "I want to put down roots.", "腰を落ち着けたいんだ。"],["p4237", "I might move for work.", "仕事で引っ越すかもしれない。"],["p4238", "It depends on where you live.", "住む場所によるよね。"],["p4239", "There's no right answer here.", "これに正解はないよ。"],["p4240", "I'd want to talk to an expert.", "専門家に相談したいな。"]],
  r:[["The boiler broke and my landlord fixed it.", 2],["Why do you want to stay flexible?", 4],["So which one is better?", 6]],
  c:{sit:"将来住む家について、賃貸と持ち家のどちらがいいか友人と話す",t:[["Buying in the city costs a fortune.", 5],["What makes owning appeal to you?", 3],["How would you even choose a loan?", 7]]}},
 {t:"第五百三十一歩 デジタルデトックスの週末",d:"週末にスマホやパソコンから離れる計画と感想を話す",p:[
  ["p4241", "I'm going offline this weekend.", "今週末はオフラインになるよ。"],["p4242", "I'll leave my phone in a drawer.", "スマホは引き出しにしまっておく。"],["p4243", "I keep reaching for it out of habit.", "つい癖で手を伸ばしちゃう。"],["p4244", "Call my landline if it's urgent.", "急ぎなら家の電話にかけて。"],["p4245", "I finally read a whole book.", "やっと本を一冊読み切った。"],["p4246", "The silence felt strange at first.", "最初は静けさが変な感じだった。"],["p4247", "I didn't miss social media much.", "SNSはそんなに恋しくなかった。"],["p4248", "I'm doing this once a month.", "これを月に一度やるつもり。"]],
  r:[["What if I need to reach you?", 3],["Was it hard to begin with?", 5],["Will you do it again?", 7]],
  c:{sit:"スマホから離れて過ごした週末について友人と話す",t:[["Where will you put your phone?", 1],["What did you do with all that time?", 4],["Didn't you feel left out online?", 6]]}},
 {t:"第五百三十二歩 寝る前の過ごし方",d:"友人と、ぐっすり眠るための夜の習慣について話す",p:[
  ["p4249", "I put screens away an hour before bed.", "寝る一時間前には画面を見ないようにしてる。"],["p4250", "I keep my bedroom cool and dark.", "寝室は涼しく暗くしてる。"],["p4251", "A warm bath helps me unwind.", "温かいお風呂でリラックスできる。"],["p4252", "I skip coffee after lunch.", "昼食後はコーヒーを飲まないようにしてる。"],["p4253", "I jot down tomorrow's tasks.", "明日のやることをメモしておく。"],["p4254", "Same bedtime, even on weekends.", "週末も同じ時間に寝るの。"],["p4255", "Reading paper books makes me drowsy.", "紙の本を読むと眠くなるの。"],["p4256", "I've been sleeping much more deeply.", "ずっとぐっすり眠れるようになった。"]],
  r:[["Don't you stay up late on Saturdays?", 5],["My mind races about work at night.", 4],["So has any of it helped?", 7]],
  c:{sit:"よく眠るために夜にしていることを友人に話す",t:[["Want an espresso? It's only three o'clock.", 3],["How do you relax after a long day?", 2],["What's your room like at night?", 1]]}},
 {t:"第五百三十三歩 朝のストレッチ",d:"朝のストレッチ習慣を友人に勧める",p:[
  ["p4257", "I stretch for ten minutes every morning.", "毎朝十分ストレッチしてる。"],["p4258", "Start with your neck and shoulders.", "まず首と肩から始めて。"],["p4259", "Breathe slowly as you hold it.", "伸ばしたままゆっくり息をして。"],["p4260", "Don't push past what's comfortable.", "気持ちいい範囲を超えないで。"],["p4261", "I follow a short video.", "短い動画を見ながらやってる。"],["p4262", "My back feels looser all day.", "一日中背中が軽い感じがする。"],["p4263", "Just do it right after waking up.", "起きたらすぐやればいいよ。"],["p4264", "Consistency matters more than length.", "長さより続けることが大事。"]],
  r:[["Should I stretch as far as I can?", 3],["How do you learn the moves?", 4],["Is five minutes even worth it?", 7]],
  c:{sit:"ストレッチを始めたい友人に、朝の習慣を教える",t:[["When's the best time to fit it in?", 6],["What's the very first stretch?", 1],["Have you noticed any difference?", 5]]}},
 {t:"第五百三十四歩 台所を身軽に",d:"物を減らしたミニマルな台所について話す",p:[
  ["p4265", "I only kept one good knife.", "良い包丁を一本だけ残したの。"],["p4266", "Do you really use that gadget?", "その調理器具、本当に使ってる？"],["p4267", "Everything has its own place now.", "今は全部に定位置があるの。"],["p4268", "The counters are completely clear.", "調理台に何も置いてないんだ。"],["p4269", "Cleaning up takes no time.", "片づけがあっという間。"],["p4270", "I donated the duplicate pans.", "重複していた鍋は寄付したよ。"],["p4271", "One in, one out is my rule.", "ひとつ買ったらひとつ手放すのがルール。"],["p4272", "Cooking feels calmer this way.", "この方が落ち着いて料理できる。"]],
  r:[["You had three frying pans, didn't you?", 5],["What if you buy a new mug?", 6],["I just bought an avocado slicer.", 1]],
  c:{sit:"物を減らしてすっきりした台所を友人に見せる",t:[["Where do you keep your spices?", 2],["Your kitchen looks so open now.", 3],["Don't you need a bread knife too?", 0]]}},
 {t:"第五百三十五歩 今夜の残業を断る",d:"上司から頼まれた残業を、やんわりと断る",p:[
  ["p4273", "I'm afraid I can't stay tonight.", "申し訳ないですが今夜は残れません。"],["p4274", "I have a prior commitment.", "先約があるんです。"],["p4275", "I can start on it first thing tomorrow.", "明日朝一番で取りかかれます。"],["p4276", "Could someone else cover it?", "他の方にお願いできますか。"],["p4277", "I'll finish what's most urgent now.", "一番急ぎの分は今終わらせます。"],["p4278", "I've stayed late all week.", "今週はずっと遅くまで残っています。"],["p4279", "Can the deadline move to Friday?", "締め切りを金曜に延ばせますか。"],["p4280", "Thanks for understanding.", "ご理解ありがとうございます。"]],
  r:[["Do you have plans this evening?", 1],["When could you get to it, then?", 2],["All right, go home and rest.", 7]],
  c:{sit:"退社間際に上司から頼まれた残業を丁寧に断る",t:[["I need this report finished tonight.", 0],["You've been working hard lately.", 5],["The client wanted it by Thursday.", 6]]}},
 {t:"第五百三十六歩 押しの強い友人に線を引く",d:"何かと押しの強い友人に、はっきり境界線を伝える",p:[
  ["p4281", "I need to say no this time.", "今回は断らないといけない。"],["p4282", "That doesn't work for me.", "それは私には無理なの。"],["p4283", "Please stop asking about it.", "その件はもう聞かないで。"],["p4284", "I'm not comfortable lending money.", "お金を貸すのは気が進まないの。"],["p4285", "I value our friendship, truly.", "友情は本当に大切に思ってる。"],["p4286", "I've made up my mind.", "もう決めたの。"],["p4287", "Let's talk when we're both calm.", "お互い落ち着いてから話そう。"],["p4288", "I need some space this week.", "今週は少し距離を置きたい。"]],
  r:[["Can you spot me some cash again?", 3],["Come on, just think it over again.", 5],["Are you angry with me now?", 4]],
  c:{sit:"何度も無理な頼みごとをしてくる友人に、はっきり意思を伝える",t:[["Why are you avoiding my calls lately?", 7],["I'm so upset right now!", 6],["I'll text you about it again tomorrow.", 2]]}},
 {t:"第五百三十七歩 ひとりでゆっくり過ごす日",d:"予定を入れずに、ひとりでのんびり過ごした一日を話す",p:[
  ["p4289", "I took a whole day for myself.", "丸一日、自分のために使ったの。"],["p4290", "I had no plans at all.", "予定は何もなかった。"],["p4291", "I slept in without an alarm.", "目覚ましなしでゆっくり寝たよ。"],["p4292", "I wandered around a bookstore for hours.", "何時間も本屋をぶらぶらした。"],["p4293", "I had lunch alone by the river.", "川沿いでひとりお昼を食べた。"],["p4294", "Nobody needed anything from me.", "誰にも何も求められなかった。"],["p4295", "I felt completely recharged.", "すっかり充電できた。"],["p4296", "I should do that more often.", "もっとそうするべきだな。"]],
  r:[["Where did you have lunch?", 4],["How did you feel afterward?", 6],["When did you wake up?", 2]],
  c:{sit:"予定を入れずにひとりで過ごした休日について話す",t:[["What did you have scheduled?", 1],["Where did you spend most of the afternoon?", 3],["Will you make it a habit?", 7]]}},
 {t:"第五百三十八歩 歩きながら打ち合わせ",d:"同僚と外を歩きながら打ち合わせをする",p:[
  ["p4297", "Want to walk and talk instead?", "代わりに歩きながら話さない？"],["p4298", "Fresh air helps me think.", "外の空気を吸うと考えがまとまる。"],["p4299", "Let's loop around the park.", "公園をぐるっと回ろう。"],["p4300", "I'll jot ideas on my phone.", "アイデアはスマホにメモするね。"],["p4301", "Let's keep it to twenty minutes.", "二十分以内にしよう。"],["p4302", "So, where are we stuck?", "で、どこで行き詰まってる？"],["p4303", "That's a great point. Let me note it.", "いい指摘だね。メモしておく。"],["p4304", "Let's head back and write it up.", "戻ってまとめよう。"]],
  r:[["Which route should we take?", 2],["How will we remember all this?", 3],["We've covered everything, I think.", 7]],
  c:{sit:"同僚を誘って、外を歩きながら打ち合わせをする",t:[["The meeting room feels so stuffy.", 0],["Why do you like meeting outside?", 1],["I've got another call soon.", 4]]}},
 {t:"第五百三十九歩 おばあちゃんへの電話",d:"遠くに住む祖母に感謝を伝える電話をかける",p:[
  ["p4305", "I just wanted to hear your voice.", "声が聞きたかっただけなの。"],["p4306", "Thank you for always believing in me.", "いつも信じてくれてありがとう。"],["p4307", "I still make your miso soup.", "おばあちゃんのお味噌汁、今も作ってるよ。"],["p4308", "How's your garden this year?", "今年の庭はどう？"],["p4309", "Are you keeping warm enough?", "ちゃんと暖かくしてる？"],["p4310", "I'll visit during the holidays.", "休みに会いに行くね。"],["p4311", "You taught me so much.", "たくさんのことを教えてくれたね。"],["p4312", "I'll call again next Sunday.", "また来週の日曜に電話するね。"]],
  r:[["Is something wrong, dear?", 0],["When will I see you?", 5],["Do you remember my recipe?", 2]],
  c:{sit:"離れて暮らす祖母に電話して、日ごろの感謝を伝える",t:[["It's getting chilly here at night.", 4],["Will you call me again soon?", 7],["I was always proud of you.", 1]]}},
 {t:"第五百四十歩 家の近くで休暇を",d:"遠出せず、近場で過ごす休暇（ステイケーション）を計画する",p:[
  ["p4313", "Let's be tourists in our own city.", "自分たちの街で観光客になろう。"],["p4314", "We'll skip the airport chaos.", "空港の混雑もなしだね。"],["p4315", "Let's book one night at a nice hotel.", "いいホテルに一泊予約しよう。"],["p4316", "No laundry or chores allowed.", "洗濯も家事も禁止ね。"],["p4317", "Let's try that new cafe downtown.", "街中の新しいカフェに行ってみよう。"],["p4318", "We could rent bikes by the river.", "川沿いで自転車を借りられるね。"],["p4319", "Let's switch off work email.", "仕事のメールは切っておこう。"],["p4320", "It feels like a real getaway.", "本当に旅に出た気分だね。"]],
  r:[["Where will we stay?", 2],["What if my boss messages me?", 6],["This doesn't even feel like home.", 7]],
  c:{sit:"連休を地元で過ごすステイケーションの計画を立てる",t:[["We never explore our own neighborhood.", 0],["Could we do something active outside?", 5],["I hate long security lines.", 1]]}},
 {t:"第五百四十一歩 ジグソーパズルで無心に",d:"ジグソーパズルに没頭する趣味について話す",p:[
  ["p4321", "It's a thousand-piece puzzle.", "千ピースのパズルなの。"],["p4322", "I always start with the edges.", "いつも端から始めるの。"],["p4323", "I sort the pieces by color.", "ピースを色ごとに分けてる。"],["p4324", "My mind just goes quiet.", "頭の中がすっかり静かになるの。"],["p4325", "Hours pass without me noticing.", "気づくと何時間もたってる。"],["p4326", "One piece is missing, of course.", "もちろん一ピース足りないの。"],["p4327", "I glue the finished ones and frame them.", "完成したものは糊で固めて額に入れる。"],["p4328", "Want to help me finish this corner?", "この角を一緒に完成させない？"]],
  r:[["How do you even begin?", 1],["What do you do once it's done?", 6],["Why does it relax you so much?", 3]],
  c:{sit:"趣味のジグソーパズルについて友人に話す",t:[["How big is that one?", 0],["Don't you lose track of time?", 4],["That looks like fun to do.", 7]]}},
 {t:"第五百四十二歩 写真フォルダの整理",d:"スマホにたまった大量の写真を整理する",p:[
  ["p4329", "I have thousands of blurry photos.", "ぶれた写真が何千枚もある。"],["p4330", "Let's delete the duplicates first.", "まず重複を消そう。"],["p4331", "Sort them into folders by year.", "年ごとにフォルダに分けて。"],["p4332", "Back everything up to the cloud.", "全部クラウドにバックアップして。"],["p4333", "Only keep your favorite of each.", "それぞれ一番のお気に入りだけ残して。"],["p4334", "Ten minutes a day is enough.", "一日十分ずつやれば大丈夫。"],["p4335", "I found my old school trip pictures.", "昔の修学旅行の写真が出てきた。"],["p4336", "Let's print a few for an album.", "何枚か印刷してアルバムにしよう。"]],
  r:[["What if my phone breaks?", 3],["I took ten shots of one sunset.", 4],["This feels endless, honestly.", 5]],
  c:{sit:"友人と一緒に、スマホの写真を整理する",t:[["How should I organize what's left?", 2],["Some of these are exact copies.", 1],["Photos just sit on my phone forever.", 7]]}},
 {t:"第五百四十三歩 電子書籍を図書館で",d:"図書館カードで電子書籍を借りる方法を教わる",p:[
  ["p4337", "You can borrow e-books for free.", "電子書籍が無料で借りられるよ。"],["p4338", "Just link your library card.", "図書館カードを連携するだけ。"],["p4339", "Popular titles have a waiting list.", "人気の本は順番待ちがあるよ。"],["p4340", "It returns itself automatically.", "自動で返却されるの。"],["p4341", "You can place a hold online.", "ネットで予約できるよ。"],["p4342", "The loan lasts two weeks.", "貸出期間は二週間。"],["p4343", "Audiobooks are available too.", "オーディオブックもあるよ。"],["p4344", "No more late fees for me.", "もう延滞料とは無縁だよ。"]],
  r:[["What if I forget to return it?", 3],["How long can I keep it?", 5],["Do they have anything to listen to?", 6]],
  c:{sit:"友人に図書館の電子書籍サービスの使い方を教える",t:[["Aren't e-books expensive?", 0],["How do I sign in to the app?", 1],["Why can't I borrow this bestseller now?", 2]]}},
 {t:"第五百四十四歩 家事分担の話し合い",d:"同居人と家事の分担を見直す",p:[
  ["p4345", "Let's split the chores more fairly.", "家事をもっと公平に分けよう。"],["p4346", "I'll handle the cooking on weekdays.", "平日の料理は私が担当する。"],["p4347", "Could you take over the laundry?", "洗濯を引き受けてくれる？"],["p4348", "I don't mind doing the dishes.", "皿洗いは別にかまわないよ。"],["p4349", "Let's rotate the bathroom cleaning.", "お風呂掃除は交代制にしよう。"],["p4350", "A shared checklist might help.", "共有のチェックリストがあるといいかも。"],["p4351", "I feel like I do most of it.", "ほとんど私がやっている気がする。"],["p4352", "Let's try it for a month.", "一か月試してみよう。"]],
  r:[["Nobody wants to scrub the tub.", 4],["How will we remember who did what?", 5],["Is something bothering you about the housework?", 6]],
  c:{sit:"ルームメイトと家事の分担を話し合う",t:[["Who's going to wash the plates?", 3],["Should we make this permanent?", 7],["I'm always too tired to cook after work.", 1]]}},
 {t:"第五百四十五歩 予定に余白をつくる",d:"詰め込みすぎた予定を見直し、余白をつくる",p:[
  ["p4353", "My calendar is packed solid.", "予定がびっしり詰まってる。"],["p4354", "I need to leave some breathing room.", "少し余裕を残さないと。"],["p4355", "I'm going to decline that dinner.", "あの食事会は断るつもり。"],["p4356", "Let's block off Sunday mornings.", "日曜の午前は空けておこう。"],["p4357", "Not every invitation needs a yes.", "すべての誘いに応じる必要はない。"],["p4358", "I'll add buffer time between meetings.", "会議の間に余裕の時間を入れる。"],["p4359", "I'm rushing from place to place.", "あちこち駆け回ってばかり。"],["p4360", "Free time isn't wasted time.", "自由な時間は無駄な時間じゃない。"]],
  r:[["Can you squeeze in a coffee this week?", 0],["You always say yes to everything.", 4],["Isn't an empty afternoon a waste?", 7]],
  c:{sit:"予定を詰め込みすぎた毎日を友人と見直す",t:[["You're always late to your next meeting.", 5],["Are you coming to the client dinner?", 2],["You need at least one free morning a week.", 3]]}},
 {t:"第五百四十六歩 好き嫌いの多い夕食",d:"野菜を食べたがらない子と夕食のテーブルで向き合う",p:[
  ["p4361", "Just try one bite for me.", "一口だけ食べてみて。"],["p4362", "You liked carrots last week.", "先週はにんじん好きだったでしょ。"],["p4363", "Nobody's forcing you to finish it.", "全部食べろとは言ってないよ。"],["p4364", "No dessert until you try it.", "食べてみるまでデザートはなしね。"],["p4365", "Want to help me cook tomorrow?", "明日一緒に料理する？"],["p4366", "Let's call them dinosaur trees.", "恐竜の木って呼ぼうか。"],["p4367", "Your taste buds change as you grow.", "大きくなると味覚は変わるんだよ。"],["p4368", "I'm not making a separate meal.", "別メニューは作らないよ。"]],
  r:[["Why can't I just have pasta instead?", 7],["But I've never liked carrots!", 1],["Broccoli looks so weird, though.", 5]],
  c:{sit:"夕食の野菜を前に、子どもがなかなか箸をつけない",t:[["Do I have to eat all of it?", 2],["Can I skip the peas and have ice cream?", 3],["Will I ever like mushrooms?", 6]]}},
 {t:"第五百四十七歩 寝る時間の駆け引き",d:"もっと起きていたい子と寝る時間をめぐって交渉する",p:[
  ["p4369", "It's way past your bedtime.", "もうとっくに寝る時間を過ぎてるよ。"],["p4370", "Okay, one more story, then lights out.", "じゃあもう一冊読んだら電気消すよ。"],["p4371", "You already had a glass of water.", "お水はもう飲んだでしょ。"],["p4372", "I'll leave the hall light on.", "廊下の電気はつけておくね。"],["p4373", "Fifteen more minutes on weekends only.", "あと十五分は週末だけね。"],["p4374", "No more stalling, sweetheart.", "もう引き延ばしはなしよ。"],["p4375", "Your body grows while you sleep.", "寝ている間に体は大きくなるんだよ。"],["p4376", "I'll check on you in a bit.", "少ししたら様子を見に来るね。"]],
  r:[["Can you read just one more book?", 1],["I'm scared of the dark. Can I keep a light on?", 3],["Why do kids even need sleep?", 6]],
  c:{sit:"布団に入った子どもが、あれこれ理由をつけて起きていようとする",t:[["I'm thirsty again. Can I get a drink?", 2],["Wait, I need to tell you something else!", 5],["Will you come back and see me?", 7]]}},
 {t:"第五百四十八歩 子ども同士の遊ぶ約束",d:"公園で知り合った親と、子ども同士を遊ばせる約束をする",p:[
  ["p4377", "Our kids really hit it off.", "うちの子たち、すごく気が合ったね。"],["p4378", "Would Mia like to come over?", "ミアちゃん、うちに遊びに来ない？"],["p4379", "Is there anything she doesn't eat?", "食べられないものはある？"],["p4380", "I can pick her up from school.", "学校まで迎えに行けるよ。"],["p4381", "What time works for drop-off?", "送ってくるのは何時がいい？"],["p4382", "Let's swap numbers just in case.", "念のため番号を交換しよう。"],["p4383", "Saturday afternoon suits us fine.", "土曜の午後ならうちは大丈夫。"],["p4384", "Next time it's our turn to host.", "次はうちが預かる番ね。"]],
  r:[["They've been playing together all morning.", 0],["She's a pretty fussy eater, actually.", 2],["Thanks so much for having her over!", 7]],
  c:{sit:"子どもの友達の親と、週末に遊ばせる段取りを決める",t:[["So, what day works best for you?", 6],["How do I reach you if something comes up?", 5],["I'm stuck at work until five that day.", 3]]}},
 {t:"第五百四十九歩 運動会の応援",d:"子どもの学校の運動会で、ほかの親と一緒に応援する",p:[
  ["p4385", "Go, go, you've got this!", "いけいけ、がんばれ！"],["p4386", "She's in the relay next.", "次はリレーに出るんだ。"],["p4387", "Did you bring the sunscreen?", "日焼け止め持ってきた？"],["p4388", "Let's grab a spot near the finish line.", "ゴール近くに場所を取ろう。"],["p4389", "He tripped but got right back up.", "転んだけどすぐ起き上がったね。"],["p4390", "I got it all on video.", "全部動画に撮ったよ。"],["p4391", "Ribbon or not, I'm proud of you.", "リボンがなくても誇りに思うよ。"],["p4392", "Are you joining the parents' race?", "保護者競走に出るの？"]],
  r:[["Where should we sit to watch?", 3],["Did you see him fall at the corner?", 4],["I didn't even place, Mom.", 6]],
  c:{sit:"晴れた日の運動会で、友人の親と並んで観戦する",t:[["The sun is really strong today.", 2],["Shoot, I missed her whole race!", 5],["When's your daughter's event?", 1]]}},
 {t:"第五百五十歩 はじめて抜けた乳歯",d:"子どもの乳歯がはじめて抜けた日の夜",p:[
  ["p4393", "Your tooth finally came out!", "ついに歯が抜けたね！"],["p4394", "Let's put it under your pillow.", "枕の下に置こうね。"],["p4395", "The tooth fairy comes tonight.", "今夜は歯の妖精が来るよ。"],["p4396", "Look, there's a gap now.", "見て、すきまができたよ。"],["p4397", "A grown-up tooth will grow in.", "大人の歯が生えてくるよ。"],["p4398", "Stop wiggling it with dirty fingers.", "汚れた指でぐらぐらさせないで。"],["p4399", "That's a big milestone, kiddo.", "それは大きな節目だね。"],["p4400", "Let's send Grandma a photo.", "おばあちゃんに写真を送ろう。"]],
  r:[["Will I have a hole there forever?", 4],["Where do I keep it tonight?", 1],["Look how much I can wiggle it!", 5]],
  c:{sit:"歯が抜けて興奮する子どもと夜に話す",t:[["Who takes the teeth away?", 2],["Grandma would love to see this!", 7],["Can I see it in the mirror?", 3]]}},
 {t:"第五百五十一歩 お弁当を詰める朝",d:"朝、子どもの学校に持たせるお弁当を詰める",p:[
  ["p4401", "What do you want in your lunch?", "お弁当に何を入れたい？"],["p4402", "I'll cut the crusts off.", "パンの耳を切っておくね。"],["p4403", "Add an apple, not more cookies.", "クッキーを増やすんじゃなくてリンゴね。"],["p4404", "Don't forget your water bottle.", "水筒を忘れないで。"],["p4405", "I slipped a note in there.", "中に手紙を入れておいたよ。"],["p4406", "Leftovers will have to do today.", "今日は残り物で我慢してね。"],["p4407", "Bring the container home this time.", "今度はお弁当箱を持って帰ってきてね。"],["p4408", "Tomorrow you pack it yourself, okay?", "明日は自分で詰めてね、いい？"]],
  r:[["Can I have more cookies instead?", 2],["I lost my lunch box again.", 6],["I hate the hard edges of the bread.", 1]],
  c:{sit:"登校前の台所で、子どもとお弁当の中身を相談する",t:[["Why do I always get stuff from dinner?", 5],["I'm big enough to do it myself!", 7],["I'll get thirsty at recess.", 3]]}},
 {t:"第五百五十二歩 スクリーンタイムの約束",d:"タブレットを使う時間のルールを子どもと決める",p:[
  ["p4409", "Homework first, then the tablet.", "宿題が先、タブレットはその後。"],["p4410", "One hour a day on school nights.", "学校がある日は一日一時間ね。"],["p4411", "No screens at the dinner table.", "食卓では画面禁止。"],["p4412", "Your time's up, hand it over.", "時間だよ、渡して。"],["p4413", "Let's set a timer together.", "一緒にタイマーをセットしよう。"],["p4414", "Earn extra time by reading.", "読書をしたら時間を増やせるよ。"],["p4415", "I'll put my phone away too.", "わたしもスマホをしまうよ。"],["p4416", "Who are you chatting with online?", "ネットで誰とやりとりしてるの？"]],
  r:[["Just five more minutes, please!", 3],["But you're always on your phone!", 6],["How much can I play on weekdays?", 1]],
  c:{sit:"ゲームをやめたがらない子と、使い方のルールを話し合う",t:[["Can I play while we eat?", 2],["Can I play now and do math later?", 0],["How can I get more game time?", 5]]}},
 {t:"第五百五十三歩 きょうだいげんかの仲裁",d:"けんかを始めた兄弟の間に入って落ち着かせる",p:[
  ["p4417", "Okay, both of you, separate rooms.", "はい、二人とも別々の部屋へ。"],["p4418", "I don't care who started it.", "どっちが始めたかはどうでもいい。"],["p4419", "Use your words, not your hands.", "手じゃなくて言葉で言って。"],["p4420", "Let's hear your side first.", "まずあなたの言い分を聞かせて。"],["p4421", "Take turns with the remote.", "リモコンは順番に使って。"],["p4422", "How would you feel in his shoes?", "弟の立場ならどう思う？"],["p4423", "Say sorry and mean it.", "心から謝りなさい。"],["p4424", "Let's all take a deep breath.", "みんな深呼吸しよう。"]],
  r:[["He started it, not me!", 1],["She hit me, so I hit her back!", 2],["It's my turn to pick the channel!", 4]],
  c:{sit:"リビングで言い争う姉弟をなだめる",t:[["Fine, I said sorry. Happy now?", 6],["Nobody ever listens to me!", 3],["He always takes my stuff, so I took his.", 5]]}},
 {t:"第五百五十四歩 結果より努力をほめる",d:"思うような結果が出ず落ち込む子を、努力に目を向けて励ます",p:[
  ["p4425", "I saw how hard you practiced.", "どれだけ練習したか見てたよ。"],["p4426", "Mistakes help your brain grow.", "間違いは脳を成長させるんだよ。"],["p4427", "You stuck with it, and that counts.", "最後までやり抜いた、それが大事。"],["p4428", "What would you try differently?", "次は何を変えてみる？"],["p4429", "Compare yourself to last month.", "先月の自分と比べてごらん。"],["p4430", "Your grade doesn't define you.", "点数であなたが決まるわけじゃない。"],["p4431", "Look how far you've come!", "こんなに上達したんだよ！"],["p4432", "I'm proud of your effort.", "頑張ったことを誇りに思うよ。"]],
  r:[["But Lily got a better score.", 4],["I wanted to quit halfway, but I didn't.", 2],["I got so many answers wrong.", 1]],
  c:{sit:"発表会やテストのあと、がっかりしている子どもに声をかける",t:[["I don't know what went wrong.", 3],["I'm just a C student, I guess.", 5],["Remember when I couldn't even read music?", 6]]}},
 {t:"第五百五十五歩 雨の日のおうち遊び",d:"外で遊べない雨の日に、家の中での過ごし方を考える",p:[
  ["p4433", "Let's build a blanket fort.", "毛布で秘密基地を作ろう。"],["p4434", "Let's bake cookies together.", "一緒にクッキーを焼こう。"],["p4435", "Put on your rain boots and splash!", "長靴をはいて水たまりで遊ぼう！"],["p4436", "We could have an indoor picnic.", "家の中でピクニックしようか。"],["p4437", "Let's have a dance party.", "ダンスパーティーをしよう。"],["p4438", "Grab some paper and crayons.", "紙とクレヨンを持ってきて。"],["p4439", "No running inside, please.", "家の中で走らないで。"],["p4440", "Maybe it'll clear up later.", "後で晴れるかもね。"]],
  r:[["Can we use all the couch cushions?", 0],["I want to draw a picture.", 5],["I want to go jump in the puddles!", 2]],
  c:{sit:"雨で公園に行けず退屈している子どもと過ごす",t:[["I miss eating on the grass outside.", 3],["Let's play tag in the living room!", 6],["Can we put on some loud music?", 4]]}},
 {t:"第五百五十六歩 家族で動物園へ",d:"週末に子どもを連れて動物園を回る",p:[
  ["p4441", "Let's see the elephants first.", "まずゾウを見よう。"],["p4442", "Hold my hand in the crowd.", "人ごみでは手をつないでね。"],["p4443", "Don't tap on the glass.", "ガラスをたたかないで。"],["p4444", "The lions are napping, look.", "ほら、ライオンが昼寝してる。"],["p4445", "Feeding time is at noon.", "えさの時間はお昼だよ。"],["p4446", "Let's grab a map at the gate.", "入口で地図をもらおう。"],["p4447", "Tired legs? Hop on my shoulders.", "足疲れた？肩車してあげる。"],["p4448", "We'll see the penguins next time.", "ペンギンは次に見ようね。"]],
  r:[["Why aren't the big cats moving?", 3],["I can't walk anymore, Daddy.", 6],["When do they get their food?", 4]],
  c:{sit:"はしゃぐ子どもを連れて動物園を歩く",t:[["Can I knock so the snake wakes up?", 2],["But I really wanted to see the penguins!", 7],["We just got here. Where are the giraffes?", 5]]}},
 {t:"第五百五十七歩 補助輪なしの自転車練習",d:"子どもに補助輪なしで自転車に乗る練習をさせる",p:[
  ["p4449", "Training wheels come off today.", "今日は補助輪を外すよ。"],["p4450", "I've got you, keep pedaling.", "支えてるよ、こぎ続けて。"],["p4451", "Look ahead, not at your feet.", "足元じゃなくて前を見て。"],["p4452", "Helmet on before you ride.", "乗る前にヘルメットをかぶって。"],["p4453", "Squeeze the brakes gently.", "ブレーキはそっと握って。"],["p4454", "Falling is part of learning.", "転ぶのも練習のうちだよ。"],["p4455", "I let go ages ago!", "もうとっくに手を離してたよ！"],["p4456", "Let's try the hill tomorrow.", "明日は坂でやってみよう。"]],
  r:[["Don't let go of me, okay?", 1],["I fell again. I'm terrible at this.", 5],["Wait, were you still holding on?", 6]],
  c:{sit:"公園で子どもの自転車の練習に付き添う",t:[["How do I stop without falling?", 4],["Do I really need this hat thing?", 3],["I keep staring at the pedals.", 2]]}},
 {t:"第五百五十八歩 答えられない子どもの質問",d:"子どもに答えのわからない質問をされる",p:[
  ["p4457", "That's a really great question.", "すごくいい質問だね。"],["p4458", "Honestly, I don't know.", "正直、わからないな。"],["p4459", "Let's look it up together.", "一緒に調べてみよう。"],["p4460", "What do you think the answer is?", "答えは何だと思う？"],["p4461", "Scientists are still figuring that out.", "科学者もまだ解明中なんだ。"],["p4462", "Let's ask your teacher tomorrow.", "明日先生に聞いてみよう。"],["p4463", "I'll explain when you're older.", "もう少し大きくなったら説明するね。"],["p4464", "Where did you hear about that?", "それどこで聞いたの？"]],
  r:[["Just tell me, Dad. Do you know or not?", 1],["Can we find it on your phone?", 2],["Nobody knows what's inside black holes?", 4]],
  c:{sit:"好奇心旺盛な子どもに、次々と質問される",t:[["My teacher knows everything about space.", 5],["Somebody said the moon is made of cheese!", 7],["I have an idea, but I'm not sure.", 3]]}},
 {t:"第五百五十九歩 家族のゲームナイト",d:"家族でカードゲームをする夜、負けて悔しがる子もいる",p:[
  ["p4465", "Whose turn is it now?", "今誰の番？"],["p4466", "No peeking at my cards!", "カード見ないで！"],["p4467", "Winning isn't everything, sweetie.", "勝つことがすべてじゃないよ。"],["p4468", "Let's read the rules again.", "ルールをもう一度読もう。"],["p4469", "Good game, everyone. Shake hands.", "いい勝負だったね、みんな握手。"],["p4470", "Rematch after we clean up?", "片付けたら再戦する？"],["p4471", "No phones during game night.", "ゲームの夜はスマホ禁止。"],["p4472", "You get to pick the game tonight.", "今夜は君がゲームを選んでいいよ。"]],
  r:[["I always lose, it's not fair!", 2],["I'm pretty sure you can't do that move.", 3],["I can almost see your cards from here.", 1]],
  c:{sit:"週末の夜、家族そろってゲームをする",t:[["Can we play one more round?", 5],["Hold on, I'm just texting Grandma.", 6],["Which game are we playing tonight?", 7]]}},
 {t:"第五百六十歩 祖父母がやって来る週末",d:"子どもの祖父母が遠くから泊まりに来る",p:[
  ["p4473", "Grandma and Grandpa arrive tomorrow!", "明日おじいちゃんとおばあちゃんが着くよ！"],["p4474", "Let's tidy up the guest room.", "客間を片付けよう。"],["p4475", "Please don't spoil them too much.", "あまり甘やかさないでくださいね。"],["p4476", "Tell Grandpa about your soccer game.", "おじいちゃんにサッカーの試合の話をしてあげて。"],["p4477", "Thanks for watching the kids tonight.", "今夜子どもたちを見てくれてありがとう。"],["p4478", "They love your apple pie.", "子どもたち、お母さんのアップルパイが大好きなの。"],["p4479", "Bedtime is still eight, okay?", "寝る時間はやっぱり八時ね。"],["p4480", "Let's take a family photo.", "家族写真を撮ろう。"]],
  r:[["Where will they sleep?", 1],["I brought them each a big present.", 2],["Go have dinner out, you two.", 4]],
  c:{sit:"遠方から来た両親と、子どもたちとの週末を過ごす",t:[["Shall I bake something for the kids?", 5],["We're all dressed up together for once.", 7],["They begged to stay up late with us.", 6]]}},
 {t:"第五百六十一歩 おこづかいで貯金",d:"子どもにおこづかいの使い方と貯め方を教える",p:[
  ["p4481", "Let's split it into three jars.", "三つの瓶に分けよう。"],["p4482", "Is it a need or a want?", "必要なもの？それとも欲しいだけ？"],["p4483", "If you wait, you can afford more.", "待てばもっといいものが買えるよ。"],["p4484", "Let's count your savings.", "貯金を数えてみよう。"],["p4485", "You can earn extra by doing chores.", "お手伝いをすれば追加でもらえるよ。"],["p4486", "It's your money, your choice.", "君のお金だから、君が決めて。"],["p4487", "Once it's spent, it's gone.", "使ったらなくなるんだよ。"],["p4488", "I'll match what you save.", "貯めた分と同じ額を足してあげる。"]],
  r:[["I spent it all and now I'm broke.", 6],["How do I get more money?", 4],["Do I really need these new sneakers?", 1]],
  c:{sit:"おこづかいの使い道について子どもと話す",t:[["How much do I have now?", 3],["I want the big toy, not the little one.", 2],["Can I buy whatever I want?", 5]]}},
 {t:"第五百六十二歩 はじめてのお泊まり会",d:"子どもが友達の家にはじめて泊まりに行く",p:[
  ["p4489", "Pack your toothbrush and pajamas.", "歯ブラシとパジャマを詰めてね。"],["p4490", "Call me if you want to come home.", "帰りたくなったら電話してね。"],["p4491", "Be polite to Sam's parents.", "サムのご両親に礼儀正しくね。"],["p4492", "Did you sleep at all?", "少しは寝たの？"],["p4493", "Thanks for having him over.", "泊めてくださってありがとうございます。"],["p4494", "It's normal to feel a bit nervous.", "少し緊張するのは普通だよ。"],["p4495", "I'll pick you up after breakfast.", "朝ごはんの後に迎えに行くね。"],["p4496", "Should we host one here next?", "次はうちでやる？"]],
  r:[["What if I miss you in the night?", 1],["I'm kind of scared to go.", 5],["We stayed up whispering till dawn!", 3]],
  c:{sit:"友達の家に泊まりに行く子どもを送り出し、迎えに行く",t:[["When are you coming to get me?", 6],["He was no trouble at all.", 4],["What do I need to bring?", 0]]}},
 {t:"第五百六十三歩 子どもの作品展",d:"学校の作品展で子どもの絵を見る",p:[
  ["p4497", "Tell me about this painting.", "この絵について教えて。"],["p4498", "I love the colors you chose.", "選んだ色がすてきだね。"],["p4499", "Which piece is yours?", "どれがあなたの作品？"],["p4500", "You put so much detail in.", "すごく細かく描き込んだね。"],["p4501", "Let's hang it on the fridge.", "冷蔵庫に飾ろう。"],["p4502", "Art doesn't have to look real.", "絵は本物そっくりじゃなくていいんだよ。"],["p4503", "Can I take a picture of you with it?", "作品と一緒に写真撮っていい？"],["p4504", "Your teacher displayed it so nicely.", "先生がきれいに展示してくれたね。"]],
  r:[["My picture is somewhere on this wall.", 2],["My horse doesn't look like a real horse.", 5],["I drew every single feather on the bird.", 3]],
  c:{sit:"学校の廊下に飾られた子どもの絵を一緒に見る",t:[["Can we take it home after the show?", 4],["I used blue and orange on purpose.", 1],["It's my underwater castle. Do you get it?", 0]]}},
 {t:"第五百六十四歩 朝の支度をせかす",d:"登校前のあわただしい朝、子どもの支度をせかす",p:[
  ["p4505", "Shoes on, we're leaving in five.", "靴はいて、あと五分で出るよ。"],["p4506", "Have you brushed your teeth yet?", "もう歯みがきした？"],["p4507", "Your backpack's still on the couch.", "リュックがまだソファの上だよ。"],["p4508", "Finish your toast in the car.", "トーストは車で食べ終えて。"],["p4509", "Why is your shirt inside out?", "なんでシャツが裏返しなの？"],["p4510", "We should've laid out clothes last night.", "昨夜のうちに服を出しておけばよかった。"],["p4511", "We're going to miss the bus.", "バスに乗り遅れるよ。"],["p4512", "Let's get up earlier tomorrow.", "明日はもっと早く起きよう。"]],
  r:[["I can't decide what to wear!", 5],["I haven't finished my toast yet!", 3],["Where's my school bag?", 2]],
  c:{sit:"出発時間が迫る朝、のんびりした子どもを急がせる",t:[["Why do we have to rush so much?", 6],["Does my shirt look funny?", 4],["I only washed my face so far.", 1]]}},
 {t:"第五百六十五歩 おもちゃの片づけ",d:"散らかったおもちゃを子どもに片づけさせる",p:[
  ["p4513", "Toys back in the bin, please.", "おもちゃは箱に戻してね。"],["p4514", "Let's race to see who's fastest.", "誰が一番早いか競争しよう。"],["p4515", "You took it out, you put it away.", "出したら自分でしまう。"],["p4516", "Blocks go on the bottom shelf.", "ブロックは一番下の棚ね。"],["p4517", "Let's donate what you've outgrown.", "もう使わないものは寄付しよう。"],["p4518", "I'll help with the big pieces.", "大きいものは手伝うね。"],["p4519", "Ten minutes, then we clean up.", "十分後に片付けるよ。"],["p4520", "Ouch, I just stepped on a block!", "いたっ、ブロック踏んじゃった！"]],
  r:[["Why do I have to clean up?", 2],["This is way too boring.", 1],["I never play with these baby toys anymore.", 4]],
  c:{sit:"夕食前、散らかった子ども部屋を一緒に片づける",t:[["Where do the blocks go?", 3],["This castle is too heavy for me.", 5],["Can I keep playing a little longer?", 6]]}},
 {t:"第五百六十六歩 レイトチェックアウトの交渉",d:"チェックアウト当日の朝、出発を遅らせられないかフロントに相談する",p:[
  ["p4521", "Any chance of a late checkout?", "レイトチェックアウトはできますか？"],["p4522", "My flight doesn't leave until evening.", "飛行機が夕方まで出ないんです。"],["p4523", "Would two o'clock be possible?", "二時は可能でしょうか？"],["p4524", "I'm happy to pay a small fee.", "少しの追加料金なら払います。"],["p4525", "Could you hold my bags instead?", "代わりに荷物を預かってもらえますか？"],["p4526", "I'm a member of your loyalty program.", "こちらの会員プログラムに入っています。"],["p4527", "Even an extra hour would help.", "一時間延びるだけでも助かります。"],["p4528", "I'll leave the key at the desk.", "鍵はフロントに置いていきます。"]],
  r:[["We're fully booked tonight, so two is difficult.", 6],["Late checkout usually costs extra, I'm afraid.", 3],["What time does your flight leave?", 1]],
  c:{sit:"チェックアウトの朝、フロント係と出発時間について話す",t:[["I'm sorry, we can't extend your stay today.", 4],["Do you have any status with us?", 5],["Please return your room key before you go.", 7]]}},
 {t:"第五百六十七歩 写真と違う部屋",d:"予約サイトの写真と実際の部屋がまったく違い、フロントに申し出る",p:[
  ["p4529", "This room doesn't match the photos.", "この部屋、写真と違います。"],["p4530", "The listing promised an ocean view.", "掲載では海が見えるとありました。"],["p4531", "There's a strong smell of smoke.", "たばこの臭いが強いです。"],["p4532", "I booked a double, not twin beds.", "ツインではなくダブルを予約しました。"],["p4533", "Here's a screenshot of my booking.", "これが予約画面のスクリーンショットです。"],["p4534", "Could we move to another room?", "別の部屋に移れますか？"],["p4535", "Otherwise, I'd like a partial refund.", "それが無理なら一部返金をお願いします。"],["p4536", "I'd appreciate it if you could check.", "確認していただけると助かります。"]],
  r:[["Can you show me what you reserved?", 4],["We have no other rooms available tonight.", 6],["Good evening. How is everything with your room?", 0]],
  c:{sit:"部屋に入ってすぐ、予約内容との違いをフロントで伝える",t:[["What seems to be the problem with the beds?", 3],["Do you have proof of the room type you booked?", 4],["Did we promise a particular view?", 1]]}},
 {t:"第五百六十八歩 電車に置き忘れたかばん",d:"電車の網棚にかばんを置き忘れ、鉄道会社の遺失物係に電話する",p:[
  ["p4537", "I left my bag on a train.", "電車にかばんを置き忘れました。"],["p4538", "It was on the overhead rack.", "網棚の上に置いていました。"],["p4539", "It's a navy backpack with a red tag.", "赤いタグの付いた紺色のリュックです。"],["p4540", "I got off at Central Station.", "セントラル駅で降りました。"],["p4541", "It was the ten fifteen express.", "十時十五分発の急行でした。"],["p4542", "My passport isn't in it, luckily.", "幸いパスポートは入っていません。"],["p4543", "Where can I pick it up?", "どこに取りに行けばいいですか？"],["p4544", "Please call this number if it turns up.", "見つかったらこの番号に電話をください。"]],
  r:[["Which train were you on, roughly?", 4],["Can you describe the bag for me?", 2],["We found it. You can collect it in person.", 6]],
  c:{sit:"鉄道会社の遺失物係に、忘れたかばんについて詳しく伝える",t:[["Where in the car did you leave it?", 1],["Any important documents inside?", 5],["Which stop did you leave the train at?", 3]]}},
 {t:"第五百六十九歩 地元の人に穴場を聞く",d:"観光客向けではない、地元の人が通う店を教えてもらう",p:[
  ["p4545", "Where do locals actually eat around here?", "このあたりで地元の人が実際に食べに行くのはどこ？"],["p4546", "Somewhere without a tourist menu, ideally.", "できれば観光客向けメニューのない店で。"],["p4547", "I'm after something really authentic.", "本当に本場の味を探しているんです。"],["p4548", "Nothing fancy, just good food.", "高級じゃなくていい、おいしければ。"],["p4549", "Do they take reservations?", "予約はできますか？"],["p4550", "What should I order there?", "そこでは何を頼むべき？"],["p4551", "Could you write the name down?", "店の名前を書いてもらえますか？"],["p4552", "I'll tell them you sent me.", "あなたの紹介だと伝えますね。"]],
  r:[["You'll love that place. The menu is huge.", 5],["It's hard to find. The sign is only in Spanish.", 6],["Do you want somewhere upscale?", 3]],
  c:{sit:"宿の近くのカフェで、店員に地元の食堂について尋ねる",t:[["It's always packed, so go early.", 4],["The owner is my cousin, actually.", 7],["Most places on this street are tourist traps.", 0]]}},
 {t:"第五百七十歩 チップ制のウォーキングツアー",d:"チップ制の無料ウォーキングツアーに参加し、最後にガイドへ感謝を伝える",p:[
  ["p4553", "Where does the tour meet?", "ツアーの集合場所はどこですか？"],["p4554", "Do I need to sign up beforehand?", "事前の申し込みは必要ですか？"],["p4555", "How long does the walk take?", "歩くのにどのくらいかかりますか？"],["p4556", "Sorry, could you repeat that year?", "すみません、その年をもう一度言ってもらえますか？"],["p4557", "That story about the bridge was fascinating.", "橋の話、すごく面白かったです。"],["p4558", "How much do people usually tip?", "みんな普通いくらくらいチップを払うの？"],["p4559", "This is for you. Thank you so much.", "これをどうぞ。本当にありがとう。"],["p4560", "Can I leave a review for you?", "あなたのレビューを書いてもいいですか？"]],
  r:[["The tour is free, but tips are welcome.", 5],["Feel free to stop me if I'm going too fast.", 3],["That's the end of our tour, everyone!", 6]],
  c:{sit:"旧市街を歩くツアーの途中と最後に、ガイドと話す",t:[["Most of my guests find me through online reviews.", 7],["We cover about four kilometers today.", 2],["Any questions about what you've seen?", 4]]}},
 {t:"第五百七十一歩 遅延便の振り替え交渉",d:"出発便が大幅に遅れ、カウンターで別の便への振り替えを頼む",p:[
  ["p4561", "How long is the delay expected to be?", "遅延はどのくらいの見込みですか？"],["p4562", "I'll miss my connecting flight.", "乗り継ぎ便に間に合いません。"],["p4563", "Can you rebook me on another airline?", "他社の便に振り替えてもらえますか？"],["p4564", "Any seat is fine, honestly.", "正直、席はどこでも構いません。"],["p4565", "Will my bag be transferred automatically?", "荷物は自動的に載せ替えられますか？"],["p4566", "Do you provide meal vouchers?", "食事券は出ますか？"],["p4567", "Could I get that in writing?", "それを書面でもらえますか？"],["p4568", "I'd rather fly out tonight.", "できれば今夜中に発ちたいです。"]],
  r:[["At least four hours, I'm afraid.", 1],["The only option left is a middle seat.", 3],["We can put you on tomorrow morning's flight.", 7]],
  c:{sit:"遅延の表示が出た搭乗口のカウンターで、係員と交渉する",t:[["Our next flight is full, unfortunately.", 2],["Passengers may use the food court while waiting.", 5],["The delay is due to a mechanical problem.", 6]]}},
 {t:"第五百七十二歩 乗り継ぎに間に合わない",d:"到着が遅れて乗り継ぎ便を逃し、空港の窓口で次の手を相談する",p:[
  ["p4569", "I just missed my connection.", "たった今、乗り継ぎ便を逃しました。"],["p4570", "Our first flight landed late.", "最初の便が遅れて着いたんです。"],["p4571", "It was booked as one ticket.", "通しの航空券で予約しました。"],["p4572", "Which gate does the next one leave from?", "次の便は何番ゲートからですか？"],["p4573", "Can you put me on standby?", "キャンセル待ちに入れてもらえますか？"],["p4574", "Will the airline cover a hotel?", "航空会社がホテル代を負担してくれますか？"],["p4575", "I need to tell my hotel I'm late.", "ホテルに遅れると伝えないと。"],["p4576", "I'll run. Thank you so much!", "走ります。本当にありがとう！"]],
  r:[["Did you book these flights separately?", 2],["The next flight is full, but seats may open up.", 4],["There's nothing else until tomorrow morning.", 5]],
  c:{sit:"乗り継ぎ便に乗れず、航空会社の窓口で係員と話す",t:[["How can I help you, sir?", 0],["Boarding closes in ten minutes, so hurry.", 7],["Why didn't you make the connection?", 1]]}},
 {t:"第五百七十三歩 構図を指定して撮ってもらう",d:"見知らぬ人に集合写真を頼み、背景の入れ方まで細かくお願いする",p:[
  ["p4577", "Would you mind taking our photo?", "写真を撮っていただけませんか？"],["p4578", "Just press the big white button.", "白い大きなボタンを押すだけです。"],["p4579", "Could you get the tower in?", "塔も入れてもらえますか？"],["p4580", "Try to fit everyone, head to toe.", "全員を頭からつま先まで入れてください。"],["p4581", "Maybe crouch down a little?", "少しかがんでもらえますか？"],["p4582", "Could you take a few, just in case?", "念のため何枚か撮ってもらえますか？"],["p4583", "Portrait, not landscape, please.", "横じゃなくて縦でお願いします。"],["p4584", "Happy to return the favor.", "お返しに撮りますよ。"]],
  r:[["Sure. How does this thing work?", 1],["Should I hold it sideways?", 6],["Sorry, the building behind you is cut off.", 2]],
  c:{sit:"展望台で、通りすがりの人に記念写真をお願いする",t:[["Excuse me, do you need help?", 0],["Mind if I ask you to take our photo next?", 7],["I'm much taller than all of you. The angle looks odd.", 4]]}},
 {t:"第五百七十四歩 門限と家事の分担",d:"ホームステイ先で、帰宅時間や手伝いについて家族と話し合う",p:[
  ["p4585", "What time should I be home by?", "何時までに帰ればいいですか？"],["p4586", "I'll text if I'm running late.", "遅くなりそうならメッセージします。"],["p4587", "Can I use the washing machine?", "洗濯機を使ってもいいですか？"],["p4588", "How can I help around the house?", "家のことで何か手伝えますか？"],["p4589", "Could friends visit me here sometimes?", "時々友達を呼んでもいいですか？"],["p4590", "I'll keep my showers short.", "シャワーは短めにしますね。"],["p4591", "Should I take my shoes off?", "靴は脱いだほうがいいですか？"],["p4592", "Please tell me if I do something wrong.", "何か失礼があったら教えてください。"]],
  r:[["We do worry if you're out late.", 1],["Hot water runs out fast in this house.", 5],["We have lots of chores, but you're our guest.", 3]],
  c:{sit:"ホームステイ二日目の夕食後、ホストマザーと生活の決まりを確認する",t:[["Customs here must be different from Japan.", 7],["We have a big living room for guests.", 4],["Laundry day is Sunday, by the way.", 2]]}},
 {t:"第五百七十五歩 現地の家庭料理を習う",d:"旅先の料理教室で、地元のシェフに家庭料理を教わる",p:[
  ["p4593", "How finely should I chop this?", "これはどのくらい細かく切ればいい？"],["p4594", "Mine looks a bit too watery.", "私のは少し水っぽいみたい。"],["p4595", "What can I use instead back home?", "国に帰ったら代わりに何を使えばいい？"],["p4596", "Should the oil be smoking?", "油から煙が出るくらいがいい？"],["p4597", "Could you show me that again slowly?", "もう一度ゆっくり見せてもらえますか？"],["p4598", "That smells absolutely amazing.", "すごくいい香り。"],["p4599", "Can I take the recipe with me?", "レシピを持ち帰ってもいいですか？"],["p4600", "My family will love this dish.", "家族がきっとこの料理を気に入るよ。"]],
  r:[["This herb only grows in our region.", 2],["Fold the edges like this. See how quick?", 4],["Let me see how your sauce is doing.", 1]],
  c:{sit:"料理教室のキッチンで、シェフの説明を聞きながら手を動かす",t:[["Dice the onion into small pieces.", 0],["Heat the oil first, nice and hot.", 3],["Who will you cook this for?", 7]]}},
 {t:"第五百七十六歩 夜市でやんわり値切る",d:"夜市の屋台で、失礼にならないよう値段を相談する",p:[
  ["p4601", "How much for this one?", "これはおいくら？"],["p4602", "It's lovely, but a bit over my budget.", "素敵だけど、予算を少し超えてます。"],["p4603", "Could you do a little better?", "もう少しなんとかなりませんか？"],["p4604", "What if I buy two?", "二つ買ったらどうですか？"],["p4605", "Would you take twelve for it?", "十二でどうですか？"],["p4606", "Fair enough. That's a deal.", "わかりました。それで決まりです。"],["p4607", "I'll look around and maybe come back.", "少し見て回って、また来るかもしれません。"],["p4608", "Do you take cards or just cash?", "カードは使えますか？現金だけ？"]],
  r:[["Okay, okay. Fifteen, final price.", 5],["This one is handmade, so it's twenty.", 1],["Sorry, I can't go any lower.", 6]],
  c:{sit:"にぎやかな夜市で、手作り雑貨の店主と値段の話をする",t:[["Name your price, my friend.", 4],["And this little bowl? It's handmade too.", 0],["I can give a discount if you buy more.", 3]]}},
 {t:"第五百七十七歩 島へ渡るフェリー",d:"島へ渡るフェリーの切符を港の窓口で買う",p:[
  ["p4609", "Two tickets to the island, please.", "島までの切符を二枚ください。"],["p4610", "Return, coming back tomorrow afternoon.", "往復で、明日の午後に戻ります。"],["p4611", "What time is the last sailing?", "最終便は何時ですか？"],["p4612", "Can I bring my bike on board?", "自転車は持ち込めますか？"],["p4613", "Does it run in rough weather?", "海が荒れても運航しますか？"],["p4614", "Where do we board?", "どこから乗船しますか？"],["p4615", "Can we sit out on deck?", "デッキに出て座れますか？"],["p4616", "How long is the crossing?", "船でどのくらいかかりますか？"]],
  r:[["Single or return?", 1],["Next, please. Where are you heading?", 0],["There's a storm coming this weekend.", 4]],
  c:{sit:"港の切符売り場で、フェリーについて係員に質問する",t:[["Anything else you're bringing along?", 3],["If you miss the evening boat, you're stuck there.", 2],["It's a beautiful view from the outside seats.", 6]]}},
 {t:"第五百七十八歩 観光列車の座席予約",d:"景色の良い観光列車で、眺めのいい側の席を予約する",p:[
  ["p4617", "I'd like to reserve seats on the scenic train.", "観光列車の席を予約したいです。"],["p4618", "Which side has the better view?", "どちら側の景色がいいですか？"],["p4619", "A window seat on the left, please.", "左側の窓側席をお願いします。"],["p4620", "We'd like to sit together, if possible.", "できれば並んで座りたいです。"],["p4621", "Does the train have a dining car?", "食堂車はありますか？"],["p4622", "Can we change seats partway?", "途中で席を替えられますか？"],["p4623", "How far ahead should we book?", "どのくらい前に予約すべきですか？"],["p4624", "We'll take the earlier departure, then.", "じゃあ早い方の便にします。"]],
  r:[["The lake is on the left going north.", 2],["The afternoon train only has single seats left.", 7],["Seats often sell out in summer.", 6]],
  c:{sit:"駅の窓口で、観光列車の席について係員と相談する",t:[["How may I help you today?", 0],["You'll pass the lake and mountains.", 1],["There are two of you traveling?", 3]]}},
 {t:"第五百七十九歩 保険金請求の電話",d:"旅行中のトラブルについて、保険会社に請求に必要な書類を電話で確認する",p:[
  ["p4625", "I'd like to start a claim.", "保険金の請求を始めたいです。"],["p4626", "It's printed on my insurance card.", "保険のカードに印字されています。"],["p4627", "What documents do you need from me?", "どんな書類が必要ですか？"],["p4628", "I have the police report here.", "警察の届出証明書は手元にあります。"],["p4629", "Do receipts need to be originals?", "領収書は原本が必要ですか？"],["p4630", "Can I submit everything online?", "全部オンラインで提出できますか？"],["p4631", "What's the deadline for filing?", "申請の期限はいつですか？"],["p4632", "Could you email me a checklist?", "チェックリストをメールしてもらえますか？"]],
  r:[["Can I have your policy number, please?", 1],["For theft, we'll need an official report.", 3],["There's quite a list. It's hard to remember.", 7]],
  c:{sit:"保険会社の担当者に電話し、請求の手続きを確認する",t:[["How can I help you today?", 0],["You'll need to send us a few things.", 2],["Please send everything to us by post.", 5]]}},
 {t:"第五百八十歩 旅人に地元を売りこむ",d:"自分のふるさとに興味を持った旅行者に、見どころをすすめる",p:[
  ["p4633", "My hometown is worth the detour.", "わたしの地元は寄り道する価値があるよ。"],["p4634", "It's only an hour from Osaka by train.", "大阪から電車でたった一時間。"],["p4635", "Spring is the best time to visit.", "訪れるなら春が一番。"],["p4636", "Try the local noodles near the station.", "駅の近くで郷土の麺を食べてみて。"],["p4637", "It's quiet, but that's the charm.", "静かだけど、そこが魅力なの。"],["p4638", "Skip the castle and see the old streets.", "お城より古い町並みを見て。"],["p4639", "Stay at a family-run inn.", "家族経営の宿に泊まってみて。"],["p4640", "I'll send you a map later.", "あとで地図を送るね。"]],
  r:[["How far is it from the big cities?", 1],["Isn't it a bit boring compared to Tokyo?", 4],["When should I go?", 2]],
  c:{sit:"ゲストハウスで知り合った旅行者に、自分の地元をすすめる",t:[["Where should I eat there?", 3],["What's the one sight I shouldn't miss?", 5],["Hotels or traditional places?", 6]]}},
 {t:"第五百八十一歩 辛口すぎない宿の感想",d:"宿のレビューを、良い点と改善点の両方を入れて書く",p:[
  ["p4641", "The staff went above and beyond.", "スタッフの対応は期待以上でした。"],["p4642", "The location couldn't be better.", "立地はこれ以上ないほど良かったです。"],["p4643", "The walls were a little thin.", "壁が少し薄かったです。"],["p4644", "Breakfast was decent but repetitive.", "朝食はまずまずでしたが、毎日同じでした。"],["p4645", "Light sleepers should ask for a back room.", "眠りの浅い人は奥の部屋を頼むといいです。"],["p4646", "Great value for the price.", "値段の割にとてもお得でした。"],["p4647", "I'd happily stay here again.", "また喜んで泊まりたいです。"],["p4648", "Overall, four stars from me.", "総合すると星四つです。"]],
  r:[["How was the service?", 0],["Did you sleep well?", 2],["Would you go back?", 6]],
  c:{sit:"泊まった宿のレビューを、友人に相談しながら書く",t:[["Was it expensive?", 5],["Was the food any good?", 3],["So, how many stars?", 7]]}},
 {t:"第五百八十二歩 雨で崩れた予定の立て直し",d:"雨で予定していたハイキングが中止になり、代わりの過ごし方を考える",p:[
  ["p4649", "The hike's off, unfortunately.", "残念だけどハイキングは中止。"],["p4650", "Let's switch to plan B.", "プランBに切り替えよう。"],["p4651", "There's a covered market nearby.", "近くに屋根付きの市場があるよ。"],["p4652", "We could visit the museum instead.", "代わりに博物館に行けるよ。"],["p4653", "Let's save the hike for Thursday.", "ハイキングは木曜に回そう。"],["p4654", "Let's check the forecast again at noon.", "お昼にもう一度天気予報を見よう。"],["p4655", "A rainy day calls for a long lunch.", "雨の日はゆっくりランチに限るね。"],["p4656", "Got your umbrella?", "傘持った？"]],
  r:[["Look at that rain. What now?", 1],["I'd still like to do some shopping.", 2],["Maybe it'll clear up this afternoon.", 5]],
  c:{sit:"雨の朝、旅の仲間とその日の予定を組み直す",t:[["I really wanted to see the waterfall.", 4],["I'm not in the mood for walking around.", 6],["Ready to head out?", 7]]}},
 {t:"第五百八十三歩 バスで酔ったとき",d:"山道を走るバスで気分が悪くなり、周りの人に伝える",p:[
  ["p4657", "I'm feeling a bit carsick.", "ちょっと車酔いしたみたい。"],["p4658", "Could I switch to a front seat?", "前の席に替われますか？"],["p4659", "Could you open the window a little?", "窓を少し開けてもらえますか？"],["p4660", "I just need some fresh air.", "外の空気を吸いたいだけです。"],["p4661", "How much longer until the next stop?", "次の停留所まであとどのくらい？"],["p4662", "Looking at the horizon helps me.", "遠くを見ると楽になるんです。"],["p4663", "I'll be okay in a minute.", "すぐに良くなります。"],["p4664", "Could you pull over, please?", "車を止めてもらえますか？"]],
  r:[["You look pale. Are you all right?", 0],["Sitting at the back makes it worse, you know.", 1],["Should I call the driver?", 6]],
  c:{sit:"カーブの多い道を走るバスの中で、隣の乗客と話す",t:[["Try not to read on your phone.", 5],["It's pretty stuffy back here.", 2],["Do you want me to get you some water?", 6]]}},
 {t:"第五百八十四歩 入国カードの記入",d:"到着した空港で入国カードの書き方がわからず、係員に尋ねる",p:[
  ["p4665", "Sorry, what goes in this box?", "すみません、この欄には何を書くんですか？"],["p4666", "Do I put my hotel's address here?", "ここにホテルの住所を書くんですか？"],["p4667", "I'm here on vacation.", "休暇で来ました。"],["p4668", "I'm staying for ten days.", "十日間滞在します。"],["p4669", "Should I write my name in capitals?", "名前は大文字で書くべきですか？"],["p4670", "I made a mistake. May I have another?", "書き間違えました。もう一枚もらえますか？"],["p4671", "Could I borrow a pen?", "ペンを借りられますか？"],["p4672", "Do I need to declare snacks?", "お菓子も申告が必要ですか？"]],
  r:[["What's the purpose of your visit?", 2],["How long will you be in the country?", 3],["Any food or plants in your luggage?", 7]],
  c:{sit:"入国審査の列で、入国カードを手に係員に質問する",t:[["Crossed-out forms can't be accepted.", 5],["Write it exactly as on your passport.", 4],["Do you need any help with that form?", 0]]}},
