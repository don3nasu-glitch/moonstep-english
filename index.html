 {t:"第九十六歩 道具",d:"新しい技術の話",p:[
  ["p761", "I use it every day.", "毎日使っています。"],["p762", "How does it work?", "それはどういう仕組みですか？"],["p763", "It saves a lot of time.", "時間がたくさん節約できます。"],["p764", "I can't live without my phone.", "携帯電話なしでは生活できません。"],["p765", "Have you tried this app?", "このアプリを使ってみましたか？"],["p766", "It's easy to use.", "使いやすいです。"],["p767", "Technology is changing fast.", "技術は速く変わっています。"],["p768", "I need to update it.", "更新しなければなりません。"]],
  r:[["Do you use that translation app often?", 0],["Why do you like this new tool so much?", 2],["This app is not working well today.", 7]],
  c:{sit:"友人に新しいアプリを見せる",t:[["What is that on your phone?", 4],["No. It looks difficult.", 5],["Really? Why do you like it so much?", 2]]}},
 {t:"第九十七歩 休息",d:"疲れとストレスの話",p:[
  ["p769", "I've been under a lot of stress.", "ずっとストレスがたまっています。"],["p770", "I need some time off.", "少し休みが必要です。"],["p771", "You should get some rest.", "少し休んだほうがいいですよ。"],["p772", "I can't concentrate today.", "今日は集中できません。"],["p773", "Let's get some fresh air.", "外の空気を吸いに行きましょう。"],["p774", "Talking helps me relax.", "話すと気持ちが楽になります。"],["p775", "I feel refreshed now.", "すっきりしました。"],["p776", "Take it easy.", "無理しないでね。"]],
  r:[["I worked until midnight again.", 2],["How do you feel after your vacation?", 6],["I'm going home now. I'm so tired.", 7]],
  c:{sit:"職場で同僚に心配される",t:[["You look tired. How have you been lately?", 0],["I'm sorry to hear that. What do you need?", 1],["Good idea. Shall we go outside for a minute now?", 4]]}},
 {t:"第九十八歩 言い回し",d:"よく使う決まり文句",p:[
  ["p777", "It's a piece of cake.", "とても簡単です。"],["p778", "I'm all ears.", "しっかり聞いていますよ。"],["p779", "Let's call it a day.", "今日はここまでにしましょう。"],["p780", "It's not my cup of tea.", "私の好みではありません。"],["p781", "Better late than never.", "遅れてもやらないよりはいいです。"],["p782", "Break a leg!", "がんばって！", "舞台や発表の前の人に"],["p783", "Long story short, we won.", "手短に言うと、私たちが勝ちました。"],["p784", "So far, so good.", "今のところ順調です。"]],
  r:[["How is your new job going?", 7],["This math problem looks hard. Can you solve it?", 0, "とても簡単だ"],["I have something important to tell you.", 1]],
  c:{sit:"仕事終わりに同僚と話す",t:[["We have been working for ten hours.", 2],["Good. I'm going on stage for my first concert tonight!", 5],["Do you want to come? It's heavy metal music.", 3]]}},
 {t:"第九十九歩 議論",d:"立場をくらべて話す",p:[
  ["p785", "On the one hand, it's cheap.", "一方では、安いです。"],["p786", "On the other hand, it's slow.", "その一方で、遅いです。"],["p787", "There are pros and cons.", "良い点と悪い点があります。"],["p788", "I see it differently.", "私は違う見方をしています。"],["p789", "You have a point.", "一理ありますね。"],["p790", "Let's agree to disagree.", "意見が違うことを認め合いましょう。"],["p791", "For example, look at this case.", "たとえば、この例を見てください。"],["p792", "In conclusion, we need both.", "結論として、両方が必要です。"]],
  r:[["Working from home is the best. Don't you think so?", 3],["We will never agree on this topic.", 5],["Trains are better because they are always on time.", 4]],
  c:{sit:"旅行の行き方を友人と相談する",t:[["Should we take the night bus or the fast train?", 2],["What is good about the bus?", 0],["True. And what is the bad side?", 1]]}},
 {t:"第百歩 月の道",d:"ここまでの歩みを言葉にする",p:[
  ["p793", "I've come this far.", "ここまで来ました。"],["p794", "I couldn't have done it without you.", "あなたがいなければできませんでした。"],["p795", "I feel more confident now.", "今は前より自信があります。"],["p796", "I can express myself in English.", "英語で自分の気持ちを伝えられます。"],["p797", "There is still more to learn.", "学ぶことはまだあります。"],["p798", "I'm ready for the next step.", "次の一歩に進む準備ができています。"],["p799", "The journey continues.", "旅は続きます。"],["p800", "Let's keep walking together.", "これからも一緒に歩いていきましょう。"]],
  r:[["You have finished one hundred lessons. How do you feel?", 2],["You did it! I only helped a little.", 1],["So, what will you do now?", 5]],
  c:{sit:"学びの節目に、ここまでの道をふり返る",t:[["This is the last step on the path. Look back.", 0],["Can you tell people your feelings in English now?", 3],["Then our road goes on. Are you coming?", 7]]}},
 {t:"第百一歩 ご近所",d:"となりの人とつきあう",p:[
  ["p801", "I just moved in next door.", "となりに引っ越してきたばかりです。"],["p802", "Could I borrow a ladder?", "はしごを借りてもいいですか？"],["p803", "Let me know if you need anything.", "何か必要なら言ってくださいね。"],["p804", "Sorry about the noise last night.", "昨夜はうるさくしてすみません。"],["p805", "When is garbage day?", "ごみの日はいつですか？"],["p806", "I'll return it tomorrow.", "明日返します。"],["p807", "It's nice to have you here.", "来てくれてうれしいです。"],["p808", "Please feel free to stop by.", "気軽に寄ってくださいね。"]],
  r:[["Hi! I haven't seen you before.", 0],["Having some trouble with your roof?", 1, "屋根に上る道具がない"],["Of course, you can use my ladder.", 5]],
  c:{sit:"となりに引っ越してきた人に声をかける",t:[["Hi, I just moved in next door. I'm Sara.", 6],["Thank you. I still have a lot of boxes to carry.", 2],["That's so kind. Can I come by and say hello sometime?", 7]]}},
 {t:"第百二歩 子ども",d:"子どもと家族の予定",p:[
  ["p809", "How old are your kids?", "お子さんは何歳ですか？"],["p810", "My son just started school.", "息子は学校に通い始めたばかりです。"],["p811", "I have to pick up my daughter.", "娘を迎えに行かなければなりません。"],["p812", "Could you watch the kids for an hour?", "1時間子どもを見ていてもらえますか？"],["p813", "They grow up so fast.", "子どもはすぐ大きくなりますね。"],["p814", "We're going to the zoo this weekend.", "今週末は動物園に行きます。"],["p815", "He's very curious about everything.", "彼は何にでも興味津々です。"],["p816", "Bedtime is at eight.", "寝る時間は8時です。"]],
  r:[["Are you leaving already?", 2],["Your boy is so much taller now!", 4],["Do you have plans for Saturday?", 5]],
  c:{sit:"公園で知り合いの親と話す",t:[["Your little boy is so cute. How old is he?", 1],["Wow, already? Can you stay and chat a bit longer?", 2],["I see. Your son keeps asking me questions!", 6]]}},
 {t:"第百三歩 空模様",d:"天気予報と服装",p:[
  ["p817", "What's the forecast for tomorrow?", "明日の天気予報はどうですか？"],["p818", "It's supposed to snow.", "雪が降るそうです。"],["p819", "You'd better take a jacket.", "上着を持っていったほうがいいですよ。"],["p820", "It's humid today.", "今日は蒸し暑いです。"],["p821", "The wind is really strong.", "風がとても強いです。"],["p822", "It's freezing outside.", "外は凍えるほど寒いです。"],["p823", "It might clear up later.", "あとで晴れるかもしれません。"],["p824", "Dress warmly.", "暖かい格好をしてね。"]],
  r:[["Shall we have a picnic tomorrow?", 1],["Should I wear a T-shirt today?", 2],["It's raining a lot right now.", 6]],
  c:{sit:"出かける前に家族と話す",t:[["I'm going hiking tomorrow. I hope the weather is good.", 0],["Let me check. Oh, it says snow in the mountains.", 2],["It's raining hard right now, though.", 6]]}},
 {t:"第百四歩 地域",d:"ボランティアと地域の活動",p:[
  ["p825", "I volunteer at the library.", "図書館でボランティアをしています。"],["p826", "We're cleaning the park on Sunday.", "日曜日に公園を掃除します。"],["p827", "Anyone can join.", "だれでも参加できます。"],["p828", "It feels good to help others.", "人の役に立つと気持ちがいいです。"],["p829", "How can I sign up?", "どうやって申し込めばいいですか？"],["p830", "We need more people.", "もっと人手が必要です。"],["p831", "I'd be happy to help.", "喜んでお手伝いします。"],["p832", "Thank you for coming out today.", "今日は来てくれてありがとう。"]],
  r:[["What do you do on weekends?", 0],["We're looking for volunteers for the festival.", 6],["I want to join the next event.", 4]],
  c:{sit:"地域の集まりで話しかけられる",t:[["You look familiar. Do you help out around town?", 0],["That's great. We're cleaning the park this Sunday.", 4],["Just come at nine. Anyone is welcome.", 6]]}},
 {t:"第百五歩 健康診断",d:"検査と結果の話",p:[
  ["p833", "I have a checkup next week.", "来週、健康診断があります。"],["p834", "Do I need to fast before the test?", "検査の前は絶食する必要がありますか？"],["p835", "Please roll up your sleeve.", "袖をまくってください。"],["p836", "Take a deep breath.", "深く息を吸ってください。"],["p837", "When will I get the results?", "結果はいつわかりますか？"],["p838", "Everything looks normal.", "すべて正常です。"],["p839", "I'm a bit nervous about needles.", "注射が少し苦手です。"],["p840", "Should I change my diet?", "食生活を変えたほうがいいですか？"]],
  r:[["We'll take some blood now.", 6],["Doctor, how were my test results?", 5, "医師として結果を伝える"],["Your blood pressure is a little high.", 7]],
  c:{sit:"クリニックで健康診断を受ける",t:[["Good morning. We'll do a blood test today.", 1],["No, not for this test. Now, I'll take some blood.", 6],["It's quick. All done! You did well.", 4]]}},
 {t:"第百六歩 運動",d:"ジムやスポーツを始める",p:[
  ["p841", "I'd like to join the gym.", "ジムに入会したいのですが。"],["p842", "How much is the monthly fee?", "月会費はいくらですか？"],["p843", "Can you show me how to use this?", "これの使い方を教えてもらえますか？"],["p844", "I'm out of shape.", "体がなまっています。"],["p845", "Let's warm up first.", "まずは準備運動をしましょう。"],["p846", "My legs are sore.", "脚が筋肉痛です。"],["p847", "I ran five kilometers today.", "今日は5キロ走りました。"],["p848", "Don't push yourself too hard.", "無理をしすぎないでね。"]],
  r:[["Welcome to Sunny Gym. How can I help?", 0],["Why are you walking so slowly?", 5],["I'll run ten kilometers today!", 7]],
  c:{sit:"ジムで受付の人と話す",t:[["Hi there! Are you interested in our gym?", 0],["It's forty dollars a month. Have you exercised much before?", 3],["No problem. A trainer can help you. Ready to start?", 4]]}},
 {t:"第百七歩 料理教室",d:"レシピと作り方",p:[
  ["p849", "First, cut the onions.", "まず、玉ねぎを切ります。"],["p850", "Boil the water.", "お湯を沸かします。"],["p851", "Add a pinch of salt.", "塩をひとつまみ加えます。"],["p852", "Mix it well.", "よく混ぜます。"],["p853", "Bake it for twenty minutes.", "20分焼きます。"],["p854", "Be careful, it's hot.", "気をつけて、熱いですよ。"],["p855", "How much sugar do I need?", "砂糖はどのくらい必要ですか？"],["p856", "It turned out great.", "うまくできました。"]],
  r:[["What do we do after cutting the vegetables?", 1],["I'll take it out of the oven now.", 5],["How did your cake turn out?", 7]],
  c:{sit:"料理教室で先生と話す",t:[["Today we're making apple pie. Let's begin.", 6],["Just one cup. Now, what's the next step?", 3],["Perfect. Let's see the result. How does it look?", 7]]}},
 {t:"第百八歩 サポート",d:"ネットのアカウントで困る",p:[
  ["p857", "I can't log in.", "ログインできません。"],["p858", "I forgot my password.", "パスワードを忘れました。"],["p859", "I didn't get the email.", "メールが届いていません。"],["p860", "Could you reset my account?", "アカウントをリセットしてもらえますか？"],["p861", "The app keeps crashing.", "アプリが何度も落ちます。"],["p862", "I was charged twice.", "二重に請求されました。"],["p863", "I'd like to cancel my subscription.", "定期購読を解約したいのですが。"],["p864", "It's working now.", "今は動いています。"]],
  r:[["Hello, support team. What seems to be the problem?", 0],["We sent you a confirmation email.", 2],["Please restart your phone and try again.", 7]],
  c:{sit:"アプリのサポートに問い合わせる",t:[["Thank you for contacting support. What can I do for you?", 1],["I just sent you a reset link. Did it arrive?", 2],["I sent it again. Can you try to log in now?", 7]]}},
 {t:"第百九歩 オンライン",d:"ビデオ通話で話す",p:[
  ["p865", "Can you see my screen?", "私の画面は見えますか？"],["p866", "You're on mute.", "ミュートになっていますよ。"],["p867", "Your voice is breaking up.", "声が途切れています。"],["p868", "I'll share the link in the chat.", "チャットにリンクを貼ります。"],["p869", "Let me turn on my camera.", "カメラをオンにします。"],["p870", "Can everyone hear me?", "みなさん聞こえますか？"],["p871", "I think I lost the connection.", "接続が切れたようです。"],["p872", "Let's end the call here.", "通話はここで終わりにしましょう。"]],
  r:[["Hello? Can you hear me okay?", 1, "相手がミュートのまま話している"],["Please share your slides with us.", 0],["Where can I find the document?", 3]],
  c:{sit:"オンライン会議に参加する",t:[["Hello? We can hear you, but we can't see you.", 4],["There you are! Can you show us the slides?", 0],["Yes. Could you also send us the document?", 3]]}},
 {t:"第百十歩 日程",d:"会議の日時を決める",p:[
  ["p873", "When are you available?", "いつご都合がいいですか？"],["p874", "Does Thursday work for you?", "木曜日はご都合いかがですか？"],["p875", "I'm booked all morning.", "午前中はずっと予定が入っています。"],["p876", "How about the afternoon?", "午後はどうですか？"],["p877", "Let's pencil it in.", "仮で予定に入れておきましょう。"],["p878", "I'll send you an invitation.", "招待を送ります。"],["p879", "Can we push it back an hour?", "1時間遅らせてもいいですか？"],["p880", "See you then.", "では、そのときに。"]],
  r:[["We need to talk about the budget this week.", 0],["How about ten in the morning?", 2],["Thursday at three is perfect.", 5]],
  c:{sit:"取引先と打ち合わせの日を決める",t:[["We should meet to talk about the new project.", 0],["How about Tuesday morning?", 2],["Sure, Tuesday at two then.", 5]]}},
 {t:"第百十一歩 おわび",d:"仕事でていねいにあやまる",p:[
  ["p881", "I apologize for the delay.", "遅れて申し訳ありません。"],["p882", "It was my mistake.", "私のミスでした。"],["p883", "It won't happen again.", "二度と起こさないようにします。"],["p884", "Let me fix it right away.", "すぐに直します。"],["p885", "I understand your frustration.", "お怒りはごもっともです。"],["p886", "We'll send a replacement today.", "本日、代わりの品をお送りします。"],["p887", "Thank you for your patience.", "お待ちいただきありがとうございます。"],["p888", "Is there anything else I can do?", "ほかに何かできることはありますか？"]],
  r:[["The report you sent has many errors.", 3],["I've been waiting for two weeks!", 4, "客として怒っている相手に"],["Okay, the new one arrived.", 7]],
  c:{sit:"取引先から苦情の電話が来る",t:[["Your delivery was supposed to arrive last week.", 0],["Our customers are waiting. This is a big problem for us.", 4],["All right. Please make sure this doesn't happen again.", 2]]}},
 {t:"第百十二歩 おすすめ",d:"人にすすめる・説得する",p:[
  ["p889", "You should definitely try it.", "ぜひ試してみてください。"],["p890", "Trust me, it's worth it.", "信じて、その価値はありますよ。"],["p891", "It's better than you think.", "思っているよりいいですよ。"],["p892", "Why not give it a try?", "ためしにやってみたら？"],["p893", "I highly recommend this place.", "この場所を強くおすすめします。"],["p894", "You won't regret it.", "後悔しませんよ。"],["p895", "What have you got to lose?", "失うものなんてないでしょう？"],["p896", "Fine, you've convinced me.", "わかった、納得しました。"]],
  r:[["I don't know. Sushi with fruit sounds strange.", 2],["It's expensive. Should I really buy it?", 5],["Come on, just one dance class!", 7]],
  c:{sit:"友人に新しい店をすすめる",t:[["So this is the ramen shop you told me about?", 4],["Hmm, the line is so long, though.", 5],["I'm still not sure. I'm not a big ramen fan.", 6]]}},
 {t:"第百十三歩 あいづち",d:"会話に反応する",p:[
  ["p897", "Oh, really?", "へえ、本当に？"],["p898", "No way! Seriously?", "まさか！本当に？"],["p899", "That makes two of us.", "私も同じです。"],["p900", "I know, right?", "だよね！"],["p901", "Good for you!", "よかったね！"],["p902", "Oh, that's a shame.", "ああ、それは残念。"],["p903", "You're kidding!", "冗談でしょう！"],["p904", "Go on, tell me.", "それで？続けて。"]],
  r:[["Guess what? I got a free trip to Hawaii!", 1],["I'm so tired of this rain.", 2],["And then, guess what happened.", 7]],
  c:{sit:"友人の近況を聞く",t:[["Guess what? I got the job at the museum!", 1],["Yes! And the pay is better than my old job.", 4],["Then the boss told me a funny story. Want to hear it?", 7]]}},
 {t:"第百十四歩 頻度",d:"どのくらいの頻度かを話す",p:[
  ["p905", "I always drink coffee in the morning.", "朝はいつもコーヒーを飲みます。"],["p906", "I sometimes eat out.", "ときどき外食します。"],["p907", "I rarely watch TV.", "テレビはめったに見ません。"],["p908", "I never skip breakfast.", "朝食は絶対に抜きません。"],["p909", "How often do you go there?", "そこへはどのくらい行きますか？"],["p910", "About once a month.", "月に1回くらいです。"],["p911", "Every other day.", "1日おきです。"],["p912", "Hardly ever.", "ほとんどありません。"]],
  r:[["Do you always cook dinner yourself?", 1],["How often do you go to the gym?", 6],["Do you ever go to the movies?", 7]],
  c:{sit:"同僚と生活習慣の話をする",t:[["Do you have breakfast every day?", 3],["Wow. Do you ever eat at fast food places?", 7],["Me neither. How often do you go to the gym?", 6]]}},
 {t:"第百十五歩 注意",d:"使い方の注意を伝える",p:[
  ["p913", "Make sure you lock the door.", "必ずドアに鍵をかけてね。"],["p914", "Don't forget to turn off the lights.", "電気を消すのを忘れないで。"],["p915", "Keep it in a cool place.", "涼しい所に保管してください。"],["p916", "Handle with care.", "取り扱いに注意してください。"],["p917", "Read the instructions first.", "まず説明書を読んでください。"],["p918", "Be careful not to burn yourself.", "やけどをしないように気をつけて。"],["p919", "Unplug it after use.", "使ったらコンセントを抜いてください。"],["p920", "Got it.", "わかりました。"]],
  r:[["I'm leaving now. Anything else?", 1],["How should I keep this cheese?", 2],["Remember to unplug the iron.", 7]],
  c:{sit:"留守番を頼む友人に注意を伝える",t:[["I'll take care of your place. Anything I should know?", 0],["Okay. What should I do at night?", 1],["I see. And the heater?", 6]]}},
 {t:"第百十六歩 予想外",d:"予定が変わったことを話す",p:[
  ["p921", "It turned out to be closed.", "結局、閉まっていました。"],["p922", "Plans changed at the last minute.", "直前で予定が変わりました。"],["p923", "We ended up staying home.", "結局、家にいることになりました。"],["p924", "It was better than expected.", "思ったよりよかったです。"],["p925", "Things didn't go as planned.", "計画どおりにはいきませんでした。"],["p926", "We had to change our plans.", "予定を変えなければなりませんでした。"],["p927", "It all worked out in the end.", "最後には全部うまくいきました。"],["p928", "Luckily, it stopped raining.", "運よく雨がやみました。"]],
  r:[["Did you go to the museum yesterday?", 0],["How was your camping trip?", 4],["Was the wedding okay after all that trouble?", 6]],
  c:{sit:"旅行から帰った友人に話を聞く",t:[["So, how was the trip to the island?", 4],["Oh no. What happened?", 5],["So did you have fun in the end?", 6]]}},
 {t:"第百十七歩 見通し",d:"これからのことを予想する",p:[
  ["p929", "It will probably rain.", "たぶん雨が降るでしょう。"],["p930", "I might be a little late.", "少し遅れるかもしれません。"],["p931", "I doubt it.", "それはどうかな。"],["p932", "There's a good chance we'll win.", "勝つ見込みは十分あります。"],["p933", "It's hard to tell.", "なんとも言えません。"],["p934", "I bet he'll forget.", "きっと彼は忘れますよ。"],["p935", "We'll see.", "まあ、様子を見ましょう。"],["p936", "Hopefully, it'll be sunny.", "晴れるといいですね。"]],
  r:[["The meeting starts at noon. Can you make it?", 1],["Do you think our team will win?", 3],["Will Tom remember the meeting?", 5]],
  c:{sit:"週末の予定について友人と話す",t:[["Do you think it'll rain on Saturday?", 0],["Then let's go to the museum instead. Can you come at ten?", 1],["No problem. Do you think Ken will join us?", 2]]}},
 {t:"第百十八歩 好み",d:"好き嫌いをくわしく言う",p:[
  ["p937", "I prefer tea to coffee.", "コーヒーより紅茶のほうが好きです。"],["p938", "I'm not a big fan of horror movies.", "ホラー映画はあまり好きではありません。"],["p939", "I can't stand the heat.", "暑さには耐えられません。"],["p940", "I'm crazy about soccer.", "サッカーに夢中です。"],["p941", "It's not really my style.", "あまり私の好みではありません。"],["p942", "I'd rather stay in tonight.", "今夜は家にいたいです。"],["p943", "Either is fine with me.", "どちらでもかまいません。"],["p944", "I used to hate vegetables.", "昔は野菜が大嫌いでした。"]],
  r:[["Coffee or tea?", 0],["Let's watch this scary movie!", 1],["Do you want to go out tonight?", 5]],
  c:{sit:"友人と夜の予定を決める",t:[["Let's go to a horror movie tonight!", 1],["Okay. Then, how about a beach trip tomorrow? It's going to be hot.", 2],["Fine. Let's do something indoors. Movie or museum?", 6]]}},
 {t:"第百十九歩 思い出",d:"昔の思い出を語る",p:[
  ["p945", "Do you remember our first trip?", "最初の旅行を覚えていますか？"],["p946", "I'll never forget that day.", "あの日のことは決して忘れません。"],["p947", "We were so young back then.", "あのころ私たちはとても若かった。"],["p948", "It seems like yesterday.", "昨日のことのようです。"],["p949", "That was a long time ago.", "ずいぶん昔のことです。"],["p950", "We laughed so much.", "本当によく笑いましたね。"],["p951", "I still have the photos.", "今でも写真を持っています。"],["p952", "Time flies.", "時が経つのは早いですね。"]],
  r:[["We met ten years ago today.", 3],["Can you show me pictures of the trip?", 6],["My daughter starts college next year.", 7]],
  c:{sit:"古い友人と昔の写真を見る",t:[["Look at this picture from our school trip.", 3],["We were so young back then! And we got lost in the city.", 5],["Do you have any more pictures from that trip?", 6]]}},
 {t:"第百二十歩 旅立ちの空港",d:"別れのあいさつと約束",p:[
  ["p953", "I'm going to miss this place.", "この場所が恋しくなります。"],["p954", "Thank you for showing me around.", "案内してくれてありがとう。"],["p955", "Let me know when you visit Japan.", "日本に来るときは知らせてね。"],["p956", "I'll send you the photos.", "写真を送りますね。"],["p957", "Have a safe flight.", "気をつけて、よい空の旅を。"],["p958", "Let's meet again soon.", "また近いうちに会いましょう。"],["p959", "Take care, my friend.", "元気でね、またね。"],["p960", "Until next time.", "また次の機会に。"]],
  r:[["So, this is goodbye for now.", 0],["I'd love to visit Japan someday.", 2],["My plane leaves in ten minutes.", 4]],
  c:{sit:"旅の最終日、空港で友人と別れる",t:[["Well, this is it. Your plane leaves soon.", 0],["We'll miss you too. Will you come back someday?", 5],["I'd like that. Goodbye for now!", 6]]}},
 {t:"第百二十一歩 美術館",d:"作品を見て感想を言う",p:[
  ["p961", "Who painted this?", "これはだれが描いたのですか？"],["p962", "I love the colors.", "色づかいが大好きです。"],["p963", "What do you think it means?", "どういう意味だと思いますか？"],["p964", "It's a bit strange, but interesting.", "少し変わっていますが、面白いです。"],["p965", "Is there an audio guide?", "音声ガイドはありますか？"],["p966", "No flash photography, please.", "フラッシュ撮影はご遠慮ください。"],["p967", "This is my favorite piece.", "これがいちばん好きな作品です。"],["p968", "Let's go to the gift shop.", "ミュージアムショップに行きましょう。"]],
  r:[["Look at this painting. It's very famous.", 0],["How do you like this modern art?", 3],["We still have time before closing.", 7]],
  c:{sit:"友人と美術館をまわる",t:[["Here we are. This painting is over three hundred years old.", 0],["A famous Dutch artist. What do you think of the colors?", 1],["Me too. That's enough art for today. Shall we buy something?", 7]]}},
 {t:"第百二十二歩 映画館",d:"チケットを買って映画を見る",p:[
  ["p969", "Two tickets for the seven o'clock show.", "7時の回を2枚お願いします。"],["p970", "Are there any seats left?", "まだ席はありますか？"],["p971", "Can we sit together?", "並んで座れますか？"],["p972", "Where is screen three?", "3番スクリーンはどこですか？"],["p973", "Let's get some popcorn.", "ポップコーンを買いましょう。"],["p974", "Please turn off your phone.", "携帯電話の電源をお切りください。"],["p975", "That was so exciting!", "すごくわくわくしました！"],["p976", "The sequel comes out next year.", "続編は来年公開です。"]],
  r:[["Hello. How many tickets, and for what time?", 0],["There are a few seats left in the back.", 2],["So, what did you think of the movie?", 6]],
  c:{sit:"映画館の窓口で",t:[["Hello. What can I get for you?", 0],["We have seats in the front row only.", 2],["Yes, you can. Enjoy the movie!", 4]]}},
 {t:"第百二十三歩 祝いの席",d:"結婚式やパーティーでのふるまい",p:[
  ["p977", "Congratulations to you both.", "お二人とも、おめでとうございます。"],["p978", "You look beautiful.", "とてもきれいです。"],["p979", "How did you two meet?", "お二人はどうやって出会ったのですか？"],["p980", "Let's make a toast.", "乾杯しましょう。"],["p981", "Cheers to the happy couple!", "幸せなお二人に乾杯！"],["p982", "It was a lovely ceremony.", "すてきな式でした。"],["p983", "Where should I sit?", "どこに座ればいいですか？"],["p984", "Thank you for having me.", "招いてくれてありがとう。"]],
  r:[["We're so glad you could come!", 7],["Everyone, please raise your glasses.", 4],["What did you think of the wedding?", 5]],
  c:{sit:"友人の結婚式の受付で",t:[["Hello! Thank you so much for coming.", 7],["Please go inside. The party starts soon.", 6],["The speech is over. Everyone, please raise your glasses.", 4]]}},
 {t:"第百二十四歩 お見舞い",d:"入院している人を見舞う",p:[
  ["p985", "How are you feeling today?", "今日の具合はどうですか？"],["p986", "I brought you some flowers.", "お花を持ってきました。"],["p987", "You look much better.", "ずいぶん元気そうですね。"],["p988", "Get well soon.", "早くよくなってね。"],["p989", "Is there anything you need?", "何か必要なものはありますか？"],["p990", "Don't worry about work.", "仕事のことは心配しないで。"],["p991", "When can you leave the hospital?", "いつ退院できますか？"],["p992", "I'll come again tomorrow.", "明日また来ますね。"]],
  r:[["Oh, you came to see me! What's that?", 1],["I'm worried about my team at the office.", 5],["I should go home on Friday.", 7]],
  c:{sit:"入院中の友人を見舞う",t:[["Oh, hi! It's so nice of you to come.", 0],["Much better, thanks. The nurses are very kind.", 4],["Just some magazines, if you don't mind.", 7]]}},
 {t:"第百二十五歩 寮",d:"寮で同居人と暮らす",p:[
  ["p993", "Hi, I'm your new roommate.", "こんにちは、新しいルームメイトです。"],["p994", "Which bed is mine?", "どっちのベッドが私のですか？"],["p995", "Do you mind if I open the window?", "窓を開けてもかまいませんか？"],["p996", "Could you keep it down a little?", "少し静かにしてもらえますか？"],["p997", "Let's make some house rules.", "部屋のルールを決めましょう。"],["p998", "Can I use your charger?", "充電器を使ってもいいですか？"],["p999", "I'll be back late tonight.", "今夜は遅く帰ります。"],["p1000", "Help yourself to the snacks.", "お菓子は自由に食べてね。"]],
  r:[["Hi! Can I help you? This is my room.", 0],["Sorry, I'm practicing my guitar.", 3],["It's so hot in here, isn't it?", 2]],
  c:{sit:"寮の部屋で、新しい同居人と会う",t:[["Hello! You must be my new roommate.", 1],["The one by the door. Do you mind if I try your cookies?", 7],["Thanks! By the way, I usually come home late.", 4]]}},
 {t:"第百二十六歩 アルバイト",d:"アルバイトを探して働く",p:[
  ["p1001", "Are you hiring?", "人を募集していますか？"],["p1002", "I'd like to apply for the job.", "その仕事に応募したいのですが。"],["p1003", "I can work on weekends.", "週末に働けます。"],["p1004", "What's the hourly wage?", "時給はいくらですか？"],["p1005", "When is my first shift?", "最初のシフトはいつですか？"],["p1006", "Could I take Friday off?", "金曜日を休んでもいいですか？"],["p1007", "I'm still learning the job.", "まだ仕事を覚えているところです。"],["p1008", "I really enjoy working here.", "ここで働くのがとても楽しいです。"]],
  r:[["Hi. Can I help you?", 0, "アルバイト募集の紙を見た"],["When are you available?", 2],["You started last week, right? How is it going?", 7]],
  c:{sit:"カフェの店長と話す",t:[["So, you want to work at our cafe?", 1],["Great. When can you work?", 2],["Perfect. You're hired!", 4]]}},
 {t:"第百二十七歩 接客",d:"店員としてお客に応対する",p:[
  ["p1009", "Hi, how can I help you?", "いらっしゃいませ。どうなさいましたか？"],["p1010", "Let me check if we have it.", "在庫があるか確認します。"],["p1011", "It's on the second floor.", "2階にございます。"],["p1012", "We're out of stock right now.", "ただいま品切れです。"],["p1013", "Would you like to try it on?", "試着なさいますか？"],["p1014", "Cash or card?", "現金ですか、カードですか？"],["p1015", "Here's your receipt.", "レシートでございます。"],["p1016", "Have a great day.", "よい一日を。"]],
  r:[["Excuse me, I'm looking for this shirt in blue.", 1],["Do you have this bag in black?", 3],["Where can I find the toys?", 2]],
  c:{sit:"店員として客に応対する",t:[["Excuse me, do you work here?", 0],["I'm looking for this coat in a medium size.", 1],["Thank you. Did you find one?", 3]]}},
 {t:"第百二十八歩 写真",d:"写真を撮る・SNSに上げる",p:[
  ["p1017", "Could you take a photo of us?", "写真を撮っていただけますか？"],["p1018", "Just press this button.", "このボタンを押すだけです。"],["p1019", "One more, please.", "もう一枚お願いします。"],["p1020", "Say cheese!", "はい、チーズ！"],["p1021", "Can I post this online?", "これをネットに上げてもいいですか？"],["p1022", "Please tag me.", "私をタグ付けしてね。"],["p1023", "This photo came out great.", "この写真はよく撮れましたね。"],["p1024", "I'll send it to you later.", "あとで送りますね。"]],
  r:[["Sure, I can take your picture. How does it work?", 1],["Okay, here you go. Is that all right?", 2, "目を閉じてしまった"],["Wow, can I have a copy of that photo?", 7]],
  c:{sit:"観光地で写真を頼む",t:[["Excuse me, can I help you with something?", 0],["Of course. Okay, here you go. How is it?", 2],["Sure. There, that one is much better.", 6]]}},
 {t:"第百二十九歩 年中行事",d:"日本の行事を紹介する",p:[
  ["p1025", "We celebrate New Year with family.", "お正月は家族で祝います。"],["p1026", "We visit shrines in January.", "1月には神社にお参りします。"],["p1027", "Children get money as a gift.", "子どもたちはお金をもらいます。"],["p1028", "Cherry blossom season is in spring.", "花見の季節は春です。"],["p1029", "We watch fireworks in summer.", "夏には花火を見ます。"],["p1030", "We eat special food on that day.", "その日には特別な料理を食べます。"],["p1031", "It's a national holiday.", "それは国民の祝日です。"],["p1032", "Everyone goes back to their hometown.", "みんな故郷に帰ります。"]],
  r:[["What do Japanese people do on New Year's Day?", 0],["When is the best time to see the cherry trees?", 3],["Why are the trains so crowded in August?", 7]],
  c:{sit:"海外の友人に日本の夏を説明する",t:[["What do people in Japan do in summer?", 4],["That sounds beautiful. Do people take time off?", 7],["I heard there's a summer day for eating eel. Is that true?", 5]]}},
 {t:"第百三十歩 食の好み",d:"食べられないものを伝える",p:[
  ["p1033", "I'm a vegetarian.", "私はベジタリアンです。"],["p1034", "I don't eat pork.", "豚肉は食べません。"],["p1035", "Does this contain any meat?", "これに肉は入っていますか？"],["p1036", "Can you make it without onions?", "玉ねぎ抜きで作れますか？"],["p1037", "I'm trying to cut down on sugar.", "砂糖を控えようとしています。"],["p1038", "I'll pass on dessert.", "デザートはやめておきます。"],["p1039", "That's very thoughtful of you.", "お気づかい、ありがとうございます。"],["p1040", "Everything looks delicious.", "どれもおいしそうですね。"]],
  r:[["Would you like some chicken?", 0],["And how about a piece of cake?", 5],["I made a vegetable dish just for you.", 6]],
  c:{sit:"友人の家で夕食に招かれる",t:[["Welcome! I made beef stew tonight.", 0],["Oh, I'm sorry! I didn't know. Let me make something else.", 6],["Here's a salad and some soup. Would you like cake too?", 5]]}},
 {t:"第百三十一歩 図書館",d:"図書館で本を借りる",p:[
  ["p1041", "I'd like to borrow this book.", "この本を借りたいのですが。"],["p1042", "How long can I keep it?", "どのくらい借りられますか？"],["p1043", "When is it due?", "返却日はいつですか？"],["p1044", "I'd like to renew it.", "貸出を延長したいのですが。"],["p1045", "Do you have any books on cooking?", "料理の本はありますか？"],["p1046", "Can I study here?", "ここで勉強してもいいですか？"],["p1047", "Please be quiet in the library.", "図書館ではお静かにお願いします。"],["p1048", "I need a library card.", "図書館カードが必要です。"]],
  r:[["Hello. How can I help you today?", 0],["Here's your book. Please return it on time.", 2],["Your book is due today.", 3]],
  c:{sit:"図書館のカウンターで",t:[["Good afternoon. Can I help you?", 0],["Sure. Your card, please.", 2],["Two weeks from today. Anything else?", 4]]}},
 {t:"第百三十二歩 貸し借り",d:"物やお金を貸し借りする",p:[
  ["p1049", "Can I borrow some money?", "少しお金を借りてもいいですか？"],["p1050", "I'll pay you back tomorrow.", "明日返します。"],["p1051", "Can you lend me an umbrella?", "傘を貸してもらえますか？"],["p1052", "Keep it as long as you need.", "必要なだけ持っていていいよ。"],["p1053", "I still owe you lunch.", "まだお昼をおごる借りがあります。"],["p1054", "Don't worry, it's on me.", "気にしないで、私が払います。"],["p1055", "Here's the money I borrowed.", "借りたお金です。"],["p1056", "You can have it.", "あげますよ。"]],
  r:[["Oh no, I left my wallet at home.", 5],["Sure, here's ten dollars.", 1],["Thanks for the book. When do you need it back?", 3]],
  c:{sit:"同僚と昼食に行く",t:[["Let's get lunch. Oh, did you forget your wallet?", 0],["Sure. Here you go.", 1],["No rush. And remember, I bought you lunch last week.", 4]]}},
 {t:"第百三十三歩 自転車",d:"レンタサイクルで出かける",p:[
  ["p1057", "I'd like to rent a bike.", "自転車を借りたいのですが。"],["p1058", "How much is it for a day?", "1日いくらですか？"],["p1059", "Do I need a helmet?", "ヘルメットは必要ですか？"],["p1060", "The tire is flat.", "タイヤがパンクしています。"],["p1061", "Where can I park my bike?", "自転車はどこに止められますか？"],["p1062", "Is there a bike lane?", "自転車レーンはありますか？"],["p1063", "The brakes don't work well.", "ブレーキの効きが悪いです。"],["p1064", "I'll return it by six.", "6時までに返します。"]],
  r:[["Good morning. What can I do for you?", 0],["This bike is ready for you. Any questions?", 2],["When will you bring it back?", 7]],
  c:{sit:"レンタサイクルの店で",t:[["Hello. Do you need a bike today?", 0],["It's fifteen dollars a day. Here's your bike.", 2],["Yes, please wear one. When will you bring it back?", 7]]}},
 {t:"第百三十四歩 動物病院",d:"ペットを病院に連れていく",p:[
  ["p1065", "My dog isn't eating.", "うちの犬が食べないんです。"],["p1066", "He's been sleeping all day.", "一日中寝ています。"],["p1067", "Is it serious?", "深刻なのでしょうか？"],["p1068", "How often should I give him this?", "これはどのくらいの頻度であげればいいですか？"],["p1069", "Can I leave my cat here for a week?", "猫を一週間預けられますか？"],["p1070", "She needs her shots.", "予防接種が必要です。"],["p1071", "He's much better now.", "今はずっと元気です。"],["p1072", "Thank you for taking care of her.", "この子を診てくださってありがとう。"]],
  r:[["Hello. What seems to be the problem with your dog?", 0],["It's just a small cold. Here's some medicine.", 3],["Is your dog feeling better?", 6]],
  c:{sit:"動物病院で獣医と話す",t:[["Hello. What brings you and your dog here today?", 0],["I see. Is there anything else?", 1],["Okay. It's not serious. Give him this medicine.", 3]]}},
 {t:"第百三十五歩 修理",d:"壊れた物を修理に出す",p:[
  ["p1073", "My phone screen is cracked.", "携帯の画面が割れています。"],["p1074", "Can you fix it?", "直せますか？"],["p1075", "How long will the repair take?", "修理にどのくらいかかりますか？"],["p1076", "How much will it cost?", "いくらかかりますか？"],["p1077", "Is it still under warranty?", "まだ保証期間内ですか？"],["p1078", "Please back up your data.", "データのバックアップを取ってください。"],["p1079", "It's as good as new.", "新品同様です。"],["p1080", "Can I pick it up today?", "今日受け取れますか？"]],
  r:[["Hello. What's wrong with your phone?", 0],["We can replace the screen.", 2],["Wow, is my phone really fixed already?", 6, "店員として渡す"]],
  c:{sit:"携帯の修理店で",t:[["Hi there. What happened to your phone?", 0],["I see. We can replace the screen.", 2],["It's fifty dollars. We're very busy today, though.", 7]]}},
 {t:"第百三十六歩 口コミ",d:"評判やレビューの話",p:[
  ["p1081", "This place has great reviews.", "ここは評判がいいです。"],["p1082", "I read about it online.", "ネットで読みました。"],["p1083", "Is it as good as people say?", "うわさどおりいいですか？"],["p1084", "It's a bit overrated.", "少し評価されすぎです。"],["p1085", "I'll leave a review.", "レビューを書きます。"],["p1086", "Five stars from me.", "私は星五つです。"],["p1087", "The service was slow.", "サービスが遅かったです。"],["p1088", "It lived up to my expectations.", "期待どおりでした。"]],
  r:[["How did you find this restaurant?", 1],["So, was the food good?", 7],["Do you like the new cafe everyone's talking about?", 3]],
  c:{sit:"友人と新しいレストランへ行く",t:[["Why did you choose this restaurant?", 0],["Really? Where did you hear about it?", 1],["So, what do you think of the food?", 7]]}},
 {t:"第百三十七歩 時間",d:"忙しさと優先順位",p:[
  ["p1089", "I'm swamped this week.", "今週は仕事に追われています。"],["p1090", "I don't have time for that.", "そんな時間はありません。"],["p1091", "Let's focus on what's important.", "大事なことに集中しましょう。"],["p1092", "First things first.", "まずは大事なことから。"],["p1093", "I'll make time for it.", "時間を作ります。"],["p1094", "Can it wait until tomorrow?", "明日まで待てますか？"],["p1095", "I'm running behind schedule.", "予定より遅れています。"],["p1096", "Let's take it one step at a time.", "一歩ずつ進めましょう。"]],
  r:[["Can you help me with this report today?", 0],["There are so many tasks. Where do we start?", 3],["This is not urgent. I just wanted to ask.", 5]],
  c:{sit:"同僚に仕事を頼まれる",t:[["Hey, can you help me plan the party this afternoon?", 0],["Oh, I see. When will you have some time?", 4],["Thanks. But there's so much to plan.", 2]]}},
 {t:"第百三十八歩 自信",d:"自分を励ます・ほめる",p:[
  ["p1097", "I'm proud of myself.", "自分を誇りに思います。"],["p1098", "I did my best.", "ベストを尽くしました。"],["p1099", "I'm getting better.", "上達しています。"],["p1100", "Mistakes help me learn.", "まちがいは学びになります。"],["p1101", "I believe I can do it.", "できると信じています。"],["p1102", "I'm not giving up.", "あきらめません。"],["p1103", "I've learned so much.", "たくさん学びました。"],["p1104", "Let's celebrate the small wins.", "小さな成功を祝いましょう。"]],
  r:[["How do you feel after the test?", 1],["You made many mistakes today.", 3],["Three months ago, you couldn't say anything.", 2]],
  c:{sit:"試験のあと友人と話す",t:[["You look happy. How did the speaking test go?", 1],["That's great. Did you make any mistakes?", 3],["You've really changed this year.", 6]]}},
 {t:"第百三十九歩 未来の旅",d:"次の旅の計画を語る",p:[
  ["p1105", "Next year, I want to go to Canada.", "来年はカナダに行きたいです。"],["p1106", "I'm saving up for it.", "そのためにお金を貯めています。"],["p1107", "I want to see the northern lights.", "オーロラを見たいです。"],["p1108", "I'll speak English the whole time.", "ずっと英語で話します。"],["p1109", "I'm going to stay with a host family.", "ホームステイをする予定です。"],["p1110", "I've already started planning.", "もう計画を立て始めています。"],["p1111", "It's going to be an adventure.", "冒険になりそうです。"],["p1112", "Come with me if you can.", "行けるなら一緒に来てね。"]],
  r:[["Where do you want to travel next?", 0],["Canada is so expensive, isn't it?", 1],["What will you do there?", 2]],
  c:{sit:"友人と次の旅の話をする",t:[["Do you have any plans for next year?", 0],["Wow! Have you booked anything yet?", 5],["That sounds amazing. I wish I could go.", 7]]}},
 {t:"第百四十歩 次の月",d:"ここからの学びを決める",p:[
  ["p1113", "This is just the beginning.", "これはまだ始まりです。"],["p1114", "I want to keep improving.", "これからも上達したいです。"],["p1115", "My next goal is to read a novel.", "次の目標は小説を読むことです。"],["p1116", "I'll practice with native speakers.", "ネイティブスピーカーと練習します。"],["p1117", "I'm not afraid to speak anymore.", "もう話すのがこわくありません。"],["p1118", "Thank you for walking with me.", "一緒に歩いてくれてありがとう。"],["p1119", "See you on the next path.", "次の道で会いましょう。"],["p1120", "Let's aim higher.", "もっと高くを目指しましょう。"]],
  r:[["You've finished so many lessons. What's next?", 2],["Do you still feel nervous speaking English?", 4],["It was a long road together, wasn't it?", 5]],
  c:{sit:"ここまでの学びをふり返る",t:[["Look how far you've come. How do you feel?", 0],["What will you do next?", 1],["Then let's go. The next path is waiting.", 7]]}},
 {t:"第百四十一歩 乗り換え",d:"電車を乗り換える",p:[
  ["p1121", "Where do I change trains?", "どこで乗り換えればいいですか？"],["p1122", "Which platform is it?", "何番線ですか？"],["p1123", "I need to top up my card.", "カードにチャージしなければなりません。"],["p1124", "Is this the express?", "これは急行ですか？"],["p1125", "Does it stop at Shibuya?", "渋谷に止まりますか？"],["p1126", "I missed my stop.", "降りる駅を乗り過ごしました。"],["p1127", "The next train comes in five minutes.", "次の電車は5分後に来ます。"],["p1128", "Let's take the local train.", "各駅停車に乗りましょう。"]],
  r:[["You want to go to the airport? Change at the next station.", 1],["Your card balance is too low.", 2],["Why are you getting off here? This isn't your station.", 5]],
  c:{sit:"駅で駅員に行き方を聞く",t:[["Hello. Can I help you find your way?", 0],["Change at Central Station to the Blue Line.", 1],["Platform four. Please check the board for the next train.", 6]]}},
 {t:"第百四十二歩 タクシー",d:"タクシーで移動する",p:[
  ["p1129", "To the airport, please.", "空港までお願いします。"],["p1130", "How long will it take?", "どのくらいかかりますか？"],["p1131", "Could you hurry, please?", "急いでもらえますか？"],["p1132", "Please stop here.", "ここで止めてください。"],["p1133", "Can I get a receipt?", "領収書をもらえますか？"],["p1134", "Is there a lot of traffic?", "道は混んでいますか？"],["p1135", "Could you open the trunk?", "トランクを開けてもらえますか？"],["p1136", "Keep the change, please.", "おつりはとっておいてください。"]],
  r:[["Good evening. Where to?", 0],["It's twenty dollars and fifty cents.", 7],["Here's your receipt. Do you have any bags?", 6]],
  c:{sit:"タクシーで空港へ向かう",t:[["Good morning. Where would you like to go?", 0],["About forty minutes, if the traffic is light.", 5],["We're here. That's thirty dollars.", 4]]}},
 {t:"第百四十三歩 おもてなし",d:"家に客を招く",p:[
  ["p1137", "Come on in.", "どうぞ入って。"],["p1138", "Can I take your coat?", "コートをお預かりしましょうか？"],["p1139", "Make yourself comfortable.", "楽にしてくださいね。"],["p1140", "Would you like something to drink?", "何か飲みますか？"],["p1141", "Dinner will be ready soon.", "夕食はもうすぐできます。"],["p1142", "Please help yourself.", "どうぞご自由に。"],["p1143", "I'm glad you could make it.", "来てくれてうれしいです。"],["p1144", "Let me walk you to the station.", "駅まで送りますね。"]],
  r:[["Hi! Sorry, I'm a little late.", 6],["It's cold outside. This coat is so heavy.", 1],["It's getting late. I should go.", 7]],
  c:{sit:"自宅に同僚を招く",t:[["Hi! I hope I'm not too early.", 6],["Thank you. Your house is lovely.", 3],["Tea would be great, thank you.", 4]]}},
 {t:"第百四十四歩 出前",d:"デリバリーと持ち帰り",p:[
  ["p1145", "I'd like to order a delivery.", "デリバリーを注文したいのですが。"],["p1146", "How long will the delivery take?", "配達にどのくらいかかりますか？"],["p1147", "Is there a delivery fee?", "配達料はかかりますか？"],["p1148", "I'll pick it up myself.", "自分で取りに行きます。"],["p1149", "Can I pay when it arrives?", "届いたときに払えますか？"],["p1150", "I think something is missing.", "何か足りないようです。"],["p1151", "The food arrived cold.", "料理が冷めて届きました。"],["p1152", "Please ring the doorbell.", "呼び鈴を鳴らしてください。"]],
  r:[["Thank you for calling Pizza House.", 0],["It will take about an hour to deliver.", 3],["Your order is here. Enjoy!", 5, "頼んだ飲み物が入っていない"]],
  c:{sit:"レストランに電話で注文する",t:[["Golden Dragon. How can I help you?", 0],["Sure. I've got your order and your address.", 1],["About fifty minutes. Anything else?", 2]]}},
 {t:"第百四十五歩 服",d:"服の好みを話す",p:[
  ["p1153", "What do you think of this jacket?", "このジャケット、どう思う？"],["p1154", "It suits you.", "似合っていますね。"],["p1155", "It's a little too tight.", "少しきついです。"],["p1156", "I prefer darker colors.", "暗めの色のほうが好きです。"],["p1157", "It goes well with your shoes.", "靴とよく合っていますね。"],["p1158", "I usually dress casually.", "ふだんはカジュアルな服を着ます。"],["p1159", "Where did you get that shirt?", "そのシャツはどこで買ったの？"],["p1160", "It's on trend this year.", "今年はやっています。"]],
  r:[["I'm wearing my new jacket today.", 1],["How does that one fit?", 2],["Do you ever wear suits?", 5]],
  c:{sit:"友人と服を買いに行く",t:[["Hmm, I'm not sure about this blue jacket.", 3],["Okay, I'll try the black one. What do you think?", 1],["Thanks! Does it look okay with these shoes?", 4]]}},
 {t:"第百四十六歩 ほめ言葉",d:"相手をほめる",p:[
  ["p1161", "You got a haircut!", "髪を切ったんですね！"],["p1162", "It looks great on you.", "とても似合っています。"],["p1163", "You have a great sense of style.", "センスがいいですね。"],["p1164", "Your English is improving.", "英語が上達していますね。"],["p1165", "That was a great idea.", "いい考えでしたね。"],["p1166", "You're so good at this.", "これが本当に上手ですね。"],["p1167", "Thank you, that means a lot.", "ありがとう、すごくうれしいです。"],["p1168", "I learned it from you.", "あなたから学んだんです。"]],
  r:[["Do you notice anything different about me?", 0],["Your English is excellent now.", 6],["Your cooking is so good. Who taught you?", 7]],
  c:{sit:"久しぶりに同僚と会う",t:[["Good morning! Do you notice anything new?", 0],["Thanks! And your presentation yesterday was amazing.", 6],["I mean it. Where did you learn to speak so well?", 7]]}},
 {t:"第百四十七歩 季節の不調",d:"季節の体調を話す",p:[
  ["p1169", "My nose is running.", "鼻水が出ます。"],["p1170", "I have a sore throat.", "のどが痛いです。"],["p1171", "My eyes are itchy.", "目がかゆいです。"],["p1172", "I think it's hay fever.", "花粉症だと思います。"],["p1173", "I can't stop sneezing.", "くしゃみが止まりません。"],["p1174", "I feel a bit cold.", "少し寒気がします。"],["p1175", "I'll take the day off.", "今日は休みます。"],["p1176", "Drink plenty of water.", "水をたくさん飲んでね。"]],
  r:[["You keep touching your eyes. Are you okay?", 2],["Spring is here! Why are you sneezing so much?", 3],["I think I'm catching a cold.", 7]],
  c:{sit:"春の朝、同僚に話しかけられる",t:[["You don't look well. What's wrong?", 4],["Oh no. Do you have any other problems?", 2],["You should see a doctor. Maybe it's allergies.", 3]]}},
 {t:"第百四十八歩 歯医者",d:"歯医者で話す",p:[
  ["p1177", "I have a toothache.", "歯が痛いです。"],["p1178", "It hurts when I eat something cold.", "冷たいものを食べると痛みます。"],["p1179", "I'd like to get my teeth cleaned.", "歯のクリーニングをしたいのですが。"],["p1180", "Please open wide.", "大きく口を開けてください。"],["p1181", "Will it hurt?", "痛いですか？"],["p1182", "You have a small cavity.", "小さな虫歯があります。"],["p1183", "Rinse your mouth, please.", "口をすすいでください。"],["p1184", "When should I come back?", "次はいつ来ればいいですか？"]],
  r:[["Hello. What's the problem today?", 0],["I need to fill this tooth.", 4],["All done. Do you have any questions?", 7]],
  c:{sit:"歯医者で受付と診察",t:[["Good morning. What brings you here today?", 0],["I see. When does it hurt?", 1],["Okay, let me look. Open your mouth, please.", 4]]}},
 {t:"第百四十九歩 薬局",d:"薬局で薬を買う",p:[
  ["p1185", "I need something for a headache.", "頭痛の薬がほしいのですが。"],["p1186", "Do I need a prescription for this?", "これは処方せんが必要ですか？"],["p1187", "How many should I take?", "何錠飲めばいいですか？"],["p1188", "Should I take it after meals?", "食後に飲めばいいですか？"],["p1189", "Does it make you sleepy?", "眠くなりますか？"],["p1190", "Do you have it in a smaller box?", "小さい箱はありますか？"],["p1191", "Is it safe for children?", "子どもにも安全ですか？"],["p1192", "I'm already taking other medicine.", "ほかの薬も飲んでいます。"]],
  r:[["Hello. How can I help you?", 0],["Take two tablets three times a day.", 3],["Are you taking any other medicine?", 7]],
  c:{sit:"薬局で薬剤師に相談する",t:[["Hi there. What do you need today?", 0],["This one works well. Any questions?", 4],["No, it won't. Take one after each meal.", 7]]}},
 {t:"第百五十歩 不在票",d:"荷物の再配達を頼む",p:[
  ["p1193", "I missed a delivery.", "荷物を受け取りそびれました。"],["p1194", "I got a missed delivery notice.", "不在票が入っていました。"],["p1195", "Could you deliver it again?", "もう一度配達してもらえますか？"],["p1196", "I'll be home after six.", "6時以降なら家にいます。"],["p1197", "Can I pick it up at the post office?", "郵便局で受け取れますか？"],["p1198", "Here's my tracking number.", "追跡番号はこちらです。"],["p1199", "Please leave it with my neighbor.", "隣の人に預けてください。"],["p1200", "What do I need to bring?", "何を持っていけばいいですか？"]],
  r:[["Hello, post office. How can I help?", 1],["When would you like us to deliver it?", 3],["You can pick it up at our counter.", 7]],
  c:{sit:"郵便局に電話する",t:[["Post office, customer service.", 1],["I can help with that. Do you have the number?", 5],["Thank you. When would you like it?", 3]]}},
 {t:"第百五十一歩 引き継ぎ",d:"休む前に仕事を引き継ぐ",p:[
  ["p1201", "I'll be away next week.", "来週は不在にします。"],["p1202", "Could you cover for me?", "代わりをお願いできますか？"],["p1203", "Here's a list of my tasks.", "これが私の仕事の一覧です。"],["p1204", "The client meeting is on Tuesday.", "取引先との会議は火曜日です。"],["p1205", "Call me if anything comes up.", "何かあったら電話してください。"],["p1206", "Everything is in this folder.", "すべてこのフォルダに入っています。"],["p1207", "I owe you one.", "借りができましたね。"],["p1208", "Leave it to me.", "任せてください。"]],
  r:[["Are you taking a vacation?", 0],["Sure, I can help. What do I need to do?", 2],["No problem. Enjoy your trip.", 6]],
  c:{sit:"休暇の前に同僚と話す",t:[["You look busy today.", 0],["Of course I can help. Where are your files?", 5],["Got it. Have a great vacation.", 6]]}},
 {t:"第百五十二歩 新人",d:"新しい人に仕事を教える",p:[
  ["p1209", "Welcome to the team.", "チームへようこそ。"],["p1210", "Let me show you around.", "中を案内しますね。"],["p1211", "This is your desk.", "ここがあなたの席です。"],["p1212", "Don't hesitate to ask questions.", "遠慮なく質問してください。"],["p1213", "You'll get used to it.", "すぐに慣れますよ。"],["p1214", "Take your time to learn.", "ゆっくり覚えてください。"],["p1215", "Lunch is at noon.", "昼休みは正午です。"],["p1216", "You're doing great so far.", "ここまで順調ですよ。"]],
  r:[["Hi, I'm the new staff member.", 0],["There's so much to remember.", 4],["Did I do this report correctly?", 7]],
  c:{sit:"新しく入った人を案内する",t:[["Hello, I'm Mia. Today is my first day.", 0],["Thank you. Where do I sit?", 2],["Everyone here works so fast. I'm a bit nervous.", 4]]}},
 {t:"第百五十三歩 意見を伝える",d:"ていねいに指摘する",p:[
  ["p1217", "Can I give you some feedback?", "少し意見を言ってもいいですか？"],["p1218", "Overall, it's very good.", "全体的にとてもいいです。"],["p1219", "Maybe you could add more details.", "もう少し詳しく書いてもいいかもしれません。"],["p1220", "This part is a little confusing.", "この部分が少しわかりにくいです。"],["p1221", "How about changing the title?", "タイトルを変えてみてはどうですか？"],["p1222", "I really like this idea.", "この案がとても好きです。"],["p1223", "Thanks for the advice.", "アドバイスありがとう。"],["p1224", "I'll fix it right away.", "すぐに直します。"]],
  r:[["What do you think of my report?", 1],["Which part should I change?", 3],["I think the second page needs more examples.", 7]],
  c:{sit:"同僚の資料にコメントする",t:[["Did you read my proposal? Be honest.", 1],["Thanks. But is there anything I should change?", 2],["Good point. I'll add some examples. Anything you liked?", 5]]}},
 {t:"第百五十四歩 断り",d:"ていねいに断る",p:[
  ["p1225", "I'm afraid I can't.", "残念ですが、できません。"],["p1226", "Thank you, but I'll pass.", "ありがとう、でも遠慮しておきます。"],["p1227", "Maybe another time.", "また別の機会に。"],["p1228", "I already have plans.", "もう予定があります。"],["p1229", "That's not possible right now.", "今はそれはできません。"],["p1230", "I'd love to, but I'm busy.", "ぜひと言いたいのですが、忙しいんです。"],["p1231", "Let me check and get back to you.", "確認して、また連絡します。"],["p1232", "I hope you understand.", "ご理解いただけるとうれしいです。"]],
  r:[["Do you want to join us for dinner tonight?", 5],["Would you like another piece of cake?", 1],["Come to my party on Saturday!", 3]],
  c:{sit:"同僚に誘われる",t:[["Do you want to come to karaoke tonight?", 5],["Oh, too bad. How about tomorrow?", 3],["Okay. Then maybe next week?", 6]]}},
 {t:"第百五十五歩 引き受け",d:"頼みごとを引き受ける",p:[
  ["p1233", "Sure, I can do that.", "もちろん、できますよ。"],["p1234", "No problem at all.", "全然問題ありません。"],["p1235", "When do you need it by?", "いつまでに必要ですか？"],["p1236", "Consider it done.", "任せて、やっておきます。"],["p1237", "Happy to help.", "喜んで手伝います。"],["p1238", "Let me finish this first.", "まずこれを終わらせますね。"],["p1239", "I'll do my best.", "精いっぱいやります。"],["p1240", "Just tell me what to do.", "何をすればいいか言ってください。"]],
  r:[["Could you check this document for me?", 2],["I need it by Friday. Is that okay?", 3],["I don't know how to start. Can you help?", 7]],
  c:{sit:"上司に仕事を頼まれる",t:[["Can you prepare the slides for the meeting?", 0],["Great. I need them by Thursday.", 3],["Thanks. I know you're busy with other work.", 5]]}},
 {t:"第百五十六歩 週末",d:"週末の予定を話す",p:[
  ["p1241", "What are you up to this weekend?", "今週末は何をする予定ですか？"],["p1242", "Nothing special.", "特に何も。"],["p1243", "I'm going to relax at home.", "家でのんびりするつもりです。"],["p1244", "I'm meeting some friends.", "友達に会います。"],["p1245", "Do you want to hang out?", "一緒に遊ばない？"],["p1246", "I need a lazy weekend.", "だらだらした週末が必要です。"],["p1247", "How was your weekend?", "週末はどうでしたか？"],["p1248", "It went by so fast.", "あっという間でした。"]],
  r:[["What are you up to this weekend?", 3],["I'm free on Sunday too.", 4],["Monday again. How was your weekend?", 7]],
  c:{sit:"金曜日の夕方、友人と話す",t:[["Finally, it's Friday! Any plans?", 5],["Same here. But I'm free on Sunday afternoon.", 4],["By the way, what are you doing on Saturday?", 2]]}},
 {t:"第百五十七歩 習い事",d:"楽器やおけいこを習う",p:[
  ["p1249", "I've started taking piano lessons.", "ピアノを習い始めました。"],["p1250", "I practice every evening.", "毎晩練習しています。"],["p1251", "It's harder than I thought.", "思ったより難しいです。"],["p1252", "My teacher is very patient.", "先生はとても辛抱強いです。"],["p1253", "I can play one song now.", "今は一曲弾けます。"],["p1254", "I want to join a band someday.", "いつかバンドに入りたいです。"],["p1255", "It's a good way to relax.", "いい気分転換になります。"],["p1256", "It's never too late to start.", "始めるのに遅すぎることはありません。"]],
  r:[["Why are your fingers so tired?", 0],["Is it easy to learn?", 2],["I'm forty. Is it too late to learn the guitar?", 7]],
  c:{sit:"友人に最近のことを聞かれる",t:[["You seem busy these days. What's new?", 0],["Wow! How is it going?", 2],["Don't worry. You'll get better.", 4]]}},
 {t:"第百五十八歩 足止め",d:"旅先で予定どおりに進めない",p:[
  ["p1257", "The road is closed.", "道が通行止めです。"],["p1258", "Is there another way?", "ほかの道はありますか？"],["p1259", "We have to turn back.", "引き返さなければなりません。"],["p1260", "I think we're lost.", "道に迷ったと思います。"],["p1261", "Let's ask someone.", "だれかに聞きましょう。"],["p1262", "The last bus has already left.", "最終バスはもう出てしまいました。"],["p1263", "We should find a place to stay.", "泊まる所を探したほうがいいです。"],["p1264", "At least we're safe.", "少なくとも無事です。"]],
  r:[["There's a big sign ahead. What does it say?", 0],["This map doesn't make any sense.", 4],["It's late and the station is closed.", 6]],
  c:{sit:"ドライブ中に道路が通行止めになる",t:[["Oh no, look at that sign ahead!", 0],["We can't go this way. What should we do?", 1],["I don't know this area at all.", 4]]}},
 {t:"第百五十九歩 民泊",d:"家を借りて泊まる",p:[
  ["p1265", "Hi, I booked your place for three nights.", "こんにちは、3泊予約した者です。"],["p1266", "How do I get the key?", "鍵はどうやって受け取りますか？"],["p1267", "What's the Wi-Fi password?", "Wi-Fiのパスワードは何ですか？"],["p1268", "Where should I put the trash?", "ごみはどこに出せばいいですか？"],["p1269", "The shower isn't working.", "シャワーが使えません。"],["p1270", "Thank you for the warm welcome.", "温かく迎えてくれてありがとう。"],["p1271", "I'll leave the key on the table.", "鍵はテーブルに置いていきます。"],["p1272", "I'd love to stay here again.", "またここに泊まりたいです。"]],
  r:[["Hello! You must be my guest.", 0],["Come in! Let me know if you need anything.", 5],["How was your stay?", 7]],
  c:{sit:"民泊の家主に連絡する",t:[["Hi, this is Anna, your host. Have you arrived?", 1],["The key is under the plant by the door.", 2],["It's on the fridge. Enjoy your stay!", 3]]}},
 {t:"第百六十歩 ふり返り",d:"学びをふり返って話す",p:[
  ["p1273", "Looking back, I've grown a lot.", "ふり返ると、とても成長しました。"],["p1274", "At first, I couldn't say anything.", "最初は何も言えませんでした。"],["p1275", "Now I can have real conversations.", "今はちゃんとした会話ができます。"],["p1276", "The hardest part was listening.", "いちばん難しかったのは聞き取りです。"],["p1277", "I'm glad I didn't give up.", "あきらめなくてよかったです。"],["p1278", "Practicing every day really helped.", "毎日の練習が本当に役立ちました。"],["p1279", "I'm curious about what's next.", "次に何が来るのか楽しみです。"],["p1280", "Let's keep going.", "このまま進みましょう。"]],
  r:[["How do you feel about your English now?", 0],["What was difficult for you?", 3],["What helped you the most?", 5]],
  c:{sit:"学びの節目に友人と話す",t:[["You've been studying English for months. How is it going?", 0],["Really? What was it like at the beginning?", 1],["And how do you feel about the next step?", 6]]}},
 {t:"第百六十一歩 キャンプ",d:"アウトドアで過ごす",p:[
  ["p1281", "Let's set up the tent here.", "ここにテントを張ろう。"],["p1282", "Can you help me start the fire?", "火をおこすのを手伝ってくれる？"],["p1283", "Don't forget the bug spray.", "虫よけスプレーを忘れないで。"],["p1284", "The stars are so bright tonight.", "今夜は星がすごく明るいね。"],["p1285", "I'll go get some firewood.", "たきぎを取ってくるよ。"],["p1286", "Let's pack up before it rains.", "雨が降る前に片づけよう。"],["p1287", "Watch your step on the rocks.", "岩の上は足もとに気をつけて。"],["p1288", "We should leave no trash behind.", "ごみは何も残さないようにしよう。"]],
  r:[["It's getting dark. Where should we sleep?", 0],["Look at those clouds. It's going to rain soon.", 5],["We have food, but the fire is almost out.", 4]],
  c:{sit:"友人と湖のそばでキャンプ",t:[["We're finally here! This spot looks perfect.", 0],["The tent is up. I'm getting cold, though.", 1],["Wow, look up! It's so clear tonight.", 3]]}},
 {t:"第百六十二歩 スーパー",d:"食料品を買う",p:[
  ["p1289", "Where can I find the eggs?", "卵はどこにありますか？"],["p1290", "Do you have any fresh fish today?", "今日は新鮮な魚はありますか？"],["p1291", "I'd like half a pound of ham.", "ハムを半ポンドください。"],["p1292", "Could you slice it thinly?", "薄く切ってもらえますか？"],["p1293", "When does this expire?", "これの賞味期限はいつですか？"],["p1294", "I brought my own bag.", "自分の袋を持ってきました。"],["p1295", "Is this on sale?", "これはセール中ですか？"],["p1296", "Can I use this coupon?", "このクーポンは使えますか？"]],
  r:[["Do you need a bag for these?", 5],["Here's your ham. Would you like it sliced?", 3],["Hi. Can I help you find something?", 0]],
  c:{sit:"スーパーの売り場で店員に聞く",t:[["Hello! Are you looking for something?", 0],["The eggs are in aisle three. Anything else?", 1],["Yes, the salmon just came in. Anything from the deli, too?", 2]]}},
 {t:"第百六十三歩 夜の街",d:"友だちと夜に出かける",p:[
  ["p1297", "Do you want to grab a drink?", "一杯飲みに行かない？"],["p1298", "This place has live music.", "この店は生演奏があるんだ。"],["p1299", "It's my round.", "ここはぼくがおごるよ。"],["p1300", "Let's get something to eat first.", "まず何か食べよう。"],["p1301", "I'm not much of a drinker.", "お酒はあまり飲まないんです。"],["p1302", "Let's call it a night.", "今夜はこれでお開きにしよう。"],["p1303", "How are you getting home?", "どうやって帰るの？"],["p1304", "Text me when you get home.", "家に着いたらメッセージしてね。"]],
  r:[["I'm so hungry. I haven't had dinner yet.", 3],["Another beer? I can buy this one.", 4],["Wow, it's almost midnight.", 5]],
  c:{sit:"仕事のあと同僚と出かける",t:[["What a long week! Any ideas for tonight?", 0],["This bar looks nice. Oh, and there's a band.", 1],["Oh, it's getting late. My last train leaves soon.", 5]]}},
 {t:"第百六十四歩 温泉",d:"温泉のマナーを説明する",p:[
  ["p1305", "You have to wash before you get in.", "入る前に体を洗わないといけません。"],["p1306", "Don't put your towel in the water.", "タオルはお湯に入れないでください。"],["p1307", "The water is pretty hot.", "お湯はかなり熱いですよ。"],["p1308", "Swimsuits aren't allowed here.", "ここでは水着は禁止です。"],["p1309", "Tie your hair up, please.", "髪はまとめてください。"],["p1310", "Don't stay in too long.", "長く入りすぎないでね。"],["p1311", "Drink some water afterward.", "上がったら水を飲んでね。"],["p1312", "This one is outdoors.", "こっちは露天風呂です。"]],
  r:[["Can I just jump in right away?", 0],["I brought my swimsuit. Is that okay?", 3],["I feel a little dizzy.", 5]],
  c:{sit:"海外の友人を温泉に案内する",t:[["So this is a hot spring! What do I do first?", 0],["Can I bring my towel into the bath?", 1],["Ah, I feel so relaxed. I could stay here all day.", 5]]}},
 {t:"第百六十五歩 留学",d:"留学の手続きと生活",p:[
  ["p1313", "I'm here as an exchange student.", "交換留学生として来ています。"],["p1314", "I need to register for classes.", "授業の履修登録をしなければなりません。"],["p1315", "Where's the international office?", "留学生センターはどこですか？"],["p1316", "I'm still getting used to the food.", "まだ食べ物に慣れているところです。"],["p1317", "My host family is really kind.", "ホストファミリーはとても親切です。"],["p1318", "I'm staying for one semester.", "一学期のあいだ滞在します。"],["p1319", "Could you write me a letter of recommendation?", "推薦状を書いていただけますか？"],["p1320", "I miss home sometimes.", "ときどき故郷が恋しくなります。"]],
  r:[["So, how long will you be here?", 5],["How do you like the food here?", 3],["You need to fill out these forms at the international office.", 2]],
  c:{sit:"大学の窓口で職員に話しかけられる",t:[["Hi there. Are you new here?", 0],["Nice! How long is your program?", 5],["Great. Your first step is to choose your classes.", 1]]}},
 {t:"第百六十六歩 落とし物",d:"忘れ物を探す",p:[
  ["p1321", "I left my umbrella on the train.", "電車に傘を置き忘れました。"],["p1322", "Has anyone turned in a wallet?", "財布の届けはありませんか？"],["p1323", "It's a black leather wallet.", "黒い革の財布です。"],["p1324", "I think I dropped it around here.", "このあたりで落としたと思います。"],["p1325", "My name is written inside.", "中に名前が書いてあります。"],["p1326", "Could you call me if it turns up?", "見つかったら電話していただけますか？"],["p1327", "I'll check the lost and found.", "遺失物取扱所を見てみます。"],["p1328", "What a relief!", "ほっとしました！"]],
  r:[["What does it look like?", 2],["We don't have it yet. Do you want to leave your number?", 5],["Good news. Somebody brought it in this morning.", 7]],
  c:{sit:"駅の窓口で財布をさがす",t:[["Good afternoon. How can I help you?", 1],["Can you describe it for me?", 2],["We'll keep looking. Please write your number here.", 5]]}},
 {t:"第百六十七歩 ゲーム",d:"ゲームや遊びの話",p:[
  ["p1329", "Do you want to play a board game?", "ボードゲームをしない？"],["p1330", "Whose turn is it?", "だれの番？"],["p1331", "Can you explain the rules?", "ルールを説明してくれる？"],["p1332", "No cheating!", "ずるはなしだよ！"],["p1333", "I'm on a winning streak.", "連勝中なんだ。"],["p1334", "Let's play one more round.", "もう一回やろう。"],["p1335", "You're really good at this.", "これ、すごくうまいね。"],["p1336", "Beginner's luck!", "ビギナーズラックだよ！"]],
  r:[["Hmm, I forgot who rolled last.", 1],["I've never played this before.", 2],["Wow, you won again! How did you do that?", 7]],
  c:{sit:"友人の家でボードゲームをする",t:[["I'm bored. Do you have any ideas?", 0],["This game is easy. You'll learn it fast.", 2],["You won the last three games!", 4]]}},
 {t:"第百六十八歩 苦情",d:"近所にていねいに苦情を言う",p:[
  ["p1337", "Sorry to bother you, but…", "おじゃましてすみませんが……"],["p1338", "The music is a bit loud at night.", "夜、音楽が少しうるさいんです。"],["p1339", "I have to get up early for work.", "仕事で朝早く起きなければならないんです。"],["p1340", "Could you keep it down after ten?", "十時以降は静かにしていただけますか？"],["p1341", "Your car is blocking my driveway.", "あなたの車がうちの車庫の出入口をふさいでいます。"],["p1342", "I'm sure you didn't realize.", "きっと気づかれていなかったんですよね。"],["p1343", "I'd really appreciate it.", "とても助かります。"],["p1344", "Thanks for understanding.", "ご理解いただきありがとうございます。"]],
  r:[["Oh, hello. Is something wrong?", 0],["Oh, sorry. I didn't know the walls were so thin.", 3],["Okay, I'll turn it down from now on.", 7]],
  c:{sit:"となりの部屋の人をたずねる",t:[["Oh, hi! What can I do for you?", 0],["Sorry! I didn't know it was that loud.", 3],["No problem. I'll be more careful.", 7]]}},
 {t:"第百六十九歩 返品",d:"返品と交換を頼む",p:[
  ["p1345", "I'd like to return this.", "これを返品したいのですが。"],["p1346", "It doesn't fit.", "サイズが合いません。"],["p1347", "It was broken when I opened it.", "開けたら壊れていました。"],["p1348", "Here's the receipt.", "これがレシートです。"],["p1349", "Can I exchange it for a smaller size?", "小さいサイズと交換できますか？"],["p1350", "I'd prefer a refund.", "返金のほうがいいです。"],["p1351", "Is it still under warranty?", "まだ保証期間内ですか？"],["p1352", "How long will the refund take?", "返金にはどのくらいかかりますか？"]],
  r:[["What's the problem with it?", 2],["Do you have proof of purchase?", 3],["We can give you store credit or your money back.", 5]],
  c:{sit:"お店のカウンターで返品する",t:[["Hi there. What can I do for you?", 0],["I see. Do you have the receipt?", 3],["Would you like a new one or your money back?", 5]]}},
 {t:"第百七十歩 書類",d:"申込書の書き方をたずねる",p:[
  ["p1353", "What should I write here?", "ここには何を書けばいいですか？"],["p1354", "Do I need to sign it?", "署名は必要ですか？"],["p1355", "Should I use block letters?", "活字体で書くべきですか？"],["p1356", "I don't have a middle name.", "ミドルネームはありません。"],["p1357", "Can I fill it out online?", "ネットで記入できますか？"],["p1358", "Which documents do I need to bring?", "どの書類を持っていけばいいですか？"],["p1359", "I made a mistake. Can I have a new form?", "まちがえました。新しい用紙をもらえますか？"],["p1360", "Where do I hand this in?", "これはどこに提出すればいいですか？"]],
  r:[["Please write your full name, including your middle name.", 3],["There's a line at the bottom of the form.", 1],["All done? Great, everything looks complete.", 7]],
  c:{sit:"役所の窓口で用紙を書く",t:[["Please fill out this form.", 4],["Write your address in this box.", 2],["Okay, the form looks good.", 7]]}},
 {t:"第百七十一歩 割り勘",d:"会計と割り勘",p:[
  ["p1361", "Let's split the bill.", "割り勘にしよう。"],["p1362", "Can we pay separately?", "別々に払えますか？"],["p1363", "It's on me tonight.", "今夜はぼくのおごりだよ。"],["p1364", "I'll get the next one.", "次はわたしが払うね。"],["p1365", "How much do I owe you?", "いくら払えばいい？"],["p1366", "Does this include the tip?", "チップは含まれていますか？"],["p1367", "I'll send you the money later.", "あとでお金を送るね。"],["p1368", "I think there's a mistake on the bill.", "伝票にまちがいがあると思います。"]],
  r:[["Should I bring one check or several?", 1],["No, no, you paid last time.", 3],["We charged you for three desserts. Is that right?", 7]],
  c:{sit:"友人と食事を終えて会計する",t:[["That was delicious. Can I get the check?", 0],["The total is ninety dollars.", 4],["Please, let me pay this time.", 3]]}},
 {t:"第百七十二歩 待ち合わせ",d:"人ごみで落ち合う",p:[
  ["p1369", "I'm at the north exit.", "北口にいます。"],["p1370", "What are you wearing?", "どんな服を着てる？"],["p1371", "I'm wearing a red scarf.", "赤いマフラーをしてるよ。"],["p1372", "I can't find you.", "見つからないよ。"],["p1373", "I'm waving at you now.", "今、手をふってるよ。"],["p1374", "Stay where you are.", "そこを動かないで。"],["p1375", "I'll come to you.", "そっちに行くね。"],["p1376", "There you are!", "いた！"]],
  r:[["Where exactly are you? There are so many people.", 0],["How will I recognize you?", 2],["I'm by the big clock. Can you see me?", 4]],
  c:{sit:"混んだ駅で友人と電話しながら会う",t:[["I'm here! Where are you?", 0],["I'm wearing a gray coat. What about you?", 2],["Wait, I think I see you!", 5]]}},
 {t:"第百七十三歩 欠勤の連絡",d:"仕事を休む連絡をする",p:[
  ["p1377", "I'm afraid I can't come in today.", "申し訳ありませんが、今日は出勤できません。"],["p1378", "I woke up with a fever.", "起きたら熱がありました。"],["p1379", "I'll be available by email.", "メールなら対応できます。"],["p1380", "Could someone cover for me?", "だれか代わりをお願いできますか？"],["p1381", "I should be back tomorrow.", "明日には戻れると思います。"],["p1382", "I'll keep you updated.", "また状況をお知らせします。"],["p1383", "Sorry for the short notice.", "急な連絡ですみません。"],["p1384", "I need to take a personal day.", "私用で一日休みをいただきたいです。"]],
  r:[["Oh no. What's wrong?", 1],["Okay. Who will take your meeting this afternoon?", 3],["Take care. Will you be in tomorrow?", 4]],
  c:{sit:"朝、上司に電話する",t:[["Good morning. What's up?", 0],["Sorry to hear that. What happened?", 1],["Okay. Feel better soon.", 5]]}},
 {t:"第百七十四歩 締め切り",d:"締め切りについて相談する",p:[
  ["p1385", "When is this due?", "これの締め切りはいつですか？"],["p1386", "Is the deadline flexible?", "締め切りは調整できますか？"],["p1387", "Could I have a few more days?", "あと数日いただけますか？"],["p1388", "I'm running behind schedule.", "予定より遅れています。"],["p1389", "I'll have it ready by Friday.", "金曜日までに用意します。"],["p1390", "Which part should I do first?", "どの部分から先にやるべきですか？"],["p1391", "I'll send you a draft today.", "今日、下書きを送ります。"],["p1392", "I made it just in time.", "ぎりぎり間に合いました。"]],
  r:[["How's the report going?", 3],["The client needs it soon. When can you finish?", 4],["I'd like to see something before the final version.", 6]],
  c:{sit:"上司と仕事の進み具合を話す",t:[["How's the project coming along?", 3],["Hmm. How much time do you need?", 2],["Okay. Send me what you have so far.", 6]]}},
 {t:"第百七十五歩 評価",d:"フィードバックを受け止める",p:[
  ["p1393", "Thanks for the feedback.", "フィードバックをありがとうございます。"],["p1394", "That's a fair point.", "もっともなご指摘です。"],["p1395", "Could you give me an example?", "例をあげていただけますか？"],["p1396", "I'll work on that.", "そこを改善します。"],["p1397", "What could I do better?", "どうすればもっとよくなりますか？"],["p1398", "I didn't see it that way.", "そういうふうには考えていませんでした。"],["p1399", "Can we talk about this again next month?", "来月またこの話をしてもいいですか？"],["p1400", "I really appreciate your support.", "ご支援に心から感謝します。"]],
  r:[["You sometimes speak too fast in meetings.", 3],["Your reports are good, but some parts are hard to follow.", 2],["Do you have any other questions for me?", 6]],
  c:{sit:"面談で上司から評価を聞く",t:[["Overall, you're doing a great job.", 0],["But your emails are sometimes too long.", 3],["Let's meet again next month to check in.", 7]]}},
 {t:"第百七十六歩 世間話",d:"ちょっとした世間話をする",p:[
  ["p1401", "Crazy weather we're having.", "すごい天気ですね。"],["p1402", "Busy day?", "今日は忙しいですか？"],["p1403", "Any plans for the holidays?", "休みの予定はありますか？"],["p1404", "Have you tried the new café downstairs?", "下の新しいカフェ、行ってみました？"],["p1405", "Time flies, doesn't it?", "時間がたつのは早いですね。"],["p1406", "Long time no see.", "久しぶりですね。"],["p1407", "Well, this is my floor.", "じゃあ、わたしはこの階で。"],["p1408", "Have a good one.", "よい一日を。"]],
  r:[["Wow, it was sunny this morning, and now it's snowing.", 0],["Can you believe it's already the end of the year?", 4],["Oh, the doors are opening. Bye!", 7]],
  c:{sit:"エレベーターでとなりの会社の人と会う",t:[["Morning! Did you see the snow?", 0],["It's almost December already.", 4],["Oh, this is my stop. See you!", 7]]}},
 {t:"第百七十七歩 お悔やみ",d:"相手の悲しみに寄りそう",p:[
  ["p1409", "I'm so sorry for your loss.", "このたびはご愁傷さまです。"],["p1410", "I can't imagine how you feel.", "どんなにおつらいことか。"],["p1411", "She was a wonderful person.", "彼女はすばらしい人でした。"],["p1412", "Let me know if you need anything.", "何か必要なことがあれば言ってくださいね。"],["p1413", "Take all the time you need.", "必要なだけ時間をとってくださいね。"],["p1414", "I'm here for you.", "わたしがついています。"],["p1415", "My thoughts are with your family.", "ご家族のことを思っています。"],["p1416", "I'll always remember her.", "彼女のことはずっと忘れません。"]],
  r:[["My grandmother passed away last week.", 0],["I need a few days off. I'm sorry about the timing.", 4],["I don't really want to talk right now.", 5]],
  c:{sit:"友人の家族の訃報を聞く",t:[["My grandmother passed away on Sunday.", 0],["She taught me so much.", 2],["Thank you. It means a lot.", 3]]}},
 {t:"第百七十八歩 冗談",d:"冗談を言う・笑い合う",p:[
  ["p1417", "Just kidding!", "冗談だよ！"],["p1418", "You're pulling my leg.", "からかってるでしょ。"],["p1419", "That's hilarious!", "それ、最高におもしろい！"],["p1420", "I didn't get the joke.", "その冗談、わからなかった。"],["p1421", "You should be a comedian.", "お笑い芸人になれるよ。"],["p1422", "Don't take it so seriously.", "そんなに真に受けないで。"],["p1423", "I couldn't stop laughing.", "笑いが止まらなかったよ。"],["p1424", "That's not funny.", "それは笑えないよ。"]],
  r:[["I just became a millionaire!", 1],["Why did the tomato blush? It saw the salad dressing!", 2],["Hey! That wasn't a nice thing to say about me.", 5]],
  c:{sit:"友人とカフェで冗談を言い合う",t:[["I quit my job today. I'm moving to the moon!", 1],["Okay, that's a lie. Why did the tomato blush? It saw the salad dressing!", 2],["Here's another one. What do you call a fake noodle? An impasta! No laugh?", 3]]}},
 {t:"第百七十九歩 キャリア",d:"これからの仕事を語る",p:[
  ["p1425", "I'm thinking about changing careers.", "転職を考えています。"],["p1426", "I want a job where I can use English.", "英語が使える仕事がしたいです。"],["p1427", "I'm taking an online course.", "オンライン講座を受けています。"],["p1428", "I'd like to work abroad someday.", "いつか海外で働きたいです。"],["p1429", "I want more work-life balance.", "仕事と生活のバランスをもっととりたいです。"],["p1430", "I'm good with people.", "人と接するのが得意です。"],["p1431", "I'm still figuring it out.", "まだ考えているところです。"],["p1432", "It's never too late to start.", "始めるのに遅すぎることはありません。"]],
  r:[["So, what do you want to do in five years?", 6],["What are your strengths?", 5],["Do you think I'm too old to learn programming?", 7]],
  c:{sit:"先輩とキャリアの話をする",t:[["So, are you happy with your job?", 0],["Really? What kind of job do you want?", 1],["That sounds great. How are you preparing?", 2]]}},
 {t:"第百八十歩 わたしの物語",d:"自分の歩みを語る",p:[
  ["p1433", "Let me tell you a little about myself.", "少し自己紹介させてください。"],["p1434", "I grew up in a small town.", "小さな町で育ちました。"],["p1435", "It wasn't always easy.", "いつも楽だったわけではありません。"],["p1436", "That experience changed me.", "あの経験がわたしを変えました。"],["p1437", "I've learned a lot along the way.", "ここまでの道のりでたくさん学びました。"],["p1438", "I'm proud of how far I've come.", "ここまで来られたことを誇りに思います。"],["p1439", "There's still a long way to go.", "まだ先は長いです。"],["p1440", "I'm excited about what comes next.", "これからが楽しみです。"]],
  r:[["Hi, nice to meet you. I'd love to hear about you.", 0],["You've learned so much English this year!", 5],["Are you finished, or do you want to keep studying?", 6]],
  c:{sit:"英語のスピーチ会で話す",t:[["Our next speaker is here. Please begin.", 0],["What was the hardest part?", 2],["Thank you. What's your next goal?", 7]]}},
 {t:"第百八十一歩 やわらかく",d:"遠回しにやわらかく言う",p:[
  ["p1441", "I was wondering if you could help me.", "手伝っていただけないかと思いまして。"],["p1442", "It might be a good idea to wait.", "待ったほうがいいかもしれません。"],["p1443", "I'm not sure that's the best plan.", "それが最善の案かどうか、自信がありません。"],["p1444", "Would you mind if I opened the window?", "窓を開けてもかまいませんか？"],["p1445", "It's a little expensive for me.", "わたしには少し高いですね。"],["p1446", "I see your point, but…", "おっしゃることはわかりますが……"],["p1447", "Maybe we could try another way.", "別のやり方を試してもいいかもしれません。"],["p1448", "If it's not too much trouble.", "もしご迷惑でなければ。"]],
  r:[["You look like you need something.", 0],["Let's just buy the tickets now.", 1],["This one is three hundred dollars. What do you think?", 4]],
  c:{sit:"同僚にていねいに頼みごとをする",t:[["Hi. Do you need something?", 0],["Sure. I can look over your report now.", 7],["Let's just send the report now, then.", 1]]}},
 {t:"第百八十二歩 値段交渉",d:"値段を交渉する",p:[
  ["p1449", "Is this your best price?", "これが一番安い値段ですか？"],["p1450", "Can you do any better?", "もう少し安くなりませんか？"],["p1451", "What if I buy two?", "二つ買ったらどうなりますか？"],["p1452", "That's more than I wanted to spend.", "予算より高いです。"],["p1453", "I saw it cheaper online.", "ネットではもっと安く売っていました。"],["p1454", "Could you include free shipping?", "送料を無料にしてもらえますか？"],["p1455", "Let me think about it.", "少し考えさせてください。"],["p1456", "It's a deal.", "それで決まりです。"]],
  r:[["This lamp is fifty dollars.", 1],["Okay, forty-five dollars. That's my final offer.", 7],["Sorry, I can't lower the price on just one.", 2]],
  c:{sit:"市場で古い時計を買う",t:[["This watch is eighty dollars.", 0],["Hmm, I can't go lower on just one.", 2],["Okay, two for one hundred and forty. How's that?", 7]]}},
 {t:"第百八十三歩 大家さん",d:"部屋の修理を頼む",p:[
  ["p1457", "The heater isn't working.", "暖房が動きません。"],["p1458", "There's a leak under the sink.", "流しの下が水もれしています。"],["p1459", "When can someone come and fix it?", "いつ修理に来てもらえますか？"],["p1460", "I'll be home all afternoon.", "午後はずっと家にいます。"],["p1461", "Can you let me know before you come?", "来る前に連絡をもらえますか？"],["p1462", "It's been like this for a week.", "一週間ずっとこの状態です。"],["p1463", "Who should I call in an emergency?", "緊急のときはだれに電話すればいいですか？"],["p1464", "Thanks for fixing it so quickly.", "すぐに直してくれてありがとう。"]],
  r:[["Hello, this is your landlord. What seems to be the problem?", 0],["A plumber can come tomorrow. What time works for you?", 3],["All done. The sink shouldn't leak anymore.", 7]],
  c:{sit:"大家さんに電話する",t:[["Hi, it's Mr. Brown, the landlord. What's up?", 1],["Oh no. How long has it been leaking?", 5],["Okay. I'll send someone tomorrow afternoon.", 3]]}},
 {t:"第百八十四歩 小さな事故",d:"軽い事故に対応する",p:[
  ["p1465", "Are you okay?", "大丈夫ですか？"],["p1466", "Nobody's hurt, thank goodness.", "だれもけがしなくてよかった。"],["p1467", "Let's move to the side of the road.", "道のわきに移動しましょう。"],["p1468", "We should exchange insurance information.", "保険の情報を交換しましょう。"],["p1469", "Can I take a picture of the damage?", "傷の写真を撮ってもいいですか？"],["p1470", "I'll call the police just in case.", "念のため警察に電話します。"],["p1471", "It was my fault. I'm sorry.", "わたしのせいです。すみません。"],["p1472", "I didn't see you coming.", "来ているのが見えませんでした。"]],
  r:[["Ouch… I think my car hit yours.", 0],["We're blocking traffic here.", 2],["So, what do we do now?", 3]],
  c:{sit:"駐車場で車同士が軽くぶつかる",t:[["Oh no! Are you hurt?", 1],["I'm so sorry. Didn't you see me?", 7],["Okay. Should we call anyone?", 5]]}},
 {t:"第百八十五歩 仕組み",d:"しくみを説明する",p:[
  ["p1473", "Let me explain how it works.", "しくみを説明しますね。"],["p1474", "First, you scan the code.", "まず、コードを読み取ります。"],["p1475", "Then it connects automatically.", "すると自動でつながります。"],["p1476", "Basically, it saves you time.", "要するに、時間の節約になるんです。"],["p1477", "The main difference is the price.", "いちばんの違いは値段です。"],["p1478", "It sounds complicated, but it's easy.", "難しそうに聞こえますが、簡単です。"],["p1479", "Does that make sense?", "わかりますか？"],["p1480", "Let me show you an example.", "例を見せますね。"]],
  r:[["I've never used this machine before.", 0],["So what's the point of this app?", 3],["I'm still a little confused.", 7]],
  c:{sit:"祖母に新しいアプリを教える",t:[["Can you teach me this new app?", 0],["Okay. What happens after I scan the code?", 2],["Hmm, I think I need to see it once.", 7]]}},
 {t:"第百八十六歩 読書",d:"本や記事の感想を深く語る",p:[
  ["p1481", "I couldn't put it down.", "読み出したら止まりませんでした。"],["p1482", "The ending surprised me.", "結末に驚きました。"],["p1483", "The main character reminded me of my sister.", "主人公を見て姉を思い出しました。"],["p1484", "It made me think about my own life.", "自分の人生について考えさせられました。"],["p1485", "The first half was a bit slow.", "前半は少し退屈でした。"],["p1486", "I'd recommend it to anyone.", "だれにでもすすめたいです。"],["p1487", "What did you think of the ending?", "結末はどう思いましたか？"],["p1488", "I read an interesting article yesterday.", "昨日おもしろい記事を読みました。"]],
  r:[["Did you finish the book I lent you?", 0],["Did you like the whole book?", 4],["Should I read it too?", 5]],
  c:{sit:"読書会で感想を話す",t:[["So, what did everyone think of the book?", 0],["Really? I thought the start was boring.", 4],["But overall, I loved it. Would you recommend it?", 5]]}},
 {t:"第百八十七歩 推測",d:"起きたことを推測する",p:[
  ["p1489", "He must have missed the train.", "彼は電車に乗り遅れたにちがいありません。"],["p1490", "She might have forgotten.", "彼女は忘れたのかもしれません。"],["p1491", "They can't have left yet.", "彼らがもう帰ったはずがありません。"],["p1492", "It must be hard for you.", "それは大変でしょうね。"],["p1493", "Maybe the store is closed today.", "今日は店が休みなのかもしれません。"],["p1494", "I bet it's going to rain.", "きっと雨が降るよ。"],["p1495", "That would explain it.", "それなら説明がつきますね。"],["p1496", "I have no idea what happened.", "何があったのか見当もつきません。"]],
  r:[["Tom isn't here yet, and the meeting started ten minutes ago.", 0],["The lights are still on in their office.", 2],["Oh, so her phone was off all day.", 6]],
  c:{sit:"待ち合わせに友人が来ない",t:[["Lisa is thirty minutes late. That's strange.", 1],["She's never late. Maybe something happened.", 7],["Oh, she just texted. Her bus broke down.", 6]]}},
 {t:"第百八十八歩 後悔",d:"しなかったことを悔やむ",p:[
  ["p1497", "I should have left earlier.", "もっと早く出ればよかった。"],["p1498", "I shouldn't have said that.", "あんなこと言わなければよかった。"],["p1499", "I wish I had studied harder.", "もっと勉強しておけばよかった。"],["p1500", "If only I had known.", "知ってさえいれば。"],["p1501", "It's too late now.", "もう手遅れです。"],["p1502", "I learned my lesson.", "いい教訓になりました。"],["p1503", "Next time, I'll be more careful.", "次はもっと気をつけます。"],["p1504", "There's no point worrying about it.", "くよくよしても仕方ありません。"]],
  r:[["You missed the flight? What happened?", 0],["Why do you look so sad? Did you fight with Mike?", 1],["Don't be so hard on yourself.", 7]],
  c:{sit:"試験のあと友人と話す",t:[["How was the test?", 2],["Well, you can't change it now.", 5],["Right. What will you do differently?", 6]]}},
 {t:"第百八十九歩 代案",d:"会議で代わりの案を出す",p:[
  ["p1505", "What if we tried a different approach?", "別の方法を試してみたらどうでしょう？"],["p1506", "I have another idea.", "別の案があります。"],["p1507", "Instead of email, we could call them.", "メールではなく、電話してもいいかもしれません。"],["p1508", "That could save us some money.", "それなら費用をおさえられるかもしれません。"],["p1509", "The risk is that it takes longer.", "問題は時間が長くかかることです。"],["p1510", "Let's look at the pros and cons.", "よい点と悪い点を見てみましょう。"],["p1511", "Can we test it first?", "まず試してみることはできますか？"],["p1512", "I'm open to other suggestions.", "ほかの提案も歓迎します。"]],
  r:[["Sending more ads isn't working. Any ideas?", 0],["Your plan sounds good, but is there a downside?", 4],["I'm not sure. It's a big change.", 6]],
  c:{sit:"チームで新しい計画を話し合う",t:[["Our sales are down. We need new ideas.", 1],["Good idea. But won't it cost more?", 3],["Okay. But I'm still a little worried.", 6]]}},
 {t:"第百九十歩 要約",d:"話をまとめる",p:[
  ["p1513", "To sum up, we need more time.", "まとめると、もっと時間が必要です。"],["p1514", "In short, it was a success.", "要するに、成功でした。"],["p1515", "The main point is this.", "要点はこれです。"],["p1516", "Let me go over it again.", "もう一度おさらいします。"],["p1517", "So, what you're saying is…", "つまり、おっしゃりたいのは……"],["p1518", "Just to be clear, the deadline is Friday.", "念のため確認ですが、締め切りは金曜ですね。"],["p1519", "Did I miss anything?", "何か抜けていますか？"],["p1520", "That's all from me.", "わたしからは以上です。"]],
  r:[["We're almost out of time. Can you summarize?", 0],["So, how did the event go?", 1],["Do you have anything else to add?", 7]],
  c:{sit:"会議の最後にまとめを頼まれる",t:[["We talked a lot today. Can you wrap it up?", 0],["Great. Anything else we should all remember?", 5],["Got it. I think that covers everything.", 7]]}},
 {t:"第百九十一歩 話を広げる",d:"質問で会話を深める",p:[
  ["p1521", "What got you interested in that?", "どうしてそれに興味を持ったんですか？"],["p1522", "How did you get started?", "どうやって始めたんですか？"],["p1523", "What do you like most about it?", "いちばん好きなところは何ですか？"],["p1524", "That must have been exciting.", "それはわくわくしたでしょうね。"],["p1525", "Tell me more.", "もっと聞かせて。"],["p1526", "What happened next?", "それからどうなったんですか？"],["p1527", "I've always wanted to try that.", "ずっとやってみたかったんです。"],["p1528", "How do you find the time?", "どうやって時間を作っているんですか？"]],
  r:[["I play the violin in a local orchestra.", 1],["We drove all night, and then the car broke down.", 5],["I work full-time, but I run every morning too.", 7]],
  c:{sit:"パーティーで初対面の人と話す",t:[["I just came back from climbing a mountain in Nepal.", 0],["A friend asked me to join, so I said yes.", 3],["And next year, I want to climb an even higher one!", 4]]}},
 {t:"第百九十二歩 文化の違い",d:"文化の違いを話す",p:[
  ["p1529", "In Japan, we take off our shoes inside.", "日本では家の中で靴を脱ぎます。"],["p1530", "Tipping isn't common in Japan.", "日本ではチップは一般的ではありません。"],["p1531", "That's interesting. It's different here.", "おもしろいですね。ここでは違います。"],["p1532", "Is it rude to eat while walking?", "歩きながら食べるのは失礼ですか？"],["p1533", "We usually bow instead of shaking hands.", "握手のかわりに、ふつうおじぎをします。"],["p1534", "It took me a while to get used to it.", "慣れるのにしばらくかかりました。"],["p1535", "What surprised you most about Japan?", "日本で一番驚いたことは何ですか？"],["p1536", "Every culture has its own rules.", "どの文化にも独自のきまりがあります。"]],
  r:[["Should I leave a tip at the restaurant in Tokyo?", 1],["I'm visiting a Japanese home. Anything I should know?", 0],["How was living abroad for you at first?", 5]],
  c:{sit:"海外から来た同僚と話す",t:[["I've lived in Japan for a year now.", 6],["The trains are so quiet. Nobody talks on the phone!", 7],["In my country, we hug when we meet friends.", 4]]}},
 {t:"第百九十三歩 環境",d:"エコと環境の話",p:[
  ["p1537", "I try to use less plastic.", "プラスチックを減らすようにしています。"],["p1538", "I always carry my own bottle.", "いつも自分の水筒を持ち歩いています。"],["p1539", "We should turn off the lights when we leave.", "出るときは電気を消すべきです。"],["p1540", "I take the train instead of driving.", "車のかわりに電車を使っています。"],["p1541", "Where does this go for recycling?", "これはリサイクルでどこに出しますか？"],["p1542", "Small changes can make a difference.", "小さな変化でも違いを生みます。"],["p1543", "The summers are getting hotter.", "夏がどんどん暑くなっています。"],["p1544", "Let's not waste food.", "食べ物をむだにしないようにしよう。"]],
  r:[["Do you want a plastic bottle of water?", 1],["I don't think one person can help the planet.", 5],["We have too much food left over.", 7]],
  c:{sit:"友人とスーパーで買い物をする",t:[["Let's grab some bottled water for the walk home.", 1],["Wow, you really care about the environment.", 5],["By the way, how do you get to work?", 3]]}},
 {t:"第百九十四歩 眠り",d:"睡眠の悩みを話す",p:[
  ["p1545", "I've been having trouble sleeping.", "最近よく眠れません。"],["p1546", "I keep waking up at night.", "夜中に何度も目が覚めます。"],["p1547", "I'm a light sleeper.", "眠りが浅いほうです。"],["p1548", "I try not to drink coffee after lunch.", "昼食のあとはコーヒーを飲まないようにしています。"],["p1549", "I should stop looking at my phone in bed.", "ベッドでスマホを見るのをやめるべきですね。"],["p1550", "I slept like a baby last night.", "昨夜はぐっすり眠れました。"],["p1551", "I usually go to bed around eleven.", "ふだんは十一時ごろに寝ます。"],["p1552", "A short nap helps me a lot.", "短い昼寝がとても効きます。"]],
  r:[["You look tired. Are you okay?", 0],["What time do you usually sleep?", 6],["You look much better today!", 5]],
  c:{sit:"職場で同僚に話しかけられる",t:[["You look really tired today.", 0],["Hmm. Do you drink coffee in the evening?", 3],["Try putting your phone away an hour before bed.", 4]]}},
 {t:"第百九十五歩 節約",d:"お金の使い方と節約",p:[
  ["p1553", "I'm trying to save money.", "お金をためようとしています。"],["p1554", "I cook at home to save money.", "節約のために家で料理しています。"],["p1555", "That's not in my budget.", "それは予算に入っていません。"],["p1556", "I'll wait until it goes on sale.", "セールになるまで待ちます。"],["p1557", "I canceled some subscriptions.", "サブスクをいくつか解約しました。"],["p1558", "It's worth the money.", "お金を出す価値があります。"],["p1559", "I spent too much this month.", "今月は使いすぎました。"],["p1560", "I'm saving up for a trip.", "旅行のためにお金をためています。"]],
  r:[["Let's go out for dinner tonight!", 0],["Why don't you buy that jacket now?", 3],["These headphones are expensive. Are they good?", 5]],
  c:{sit:"友人に買い物に誘われる",t:[["There's a big sale at the mall. Want to come?", 0],["Really? What are you saving for?", 7],["Good idea. Are you buying anything this month?", 6]]}},
 {t:"第百九十六歩 ネットのマナー",d:"SNSとネットのマナー",p:[
