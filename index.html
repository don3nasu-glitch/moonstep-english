  r:[["Hi. What can I get for you?", 0],["For here or to go?", 1, "店内で飲む"],["Anything else?", 7]],
  c:{sit:"カフェのカウンターで注文する",t:[["Good morning! What would you like?", 0],["Sure. What size would you like?", 3],["Okay, one small coffee. Would you like anything else?", 7]]}},
 {t:"第二十三歩 在りか",d:"どこに何があるかを話す",p:[
  ["p177", "There is a park near here.", "この近くに公園があります。"],["p178", "Is there a bank around here?", "このあたりに銀行はありますか？"],["p179", "It's next to the station.", "駅のとなりです。"],["p180", "It's across from the hotel.", "ホテルの向かいです。"],["p181", "It's on the second floor.", "2階にあります。"],["p182", "There are many shops here.", "ここには店がたくさんあります。"],["p183", "My keys are on the table.", "私の鍵はテーブルの上にあります。"],["p184", "It's in front of you.", "あなたの目の前にあります。"]],
  r:[["Excuse me, where is the post office?", 2, "郵便局は駅のとなり"],["Which floor is the restaurant on?", 4, "レストランは2階"],["Where is my phone?", 7, "相手の電話が、相手の目の前にある"]],
  c:{sit:"旅行者に場所を聞かれる",t:[["Excuse me. Is there a nice place to relax near here?", 0],["Great. And where is the tourist office?", 3],["Thank you. Is the office on the first floor?", 4]]}},
 {t:"第二十四歩 比べ",d:"くらべて話す",p:[
  ["p185", "This one is cheaper.", "こちらのほうが安いです。"],["p186", "Which is better?", "どちらがいいですか？"],["p187", "I like this one better.", "こちらのほうが好きです。"],["p188", "It's bigger than mine.", "私のより大きいです。"],["p189", "This is the best.", "これがいちばんです。"],["p190", "It's more expensive than that.", "あれより高いです。"],["p191", "He is taller than me.", "彼は私より背が高いです。"],["p192", "It's the same as yours.", "あなたのと同じです。"]],
  r:[["We have red and blue. Which do you like?", 2, "手に持っているほうが好き"],["How is the pizza here?", 4, "今までで一番おいしい"],["What kind of phone do you have?", 7, "相手と同じ機種を持っている"]],
  c:{sit:"友人と店でかばんを選ぶ。手に持っている茶色のほうが安い",t:[["Look at these two bags. The black one is nice, isn't it?", 0],["That's true. But which one do you like?", 2],["Good choice. How does it compare with the bags in the other shops?", 4]]}},
 {t:"第二十五歩 力",d:"できること・できないこと",p:[
  ["p193", "I can swim.", "泳げます。"],["p194", "I can't drive.", "運転できません。"],["p195", "Can you speak Japanese?", "日本語を話せますか？"],["p196", "I can speak a little English.", "英語を少し話せます。"],["p197", "Can you cook?", "料理はできますか？"],["p198", "I'm good at singing.", "歌うのが得意です。"],["p199", "I'm not good at math.", "数学は得意ではありません。"],["p200", "I can't find my ticket.", "切符が見つかりません。"]],
  r:[["Can you speak English?", 3],["Shall we rent a car?", 1, "運転免許を持っていない"],["What are you good at?", 5]],
  c:{sit:"新しいクラスで、となりの人と話す",t:[["Hello! Can you speak English?", 3],["Nice. What are you good at?", 5],["Wow. Let's drive to karaoke this weekend! Can you drive?", 1]]}},
 {t:"第二十六歩 決まり",d:"しなければならないこと",p:[
  ["p201", "I have to go to work.", "仕事に行かなければなりません。"],["p202", "You should get some rest.", "休んだほうがいいですよ。"],["p203", "You don't have to hurry.", "急がなくていいですよ。"],["p204", "Do I have to pay now?", "今払わなければなりませんか？"],["p205", "You can't park here.", "ここには駐車できません。"],["p206", "I must finish this today.", "今日これを終えなければなりません。"],["p207", "You should try it.", "試してみたほうがいいですよ。"],["p208", "Do I need a ticket?", "チケットは必要ですか？"]],
  r:[["I'm so tired today.", 1],["Wait, I'm almost ready!", 2, "時間にはまだ余裕がある"],["Can you come to the party tonight?", 5, "今日中に終える仕事がある"]],
  c:{sit:"昼休みに同僚と話す",t:[["Let's have a long lunch today!", 5],["I see. Actually, I feel a little sick today.", 1],["Thank you. Wait, I'll finish my coffee quickly.", 2]]}},
 {t:"第二十七歩 今",d:"今していることを話す",p:[
  ["p209", "What are you doing?", "何をしているのですか？"],["p210", "I'm cooking dinner.", "夕食を作っています。"],["p211", "I'm waiting for my friend.", "友達を待っています。"],["p212", "It's raining now.", "今、雨が降っています。"],["p213", "Are you listening?", "聞いていますか？"],["p214", "I'm looking for my keys.", "鍵を探しています。"],["p215", "She is talking on the phone.", "彼女は電話で話しています。"],["p216", "I'm just thinking.", "ちょっと考えているだけです。"]],
  r:[["Hi! What are you doing?", 1, "夕食のしたく中"],["Why are you standing here?", 2],["You are so quiet. Are you okay?", 7]],
  c:{sit:"家で家族に話しかけられる。外は雨",t:[["You keep walking around the room. What's wrong?", 5],["They are on the table. By the way, where is your sister?", 6],["I see. Shall we go for a walk?", 3]]}},
 {t:"第二十八歩 経験",d:"したことがあるかを話す",p:[
  ["p217", "Have you ever been abroad?", "海外に行ったことがありますか？"],["p218", "I've been there twice.", "そこには2回行ったことがあります。"],["p219", "I've already eaten.", "もう食べました。"],["p220", "I haven't finished yet.", "まだ終わっていません。"],["p221", "Have you seen this movie?", "この映画を見たことがありますか？"],["p222", "I've lived here for two years.", "ここに2年住んでいます。"],["p223", "I've just arrived.", "ちょうど着いたところです。"],["p224", "I've heard of it.", "それは聞いたことがあります。"]],
  r:[["Have you been to Kyoto?", 1],["Would you like some lunch?", 2, "もう食事をすませた"],["Are you done with your homework?", 3]],
  c:{sit:"パーティーで初めて会った人と話す",t:[["Hi! Did you just get here?", 6],["Nice to meet you. Do you live in this city?", 5],["Nice. Do you know the Blue Moon cafe?", 7]]}},
 {t:"第二十九歩 招き",d:"誘う・誘いにこたえる",p:[
  ["p225", "Are you free this weekend?", "今週末は空いていますか？"],["p226", "Why don't we have lunch?", "昼食を一緒にどうですか？"],["p227", "I'm having a party.", "パーティーを開きます。"],["p228", "Can you come?", "来られますか？"],["p229", "What should I bring?", "何を持っていけばいいですか？"],["p230", "Thank you for inviting me.", "招待してくれてありがとう。"],["p231", "Maybe next time.", "また今度にします。"],["p232", "I'm afraid I can't make it.", "残念ですが、行けません。"]],
  r:[["I'm having a party on Friday. Please come!", 5],["Do you want to see a movie tonight?", 6, "今夜は都合が悪い"],["Great, see you at my house on Saturday!", 4]],
  c:{sit:"友人から週末の集まりに誘われる",t:[["I'm having a barbecue on Sunday. You are invited!", 5],["You're welcome! It starts at noon.", 4],["Just bring a drink. Do you want to go shopping after the party?", 6]]}},
 {t:"第三十歩 予約",d:"電話で予約する",p:[
  ["p233", "I'd like to make a reservation.", "予約をしたいのですが。"],["p234", "For two people at seven.", "7時に2名でお願いします。"],["p235", "Do you have a table tonight?", "今夜、席は空いていますか？"],["p236", "Under the name Sato.", "佐藤の名前でお願いします。"],["p237", "Can I change my reservation?", "予約を変更できますか？"],["p238", "I'd like to cancel it.", "キャンセルしたいのですが。"],["p239", "What time do you close?", "何時に閉まりますか？"],["p240", "I'll be there soon.", "もうすぐ着きます。"]],
  r:[["Thank you for calling. How can I help you?", 0],["For how many people, and what time?", 1],["May I have your name, please?", 3]],
  c:{sit:"レストランに電話をかける",t:[["Hello, Green Garden restaurant.", 0],["Certainly. For how many people and what time?", 1],["Thank you. Can I have your name?", 3]]}},
 {t:"第三十一歩 行き違い",d:"店でのトラブルを伝える",p:[
  ["p241", "This is not what I ordered.", "注文したものと違います。"],["p242", "My order hasn't come yet.", "注文がまだ来ていません。"],["p243", "I think this is wrong.", "これは間違っていると思います。"],["p244", "Can I return this?", "これを返品できますか？"],["p245", "It doesn't work.", "動きません。"],["p246", "Can I get a refund?", "返金してもらえますか？"],["p247", "Could you check again?", "もう一度確認してもらえますか？"],["p248", "I'd like to exchange this.", "これを交換したいのですが。"]],
  r:[["Here is your pasta.", 0, "ピザを注文したのにパスタが来た"],["Is everything okay with the bill?", 2, "会計の金額が違う"],["Is something wrong with the camera?", 4]],
  c:{sit:"買ったばかりの時計を店に持っていく",t:[["Hello. Is there a problem with the watch?", 4],["I'm sorry about that. What would you like to do?", 7],["I'm afraid we don't have the same one now.", 5]]}},
 {t:"第三十二歩 案内",d:"道を教える",p:[
  ["p249", "Go straight for two blocks.", "2ブロックまっすぐ進んでください。"],["p250", "Turn right at the light.", "信号を右に曲がってください。"],["p251", "It's on your left.", "左側にあります。"],["p252", "You can't miss it.", "すぐにわかりますよ。"],["p253", "It's about five minutes on foot.", "歩いて5分くらいです。"],["p254", "I'll show you the way.", "道を案内しますよ。"],["p255", "You should take a taxi.", "タクシーに乗ったほうがいいですよ。"],["p256", "I'm not from here.", "このあたりの者ではありません。"]],
  r:[["Excuse me, how do I get to the museum?", 0, "美術館は2ブロック先"],["Is it far from here?", 4, "歩いて5分ほど"],["Do you know where the city hall is?", 7, "自分も旅行者で知らない"]],
  c:{sit:"旅行者に駅までの道を聞かれる",t:[["Excuse me. How can I get to the station?", 0],["Two blocks. And then?", 1],["I see. Is it easy to find?", 3]]}},
 {t:"第三十三歩 理由",d:"理由をたずねる・答える",p:[
  ["p257", "Why are you learning English?", "なぜ英語を学んでいるのですか？"],["p258", "Because I want to travel.", "旅行したいからです。"],["p259", "That's why I'm here.", "だからここにいるのです。"],["p260", "What happened?", "何があったのですか？"],["p261", "I was late because of the rain.", "雨のせいで遅れました。"],["p262", "I'm tired, so I'll go home.", "疲れたので家に帰ります。"],["p263", "How come?", "どうして？"],["p264", "No particular reason.", "特に理由はありません。"]],
  r:[["Why are you learning English?", 1],["I can't go to the party tonight.", 6],["Why were you late this morning?", 4]],
  c:{sit:"英会話教室で先生と話す",t:[["Welcome to the class. Why are you learning English?", 1],["That's a great reason. You look sleepy. Do you want to practice more today?", 5],["Okay. Oh no, I have to cancel next week's class.", 6]]}},
 {t:"第三十四歩 もしも",d:"条件をつけて話す",p:[
  ["p265", "If it rains, I'll stay home.", "雨なら家にいます。"],["p266", "Call me when you arrive.", "着いたら電話してください。"],["p267", "If you have time, please come.", "時間があれば来てください。"],["p268", "Let me know if you need help.", "助けが必要なら知らせてください。"],["p269", "I'll go if you go.", "あなたが行くなら私も行きます。"],["p270", "When I was a child, I lived in Osaka.", "子どものころ、大阪に住んでいました。"],["p271", "If I were you, I would go.", "私があなたなら、行きます。"],["p272", "I'll tell you when I know.", "わかったら伝えます。"]],
  r:[["What will you do tomorrow?", 0, "天気しだいで決める"],["Are you going to the festival?", 4],["I got a job offer in Tokyo. Should I go?", 6]],
  c:{sit:"友人が引っ越しの準備をしている",t:[["I'm moving on Saturday. There are so many boxes.", 3],["Thank you. I leave for the new house at nine.", 1],["Sure. What time will your sister come to help?", 7]]}},
 {t:"第三十五歩 姿",d:"物や人のようすを説明する",p:[
  ["p273", "What does it look like?", "それはどんな見た目ですか？"],["p274", "It's small and black.", "小さくて黒いです。"],["p275", "It's made of wood.", "木でできています。"],["p276", "What is it used for?", "それは何に使うのですか？"],["p277", "It's used for cooking.", "料理に使います。"],["p278", "She has long hair.", "彼女は髪が長いです。"],["p279", "He looks like his father.", "彼は父親に似ています。"],["p280", "It's something like this.", "こんな感じのものです。"]],
  r:[["I found a wallet. What does yours look like?", 1],["What is this tool used for?", 4],["What does your sister look like?", 5]],
  c:{sit:"友人に旅のおみやげを見せられる。木のスプーンだった",t:[["I bought this in Kyoto. Can you guess what it is?", 3],["It's a spoon. Here, feel it.", 2],["Right! And look at this photo of Ken's son.", 6]]}},
 {t:"第三十六歩 学び",d:"英語についてたずねる",p:[
  ["p281", "How do you say this in English?", "これは英語で何と言いますか？"],["p282", "How do you spell it?", "つづりはどう書きますか？"],["p283", "What's the difference?", "違いは何ですか？"],["p284", "Is this correct?", "これで合っていますか？"],["p285", "I made a mistake.", "間違えました。"],["p286", "Could you explain it again?", "もう一度説明してもらえますか？"],["p287", "I'm still learning.", "まだ勉強中です。"],["p288", "I want to speak fluently.", "流ちょうに話したいです。"]],
  r:[["My name is Siobhan.", 1, "名前のつづりがわからない"],["Your English is very good!", 6],["Why do you practice every day?", 7]],
  c:{sit:"英語の先生に質問する",t:[["Do you have any questions about these two words?", 2],["One is for people and the other is for things. Is that clear?", 5],["Of course. Your English is getting better!", 6]]}},
 {t:"第三十七歩 うわさ",d:"聞いた話を伝える",p:[
  ["p289", "I heard you got a new job.", "新しい仕事に就いたと聞きました。"],["p290", "Did you know that?", "それを知っていましたか？"],["p291", "Are you serious?", "本当ですか？"],["p292", "I didn't know that.", "それは知りませんでした。"],["p293", "Who told you that?", "だれから聞いたのですか？"],["p294", "It's a secret.", "秘密です。"],["p295", "I'm not sure.", "よくわかりません。"],["p296", "That's good news.", "それはいい知らせですね。"]],
  r:[["Tom is moving to Japan next month.", 3],["I passed the driving test!", 7],["Is the store open on Sunday?", 6]],
  c:{sit:"同僚と休憩中に話す",t:[["Guess what? I'm getting married next month!", 2],["Yes! And we are moving to Hawaii.", 7],["By the way, is the boss coming to the office today?", 6]]}},
 {t:"第三十八歩 相談",d:"相談する・助言する",p:[
  ["p297", "What should I do?", "どうすればいいですか？"],["p298", "Can I ask your advice?", "相談してもいいですか？"],["p299", "Why don't you ask him?", "彼に聞いてみたらどうですか？"],["p300", "You'd better see a doctor.", "医者に診てもらったほうがいいですよ。"],["p301", "I can't decide.", "決められません。"],["p302", "It's up to you.", "あなたしだいです。"],["p303", "That's a good idea.", "それはいい考えですね。"],["p304", "Take your time.", "ゆっくりでいいですよ。"]],
  r:[["Where shall we eat tonight?", 5],["Let's ask the teacher for help.", 6],["Sorry, I need a few more minutes.", 7]],
  c:{sit:"友人の悩みを聞く",t:[["I have had a stomachache for a week.", 3],["You're right. Also, I don't know if my boss will give me a day off.", 2],["I'll do that. Sorry, I need time to think about it.", 7]]}},
 {t:"第三十九歩 祝い",d:"お祝いとお礼を言う",p:[
  ["p305", "Happy birthday!", "お誕生日おめでとう。"],["p306", "Congratulations on your wedding.", "ご結婚おめでとうございます。"],["p307", "This is for you.", "これをどうぞ。"],["p308", "I hope you like it.", "気に入ってもらえるといいのですが。"],["p309", "You shouldn't have.", "そんな、わざわざ。", "贈り物をもらって、恐縮する"],["p310", "I really appreciate it.", "本当に感謝しています。"],["p311", "Happy New Year.", "あけましておめでとう。"],["p312", "Good luck with your exam.", "試験がんばってね。"]],
  r:[["Today is my birthday!", 0],["I have a test tomorrow.", 7],["Here is a small present for you.", 5]],
  c:{sit:"友人の誕生日パーティーで",t:[["Hi! Thanks for coming to my party.", 0],["Thank you! Oh, what is that box?", 2],["For me? Can I open it?", 3]]}},
 {t:"第四十歩 夢",d:"目標と夢を話す",p:[
  ["p313", "What's your dream?", "あなたの夢は何ですか？"],["p314", "I want to be a teacher.", "先生になりたいです。"],["p315", "I've decided to study abroad.", "留学することに決めました。"],["p316", "I'm working on it.", "取り組んでいるところです。"],["p317", "It's never too late.", "遅すぎることはありません。"],["p318", "I'll keep trying.", "挑戦し続けます。"],["p319", "My goal is to speak English well.", "目標は英語を上手に話すことです。"],["p320", "One step at a time.", "一歩ずつ。"]],
  r:[["What do you want to be in the future?", 1],["Is your report finished?", 3, "まだ作業の途中"],["Am I too old to start learning?", 4]],
  c:{sit:"進路について先輩と話す",t:[["So, what do you want to be in the future?", 1],["Wonderful. What is your plan for next year?", 2],["That is a big step. English is hard, isn't it?", 5]]}},
 {t:"第四十一歩 素顔",d:"自分のことをくわしく話す",p:[
  ["p321", "I was born in Osaka.", "大阪で生まれました。"],["p322", "I grew up in a small town.", "小さな町で育ちました。"],["p323", "I'm in my thirties.", "30代です。"],["p324", "I'm an only child.", "一人っ子です。"],["p325", "I've been married for five years.", "結婚して5年になります。"],["p326", "I moved here last year.", "去年ここに引っ越してきました。"],["p327", "I'm interested in history.", "歴史に興味があります。"],["p328", "Let me introduce myself.", "自己紹介させてください。"]],
  r:[["Where were you born?", 0],["Do you have any brothers or sisters?", 3],["How long have you lived here?", 5, "去年引っ越してきた"]],
  c:{sit:"新しい職場の歓迎会で",t:[["Everyone, this is our new team member. Please say a few words.", 7],["Nice to meet you. Are you from this city?", 5],["I see. What are you interested in?", 6]]}},
 {t:"第四十二歩 住まい",d:"家と部屋について話す",p:[
  ["p329", "I live in an apartment.", "アパートに住んでいます。"],["p330", "It has two bedrooms.", "寝室が2つあります。"],["p331", "The rent is too high.", "家賃が高すぎます。"],["p332", "It's close to the station.", "駅に近いです。"],["p333", "My room is on the third floor.", "私の部屋は3階にあります。"],["p334", "I'm looking for a new place.", "新しい住まいを探しています。"],["p335", "The neighbors are friendly.", "近所の人たちは親切です。"],["p336", "Make yourself at home.", "くつろいでくださいね。", "家に来た客に"]],
  r:[["What kind of place do you live in?", 0],["Why do you want to move?", 2, "家賃が高い"],["Thank you for inviting me to your house.", 7]],
  c:{sit:"同僚と住まいの話をする",t:[["Do you live in a house?", 0],["How is the location?", 3],["Sounds perfect. So why are you checking apartment websites?", 2]]}},
 {t:"第四十三歩 台所",d:"料理と味について話す",p:[
  ["p337", "What are you making?", "何を作っているのですか？"],["p338", "It smells good.", "いいにおいですね。"],["p339", "How does it taste?", "味はどうですか？"],["p340", "It's a little salty.", "少ししょっぱいです。"],["p341", "Can you pass me the salt?", "塩を取ってもらえますか？"],["p342", "I'll do the dishes.", "私が皿洗いをします。"],["p343", "Dinner is ready.", "夕食ができました。"],["p344", "Help yourself.", "ご自由にどうぞ。", "料理をすすめるとき"]],
  r:[["I'm making curry tonight.", 1],["Try this soup. How is it?", 3, "塩が少し強い"],["I cooked dinner, so I'm a little tired.", 5]],
  c:{sit:"友人の家で夕食をごちそうになる",t:[["Come into the kitchen. I'm cooking something special.", 0],["It's my mother's stew. It's almost ready.", 1],["That was a big dinner. Now I have to clean up.", 5]]}},
 {t:"第四十四歩 習慣",d:"健康と毎日の習慣を話す",p:[
  ["p345", "I work out twice a week.", "週に2回運動します。"],["p346", "I try to eat healthy food.", "健康的な食事を心がけています。"],["p347", "I didn't sleep well last night.", "昨夜はよく眠れませんでした。"],["p348", "I'm trying to lose weight.", "やせようとしています。"],["p349", "I gave up sweets.", "甘いものをやめました。"],["p350", "I go jogging every morning.", "毎朝ジョギングをします。"],["p351", "I need more exercise.", "もっと運動が必要です。"],["p352", "You look healthy.", "元気そうですね。"]],
  r:[["How often do you exercise?", 0],["You look sleepy today.", 2],["What do you do in the morning?", 5]],
  c:{sit:"ジムで知り合いに会う",t:[["Hi! Do you come to this gym often?", 0],["Good for you. Would you like a piece of cake after this?", 4],["Really? You look a little tired today, though.", 2]]}},
 {t:"第四十五歩 季節",d:"季節と行事を話す",p:[
  ["p353", "Which season do you like best?", "どの季節がいちばん好きですか？"],["p354", "I like spring the best.", "春がいちばん好きです。"],["p355", "It's getting warmer.", "暖かくなってきました。"],["p356", "The leaves are turning red.", "葉が赤く色づいています。"],["p357", "It snowed a lot last winter.", "去年の冬は雪がたくさん降りました。"],["p358", "Summer is too hot for me.", "夏は私には暑すぎます。"],["p359", "The cherry blossoms are beautiful.", "桜がきれいです。"],["p360", "I can't wait for the holidays.", "休暇が待ちきれません。"]],
  r:[["Which season do you like best?", 1],["It's nice outside today, isn't it?", 2],["Do you like summer?", 5]],
  c:{sit:"公園を散歩しながら",t:[["It's so warm. I don't need my jacket today.", 2],["Look at those pink trees over there!", 6],["They are lovely. Do you like spring?", 1]]}},
 {t:"第四十六歩 手続き",d:"銀行と郵便局で用事をすます",p:[
  ["p361", "I'd like to send this package.", "この荷物を送りたいのですが。"],["p362", "How much is the postage?", "送料はいくらですか？"],["p363", "How long will it take?", "どのくらいかかりますか？"],["p364", "I'd like to open an account.", "口座を開きたいのですが。"],["p365", "Where is the nearest ATM?", "いちばん近いATMはどこですか？"],["p366", "Where do I sign?", "どこに署名すればいいですか？"],["p367", "I'd like to withdraw some money.", "お金を引き出したいのですが。"],["p368", "Can I use this card here?", "このカードはここで使えますか？"]],
  r:[["Next, please. How can I help you?", 0, "荷物を送りに来た"],["Here is the form for your new account.", 5],["We can send it by air or by sea.", 2]],
  c:{sit:"郵便局の窓口で",t:[["Good morning. What can I do for you?", 0],["To Japan? It will be twenty dollars by air.", 2],["About five days. Please fill in this form.", 5]]}},
 {t:"第四十七歩 身支度",d:"美容院やクリーニング店で頼む",p:[
  ["p369", "I'd like a haircut.", "髪を切りたいのですが。"],["p370", "Just a trim, please.", "少しそろえるだけでお願いします。"],["p371", "Not too short, please.", "短くしすぎないでください。"],["p372", "How long is the wait?", "待ち時間はどのくらいですか？"],["p373", "Can I make an appointment?", "予約できますか？"],["p374", "I like it very much.", "とても気に入りました。"],["p375", "When will it be ready?", "いつ仕上がりますか？"],["p376", "I'd like to have this cleaned.", "これをクリーニングしてほしいのですが。"]],
  r:[["Hello. What can I do for you today?", 0, "美容院で"],["How would you like your hair?", 1],["All done. What do you think?", 5]],
  c:{sit:"予約なしで美容院に入る",t:[["Hello. We are a little busy right now.", 3],["About twenty minutes. What would you like today?", 1],["Okay. How short should I cut the sides?", 2]]}},
 {t:"第四十八歩 運転",d:"車を借りる・運転する",p:[
  ["p377", "I'd like to rent a car.", "車を借りたいのですが。"],["p378", "Do you have an automatic car?", "オートマチック車はありますか？"],["p379", "Does it include insurance?", "保険は含まれていますか？"],["p380", "Where can I park?", "どこに駐車できますか？"],["p381", "Fill it up, please.", "満タンでお願いします。"],["p382", "I have a flat tire.", "タイヤがパンクしました。"],["p383", "Where is the nearest gas station?", "いちばん近いガソリンスタンドはどこですか？"],["p384", "How do I get to the highway?", "高速道路へはどう行けばいいですか？"]],
  r:[["Good morning. How can I help you?", 0, "レンタカーの店で"],["How much gas would you like?", 4],["Why did you stop the car?", 5]],
  c:{sit:"レンタカーの店で",t:[["Good morning. How can I help you?", 0],["Sure. We have small cars and vans.", 1],["Yes, we do. It's fifty dollars a day.", 2]]}},
 {t:"第四十九歩 作品",d:"映画や音楽の感想を話す",p:[
  ["p385", "What kind of music do you like?", "どんな音楽が好きですか？"],["p386", "I'm a big fan of jazz.", "ジャズの大ファンです。"],["p387", "The ending was surprising.", "結末は意外でした。"],["p388", "It made me cry.", "泣いてしまいました。"],["p389", "I couldn't stop laughing.", "笑いが止まりませんでした。"],["p390", "It was a little boring.", "少し退屈でした。"],["p391", "Who is your favorite singer?", "好きな歌手はだれですか？"],["p392", "You should watch it.", "見たほうがいいですよ。"]],
  r:[["What kind of music do you like?", 1],["How was the comedy show?", 4],["Is that new drama good?", 7]],
  c:{sit:"映画を見たあと友人と話す",t:[["So, how did you like the movie?", 3],["Me too. I didn't expect the last scene at all.", 2],["My sister hasn't seen it yet.", 7]]}},
 {t:"第五十歩 つながり",d:"ネットとスマートフォンの話",p:[
  ["p393", "Do you have Wi-Fi here?", "ここにWi-Fiはありますか？"],["p394", "What's the password?", "パスワードは何ですか？"],["p395", "My battery is dying.", "電池が切れそうです。"],["p396", "Can I charge my phone here?", "ここで電話を充電できますか？"],["p397", "I'll send you the link.", "リンクを送ります。"],["p398", "The connection is slow.", "接続が遅いです。"],["p399", "I saw it online.", "ネットで見ました。"],["p400", "Can you take a screenshot?", "スクリーンショットを撮ってもらえますか？"]],
  r:[["We have free Wi-Fi for customers.", 1],["Why are you looking for an outlet?", 2],["Where did you hear that news?", 6]],
  c:{sit:"カフェで店員に聞く",t:[["Hi. Can I help you with anything?", 0],["Yes, it's free for customers.", 1],["It's on your receipt. Do you need anything else?", 3]]}},
 {t:"第五十一歩 職場",d:"仕事中のやりとり",p:[
  ["p401", "Do you have a minute?", "少し時間はありますか？"],["p402", "I'm working on the report.", "報告書に取り組んでいます。"],["p403", "When is the deadline?", "締め切りはいつですか？"],["p404", "I'll finish it by Friday.", "金曜日までに終わらせます。"],["p405", "Let's take a break.", "休憩しましょう。"],["p406", "Could you look at this?", "これを見てもらえますか？"],["p407", "I'm in a meeting now.", "今、会議中です。"],["p408", "I'll get back to you.", "あとで連絡します。"]],
  r:[["Sure. What's up?", 5, "書類を確認してほしい"],["When can you finish the report?", 3],["We have been working for three hours.", 4]],
  c:{sit:"上司に仕事の進み具合を聞かれる",t:[["Hi. What are you doing right now?", 1],["Good. When will it be done?", 3],["Great. Also, can you join the new project team?", 7]]}},
 {t:"第五十二歩 面接",d:"面接で自分を伝える",p:[
  ["p409", "Thank you for your time today.", "本日はお時間をありがとうございます。"],["p410", "I have five years of experience.", "5年の経験があります。"],["p411", "I worked as a sales manager.", "営業マネージャーとして働いていました。"],["p412", "My strength is teamwork.", "私の強みはチームワークです。"],["p413", "I'm a fast learner.", "覚えるのが早いです。"],["p414", "I'd like to work here.", "ここで働きたいです。"],["p415", "When can I start?", "いつから始められますか？"],["p416", "I look forward to hearing from you.", "ご連絡をお待ちしています。"]],
  r:[["Tell me about your experience.", 1],["What is your strength?", 3],["What did you do at your last job?", 2]],
  c:{sit:"面接の終わりに",t:[["We use new software here. Can you learn it?", 4],["Good. Do you have any questions for us?", 6],["Next month, if you are chosen. We will contact you soon.", 7]]}},
 {t:"第五十三歩 意見",d:"意見をていねいに言う",p:[
  ["p417", "In my opinion, it's too early.", "私の意見では、早すぎます。"],["p418", "I think so too.", "私もそう思います。"],["p419", "I don't think so.", "そうは思いません。"],["p420", "I see your point.", "おっしゃることはわかります。"],["p421", "It depends.", "場合によります。"],["p422", "That makes sense.", "なるほど、筋が通っています。"],["p423", "I'm not sure about that.", "それはどうでしょうか。"],["p424", "Let me think about it.", "考えさせてください。"]],
  r:[["I think this plan is the best.", 1],["Do you think city life is better?", 4],["Can you give me your answer now?", 7]],
  c:{sit:"同僚と新しい企画について話す",t:[["Let's start the new project tomorrow!", 0],["But if we wait, other companies will be first.", 3],["Do you agree with my plan or not?", 7]]}},
 {t:"第五十四歩 胸のうち",d:"気持ちをくわしく伝える",p:[
  ["p425", "I'm worried about the test.", "テストが心配です。"],["p426", "I'm nervous about the interview.", "面接のことで緊張しています。"],["p427", "I'm so relieved.", "とてもほっとしました。"],["p428", "I was disappointed.", "がっかりしました。"],["p429", "I'm excited about the trip.", "旅行が楽しみでわくわくしています。"],["p430", "I'm fed up with it.", "もううんざりです。"],["p431", "I feel lonely sometimes.", "ときどきさびしくなります。"],["p432", "I can't believe it.", "信じられません。"]],
  r:[["Your bag was found at the station.", 2],["You are traveling to Hawaii next week, right?", 4],["You won the first prize!", 7]],
  c:{sit:"友人に近況を話す",t:[["You have a job interview tomorrow, right? How do you feel?", 1],["Don't worry. By the way, I found your lost wallet!", 2],["And look, there is extra money in it. It's my birthday present for you.", 7]]}},
 {t:"第五十五歩 受け身",d:"「～される」を言う",p:[
  ["p433", "This temple was built long ago.", "この寺はずっと昔に建てられました。"],["p434", "English is spoken here.", "ここでは英語が話されています。"],["p435", "My bike was stolen.", "自転車を盗まれました。"],["p436", "I was invited to the party.", "パーティーに招待されました。"],["p437", "The store is closed today.", "その店は今日は閉まっています。"],["p438", "It was written by a famous author.", "有名な作家によって書かれました。"],["p439", "The meeting was canceled.", "会議は中止になりました。"],["p440", "I was told to wait here.", "ここで待つように言われました。"]],
  r:[["Why are you walking today?", 2],["Why are you standing here?", 7],["Are we still meeting at three?", 6]],
  c:{sit:"友人と街を歩く",t:[["Let's go into that shop. Oh, the door doesn't open.", 4],["Too bad. Wow, look at this old temple.", 0],["You know a lot. Are you going to Mika's party tonight?", 3]]}},
 {t:"第五十六歩 つなぐ言葉",d:"人や物に説明を足す",p:[
  ["p441", "She is the person who helped me.", "彼女が私を助けてくれた人です。"],["p442", "This is the book that I bought.", "これが私が買った本です。"],["p443", "I know a shop that sells it.", "それを売っている店を知っています。"],["p444", "That's the place where we met.", "あそこが私たちが出会った場所です。"],["p445", "Is this the bus that goes downtown?", "これは中心街へ行くバスですか？"],["p446", "The man who called you is here.", "あなたに電話した男性が来ています。"],["p447", "That's what I wanted.", "それが私の欲しかったものです。"],["p448", "I forgot what he said.", "彼が何と言ったか忘れました。"]],
  r:[["Where can I buy a phone charger?", 2],["Here is your birthday present.", 6],["What did the teacher say?", 7]],
  c:{sit:"思い出の場所を友人と歩く",t:[["Do you remember this cafe?", 3],["Yes! And that woman is waving at you. Do you know her?", 0],["She looks nice. Look, I got you this scarf.", 6]]}},
 {t:"第五十七歩 気づかい",d:"とてもていねいに頼む",p:[
  ["p449", "Would you mind opening the window?", "窓を開けていただけませんか？"],["p450", "I was wondering if you could help me.", "手伝っていただけないかと思いまして。"],["p451", "Could you possibly wait a moment?", "少しお待ちいただくことはできますか？"],["p452", "Would it be okay if I sat here?", "ここに座ってもよろしいでしょうか？"],["p453", "I'm sorry to bother you.", "お邪魔してすみません。"],["p454", "I'd appreciate it.", "そうしていただけると助かります。"],["p455", "Not at all.", "全然かまいませんよ。", "Would you mind ～? に快く応じる"],["p456", "If you don't mind.", "もしよろしければ。"]],
  r:[["Would you mind closing the door?", 6, "かまわないので引き受ける"],["I can carry your bag for you.", 5],["Shall I make some tea for you?", 7]],
  c:{sit:"図書館で知らない人に声をかける",t:[["Hello? Do you need something?", 4],["That's all right. What is it?", 3],["Sure, go ahead. Shall I move my bag for you?", 5]]}},
 {t:"第五十八歩 もしもの話",d:"願いと後悔を言う",p:[
  ["p457", "I wish I had more time.", "もっと時間があればいいのに。"],["p458", "I should have studied harder.", "もっと勉強しておけばよかった。"],["p459", "If I had money, I would travel.", "お金があれば旅行するのに。"],["p460", "I wish I could go.", "行けたらいいのに。"],["p461", "I shouldn't have said that.", "あんなことを言うべきではありませんでした。"],["p462", "It could be worse.", "まだましなほうです。"],["p463", "I would if I could.", "できるならそうします。"],["p464", "If only I had known.", "知ってさえいたら。"]],
  r:[["Can you come to the concert with us?", 3, "行きたいが行けない"],["She looked so sad after what you said.", 4],["Can you help me move tomorrow?", 6, "手伝いたいが無理"]],
  c:{sit:"試験のあと友人と話す",t:[["How was the exam?", 1],["Well, you passed, but only just.", 5],["We are going to the beach to celebrate. You have to work, right?", 3]]}},
 {t:"第五十九歩 旅じたく",d:"旅の計画を立てる",p:[
  ["p465", "I'm planning a trip to Italy.", "イタリア旅行を計画しています。"],["p466", "How many days do you need?", "何日必要ですか？"],["p467", "I've booked a hotel.", "ホテルを予約しました。"],["p468", "What do you recommend seeing?", "何を見るのがおすすめですか？"],["p469", "Is it worth visiting?", "訪れる価値はありますか？"],["p470", "I'd rather go by train.", "電車で行くほうがいいです。"],["p471", "Let's make a plan.", "計画を立てましょう。"],["p472", "I can't wait to go.", "行くのが待ちきれません。"]],
  r:[["Where are you going this summer?", 0],["Shall we fly or take the train?", 5],["Have you found a place to stay?", 2]],
  c:{sit:"旅行好きの友人に相談する",t:[["You look happy. What's going on?", 0],["Italy! I lived in Rome for a year.", 3],["See the old city first. Will you fly from Rome to Venice?", 5]]}},
 {t:"第六十歩 雑談",d:"会話を続ける",p:[
  ["p473", "Nice weather, isn't it?", "いい天気ですね。"],["p474", "I love your jacket.", "そのジャケット、すてきですね。"],["p475", "How was your day?", "今日はどうでしたか？"],["p476", "What have you been up to?", "最近どうしていましたか？"],["p477", "Same as usual.", "いつもどおりです。"],["p478", "That reminds me.", "それで思い出しました。"],["p479", "By the way, are you hungry?", "ところで、お腹はすいていますか？"],["p480", "Tell me more.", "もっと聞かせてください。"]],
  r:[["What have you been up to?", 4],["I started learning the guitar last month.", 7],["Good morning! Are you waiting for the bus too?", 0, "天気の話で会話を始める"]],
  c:{sit:"久しぶりに会った近所の人と",t:[["Oh, hello! Long time no see. How are things?", 4],["Same here. Oh, I started a small bakery last month.", 7],["I talked too much. It's almost noon.", 6]]}},
 {t:"第六十一歩 注文",d:"ネットで買う・届けてもらう",p:[
  ["p481", "I ordered it online.", "ネットで注文しました。"],["p482", "When will it arrive?", "いつ届きますか？"],["p483", "It hasn't arrived yet.", "まだ届いていません。"],["p484", "Is shipping free?", "送料は無料ですか？"],["p485", "I'd like to track my order.", "注文の配送状況を確認したいのですが。"],["p486", "The box was damaged.", "箱が破損していました。"],["p487", "Can I pay in cash?", "現金で払えますか？"],["p488", "Please leave it at the door.", "玄関に置いておいてください。"]],
  r:[["Where did you buy that bag?", 0],["Did you get the package I sent?", 2],["I have a delivery for you. Where should I put it?", 7]],
  c:{sit:"ネットショップの問い合わせ窓口に電話する",t:[["Customer service. How can I help you?", 4],["Let me check. It was sent three days ago.", 2],["I'm sorry. We will send a new one today.", 1]]}},
 {t:"第六十二歩 変更",d:"予定を変える・あやまる",p:[
  ["p489", "Something came up.", "急用ができました。"],["p490", "Can we reschedule?", "日程を変更できますか？"],["p491", "How about next week instead?", "代わりに来週はどうですか？"],["p492", "I'm sorry for the short notice.", "急なお知らせですみません。"],["p493", "Either day is fine.", "どちらの日でも大丈夫です。"],["p494", "I'll make it up to you.", "この埋め合わせはします。"],["p495", "That works for me.", "それで大丈夫です。"],["p496", "Let me know what time suits you.", "都合のいい時間を教えてください。"]],
  r:[["Are we still meeting tonight?", 0, "急用で行けなくなった"],["Which is better for you, Tuesday or Wednesday?", 4],["How about Friday at six?", 6]],
  c:{sit:"約束の日に友人へ電話する",t:[["Hi! Are you on your way to the restaurant?", 0],["Oh no. So you can't come today?", 1],["Sure. How about next Friday at seven?", 6]]}},
 {t:"第六十三歩 診察",d:"病院で症状を伝える",p:[
  ["p497", "I'd like to see a doctor.", "診察を受けたいのですが。"],["p498", "I've had a cough for three days.", "3日間せきが続いています。"],["p499", "It hurts when I swallow.", "飲み込むと痛みます。"],["p500", "I feel dizzy.", "めまいがします。"],["p501", "I'm allergic to eggs.", "卵アレルギーがあります。"],["p502", "Do I need a prescription?", "処方せんは必要ですか？"],["p503", "How long will it take to get better?", "よくなるまでどのくらいかかりますか？"],["p504", "Should I come back again?", "また来たほうがいいですか？"]],
  r:[["Hello. What brings you here today?", 1],["Do you have any allergies?", 4],["Take this medicine twice a day.", 6]],
  c:{sit:"診察室で医師と話す",t:[["Please sit down. What seems to be the problem?", 1],["I see. Does your throat hurt?", 2],["It's a cold. Rest and drink a lot of water.", 6]]}},
 {t:"第六十四歩 教室",d:"授業で使う言葉",p:[
  ["p505", "May I ask a question?", "質問してもいいですか？"],["p506", "I don't know the answer.", "答えがわかりません。"],["p507", "Could you repeat that, please?", "もう一度言っていただけますか？"],["p508", "What page are we on?", "今、何ページですか？"],["p509", "I forgot my homework.", "宿題を忘れました。"],["p510", "When is the test?", "テストはいつですか？"],["p511", "Can I borrow your notes?", "ノートを借りてもいいですか？"],["p512", "I finally understand.", "やっとわかりました。"]],
  r:[["Yes? Did you raise your hand?", 0],["Please open your textbooks.", 3],["Do you understand it now?", 7]],
  c:{sit:"授業中に先生と話す",t:[["Please hand in your homework now.", 4],["Bring it tomorrow. Now, let's read the story together.", 3],["Page forty. Any other questions?", 5]]}},
 {t:"第六十五歩 家事",d:"家の用事を分け合う",p:[
  ["p513", "I'll take out the trash.", "私がごみを出します。"],["p514", "Can you do the laundry?", "洗濯をしてもらえますか？"],["p515", "It's your turn to cook.", "料理はあなたの番です。"],["p516", "I need to clean my room.", "部屋を掃除しなければなりません。"],["p517", "The sink is leaking.", "流し台から水がもれています。"],["p518", "We're out of milk.", "牛乳を切らしています。"],["p519", "I'll go grocery shopping.", "食料品の買い物に行きます。"],["p520", "Let's share the housework.", "家事を分け合いましょう。"]],
  r:[["The trash is full again.", 0],["Who will make dinner tonight?", 2, "今日は相手の番"],["Can I have cereal with milk for breakfast?", 5]],
  c:{sit:"週末の朝、同居人と",t:[["There is water all over the kitchen floor!", 4],["I'll call someone to fix it. Can you make coffee with milk?", 5],["Oh. Then one of us has to go to the store.", 6]]}},
 {t:"第六十六歩 生きもの",d:"ペットや動物の話",p:[
  ["p521", "Do you have any pets?", "ペットを飼っていますか？"],["p522", "I have two cats.", "猫を2匹飼っています。"],["p523", "What's your dog's name?", "犬の名前は何ですか？"],["p524", "He is very friendly.", "とても人なつっこいです。"],["p525", "I walk my dog every day.", "毎日犬を散歩させます。"],["p526", "I'm afraid of snakes.", "ヘビがこわいです。"],["p527", "Can I pet your dog?", "犬をなでてもいいですか？"],["p528", "She is three years old.", "3歳です。"]],
  r:[["Do you have any pets?", 1],["Does your dog bite?", 3],["How old is your cat?", 7]],
  c:{sit:"公園で犬を連れた人に会う",t:[["Hello! My dog likes you.", 6],["Of course. He won't bite you.", 3],["Yes, he loves people. Do you have a dog too?", 4]]}},
 {t:"第六十七歩 応援",d:"スポーツを見る・応援する",p:[
  ["p529", "Which team do you support?", "どのチームを応援していますか？"],["p530", "What's the score?", "得点はどうなっていますか？"],["p531", "We won the game.", "試合に勝ちました。"],["p532", "They lost by one point.", "1点差で負けました。"],["p533", "It was a close game.", "接戦でした。"],["p534", "Who is winning?", "どちらが勝っていますか？"],["p535", "What a great goal!", "なんてすばらしいゴールでしょう！"],["p536", "Let's go and cheer for them.", "応援しに行きましょう。"]],
  r:[["How was the game last night?", 4],["Did your team win yesterday?", 2],["The final is on Sunday. Do you have plans?", 7]],
  c:{sit:"友人の家でサッカーを見る",t:[["Come in! The game started twenty minutes ago.", 5],["The blue team, two to one. Oh, look! He scores!", 6],["It's over! What a match. How did your team do last week?", 3]]}},
 {t:"第六十八歩 お金",d:"値段と支払いの話",p:[
  ["p537", "How much does it cost?", "それはいくらかかりますか？"],["p538", "It's on sale today.", "今日はセール中です。"],["p539", "Let's split the bill.", "割り勘にしましょう。"],["p540", "It's my treat.", "私のおごりです。"],["p541", "I can't afford it.", "それを買う余裕はありません。"],["p542", "I'm saving money for a trip.", "旅行のために貯金しています。"],["p543", "Do you have change?", "小銭はありますか？"],["p544", "That's a good deal.", "それはお買い得ですね。"]],
  r:[["Shall I pay for dinner?", 2],["Why don't you buy a new car?", 4],["This jacket is half price today.", 7]],
  c:{sit:"友人とレストランで会計をする。今日は自分がごちそうしたい",t:[["Here is the bill. Shall we each pay half?", 3],["Really? You are so kind. Why don't we go to Hawaii together next month?", 4],["I see. Look, this hotel is only fifty dollars a night.", 7]]}},
 {t:"第六十九歩 遅れ",d:"交通のトラブルを伝える",p:[
  ["p545", "The train is delayed.", "電車が遅れています。"],["p546", "I missed my flight.", "飛行機に乗り遅れました。"],["p547", "My flight was canceled.", "私の便が欠航になりました。"],["p548", "Is there another bus?", "別のバスはありますか？"],["p549", "I got on the wrong train.", "電車を乗り間違えました。"],["p550", "I'm stuck in traffic.", "渋滞にはまっています。"],["p551", "How long is the delay?", "どのくらい遅れていますか？"],["p552", "Can I get a later flight?", "もっと遅い便に変更できますか？"]],
  r:[["Where are you? The meeting has started.", 5, "車で向かっている"],["Why are you still at the airport?", 2],["I'm sorry, that bus has just left.", 3]],
  c:{sit:"空港のカウンターで",t:[["I'm sorry, the gate for that flight is closed.", 1],["Yes, I'm afraid so. How can I help you?", 7],["There is one at six, but it is running late.", 6]]}},
 {t:"第七十歩 緊急",d:"緊急のときに助けを呼ぶ",p:[
  ["p553", "Please call an ambulance.", "救急車を呼んでください。"],["p554", "There has been an accident.", "事故がありました。"],["p555", "Someone stole my bag.", "だれかにかばんを盗まれました。"],["p556", "I need the police.", "警察を呼んでほしいです。"],["p557", "Is anyone hurt?", "けがをした人はいますか？"],["p558", "I'm lost and need help.", "道に迷って困っています。"],["p559", "Where is the emergency exit?", "非常口はどこですか？"],["p560", "Please hurry.", "急いでください。"]],
  r:[["What happened here?", 1],["You look upset. Are you okay?", 2],["This is the front desk. How can I help you?", 0, "同行者が倒れた"]],
  c:{sit:"事故の現場に通りかかる",t:[["Oh no! Did you see that? Two cars hit each other!", 4],["Yes, the driver is not moving!", 0],["I'm calling now. They say ten minutes.", 7]]}},
 {t:"第七十一歩 人柄",d:"人の性格を話す",p:[
  ["p561", "What is she like?", "彼女はどんな人ですか？"],["p562", "She is easy to talk to.", "彼女は話しやすい人です。"],["p563", "He is a little shy.", "彼は少し内気です。"],["p564", "My boss is very strict.", "上司はとても厳しいです。"],["p565", "We get along well.", "私たちは仲がいいです。"],["p566", "He always makes me laugh.", "彼はいつも私を笑わせてくれます。"],["p567", "She never gives up.", "彼女は決してあきらめません。"],["p568", "We have a lot in common.", "私たちには共通点がたくさんあります。"]],
  r:[["What is your new teacher like?", 1],["How is your new roommate?", 4],["Why do you like him so much?", 5]],
  c:{sit:"友人に新しい職場のことを聞かれる",t:[["How is your new boss?", 3],["That sounds hard. And your new coworker, Lisa?", 1],["Good. Do you two like the same things?", 7]]}},
 {t:"第七十二歩 昔",d:"以前の習慣を話す",p:[
  ["p569", "I used to live in Tokyo.", "以前は東京に住んでいました。"],["p570", "I used to play the piano.", "以前はピアノを弾いていました。"],["p571", "We used to be neighbors.", "私たちは以前、隣同士でした。"],["p572", "I didn't use to like coffee.", "以前はコーヒーが好きではありませんでした。"],["p573", "Things have changed a lot.", "いろいろなことが大きく変わりました。"],["p574", "I remember it well.", "よく覚えています。"],["p575", "It brings back memories.", "なつかしい気持ちになります。"],["p576", "Those were the days.", "あのころはよかったですね。"]],
  r:[["Do you play any instruments?", 1, "今は弾いていない"],["Look at this old photo of our school.", 6],["Have you always lived here?", 0]],
  c:{sit:"同窓会で昔の友人と",t:[["How do you two know each other?", 2],["Really? Do you remember our old street?", 5],["We played outside every day until dark.", 7]]}},
 {t:"第七十三歩 数と量",d:"数や量をたずねる・答える",p:[
  ["p577", "How many people are coming?", "何人来ますか？"],["p578", "How much time do we have?", "時間はどのくらいありますか？"],["p579", "I have a few questions.", "質問がいくつかあります。"],["p580", "There is a little milk left.", "牛乳が少し残っています。"],["p581", "That's more than enough.", "それで十分すぎるほどです。"],["p582", "We don't have much time.", "あまり時間がありません。"],["p583", "There are too many people.", "人が多すぎます。"],["p584", "Just a little, please.", "少しだけお願いします。"]],
  r:[["Would you like some sugar in your coffee?", 7],["Shall I cook more rice?", 4],["Can we stop for coffee on the way?", 5]],
  c:{sit:"パーティーの準備を友人とする",t:[["I'm planning the party food now.", 0],["About ten. I bought ten pizzas.", 4],["Good. Do you want some wine while we cook?", 7]]}},
 {t:"第七十四歩 手順",d:"やり方を順番に説明する",p:[
  ["p585", "First, turn on the power.", "最初に、電源を入れます。"],["p586", "Then, press this button.", "次に、このボタンを押します。"],["p587", "After that, wait a minute.", "そのあと、少し待ちます。"],["p588", "Finally, check the screen.", "最後に、画面を確認します。"],["p589", "Let me show you how.", "やり方をお見せします。"],["p590", "It's easier than it looks.", "見た目より簡単です。"],["p591", "Be careful not to drop it.", "落とさないように気をつけてください。"],["p592", "That's all you need to do.", "やることはそれだけです。"]],
  r:[["How do I use this machine?", 4],["This looks really difficult.", 5],["Do I need to do anything else?", 7]],
  c:{sit:"新しい同僚にコピー機の使い方を教える",t:[["I have never used this machine before.", 4],["Thank you. What do I do first?", 0],["Okay, it's on. And then?", 1]]}},
 {t:"第七十五歩 確かめ",d:"聞き返す・確認する",p:[
  ["p593", "You mean tomorrow, right?", "明日のことですよね？"],["p594", "Did you say fifteen or fifty?", "15と言いましたか、50と言いましたか？"],["p595", "Let me make sure.", "確認させてください。"],["p596", "Is that what you mean?", "そういう意味ですか？"],["p597", "So, we meet at the station?", "では、駅で会うのですね？"],["p598", "Sorry, I didn't catch that.", "すみません、聞き取れませんでした。"],["p599", "Just to be clear.", "念のため確認ですが。"],["p600", "Exactly, that's right.", "そのとおりです。"]],
  r:[["Let's meet at the usual place on the twelfth.", 0],["Take the second left, then the third right, and it's the fourth door.", 5, "説明が速くて聞き取れなかった"],["So you want two tickets for Friday, correct?", 7]],
  c:{sit:"電話で待ち合わせを決める",t:[["Let's meet in front of the ticket gate.", 4],["Yes. The ticket costs fifty dollars.", 1],["Fifty, not fifteen. So you will bring cash, right?", 7]]}},
 {t:"第七十六歩 伝言",d:"人の言葉を伝える",p:[
  ["p601", "He said he would be late.", "彼は遅れると言っていました。"],["p602", "She told me to wait.", "彼女は私に待つように言いました。"],["p603", "Could you give her a message?", "彼女に伝言をお願いできますか？"],["p604", "Please tell him I called.", "私から電話があったと彼に伝えてください。"],["p605", "I'll let her know.", "彼女に伝えておきます。"],["p606", "She asked me to help.", "彼女に手伝ってほしいと頼まれました。"],["p607", "They said it was closed.", "閉まっていると言われました。"],["p608", "Can I take a message?", "伝言をうかがいましょうか？"]],
  r:[["Where is Ken? The meeting is starting.", 0],["I'm sorry, Ms. Tanaka is out now.", 2],["Please tell Anna the party starts at seven.", 4]],
  c:{sit:"職場で電話を受ける。同僚の佐藤さんは外出中で、自分は頼まれて残っている",t:[["Hello. May I speak to Ms. Sato, please?", 7],["Yes, please. Tell her the meeting has been moved to three.", 4],["One more thing. Why are you in her office so late?", 5]]}},
 {t:"第七十七歩 世の中",d:"ニュースや身近な社会の話",p:[
  ["p609", "Did you see the news?", "ニュースを見ましたか？"],["p610", "Prices are going up.", "物価が上がっています。"],["p611", "It's a big problem.", "それは大きな問題です。"],["p612", "I read it in the newspaper.", "新聞で読みました。"],["p613", "What do you think about it?", "それについてどう思いますか？"],["p614", "We should save energy.", "エネルギーを節約すべきです。"],["p615", "I try to recycle.", "リサイクルを心がけています。"],["p616", "It's hard to say.", "なんとも言えません。"]],
  r:[["Everything is so expensive these days.", 1],["How do you know about the new law?", 3],["Will the economy get better next year?", 7]],
  c:{sit:"昼休みに同僚と話す",t:[["My electric bill was so high this month.", 5],["You are right. What do you do with plastic bottles?", 6],["Good. Do you think things will be cheaper next year?", 7]]}},
 {t:"第七十八歩 紹介",d:"日本のことを紹介する",p:[
  ["p617", "Have you ever tried sushi?", "すしを食べたことがありますか？"],["p618", "This is a traditional Japanese food.", "これは日本の伝統的な食べ物です。"],["p619", "We take off our shoes inside.", "家の中では靴を脱ぎます。"],["p620", "It's a famous festival in Japan.", "日本で有名なお祭りです。"],["p621", "You should visit Kyoto in autumn.", "秋に京都を訪れるといいですよ。"],["p622", "It's popular among young people.", "若い人たちに人気があります。"],["p623", "Let me explain how to eat it.", "食べ方を説明します。"],["p624", "I hope you enjoy your stay.", "滞在を楽しんでくださいね。"]],
  r:[["What is this dish?", 1],["Where should I go in Japan?", 4],["I'm not sure how to eat this.", 6]],
  c:{sit:"日本に来た友人を家に招く",t:[["What a nice house! Can I come in like this?", 2],["Oh, I see. And what is this on the table?", 1],["It looks great, but I don't know what to do with it.", 6]]}},
 {t:"第七十九歩 励まし",d:"はげます・ほめる",p:[
  ["p625", "You can do it.", "あなたならできます。"],["p626", "Don't give up.", "あきらめないで。"],["p627", "You did a great job.", "とてもよくやりましたね。"],["p628", "I believe in you.", "あなたを信じています。"],["p629", "Everything will be fine.", "すべてうまくいきますよ。"],["p630", "Keep up the good work.", "その調子でがんばってください。"],["p631", "I'm on your side.", "私はあなたの味方です。"],["p632", "You've come a long way.", "ここまでよくがんばってきましたね。"]],
  r:[["I'm so nervous about my speech tomorrow.", 0],["I finished the whole project today.", 2],["I failed again. Maybe I should quit.", 1]],
  c:{sit:"発表を控えた友人を励ます",t:[["My big presentation is in ten minutes. I'm shaking.", 0],["But what if I forget my words?", 4],["It's over! They loved it!", 2]]}},
 {t:"第八十歩 感謝",d:"お礼と別れをていねいに言う",p:[
  ["p633", "I can't thank you enough.", "感謝してもしきれません。"],["p634", "I learned a lot from you.", "あなたからたくさん学びました。"],["p635", "I'll never forget this.", "このことは決して忘れません。"],["p636", "I'm going to miss you.", "さびしくなります。"],["p637", "Please come and visit me.", "ぜひ遊びに来てください。"],["p638", "Let's stay in touch.", "これからも連絡を取り合いましょう。"],["p639", "Thank you for everything.", "いろいろとありがとうございました。"],["p640", "I wish you all the best.", "ご多幸をお祈りします。"]],
  r:[["This is my last day here. Goodbye.", 3],["I'm moving to Osaka next month.", 5],["Here is a small gift from all of us.", 0]],
  c:{sit:"帰国する日に、お世話になった先生と話す",t:[["So, today is your last day in this class.", 6],["You were a wonderful student.", 1],["Good luck in Japan. I hope we meet again.", 5]]}},
 {t:"第八十一歩 旅の友",d:"旅先で出会った人と話す",p:[
  ["p641", "Are you traveling alone?", "一人で旅行しているのですか？"],["p642", "How long have you been here?", "ここにはどのくらいいますか？"],["p643", "Where are you heading next?", "次はどこへ向かうのですか？"],["p644", "I'm traveling around Europe.", "ヨーロッパを回っています。"],["p645", "Do you want to join me?", "一緒に行きませんか？"],["p646", "Can you recommend a good place?", "いい場所をおすすめしてもらえますか？"],["p647", "Let's exchange contact information.", "連絡先を交換しましょう。"],["p648", "Have a safe trip.", "気をつけて旅を続けてください。"]],
  r:[["What brings you to this town?", 3],["I've been in this town for a week. I know it well.", 5, "町に詳しい相手におすすめを聞く"],["My train leaves in ten minutes. Goodbye!", 7]],
  c:{sit:"宿の共有スペースで旅行者と話す。自分は明日、城を見に行く",t:[["Hi! I just arrived from Spain. What about you?", 3],["Me too! But I have no plans for tomorrow.", 4],["I'd love to! It was fun talking. I leave on Friday.", 6]]}},
 {t:"第八十二歩 食卓",d:"レストランで細かく伝える",p:[
  ["p649", "I'm allergic to nuts.", "ナッツのアレルギーがあります。"],["p650", "Does this have meat in it?", "これに肉は入っていますか？"],["p651", "Medium rare, please.", "ミディアムレアでお願いします。"],["p652", "Could we have separate checks?", "会計は別々にしてもらえますか？"],["p653", "This isn't cooked enough.", "これは火が十分に通っていません。"],["p654", "Could I have this to go?", "これを持ち帰りにしてもらえますか？"],["p655", "Everything was wonderful.", "すべてすばらしかったです。"],["p656", "What comes with this dish?", "この料理には何が付いてきますか？"]],
  r:[["How would you like your steak?", 2],["How was everything tonight?", 6],["Do you have any food allergies?", 0]],
  c:{sit:"レストランでステーキを注文する",t:[["Are you ready to order the steak?", 7],["It comes with salad and bread. How would you like it cooked?", 2],["Certainly. Our dessert today is walnut cake.", 0]]}},
 {t:"第八十三歩 部屋",d:"ホテルで困りごとを伝える",p:[
  ["p657", "There is no hot water.", "お湯が出ません。"],["p658", "The room next door is noisy.", "となりの部屋がうるさいです。"],["p659", "Could I change rooms?", "部屋を替えてもらえますか？"],["p660", "I locked myself out.", "鍵を部屋に置いたまま閉め出されました。"],["p661", "Could you send someone up?", "だれか部屋によこしてもらえますか？"],["p662", "The light doesn't turn on.", "電気がつきません。"],["p663", "Can I get a late checkout?", "チェックアウトを遅くしてもらえますか？"],["p664", "I left something in my room.", "部屋に忘れ物をしました。"]],
  r:[["Front desk. How may I help you?", 0],["I'm sorry about the noise. What can we do for you?", 2],["Why are you standing in the hallway?", 3]],
  c:{sit:"ホテルのフロントに電話する",t:[["Front desk. How can I help you?", 5],["I'm sorry. Do you have any other problems?", 0],["I apologize. What would you like us to do?", 4]]}},
 {t:"第八十四歩 名所",d:"観光地で使う言葉",p:[
  ["p665", "What time does it open?", "何時に開きますか？"],["p666", "How much is the admission?", "入場料はいくらですか？"],["p667", "Two adults, please.", "大人2枚お願いします。"],["p668", "Can I take pictures here?", "ここで写真を撮ってもいいですか？"],["p669", "Do you have a map in Japanese?", "日本語の地図はありますか？"],["p670", "Where does the tour start?", "ツアーはどこから始まりますか？"],["p671", "How old is this building?", "この建物は建ってからどのくらいですか？"],["p672", "It was worth the wait.", "待ったかいがありました。"]],
  r:[["Next, please. How many tickets?", 2],["Excuse me, cameras are not allowed in that room.", 3, "この部屋では撮ってよいか確かめる"],["You waited in line so long. How was the view?", 7]],
  c:{sit:"城の入口で",t:[["Good morning. The castle is open now.", 1],["Ten dollars for adults. How many?", 2],["Here you are. The guided tour begins in five minutes.", 5]]}},
 {t:"第八十五歩 贈り物",d:"買い物でていねいに頼む",p:[
  ["p673", "I'm looking for a gift.", "贈り物を探しています。"],["p674", "Could you wrap it, please?", "包んでもらえますか？"],["p675", "Does it come with a warranty?", "保証は付いていますか？"],["p676", "Can you give me a discount?", "値引きしてもらえますか？"],["p677", "I'll think about it.", "少し考えます。"],["p678", "Do you ship overseas?", "海外への発送はできますか？"],["p679", "Can I get a tax refund?", "免税の手続きはできますか？"],["p680", "I'll take two of these.", "これを2つください。"]],
  r:[["Hello. Are you looking for something special?", 0],["This camera is our best one.", 2],["Would you like to buy it now?", 4, "まだ決められない"]],
  c:{sit:"みやげ物店で",t:[["Hello. May I help you find something?", 0],["These tea cups are very popular.", 7],["Good choice. I'll put them in one box. Anything else?", 1]]}},
 {t:"第八十六歩 受話器",d:"仕事の電話を受ける・かける",p:[
  ["p681", "May I speak to Mr. Brown?", "ブラウンさんをお願いできますか？"],["p682", "May I ask who's calling?", "どちらさまでしょうか？"],["p683", "I'll put you through.", "おつなぎします。"],["p684", "He's on another line.", "彼は別の電話に出ています。"],["p685", "Could you call back later?", "あとでかけ直していただけますか？"],["p686", "I'm calling about the order.", "注文の件でお電話しました。"],["p687", "Could you speak up a little?", "もう少し大きな声で話していただけますか？"],["p688", "Thank you for calling.", "お電話ありがとうございました。"]],
  r:[["Good morning, ABC Company.", 0],["Hello, I'd like to talk to the manager.", 1],["Hello? Can you hear me? The line is bad.", 6]],
  c:{sit:"会社で電話を受ける",t:[["Hello. I'd like to speak to Mr. Brown, please.", 1],["This is Kate Miller from Star Hotel.", 2],["Actually, it's not urgent. I'll call him again tomorrow.", 7]]}},
 {t:"第八十七歩 文面",d:"メールやメッセージの言葉",p:[
  ["p689", "I'm writing to ask a question.", "質問があってご連絡しました。"],["p690", "Please find the attached file.", "添付ファイルをご確認ください。"],["p691", "I'll reply as soon as possible.", "できるだけ早くお返事します。"],["p692", "Sorry for the late reply.", "お返事が遅くなりすみません。"],["p693", "Could you send it again?", "もう一度送っていただけますか？"],["p694", "I couldn't open the file.", "ファイルを開けませんでした。"],["p695", "Thank you for your quick response.", "早速のお返事ありがとうございます。"],["p696", "Please let me know by Monday.", "月曜日までにお知らせください。"]],
  r:[["Did you get my email with the report?", 5],["I got your message, so I answered right away.", 6],["When do you need my answer?", 7]],
  c:{sit:"取引先と電話でメールの確認をする",t:[["Did you read the document I sent yesterday?", 5],["Oh, really? What should I do?", 4],["Sure, I'll send it now. When can you answer?", 2]]}},
 {t:"第八十八歩 会議",d:"会議で発言する",p:[
  ["p697", "Let's get started.", "始めましょう。"],["p698", "What's on the agenda today?", "今日の議題は何ですか？"],["p699", "May I add something?", "ひとつ付け加えてもいいですか？"],["p700", "I have a suggestion.", "提案があります。"],["p701", "Could you explain that in detail?", "それをくわしく説明していただけますか？"],["p702", "Let's move on to the next topic.", "次の話題に移りましょう。"],["p703", "We're running out of time.", "時間がなくなってきました。"],["p704", "Let's wrap up for today.", "今日はここまでにしましょう。"]],
  r:[["Everyone is here now.", 0],["So, that is my plan for the new store.", 4],["Does anyone have ideas for the event?", 3]],
  c:{sit:"会議の進行役をする",t:[["Everyone is here. You are the leader today.", 0],["We have talked about the budget for forty minutes.", 5],["It's already five o'clock.", 7]]}},
 {t:"第八十九歩 発表",d:"人前で発表する",p:[
  ["p705", "Thank you all for coming.", "皆さま、お越しいただきありがとうございます。"],["p706", "Today, I'd like to talk about our plan.", "今日は私たちの計画についてお話しします。"],["p707", "Please look at this chart.", "このグラフをご覧ください。"],["p708", "As you can see, sales went up.", "ご覧のとおり、売り上げが伸びました。"],["p709", "Let me give you an example.", "例を挙げます。"],["p710", "That's all for my presentation.", "私の発表は以上です。"],["p711", "Do you have any questions?", "ご質問はありますか？"],["p712", "That's a good question.", "いい質問ですね。"]],
  r:[["Everyone is ready. Please begin.", 0],["What does this line on the chart mean?", 7],["I don't quite understand your idea.", 4]],
  c:{sit:"発表の終わりに",t:[["Your time is almost over.", 5],["Thank you. That was very clear.", 6],["Yes. How did you collect the data?", 7]]}},
 {t:"第九十歩 かけひき",d:"提案する・条件を話し合う",p:[
  ["p713", "I'd like to make a proposal.", "提案をしたいのですが。"],["p714", "What are your terms?", "そちらの条件は何ですか？"],["p715", "Could you lower the price?", "値段を下げていただけますか？"],["p716", "That's our final offer.", "それが私たちの最終的な提示です。"],["p717", "Let's meet halfway.", "お互いに歩み寄りましょう。"],["p718", "I need to talk to my boss first.", "まず上司と相談しなければなりません。"],["p719", "We have a deal.", "これで合意ですね。"],["p720", "Let's put it in writing.", "書面にしましょう。"]],
  r:[["Can you decide right now?", 5],["I want ten, and you want six. How about eight?", 6],["We agreed on everything. What is next?", 7]],
  c:{sit:"取引先と値段を話し合う",t:[["Our price is one thousand dollars.", 2],["I can go down to nine hundred, but you asked for eight hundred.", 4],["Eight hundred and fifty? All right.", 6]]}},
 {t:"第九十一歩 友",d:"友人との関係を話す",p:[
  ["p721", "We've known each other for years.", "私たちは何年も前からの知り合いです。"],["p722", "You can count on me.", "私を頼りにしてください。"],["p723", "I had a fight with my friend.", "友達とけんかしました。"],["p724", "We made up yesterday.", "昨日、仲直りしました。"],["p725", "I didn't mean to hurt you.", "傷つけるつもりはありませんでした。"],["p726", "Let's talk it over.", "よく話し合いましょう。"],["p727", "Thanks for being there for me.", "そばにいてくれてありがとう。"],["p728", "That's what friends are for.", "友達ならあたりまえですよ。"]],
  r:[["Are you and Ken still angry at each other?", 3],["You helped me so much. Thank you.", 7],["I need help moving next week. I have no one to ask.", 1]],
  c:{sit:"けんかした友人と話す",t:[["Your words yesterday really hurt me.", 4],["I know. I was angry too. What should we do now?", 5],["Good idea. I'm glad we are still friends. I need help with my move on Sunday.", 1]]}},
 {t:"第九十二歩 誘い",d:"気になる相手を誘う",p:[
  ["p729", "Are you seeing anyone?", "付き合っている人はいますか？"],["p730", "Would you like to have dinner with me?", "一緒に夕食はいかがですか？"],["p731", "I had a great time tonight.", "今夜はとても楽しかったです。"],["p732", "Can I see you again?", "また会えますか？"],["p733", "I'll walk you home.", "家まで送ります。"],["p734", "You look great today.", "今日はすてきですね。"],["p735", "I've been thinking about you.", "あなたのことを考えていました。"],["p736", "Let's take it slow.", "ゆっくり進めましょう。"]],
  r:[["I'm free this Saturday evening.", 1],["Well, this is my station. Good night.", 2],["It's getting dark outside.", 4]],
  c:{sit:"食事のあとの帰り道",t:[["That restaurant was lovely.", 2],["Me too. It's late. I should go home.", 4],["Thank you. Well, this is my place.", 3]]}},
 {t:"第九十三歩 新居",d:"引っ越しと手続き",p:[
  ["p737", "I'm moving next month.", "来月引っ越します。"],["p738", "I need to change my address.", "住所を変更しなければなりません。"],["p739", "When can I move in?", "いつ入居できますか？"],["p740", "Does the rent include utilities?", "光熱費は含まれていますか？"],["p741", "I'd like to sign the contract.", "契約書に署名したいのですが。"],["p742", "How much is the deposit?", "敷金はいくらですか？"],["p743", "Could you help me carry this?", "これを運ぶのを手伝ってもらえますか？"],["p744", "I've finally settled in.", "やっと落ち着きました。"]],
  r:[["The apartment is ready. Do you like it?", 4],["How is your new home?", 7],["I'm done moving my boxes. How about you?", 6, "自分も手伝いを頼みたい"]],
  c:{sit:"不動産屋で部屋を決める",t:[["So, do you like this apartment?", 4],["Wonderful. The rent is eight hundred dollars a month.", 3],["Yes, water and gas are. Any other questions?", 2]]}},
 {t:"第九十四歩 備え",d:"災害や危険に備える",p:[
  ["p745", "Did you feel the earthquake?", "地震を感じましたか？"],["p746", "Stay away from the windows.", "窓から離れてください。"],["p747", "Where should we evacuate?", "どこに避難すればいいですか？"],["p748", "The power is out.", "停電しています。"],["p749", "Do you have a flashlight?", "懐中電灯はありますか？"],["p750", "Let's check the news.", "ニュースを確認しましょう。"],["p751", "A typhoon is coming.", "台風が近づいています。"],["p752", "Everyone is safe.", "全員無事です。"]],
  r:[["Why is it so dark in here?", 3],["Did everyone get out of the building?", 7],["The sky looks strange today.", 6]],
  c:{sit:"夜、家で地震が起きる",t:[["Oh no, the whole house is shaking!", 1],["Okay. Oh, all the lights went out.", 4],["Here it is. What should we do now?", 5]]}},
 {t:"第九十五歩 学び方",d:"勉強のしかたを話す",p:[
  ["p753", "How do you study English?", "英語をどうやって勉強していますか？"],["p754", "I practice a little every day.", "毎日少しずつ練習しています。"],["p755", "I learn words from songs.", "歌から単語を覚えています。"],["p756", "I keep a diary in English.", "英語で日記をつけています。"],["p757", "Repeating aloud helps a lot.", "声に出してくり返すととても役立ちます。"],["p758", "I'm not afraid of mistakes anymore.", "もう間違いをおそれていません。"],["p759", "It takes time to improve.", "上達には時間がかかります。"],["p760", "Practice makes perfect.", "習うより慣れよ、です。"]],
  r:[["Your English is getting better. What is your secret?", 1],["I study hard, but I can't speak well yet.", 6],["I made so many mistakes today.", 7]],
  c:{sit:"英語を学び始めた友人に聞かれる",t:[["You speak so well. How did you learn?", 1],["Every day? What works best for you?", 4],["I tried, but I'm still slow.", 6]]}},
 {t:"第九十六歩 道具",d:"新しい技術の話",p:[
  ["p761", "I use it every day.", "毎日使っています。"],["p762", "How does it work?", "それはどういう仕組みですか？"],["p763", "It saves a lot of time.", "時間がたくさん節約できます。"],["p764", "I can't live without my phone.", "携帯電話なしでは生活できません。"],["p765", "Have you tried this app?", "このアプリを使ってみましたか？"],["p766", "It's easy to use.", "使いやすいです。"],["p767", "Technology is changing fast.", "技術は速く変わっています。"],["p768", "I need to update it.", "更新しなければなりません。"]],
  r:[["Do you use that translation app often?", 0],["Why do you like this new tool so much?", 2],["This app is not working well today.", 7]],
  c:{sit:"友人に新しいアプリを見せる",t:[["What is that on your phone?", 4],["No. It looks difficult.", 5],["Really? Why do you like it so much?", 2]]}},
 {t:"第九十七歩 休息",d:"疲れとストレスの話",p:[
  ["p769", "I've been under a lot of stress.", "ずっとストレスがたまっています。"],["p770", "I need some time off.", "少し休みが必要です。"],["p771", "You should get some rest.", "少し休んだほうがいいですよ。"],["p772", "I can't concentrate today.", "今日は集中できません。"],["p773", "Let's get some fresh air.", "外の空気を吸いに行きましょう。"],["p774", "Talking helps me relax.", "話すと気持ちが楽になります。"],["p775", "I feel refreshed now.", "すっきりしました。"],["p776", "Take it easy.", "無理しないでね。"]],
  r:[["I worked until midnight again.", 2],["How do you feel after your vacation?", 6],["I'm going home now. I'm so tired.", 7]],
  c:{sit:"職場で同僚に心配される",t:[["You look tired. How have you been lately?", 0],["I'm sorry to hear that. What do you need?", 1],["Good idea. Shall we go outside for a minute now?", 4]]}},
 {t:"第九十八歩 言い回し",d:"よく使う決まり文句",p:[
  ["p777", "It's a piece of cake.", "とても簡単です。"],["p778", "I'm all ears.", "しっかり聞いていますよ。"],["p779", "Let's call it a day.", "今日はここまでにしましょう。"],["p780", "It's not my cup of tea.", "私の好みではありません。"],["p781", "Better late than never.", "遅れてもやらないよりはいいです。"],["p782", "Break a leg!", "がんばって！", "舞台や発表の前の人に"],["p783", "Long story short, we won.", "手短に言うと、私たちが勝ちました。"],["p784", "So far, so good.", "今のところ順調です。"]],
  r:[["How is your new job going?", 7],["This math problem looks hard. Can you solve it?", 0, "とても簡単だ"],["I have something important to tell you.", 1]],
  c:{sit:"仕事終わりに同僚と話す",t:[["We have been working for ten hours.", 2],["Good. I'm going on stage for my first concert tonight!", 5],["Do you want to come? It's heavy metal music.", 3]]}},
 {t:"第九十九歩 議論",d:"立場をくらべて話す",p:[
  ["p785", "On the one hand, it's cheap.", "一方では、安いです。"],["p786", "On the other hand, it's slow.", "その一方で、遅いです。"],["p787", "There are pros and cons.", "良い点と悪い点があります。"],["p788", "I see it differently.", "私は違う見方をしています。"],["p789", "You have a point.", "一理ありますね。"],["p790", "Let's agree to disagree.", "意見が違うことを認め合いましょう。"],["p791", "For example, look at this case.", "たとえば、この例を見てください。"],["p792", "In conclusion, we need both.", "結論として、両方が必要です。"]],
  r:[["Working from home is the best. Don't you think so?", 3],["We will never agree on this topic.", 5],["Trains are better because they are always on time.", 4]],
  c:{sit:"旅行の行き方を友人と相談する",t:[["Should we take the night bus or the fast train?", 2],["What is good about the bus?", 0],["True. And what is the bad side?", 1]]}},
 {t:"第百歩 月の道",d:"ここまでの歩みを言葉にする",p:[
  ["p793", "I've come this far.", "ここまで来ました。"],["p794", "I couldn't have done it without you.", "あなたがいなければできませんでした。"],["p795", "I feel more confident now.", "今は前より自信があります。"],["p796", "I can express myself in English.", "英語で自分の気持ちを伝えられます。"],["p797", "There is still more to learn.", "学ぶことはまだあります。"],["p798", "I'm ready for the next step.", "次の一歩に進む準備ができています。"],["p799", "The journey continues.", "旅は続きます。"],["p800", "Let's keep walking together.", "これからも一緒に歩いていきましょう。"]],
  r:[["You have finished one hundred lessons. How do you feel?", 2],["You did it! I only helped a little.", 1],["So, what will you do now?", 5]],
  c:{sit:"学びの節目に、ここまでの道をふり返る",t:[["This is the last step on the path. Look back.", 0],["Can you tell people your feelings in English now?", 3],["Then our road goes on. Are you coming?", 7]]}}
];

const TIPS=[["I'm ～ / My name is ～", "自己紹介は I'm＋名前 でも My name is＋名前 でも言えます。出身は I'm from＋場所。"], ["Where is ～?", "場所をたずねる基本の形です。I'm looking for ～ は「～を探しています」。"], ["I like ～ing", "好きなことは I like＋動詞ing。Let's＋動詞 で「～しましょう」と誘えます。"], ["Can I ～? / I'll have ～", "Can I＋動詞 は「～してもいいですか・もらえますか」。注文は I'll have ～ で言えます。"], ["Do you have ～?", "店で「～はありますか」とたずねる形。I'll take it. は「これを買います」。"], ["It's＋時刻 / at＋時刻", "時刻は It's seven thirty.。「～時に」は at をつけて at noon のように言います。"], ["I'm＋気持ち", "I'm＋形容詞 で気持ちを伝えます。so は「とても」、a little は「少し」。"], ["Can you ～? / Could you ～?", "頼むときは Can you ～?。Could you ～? にすると、よりていねいです。"], ["過去のこと", "go→went、stay→stayed、watch→watched のように動詞を過去の形にします。質問は Did you ～?。"], ["I'm going to ～ / I'll ～", "前から決めている予定は be going to、その場で決めたことは will（I'll）で言います。"], ["I'll ～ later", "「あとで～します」は I'll＋動詞＋later。電話やメッセージでよく使います。"], ["It's＋天気 / いつもの習慣", "天気は It's sunny. のように It's で言います。習慣は現在形で、usually（たいてい）を添えます。"], ["He / She のとき", "主語が he・she のとき、動詞に s がつきます。質問は What does he do? のように does を使います。"], ["Which ～? / Does this ～?", "Which は「どの」。Does this bus go to ～? で行き先を確かめられます。"], ["May I ～? / Could you ～?", "May I ～? は許可を求めるていねいな形。引き受けるときは Sure, no problem.。"], ["I'd like to ～", "I want to よりていねいな「～したいのですが」。ホテルや店でよく使います。"], ["I have＋症状", "症状は I have a headache. のように have で言います。My ～ hurts は「～が痛い」。"], ["I work at ～ / I'm a ～", "職場は I work at＋場所、職業は I'm a（an）＋職業 で言います。"], ["I enjoy ～ing / I'm into ～", "enjoy のあとは動詞ing。I'm into ～ は「～にはまっている」というくだけた言い方です。"], ["How have you been?", "久しぶりに会った相手に「（最近）どうしていましたか」とたずねる形です。"], ["for＋目的・期間", "I'm here for sightseeing.（観光で）、I'm staying for five days.（5日間）。for は目的にも期間にも使えます。"], ["～, please.", "名詞＋please で短く注文できます。For here は「店内で」、To go は「持ち帰りで」。"], ["There is / There are", "「～があります」。1つなら is、2つ以上なら are。場所は next to（となり）、across from（向かい）、in front of（前）。"], ["くらべる形", "短い語は -er（cheaper）、長い語は more（more expensive）。「いちばん」は the best のように the をつけます。"], ["can / can't", "can＋動詞 で「～できる」、can't で「～できない」。be good at ～ing は「～が得意」。"], ["have to / should", "have to は「しなければなら attery is dying. のように、be＋動詞ing で「～しかけている」も表せます。"],["by＋期限", "by Friday は「金曜日までに」。until（～までずっと）とは意味が違います。"],["work as ～", "「～として働く」。経験年数は I have five years of experience. のように言います。"],["I think ～ / I don't think ～", "反対するときは I don't think so. と、否定を前に置きます。I see your point. で一度受け止めると、ていねいです。"],["気持ち＋about ～", "be worried about ～（～が心配）、be excited about ～（～が楽しみ）。about のあとに気持ちの対象を置きます。"],["be＋過去分詞", "「～される」の形です。だれによってかを言うときは by ～ を足します。"],["who / that / where", "人には who、物には that、場所には where をつないで、うしろから説明を足します。"],["Would you mind ～ing?", "「～していただけませんか」。引き受けるときは Not at all.（かまいませんよ）と答えます。"],["I wish＋過去形 / should have＋過去分詞", "今かなわない願いは I wish I had ～、過去の後悔は I should have ～ で言います。"],["I'd rather ～ / worth ～ing", "I'd rather ～ は「（どちらかといえば）～したい」。worth ～ing は「～する価値がある」。"],["～, isn't it? / By the way", "文の終わりに isn't it? をつけると「～ですね」。By the way は話題を変える合図です。"],["yet / already", "yet は「まだ（～ない）」「もう（～した？）」で否定文と疑問文に、already は「もう」で肯定文に使います。"],["How about ～? / instead", "How about ～? は「～はどうですか」。instead は「その代わりに」。"],["I've had ～ for ...", "「…の間ずっと～がある」。症状がいつから続いているかを伝える形です。"],["May I ～? / Can I ～?", "May I ～? は先生や初対面の人に、Can I ～? は友人に使いやすい形です。"],["It's your turn to ～", "「～するのはあなたの番です」。be out of ～ は「～を切らしている」。"],["I'm afraid of ～", "「～がこわい」。動物は性別がわかれば he / she、わからなければ it で呼びます。"],["What a ～!", "「なんて～でしょう」と驚きや感動を表します。What a great goal!"],["can't afford ～", "「～を買う（する）余裕がない」。It's on sale. は「セール中」、for sale は「売り物」です。"],["be delayed / be canceled", "交通の遅れや中止は受け身で言います。miss は「乗り遅れる」。"],["Please ～（緊急のとき）", "急ぐときは Please＋動詞 で短くはっきり伝えます。There has been ～ は「～がありました」。"],["What is ～ like?", "「～はどんな人（もの）ですか」。look like（見た目）とは違い、性格やようすをたずねます。"],["used to ～", "「以前は～していた（今はしていない）」。今との違いを言うときに使います。"],["many / much, a few / a little", "数えられるものには many・a few、数えられないものには much・a little を使います。"],["First / Then / After that / Finally", "順番を表す言葉を文の頭に置くと、説明がわかりやすくなります。"],["～, right?", "文の終わりに right? をつけると「～ですよね」と確かめられます。I didn't catch that. は聞き返しの定番です。"],["He said (that) ～ / She told me to ～", "人の言葉を伝えるとき、said のあとの動詞は過去の形に合 const roll=()=>{if(S.day!==day(0)){S.day=day(0);S.dayXp=0; // 日が変わったら、休んだ日数をお守りで埋める。足りなければ連続日数は0に戻る
  if(S.last&&S.last<day(-1)){const miss=Math.round((Date.parse(day(-1))-Date.parse(S.last))/864e5);if((S.frz||0)>=miss){S.frz-=miss;S.last=day(-1);S.frzUsed=miss}else S.streak=0}}};

let audOk=false,audFail=0,noAudio=false,enVoice=null;
function pickVoice(){ // 端末の読み上げを使う場合は、英語の声を明示的に選ぶ（日本語の声で英語を読ませない）
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const score=v=>(/^en[-_]US/i.test(v.lang)?4:0)+(/Samantha|Ava|Allison|Google US English|Aria|Jenny|Natural|Enhanced|Premium/i.test(v.name)?3:0)-(/compact|espeak/i.test(v.name)?3:0);
    enVoice=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){enVoice=null}
}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
function tts(t){try{if(!enVoice)pickVoice();const u=new SpeechSynthesisUtterance(t);if(enVoice)u.voice=enVoice;u.lang=enVoice?enVoice.lang:"en-US";u.rate=S.rate==="slow"?.7:.9;speechSynthesis.speak(u)}catch(e){}}
function speak(t,line){
  if(recState==="rec"||recState==="pending")return;
  try{player.pause();if(voice)voice.pause();speechSynthesis.cancel()}catch(e){}
  const key=line?AUDL[t]||AUD[t]:AUD[t]||AUDL[t];
  if(!key||!voice||noAudio)return tts(t);
  try{
    voice.src="audio/"+key+".mp3?v=4";voice.playbackRate=S.rate==="slow"?.8:1;
    const pr=voice.play();
    if(pr&&pr.then)pr.then(()=>{audOk=true},e=>{if(e&&e.name==="AbortError")return;if(e&&e.name==="NotAllowedError")return; // 途中で次の音声に切り替えた／自動再生が止められた
      audFail++;if(!audOk&&audFail>=2)noAudio=true;tts(t)}); // ファイルが無い環境では端末の読み上げに切り替える
  }catch(e){tts(t)}
}

function hello(nDue,next){ // 案内役のひとこと（学習の状況に合わせる）
  if(!Object.keys(S.rev).length)return "はじめまして。案内役のすずねです。最初の一歩を、いっしょに踏み出しましょう。";
  if(nDue)return `おかえりなさい。今日は${nDue}件、前に言えた文を確かめましょう。忘れかけた頃がいちばん身につきます。`;
  if(S.dayXp>=goal())return "今日の目標は達成です。よくがんばりましたね。続きは明日でも大丈夫ですよ。";
  if(next<0)return "すべての歩みを歩ききりましたね。6秒チャレンジで、口の速さを磨きましょう。";
  if(S.streak>=3)return `${S.streak}日連続ですね。その積み重ねが、いちばんの力になります。`;
  return "今日も3分だけ、声に出してみましょう。小さな一歩で十分です。";
}

    ["s3","🔥","三日つづけた","3日連続で学習",st>=3],["s7","🔥","一週間","7日連続で学習",st>=7],["s30","🔥","ひと月","30日連続で学習",st>=30],
    ["p50","📖","50の言葉","50文を学習",r>=50],["p100","📚","100の言葉","100文を学習",r>=100],["p160","🏛","160の言葉","160文を学習",r>=160],["p320","🏯","320の言葉","320文を学習",r>=320],["p480","🗻","480の言葉","480文を学習",r>=480],
