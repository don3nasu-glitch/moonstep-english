 {t:"第五百八十五歩 ホストファミリーとの別れ",d:"ホームステイ最後の夜、ホストファミリーに感謝と別れを伝える",p:[
  ["p4673", "I can't believe it's my last night.", "もう最後の夜だなんて信じられない。"],["p4674", "You made me feel like family.", "本当の家族のように過ごさせてくれました。"],["p4675", "I'll really miss your cooking.", "お料理が本当に恋しくなります。"],["p4676", "Please come visit me in Japan.", "ぜひ日本に遊びに来てください。"],["p4677", "I left a little something on the table.", "テーブルにささやかな物を置いておきました。"],["p4678", "Let's video chat once a month.", "月に一度ビデオ通話しようね。"],["p4679", "Thank you for putting up with me.", "いろいろ大目に見てくれてありがとう。"],["p4680", "This isn't goodbye, just see you later.", "さよならじゃなくて、またね、だよ。"]],
  r:[["Ten weeks went by so fast.", 0],["We'd love to see where you grew up.", 3],["How will we keep in touch?", 5]],
  c:{sit:"出発前夜、ホストファミリーとリビングで最後の時間を過ごす",t:[["You were never any trouble at all.", 6],["I'll send you my lasagna recipe.", 2],["What's this gift doing here?", 4]]}},
 {t:"第五百八十六歩 空港まで送ってと切り出す",d:"早朝の便に乗るため、友人に空港まで車で送ってもらえないか遠慮がちに頼む",p:[
  ["p4681", "I was wondering if you could help me.", "ちょっとお願いできないかなと思って。"],["p4682", "Feel free to say no, of course.", "もちろん、断ってくれて全然いいからね。"],["p4683", "My flight leaves really early on Saturday.", "土曜日、すごく朝早い便なんだ。"],["p4684", "Would you mind driving me to the airport?", "空港まで車で送ってもらえないかな？"],["p4685", "I'd be happy to pay for gas.", "ガソリン代は出させてね。"],["p4686", "No pressure if you have plans.", "予定があるなら気にしないで。"],["p4687", "I'll buy you breakfast on the way.", "途中で朝ごはんをおごるよ。"],["p4688", "I really owe you one.", "本当に恩に着るよ。"]],
  r:[["You seem a bit hesitant. What's up?", 0],["Is something happening this weekend?", 2],["Of course I'll drive you. Happy to help.", 7]],
  c:{sit:"仕事帰りの友人に電話して、週末の早朝に車を出してもらえないか相談する",t:[["I'll do it, but I'll be starving at that hour.", 6],["Gas is pretty expensive these days, you know.", 4],["I might have something on Saturday, actually.", 5]]}},
 {t:"第五百八十七歩 友人のライブの誘いを断る",d:"友人のバンドのライブに誘われたが、行けないことを気持ちを傷つけずに伝える",p:[
  ["p4689", "I'm so glad you thought of me.", "声をかけてくれて本当にうれしい。"],["p4690", "I really wish I could make it.", "行けたら本当によかったんだけど。"],["p4691", "I already promised my sister that night.", "その夜は妹ともう約束しちゃってて。"],["p4692", "It's not that I'm not interested.", "興味がないわけじゃないんだ。"],["p4693", "Could you record a song for me?", "一曲だけ録画してくれない？"],["p4694", "Let me know about the next show.", "次のライブのときは教えてね。"],["p4695", "I'll be cheering for you from home.", "家から応援してるね。"],["p4696", "Break a leg on Friday!", "金曜日、がんばってね！"]],
  r:[["So, can you come on Friday?", 1],["What are you doing that night instead?", 2],["We play again next month, actually.", 5]],
  c:{sit:"カフェで友人からライブのチラシを渡され、その場で返事をする",t:[["I know rock isn't really your thing.", 3],["I'm so nervous about the show, honestly.", 7],["I wish you could hear us live.", 4]]}},
 {t:"第五百八十八歩 友人のスピーチ原稿に意見する",d:"結婚式のスピーチ原稿を読ませてもらい、長すぎる部分をやさしく指摘する",p:[
  ["p4697", "The opening story is really charming.", "冒頭のエピソード、すごく素敵だね。"],["p4698", "Can I be honest with you?", "正直に言ってもいい？"],["p4699", "It feels a little long to me.", "ちょっと長いように感じるかな。"],["p4700", "Maybe cut the part about college?", "大学時代の話は削ってもいいかも？"],["p4701", "Some jokes might not land with everyone.", "冗談の一部は、みんなには伝わらないかも。"],["p4702", "That's just my take, though.", "あくまで私の意見だけどね。"],["p4703", "The ending made me tear up.", "締めくくりで涙が出そうになった。"],["p4704", "With a few tweaks, it'll be perfect.", "少し手直しすれば完璧だよ。"]],
  r:[["Which part should I shorten?", 3],["What did you think of the beginning?", 0],["How about the ending?", 6]],
  c:{sit:"友人の部屋で原稿を読み終え、感想を求められる",t:[["I timed it at about ten minutes.", 2],["You think the inside jokes are a problem?", 4],["So, overall, what's the verdict?", 7]]}},
 {t:"第五百八十九歩 新しいコートをほめられて",d:"職場で新しいコートをほめられ、照れずに受け取って自然にほめ返す",p:[
  ["p4705", "Thank you, that's so nice of you.", "ありがとう、うれしいこと言ってくれるね。"],["p4706", "I just got it last weekend.", "先週末に買ったばかりなんだ。"],["p4707", "It was actually on sale.", "実はセールだったんだ。"],["p4708", "You made my morning.", "おかげで朝から気分がいいよ。"],["p4709", "I was nervous about the color.", "色がちょっと心配だったんだ。"],["p4710", "Your scarf is gorgeous, by the way.", "ところで、あなたのスカーフも素敵だね。"],["p4711", "You always pick great colors.", "いつも色選びが上手だよね。"],["p4712", "I'll take that as a compliment!", "ほめ言葉として受け取っておくね！"]],
  r:[["I love your new coat!", 0],["Have you had that coat long?", 1],["It must have cost a fortune.", 2]],
  c:{sit:"朝のエレベーターで、同僚にコートのことを話しかけられる",t:[["Honestly, the color is perfect on you.", 4],["That's a bold choice. I'd never be that brave.", 7],["Seriously, it really brightens up the office.", 3]]}},
 {t:"第五百九十歩 立ち話を感じよく切り上げる",d:"交流会で長く話し込んだ相手と、失礼にならないよう会話を終える",p:[
  ["p4713", "It's been great chatting with you.", "お話しできて楽しかったです。"],["p4714", "I should go say hi to the host.", "主催者にあいさつしに行かないと。"],["p4715", "I don't want to keep you.", "お引き止めしては悪いので。"],["p4716", "Let's continue this another time.", "この続きはまた今度。"],["p4717", "Do you have a card, by any chance?", "もしかして名刺をお持ちですか？"],["p4718", "Good luck with the new project.", "新しいプロジェクト、がんばってください。"],["p4719", "I'm going to grab another drink.", "もう一杯もらってきますね。"],["p4720", "Enjoy the rest of the evening.", "この後も楽しんでくださいね。"]],
  r:[["Have you met the host yet?", 1],["We launch the project next month.", 5],["I'd love to stay in touch.", 4]],
  c:{sit:"交流会の終盤、話し込んだ相手と別れぎわのやりとりをする",t:[["Your glass looks empty.", 6],["I think I'll stay a little longer.", 7],["I'd love to hear more about your trip.", 3]]}},
 {t:"第五百九十一歩 盛り上がる会話に割って入る",d:"同僚たちの雑談中に、急ぎの連絡を伝えるため丁寧に割り込む",p:[
  ["p4721", "Sorry to cut in.", "お話し中すみません。"],["p4722", "Can I steal you for a second?", "ちょっとだけいいですか？"],["p4723", "It'll only take a minute.", "すぐ済みます。"],["p4724", "The client is on line two.", "お客様から二番に電話です。"],["p4725", "I didn't mean to interrupt.", "邪魔するつもりはなかったんです。"],["p4726", "Please go ahead and finish first.", "先に話を終えてください。"],["p4727", "I'll leave you to it.", "では、ごゆっくり。"],["p4728", "Thanks for being so understanding.", "快く聞いてくれてありがとう。"]],
  r:[["How long will this take?", 2],["No problem. What's so urgent?", 3],["Let me just finish this story.", 5]],
  c:{sit:"用件を伝え終え、雑談していた同僚たちとやりとりを続ける",t:[["No worries. Work comes first.", 7],["Don't worry, we were just chatting.", 4],["Want to join our conversation?", 6]]}},
 {t:"第五百九十二歩 冗談の意味がわからない",d:"友人たちが笑っている冗談の意味がわからず、素直に説明を頼む",p:[
  ["p4729", "I think that one went over my head.", "たぶん、それ私にはピンとこなかった。"],["p4730", "Sorry, I missed the punch line.", "ごめん、オチを聞き逃した。"],["p4731", "Was that some kind of pun?", "それって、だじゃれか何か？"],["p4732", "Could you explain it to me?", "説明してもらえる？"],["p4733", "Must be a cultural reference, right?", "文化的なネタなんでしょ？"],["p4734", "Oh, now I see!", "あ、やっとわかった！"],["p4735", "That's actually pretty clever.", "それ、実はかなりうまいね。"],["p4736", "I'll laugh twice to catch up.", "遅れた分、二回笑っておくね。"]],
  r:[["Why aren't you laughing?", 0],["So, now do you get it?", 5],["You're laughing a full minute late!", 7]],
  c:{sit:"友人が冗談を言ったあと、きょとんとしているのに気づかれる",t:[["Which part lost you?", 1],["It only makes sense if you grew up here.", 4],["Should I break it down for you?", 3]]}},
 {t:"第五百九十三歩 車内の気まずい沈黙",d:"同僚と二人きりの帰りの車内で、会話が途切れた沈黙をやわらげる",p:[
  ["p4737", "So, any plans for the weekend?", "それで、週末は何か予定ある？"],["p4738", "Mind if I put on some music?", "音楽をかけてもいい？"],["p4739", "I just realized we've never really talked.", "ちゃんと話したことなかったって、今気づいた。"],["p4740", "How did you end up in this job?", "どうしてこの仕事に就いたの？"],["p4741", "Sorry, I'm a little tired today.", "ごめん、今日はちょっと疲れてて。"],["p4742", "It's nice to just sit quietly sometimes.", "たまには静かに座っているのもいいよね。"],["p4743", "This traffic is something else.", "この渋滞、すごいね。"],["p4744", "Anyway, thanks for the ride.", "とにかく、乗せてくれてありがとう。"]],
  r:[["You've been quiet. Everything okay?", 4],["Sorry, I'm not great at small talk.", 5],["We're barely moving, aren't we?", 6]],
  c:{sit:"同僚の車で送ってもらう途中、ぽつりぽつりと会話する",t:[["Here's your stop.", 7],["I feel like we only talk in meetings.", 2],["Too quiet in here?", 1]]}},
 {t:"第五百九十四歩 資格試験に落ちた友人へ",d:"長く勉強してきた資格試験に落ちた友人の話を聞き、そっと寄りそう",p:[
  ["p4745", "I'm so sorry. That's really rough.", "本当に残念だったね。つらいよね。"],["p4746", "You put so much into it.", "あんなにがんばってたのにね。"],["p4747", "It's okay to be upset.", "落ち込んで当然だよ。"],["p4748", "This doesn't define you.", "これであなたの価値が決まるわけじゃない。"],["p4749", "Want to grab dinner tonight?", "今夜、ごはんでも行かない？"],["p4750", "No need to decide anything now.", "今は何も決めなくていいよ。"],["p4751", "I'm here whenever you want to talk.", "話したいときはいつでも聞くよ。"],["p4752", "You'll be even stronger next time.", "次はもっと強くなってるよ。"]],
  r:[["I didn't pass the exam.", 0],["I studied every night for a year.", 1],["Should I just give up and try something else?", 5]],
  c:{sit:"結果を知った夜、友人と並んでベンチに座って話す",t:[["I feel like such a failure.", 3],["I don't really feel like being alone tonight.", 4],["I keep crying and I feel silly.", 2]]}},
 {t:"第五百九十五歩 念願のカフェを開いた友人へ",d:"長年の夢だったカフェを開いた友人を、開店日に心から祝う",p:[
  ["p4753", "Congratulations! You actually did it!", "おめでとう！本当にやったね！"],["p4754", "I'm so proud of you.", "あなたのこと、本当に誇りに思う。"],["p4755", "I remember you sketching this place.", "このお店の絵を描いてたの、覚えてるよ。"],["p4756", "You totally earned this.", "これは完全にあなたの努力の成果だよ。"],["p4757", "The coffee is amazing, by the way.", "ところで、コーヒーすごくおいしい。"],["p4758", "I'll tell everyone at work about it.", "職場のみんなに宣伝しておくね。"],["p4759", "You must be exhausted, but happy.", "くたくただろうけど、幸せでしょ。"],["p4760", "Here's to many busy mornings!", "忙しい朝がたくさん来ますように！"]],
  r:[["Welcome to my little café!", 0],["Can I get you anything else?", 4],["Honestly, I could use more customers.", 5]],
  c:{sit:"開店日の閉店後、片づけをする友人と話す",t:[["I haven't slept in days.", 6],["I was just lucky, I think.", 3],["Remember my old notebook full of drawings?", 2]]}},
 {t:"第五百九十六歩 手伝う約束を思い出してもらう",d:"引っ越しを手伝うと言ってくれた友人に、角を立てずに約束を確認する",p:[
  ["p4761", "Just a friendly reminder about Saturday.", "土曜日のこと、念のためお知らせね。"],["p4762", "You mentioned you could help me move.", "引っ越しを手伝えるって言ってくれてたよね。"],["p4763", "Still okay for you?", "まだ大丈夫そう？"],["p4764", "Totally fine if things have changed.", "状況が変わってたら全然いいからね。"],["p4765", "We're starting around nine.", "九時ごろ始める予定。"],["p4766", "I'll have pizza for everyone.", "みんなの分のピザを用意しておくね。"],["p4767", "I didn't want to assume.", "勝手に当てにしたくなかったから。"],["p4768", "You're a lifesaver, as always.", "いつも本当に助かるよ。"]],
  r:[["Saturday? What's happening on Saturday?", 1],["What time should I show up?", 4],["Of course I'm coming. Why are you even checking?", 6]],
  c:{sit:"引っ越し前の週に、友人とメッセージでやりとりする",t:[["Will there be food, at least?", 5],["I'll be there. Nine sharp.", 7],["Actually, my boss wants me in that day.", 3]]}},
 {t:"第五百九十七歩 元気のない同僚に声をかける",d:"最近口数が減った同僚を休憩室で見かけ、無理に聞き出さずに気づかう",p:[
  ["p4769", "Hey, how are you holding up?", "ねえ、最近大丈夫？"],["p4770", "You've seemed a bit quiet lately.", "最近ちょっと元気がないみたいだったから。"],["p4771", "You don't have to tell me anything.", "何も話さなくていいからね。"],["p4772", "I just wanted to check in.", "ちょっと様子を聞きたかっただけ。"],["p4773", "Want to take a walk outside?", "外を少し歩かない？"],["p4774", "Can I take anything off your plate?", "何か仕事を引き受けようか？"],["p4775", "That sounds like a lot to handle.", "それは抱えきれないくらい大変だね。"],["p4776", "My door is always open.", "いつでも気軽に来てね。"]],
  r:[["Why do you ask? Do I seem off?", 1],["I've just been swamped with the report.", 5],["My sister's been going through a hard time, too.", 6]],
  c:{sit:"休憩室でコーヒーを入れながら、同僚と言葉を交わす",t:[["I could use some fresh air, honestly.", 4],["I'm fine. Why the sudden concern?", 3],["I'm not really ready to talk about it.", 2]]}},
 {t:"第五百九十八歩 そっけない返信の誤解を解く",d:"短すぎる返信のせいで怒っていると誤解された友人に、メッセージで謝る",p:[
  ["p4777", "Sorry, my last text came out wrong.", "ごめん、さっきのメッセージ、変な伝わり方しちゃった。"],["p4778", "I wasn't upset at all.", "全然怒ってなかったよ。"],["p4779", "I was just rushing between meetings.", "会議の合間で急いでただけなんだ。"],["p4780", "I can see how it sounded cold.", "冷たく聞こえたのもわかる。"],["p4781", "I should've added an emoji or something.", "絵文字か何かつけるべきだったね。"],["p4782", "Can I call you tonight to explain?", "今夜、電話で説明してもいい？"],["p4783", "I'd still love to come on Sunday.", "日曜日はやっぱりぜひ行きたい。"],["p4784", "I'm glad we cleared that up.", "誤解が解けてよかった。"]],
  r:[["Did I make you angry?", 1],["Why was your reply so short?", 2],["So you're still coming to my party?", 6]],
  c:{sit:"メッセージで謝ったあと、友人から返事が届く",t:[["Okay, no hard feelings. We're good.", 7],["A smiley face would have helped, you know.", 4],["I'd rather hear your voice, honestly.", 5]]}},
 {t:"第五百九十九歩 読書会の進め方にそっと提案",d:"友人が主催する読書会で、押しつけにならないよう運営の改善案を出す",p:[
  ["p4785", "This is just a thought.", "ただの思いつきなんだけど。"],["p4786", "What if we tried smaller groups?", "少人数のグループにしてみるのはどう？"],["p4787", "Feel free to ignore this.", "聞き流してくれていいからね。"],["p4788", "It's your call, of course.", "もちろん、決めるのはあなただよ。"],["p4789", "It might help the quieter people.", "おとなしい人たちが話しやすくなるかも。"],["p4790", "I'd be happy to help set it up.", "準備なら喜んで手伝うよ。"],["p4791", "We could try it once and see.", "一回試してみて様子を見てもいいし。"],["p4792", "You've built something really special here.", "ここ、本当に素敵な場をつくったよね。"]],
  r:[["Why smaller groups, though?", 4],["I'm worried it'll be too much work.", 5],["I'm not sure everyone will like the change.", 6]],
  c:{sit:"読書会のあと、主催者の友人と片づけをしながら話す",t:[["Any ideas to make discussions livelier?", 1],["Should I make the change, or not?", 3],["Be honest. Am I running this well?", 7]]}},
 {t:"第六百歩 六百の歩み",d:"六百歩目の節目に、気配りの英語を身につけた自分を仲間と祝う",p:[
  ["p4793", "Six hundred steps, and still going!", "六百歩、まだまだ続くよ！"],["p4794", "I've learned to say things gently.", "ものごとをやさしく伝えられるようになった。"],["p4795", "Now I can read between the lines.", "今では行間も読めるようになった。"],["p4796", "Small words carry big feelings.", "小さな言葉に大きな気持ちが宿る。"],["p4797", "You taught me to listen first.", "まず聞くことを教えてくれたね。"],["p4798", "I'm not afraid of silence anymore.", "もう沈黙もこわくない。"],["p4799", "Let's keep walking side by side.", "これからも並んで歩いていこう。"],["p4800", "Here's to the next hundred steps!", "次の百歩に乾杯！"]],
  r:[["How many steps is it now?", 0],["What's changed in the way you talk?", 1],["Shall we raise a glass?", 7]],
  c:{sit:"六百歩目の夜、いっしょに学んできた仲間とふり返る",t:[["Remember how awkward pauses used to scare you?", 5],["You've always been a good listener, you know.", 4],["Where do we go from here?", 6]]}},
 {t:"第六百一歩 会社を辞めた理由をそっと聞く",d:"突然会社を辞めた友人に、詮索にならないよう理由を尋ねる",p:[
  ["p4801", "Do you mind if I ask something?", "ひとつ聞いてもいい？"],["p4802", "Feel free not to answer.", "答えなくても全然いいよ。"],["p4803", "What made you decide to leave?", "どうして辞めようと思ったの？"],["p4804", "I'm asking because I care.", "気にかけてるから聞いてるんだよ。"],["p4805", "Sorry, that was too personal.", "ごめん、立ち入りすぎたね。"],["p4806", "That makes total sense.", "すごく納得した。"],["p4807", "It sounds like a brave choice.", "勇気ある選択だね。"],["p4808", "This stays between us, of course.", "もちろん、ここだけの話にするね。"]],
  r:[["Sure, go ahead. What is it?", 2],["I'd rather not get into the details.", 4],["I was burning out, and the hours were crazy.", 5]],
  c:{sit:"久しぶりに会った友人と公園を歩きながら話す",t:[["Why do you want to know, though?", 3],["Please don't tell my old coworkers.", 7],["I quit to start my own business, actually.", 6]]}},
 {t:"第六百二歩 白熱した議論から話題をそらす",d:"親戚の集まりで議論が熱くなりすぎたとき、場の空気を和ませて話題を変える",p:[
  ["p4809", "Okay, let's agree to disagree.", "よし、意見が違うってことで手を打とう。"],["p4810", "By the way, how was your trip?", "ところで、旅行どうだった？"],["p4811", "Who wants more dessert?", "デザートおかわりしたい人？"],["p4812", "On a lighter note, guess what?", "話は変わって明るい話題だけど、聞いて。"],["p4813", "That reminds me, I have news.", "それで思い出した、お知らせがあるんだ。"],["p4814", "Let's save this for another day.", "この話はまた今度にしよう。"],["p4815", "Did anyone catch the game last night?", "昨夜の試合、誰か見た？"],["p4816", "Grandma, tell us about your garden.", "おばあちゃん、お庭の話を聞かせて。"]],
  r:[["We could argue about this all night.", 5],["My roses are finally blooming this year.", 7],["Can I have another slice of that pie?", 2]],
  c:{sit:"親戚との夕食の席で、空気が張りつめてきたところ",t:[["This is getting a bit heated, isn't it?", 3],["Weren't you about to tell us something?", 4],["Your cousin just got back from Spain, you know.", 1]]}},
 {t:"第六百三歩 友人の打ち明け話に耳を傾ける",d:"職場の人間関係に悩む友人の話を、さえぎらずに相づちを打ちながら聞く",p:[
  ["p4817", "I'm listening. Take your time.", "聞いてるよ。ゆっくりでいいよ。"],["p4818", "Wait, he actually said that?", "え、彼が本当にそう言ったの？"],["p4819", "That must have been so frustrating.", "それはすごく悔しかったよね。"],["p4820", "So what happened next?", "それで、次はどうなったの？"],["p4821", "You handled that better than I would.", "私よりずっとうまく対応したね。"],["p4822", "Let me make sure I've got this right.", "ちゃんと理解できてるか確認させて。"],["p4823", "Do you want advice, or do you just need to vent?", "アドバイスがほしい？それともただ吐き出したい？"],["p4824", "Thank you for telling me.", "話してくれてありがとう。"]],
  r:[["He called my idea childish. In front of everyone!", 1],["Sorry, I'm rambling. It's hard to explain.", 0],["I don't even know why I'm telling you this.", 7]],
  c:{sit:"夜のファミレスで、友人の話が一段落したところ",t:[["Sorry, I've just been complaining this whole time.", 6],["I've told you a lot. Does it make sense?", 5],["And then he gave my project to someone else.", 2]]}},
 {t:"第六百四歩 長電話を感じよく切り上げる",d:"久しぶりに電話をくれたおばと話し込み、夕食の支度のため丁寧に電話を終える",p:[
  ["p4825", "It's been so lovely catching up.", "近況が聞けて本当にうれしかった。"],["p4826", "I'd better let you go.", "そろそろ切らないとね。"],["p4827", "I need to start dinner soon.", "そろそろ夕食の支度をしないと。"],["p4828", "Let's talk again next week.", "来週また話そう。"],["p4829", "Say hi to Uncle Tom for me.", "トムおじさんによろしくね。"],["p4830", "I'll send you those photos tonight.", "今夜あの写真を送るね。"],["p4831", "Thank you for calling, really.", "電話してくれて本当にありがとう。"],["p4832", "Take care, and talk soon.", "元気でね、またね。"]],
  r:[["Am I keeping you from something?", 2],["Don't forget the pictures from the wedding!", 5],["Your uncle's been asking about you.", 4]],
  c:{sit:"おばとの電話が一時間を超え、話が一段落したところ",t:[["When can we chat again?", 3],["I just wanted to hear your voice.", 6],["Well, I suppose I should go too.", 7]]}},
 {t:"第六百五歩 根気よく教えてくれた先輩へ",d:"何度も同じ質問をしたのに丁寧に教えてくれた先輩に、心から感謝を伝える",p:[
  ["p4833", "Thank you for being so patient with me.", "いつも辛抱強く付き合ってくれてありがとう。"],["p4834", "I know I asked the same thing twice.", "同じことを二回聞いちゃったよね。"],["p4835", "You never once made me feel stupid.", "一度もばかにされた気がしなかった。"],["p4836", "It finally clicked last night.", "昨夜やっと腑に落ちたんだ。"],["p4837", "I wrote down everything you showed me.", "教えてくれたこと全部メモしたよ。"],["p4838", "I hope I can do the same someday.", "いつか私も同じようにできたらいいな。"],["p4839", "Let me buy you a coffee.", "コーヒーをおごらせて。"],["p4840", "I couldn't have done it without you.", "あなたがいなかったらできなかった。"]],
  r:[["So, does the system make sense now?", 3],["You'll be teaching the new hires soon.", 5],["You don't owe me anything, honestly.", 6]],
  c:{sit:"研修期間の最終日、先輩の席にお礼を言いに行く",t:[["You did all the hard work yourself.", 7],["Do you still have the notes from our sessions?", 4],["I was a total beginner once, too.", 2]]}},
 {t:"第六百六歩 カボチャをくり抜いてランタン作り",d:"ハロウィンに向けて、友人の家でカボチャを彫ってジャック・オー・ランタンを作る",p:[
  ["p4841", "Should we go scary or silly?", "怖い顔にする？それともおどけた顔？"],["p4842", "I'll scoop out the seeds and pulp.", "種とわたは私がかき出すね。"],["p4843", "This part is so slimy.", "ここ、すごくぬるぬるする。"],["p4844", "Let's sketch the face first.", "まず顔を下書きしよう。"],["p4845", "Careful, that knife is really sharp.", "気をつけて、そのナイフすごくよく切れるから。"],["p4846", "We can roast the seeds later.", "種はあとで焼いて食べられるよ。"],["p4847", "Let's put a candle inside.", "中にろうそくを入れよう。"],["p4848", "It looks great on the porch.", "玄関ポーチに置くとすごく映えるね。"]],
  r:[["What kind of face do you want to carve?", 0],["Don't throw those seeds away!", 5],["Let's see how it looks in the dark.", 6]],
  c:{sit:"ハロウィン前の週末、友人の台所で新聞紙を広げて作業を始める",t:[["I'll just start cutting wherever, okay?", 3],["Who wants to clean out the inside?", 1],["I just set it outside by the front door. How does it look?", 7]]}},
 {t:"第六百七歩 トリック・オア・トリートの付き添い",d:"近所の子どもたちのトリック・オア・トリートに付き添い、回り方のマナーを教える",p:[
  ["p4849", "Only knock where the porch light's on.", "玄関の明かりがついている家だけノックしようね。"],["p4850", "Remember to say trick or treat.", "「トリック・オア・トリート」って言うのを忘れないで。"],["p4851", "Just take one piece, okay?", "一個だけもらうんだよ。"],["p4852", "Don't forget to say thank you.", "「ありがとう」を忘れずにね。"],["p4853", "Stay on the sidewalk, please.", "歩道から出ないでね。"],["p4854", "Let's check your candy at home first.", "食べる前に、家でお菓子をチェックしようね。"],["p4855", "Hold my hand when we cross.", "道を渡るときは手をつないでね。"],["p4856", "One more street, then we head back.", "あと一本通りを回ったら帰ろう。"]],
  r:[["Can we go to that dark house over there?", 0],["Can I eat this candy bar right now?", 5],["My feet hurt. How much longer?", 7]],
  c:{sit:"子どもたちと夜道を歩きながら、家々を回る",t:[["Can I grab a whole handful?", 2],["The lady gave us chocolate! Let's go!", 3],["Let's cross over to that side!", 6]]}},
 {t:"第六百八歩 仮装パーティーの衣装選び",d:"友人の仮装パーティーに何の衣装で行くか、一緒に相談する",p:[
  ["p4857", "What's the theme this year?", "今年のテーマは何？"],["p4858", "I want something I can make myself.", "自分で作れるものがいいな。"],["p4859", "Should we do a matching costume?", "おそろいの衣装にしない？"],["p4860", "I need something comfortable to dance in.", "踊りやすいものがいいな。"],["p4861", "Let's check the thrift store first.", "まず古着屋をのぞいてみよう。"],["p4862", "Nobody will recognize me in this.", "これなら誰にも気づかれないね。"],["p4863", "I'll pick up some face paint.", "フェイスペイントを買ってくるね。"],["p4864", "Let's aim for the costume contest prize.", "仮装コンテストの賞を狙おう。"]],
  r:[["Mia's party has a different theme every year.", 0],["I'd love to dress up as a pair with you this year.", 2],["Did you hear there's a prize for the best costume?", 7]],
  c:{sit:"仮装パーティーの一週間前、友人と昼休みに衣装の話をする",t:[["There's going to be a lot of dancing, I heard.", 3],["Where can we find cheap costume pieces?", 4],["You'll be wearing a full mask, right?", 5]]}},
 {t:"第六百九歩 感謝祭の持ち寄り料理を申し出る",d:"友人宅の感謝祭の持ち寄りパーティーに招かれ、何を持っていくかホストと相談する",p:[
  ["p4865", "What can I bring on Thursday?", "木曜日、何を持っていけばいい？"],["p4866", "I'd hate to bring a duplicate dish.", "ほかの人と料理がかぶるのは避けたいな。"],["p4867", "How about a side dish?", "付け合わせの一品はどう？"],["p4868", "I make a pretty good sweet potato casserole.", "スイートポテトのキャセロールはけっこう得意なんだ。"],["p4869", "Any dietary restrictions I should know about?", "知っておくべき食事制限はある？"],["p4870", "Can I use your oven to reheat it?", "温め直すのにオーブンを借りてもいい？"],["p4871", "I'll bring extra containers for leftovers.", "残り物用の容器を多めに持っていくね。"],["p4872", "Count me in for cleanup, too.", "片づけも手伝うからね。"]],
  r:[["We've got the turkey covered, by the way.", 2],["I want to make sure everyone can eat what you bring.", 4],["There's always way too much food left over.", 6]],
  c:{sit:"感謝祭の一週間前、ホストの友人から電話で招待を受ける",t:[["So you'll come? That's great!", 0],["Three people already signed up for stuffing.", 1],["It'll be cold by the time you get here.", 5]]}},
 {t:"第六百十歩 ブラックフライデーの人混みで",d:"早朝のブラックフライデーセールに友人と並び、目当ての品を探す",p:[
  ["p4873", "The line goes around the block.", "列がブロックをぐるっと一周してる。"],["p4874", "Let's split up and meet at checkout.", "手分けして、レジで落ち合おう。"],["p4875", "That's only half the usual price.", "それ、いつもの半額だよ。"],["p4876", "Check if it's cheaper online.", "ネットのほうが安いか見てみて。"],["p4877", "They're already sold out of those.", "それはもう売り切れだって。"],["p4878", "Grab one before they're gone!", "なくなる前に一つ取って！"],["p4879", "I'm only buying what's on my list.", "リストにあるものしか買わないよ。"],["p4880", "Let's get out of this crowd.", "この人混みから抜け出そう。"]],
  r:[["How long is the line? Can you see the end?", 0],["Where are the cheap headphones from the ad?", 4],["You're not buying that giant TV, are you?", 6]],
  c:{sit:"セール開始直後の店内で、友人と作戦を立てる",t:[["We'll never get everything in time together.", 1],["Is this coat really a good deal?", 2],["I can't breathe in here anymore.", 7]]}},
 {t:"第六百十一歩 職場のシークレットサンタ",d:"職場のプレゼント交換「シークレットサンタ」で、くじの相手や予算について同僚と話す",p:[
  ["p4881", "Who did you draw this year?", "今年は誰を引いた？"],["p4882", "My lips are sealed.", "口は固いよ。"],["p4883", "What's the spending limit again?", "予算の上限っていくらだっけ？"],["p4884", "I barely know the person I got.", "引いた相手のことをほとんど知らないんだ。"],["p4885", "Any idea what she's into?", "彼女が何にはまってるか知ってる？"],["p4886", "A gift card feels a bit lazy.", "ギフトカードはちょっと手抜きな気がする。"],["p4887", "I'll leave it on her desk anonymously.", "名前を伏せて彼女の机に置いておくね。"],["p4888", "This is exactly what I wanted!", "まさにほしかったものだ！"]],
  r:[["Come on, just tell me who you got!", 1],["Why not just get a gift card?", 5],["Go on, open it! What do you think?", 7]],
  c:{sit:"昼休みの給湯室で、くじ引きの直後に同僚と話す",t:[["The names were drawn this morning, right?", 0],["I'm thinking of getting him something nice and pricey.", 2],["You got someone from accounting? Do you know her?", 3]]}},
 {t:"第六百十二歩 クリスマスツリーの飾りつけ",d:"友人の家のリビングで、一緒にクリスマスツリーを飾りつける",p:[
  ["p4889", "Lights go on first, right?", "まずライトからだよね？"],["p4890", "Let me untangle these lights.", "このライトのからまり、私がほどくね。"],["p4891", "This ornament looks really old.", "このオーナメント、すごく古そうだね。"],["p4892", "Spread the colors out a bit.", "色が偏らないように散らそう。"],["p4893", "It's leaning a little to the left.", "ちょっと左に傾いてるよ。"],["p4894", "Who gets to put the star on top?", "てっぺんの星は誰がつけるの？"],["p4895", "Could you hold the ladder for me?", "はしごを押さえてくれる？"],["p4896", "Let's turn off the room lights.", "部屋の明かりを消してみよう。"]],
  r:[["These came out of the box in one big knot.", 1],["My grandmother gave us that one.", 2],["Okay, everything's on. Ready to see it?", 7]],
  c:{sit:"週末の夜、友人の家のリビングで箱からオーナメントを出す",t:[["Where do we start? Ornaments?", 0],["All the red balls ended up on one side.", 3],["Something looks off. Step back and look.", 4]]}},
 {t:"第六百十三歩 ホリデーカードにひとこと添える",d:"年末に送るホリデーカードに添えるメッセージを、友人と一緒に考える",p:[
  ["p4897", "Happy Holidays feels the most inclusive.", "「ハッピーホリデーズ」がいちばん誰にでも合うね。"],["p4898", "I want to add a personal note.", "一言、個人的なメッセージを添えたい。"],["p4899", "Wishing you a peaceful new year.", "おだやかな新年をお迎えください。"],["p4900", "It's been too long since we talked.", "ずいぶん話してないね。"],["p4901", "Let's catch up properly next year.", "来年はちゃんと近況を話そう。"],["p4902", "I'll tuck in a photo from our trip.", "旅行の写真を一枚入れておこう。"],["p4903", "Did I spell her name right?", "名前のつづり、合ってるかな？"],["p4904", "I need to mail these by Friday.", "金曜までに出さないと。"]],
  r:[["I'm never sure whether to write Merry Christmas.", 0],["Just signing your name seems a bit cold.", 1],["When do these need to go out?", 7]],
  c:{sit:"年末の夜、テーブルいっぱいにカードを広げて友人と書く",t:[["What's a nice line for the closing?", 2],["Wait, isn't her name spelled with a K, not a C?", 6],["Those beach pictures would be perfect to send.", 5]]}},
 {t:"第六百十四歩 大みそかのカウントダウン",d:"友人の大みそかパーティーで、年越しのカウントダウンを迎える",p:[
  ["p4905", "Ten minutes until midnight!", "年越しまであと十分！"],["p4906", "Grab a party hat and a horn.", "パーティー帽とラッパを取って。"],["p4907", "Let's get the champagne ready.", "シャンパンを用意しよう。"],["p4908", "Here comes the countdown!", "カウントダウンが始まるよ！"],["p4909", "Happy New Year, everyone!", "みんな、あけましておめでとう！"],["p4910", "Cheers to a great year ahead!", "素晴らしい一年に乾杯！"],["p4911", "This year flew by so fast.", "今年はあっという間だったね。"],["p4912", "It's already New Year's Day in Japan.", "日本はもう元日だよ。"]],
  r:[["How long until midnight?", 0],["Five, four, three, two, one!", 4],["Can you believe another year is over?", 6]],
  c:{sit:"大みそかの夜、友人宅のリビングで年越しの瞬間を待つ",t:[["Everyone has a glass but us.", 2],["Should we call your parents to wish them a happy new year?", 7],["Raise your glass! Any toast?", 5]]}},
 {t:"第六百十五歩 友だちへのバレンタインカード",d:"英語圏では友だち同士でもカードを贈ると知り、友人にカードと小さなチョコを渡す",p:[
  ["p4913", "Here's a little something for you.", "ちょっとしたものだけど、どうぞ。"],["p4914", "It's just a friendly valentine.", "友だちとしてのバレンタインだよ。"],["p4915", "Here, people send cards to friends, too.", "こっちでは友だちにもカードを贈るんだね。"],["p4916", "I made it myself, so be kind.", "手作りだから、やさしい目で見てね。"],["p4917", "I'm glad you're my friend.", "あなたが友だちでうれしい。"],["p4918", "The chocolate's from my favorite shop.", "チョコはお気に入りのお店のなんだ。"],["p4919", "In Japan, it's a bit different.", "日本だとちょっと違うんだ。"],["p4920", "Don't read too much into it!", "深読みしないでね！"]],
  r:[["Wait, so this is a romantic thing?", 1],["This card is adorable. Did you draw this?", 3],["These truffles are amazing. Where are they from?", 5]],
  c:{sit:"二月十四日の朝、教室で友人にカードと小さなチョコを渡す",t:[["What's this? It's not my birthday.", 0],["So, how do people celebrate Valentine's Day in Japan?", 6],["You really didn't have to do this.", 4]]}},
 {t:"第六百十六歩 聖パトリックの日のパレード",d:"三月の聖パトリックの日に、友人と街のパレードを見に行く",p:[
  ["p4921", "Everyone's wearing green today.", "今日はみんな緑の服を着てるね。"],["p4922", "You'll get pinched if you don't.", "着てないとつねられちゃうよ。"],["p4923", "I didn't know about that custom.", "その習わしは知らなかった。"],["p4924", "Let's find a spot near the front.", "前のほうで場所を探そう。"],["p4925", "The bagpipes are coming!", "バグパイプが来るよ！"],["p4926", "I can feel the drums in my chest.", "太鼓の音が胸に響くね。"],["p4927", "Let's grab some soda bread after.", "あとでソーダブレッドを食べよう。"],["p4928", "Where does this tradition come from?", "この伝統はどこから来たの？"]],
  r:[["Look at the crowd. Notice anything?", 0],["Why'd you tell me to wear something green?", 1],["I can't see a thing from back here.", 3]],
  c:{sit:"パレード当日、沿道で友人と見物しながら話す",t:[["People pinch you if you're not in green, you know.", 2],["Listen! What's that high, droning sound?", 4],["What should we eat once the parade's over?", 6]]}},
 {t:"第六百十七歩 子どもたちのエッグハント",d:"イースターの朝、近所のイベントで子どもたちの卵探しを手伝う",p:[
  ["p4929", "The eggs are hidden all over the yard.", "卵は庭じゅうに隠してあるよ。"],["p4930", "Little ones get a head start.", "小さい子は先にスタートしていいよ。"],["p4931", "Look under the bushes!", "茂みの下を見てごらん！"],["p4932", "You're getting warmer!", "近づいてきたよ！"],["p4933", "Leave some for the others, okay?", "ほかの子の分も残しておいてね。"],["p4934", "How many did you find?", "いくつ見つけた？"],["p4935", "There's one more golden egg somewhere.", "金色の卵がまだどこかに一つあるよ。"],["p4936", "Let's trade so everyone gets some.", "みんなに行きわたるように交換しよう。"]],
  r:[["I can't find any eggs anywhere!", 2],["Am I close? Am I close?", 3],["My basket is so full!", 4]],
  c:{sit:"イースターの朝、公園で子どもたちにルールを説明しながら見守る",t:[["The big kids are too fast for my sister.", 1],["I didn't find a single one, and he has ten!", 7],["We checked everywhere. Are we done now?", 6]]}},
 {t:"第六百十八歩 母の日のブランチを予約する",d:"母の日のブランチのために、人気のレストランに電話で席を予約する",p:[
  ["p4937", "I'd like to book a table for Sunday.", "日曜日に席を予約したいのですが。"],["p4938", "It's for Mother's Day brunch.", "母の日のブランチなんです。"],["p4939", "There will be four of us.", "四人です。"],["p4940", "Do you have anything around eleven?", "十一時ごろ空いていますか？"],["p4941", "One of us uses a wheelchair.", "一人が車いすを使っています。"],["p4942", "Could we sit by the window?", "窓際の席にしてもらえますか？"],["p4943", "Could you add a message to her dessert?", "母のデザートにメッセージを添えてもらえますか？"],["p4944", "That works perfectly, thank you.", "それで大丈夫です、ありがとうございます。"]],
  r:[["Hello, Rosie's Kitchen. How can I help?", 0],["And how many people will be joining?", 2],["We can do eleven thirty. Would that work?", 7]],
  c:{sit:"母の日の前の週、人気のカフェに電話して席を確保する",t:[["Any special occasion we should know about?", 1],["Anything we should know for accessibility?", 4],["Any seating preference for your party?", 5]]}},
 {t:"第六百十九歩 留学先の卒業パーティー",d:"留学先で知り合った友人の卒業パーティーに招かれ、お祝いを伝える",p:[
  ["p4945", "Congratulations, you did it!", "卒業おめでとう、やったね！"],["p4946", "All those late nights paid off.", "夜遅くまでがんばったかいがあったね。"],["p4947", "Your family must be so proud.", "ご家族もさぞ誇らしいだろうね。"],["p4948", "I brought you a little card.", "小さなカードを持ってきたよ。"],["p4949", "So, what's next for you?", "それで、次はどうするの？"],["p4950", "Let's get a picture together.", "一緒に写真を撮ろう。"],["p4951", "Your cap is a bit crooked.", "角帽がちょっと曲がってるよ。"],["p4952", "I'll miss having you around.", "いなくなるとさびしくなるな。"]],
  r:[["I can't believe I actually finished.", 1],["My parents flew in from Ohio for this.", 2],["I'm moving to Seattle next month.", 7]],
  c:{sit:"友人の家の裏庭で開かれた卒業パーティーで、主役に声をかける",t:[["Hey, you made it! Thank you for coming.", 0],["Does my outfit look okay for photos?", 6],["You didn't have to bring anything!", 3]]}},
 {t:"第六百二十歩 独立記念日のバーベキュー",d:"友人の家の七月四日のバーベキューに参加し、夜の花火を待つ",p:[
  ["p4953", "Happy Fourth of July!", "独立記念日おめでとう！"],["p4954", "Can I help at the grill?", "グリル、手伝おうか？"],["p4955", "I'll take a burger, medium, please.", "バーガーをミディアムでお願い。"],["p4956", "Where's the best spot for fireworks?", "花火がいちばんよく見える場所はどこ？"],["p4957", "Let's grab a blanket for the lawn.", "芝生に敷くブランケットを持っていこう。"],["p4958", "Everything's red, white, and blue!", "何もかも赤、白、青だね！"],["p4959", "That one was huge!", "今のすごく大きかった！"],["p4960", "My ears are still ringing.", "まだ耳がキーンとしてる。"]],
  r:[["How do you like your burger?", 2],["Look at all the flags and decorations.", 5],["The show starts at dusk. Ready to head out?", 4]],
  c:{sit:"七月四日の夕方、友人宅の裏庭でバーベキューが始まる",t:[["I'm flipping burgers and hot dogs nonstop here.", 1],["The fireworks are over the lake tonight.", 3],["Did you see that gold one?", 6]]}},
 {t:"第六百二十一歩 サマーキャンプに子どもを送る",d:"夏休み、子どもをサマーキャンプに送り届け、受付のスタッフに必要なことを伝える",p:[
  ["p4961", "We're here to drop off Lily.", "リリーを送りに来ました。"],["p4962", "She has a peanut allergy.", "あの子はピーナッツアレルギーがあります。"],["p4963", "Her medication is in this bag.", "薬はこのバッグに入っています。"],["p4964", "How often can we call her?", "どのくらいの頻度で電話できますか？"],["p4965", "She's a little nervous, honestly.", "正直、少し緊張しているんです。"],["p4966", "You're going to have so much fun.", "きっとすごく楽しいよ。"],["p4967", "Write us a letter, okay?", "手紙を書いてね。"],["p4968", "We'll pick you up on Saturday.", "土曜日に迎えに来るからね。"]],
  r:[["Welcome to Camp Pinewood! Camper's name?", 0],["Any health issues we should know about?", 1],["When are you coming back for me?", 7]],
  c:{sit:"キャンプ場の受付で、カウンセラーに子どものことを伝える",t:[["Does she need anything during the day?", 2],["She's hiding behind you. First time at camp?", 4],["Mom, what if I don't make any friends?", 5]]}},
 {t:"第六百二十二歩 新学期の買い出し",d:"夏休みの終わり、友人とその子どもと一緒に新学期の文房具を買いに行く",p:[
  ["p4969", "Do you have the supply list?", "持ち物リストある？"],["p4970", "We still need two binders.", "バインダーがまだ二冊いるね。"],["p4971", "These folders are on sale.", "このフォルダー、セール中だよ。"],["p4972", "Let's not forget a calculator.", "電卓を忘れないようにしよう。"],["p4973", "This backpack looks much sturdier.", "こっちのリュックのほうがずっと丈夫そう。"],["p4974", "The cartoon one costs twice as much.", "キャラクターのは倍の値段だよ。"],["p4975", "Let's label everything with her name.", "全部に名前を書いておこう。"],["p4976", "That's everything on the list.", "これでリストのものは全部だね。"]],
  r:[["What does the school say she needs?", 0],["This bag looks cute, but the zipper's flimsy.", 4],["Anything left, or are we done?", 7]],
  c:{sit:"夏休みの終わり、友人と子どもを連れて文房具店を回る",t:[["Her math teacher wants a specific model.", 3],["Kids always lose their stuff at school.", 6],["But I want the one with the unicorn!", 5]]}},
 {t:"第六百二十三歩 ベビーシャワーに招かれて",d:"同僚のベビーシャワーに招かれ、プレゼントを渡してお祝いを伝える",p:[
  ["p4977", "You're absolutely glowing!", "すごく輝いてるね！"],["p4978", "When are you due?", "予定日はいつ？"],["p4979", "I got something from your registry.", "ほしいものリストから選んだよ。"],["p4980", "I hope it comes in handy.", "役に立つといいな。"],["p4981", "Have you picked out any names?", "名前はもう決めた？"],["p4982", "What game are we playing next?", "次は何のゲーム？"],["p4983", "Let me know if you need anything.", "何か必要なら言ってね。"],["p4984", "I can't wait to meet the baby.", "赤ちゃんに会えるのが楽しみ。"]],
  r:[["Honestly, I feel like a whale these days.", 0],["A baby monitor! How did you know?", 2],["Only six more weeks to go!", 7]],
  c:{sit:"同僚の家で開かれたベビーシャワーで、主役に声をかける",t:[["Everything's happening so fast. I feel overwhelmed.", 6],["This bottle warmer will save me at night.", 3],["Okay, everyone, grab a pen for the next one!", 5]]}},
 {t:"第六百二十四歩 新居祝いの手みやげ",d:"友人の新居祝いのパーティーに、手みやげを持って訪れる",p:[
  ["p4985", "Congrats on the new place!", "新居おめでとう！"],["p4986", "I brought a little plant.", "小さな観葉植物を持ってきたよ。"],["p4987", "It's really easy to take care of.", "世話がすごく楽なんだ。"],["p4988", "Mind if I take my shoes off?", "靴を脱いでもいい？"],["p4989", "Can I get the grand tour?", "ぐるっと案内してくれる？"],["p4990", "The natural light in here is amazing.", "ここ、自然光がすごく入るね。"],["p4991", "How's the commute from here?", "ここからの通勤はどう？"],["p4992", "You've made it so cozy already.", "もうすっかり居心地よくしてるね。"]],
  r:[["Come in, come in! Welcome!", 0],["It's so cute. But I kill every plant.", 2],["We only moved in two weeks ago.", 7]],
  c:{sit:"友人のアパートの玄関で、紙袋を手に出迎えられる",t:[["What's in the bag?", 1],["We fell in love with the big windows.", 5],["Everyone's in the living room. Come on through!", 3]]}},
 {t:"第六百二十五歩 ホリデー明けの返品カウンター",d:"年明け、もらったセーターのサイズが合わず、店の返品カウンターで交換を頼む",p:[
  ["p4993", "I got this as a gift.", "これ、プレゼントでもらったんです。"],["p4994", "It's a little too small.", "ちょっと小さすぎて。"],["p4995", "I have a gift receipt.", "ギフトレシートがあります。"],["p4996", "Could I exchange it for a large?", "Lサイズに交換できますか？"],["p4997", "Store credit is fine, too.", "お店のクレジットでも大丈夫です。"],["p4998", "The tags are still attached.", "タグはまだついたままです。"],["p4999", "How long is the holiday return period?", "年末年始の返品期間はどのくらいですか？"],["p5000", "I'll take the navy one instead.", "代わりに紺のにします。"]],
  r:[["Do you have the receipt with you?", 2],["Has it been worn at all?", 5],["We're out of large in gray, sorry.", 7]],
  c:{sit:"年明けの混み合うデパートの返品カウンターで、店員に事情を話す",t:[["Hi there. What can I do for you?", 0],["I can't do a cash refund on this, I'm afraid.", 4],["So what would you like to do with it?", 3]]}},
 {t:"第六百二十六歩 新しい路線が開通して",d:"地元に新しい鉄道路線が開通し、同僚と通勤の変化について話す",p:[
  ["p5001", "Have you tried the new line yet?", "新しい路線、もう乗ってみた？"],["p5002", "It cuts my commute in half.", "通勤時間が半分になるんだ。"],["p5003", "The stations are spotless right now.", "今は駅がどこもピカピカだね。"],["p5004", "No more transferring at Central for me.", "もうセントラル駅で乗り換えなくていいんだ。"],["p5005", "It was packed on opening day.", "開業日はぎゅうぎゅうだったよ。"],["p5006", "Trains come every few minutes.", "数分おきに電車が来るよ。"],["p5007", "Rent near the new stations will probably go up.", "新駅周辺の家賃、たぶん上がるね。"],["p5008", "It's been in the works forever.", "ずっと前から計画されてたよね。"]],
  r:[["Has the new line made a difference for you?", 1],["What was it like when it first opened?", 4],["I've heard apartments near there are getting popular.", 6]],
  c:{sit:"新路線の開業から一週間、職場の休憩室で同僚と話す",t:[["They finally finished it after all those years.", 7],["How long do you usually wait on the platform?", 5],["Everything still looks brand new down there.", 2]]}},
 {t:"第六百二十七歩 スーパーの値上げをぼやく",d:"スーパーで友人とばったり会い、最近の値上がりについてぼやき合う",p:[
  ["p5009", "Everything costs more than last month.", "何もかも先月より高いね。"],["p5010", "Eggs went up again, did you notice?", "卵、また上がったの気づいた？"],["p5011", "The packages keep getting smaller, too.", "パッケージもどんどん小さくなってるし。"],["p5012", "I've switched to the store brand.", "私はスーパーのプライベートブランドに切り替えたよ。"],["p5013", "I only buy what's on sale now.", "今はセール品しか買わないの。"],["p5014", "My receipt nearly gave me a heart attack.", "レシートを見て心臓が止まりそうだった。"],["p5015", "Let's split a bulk pack of rice.", "お米の大袋、半分こしようよ。"],["p5016", "At least vegetables are cheaper this week.", "少なくとも今週は野菜が安いね。"]],
  r:[["How much did you end up spending?", 5],["This rice bag is huge. I'll never finish it alone.", 6],["Doesn't this chip bag look smaller than before?", 2]],
  c:{sit:"スーパーの通路で友人とばったり会い、カゴの中身を見せ合う",t:[["Do you still buy the name-brand cereal?", 3],["I need to pick up some eggs today.", 1],["Has anything gotten cheaper at all?", 7]]}},
 {t:"第六百二十八歩 なじみのパン屋が閉店する",d:"長年通った近所のパン屋が閉店すると知り、友人と残念がる",p:[
  ["p5017", "Did you hear Rosie's Bakery is closing?", "ローズィーズ・ベーカリーが閉店するって聞いた？"],["p5018", "I've been going there since I was a kid.", "子どものころから通ってたのに。"],["p5019", "The owners are finally retiring.", "オーナー夫婦がついに引退するんだって。"],["p5020", "Their cinnamon rolls were the best in town.", "あそこのシナモンロールは町一番だった。"],["p5021", "The street will feel empty without them.", "あのお店がないと、通りが寂しくなるね。"],["p5022", "Let's go one last time this weekend.", "今週末、最後にもう一度行こう。"],["p5023", "Maybe someone will take over the shop.", "誰かがお店を継いでくれるかもね。"],["p5024", "We should write them a thank-you card.", "お礼のカードを書こうよ。"]],
  r:[["Why are they closing? Business was good.", 2],["What was your favorite thing they made?", 3],["Their last day is this Sunday.", 5]],
  c:{sit:"閉店の貼り紙を見た帰り道、友人と並んで歩く",t:[["You've known them a long time, huh?", 1],["I wish we could thank them somehow.", 7],["I hope the space doesn't stay empty.", 6]]}},
 {t:"第六百二十九歩 新しい公園の遊具を見に",d:"新しくできた公園に、子連れの友人と遊具を見に行く",p:[
  ["p5025", "The new park finally opened!", "新しい公園、ついにオープンしたね！"],["p5026", "That zip line looks like so much fun.", "あのジップライン、すごく楽しそう。"],["p5027", "There's even a splash pad for summer.", "夏用の水遊び場まであるよ。"],["p5028", "The ground is soft rubber, so it's safe.", "地面がやわらかいゴムだから安全だね。"],["p5029", "Look, there are shaded benches for parents.", "見て、親用の日陰のベンチがあるよ。"],["p5030", "The kids are going to beg to stay.", "子どもたち、帰りたくないってせがむだろうね。"],["p5031", "It used to be an empty parking lot.", "前はがらんとした駐車場だったのにね。"],["p5032", "Let's bring a picnic next time.", "次はお弁当を持ってこよう。"]],
  r:[["What was here before? I can't remember.", 6],["I'm worried she'll get hurt if she falls.", 3],["Where can I sit while they play?", 4]],
  c:{sit:"公園のベンチで、遊ぶ子どもたちを見守りながら友人と話す",t:[["What do you think the kids will try first?", 1],["I didn't pack any lunch today, sadly.", 7],["We'll have to leave in a few minutes.", 5]]}},
 {t:"第六百三十歩 熱中症警戒アラートの日",d:"熱中症警戒アラートが出た朝、職場で同僚と暑さへの備えを話す",p:[
  ["p5033", "They issued a heat advisory for today.", "今日、熱中症警戒アラートが出たよ。"],["p5034", "It's supposed to hit thirty-eight degrees.", "三十八度まで上がるらしい。"],["p5035", "Make sure you keep drinking water.", "こまめに水を飲んでね。"],["p5036", "I'm working from home this afternoon.", "午後は在宅勤務にするよ。"],["p5037", "Let's skip the outdoor lunch today.", "今日は外でのランチはやめておこう。"],["p5038", "I brought a neck cooler with me.", "首を冷やすグッズを持ってきたんだ。"],["p5039", "Check on your elderly neighbors, too.", "近所のお年寄りにも声をかけてあげてね。"],["p5040", "Stay in the shade whenever you can.", "できるだけ日陰にいてね。"]],
  r:[["How hot is it going to get?", 1],["Want to eat on the terrace like usual?", 4],["I'm going to call my grandma to check on her.", 6]],
  c:{sit:"朝のオフィスで、汗だくで出社した同僚と話す",t:[["I'm already so thirsty, and it's only ten.", 2],["What's that thing around your neck?", 5],["Why's everyone talking about the weather today?", 0]]}},
 {t:"第六百三十一歩 記録的な大雪ではしゃぐ",d:"記録的な大雪の朝、ルームメイトと雪の一日の楽しみ方を考える",p:[
  ["p5041", "We got the most snow in decades!", "ここ数十年でいちばんの大雪だって！"],["p5042", "The whole street is buried.", "通りがまるごと雪に埋もれてる。"],["p5043", "Let's build the biggest snowman ever.", "史上最大の雪だるまを作ろう。"],["p5044", "My office just called a snow day.", "会社が雪で休みにしたんだ。"],["p5045", "Grab the sled from the garage.", "ガレージからそりを持ってきて。"],["p5046", "Let's help shovel the neighbors' driveways.", "近所の家の前の雪かきを手伝おう。"],["p5047", "I'll make us some hot cocoa.", "ホットココアを作るね。"],["p5048", "The town looks like a postcard.", "町が絵はがきみたい。"]],
  r:[["How much snow did we actually get?", 0],["My fingers are freezing. Let's go inside.", 6],["That hill behind the school looks perfect.", 4]],
  c:{sit:"窓の外が一面真っ白な朝、ルームメイトと話す",t:[["Don't you have work today?", 3],["Mr. Brown can't clear his snow with his bad back.", 5],["Look how pretty everything is outside.", 7]]}},
 {t:"第六百三十二歩 地元チームの逆転勝利",d:"地元のサッカーチームが劇的な逆転勝利をおさめた翌朝、同僚と盛り上がる",p:[
  ["p5049", "Did you catch the game last night?", "昨日の試合、見た？"],["p5050", "What a comeback in the last minute!", "最後の一分での逆転、すごかった！"],["p5051", "The whole bar went crazy.", "店じゅう大騒ぎだったよ。"],["p5052", "Their new goalkeeper was amazing.", "新しいゴールキーパーがすごかった。"],["p5053", "They're in the finals for the first time.", "初めての決勝進出だよ。"],["p5054", "Let's watch the final together.", "決勝は一緒に見よう。"],["p5055", "I'm still hoarse from cheering.", "応援しすぎて、まだ声がかれてる。"],["p5056", "There's talk of a parade downtown.", "中心街でパレードをする話も出てるよ。"]],
  r:[["Your voice sounds weird today.", 6],["Who played best, in your opinion?", 3],["So what's next for the Hawks?", 4]],
  c:{sit:"試合の翌朝、職場のエレベーターで同僚と話す",t:[["Where did you end up watching it?", 2],["I heard they were losing at halftime.", 1],["How's the city going to celebrate?", 7]]}},
 {t:"第六百三十三歩 図書館の分館ができた",d:"駅前に図書館の分館がオープンし、友人と館内を見て回る",p:[
  ["p5057", "The new library branch is gorgeous.", "新しい分館、すてきだね。"],["p5058", "There's a whole floor for kids.", "子ども向けのフロアがまるごとあるよ。"],["p5059", "You can return books at any branch.", "どの館でも本を返せるんだ。"],["p5060", "They even have study rooms you can book.", "予約できる自習室まであるよ。"],["p5061", "It's open until nine on weekdays.", "平日は九時まで開いてるよ。"],["p5062", "Let's get you a library card.", "図書カードを作ろうよ。"],["p5063", "The café downstairs smells amazing.", "下のカフェ、すごくいい香り。"],["p5064", "Finally, a quiet place near the station.", "やっと駅の近くに静かな場所ができた。"]],
  r:[["I can't check anything out. I'm not a member.", 5],["Can I drop these off at the main library?", 2],["Can I come here after work?", 4]],
  c:{sit:"分館の入口で案内図を見ながら、友人と話す",t:[["Where can my daughter read picture books?", 1],["I need somewhere private for my group project.", 3],["Something smells like fresh coffee.", 6]]}},
 {t:"第六百三十四歩 道路工事で回り道",d:"車で出かけた先で道路工事の通行止めにあい、助手席の友人と相談する",p:[
  ["p5065", "Looks like Main Street is closed again.", "またメイン通りが通行止めみたい。"],["p5066", "We'll have to take a detour.", "回り道しないとね。"],["p5067", "They're repaving the whole road.", "道路を全面的に舗装し直してるんだって。"],["p5068", "Just follow the orange signs.", "オレンジの標識に沿って行けばいいよ。"],["p5069", "This adds at least ten minutes.", "これで少なくとも十分は余計にかかるね。"],["p5070", "Let's take the back roads instead.", "代わりに裏道を行こう。"],["p5071", "It's supposed to last until spring.", "春まで続くらしいよ。"],["p5072", "At least it'll be smoother after.", "終わったら少なくとも走りやすくなるね。"]],
  r:[["Which way should I go now?", 3],["How long is this going to go on?", 6],["What are they even doing over there?", 2]],
  c:{sit:"迂回路を走る車の中で、助手席の友人と話す",t:[["The detour is bumper to bumper.", 5],["We're going to be late, aren't we?", 4],["All this noise and traffic is driving me crazy.", 7]]}},
 {t:"第六百三十五歩 町の祭りが帰ってくる",d:"何年も中止されていた町の夏祭りが今年復活すると知り、友人と話す",p:[
  ["p5073", "The town festival is coming back this year!", "今年、町のお祭りが復活するって！"],["p5074", "It's been years since the last one.", "前回からもう何年もたつね。"],["p5075", "I've missed the food stalls so much.", "屋台がすごく恋しかった。"],["p5076", "I'm signing up to volunteer.", "ボランティアに申し込むつもり。"],["p5077", "There'll be fireworks on Saturday night.", "土曜の夜は花火があるよ。"],["p5078", "Let's wear yukata this time.", "今回は浴衣を着ていこう。"],["p5079", "The parking will be a nightmare.", "駐車場はとんでもないことになるね。"],["p5080", "Let's take the bus to be safe.", "念のためバスで行こう。"]],
  r:[["What should we wear?", 5],["They need extra hands for setup.", 3],["What's the best night to go?", 4]],
  c:{sit:"町の掲示板でお祭りのポスターを見つけ、友人と話す",t:[["Do you remember the snacks they used to sell?", 2],["When did they last hold it?", 1],["Should we drive or take the bus?", 7]]}},
 {t:"第六百三十六歩 公園に珍しいフクロウ",d:"近所の公園に珍しいフクロウが現れたと聞き、友人と見に行く",p:[
  ["p5081", "A rare owl was spotted in the park.", "公園で珍しいフクロウが目撃されたんだって。"],["p5082", "It's usually only seen up north.", "ふだんは北のほうでしか見られないらしい。"],["p5083", "Birdwatchers came from all over.", "あちこちからバードウォッチャーが来てるね。"],["p5084", "Let's keep our voices down.", "声を小さくしよう。"],["p5085", "It's perched on that high branch.", "あの高い枝にとまってるよ。"],["p5086", "Can I borrow your binoculars?", "双眼鏡を貸してくれる？"],["p5087", "Don't use your flash, okay?", "フラッシュはたかないでね。"],["p5088", "It must have gotten blown off course.", "きっと風で進路を外れちゃったんだね。"]],
  r:[["Where exactly is it?", 4],["Why are there so many people with cameras?", 2],["Let me get a photo with my phone.", 6]],
  c:{sit:"人だかりのできた公園の木の下で、友人と話す",t:[["It's hard to see that far without help.", 5],["What's it doing so far from home?", 7],["Do you see these around here often?", 1]]}},
 {t:"第六百三十七歩 シェアサイクルに初挑戦",d:"町に新しいシェアサイクルが導入され、友人に使い方を教わる",p:[
  ["p5089", "Have you tried the new bike share?", "新しいシェアサイクル、使ってみた？"],["p5090", "You just scan the code with the app.", "アプリでコードを読み取るだけだよ。"],["p5091", "The first ride is free this month.", "今月は初回の乗車が無料なんだ。"],["p5092", "You can drop it off at any dock.", "どのステーションに返してもいいんだよ。"],["p5093", "This one has a flat tire.", "これ、タイヤがパンクしてる。"],["p5094", "Let me lower the seat for you.", "サドルを下げてあげるね。"],["p5095", "It's electric, so hills are easy.", "電動だから坂道も楽だよ。"],["p5096", "Don't forget to end the ride.", "乗車終了の操作を忘れないでね。"]],
  r:[["How do I unlock it?", 1],["I can't reach the pedals.", 5],["Do I have to bring it back here?", 3]],
  c:{sit:"駅前のステーションで、自転車を借りようとしている",t:[["This feels kind of wobbly. Something's off.", 4],["That hill looks brutal on a bike.", 6],["Okay, I parked it. Am I done?", 7]]}},
 {t:"第六百三十八歩 話題の猫動画",d:"SNSで話題になっている猫の動画を、休憩中に同僚に見せる",p:[
  ["p5097", "Have you seen this cat video?", "この猫の動画、見た？"],["p5098", "It has millions of views already.", "もう何百万回も再生されてるんだよ。"],["p5099", "Watch what happens at the end.", "最後に何が起きるか見てて。"],["p5100", "It knocks the cup off on purpose.", "わざとコップを落とすんだよ。"],["p5101", "The look on its face kills me.", "あの表情、たまらない。"],["p5102", "My cat does the exact same thing.", "うちの猫もまったく同じことするよ。"],["p5103", "I've watched it like twenty times.", "もう二十回くらい見ちゃった。"],["p5104", "I'll send you the link.", "リンク送るね。"]],
  r:[["Why is everyone talking about this?", 1],["Wait, did it just do that deliberately?", 3],["Can you share it with me?", 7]],
  c:{sit:"休憩室で、同僚とスマホの画面をのぞきこむ",t:[["Let me guess, you can't stop replaying it.", 6],["Does your pet ever act like that?", 5],["Okay, it's almost over. What am I waiting for?", 2]]}},
 {t:"第六百三十九歩 新しいカフェチェーン上陸",d:"海外の人気カフェチェーンが近所に国内一号店を出し、友人と行列に並ぶ",p:[
  ["p5105", "The line goes around the block!", "行列がブロックをぐるっと一周してる！"],["p5106", "It's their first shop in the country.", "国内一号店なんだって。"],["p5107", "Everyone's here for the honey latte.", "みんなハニーラテ目当てだよ。"],["p5108", "Let's come back on a weekday.", "平日にまた来よう。"],["p5109", "The menu is all on that screen.", "メニューは全部あの画面に出てるよ。"],["p5110", "Honestly, it's a bit overhyped.", "正直、ちょっと騒がれすぎかも。"],["p5111", "The cups are really photogenic.", "カップがすごく写真映えするね。"],["p5112", "I'll grab us a table upstairs.", "上の階で席を取っておくね。"]],
  r:[["What's everyone ordering?", 2],["We'll be standing here forever.", 3],["So what did you think of the coffee?", 5]],
  c:{sit:"長い行列の中ほどで、友人と待ちながら話す",t:[["Why's everyone taking pictures of their drinks?", 6],["How long has this brand been around here?", 1],["Where do you want to sit?", 7]]}},
 {t:"第六百四十歩 今夜は流星群",d:"今夜流星群が見られるとニュースで知り、友人と観察の計画を立てる",p:[
  ["p5113", "There's a meteor shower tonight.", "今夜、流星群が見られるんだって。"],["p5114", "It peaks around two in the morning.", "夜中の二時ごろがピークらしい。"],["p5115", "Let's drive away from the city lights.", "街の明かりから離れたところまで車で行こう。"],["p5116", "Bring a blanket and lie back.", "毛布を持ってきて、寝そべって見よう。"],["p5117", "Give your eyes time to adjust.", "目が慣れるまで少し待ってね。"],["p5118", "There goes one! Did you see it?", "今、流れた！見た？"],["p5119", "Quick, make a wish!", "早く、願いごとして！"],["p5120", "The sky's so clear tonight.", "今夜は空がすごく澄んでるね。"]],
  r:[["When's the best time to watch?", 1],["I can barely see any stars here.", 2],["Everything's still pitch black to me.", 4]],
  c:{sit:"夕方、友人からの電話で今夜の予定を話す",t:[["I always get a sore neck from looking up at the sky.", 3],["Not a single cloud out there, huh?", 7],["Why are you so excited about tonight?", 0]]}},
 {t:"第六百四十一歩 桜の開花予想が出た",d:"桜の開花予想が発表された日、同僚とお花見の計画を立てる",p:[
  ["p5121", "The cherry blossom forecast just came out.", "桜の開花予想が出たよ。"],["p5122", "They're blooming a week early this year.", "今年は一週間早く咲くんだって。"],["p5123", "Full bloom should be next weekend.", "満開は来週末みたい。"],["p5124", "Let's grab a spot by the river.", "川沿いに場所を取ろう。"],["p5125", "I'll bring the snacks this time.", "今回はおつまみは私が持っていくね。"],["p5126", "Let's go early to beat the crowds.", "混雑を避けて早めに行こう。"],["p5127", "Rain could knock the petals down.", "雨が降ると花が散っちゃうかも。"],["p5128", "Night viewing with lanterns sounds lovely.", "ちょうちんの下で夜桜見物もすてきだね。"]],
  r:[["When will they be at their peak?", 2],["Where should we set up?", 3],["I'm worried about the weekend weather.", 6]],
  c:{sit:"昼休み、ニュースアプリを見ながら同僚と話す",t:[["It's still so chilly. Surely it's too soon?", 1],["The park gets crazy busy by noon.", 5],["They light up the trees after dark there.", 7]]}},
 {t:"第六百四十二歩 美術館の無料開館日",d:"美術館の無料開館日に、友人と待ち合わせて出かける",p:[
  ["p5129", "Admission is free all day today.", "今日は一日じゅう入館無料なんだ。"],["p5130", "You still need a timed ticket online.", "それでもオンラインで時間指定券が必要だよ。"],["p5131", "Let's check our bags at the locker.", "かばんはロッカーに預けよう。"],["p5132", "The special exhibit costs extra, though.", "でも特別展は別料金だよ。"],["p5133", "Let's start on the top floor.", "最上階から回ろう。"],["p5134", "The museum shop has great postcards.", "ミュージアムショップのポストカードがいいんだよ。"],["p5135", "No wonder it's so crowded.", "どうりでこんなに混んでるわけだ。"],["p5136", "Let's leave a donation on the way out.", "帰りに寄付していこう。"]],
  r:[["Can we just walk in?", 1],["Can we see the special exhibit for free too?", 3],["This backpack is so heavy.", 2]],
  c:{sit:"美術館の前で友人と合流し、入口へ向かう",t:[["Why are there so many people today?", 0],["I want a souvenir before we go.", 5],["It feels wrong to see all this for nothing.", 7]]}},
 {t:"第六百四十三歩 ごみ分別ルールが変わる",d:"町のごみ分別ルールが変わると知り、ルームメイトと確認し合う",p:[
  ["p5137", "The recycling rules change next month.", "来月から、ごみ分別のルールが変わるよ。"],["p5138", "Plastics go in a separate bag now.", "プラスチックは別の袋に入れるんだって。"],["p5139", "Rinse the containers before tossing them.", "容器は捨てる前にすすいでね。"],["p5140", "Pickup day moves to Thursday.", "回収日は木曜日に変わるよ。"],["p5141", "Flatten the cardboard boxes, please.", "段ボールはつぶしてね。"],["p5142", "There's a chart on the fridge.", "冷蔵庫に表を貼ってあるよ。"],["p5143", "Batteries need to go to the drop-off box.", "電池は回収ボックスに持っていかないと。"],["p5144", "It's confusing, but we'll get used to it.", "ややこしいけど、そのうち慣れるよ。"]],
  r:[["When do we put the bags out now?", 3],["This yogurt cup is still sticky.", 2],["Where do these old batteries go?", 6]],
  c:{sit:"台所でごみをまとめながら、ルームメイトと話す",t:[["These boxes take up the whole bin.", 4],["Where do these snack wrappers go now?", 1],["Wait, why do we have to sort things differently?", 0]]}},
 {t:"第六百四十四歩 夏の節電要請",d:"電力会社から節電の呼びかけが出た夏の夕方、家族で工夫を話し合う",p:[
  ["p5145", "They're asking everyone to save power tonight.", "今夜はみんなに節電を呼びかけてるよ。"],["p5146", "Let's set the AC to twenty-eight.", "エアコンは二十八度にしよう。"],["p5147", "We can run the dishwasher later tonight.", "食洗機は夜遅くに回せばいいよ。"],["p5148", "Unplug anything you're not using.", "使っていないものはコンセントを抜いてね。"],["p5149", "Let's eat dinner in one room.", "夕飯はひと部屋に集まって食べよう。"],["p5150", "A fan uses way less electricity.", "扇風機のほうがずっと電気を使わないよ。"],["p5151", "Close the curtains to block the sun.", "カーテンを閉めて日差しをさえぎろう。"],["p5152", "Let's turn off the lights we don't need.", "いらない電気は消そう。"]],
  r:[["What temperature should we set it to?", 1],["The sun is blazing through the window.", 6],["When should I start the dishes?", 2]],
  c:{sit:"夕方のリビングで、家族とニュースを見ながら話す",t:[["The TV and game console are on, but nobody's using them.", 3],["Everyone's in a different room with the AC on.", 4],["Why's the news talking about electricity?", 0]]}},
 {t:"第六百四十五歩 マラソン大会の交通規制",d:"町のマラソン大会で道路が通行止めになる日曜日、友人と予定を調整する",p:[
  ["p5153", "Roads are closed for the marathon Sunday.", "日曜はマラソン大会で道路が通行止めだよ。"],["p5154", "Buses are running on a different route.", "バスは別のルートで運行してるよ。"],["p5155", "Let's take the subway instead.", "代わりに地下鉄で行こう。"],["p5156", "We can't cross until the runners pass.", "ランナーが通り過ぎるまで渡れないね。"],["p5157", "Let's cheer from the corner by the café.", "カフェの角で応援しよう。"],["p5158", "My cousin is running in it.", "いとこが出場するんだ。"],["p5159", "The closures end around noon.", "通行止めは昼ごろに解除されるよ。"],["p5160", "Let's push brunch back an hour.", "ブランチを一時間遅らせよう。"]],
  r:[["How will we get downtown, then?", 2],["When do they reopen the streets?", 6],["Why are you so excited about the race?", 5]],
  c:{sit:"日曜の朝、通行止めの交差点で友人と話す",t:[["Our brunch is at ten. We'll never make it.", 7],["Where's a good spot to watch?", 4],["The officer says we have to wait.", 3]]}},
 {t:"第六百四十六歩 看護師の一日を話す",d:"友人に看護師の仕事について聞かれ、一日の流れややりがいを話す",p:[
  ["p5161", "I work twelve-hour shifts at a hospital.", "病院で十二時間勤務のシフトで働いてるの。"],["p5162", "The day starts with a handover meeting.", "一日は申し送りから始まるの。"],["p5163", "I check on every patient each hour.", "一時間ごとに患者さん全員の様子を見に行くの。"],["p5164", "Seeing patients go home makes it worthwhile.", "患者さんが退院していく姿を見ると報われるの。"],["p5165", "Night shifts still mess with my sleep.", "夜勤のせいで、いまだに睡眠リズムが狂うの。"],["p5166", "A patient once proposed to me.", "患者さんにプロポーズされたことがあるの。"],["p5167", "Comfortable shoes are your best investment.", "履きやすい靴がいちばんの投資よ。"],["p5168", "Never be afraid to ask questions.", "質問するのを怖がらないでね。"]],
  r:[["What's the first thing you do at work?", 1],["What keeps you going in such a tough job?", 3],["My feet are killing me after one day of training.", 6]],
  c:{sit:"夜勤明けの友人とカフェで向かい合って話す",t:[["How long is a typical shift for you?", 0],["You look exhausted. Rough week of nights?", 4],["Has a patient ever caught you off guard?", 5]]}},
 {t:"第六百四十七歩 小学校の先生という仕事",d:"小学校で担任をしている人が、友人に仕事の様子を話す",p:[
  ["p5169", "I teach third grade at a public school.", "公立の小学校で三年生を教えてるよ。"],["p5170", "My mornings start before the kids arrive.", "朝は子どもたちが来る前から始まるんだ。"],["p5171", "Grading eats up most of my evenings.", "採点で夜のほとんどがつぶれるよ。"],["p5172", "I love it when something finally clicks.", "何かがやっと理解できた瞬間が大好きなんだ。"],["p5173", "Parent meetings can be pretty draining.", "保護者面談はかなり消耗することもある。"],["p5174", "A student once called me Mom by accident.", "生徒にうっかり「お母さん」って呼ばれたことがあるよ。"],["p5175", "Keep your sense of humor, no matter what.", "何があってもユーモアを忘れないで。"],["p5176", "Every class has its own personality.", "クラスにはそれぞれ個性があるんだ。"]],
  r:[["What's the best part of teaching?", 3],["What do you usually do after the kids go home?", 2],["Any advice for a first-year teacher?", 6]],
  c:{sit:"週末のバーベキューで、教師の友人に仕事のことを聞く",t:[["Which grade are you teaching this year?", 0],["Do kids ever slip up and say something funny?", 5],["How does this year's class compare to last year's?", 7]]}},
 {t:"第六百四十八歩 エンジニアの仕事を説明する",d:"ソフトウェアエンジニアが、技術に詳しくない友人に自分の仕事を説明する",p:[
  ["p5177", "I build apps for online banking.", "ネットバンキングのアプリを作ってるんだ。"],["p5178", "Most of my day is reading other people's code.", "一日のほとんどは他人の書いたコードを読んでるよ。"],["p5179", "We have a quick stand-up every morning.", "毎朝、立ったまま短い朝会をするんだ。"],["p5180", "Fixing a stubborn bug feels amazing.", "しつこいバグを直せたときは最高の気分だよ。"],["p5181", "Deadlines can get really intense.", "締め切り前は本当にきつくなることがある。"],["p5182", "I once crashed the site on my first day.", "初日にサイトを落としたことがあるんだ。"],["p5183", "Don't be shy about asking for code reviews.", "コードレビューを頼むのを遠慮しないで。"],["p5184", "It's more teamwork than people think.", "みんなが思うよりチームワークの仕事なんだ。"]],
  r:[["What kind of software do you work on?", 0],["What's the most satisfying moment for you?", 3],["Any advice for someone starting out as a developer?", 6]],
  c:{sit:"親戚の集まりで、エンジニアのいとこに仕事を聞く",t:[["Do you have regular meetings with your team?", 2],["How's the pressure at your job lately?", 4],["I thought programmers mostly work alone.", 7]]}},
 {t:"第六百四十九歩 デザイナーの仕事場から",d:"グラフィックデザイナーが、友人に仕事の中身や苦労を話す",p:[
  ["p5185", "I design logos and packaging for brands.", "ブランドのロゴやパッケージをデザインしてるの。"],["p5186", "I usually start with rough sketches on paper.", "たいていは紙のラフスケッチから始めるよ。"],["p5187", "Clients often change their minds last minute.", "クライアントはよく土壇場で気が変わるの。"],["p5188", "Seeing my work on store shelves is a thrill.", "自分の作品が店頭に並ぶのを見るとワクワクする。"],["p5189", "One client just asked me to make it pop.", "「もっと目立たせて」とだけ言われたことがあるの。"],["p5190", "Build a portfolio that shows your process.", "制作過程がわかるポートフォリオを作ってね。"],["p5191", "Good design is mostly about listening.", "良いデザインは、ほとんど人の話を聞くことなの。"],["p5192", "I keep every rejected draft, just in case.", "ボツ案も念のため全部取っておくの。"]],
  r:[["How do you begin a new project?", 1],["What's the hardest part of working with clients?", 2],["I want to apply to design agencies next year.", 5]],
  c:{sit:"デザイナーの友人の仕事部屋を訪ね、壁に貼られた作品を眺める",t:[["So what exactly do you design?", 0],["Ever get really vague feedback from a client?", 4],["What happens to the drafts that don't get picked?", 7]]}},
 {t:"第六百五十歩 営業職のリアルを語る",d:"営業の仕事をしている人が、友人に毎日の様子を話す",p:[
  ["p5193", "I sell office equipment to small businesses.", "中小企業に事務機器を売ってるんだ。"],["p5194", "I spend half my day on the road.", "一日の半分は外回りだよ。"],["p5195", "Closing a big deal is a real rush.", "大きな契約が決まると本当に興奮する。"],["p5196", "Hearing no all day wears you down.", "一日中断られ続けると心が削られるよ。"],["p5197", "I once pitched to the wrong company.", "間違えて別の会社に売り込んだことがあるんだ。"],["p5198", "Listen more than you talk.", "話すより聞くことだよ。"],["p5199", "My targets reset every single month.", "目標は毎月リセットされるんだ。"],["p5200", "Relationships matter more than the product.", "商品より人間関係のほうが大事なんだ。"]],
  r:[["What do you actually sell?", 0],["What's the toughest part of sales?", 3],["I have my first sales meeting tomorrow. Any tips?", 5]],
  c:{sit:"仕事帰りの居酒屋で、営業職の友人と話す",t:[["Do you get to sit at a desk much?", 1],["Ever make an embarrassing mistake with a client?", 4],["So customers buy from people they like?", 7]]}},
 {t:"第六百五十一歩 シェフとして厨房に立つ",d:"レストランのシェフが、友人に厨房の仕事を話す",p:[
  ["p5201", "I run the kitchen at an Italian place.", "イタリアンの店で厨房を仕切ってるんだ。"],["p5202", "Prep starts hours before we open.", "開店の何時間も前から仕込みが始まるよ。"],["p5203", "Friday nights are pure chaos back there.", "金曜の夜の厨房はまさに戦場だよ。"],["p5204", "An empty plate is the best compliment.", "空っぽのお皿が最高の褒め言葉なんだ。"],["p5205", "I once dropped a whole tray of desserts.", "デザートのトレーを丸ごと落としたことがある。"],["p5206", "Keep your station clean at all times.", "持ち場は常にきれいにしておくこと。"],["p5207", "I hardly ever cook at home.", "家ではほとんど料理しないんだ。"],["p5208", "Burns and cuts come with the job.", "やけどや切り傷は仕事につきものだよ。"]],
  r:[["When does your workday actually begin?", 1],["What makes you happiest as a chef?", 3],["You must make amazing dinners for your family.", 6]],
  c:{sit:"シェフの友人の休日に、一緒にランチをしながら話す",t:[["What kind of restaurant do you work at?", 0],["So when is the kitchen at its busiest?", 2],["What happened to your hand there?", 7]]}},
 {t:"第六百五十二歩 農家の一年を話す",d:"野菜農家を営む人が、都会に住む友人に仕事の話をする",p:[
  ["p5209", "We grow tomatoes and leafy greens.", "うちはトマトと葉物野菜を育ててるよ。"],["p5210", "I'm up before sunrise most days.", "たいてい日の出前に起きるんだ。"],["p5211", "The weather decides everything for us.", "天気がすべてを決めるんだ。"],["p5212", "Nothing beats eating what you grew yourself.", "自分で育てたものを食べるのが一番だよ。"],["p5213", "A goat once ate my lunch.", "ヤギにお昼ごはんを食べられたことがある。"],["p5214", "Start small and learn the soil first.", "小さく始めて、まず土を知ること。"],["p5215", "Harvest season means no days off.", "収穫期は休みなしだよ。"],["p5216", "We sell most of it at local markets.", "ほとんど地元の市場で売ってるんだ。"]],
  r:[["What time do you usually get up?", 1],["What worries you most as a farmer?", 2],["I'm thinking of starting a small vegetable plot.", 5]],
  c:{sit:"農家の友人が町に出てきた日に、喫茶店で話す",t:[["What crops do you have on the farm?", 0],["Can you get away for a trip in the autumn?", 6],["Where can I buy your vegetables?", 7]]}},
 {t:"第六百五十三歩 会計士の地道な日々",d:"会計士として働く人が、友人に仕事内容と繁忙期について話す",p:[
  ["p5217", "I help companies keep their books in order.", "会社の帳簿をきちんと整える手伝いをしてるの。"],["p5218", "Tax season is my busiest time of year.", "税務申告の時期が一年で一番忙しいの。"],["p5219", "Most of my day is spreadsheets and email.", "一日のほとんどは表計算とメールなの。"],["p5220", "I love it when everything finally balances.", "全部の数字がぴったり合うと最高なの。"],["p5221", "People think it's boring, but it isn't.", "退屈だと思われがちだけど、そんなことないよ。"],["p5222", "A client once tried to pay me in jam.", "ジャムで支払おうとしたお客さんがいたの。"],["p5223", "Double-check everything, then check again.", "全部見直して、さらにもう一回確認してね。"],["p5224", "Small mistakes can cause big problems.", "小さなミスが大問題につながるの。"]],
  r:[["When do you work the longest hours?", 1],["What's the most satisfying moment at work?", 3],["Accounting sounds pretty dull to me.", 4]],
  c:{sit:"会計士の友人と久しぶりにランチをしながら話す",t:[["What does an accountant actually do all day?", 0],["What habit should a beginner build first?", 6],["Ever had a strange payment from a client?", 5]]}},
 {t:"第六百五十四歩 バリスタの朝は早い",d:"カフェでバリスタとして働く人が、友人に仕事の裏側を話す",p:[
  ["p5225", "I open the café at six every morning.", "毎朝六時にカフェを開けてるの。"],["p5226", "The morning rush is nonstop for hours.", "朝のラッシュは何時間もひっきりなしなの。"],["p5227", "I know most regulars by their orders.", "常連さんはほとんど注文で覚えてるよ。"],["p5228", "Latte art took me months to learn.", "ラテアートは習得に何か月もかかったの。"],["p5229", "Someone once ordered a coffee without coffee.", "コーヒー抜きのコーヒーを注文した人がいたの。"],["p5230", "Learn to stay calm when the line grows.", "行列が伸びても落ち着いていられるようにね。"],["p5231", "I go home smelling like espresso.", "家に帰るとエスプレッソの匂いがするの。"],["p5232", "My wrists ache after a long shift.", "長いシフトのあとは手首が痛むの。"]],
  r:[["Do you remember your customers?", 2],["How long did it take you to learn those foam hearts?", 3],["What's the weirdest order you've ever gotten?", 4]],
  c:{sit:"バリスタの友人と仕事終わりに公園を散歩しながら話す",t:[["What time does your shift start?", 0],["You smell amazing, by the way.", 6],["Why do you keep rubbing your wrists?", 7]]}},
 {t:"第六百五十五歩 美容師として働く",d:"美容師として働く人が、友人に仕事の楽しさと苦労を話す",p:[
  ["p5233", "I cut and color hair at a salon.", "サロンでカットとカラーをしてるの。"],["p5234", "I'm on my feet all day long.", "一日中立ちっぱなしなの。"],["p5235", "Clients tell me all their secrets.", "お客さんはいろんな秘密を話してくれるの。"],["p5236", "A great transformation makes my whole week.", "見違えるような変身が決まると一週間ずっと幸せ。"],["p5237", "A client once asked for a mysterious look.", "「謎めいた感じにして」と頼まれたことがあるの。"],["p5238", "Practice on mannequins as much as you can.", "マネキンでできるだけ練習してね。"],["p5239", "Every head of hair is different.", "髪は一人ひとり違うの。"],["p5240", "New assistants mostly sweep and shampoo.", "アシスタントは最初ほとんど掃除とシャンプーなの。"]],
  r:[["Doesn't your back hurt after work?", 1],["Do people chat with you while you work?", 2],["What's the strangest request you've had?", 4]],
  c:{sit:"美容師の友人と休日にお茶をしながら話す",t:[["What do you do at the salon, exactly?", 0],["How can a trainee improve faster?", 5],["What did you do in your first year there?", 7]]}},
 {t:"第六百五十六歩 翻訳の仕事の奥深さ",d:"翻訳者として働く人が、友人に仕事の難しさと面白さを話す",p:[
  ["p5241", "I translate games from Japanese into English.", "ゲームを日本語から英語に翻訳してるの。"],["p5242", "I work from home with endless cups of tea.", "家で紅茶を何杯も飲みながら仕事してるの。"],["p5243", "Jokes and puns are the hardest part.", "冗談やダジャレが一番難しいの。"],["p5244", "Finding the perfect word feels like magic.", "ぴったりの言葉が見つかると魔法みたいな気分。"],["p5245", "Machine translation hasn't replaced us yet.", "機械翻訳はまだ私たちに取って代わってないよ。"],["p5246", "Read widely in both languages every day.", "毎日、両方の言語で幅広く読んでね。"],["p5247", "I once translated a dragon as a duck.", "ドラゴンをアヒルと訳してしまったことがあるの。"],["p5248", "Translation is really about culture, not words.", "翻訳は言葉というより文化の問題なの。"]],
  r:[["What kind of things do you translate?", 0],["Which part gives you the most trouble?", 2],["Doesn't AI threaten your job these days?", 4]],
  c:{sit:"翻訳者の友人の家に遊びに行き、仕事机を見ながら話す",t:[["Where do you usually do your work?", 1],["How do I get better at translating?", 5],["So it's not just swapping one word for another?", 7]]}},
 {t:"第六百五十七歩 配達ドライバーの一日",d:"宅配ドライバーとして働く人が、友人に一日の流れを話す",p:[
  ["p5249", "I deliver packages around the east side.", "東側のエリアで荷物を配達してるんだ。"],["p5250", "I load the van before dawn.", "夜明け前にバンに荷物を積むんだ。"],["p5251", "Apartments without elevators are the worst.", "エレベーターのない集合住宅が一番きついよ。"],["p5252", "Dogs are either my fans or my enemies.", "犬は僕のファンか敵かのどっちかなんだ。"],["p5253", "Kids wave at me from their windows.", "子どもたちが窓から手を振ってくれるんだ。"],["p5254", "Plan your route before you start the engine.", "エンジンをかける前にルートを決めておいて。"],["p5255", "Half the time nobody answers the door.", "半分くらいは誰も出てこないんだよ。"],["p5256", "A parrot once said hello through the door.", "ドア越しにオウムに「ハロー」と言われたことがある。"]],
  r:[["What's the hardest kind of building to deliver to?", 2],["What makes your day a little brighter?", 4],["Any advice before my first day driving?", 5]],
  c:{sit:"配達ドライバーの友人と休みの日にラーメンを食べながら話す",t:[["How early does your day start?", 1],["Do you get a lot of missed deliveries?", 6],["Do pets on your route give you trouble?", 3]]}},
 {t:"第六百五十八歩 小さな店を営むということ",d:"小さな文房具店を営む人が、友人に個人経営の苦労と喜びを話す",p:[
  ["p5257", "I run a little stationery shop downtown.", "中心街で小さな文房具店をやってるの。"],["p5258", "I do everything from ordering to cleaning.", "発注から掃除まで全部自分でやるの。"],["p5259", "Online stores make it tough to compete.", "ネットショップがあるから競争が厳しいの。"],["p5260", "Regulars stopping by to chat makes my day.", "常連さんがおしゃべりに寄ってくれると嬉しいの。"],["p5261", "Taking a vacation feels almost impossible.", "休暇を取るのはほぼ無理な気がする。"],["p5262", "A cat wandered in and stayed a week.", "猫が迷い込んできて一週間居ついたの。"],["p5263", "Know the neighborhood before choosing a location.", "場所を決める前にその地域をよく知ってね。"],["p5264", "Every decision is mine to make.", "どんな決定も自分で下すの。"]],
  r:[["Do you have any staff to help you?", 1],["When did you last take a trip?", 4],["I'm looking at empty shops for my own café.", 6]],
  c:{sit:"友人の文房具店に立ち寄り、レジ越しに話す",t:[["What kind of shop is it, exactly?", 0],["Is it hard competing with big online sellers?", 2],["Has any unusual visitor ever come in?", 5]]}},
 {t:"第六百五十九歩 研究者の地道な実験",d:"研究所で働く研究者が、友人に研究生活を話す",p:[
  ["p5265", "I study how plants respond to drought.", "植物が干ばつにどう反応するかを研究してるの。"],["p5266", "Most experiments fail before one works.", "一つうまくいくまでに、ほとんどの実験は失敗するの。"],["p5267", "I spend hours just preparing samples.", "サンプルの準備だけで何時間もかかるの。"],["p5268", "A surprising result makes it all worth it.", "意外な結果が出ると、苦労が全部報われるの。"],["p5269", "Funding is a constant worry for us.", "研究資金はいつも心配の種なの。"],["p5270", "I once labeled every tube with the wrong date.", "試験管に全部間違った日付を書いたことがあるの。"],["p5271", "Write down everything, even the failures.", "失敗も含めて全部記録してね。"],["p5272", "Science moves much slower than people think.", "科学はみんなが思うよりずっとゆっくり進むの。"]],
  r:[["What's your research about?", 0],["What keeps you motivated in the lab?", 3],["What do you worry about most?", 4]],
  c:{sit:"研究者の友人と週末にハイキングしながら話す",t:[["How often do your experiments go wrong?", 1],["Should I keep notes on the tests that fail?", 6],["When will we see your discovery in the news?", 7]]}},
 {t:"第六百六十歩 市役所の窓口で働く",d:"市役所の窓口で働く人が、友人に仕事の内容を話す",p:[
  ["p5273", "I work at the front desk at city hall.", "市役所の窓口で働いてるの。"],["p5274", "I help people with moving-in paperwork.", "転入の手続きを手伝ってるの。"],["p5275", "Mondays after holidays are always packed.", "連休明けの月曜はいつも混むの。"],["p5276", "Some people arrive already frustrated.", "最初からイライラして来る人もいるの。"],["p5277", "A thank-you note from a resident made my year.", "住民の方からのお礼の手紙が今年一番嬉しかった。"],["p5278", "Someone once tried to register their dog's birthday.", "犬の誕生日を登録しようとした人がいたの。"],["p5279", "Explain things simply and with patience.", "物事は簡単に、根気強く説明してね。"],["p5280", "Rules change often, so I keep studying.", "制度がよく変わるから勉強し続けてるの。"]],
  r:[["What do residents usually come in for?", 1],["When is the counter at its busiest?", 2],["Ever had a request that made you laugh?", 5]],
  c:{sit:"市役所勤めの友人と昼休みにベンチで話す",t:[["Where do you work again?", 0],["Do you ever deal with angry visitors?", 3],["Do you have to keep up with new rules?", 7]]}},
 {t:"第六百六十一歩 フリーのイラストレーター",d:"フリーランスのイラストレーターが、友人に自分の働き方を話す",p:[
  ["p5281", "I draw book covers and character art.", "本の表紙やキャラクターのイラストを描いてるの。"],["p5282", "I set my own hours, which is dangerous.", "自分で時間を決められるのが危険なの。"],["p5283", "Some months are busy, others are dead quiet.", "忙しい月もあれば、全然仕事がない月もあるの。"],["p5284", "Seeing fans draw my characters is incredible.", "ファンが私のキャラを描いてくれるのは感動的。"],["p5285", "Chasing late payments is the worst part.", "遅れた支払いの催促が一番いやなの。"],["p5286", "I once sent my grocery list to a client.", "クライアントに買い物リストをメールしたことがあるの。"],["p5287", "Post your work online every week.", "毎週ネットに作品を載せてね。"],["p5288", "My cat walks across my tablet constantly.", "猫がしょっちゅうタブレットの上を歩くの。"]],
  r:[["How do you manage your schedule?", 1],["How steady is your income?", 2],["How can I get people to notice my drawings?", 6]],
  c:{sit:"イラストレーターの友人の作業部屋で、お茶を飲みながら話す",t:[["What kind of illustrations do you do?", 0],["What's the most annoying part of freelancing?", 4],["Ever sent a client something embarrassing?", 5]]}},
 {t:"第六百六十二歩 ホテルのコンシェルジュの仕事",d:"ホテルのコンシェルジュが、友人に仕事の裏話をする",p:[
  ["p5289", "I help hotel guests with almost anything.", "ホテルのお客様のほぼあらゆる要望に応えるの。"],["p5290", "Restaurant bookings are most of my day.", "レストランの予約が一日の大半なの。"],["p5291", "I keep a notebook of hidden local spots.", "地元の穴場をノートにまとめてるの。"],["p5292", "Making someone's trip special is so rewarding.", "誰かの旅を特別にできるのはすごくやりがいがあるの。"],["p5293", "Last-minute requests keep me on my toes.", "直前の依頼が多くて気が抜けないの。"],["p5294", "A guest once begged me for snow in summer.", "夏に雪を用意してとせがまれたことがあるの。"],["p5295", "Know your city better than any guidebook.", "どのガイドブックよりも街に詳しくなってね。"],["p5296", "I try never to say no to a guest.", "お客様にノーとは言わないようにしてるの。"]],
  r:[["What do guests ask you for most?", 1],["How do you find places tourists don't know about?", 2],["What's the craziest request you've gotten?", 5]],
  c:{sit:"コンシェルジュの友人と仕事帰りにバーで話す",t:[["What does a concierge actually do?", 0],["Does anything stress you out at work?", 4],["How should I prepare for a concierge job?", 6]]}},
 {t:"第六百六十三歩 保育士として子どもと過ごす",d:"保育園で働く保育士が、友人に毎日の様子を話す",p:[
  ["p5297", "I look after toddlers at a daycare.", "保育園で小さな子どもたちのお世話をしてるの。"],["p5298", "Nap time is my only quiet moment.", "お昼寝の時間だけが唯一静かな時間なの。"],["p5299", "I sing the same songs all day.", "一日中同じ歌を歌ってるの。"],["p5300", "Their first words always melt my heart.", "子どもが初めて話す言葉にはいつも胸がきゅんとするの。"],["p5301", "Talking with worried parents takes real care.", "心配している親御さんとの話は本当に気を遣うの。"],["p5302", "A toddler once painted my shoes blue.", "子どもに靴を青く塗られたことがあるの。"],["p5303", "Wear clothes you don't mind ruining.", "汚れてもいい服を着てきてね。"],["p5304", "Keeping up with them is a real workout.", "子どもたちについていくのは本当にいい運動なの。"]],
  r:[["When do you get a break?", 1],["What's the sweetest part of the job?", 3],["What should I wear on my first day at the nursery?", 6]],
  c:{sit:"保育士の友人と夕方のカフェで話す",t:[["What age are the kids you look after?", 0],["Why are your shoes blue?", 5],["With a job like that, who needs a gym?", 7]]}},
 {t:"第六百六十四歩 車掌の目から見た鉄道",d:"電車の車掌として働く人が、友人に仕事の内容を話す",p:[
  ["p5305", "I'm a conductor on the local line.", "普通列車の車掌をしてるんだ。"],["p5306", "I make announcements and check the doors.", "アナウンスとドアの確認をするんだ。"],["p5307", "Punctuality is everything in this job.", "この仕事では時間厳守がすべてなんだ。"],["p5308", "I love watching the seasons change outside.", "窓の外で季節が移り変わるのを見るのが好きなんだ。"],["p5309", "Early shifts mean waking up at four.", "早番の日は四時起きなんだ。"],["p5310", "A dog once rode the train alone.", "犬が一匹で電車に乗っていたことがあるよ。"],["p5311", "Stay calm and speak clearly during delays.", "遅延のときは落ち着いて、はっきり話すこと。"],["p5312", "Lost umbrellas pile up every rainy day.", "雨の日は忘れ物の傘が山積みになるんだ。"]],
  r:[["What do you actually do on the train?", 1],["What's your favorite part of the ride?", 3],["How early do you have to get up?", 4]],
  c:{sit:"車掌の友人と非番の日に駅前で話す",t:[["How strict are they about being on time?", 2],["How do you handle passengers when the train is late?", 6],["What do people leave behind most?", 7]]}},
 {t:"第六百六十五歩 介護の仕事のやりがい",d:"高齢者施設で介護職として働く人が、友人に仕事について話す",p:[
  ["p5313", "I work at a care home for seniors.", "高齢者の介護施設で働いてるの。"],["p5314", "I help residents with meals and bathing.", "入居者さんの食事や入浴のお手伝いをしてるの。"],["p5315", "Lifting people safely takes real technique.", "人を安全に抱え上げるにはちゃんとした技術がいるの。"],["p5316", "Their stories from the old days are amazing.", "みなさんの昔話がすごく面白いの。"],["p5317", "Saying goodbye to residents never gets easier.", "入居者さんとのお別れは何度経験してもつらいの。"],["p5318", "One resident beats me at chess every day.", "毎日チェスで私を負かす入居者さんがいるの。"],["p5319", "Learn each person's name and routine first.", "まず一人ひとりの名前と習慣を覚えてね。"],["p5320", "A simple smile can change someone's day.", "ちょっとした笑顔が誰かの一日を変えるの。"]],
  r:[["What kind of help do residents need?", 1],["Do you ever play games with them?", 5],["Where should I start during my first week there?", 6]],
  c:{sit:"介護職の友人と仕事終わりに夕食をとりながら話す",t:[["How do you avoid hurting your back?", 2],["What do you talk about with the residents?", 3],["What's the hardest part, emotionally?", 4]]}},
 {t:"第六百六十六歩 銭湯の作法を教える",d:"銭湯に行ったことがない友人に、入り方とマナーを教える",p:[
  ["p5321", "You pay at the front desk first.", "先にフロントで料金を払うんだよ。"],["p5322", "Wash yourself thoroughly before getting in.", "湯船に入る前に体をしっかり洗ってね。"],["p5323", "Keep your towel out of the water.", "タオルはお湯につけないでね。"],["p5324", "Tie your hair up if it's long.", "髪が長いなら結んでおいてね。"],["p5325", "Dry off before going back to the lockers.", "ロッカーに戻る前に体をふいてね。"],["p5326", "Lots of sento are fine with tattoos.", "タトゥーがあっても気にしない銭湯は多いよ。"],["p5327", "You can rent a towel if you forget.", "忘れてもタオルは借りられるよ。"],["p5328", "A cold milk afterward is the tradition.", "上がったあとの冷たい牛乳がお決まりなんだ。"]],
  r:[["What do I do before I get in the bath?", 1],["I've got a small tattoo. Will that be a problem?", 5],["Anything special to do once we're done?", 7]],
  c:{sit:"銭湯の入り口で、緊張している友人に声をかける",t:[["Where do we pay for this?", 0],["Can I just bring my towel into the tub?", 2],["My hair goes past my shoulders. Any rule about that?", 3]]}},
 {t:"第六百六十七歩 コンビニの便利なサービス",d:"コンビニでできることに驚く友人に、使えるサービスを説明する",p:[
  ["p5329", "You can pay your utility bills here.", "ここで公共料金も払えるよ。"],["p5330", "Just hand over the slip with the barcode.", "バーコード付きの用紙を渡すだけだよ。"],["p5331", "Online orders can be picked up here.", "ネットで注文したものをここで受け取れるよ。"],["p5332", "They'll ship your parcel anywhere in Japan.", "日本中どこにでも荷物を送ってくれるよ。"],["p5333", "The copier prints documents straight from your phone.", "コピー機でスマホから直接書類を印刷できるよ。"],["p5334", "You can print concert tickets at that machine.", "あの端末でコンサートのチケットを発券できるよ。"],["p5335", "The ATM works with most foreign cards.", "ATMはたいていの海外カードが使えるよ。"],["p5336", "Honestly, my life runs on this place.", "正直、私の生活はここで回ってるの。"]],
  r:[["My electricity bill came. Where do I even pay it?", 0],["I'm never home when deliveries come.", 2],["I need to print my boarding pass but have no printer.", 4]],
  c:{sit:"引っ越してきたばかりの友人と、近所のコンビニに入る",t:[["I've got this payment slip. What do I do with it?", 1],["I need to send a birthday gift to Osaka.", 3],["Where can I get cash with my card from home?", 6]]}},
 {t:"第六百六十八歩 電車の遅延情報を読み解く",d:"駅の掲示板の運行情報が読めない友人に、遅延の案内を説明する",p:[
  ["p5337", "The board says trains are running late.", "掲示板に電車が遅れてるって出てるよ。"],["p5338", "It's about fifteen minutes behind schedule.", "予定より十五分くらい遅れてる。"],["p5339", "Service is suspended due to signal trouble.", "信号トラブルで運転見合わせだって。"],["p5340", "Other lines will accept our tickets today.", "今日は他の路線でも今の切符が使えるよ。"],["p5341", "You can get a delay certificate at the gate.", "改札で遅延証明書がもらえるよ。"],["p5342", "Show it to your boss if you're late.", "遅刻したら上司にそれを見せればいいよ。"],["p5343", "The app updates faster than the board.", "掲示板よりアプリのほうが更新が早いよ。"],["p5344", "Here, a few minutes counts as a delay.", "日本では数分でも遅れのうちなんだ。"]],
  r:[["What does that red message on the screen mean?", 2],["I'm going to be late for work. Will I get in trouble?", 4],["The announcement said 'delay,' but it's only been two minutes.", 7]],
  c:{sit:"朝の通勤ラッシュの駅で、止まった電車を前に友人と立ち往生する",t:[["How late is our train going to be?", 1],["So how do we get there if this line is stopped?", 3],["Where's the quickest place to check for updates?", 6]]}},
 {t:"第六百六十九歩 職場に配るおみやげ",d:"旅行帰りの同僚が箱菓子を配る理由を、海外出身の友人に説明する",p:[
  ["p5345", "We call these gifts omiyage.", "こういう贈り物を「おみやげ」って言うの。"],["p5346", "We hand them out to the whole office.", "職場のみんなに配るんだ。"],["p5347", "Individually wrapped sweets are the safest choice.", "個包装のお菓子がいちばん無難だよ。"],["p5348", "It's a way of saying thanks for covering.", "休みの間カバーしてくれたお礼の意味もあるんだ。"],["p5349", "Local specialties make the best omiyage.", "その土地の名物が一番のおみやげだよ。"],["p5350", "Airport shops are full of last-minute options.", "空港の売店は駆け込みで買える品でいっぱいだよ。"],["p5351", "Just leave one on each person's desk.", "一人ずつの机に置いておけばいいよ。"],["p5352", "Nobody expects anything fancy or expensive.", "高価なものは誰も期待してないよ。"]],
  r:[["Why did everyone come back from vacation with snacks?", 3],["What kind of thing should I buy for my coworkers?", 2],["I'm worried my gift looks too cheap.", 7]],
  c:{sit:"出張先の空港で、職場へのおみやげを一緒に選ぶ",t:[["So what exactly counts as omiyage?", 0],["Should I buy something famous from this area?", 4],["Half the team is out today. How do I give these out?", 6]]}},
 {t:"第六百七十歩 駅弁の楽しみ方",d:"新幹線に乗る前に、友人に駅弁の楽しみ方を説明する",p:[
  ["p5353", "Ekiben are boxed lunches sold at stations.", "駅弁は駅で売られてるお弁当なの。"],["p5354", "Each region has its own famous ekiben.", "地域ごとに名物の駅弁があるんだ。"],["p5355", "Eating on the bullet train is totally fine.", "新幹線の中で食べるのはまったく問題ないよ。"],["p5356", "Avoid eating on crowded local trains, though.", "でも混んでる普通列車では食べないほうがいいよ。"],["p5357", "Some even come in little ceramic pots.", "小さな陶器の器に入ってるものまであるんだ。"],["p5358", "The box itself is part of the fun.", "容器そのものも楽しみのひとつなんだ。"],["p5359", "Department stores hold huge ekiben fairs.", "デパートで大規模な駅弁フェアをやるんだ。"],["p5360", "Let's buy our lunches before the platform gets crowded.", "ホームが混む前に買っておこう。"]],
  r:[["Can I actually eat this on the train?", 2],["What's so special about the one from this station?", 1],["Can I find these outside of train stations?", 6]],
  c:{sit:"駅の売店で、ずらりと並んだ駅弁を前に迷う",t:[["What is everyone buying at that counter?", 0],["Can I eat mine on the packed commuter train home too?", 3],["I love the shapes of these containers.", 5]]}},
 {t:"第六百七十一歩 屋台のメニューを説明する",d:"夏祭りの屋台を歩きながら、友人に食べ物や遊びを説明する",p:[
