  c:{sit:"駅でむかしの同級生と会う",t:[["Oh my gosh, is that you?", 0],["I'm good! How about you?", 2],["Wow, so much has changed!", 6]]}},
 {t:"第百九十八歩 スピーチ",d:"乾杯とお祝いのスピーチ",p:[
  ["p1577", "Could I have everyone's attention?", "みなさん、ちょっとよろしいですか？"],["p1578", "I'd like to say a few words.", "ひと言ごあいさつさせてください。"],["p1579", "I've known them for ten years.", "二人とは十年来のつきあいです。"],["p1580", "They're perfect for each other.", "二人はぴったりのお似合いです。"],["p1581", "Thank you all for coming tonight.", "今夜はお集まりいただきありがとうございます。"],["p1582", "Please raise your glasses.", "グラスをお持ちください。"],["p1583", "To the happy couple!", "幸せな二人に乾杯！"],["p1584", "Cheers, everyone!", "みなさん、乾杯！"]],
  r:[["You're the best man. Will you give a speech?", 1],["How do you know the bride and groom?", 2],["Everyone has a glass now.", 5]],
  c:{sit:"友人の結婚式でスピーチをする",t:[["And now, a few words from the groom's best friend.", 0],["We're all listening. What do you think of the couple?", 3],["What a lovely speech!", 5]]}},
 {t:"第百九十九歩 誤解",d:"誤解をとく",p:[
  ["p1585", "I think there's been a misunderstanding.", "誤解があったようです。"],["p1586", "That's not what I meant.", "そういう意味ではありませんでした。"],["p1587", "Let me explain.", "説明させてください。"],["p1588", "I didn't mean to upset you.", "気を悪くさせるつもりはありませんでした。"],["p1589", "I was only trying to help.", "ただ手伝おうとしただけなんです。"],["p1590", "I can see why you were confused.", "混乱したのも無理はありません。"],["p1591", "Thanks for telling me how you feel.", "気持ちを話してくれてありがとう。"],["p1592", "Let's start over.", "最初からやり直しましょう。"]],
  r:[["You said my idea was bad!", 1],["Why did you change my report without asking?", 4],["Okay, I understand now. I'm sorry I got angry.", 7]],
  c:{sit:"同僚が怒っている",t:[["Why did you tell the boss about my mistake?", 0],["Then what did you say?", 2],["Oh. I'm sorry, I thought you were against me.", 6]]}},
 {t:"第二百歩 新しい空",d:"これからも学び続ける",p:[
  ["p1593", "I've come a long way.", "ずいぶん遠くまで来ました。"],["p1594", "English has opened many doors for me.", "英語がたくさんの扉を開いてくれました。"],["p1595", "I'm not perfect, but I'm not afraid anymore.", "完ぺきではないけれど、もうこわくありません。"],["p1596", "Mistakes are part of learning.", "まちがいは学びの一部です。"],["p1597", "I want to keep improving.", "もっと上達し続けたいです。"],["p1598", "I'd like to help others learn too.", "ほかの人の学びも手伝いたいです。"],["p1599", "Thank you for walking with me.", "いっしょに歩いてくれてありがとう。"],["p1600", "See you on the next step.", "また次の一歩で会いましょう。"]],
  r:[["You speak so confidently now!", 2],["I made so many mistakes in class today.", 3],["What's your next goal?", 4]],
  c:{sit:"英語の先生と一年をふり返る",t:[["Look how far you've come!", 0],["Do you still worry about mistakes?", 3],["So, what comes next for you?", 4]]}},
 {t:"第二百一歩 もしわたしなら",d:"仮定して助言する",p:[
  ["p1601", "If I were you, I'd take the job.", "わたしがあなたなら、その仕事を受けます。"],["p1602", "If I had more time, I'd travel more.", "もっと時間があれば、もっと旅行するのに。"],["p1603", "What would you do in my position?", "わたしの立場ならどうしますか？"],["p1604", "I'd probably say no.", "たぶん断ると思います。"],["p1605", "It depends on the situation.", "状況によります。"],["p1606", "If I were rich, I'd buy a boat.", "お金持ちなら、船を買うのに。"],["p1607", "I wouldn't worry about it.", "わたしなら気にしませんね。"],["p1608", "That's what I would do.", "わたしならそうします。"]],
  r:[["I got a job offer, but I'm nervous about changing jobs.", 0],["I heard your boss wants you to work on Sunday again.", 2],["I made a small mistake in my report. Should I tell my boss?", 6]],
  c:{sit:"友人に転勤の悩みを相談する",t:[["I heard your company offered you a job in Osaka.", 2],["Well, I'm not sure. Do you want to go?", 3],["Really? Even with a higher salary?", 4]]}},
 {t:"第二百二歩 サポート窓口",d:"問い合わせで問題を伝える",p:[
  ["p1609", "I've been on hold for twenty minutes.", "二十分も保留で待っています。"],["p1610", "This is the third time I've called.", "電話するのはこれで三回目です。"],["p1611", "Could I speak to a manager?", "責任者の方と話せますか？"],["p1612", "I'd like a reference number, please.", "受付番号をいただけますか？"],["p1613", "Can you explain why this happened?", "なぜこうなったのか説明してもらえますか？"],["p1614", "What are you going to do about it?", "どう対応していただけますか？"],["p1615", "I appreciate your help.", "ご対応に感謝します。"],["p1616", "Please put it in writing.", "書面でお願いします。"]],
  r:[["Thank you for waiting. How can I help you today?", 0],["I'm sorry, I can't solve this problem myself.", 2],["Okay, I've sent you a full refund.", 6]],
  c:{sit:"ネット回線の不具合で電話する",t:[["Sorry for the wait. What's the problem?", 1],["I see. I'm very sorry for the trouble.", 5],["I'll send a technician tomorrow and email you the details.", 6]]}},
 {t:"第二百三歩 説得",d:"反対意見に答える",p:[
  ["p1617", "I understand your concern.", "ご心配はわかります。"],["p1618", "Let me put it another way.", "別の言い方をさせてください。"],["p1619", "Think about it this way.", "こう考えてみてください。"],["p1620", "The benefits outweigh the costs.", "利点のほうが費用を上回ります。"],["p1621", "We can start small and see.", "小さく始めて様子を見ればいいんです。"],["p1622", "Other teams have tried it successfully.", "ほかのチームはうまくいっています。"],["p1623", "What would change your mind?", "何があれば考えが変わりますか？"],["p1624", "Let's agree to try it for a month.", "ひと月試すことで合意しましょう。"]],
  r:[["I'm worried this plan is too risky.", 0],["Sorry, I still don't understand your idea.", 1],["I'm still not convinced. It's too expensive.", 3]],
  c:{sit:"新しい勤務方法を上司に提案する",t:[["Working from home? I'm not sure about that.", 0],["But what if people stop working hard?", 4],["Maybe. I'll need to see results first.", 7]]}},
 {t:"第二百四歩 内見",d:"部屋を見学して質問する",p:[
  ["p1625", "How much is the rent?", "家賃はいくらですか？"],["p1626", "Do I pay for utilities separately?", "光熱費は別に払いますか？"],["p1627", "Is there a lot of sunlight?", "日当たりはいいですか？"],["p1628", "How far is the nearest station?", "最寄り駅までどのくらいですか？"],["p1629", "Can I keep a pet here?", "ここでペットを飼えますか？"],["p1630", "When can I move in?", "いつ入居できますか？"],["p1631", "How long is the contract?", "契約期間はどのくらいですか？"],["p1632", "I'd like to think it over.", "よく考えたいと思います。"]],
  r:[["This is the living room. The windows face south.", 2],["You mentioned you have a cat, right?", 4],["So, would you like to sign today?", 7]],
  c:{sit:"不動産屋と部屋を見に行く",t:[["Here we are. What do you think?", 2],["Yes, it gets sun all day. And the station is ten minutes away.", 6],["Usually two years. Any other questions?", 7]]}},
 {t:"第二百五歩 招待の返事",d:"招待に出欠を返す",p:[
  ["p1633", "Thank you for inviting me.", "招待してくれてありがとう。"],["p1634", "I'd love to come.", "ぜひ行きたいです。"],["p1635", "Unfortunately, I have other plans.", "あいにく、ほかの予定があります。"],["p1636", "Can I bring a friend?", "友だちを連れて行ってもいいですか？"],["p1637", "What should I wear?", "何を着ていけばいいですか？"],["p1638", "Should I bring anything?", "何か持っていくものはありますか？"],["p1639", "I'll let you know by Friday.", "金曜日までにお返事します。"],["p1640", "Sorry I can't make it.", "行けなくてごめんなさい。"]],
  r:[["We're having a barbecue on Saturday. Can you come?", 1],["It's a formal party, so don't be late.", 4],["Please reply by the end of the week.", 6]],
  c:{sit:"同僚から結婚式に招待される",t:[["I'm getting married in June! Can you come?", 1],["It's a garden party, so it's casual.", 5],["Oh, just bring yourself!", 0]]}},
 {t:"第二百六歩 目上の人と",d:"目上の人とていねいに話す",p:[
  ["p1641", "Thank you for taking the time to meet me.", "お時間をいただきありがとうございます。"],["p1642", "May I ask you a question?", "質問してもよろしいですか？"],["p1643", "I'd appreciate your advice.", "ご助言をいただけるとありがたいです。"],["p1644", "That's very kind of you.", "ご親切にありがとうございます。"],["p1645", "I'm sorry to interrupt.", "お話し中すみません。"],["p1646", "Please let me know if I can help.", "お手伝いできることがあれば、お知らせください。"],["p1647", "I'll do my best.", "全力を尽くします。"],["p1648", "It was an honor to meet you.", "お会いできて光栄でした。"]],
  r:[["Please, come in and sit down.", 0],["I'm glad to help. What do you need?", 2],["I'd like you to lead the new project.", 6]],
  c:{sit:"社長に相談の時間をもらう",t:[["Good morning. What can I do for you?", 1],["Of course. Is it about the training course you mentioned?", 2],["Well, I think you should take the course.", 3]]}},
 {t:"第二百七歩 AIの話",d:"新しい技術について話す",p:[
  ["p1649", "I use AI to check my English.", "英語の確認にAIを使っています。"],["p1650", "It saves me a lot of time.", "とても時間の節約になります。"],["p1651", "But it's not always right.", "でも、いつも正しいわけではありません。"],["p1652", "You still need to check the facts.", "事実はやはり自分で確かめる必要があります。"],["p1653", "Some people worry about their jobs.", "仕事を奪われないか心配する人もいます。"],["p1654", "I think it's just a tool.", "ただの道具だと思います。"],["p1655", "It depends on how you use it.", "使い方しだいです。"],["p1656", "Technology changes so fast.", "技術の変化はとても速いですね。"]],
  r:[["Do you trust everything AI tells you?", 2],["In your opinion, is AI good or bad?", 6],["My phone from three years ago is already old.", 7]],
  c:{sit:"同僚とAIについて話す",t:[["How do you use AI at work?", 0],["Wow. Do you think it will take our jobs?", 5],["True. But it makes mistakes too, right?", 3]]}},
 {t:"第二百八歩 便の変更",d:"航空券の予約を変更する",p:[
  ["p1657", "I'd like to change my flight.", "便を変更したいのですが。"],["p1658", "Is there a later flight?", "もっと遅い便はありますか？"],["p1659", "Is there a fee to change it?", "変更に手数料はかかりますか？"],["p1660", "Can I keep the same seat?", "同じ席のままにできますか？"],["p1661", "My connecting flight was canceled.", "乗り継ぎ便が欠航になりました。"],["p1662", "Could you book me on the next one?", "次の便に予約していただけますか？"],["p1663", "Will my bags be transferred?", "荷物は積み替えてもらえますか？"],["p1664", "Could I get a meal voucher?", "食事券をもらえますか？"]],
  r:[["How can I help you with your booking?", 0],["I've put you on the nine o'clock connecting flight tonight.", 6],["Your flight is delayed by five hours.", 7]],
  c:{sit:"空港のカウンターで乗り継ぎについて話す",t:[["Next, please. How can I help?", 4],["I'm sorry. There's another one at eight. I've booked you on it.", 6],["Yes, they'll go straight to your final destination.", 7]]}},
 {t:"第二百九歩 司会",d:"オンライン会議を進行する",p:[
  ["p1665", "Let's get started.", "始めましょう。"],["p1666", "Can everyone hear me?", "みなさん聞こえていますか？"],["p1667", "Today we have three topics.", "今日の議題は三つです。"],["p1668", "Let's move on to the next item.", "次の議題に移りましょう。"],["p1669", "We're running out of time.", "時間がなくなってきました。"],["p1670", "Let's take this offline.", "これは会議のあとで別に話しましょう。"],["p1671", "Does anyone have any questions?", "質問のある方はいますか？"],["p1672", "Thanks, everyone. See you next week.", "みなさん、ありがとう。また来週。"]],
  r:[["I think everyone is here now.", 0],["I'm done talking about the budget.", 3],["This problem needs a long discussion.", 5]],
  c:{sit:"チームのオンライン会議を始める",t:[["Hi, everyone. I'm here.", 1],["Yes, we can hear you clearly.", 2],["Wait, I have a long story about the client.", 5]]}},
 {t:"第二百十歩 質疑応答",d:"発表のあと質問に答える",p:[
  ["p1673", "That's a great question.", "いい質問ですね。"],["p1674", "Let me make sure I understand.", "質問の意味を確認させてください。"],["p1675", "I don't have that number with me.", "その数字は今手元にありません。"],["p1676", "I'll get back to you on that.", "それについては後ほどお答えします。"],["p1677", "As I mentioned earlier,", "先ほど申し上げたとおり、"],["p1678", "That's outside my area.", "それはわたしの専門外です。"],["p1679", "Does that answer your question?", "お答えになっていますか？"],["p1680", "Any other questions?", "ほかにご質問は？"]],
  r:[["How much did the project cost last year?", 2],["So, what was your main point again?", 4],["Okay, thanks. That's clear now.", 7]],
  c:{sit:"発表のあと会場から質問を受ける",t:[["How many users does the app have now?", 2],["Okay. And who will pay for the new servers?", 5],["I see. That's all from me.", 7]]}},
 {t:"第二百十一歩 契約",d:"契約書を確認する",p:[
  ["p1681", "Could I take a closer look at the contract?", "契約書をもう少しよく見せてもらえますか？"],["p1682", "What does this part mean?", "この部分はどういう意味ですか？"],["p1683", "Can I cancel at any time?", "いつでも解約できますか？"],["p1684", "Are there any hidden fees?", "隠れた手数料はありませんか？"],["p1685", "I'd like to have it checked first.", "まず確認してもらいたいです。"],["p1686", "Where do I sign?", "どこに署名すればいいですか？"],["p1687", "Could I get a copy, please?", "控えをいただけますか？"],["p1688", "When does it start?", "いつから有効ですか？"]],
  r:[["Here's the contract. Please sign at the bottom.", 0],["This plan comes with a two-year contract.", 2],["Everything looks good. Thank you for signing.", 6]],
  c:{sit:"スマホの契約をする",t:[["Here's the contract. Any questions?", 3],["No, there aren't. The price is fixed.", 2],["Yes, after the first month.", 5]]}},
 {t:"第二百十二歩 人をつなぐ",d:"人を紹介してつなぐ",p:[
  ["p1689", "I'd like you to meet my colleague.", "同僚を紹介させてください。"],["p1690", "You two should talk.", "お二人は話してみるといいですよ。"],["p1691", "She's an expert in design.", "彼女はデザインの専門家です。"],["p1692", "I'll send you both an email.", "お二人にメールを送りますね。"],["p1693", "You have a lot in common.", "共通点がたくさんありますよ。"],["p1694", "He might be able to help you.", "彼ならあなたの力になれるかもしれません。"],["p1695", "Let me introduce you.", "紹介しますね。"],["p1696", "Feel free to use my name.", "わたしの名前を出してかまいません。"]],
  r:[["I need someone who can make a website.", 5],["Oh, you both love hiking and coffee?", 4],["Should I tell him you sent me?", 7]],
  c:{sit:"パーティーで知人どうしを引き合わせる",t:[["Hi! Who's your friend?", 0],["Nice to meet you. What do you do?", 2],["I'm looking for a designer, actually!", 1]]}},
 {t:"第二百十三歩 おだやかに",d:"不満をおだやかに伝える",p:[
  ["p1697", "Can we talk about something?", "ちょっと話せる？"],["p1698", "I felt a little hurt.", "少し傷ついたんだ。"],["p1699", "It's not a big deal, but…", "大したことじゃないけど……"],["p1700", "I'd like us to share the chores.", "家事を分担したいな。"],["p1701", "I know you're busy too.", "あなたも忙しいのはわかってる。"],["p1702", "How do you see it?", "あなたはどう思う？"],["p1703", "Let's find a way that works for both of us.", "二人にとっていい方法を見つけよう。"],["p1704", "Thanks for listening.", "聞いてくれてありがとう。"]],
  r:[["You look upset. What's wrong?", 1],["I'm so tired after work every day.", 4],["Okay. I'll do the dishes on weekdays.", 7]],
  c:{sit:"家族に家事のことを話す",t:[["Sure. What is it? The housework?", 4],["I'm sorry. I didn't notice you were doing everything.", 3],["Okay, that sounds fair.", 7]]}},
 {t:"第二百十四歩 ご近所会",d:"ご近所の集まりで話す",p:[
  ["p1705", "Which house do you live in?", "どのお宅にお住まいですか？"],["p1706", "I'm the new neighbor.", "新しく越してきた者です。"],["p1707", "This dish is homemade.", "この料理は手作りです。"],["p1708", "How long have you lived here?", "ここにはどのくらい住んでいますか？"],["p1709", "Do you know a good doctor nearby?", "近くにいいお医者さんはいますか？"],["p1710", "It's a really friendly neighborhood.", "本当に感じのいい地域ですね。"],["p1711", "Let's do this again sometime.", "またいつかやりましょう。"],["p1712", "Let me help you clean up.", "片づけを手伝いますね。"]],
  r:[["Hi! I don't think we've met.", 1],["Wow, this salad is great! Did you buy it?", 2],["Well, the party is over. What a mess!", 7]],
  c:{sit:"近所のバーベキューに参加する",t:[["Welcome! Are you new around here?", 1],["Nice to meet you! Do you need anything?", 4],["Dr. Lee, two streets down. She's great.", 5]]}},
 {t:"第二百十五歩 たとえる",d:"たとえて説明する",p:[
  ["p1713", "It tastes like chicken.", "鶏肉みたいな味がします。"],["p1714", "It looks like a small cat.", "小さな猫みたいに見えます。"],["p1715", "It feels like a dream.", "夢みたいな気分です。"],["p1716", "He talks as if he knows everything.", "彼は何でも知っているかのように話します。"],["p1717", "It sounds like fun.", "楽しそうですね。"],["p1718", "It's as light as a feather.", "羽みたいに軽いです。"],["p1719", "It's like riding a bike.", "自転車に乗るようなものです。"],["p1720", "It smells like rain.", "雨のにおいがします。"]],
  r:[["Have you ever eaten frog?", 0],["I can't believe I'm finally in Paris!", 2],["I haven't used English in years. Will I remember it?", 6]],
  c:{sit:"旅先で知らない料理を食べる",t:[["Try this. It's a local dish.", 0],["And how about the view from here?", 2],["Tomorrow we're going to the night market.", 4]]}},
 {t:"第二百十六歩 強調",d:"気持ちを強く伝える",p:[
  ["p1721", "I totally agree.", "まったく同感です。"],["p1722", "That was absolutely amazing.", "本当にすばらしかった。"],["p1723", "I really mean it.", "本気で言っています。"],["p1724", "I can't thank you enough.", "感謝してもしきれません。"],["p1725", "I'm not exaggerating.", "大げさに言っているんじゃありません。"],["p1726", "It was the best day ever.", "人生最高の日でした。"],["p1727", "Actually, I do care.", "実は、本当に気にしているんです。"],["p1728", "You have no idea how happy I am.", "言葉にできないくらいうれしいです。"]],
  r:[["Hiking is the best way to relax, right?", 0],["You don't care about my problem, do you?", 6],["Here's the present. I hope you like it.", 7]],
  c:{sit:"友人たちが開いてくれた自分の送別パーティーで話す",t:[["You keep saying this was the best night of your life. Really?", 2],["We'll all miss you so much.", 3],["You said you'll miss this town more than anywhere. Seriously?", 4]]}},
 {t:"第二百十七歩 言いかえ",d:"言葉が出ないときに説明する",p:[
  ["p1729", "I forgot the word.", "単語を忘れてしまいました。"],["p1730", "It's a kind of tool.", "道具の一種です。"],["p1731", "You use it to open bottles.", "びんを開けるときに使います。"],["p1732", "It's something you wear on your head.", "頭にかぶるものです。"],["p1733", "It's similar to a fork.", "フォークに似ています。"],["p1734", "What do you call it?", "それは何と呼びますか？"],["p1735", "That's the word I was looking for!", "それが探していた言葉です！"],["p1736", "How do you say this in English?", "これは英語で何と言いますか？"]],
  r:[["You want to buy something? What is it?", 0],["Okay. What do you use it for?", 2],["Oh, you mean a bottle opener?", 6]],
  c:{sit:"お店で欲しい物の名前が出てこない",t:[["Can I help you find something?", 0],["Okay. What is it like?", 2],["Ah, a bottle opener!", 6]]}},
 {t:"第二百十八歩 電波が悪い",d:"電話がとぎれたときの対応",p:[
  ["p1737", "You're breaking up.", "声がとぎれています。"],["p1738", "Sorry, I lost you for a second.", "すみません、一瞬聞こえなくなりました。"],["p1739", "Can you hear me now?", "今は聞こえますか？"],["p1740", "I'll call you right back.", "すぐにかけ直します。"],["p1741", "I'm in a tunnel.", "トンネルの中にいるんです。"],["p1742", "Let me move somewhere quieter.", "もっと静かな所に移動しますね。"],["p1743", "Could you say that last part again?", "最後の部分をもう一度言ってもらえますか？"],["p1744", "Let's switch to text.", "メッセージに切りかえましょう。"]],
  r:[["Hello? Hello? I can only hear half of what you say.", 4],["There's a lot of noise behind you.", 5],["…and that's why the meeting moved to Thursday.", 6]],
  c:{sit:"移動中に電話を受ける",t:[["Hi, it's me. Can you talk now?", 0],["Hello? Hello?", 3],["Hi again. It's still bad. I can barely hear you.", 7]]}},
 {t:"第二百十九歩 考えが変わる",d:"意見が変わったことを伝える",p:[
  ["p1745", "I've changed my mind.", "考えが変わりました。"],["p1746", "You've convinced me.", "納得しました。"],["p1747", "I used to think differently.", "以前は違う考えでした。"],["p1748", "Now I see it from a new angle.", "今は新しい角度から見られます。"],["p1749", "I was wrong about that.", "それについては、わたしがまちがっていました。"],["p1750", "On second thought, let's wait.", "やっぱり、待ちましょう。"],["p1751", "I'm starting to like it.", "好きになってきました。"],["p1752", "I'm glad I gave it a chance.", "試してみてよかったです。"]],
  r:[["So, are you still against the plan?", 1],["You hated natto at first, right?", 6],["Wait, didn't you want to buy the car today?", 5]],
  c:{sit:"友人とスマホの機種を話す",t:[["Are you still going to buy the cheap phone?", 0],["Why? You said the camera didn't matter.", 2],["See? Better cameras are worth it.", 1]]}},
 {t:"第二百二十歩 また会う日まで",d:"旅の終わりに約束する",p:[
  ["p1753", "I'm going to miss you.", "さびしくなります。"],["p1754", "This isn't goodbye.", "これでお別れじゃありません。"],["p1755", "Let's meet again next year.", "来年また会いましょう。"],["p1756", "You're always welcome at my place.", "いつでもうちに来てくださいね。"],["p1757", "I'll never forget this trip.", "この旅は決して忘れません。"],["p1758", "Take care of yourself.", "体に気をつけてね。"],["p1759", "Have a safe trip home.", "気をつけて帰ってね。"],["p1760", "Until next time!", "また次の時まで！"]],
  r:[["My flight leaves in an hour. I have to go.", 0],["If I visit Japan, can I stay with you?", 3],["I'm going back to London tomorrow.", 6]],
  c:{sit:"空港で旅の友人を見送る",t:[["Well, this is it. My gate is open.", 0],["I'll miss you too. But we'll see each other again.", 1],["Okay. I'll text you when I land.", 6]]}},
 {t:"第二百二十一歩 台所の失敗",d:"料理の失敗を話す",p:[
  ["p1761", "I burned the rice again.", "またご飯をこがしちゃった。"],["p1762", "I added too much salt.", "塩を入れすぎました。"],["p1763", "It didn't turn out the way I wanted.", "思ったようにできませんでした。"],["p1764", "I forgot to set the timer.", "タイマーをかけ忘れました。"],["p1765", "Can we save it somehow?", "なんとかなりませんか？"],["p1766", "Let's just order pizza.", "もうピザを頼もう。"],["p1767", "At least the salad is okay.", "少なくともサラダは大丈夫です。"],["p1768", "I'll do better next time.", "次はもっとうまくやります。"]],
  r:[["What's that smell? Is something burning?", 0],["This soup is so salty!", 1],["Dinner's ruined. What should we do?", 5]],
  c:{sit:"友人を招いた夕食で失敗する",t:[["Something smells strange. What happened?", 0],["Oh no. The fish looks a little dry too.", 2],["Don't worry. It happens to everyone.", 7]]}},
 {t:"第二百二十二歩 引っ越しの手伝い",d:"引っ越しの手伝いを頼む",p:[
  ["p1769", "Could you give me a hand on Saturday?", "土曜日に手を貸してもらえる？"],["p1770", "I'm moving to a new place.", "新しい所に引っ越すんです。"],["p1771", "I'll buy you lunch.", "お昼をおごるよ。"],["p1772", "Watch out, this box is heavy.", "気をつけて、この箱は重いよ。"],["p1773", "Can you hold the door open?", "ドアを押さえてくれる？"],["p1774", "Where should this go?", "これはどこに置けばいい？"],["p1775", "Let's take a break.", "ひと休みしよう。"],["p1776", "I couldn't have done it without you.", "あなたがいなかったらできませんでした。"]],
  r:[["Sure, I can help. What's the occasion?", 1],["Okay, I'll grab this one next.", 3],["We finally finished!", 7]],
  c:{sit:"友人に引っ越しを手伝ってもらう",t:[["Hey, what are you doing this weekend?", 0],["Sure! What's the plan?", 1],["Okay, the truck is here. What's first?", 3]]}},
 {t:"第二百二十三歩 請求のまちがい",d:"ホテルの請求を確認する",p:[
  ["p1777", "I think there's a mistake on my bill.", "請求書にまちがいがあると思います。"],["p1778", "I didn't use the minibar.", "ミニバーは使っていません。"],["p1779", "I was charged twice.", "二重に請求されています。"],["p1780", "Could you check it again?", "もう一度確認していただけますか？"],["p1781", "I stayed only two nights.", "二泊しかしていません。"],["p1782", "Can you remove this charge?", "この料金を取り消してもらえますか？"],["p1783", "Could I get a new receipt?", "新しい領収書をいただけますか？"],["p1784", "Thank you for sorting it out.", "解決してくださってありがとうございます。"]],
  r:[["Here is your bill. Please check it.", 0],["It says you had drinks from the minibar.", 1],["Okay, I've fixed it. Anything else?", 6]],
  c:{sit:"チェックアウトで請求書を見る",t:[["Here's your final bill.", 0],["Let me see. Everything looks correct to me.", 3],["I'm so sorry. You were charged twice, so I've removed one payment.", 6]]}},
 {t:"第二百二十四歩 予約がない",d:"店で予約が見つからないとき",p:[
  ["p1785", "I have a reservation under Tanaka.", "田中の名前で予約しています。"],["p1786", "I booked it online last week.", "先週ネットで予約しました。"],["p1787", "Here's my confirmation email.", "これが確認メールです。"],["p1788", "How long is the wait?", "待ち時間はどのくらいですか？"],["p1789", "Could we sit at the bar instead?", "かわりにカウンター席に座れますか？"],["p1790", "We don't mind waiting.", "待つのはかまいません。"],["p1791", "Can you recommend another place nearby?", "近くでほかにおすすめの店はありますか？"],["p1792", "Thanks for finding us a table.", "席を用意してくださってありがとう。"]],
  r:[["Good evening. Do you have a reservation?", 0],["Hmm, I can't find your name in our system.", 2],["Sorry, we're completely full tonight.", 6]],
  c:{sit:"レストランで予約が見つからない",t:[["Hello! What name is the reservation under?", 0],["Hmm, I don't see it. When did you make it?", 1],["I'm sorry. Our next table is in thirty minutes.", 5]]}},
 {t:"第二百二十五歩 作りおき",d:"自炊と作りおきの話",p:[
  ["p1793", "I cook for the whole week on Sundays.", "日曜日に一週間分を作ります。"],["p1794", "It saves time on weekdays.", "平日の時間が節約できます。"],["p1795", "I keep it in the freezer.", "冷凍庫に入れておきます。"],["p1796", "This lasts about three days.", "これは三日くらいもちます。"],["p1797", "I'm trying to eat more vegetables.", "野菜をもっと食べるようにしています。"],["p1798", "It's cheaper than eating out.", "外食より安いです。"],["p1799", "Do you want the recipe?", "レシピ、いる？"],["p1800", "I'm getting better at cooking.", "料理が上達してきました。"]],
  r:[["How do you have time to cook every day?", 0],["How long can I keep this curry?", 3],["This is delicious! How did you make it?", 6]],
  c:{sit:"同僚とお昼のお弁当を見せ合う",t:[["Your lunch looks great every day.", 0],["Doesn't it go bad?", 2],["Wow. Can you teach me some easy dishes?", 6]]}},
 {t:"第二百二十六歩 キャンセル待ち",d:"キャンセル待ちをする",p:[
  ["p1801", "Can I put my name on the waiting list?", "キャンセル待ちに名前を入れてもらえますか？"],["p1802", "What number am I on the list?", "わたしは何番目ですか？"],["p1803", "How likely is it that I'll get a seat?", "席が取れる可能性はどのくらいですか？"],["p1804", "Please call me if something opens up.", "空きが出たら電話してください。"],["p1805", "I'm flexible with the time.", "時間は融通がききます。"],["p1806", "I'll wait here, just in case.", "念のため、ここで待ちます。"],["p1807", "Is there a fee to be on the list?", "リストに入るのに料金はかかりますか？"],["p1808", "Great, I got a seat!", "やった、席が取れた！"]],
  r:[["Sorry, that class is already full.", 0],["You're number three on the list.", 2],["Good news. Someone canceled, so the seat is yours.", 7]],
  c:{sit:"人気のツアーに申し込む",t:[["Sorry, the tour is sold out today.", 0],["Sure. You're number five.", 2],["Well, people often cancel in the morning.", 5]]}},
 {t:"第二百二十七歩 受付ボランティア",d:"イベントの受付をする",p:[
  ["p1809", "Welcome! Can I have your name?", "ようこそ！お名前をうかがえますか？"],["p1810", "Here's your name tag.", "こちらが名札です。"],["p1811", "The talk starts at ten in the main hall.", "講演は十時にメインホールで始まります。"],["p1812", "The restrooms are down the hall.", "お手洗いは廊下の先です。"],["p1813", "Please fill out this survey later.", "あとでこのアンケートにご記入ください。"],["p1814", "Free drinks are over there.", "無料の飲み物はあちらです。"],["p1815", "Let me check the list.", "名簿を確認しますね。"],["p1816", "Enjoy the event!", "イベントをお楽しみください！"]],
  r:[["Hi, I'm here for the conference.", 0],["I signed up, but I'm not sure my name is there.", 6],["Where can I find something to drink?", 5]],
  c:{sit:"国際会議の受付をする",t:[["Good morning! I'm Maria Lopez.", 6],["Sure. I registered last month.", 1],["Great. What time is the first talk?", 2]]}},
 {t:"第二百二十八歩 学校の面談",d:"子どもの先生と話す",p:[
  ["p1817", "How is my son doing in class?", "息子は授業でどんな様子ですか？"],["p1818", "He seems to enjoy science.", "理科が楽しいようです。"],["p1819", "Is he getting along with his classmates?", "クラスメートと仲よくやっていますか？"],["p1820", "What can we do at home to help?", "家で何をしたら手助けになりますか？"],["p1821", "He's been a little quiet lately.", "最近少し口数が少ないんです。"],["p1822", "Thank you for telling me.", "教えてくださってありがとうございます。"],["p1823", "Please let me know if anything changes.", "何か変化があったら知らせてください。"],["p1824", "We'll keep an eye on it.", "家でも気をつけて見ておきます。"]],
  r:[["Thank you for coming. Do you have any questions?", 0],["He sometimes forgets his homework.", 3],["He was sad at lunch yesterday.", 6]],
  c:{sit:"息子の担任と面談する",t:[["Hello, please have a seat.", 0],["He's very good at math, but he doesn't talk much in class.", 3],["Let's meet again next month.", 6]]}},
 {t:"第二百二十九歩 故障",d:"車の故障で助けを呼ぶ",p:[
  ["p1825", "My car won't start.", "車のエンジンがかかりません。"],["p1826", "I think the battery is dead.", "バッテリーが上がったみたいです。"],["p1827", "I have a flat tire.", "タイヤがパンクしました。"],["p1828", "I'm on the highway near exit twelve.", "高速道路の十二番出口の近くにいます。"],["p1829", "How long until someone gets here?", "だれかが来るまでどのくらいですか？"],["p1830", "Can you tow it to a garage?", "修理工場までレッカーしてもらえますか？"],["p1831", "I'm safe, but I'm stuck.", "無事ですが、動けません。"],["p1832", "Do I need to pay for this?", "これは料金がかかりますか？"]],
  r:[["Roadside assistance. What's the problem?", 0],["Where exactly are you now?", 3],["Okay. Are you in a safe place?", 6]],
  c:{sit:"夜道で車が動かなくなる",t:[["Roadside help. What's wrong?", 0],["Okay. Where are you right now?", 3],["Got it. Are you somewhere safe while you wait?", 6]]}},
 {t:"第二百三十歩 パスポート",d:"パスポートをなくしたとき",p:[
  ["p1833", "I lost my passport.", "パスポートをなくしました。"],["p1834", "I think it was stolen.", "盗まれたと思います。"],["p1835", "Where is the Japanese embassy?", "日本大使館はどこですか？"],["p1836", "I need a police report.", "警察の届出証明が必要です。"],["p1837", "I have a copy of it.", "コピーは持っています。"],["p1838", "My flight is the day after tomorrow.", "飛行機はあさってです。"],["p1839", "What documents do I need?", "どんな書類が必要ですか？"],["p1840", "How long does it take to get a new one?", "新しいものを作るのにどのくらいかかりますか？"]],
  r:[["You look worried. What happened?", 0],["You should go to your country's embassy.", 2],["You'll need a photo and a police report.", 7]],
  c:{sit:"海外のホテルでパスポートがないと気づく",t:[["You look pale. Is everything okay?", 0],["Oh no. Have you checked your bags?", 1],["Then you should go to the police first.", 3]]}},
 {t:"第二百三十一歩 時差ぼけ",d:"時差ぼけについて話す",p:[
  ["p1841", "I'm still jet-lagged.", "まだ時差ぼけです。"],["p1842", "I woke up at three in the morning.", "朝の三時に目が覚めました。"],["p1843", "My body thinks it's the middle of the night.", "体は真夜中だと思っています。"],["p1844", "I'm trying to stay awake until ten.", "十時まで起きているようにしています。"],["p1845", "Getting some sunlight helps.", "日光を浴びると楽になります。"],["p1846", "It usually takes me a few days.", "ふだん数日かかります。"],["p1847", "I could fall asleep standing up.", "立ったまま眠れそうです。"],["p1848", "I'll go to bed early tonight.", "今夜は早く寝ます。"]],
  r:[["You look so sleepy. Are you okay?", 0],["Why don't you take a nap now?", 3],["How long until you feel normal again?", 5]],
  c:{sit:"出張先で朝食をとる同僚と話す",t:[["Good morning! Did you sleep well?", 1],["Oh no. You must be exhausted.", 2],["How do you usually deal with jet lag?", 4]]}},
 {t:"第二百三十二歩 ふるさと",d:"地元を紹介する",p:[
  ["p1849", "I'm from a small town by the sea.", "海辺の小さな町の出身です。"],["p1850", "It's famous for its fish.", "魚で有名です。"],["p1851", "It's about two hours from Tokyo.", "東京から二時間ほどです。"],["p1852", "The best time to visit is autumn.", "おすすめの季節は秋です。"],["p1853", "There's a big festival every summer.", "毎年夏に大きなお祭りがあります。"],["p1854", "Everyone knows everyone there.", "みんな顔見知りです。"],["p1855", "I miss the food there.", "地元の料理が恋しいです。"],["p1856", "You should come visit sometime.", "いつか遊びに来てください。"]],
  r:[["Where did you grow up?", 0],["What's it known for?", 1],["When should I go there?", 3]],
  c:{sit:"留学生に出身地を聞かれる",t:[["So, are you from Tokyo?", 0],["Sounds nice. Is it far?", 2],["I'd love to see it someday.", 7]]}},
 {t:"第二百三十三歩 チームを励ます",d:"リーダーとしてチームを励ます",p:[
  ["p1857", "You've all worked so hard.", "みんな本当によくがんばってくれました。"],["p1858", "I know this week was tough.", "今週は大変だったよね。"],["p1859", "We're almost there.", "もう少しです。"],["p1860", "Let's keep going together.", "一緒に続けていきましょう。"],["p1861", "Your effort really shows.", "努力がしっかり表れています。"],["p1862", "Don't hesitate to ask for help.", "遠慮なく助けを求めてください。"],["p1863", "Let's celebrate when it's done.", "終わったらお祝いしよう。"],["p1864", "I'm proud of this team.", "このチームを誇りに思います。"]],
  r:[["Everyone is so tired. The deadline is tomorrow.", 2],["I'm stuck, but I don't want to bother anyone.", 5],["We finished the project on time!", 7]],
  c:{sit:"締め切り前のチームに声をかける",t:[["I don't think we can finish this.", 2],["But I don't understand this part.", 5],["Okay. I'll ask Tom for help.", 3]]}},
 {t:"第二百三十四歩 組み立て",d:"説明書を見て組み立てる",p:[
  ["p1865", "Let's read the instructions first.", "まず説明書を読もう。"],["p1866", "Are all the parts here?", "部品は全部そろってる？"],["p1867", "We're missing a screw.", "ねじが一本足りない。"],["p1868", "This piece goes upside down.", "この部品は上下逆さに付けるんだよ。"],["p1869", "Hold it steady for a second.", "ちょっとしっかり押さえてて。"],["p1870", "Step three doesn't make sense.", "手順三が意味わからない。"],["p1871", "I think we did it backward.", "逆にやっちゃったと思う。"],["p1872", "It looks just like the picture!", "写真のとおりにできた！"]],
  r:[["I opened the box. Where do we start?", 0],["There should be eight screws, but I only see seven.", 2],["Wait, why doesn't this drawer close?", 6]],
  c:{sit:"友人と本棚を組み立てる",t:[["Let's just start. It looks easy.", 0],["Okay, step one. Count the screws.", 1],["Here's the last shelf. Finally!", 7]]}},
 {t:"第二百三十五歩 進み具合",d:"頼まれた仕事の進み具合を報告する",p:[
  ["p1873", "Just a quick update.", "ひとまず進み具合の報告です。"],["p1874", "I'm about halfway done.", "半分ほど終わりました。"],["p1875", "Everything is on track.", "予定どおり進んでいます。"],["p1876", "I ran into a small problem.", "ちょっとした問題にぶつかりました。"],["p1877", "I need your approval to continue.", "続けるのにご承認が必要です。"],["p1878", "It should be finished by Thursday.", "木曜日までに終わるはずです。"],["p1879", "I'll let you know if anything changes.", "変更があればお知らせします。"],["p1880", "Let me know if you have any questions.", "ご質問があればお知らせください。"]],
  r:[["How's the website going?", 1],["Any problems so far?", 3],["When do you think it'll be ready?", 5]],
  c:{sit:"上司に進み具合を聞かれる",t:[["Hi. Where are we on the project?", 0],["Good. How much is done?", 1],["Great. When will it be finished?", 5]]}},
 {t:"第二百三十六歩 記念日",d:"記念日を祝う",p:[
  ["p1881", "Happy anniversary!", "記念日おめでとう！"],["p1882", "I can't believe it's been five years.", "もう五年なんて信じられない。"],["p1883", "I made a reservation for dinner.", "ディナーを予約したよ。"],["p1884", "This is for you.", "これ、あなたに。"],["p1885", "You remembered!", "覚えててくれたんだ！"],["p1886", "Here's to many more years together.", "これからも末長く、乾杯。"],["p1887", "I'm lucky to have you.", "あなたがいてくれて幸せです。"],["p1888", "Let's make it a tradition.", "これを恒例にしよう。"]],
  r:[["Do you know what day it is today?", 0],["Here, I got you flowers. Happy anniversary!", 4],["This was such a nice evening.", 7]],
  c:{sit:"パートナーと記念日の朝",t:[["Good morning! Do you know what day it is?", 0],["Wow, what's in this box?", 3],["This necklace is beautiful. I love you.", 6]]}},
 {t:"第二百三十七歩 付きそい",d:"家族の通訳として付きそう",p:[
  ["p1889", "I'm here to help my mother.", "母の付きそいで来ました。"],["p1890", "She doesn't speak much English.", "母はあまり英語を話せません。"],["p1891", "I'll translate for her.", "わたしが通訳します。"],["p1892", "She says it hurts here.", "ここが痛いと言っています。"],["p1893", "Could you speak a little more slowly?", "もう少しゆっくり話していただけますか？"],["p1894", "Let me explain that to her.", "それを母に説明しますね。"],["p1895", "She wants to know if it's serious.", "深刻かどうか知りたがっています。"],["p1896", "How often should she take this?", "これはどのくらいの間隔で飲めばいいですか？"]],
  r:[["Hello. Who's the patient today?", 0],["Where does she feel pain?", 3],["Here's her prescription.", 7]],
  c:{sit:"病院で母の通訳をする",t:[["Good morning. What brings you here today?", 0],["I see. Does she understand what I'm saying?", 1],["This medicine should help.", 7]]}},
 {t:"第二百三十八歩 話題を変える",d:"話題を自然に変える",p:[
  ["p1897", "By the way, how was your trip?", "ところで、旅行はどうだった？"],["p1898", "That reminds me…", "それで思い出したんだけど……"],["p1899", "Speaking of food, have you tried the new place?", "食べ物と言えば、あの新しい店行った？"],["p1900", "Anyway, enough about me.", "まあ、わたしの話はもういいや。"],["p1901", "Let's talk about something else.", "別の話をしよう。"],["p1902", "Going back to what you said earlier…", "さっきの話に戻るけど……"],["p1903", "Before I forget, here's your book.", "忘れないうちに、はい、本。"],["p1904", "Changing the subject, are you free tonight?", "話は変わるけど、今夜あいてる？"]],
  r:[["Wow, you've been talking about your job for an hour!", 3],["This topic is making me sad.", 4],["I love pizza so much.", 2]],
  c:{sit:"カフェで友人と話す",t:[["…and that's why I'm so tired of my job.", 4],["Yes, please. Oh, I went to Kyoto last week.", 1],["Really? What did it remind you of?", 6]]}},
 {t:"第二百三十九歩 まとめ役",d:"意見の対立をまとめる",p:[
  ["p1905", "Let's hear both sides.", "両方の意見を聞きましょう。"],["p1906", "You both make good points.", "お二人ともいい点を突いています。"],["p1907", "What do we agree on?", "どこで意見が一致していますか？"],["p1908", "Is there a middle ground?", "妥協点はありますか？"],["p1909", "Let's focus on the goal.", "目標に集中しましょう。"],["p1910", "How about we try both for a week?", "両方を一週間試してみるのはどうでしょう？"],["p1911", "Let's take a short break and come back.", "少し休憩してから戻りましょう。"],["p1912", "I think we have a plan.", "これで方針が決まったと思います。"]],
  r:[["She wants to start now, but I want to wait.", 0],["We'll never agree on this!", 3],["Everyone is getting angry.", 6]],
  c:{sit:"会議で二人の意見が対立する",t:[["I think we should cut the budget.", 0],["No way. We need more money, not less.", 3],["Maybe we could save on travel costs instead.", 7]]}},
 {t:"第二百四十歩 語りつぐ",d:"旅の思い出を物語る",p:[
  ["p1913", "Let me tell you about the craziest day of my trip.", "旅でいちばんすごかった日の話をさせて。"],["p1914", "It all started at the train station.", "すべては駅から始まりました。"],["p1915", "Suddenly, the lights went out.", "突然、明かりが消えました。"],["p1916", "I had no idea what to do.", "どうしたらいいか、まったくわかりませんでした。"],["p1917", "Then a stranger offered to help.", "そのとき、知らない人が助けを申し出てくれました。"],["p1918", "In the end, everything worked out.", "結局、すべてうまくいきました。"],["p1919", "I still smile when I think about it.", "思い出すと今でも笑顔になります。"],["p1920", "That's when I fell in love with traveling.", "そのとき旅が大好きになったんです。"]],
  r:[["Do you have any good travel stories?", 0],["Wow, that sounds scary. Then what happened?", 4],["So, how did the story end?", 5]],
  c:{sit:"友人に旅の話をせがまれる",t:[["Tell me a story from your trip!", 0],["Oh, the time you got lost at night? What did you do?", 4],["Wow. How did it change you?", 7]]}},
 {t:"第二百四十一歩 こだわりの一杯",d:"コーヒーを細かく注文する",p:[
  ["p1921", "Can I get a large latte with oat milk?", "オーツミルクのラテのLをください。"],["p1922", "Could you make it less sweet?", "甘さ控えめにできますか？"],["p1923", "Extra hot, please.", "熱めでお願いします。"],["p1924", "Can I add an extra shot?", "ショットを追加できますか？"],["p1925", "No whipped cream, please.", "ホイップクリームはなしでお願いします。"],["p1926", "Is it possible to get it decaf?", "カフェインレスにできますか？"],["p1927", "I'll have it in my own cup.", "自分のカップに入れてください。"],["p1928", "This is exactly how I like it.", "まさにこれが好みの味です。"]],
  r:[["What can I get for you today?", 0],["This one is pretty sweet. Is that okay?", 1],["Would you like whipped cream on top?", 4]],
  c:{sit:"カフェでいつもの一杯を頼む",t:[["Hi! What would you like?", 0],["Sure. Anything else?", 3],["Here you go. How is it?", 7]]}},
 {t:"第二百四十二歩 ペットを預ける",d:"ペットホテルに預ける",p:[
  ["p1929", "I'd like to board my dog for three nights.", "犬を三泊預けたいです。"],["p1930", "He's a little shy at first.", "最初は少し人見知りします。"],["p1931", "He eats twice a day.", "一日二回ごはんを食べます。"],["p1932", "Here's his food and his favorite toy.", "これがごはんとお気に入りのおもちゃです。"],["p1933", "He needs his medicine in the morning.", "朝に薬が必要です。"],["p1934", "Could you send me a photo sometimes?", "ときどき写真を送ってもらえますか？"],["p1935", "What time can I pick him up?", "何時に迎えに行けますか？"],["p1936", "Thank you for taking such good care of him.", "よく面倒を見てくださってありがとうございます。"]],
  r:[["How long will he be staying with us?", 0],["Does he get along with other dogs?", 1],["Anything special we should know about him?", 4]],
  c:{sit:"ペットホテルの受付で話す",t:[["Hello! Who do we have here?", 0],["He's so cute. How often does he eat?", 2],["Got it. Anything else we should know?", 4]]}},
 {t:"第二百四十三歩 スマホ修理",d:"スマホを修理に出す",p:[
  ["p1937", "My screen is cracked.", "画面が割れています。"],["p1938", "The battery dies really fast.", "電池の減りがとても早いです。"],["p1939", "It won't charge anymore.", "もう充電できません。"],["p1940", "Will I lose my data?", "データは消えますか？"],["p1941", "How much will the repair cost?", "修理代はいくらかかりますか？"],["p1942", "Is it still under warranty?", "まだ保証期間内ですか？"],["p1943", "Can I get a replacement phone while I wait?", "待っているあいだ代わりのスマホを借りられますか？"],["p1944", "I backed up everything last night.", "昨夜、全部バックアップしました。"]],
  r:[["What seems to be the problem with your phone?", 0],["We might need to reset the phone.", 3],["Did you save your photos somewhere?", 7]],
  c:{sit:"携帯ショップの修理窓口で",t:[["Hi. How can I help you today?", 0],["I see. We need to replace the screen.", 4],["About one hundred dollars. It takes three days.", 6]]}},
 {t:"第二百四十四歩 解約",d:"契約やサブスクを解約する",p:[
  ["p1945", "I'd like to cancel my membership.", "会員を解約したいです。"],["p1946", "I'm moving to another city.", "別の町に引っ越すんです。"],["p1947", "I don't use it enough.", "あまり使っていないんです。"],["p1948", "Is there a cancellation fee?", "解約手数料はかかりますか？"],["p1949", "When will the last payment be?", "最後の支払いはいつですか？"],["p1950", "No thanks, I've already decided.", "いいえ、もう決めましたので。"],["p1951", "Could you confirm by email?", "メールで確認をいただけますか？"],["p1952", "Thanks for everything.", "いろいろありがとうございました。"]],
  r:[["May I ask why you're leaving?", 1],["How about half price for three months?", 5],["Okay, it's canceled. Anything else?", 6]],
  c:{sit:"スポーツジムの受付で",t:[["Good morning. How can I help?", 0],["Oh, I'm sorry to hear that. Can I ask why?", 2],["I understand. We can give you one free month.", 5]]}},
 {t:"第二百四十五歩 ネタバレ注意",d:"ネタバレに気をつけて話す",p:[
  ["p1953", "No spoilers, please!", "ネタバレなしでお願い！"],["p1954", "I haven't seen the last episode yet.", "最終話はまだ見ていません。"],["p1955", "Don't tell me how it ends.", "どう終わるか言わないで。"],["p1956", "I'll just say it's worth watching.", "見る価値がある、とだけ言っておくね。"],["p1957", "You won't believe the ending.", "結末は信じられないと思うよ。"],["p1958", "Let me know when you finish it.", "見終わったら教えてね。"],["p1959", "I watched the whole season in two days.", "シーズン全部を二日で見ました。"],["p1960", "Who's your favorite character?", "好きな登場人物はだれ？"]],
  r:[["Did you hear what happened to the main character?", 0],["So, was the new season good?", 3],["I finally finished the series!", 7]],
  c:{sit:"同僚と人気ドラマの話をする",t:[["Did you watch the final episode last night? It was crazy!", 0],["Okay, okay. But how far are you?", 1],["Then hurry up! I want to talk about it.", 5]]}},
 {t:"第二百四十六歩 お祭り",d:"お祭りに参加する",p:[
  ["p1961", "What's this festival celebrating?", "このお祭りは何を祝っているんですか？"],["p1962", "The parade starts at six.", "パレードは六時に始まります。"],["p1963", "Let's try some street food.", "屋台の食べ物を食べてみよう。"],["p1964", "It's really crowded tonight.", "今夜はすごく混んでるね。"],["p1965", "Let's stay together.", "はぐれないようにしよう。"],["p1966", "Can I join the dance?", "踊りに参加してもいいですか？"],["p1967", "The fireworks were incredible.", "花火がすごかった。"],["p1968", "Let's come again next year.", "来年もまた来よう。"]],
  r:[["Look at all these people!", 4],["Everyone is dancing in a circle.", 5],["Wow, that was the last firework.", 6]],
  c:{sit:"夏祭りの夜、友人と歩く",t:[["Wow, look at all the lanterns!", 0],["There are so many food stalls!", 2],["The fireworks are about to start.", 4]]}},
 {t:"第二百四十七歩 釣り",d:"釣りに出かける",p:[
  ["p1969", "Have you ever been fishing?", "釣りをしたことがありますか？"],["p1970", "We need to get up before sunrise.", "日の出前に起きなきゃ。"],["p1971", "I think I've got a bite!", "あたりが来たと思う！"],["p1972", "Pull it in slowly.", "ゆっくり引いて。"],["p1973", "It got away.", "逃げられた。"],["p1974", "Look at the size of this one!", "この大きさを見て！"],["p1975", "Let's let it go.", "放してあげよう。"],["p1976", "Patience is the key.", "忍耐が大事です。"]],
  r:[["My line is moving!", 3],["Oh no, the fish is gone.", 4],["This fish is too small to keep.", 6]],
  c:{sit:"友人を誘って湖で釣りをする",t:[["Nice lake! So, what are we doing today?", 0],["No, never. So what do I do?", 7],["Look, your line is moving!", 2]]}},
 {t:"第二百四十八歩 大雪",d:"大雪の日に予定を変える",p:[
  ["p1977", "It snowed all night.", "一晩中雪が降りました。"],["p1978", "The trains are delayed because of the snow.", "雪で電車が遅れています。"],["p1979", "Be careful, the roads are icy.", "気をつけて、道が凍っています。"],["p1980", "I'll work from home today.", "今日は在宅で仕事をします。"],["p1981", "School is closed today.", "今日は休校です。"],["p1982", "Let's build a snowman!", "雪だるまを作ろう！"],["p1983", "I need to shovel the snow.", "雪かきをしないと。"],["p1984", "Stay warm!", "あたたかくしてね！"]],
  r:[["Will you be coming to the office today?", 3],["Mom, do I have to go to school today?", 4],["There's so much snow in front of the door.", 6]],
  c:{sit:"大雪の朝、同僚に電話する",t:[["Hey, are you coming in today?", 1],["Yeah, it's bad. What will you do?", 3],["Good idea. Stay safe.", 2]]}},
 {t:"第二百四十九歩 停電",d:"停電のときに話す",p:[
  ["p1985", "The power just went out.", "いま停電しました。"],["p1986", "Do you have a flashlight?", "懐中電灯はある？"],["p1987", "Is it just our building?", "うちの建物だけかな？"],["p1988", "Let's check the news on my phone.", "スマホでニュースを見てみよう。"],["p1989", "Don't open the fridge.", "冷蔵庫は開けないで。"],["p1990", "We have candles somewhere.", "どこかにろうそくがあるよ。"],["p1991", "My phone battery is low.", "スマホの電池が少ない。"],["p1992", "The lights are back on!", "電気がついた！"]],
  r:[["Hey, why did everything go dark?", 0],["I can't see anything in the kitchen.", 1],["Should I get some ice cream from the freezer?", 4]],
  c:{sit:"夜、家族といるときに停電する",t:[["Whoa! What happened?", 0],["I can't see a thing!", 5],["Wait, I'm hungry. Can I get a snack from the fridge?", 4]]}},
 {t:"第二百五十歩 節目を祝う",d:"大きな節目を祝う",p:[
  ["p1993", "We made it!", "やりとげた！"],["p1994", "This calls for a celebration.", "これはお祝いしなきゃ。"],["p1995", "I couldn't have done it alone.", "一人ではできませんでした。"],["p1996", "Let's look back at how far we've come.", "ここまでの道のりをふり返ろう。"],["p1997", "Here's to the next chapter!", "次の章に乾杯！"],["p1998", "I'm so proud of you.", "あなたを誇りに思うよ。"],["p1999", "It's been quite a journey.", "長い道のりでした。"],["p2000", "The best is yet to come.", "最高の時はこれからです。"]],
  r:[["We finally reached two hundred and fifty steps!", 0],["Do you remember our first day?", 3],["What do you think the future holds?", 7]],
  c:{sit:"チームでプロジェクトの完成を祝う",t:[["It's done! The app is live!", 0],["Everyone worked so hard.", 2],["So, what's next for our team?", 7]]}},
 {t:"第二百五十一歩 オンライン授業",d:"オンライン授業で発言する",p:[
  ["p2001", "Can I share my screen?", "画面を共有してもいいですか？"],["p2002", "Sorry, I was on mute.", "すみません、ミュートになっていました。"],["p2003", "Could you repeat the question?", "質問をもう一度お願いできますか？"],["p2004", "I have a question about the homework.", "宿題について質問があります。"],["p2005", "I'll put my answer in the chat.", "答えをチャットに書きます。"],["p2006", "My connection is a bit slow.", "通信が少し遅いです。"],["p2007", "Can I turn my camera off for a minute?", "少しカメラを切ってもいいですか？"],["p2008", "Thank you for the class.", "授業をありがとうございました。"]],
  r:[["We can't hear you. Are you muted?", 1],["Okay, any questions before we finish?", 3],["Your video keeps stopping.", 5]],
  c:{sit:"オンライン英会話の授業で",t:[["Hello? Can you hear me?", 1],["Great. Now, could you present your slides?", 0],["Any questions before we finish?", 3]]}},
 {t:"第二百五十二歩 留守番",d:"家の留守番を頼む",p:[
  ["p2009", "Could you look after my place while I'm away?", "留守のあいだ、家を見ていてもらえる？"],["p2010", "Please water the plants every other day.", "植物に一日おきに水をやってね。"],["p2011", "The key is under the mat.", "鍵はマットの下だよ。"],["p2012", "Feel free to use the kitchen.", "台所は自由に使ってね。"],["p2013", "Please take in the mail.", "郵便物を取り込んでね。"],["p2014", "Here's my number in case of emergency.", "緊急のときのためにわたしの番号です。"],["p2015", "I'll be back on Sunday night.", "日曜の夜に戻ります。"],["p2016", "I'll bring you a souvenir.", "おみやげを買ってくるね。"]],
  r:[["Sure, I can stay at your place. What should I do?", 1],["How do I get in?", 2],["What if something happens?", 5]],
  c:{sit:"旅行前に友人に家を頼む",t:[["Sure, I'll stay at your place. Anything to do?", 1],["Okay. And where will I find the key?", 2],["Got it. When are you coming back?", 6]]}},
 {t:"第二百五十三歩 植物を育てる",d:"植物を育てる話",p:[
  ["p2017", "I'm growing tomatoes on my balcony.", "ベランダでトマトを育てています。"],["p2018", "They need a lot of sun.", "日光がたくさん必要です。"],["p2019", "Don't give it too much water.", "水をやりすぎないでね。"],["p2020", "The leaves are turning yellow.", "葉が黄色くなってきました。"],["p2021", "It's starting to bloom.", "花が咲き始めています。"],["p2022", "I planted the seeds in spring.", "春に種をまきました。"],["p2023", "Gardening helps me relax.", "園芸はリラックスになります。"],["p2024", "Do you want some herbs from my garden?", "うちの庭のハーブ、いる？"]],
  r:[["Do you have any hobbies at home?", 0],["Why is my plant dying? I water it every day.", 2],["Wow, look at these flowers!", 4]],
  c:{sit:"友人のベランダを見せてもらう",t:[["Your balcony is so green!", 0],["What's the secret?", 1],["This one looks sick, though.", 3]]}},
 {t:"第二百五十四歩 フリマ",d:"フリーマーケットで売る",p:[
  ["p2025", "Everything on this table is five dollars.", "このテーブルの物は全部五ドルです。"],["p2026", "It's in good condition.", "状態はいいですよ。"],["p2027", "I've only used it a few times.", "数回しか使っていません。"],["p2028", "I can give you a discount.", "割引できますよ。"],["p2029", "How about three for ten?", "三つで十ドルはどうですか？"],["p2030", "Sorry, that's already sold.", "すみません、それはもう売れました。"],["p2031", "Do you need a bag?", "袋はいりますか？"],["p2032", "Thanks for stopping by.", "寄ってくれてありがとう。"]],
  r:[["This lamp looks new. Is it?", 2],["That's a little expensive for me.", 3],["I'd like that blue jacket.", 5]],
  c:{sit:"フリーマーケットでお客さんと話す",t:[["How much is this vase?", 0],["That's a bit much. Could you go a little lower?", 3],["Okay, I'll take it.", 6]]}},
 {t:"第二百五十五歩 住む場所",d:"住みたい場所について話す",p:[
  ["p2033", "I'd love to live in the countryside someday.", "いつか田舎に住みたいです。"],["p2034", "City life is convenient.", "都会の生活は便利です。"],["p2035", "I need to be close to the station.", "駅の近くでないと困ります。"],["p2036", "I want a place with a garden.", "庭のある家がいいです。"],["p2037", "The rent in the city is too high.", "都会は家賃が高すぎます。"],["p2038", "I'd miss the restaurants.", "レストランが恋しくなると思います。"],["p2039", "Peace and quiet is important to me.", "静かで落ち着いていることが大事です。"],["p2040", "Maybe somewhere in between.", "その中間くらいがいいかも。"]],
  r:[["City or countryside, which do you prefer?", 7],["Why don't you move closer to downtown?", 4],["Would you really leave the city?", 5]],
  c:{sit:"友人と将来の住まいの話をする",t:[["Where do you see yourself living in ten years?", 0],["Really? Wouldn't you get bored?", 6],["I see. But what about work?", 7]]}},
 {t:"第二百五十六歩 散歩",d:"散歩を楽しむ",p:[
  ["p2041", "Let's go for a walk.", "散歩に行こう。"],["p2042", "It's a perfect day for a walk.", "散歩にぴったりの日だね。"],["p2043", "I try to walk ten thousand steps a day.", "一日一万歩歩くようにしています。"],["p2044", "Let's take the long way home.", "遠回りして帰ろう。"],["p2045", "I found a nice path by the river.", "川沿いにいい道を見つけたよ。"],["p2046", "Walking helps me think.", "歩くと考えがまとまります。"],["p2047", "Let's stop for a coffee.", "コーヒーで一休みしよう。"],["p2048", "My feet are getting tired.", "足が疲れてきた。"]],
  r:[["It's sunny and not too hot today.", 1],["Should we go home the usual way?", 3],["We've been walking for two hours!", 7]],
  c:{sit:"日曜の朝、友人をさそう",t:[["What should we do this morning?", 0],["Sure! Where should we go?", 4],["This is nice. I'm getting thirsty, though.", 6]]}},
 {t:"第二百五十七歩 ガイドツアー",d:"ツアーでガイドに質問する",p:[
  ["p2049", "How old is this building?", "この建物はどのくらい古いんですか？"],["p2050", "Who built it?", "だれが建てたんですか？"],["p2051", "Can we take photos inside?", "中で写真を撮ってもいいですか？"],["p2052", "What's the story behind this painting?", "この絵にはどんな話があるんですか？"],["p2053", "How long is the tour?", "ツアーはどのくらいかかりますか？"],["p2054", "Could you speak a little louder?", "もう少し大きな声で話していただけますか？"],["p2055", "Where should we meet after the break?", "休憩のあとはどこに集まればいいですか？"],["p2056", "That was fascinating. Thank you.", "とても興味深かったです。ありがとう。"]],
  r:[["This castle has a long history.", 0],["Please don't use your flash in here.", 2],["And that's the end of our tour!", 7]],
  c:{sit:"お城のガイドツアーに参加する",t:[["Hello, everyone! Our castle tour starts now.", 4],["About one hour. Any other questions?", 0],["Over four hundred years old!", 1]]}},
 {t:"第二百五十八歩 アップグレード",d:"ホテルで部屋のグレードアップを頼む",p:[
  ["p2057", "Is there any chance of an upgrade?", "アップグレードの可能性はありますか？"],["p2058", "It's our honeymoon.", "新婚旅行なんです。"],["p2059", "Could we have a room with a view?", "眺めのいい部屋にしてもらえますか？"],["p2060", "A higher floor would be great.", "高い階だとうれしいです。"],["p2061", "How much extra would that be?", "追加料金はいくらですか？"],["p2062", "We're happy to pay a little more.", "少し多めに払ってもかまいません。"],["p2063", "Could we check in early?", "早めにチェックインできますか？"],["p2064", "That's so kind of you.", "ご親切にありがとうございます。"]],
  r:[["Good evening! Is this a special trip for you?", 1],["We have a sea view room available.", 4],["I've upgraded you for free.", 7]],
  c:{sit:"ホテルのフロントでチェックインする",t:[["Good afternoon. Checking in?", 6],["Let me see. Yes, your room is ready.", 0],["Well, we do have a suite with a view.", 4]]}},
 {t:"第二百五十九歩 遅刻の連絡",d:"遅れることを連絡する",p:[
  ["p2065", "I'm running about ten minutes late.", "十分ほど遅れています。"],["p2066", "My train stopped between stations.", "電車が駅と駅の間で止まりました。"],["p2067", "Please start without me.", "先に始めていてください。"],["p2068", "I'm so sorry to keep you waiting.", "お待たせしてすみません。"],["p2069", "I'll be there as soon as I can.", "できるだけ早く行きます。"],["p2070", "Can I join online instead?", "かわりにオンラインで参加できますか？"],["p2071", "I left early, but traffic was terrible.", "早めに出たんですが、渋滞がひどくて。"],["p2072", "It won't happen again.", "二度とこのようなことはありません。"]],
  r:[["Hi, where are you? The meeting is about to start.", 0],["Should we wait for you?", 2],["You're late again.", 7]],
  c:{sit:"取引先との打ち合わせに遅れる",t:[["Hello? Are you on your way?", 0],["Oh no. What happened?", 1],["Don't worry. Should we start without you?", 2]]}},
 {t:"第二百六十歩 感謝の手紙",d:"感謝の手紙を読む",p:[
  ["p2073", "I wrote you a letter.", "あなたに手紙を書きました。"],["p2074", "I wanted to say thank you properly.", "ちゃんとお礼を言いたかったんです。"],["p2075", "You believed in me when I didn't.", "わたしが自分を信じられないとき、あなたは信じてくれました。"],["p2076", "Your words gave me courage.", "あなたの言葉が勇気をくれました。"],["p2077", "I'll never forget your kindness.", "あなたの優しさは決して忘れません。"],["p2078", "I hope I can do the same for someone.", "わたしもだれかに同じことができたらと思います。"],["p2079", "Please read it later.", "あとで読んでください。"],["p2080", "Thank you, from the bottom of my heart.", "心の底から、ありがとう。"]],
  r:[["What's this envelope?", 0],["Why are you giving me this?", 1],["I'm so moved. I don't know what to say.", 7]],
  c:{sit:"恩師のお別れ会で手紙を渡す",t:[["Oh? What's this?", 0],["You didn't have to do that.", 1],["Can I read it now?", 6]]}}

e a review tonight.", "今夜レビューを書くね。"], ["B", "Five stars from me too.", "ぼくも星五つだな。"]], "q": {"3": ["エマがこの店に来た理由は？", ["忙しい週のごほうび", "誕生日", "仕事の会議"]], "5": ["店の弱点は？", ["サービスが遅い", "料理がまずい", "高すぎる"]], "8": ["ケンの評価は？", ["星五つ", "星一つ", "まだ決めていない"]]}}, {"t": "雨の夜のタクシー", "d": "遅れそうな夜", "l": [["B", "To the station, please. Could you hurry?", "駅までお願いします。急いでもらえますか？"], ["A", "I'll try. It's raining, so the roads may be busy.", "やってみます。雨なので道が混んでいるかもしれません。"], ["B", "I hope not. My friend is waiting for me at dinner.", "混んでないといいな。友達が夕食を待ってるんです。"], ["A", "We're almost there. Shall I stop here?", "もうすぐです。ここで止めましょうか？"], ["B", "Yes, here is fine. Can I get a receipt?", "はい、ここで大丈夫です。領収書をもらえますか？"], ["A", "Of course. Here you are.", "もちろん。どうぞ。"], ["B", "Keep the change, please. Thank you!", "おつりはとっておいてください。ありがとう！"]], "q": {"3": ["ケンが急いでいる理由は？", ["友達が夕食を待っている", "飛行機に遅れそう", "会議がある"]], "5": ["ケンがほしいものは？", ["領収書", "傘", "地図"]], "7": ["ケンはおつりをどうした？", ["とっておいてもらった", "全部受け取った", "寄付した"]]}}, {"t": "歯が痛い日", "d": "歯医者と薬局", "l": [["A", "Ken, why are you holding your face?", "ケン、どうして顔を押さえてるの？"], ["B", "I have a toothache. It hurts when I eat something cold.", "歯が痛いんだ。冷たいものを食べると痛む。"], ["A", "You should see a dentist today.", "今日、歯医者に行ったほうがいいよ。"], ["B", "I'm a bit scared. Will it hurt?", "ちょっと怖いな。痛いかな？"], ["A", "Don't worry. It's probably a small cavity.", "心配しないで。たぶん小さな虫歯よ。"], ["B", "Okay, I'll go. Then I'll get some medicine at the pharmacy.", "わかった、行くよ。そのあと薬局で薬を買う。"], ["A", "Remember to ask how many to take.", "何錠飲めばいいか聞くのを忘れないでね。"]], "q": {"2": ["ケンの症状は？", ["冷たいものを食べると歯が痛い", "頭が痛い", "目がかゆい"]], "5": ["エマの予想は？", ["小さな虫歯", "骨折", "風邪"]], "7": ["エマが念を押したことは？", ["何錠飲むか聞く", "早く寝る", "水をたくさん飲む"]]}}, {"t": "新人の初日", "d": "仕事を教える", "l": [["A", "Welcome to the team, Ken. Let me show you around.", "チームへようこそ、ケン。中を案内するね。"], ["B", "Thank you. There's so much to remember.", "ありがとう。覚えることがたくさんあるね。"], ["A", "You'll get used to it. Don't hesitate to ask questions.", "すぐ慣れるよ。遠慮なく質問してね。"], ["B", "Could you look at my first report? Please be honest.", "最初の報告書を見てもらえる？正直に言ってね。"], ["A", "Overall, it's very good. Maybe you could add more details.", "全体的にとてもいいよ。もう少し詳しく書いてもいいかも。"], ["B", "Thanks for the advice. I'll fix it right away.", "アドバイスありがとう。すぐ直すよ。"], ["A", "Also, could you prepare the slides for Friday?", "それと、金曜日のスライドを用意してくれる？"], ["B", "Sure, I can do that. Consider it done.", "もちろん。任せて。"]], "q": {"3": ["エマが言ったことは？", ["遠慮なく質問して", "質問しないで", "明日来て"]], "6": ["報告書へのアドバイスは？", ["もっと詳しく書く", "短くする", "英語で書く"]], "8": ["ケンの返事の意味は？", ["任せて、やっておく", "できない", "考えておく"]]}}, {"t": "ふり返りの夜", "d": "ここまでの道", "l": [["B", "Looking back, I've grown a lot this year.", "ふり返ると、今年はとても成長したよ。"], ["A", "I agree. At first, you couldn't say anything in English.", "そうね。最初は英語で何も言えなかったもの。"], ["B", "Now I can have real conversations.", "今はちゃんと会話ができる。"], ["A", "What was the hardest part?", "いちばん大変だったのは？"], ["B", "Listening. But practicing every day really helped.", "聞き取り。でも毎日の練習が本当に役立った。"], ["A", "I'm glad you didn't give up.", "あきらめなくてよかったね。"], ["B", "Me too. I'm curious about what's next.", "ぼくも。次に何が来るか楽しみだ。"], ["A", "Let's keep going together.", "これからも一緒に進もう。"]], "q": {"3": ["最初のケンはどうだった？", ["英語で何も言えなかった", "英語がぺらぺらだった", "日本語が話せなかった"]], "5": ["いちばん大変だったことは？", ["聞き取り", "書くこと", "発音"]], "8": ["最後の二人の気持ちは？", ["一緒に進もう", "もうやめよう", "別々に学ぼう"]]}},{"t": "湖のキャンプ", "d": "星空の夜", "l": [["A", "Ken, can you help me set up the tent?", "ケン、テントを張るのを手伝ってくれる？"], ["B", "Sure. But where are the poles?", "いいよ。でもポールはどこ？"], ["A", "Oh no. I think I left them in the car.", "しまった。車に置いてきたみたい。"], ["B", "No problem. I'll go get them.", "大丈夫。取ってくるよ。"], ["A", "While you're gone, I'll start the fire.", "そのあいだに火をおこしておくね。"], ["B", "Okay. And don't forget the bug spray this time!", "わかった。今回は虫よけを忘れないでね！"], ["A", "Ha ha. Look up, Ken. The stars are amazing.", "あはは。上を見て、ケン。星がすごいよ。"], ["B", "Wow. We can't see this in the city.", "わあ。都会ではこんなの見られないね。"]], "q": {"3": ["テントのポールはどこにあった？", ["車の中", "湖のそば", "家"]], "5": ["ケンが取りに行くあいだ、エマは何をする？", ["火をおこす", "料理を作る", "寝る"]], "8": ["二人は何に感動した？", ["星空", "湖の魚", "たき火の音"]]}},{"t": "合わないセーター", "d": "返品と交換", "l": [["B", "Excuse me. I'd like to return this sweater.", "すみません。このセーターを返品したいのですが。"], ["A", "Of course. What's the problem with it?", "かしこまりました。どうなさいましたか？"], ["B", "It was a gift, but it doesn't fit.", "プレゼントだったんですが、サイズが合わなくて。"], ["A", "Do you have the receipt?", "レシートはお持ちですか？"], ["B", "No, but I have the gift receipt.", "いいえ、でもギフトレシートがあります。"], ["A", "That works. Would you like a refund or an exchange?", "それで大丈夫です。返金と交換、どちらになさいますか？"], ["B", "An exchange, please. Do you have a larger size?", "交換でお願いします。大きいサイズはありますか？"], ["A", "Yes, here you go. The fitting room is over there.", "はい、どうぞ。試着室はあちらです。"]], "q": {"3": ["なぜ返品したい？", ["サイズが合わない", "色がきらい", "こわれていた"]], "5": ["ケンは何を持っていた？", ["ギフトレシート", "普通のレシート", "何も持っていない"]], "8": ["ケンはどうすることにした？", ["大きいサイズと交換", "返金してもらう", "そのまま持って帰る"]]}},{"t": "人ごみの駅", "d": "待ち合わせ", "l": [["A", "Ken, I'm at the station. Where are you?", "ケン、駅に着いたよ。どこにいる？"], ["B", "I'm at the north exit, next to the flower shop.", "北口の花屋のとなりにいるよ。"], ["A", "Hmm, I'm at the north exit too, but I can't find you.", "うーん、わたしも北口にいるけど見つからない。"], ["B", "What are you wearing?", "どんな服着てる？"], ["A", "A yellow coat and a big hat.", "黄色いコートと大きな帽子。"], ["B", "Wait, are you by the bakery? Turn around!", "待って、パン屋のそば？ふり向いて！"], ["A", "There you are! Sorry, there are so many people.", "いた！ごめん、人がすごく多くて。"], ["B", "No worries. Let's go before the movie starts.", "気にしないで。映画が始まる前に行こう。"]], "q": {"2": ["ケンはどこにいた？", ["北口の花屋のとなり", "南口の改札", "パン屋の中"]], "5": ["エマの服装は？", ["黄色いコートと大きな帽子", "赤いマフラー", "黒いジャケット"]], "8": ["二人はこれから何をする？", ["映画を見る", "買い物をする", "家に帰る"]]}},{"t": "スピーチの日", "d": "わたしの物語", "l": [["A", "Are you nervous about your speech, Ken?", "スピーチ、緊張してる？ケン。"], ["B", "A little. It's my first speech in English.", "少しね。英語でスピーチするのは初めてなんだ。"], ["A", "What are you going to talk about?", "何について話すの？"], ["B", "My story. How I started learning English and why.", "自分の話。どうして、どうやって英語を始めたか。"], ["A", "That sounds great. Just speak slowly and smile.", "すてきね。ゆっくり話して、笑顔でね。"], ["B", "Okay. Wish me luck.", "わかった。うまくいくように祈ってて。"], ["A", "You did it, Ken! Everyone loved your speech.", "やったね、ケン！みんなスピーチを気に入ってたよ。"], ["B", "I'm proud of how far I've come. What's next for us?", "ここまで来られて誇らしい。次は何をしよう？"]], "q": {"2": ["ケンの気持ちは？", ["少し緊張している", "まったく平気", "とても眠い"]], "4": ["スピーチのテーマは？", ["英語を学んだ自分の話", "好きな映画", "旅行の計画"]], "8": ["スピーチの結果は？", ["みんなに喜ばれた", "失敗した", "中止になった"]]}},{"t": "市場の値切り", "d": "古い時計", "l": [["A", "Look at this old watch, Ken. Isn't it beautiful?", "見て、ケン、この古い時計。きれいじゃない？"], ["B", "It is. How much is it?", "本当だ。いくら？"], ["A", "The sign says ninety dollars. That's a lot.", "札には九十ドルって書いてある。高いな。"], ["B", "Let me try. Excuse me, can you do any better?", "やってみるよ。すみません、もう少し安くなりませんか？"], ["A", "He says seventy, if we pay in cash.", "現金なら七十ドルでいいって。"], ["B", "What if we buy the small clock too?", "小さい置き時計も買ったらどうかな？"], ["A", "Both for one hundred! You're really good at this, Ken.", "二つで百ドルだって！ケン、うまいね。"], ["B", "It's a deal. My grandfather taught me.", "それで決まり。祖父に教わったんだ。"]], "q": {"3": ["時計の最初の値段は？", ["九十ドル", "七十ドル", "百ドル"]], "5": ["七十ドルになる条件は？", ["現金で払う", "二つ買う", "明日来る"]], "8": ["ケンは値切りをだれに教わった？", ["祖父", "エマ", "店の人"]]}},{"t": "真夜中の水もれ", "d": "大家さんへの電話", "l": [["B", "Emma, wake up. There's water on the kitchen floor.", "エマ、起きて。台所の床に水がたまってる。"], ["A", "Oh no! Where is it coming from?", "うそ！どこから来てるの？"], ["B", "There's a leak under the sink.", "流しの下が水もれしてる。"], ["A", "I'll turn off the water. You call the landlord.", "水を止めるね。大家さんに電話して。"], ["B", "Hello, Mr. Brown? Sorry to call so late.", "もしもし、ブラウンさん？夜遅くにすみません。"], ["A", "What did he say?", "何て言ってた？"], ["B", "A plumber will come at nine tomorrow morning.", "明日の朝九時に配管工が来るって。"], ["A", "Good. Let's put some towels down and go back to bed.", "よかった。タオルを敷いて、寝直そう。"]], "q": {"3": ["水はどこからもれていた？", ["流しの下", "天井", "お風呂"]], "5": ["エマは何をする？", ["水を止める", "大家に電話する", "タオルを買いに行く"]], "8": ["配管工はいつ来る？", ["明日の朝九時", "今すぐ", "来週"]]}},{"t": "誤解の夜", "d": "言葉のすれちがい", "l": [["A", "Ken, why d const AUD={},AUDL={};
ALL.concat(VARS).forEach(a=>AUD[a.en]=a.id);
STORIES.forEach((st,n)=>st.l.forEach((l,k)=>AUDL[l[1]]=`s${n}_${k}`));
UNITS.forEach((u,i)=>{u.r.forEach((r,k)=>AUDL[r[0]]=`r${i}_${k}`);if(u.c)u.c.t.forEach((t,k)=>AUDL[t[0]]=`c${i}_${k}`)});
let audOk=false,audFail=0,noAudio=false,enVoice=null;
function pickVoice(){ // 端末の読み上げを使う場合は、英語の声を明示的に選ぶ（日本語の声で英語を読ませない）
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const score=v=>(/^en[-_]US/i.test(v.lang)?4:0)+(/Samantha|Ava|Allison|Google US English|Aria|Jenny|Natural|Enhanced|Premium/i.test(v.name)?3:0)-(/compact|espeak/i.test(v.name)?3:0);
    enVoice=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){enVoice=null}
}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
let slowOnce=false; // 🐢ボタン：次の1回だけゆっくり再生
function tts(t){try{if(!enVoice)pickVoice();const u=new SpeechSynthesisUtterance(t);if(enVoice)u.voice=enVoice;u.lang=enVoice?enVoice.lang:"en-US";u.rate=slowOnce?.6:S.rate==="slow"?.7:.9;slowOnce=false;speechSynthesis.speak(u)}catch(e){}}
function speak(t,line){
  if(recState==="rec"||recState==="pending")return;
  try{player.pause();if(voice)voice.pause();speechSynthesis.cancel()}catch(e){}
  const key=line?AUDL[t]||AUD[t]:AUD[t]||AUDL[t];
  if(!key||!voice||noAudio)return tts(t);
  try{
    voice.src="audio/"+key+".mp3?v=4";voice.playbackRate=slowOnce?.7:S.rate==="slow"?.8:1;if(voice.preservesPitch!==undefined)voice.preservesPitch=true;slowOnce=false;
    const pr=voice.play();
    if(pr&&pr.then)pr.then(()=>{audOk=true},e=>{if(e&&e.name==="AbortError")return;if(e&&e.name==="NotAllowedError")return; // 途中で次の音声に切り替えた／自動再生が止められた
      audFail++;if(!audOk&&audFail>=2)noAudio=true;tts(t)}); // ファイルが無い環境では端末の読み上げに切り替える
  }catch(e){tts(t)}

function hello(nDue,next){const h=hello0(nDue,next);return S.nm&&Object.keys(S.rev).length?`${esc(S.nm)}さん、${h}`:h}
function hello0(nDue,next){ // 案内役のひとこと（学習の状況に合わせる）
  if(!Object.keys(S.rev).length)return "はじめまして。案内役のすずねです。最初の一歩を、いっしょに踏み出しましょう。";
  if(nDue)return `おかえりなさい。今日は${nDue}件、前に言えた文を確かめましょう。忘れかけた頃がいちばん身につきます。`;
  if(S.dayXp>=goal())return "今日の目標は達成です。よくがんばりましたね。続きは明日でも大丈夫ですよ。";
  if(next<0)return "すべての歩みを歩ききりましたね。6秒チャレンジで、口の速さを磨きましょう。";
  if(S.streak>=3)return `${S.streak}日連続ですね。その積み重ねが、いちばんの力になります。`;
  return "今日も3分だけ、声に出してみましょう。小さな一歩で十分です。";
}

  return [["first","🌒","最初の一歩","歩みを1つクリア",u>=1],["u5","🌓","五つの歩み","歩みを5つクリア",u>=5],["u10","🌔","十の歩み","歩みを10クリア",u>=10],["u20","🌕","二十の歩み","歩みを20クリア",u>=20],["u40","🌖","四十の歩み","歩みを40クリア",u>=40],["uall","🌝","満月",`全${UNITS.length}の歩みをクリア`,u>=UNITS.length],
    ["s3","🔥","三日つづけた","3日連続で学習",st>=3],["s7","🔥","一週間","7日連続で学習",st>=7],["s30","🔥","ひと月","30日連続で学習",st>=30],
    ["p50","📖","50の言葉","50文を学習",r>=50],["p100","📚","100の言葉","100文を学習",r>=100],["p160","🏛","160の言葉","160文を学習",r>=160],["p320","🏯","320の言葉","320文を学習",r>=320],["p480","🗻","480の言葉","480文を学習",r>=480],

function story(n){ // 1行ずつ読み進め、決まった所で理解クイズ

  let card="",foot="";
