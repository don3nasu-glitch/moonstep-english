  ["p5361", "Takoyaki are batter balls with octopus inside.", "たこ焼きはタコが入った生地の玉だよ。"],["p5362", "Yakisoba is fried noodles with sweet sauce.", "焼きそばは甘めのソースで炒めた麺だよ。"],["p5363", "Shaved ice comes with colorful syrup on top.", "かき氷はカラフルなシロップがかかってるよ。"],["p5364", "Candied apples are mostly for the photos.", "りんご飴はほとんど写真映えのためだね。"],["p5365", "Bring cash; most stalls don't take cards.", "現金を持ってきて。ほとんどの屋台はカードが使えないから。"],["p5366", "Goldfish scooping is harder than it looks.", "金魚すくいは見た目より難しいよ。"],["p5367", "Let's share a few things and keep walking.", "いくつか分けて食べながら歩こう。"],["p5368", "The paper scoop tears if you rush.", "焦るとポイの紙が破れるよ。"]],
  r:[["What are those round things on the grill?", 0],["Can I pay with my card here?", 4],["Those kids are trying to catch fish with paper!", 5]],
  c:{sit:"夜店の並ぶ参道で、友人が屋台を指さして尋ねる",t:[["Those noodles smell amazing. What are they?", 1],["What's that mountain of ice with red syrup?", 2],["Any tips before I try catching a goldfish?", 7]]}},
 {t:"第六百七十二歩 おせち料理を説明する",d:"正月に家へ招いた友人に、おせち料理の意味を説明する",p:[
  ["p5369", "Osechi is our traditional New Year's food.", "おせちはお正月の伝統料理だよ。"],["p5370", "It's packed in stacked lacquer boxes.", "重ねた漆塗りの重箱に詰めるんだ。"],["p5371", "Every dish carries a wish for the year.", "どの料理にもその年への願いが込められてるの。"],["p5372", "Shrimp stand for living a long life.", "エビは長生きを表すんだ。"],["p5373", "Black beans are for health and hard work.", "黒豆は健康とまめに働けるようにという意味。"],["p5374", "Herring roe is a wish for many children.", "数の子は子孫繁栄の願いだよ。"],["p5375", "We make it ahead to rest from cooking.", "料理を休めるように前もって作っておくの。"],["p5376", "Not every dish suits everyone's taste.", "全部の料理が誰の口にも合うわけじゃないけどね。"]],
  r:[["How is osechi usually served?", 1],["Why does the shrimp get such a special spot?", 3],["So nobody cooks during the New Year?", 6]],
  c:{sit:"元日の食卓で、友人が色とりどりの重箱をのぞきこむ",t:[["What's the meaning behind all these dishes?", 2],["What are these little black beans for?", 4],["What are these crunchy yellow things?", 5]]}},
 {t:"第六百七十三歩 神社とお寺の違い",d:"観光中の友人に、神社とお寺の違いとお参りの作法を説明する",p:[
  ["p5377", "Shrines are Shinto, and temples are Buddhist.", "神社は神道で、お寺は仏教なの。"],["p5378", "A torii gate means you're at a shrine.", "鳥居があれば神社だよ。"],["p5379", "Rinse your hands at the water basin first.", "まず手水舎で手を清めてね。"],["p5380", "Visiting a shrine? Bow twice, then clap twice.", "神社では二回お辞儀して二回手をたたくの。"],["p5381", "Then finish with one more deep bow.", "最後にもう一度深くお辞儀するの。"],["p5382", "At temples, just put your palms together quietly.", "お寺では静かに手を合わせるだけだよ。"],["p5383", "Try not to walk down the very center.", "参道の真ん中はなるべく歩かないでね。"],["p5384", "People wave the incense smoke over themselves.", "お線香の煙を体にあおぐ人もいるよ。"]],
  r:[["How can I tell if this is a shrine or a temple?", 1],["Should I clap here at the temple too?", 5],["Is it okay to walk right down the middle of the path?", 6]],
  c:{sit:"鳥居の前で、参拝の仕方を知りたがる友人と話す",t:[["Wait, what's the actual difference between them?", 0],["What do I do at that fountain with the ladles?", 2],["Okay, I bowed twice and clapped twice. Now what?", 4]]}},
 {t:"第六百七十四歩 冬にマスクをする理由",d:"冬の通勤電車でマスク姿が多いことを不思議がる友人に説明する",p:[
  ["p5385", "Masks keep your throat from drying out.", "マスクをするとのどが乾燥しにくいの。"],["p5386", "Winter air here gets really dry.", "ここの冬の空気はすごく乾燥するんだ。"],["p5387", "It honestly keeps my face warm, too.", "正直、顔が暖かいっていうのもあるよ。"],["p5388", "Some people wear them to skip makeup.", "メイクを省くためにつける人もいるよ。"],["p5389", "It gives you a bit of privacy, too.", "ちょっとしたプライバシーにもなるんだ。"],["p5390", "Nobody here finds it strange at all.", "ここでは誰も変だと思わないよ。"],["p5391", "It just became a habit for many people.", "多くの人にとって単に習慣になったんだ。"],["p5392", "Shops sell them in every size and color.", "お店ではいろんなサイズや色のが売ってるよ。"]],
  r:[["Why is half the train wearing masks in winter?", 0],["Will people think I'm weird if I wear one?", 5],["My friend says she wears one on lazy mornings.", 3]],
  c:{sit:"ドラッグストアの売り場で、マスクを手に取る友人と話す",t:[["My lips crack the moment winter starts here.", 1],["Wearing that outside must feel stuffy.", 2],["I need one, but these all look so plain.", 7]]}},
 {t:"第六百七十五歩 粗大ごみの出し方",d:"古いソファを捨てたい友人に、粗大ごみの出し方を説明する",p:[
  ["p5393", "Big furniture counts as oversized garbage.", "大きな家具は粗大ごみになるんだ。"],["p5394", "You have to book a pickup first.", "まず回収の予約をしないといけないの。"],["p5395", "Call the city or apply online.", "市に電話するかネットで申し込んでね。"],["p5396", "You pay with a sticker from the konbini.", "料金はコンビニで買う処理券で払うの。"],["p5397", "Stick it where the collectors can see it.", "回収の人から見える場所に貼ってね。"],["p5398", "Put it out on the morning they tell you.", "指定された日の朝に出してね。"],["p5399", "Electronics like TVs follow different rules.", "テレビなどの家電は別のルールなんだ。"],["p5400", "Maybe someone online wants it for free.", "ネットで無料でほしい人がいるかもよ。"]],
  r:[["Can I just leave this old sofa by the trash spot?", 1],["I booked a pickup. Do I pay the collectors in cash?", 3],["What about my broken TV?", 6]],
  c:{sit:"引っ越し前の部屋で、大きな家具を前に友人と相談する",t:[["How do I even contact them to arrange it?", 2],["Where should I put the sticker on the sofa?", 4],["When do I actually carry it outside?", 5]]}},
 {t:"第六百七十六歩 駅員さんの指差し確認",d:"ホームで駅員が指を差して声を出す姿を見た友人に、その意味を説明する",p:[
  ["p5401", "It's called pointing and calling.", "指差喚呼っていうんだよ。"],["p5402", "They point and say each check out loud.", "一つずつ指を差して声に出して確認するの。"],["p5403", "It helps them avoid careless mistakes.", "うっかりミスを防ぐのに役立つんだ。"],["p5404", "Factories and construction sites use it too.", "工場や工事現場でも使われてるよ。"],["p5405", "It looks funny, but it really works.", "変に見えるけど、本当に効果があるんだ。"],["p5406", "Train staff also bow when leaving the car.", "乗務員は車両を出るときにもお辞儀するんだ。"],["p5407", "They bow to show respect to passengers.", "乗客への敬意を示すためにお辞儀するの。"],["p5408", "I started doing it when locking my door.", "家の鍵を閉めるときに私もやり始めたの。"]],
  r:[["Why is that guy pointing at nothing and shouting?", 0],["That seems a little theatrical, doesn't it?", 4],["The conductor bowed at the door before leaving!", 6]],
  c:{sit:"新幹線のホームで、指を差す駅員を見ながら友人と話す",t:[["So what's the point of saying it aloud?", 2],["Only train staff do that, right?", 3],["Have you ever tried it yourself?", 7]]}},
 {t:"第六百七十七歩 漫画喫茶のしくみ",d:"終電を逃した友人に、漫画喫茶の使い方を説明する",p:[
  ["p5409", "You pay by the hour, not the visit.", "回数じゃなくて時間で払うの。"],["p5410", "Night packs are cheaper than a hotel.", "ナイトパックはホテルより安いよ。"],["p5411", "You'll need ID for a membership card.", "会員カードを作るのに身分証が必要だよ。"],["p5412", "Soft drinks are free and unlimited.", "ドリンクバーは飲み放題だよ。"],["p5413", "You get a small private booth.", "小さな個室ブースが使えるよ。"],["p5414", "Some places even have showers.", "シャワーがある店まであるよ。"],["p5415", "Keep your voice down in the booths.", "ブースでは声を小さくしてね。"],["p5416", "Shelves of manga cover the whole wall.", "壁一面に漫画の棚が並んでるんだ。"]],
  r:[["I missed the last train. Any cheap place to wait?", 1],["Can I just walk in without signing up?", 2],["I really need to freshen up before work tomorrow.", 5]],
  c:{sit:"漫画喫茶の受付前で、料金表を見ている友人と話す",t:[["How does the pricing work here?", 0],["So will I have some privacy?", 4],["Can I take a phone call in my booth?", 6]]}},
 {t:"第六百七十八歩 カプセルホテルのチェックイン",d:"カプセルホテルに初めて泊まる友人に、チェックインの流れを説明する",p:[
  ["p5417", "Take your shoes off at the entrance.", "入口で靴を脱いでね。"],["p5418", "Hand your shoe key to the front desk.", "靴箱の鍵はフロントに預けるの。"],["p5419", "They'll give you a key on a wristband.", "リストバンド付きの鍵をもらえるよ。"],["p5420", "Your suitcase goes in a big locker.", "スーツケースは大きなロッカーに入れるの。"],["p5421", "Floors are usually split by gender.", "階はたいてい男女で分かれてるよ。"],["p5422", "The capsule has a blind, not a lock.", "カプセルには鍵じゃなくてブラインドがあるの。"],["p5423", "Quiet hours are taken very seriously.", "静かにする時間はとても厳しく守られてるよ。"],["p5424", "Pajamas and towels are usually provided.", "パジャマとタオルはたいてい用意されてるよ。"]],
  r:[["What do I do with my shoes?", 0],["Can I lock my capsule at night?", 5],["I didn't pack anything to sleep in.", 7]],
  c:{sit:"カプセルホテルのフロントで、チェックインの手続きをしながら話す",t:[["They took my shoe key. What do I get instead?", 2],["Where do I leave my suitcase?", 3],["Will we be sleeping on the same floor?", 4]]}},
 {t:"第六百七十九歩 和の朝ごはんを説明する",d:"旅館の朝食の席で、友人に和朝食の品を説明する",p:[
  ["p5425", "A Japanese breakfast is light but filling.", "和朝食は軽いけど腹持ちがいいの。"],["p5426", "Rice and miso soup are the base.", "ご飯と味噌汁が基本なの。"],["p5427", "The grilled fish is usually salted salmon.", "焼き魚はたいてい塩鮭だよ。"],["p5428", "Natto is fermented soybeans. Stir it well.", "納豆は発酵した大豆だよ。よく混ぜてね。"],["p5429", "Wrap some rice in the seaweed.", "海苔でご飯を巻いてね。"],["p5430", "Pickles help cleanse your palate.", "漬物は口の中をさっぱりさせてくれるよ。"],["p5431", "The rolled omelet is slightly sweet.", "卵焼きはほんのり甘いよ。"],["p5432", "Lots of families just have toast these days.", "最近はトーストだけの家も多いけどね。"]],
  r:[["What are these sticky beans?", 3],["What's the yellow thing that looks like a roll?", 6],["So you have this every single morning at home?", 7]],
  c:{sit:"朝の和食定食屋で、友人とお盆の上の料理を見ながら話す",t:[["Which dishes are on every breakfast table?", 1],["What kind of fish is this, usually?", 2],["What do I do with these dark crispy sheets?", 4]]}},
 {t:"第六百八十歩 はんこ文化を説明する",d:"日本で部屋を借りる友人に、はんこの役割を説明する",p:[
  ["p5433", "A hanko is a personal name stamp.", "はんこは名前の入った個人の印鑑なの。"],["p5434", "We use it instead of signing.", "サインの代わりに使うんだ。"],["p5435", "Banks often ask for a registered seal.", "銀行では届け出た印鑑を求められることが多いよ。"],["p5436", "Big contracts need your official seal.", "大きな契約には実印が必要なの。"],["p5437", "Press it straight down with red ink.", "朱肉をつけてまっすぐ押してね。"],["p5438", "You can order one with your name in katakana.", "カタカナの名前で作ってもらえるよ。"],["p5439", "Lots of paperwork has gone digital now.", "今は多くの手続きがデジタルになったよ。"],["p5440", "Keep it somewhere safe, like a passport.", "パスポートみたいに大事にしまっておいてね。"]],
  r:[["The landlord asked me to bring a stamp. What's that?", 0],["I don't have a Japanese name. Can I still get one?", 5],["Surely everything is online by now?", 6]],
  c:{sit:"はんこ屋の店先で、友人と見本を眺めながら話す",t:[["So why not just sign your name?", 1],["I'm buying an apartment. Which stamp do I need?", 3],["How do I stamp it without smudging?", 4]]}},
 {t:"第六百八十一歩 年賀状の習慣",d:"年末に年賀状を書いている理由を、友人に説明する",p:[
  ["p5441", "Nengajo are New Year's greeting cards.", "年賀状は新年のあいさつ状だよ。"],["p5442", "They all arrive on New Year's Day.", "全部元日に届くんだ。"],["p5443", "Mail them by late December to make it.", "間に合わせるには十二月下旬までに出してね。"],["p5444", "Official cards come with a lottery number.", "郵便局の年賀はがきにはくじの番号がついてるの。"],["p5445", "People add a short handwritten message.", "手書きのひとことを添えるの。"],["p5446", "The year's zodiac animal is a popular design.", "その年の干支の絵柄が人気だよ。"],["p5447", "Lots of people just send messages online now.", "今はネットでメッセージを送るだけの人も多いよ。"],["p5448", "Skip anyone whose family is in mourning.", "喪中の人には送らないでね。"]],
  r:[["When do these cards get delivered?", 1],["Why does this card have numbers at the bottom?", 3],["What should I draw on mine?", 5]],
  c:{sit:"郵便局の近くで、年賀はがきの束を手にした友人と話す",t:[["So what are these cards for exactly?", 0],["When's the deadline to send them?", 2],["My card feels too plain with just the printed text.", 4]]}},
 {t:"第六百八十二歩 日本の制服と部活",d:"学園アニメを見た友人に、日本の制服と部活について説明する",p:[
  ["p5449", "Most junior high students wear uniforms.", "ほとんどの中学生は制服を着るよ。"],["p5450", "Sailor uniforms and blazers are the classics.", "セーラー服とブレザーが定番なんだ。"],["p5451", "We switch to summer uniforms in June.", "六月に夏服に替わるの。"],["p5452", "Club activities happen almost every day.", "部活はほぼ毎日あるの。"],["p5453", "My club practiced even on weekends.", "私の部は週末も練習してたよ。"],["p5454", "Seniors and juniors have a strict hierarchy.", "先輩と後輩の上下関係が厳しいの。"],["p5455", "Students clean the classrooms themselves.", "生徒が自分たちで教室を掃除するの。"],["p5456", "Honestly, anime makes it look glamorous.", "正直、アニメは美化しすぎだよ。"]],
  r:[["So everyone really wears a uniform to school?", 0],["How often did your club meet?", 3],["Who cleans the school, then? Janitors?", 6]],
  c:{sit:"学校の前を通りかかり、制服姿の生徒たちを見ながら話す",t:[["Which uniform styles are the most common?", 1],["Were the older students bossy in your club?", 5],["Did you get any free weekends in high school?", 4]]}},
 {t:"第六百八十三歩 畳の部屋のマナー",d:"和室のある家に招いた友人に、靴や畳のマナーを説明する",p:[
  ["p5457", "Leave your shoes in the entryway.", "靴は玄関で脱いでね。"],["p5458", "Point your shoes toward the door.", "靴のつま先を玄関のほうに向けてね。"],["p5459", "Slippers come off before the tatami.", "畳の前でスリッパも脱いでね。"],["p5460", "Try not to step on the edges.", "畳の縁を踏まないようにしてね。"],["p5461", "Tatami is woven from rush grass.", "畳はい草で編まれてるの。"],["p5462", "That fresh smell is the new tatami.", "そのいい香りは新しい畳なんだ。"],["p5463", "Sit on the cushion. Kneeling isn't required.", "座布団に座って。正座しなくていいよ。"],["p5464", "The futons come out of the closet at night.", "夜は押し入れから布団を出すんだ。"]],
  r:[["Can I keep my slippers on in this room?", 2],["What's that nice grassy smell?", 5],["Where are the beds in this room?", 7]],
  c:{sit:"自分の祖父母の家の玄関で、上がる前に友人と話す",t:[["Where should I take off my shoes?", 0],["What's this floor actually made of?", 4],["My legs go numb when I kneel.", 6]]}},
 {t:"第六百八十四歩 チップのいらない日本",d:"レストランでチップを置こうとする友人に、日本ではチップが不要なことを説明する",p:[
  ["p5465", "Tipping isn't really a thing in Japan.", "日本ではチップの習慣はほぼないの。"],["p5466", "Good service is already included.", "いいサービスはもう料金に含まれてるの。"],["p5467", "Leaving cash might just confuse them.", "お金を置いていくと困らせちゃうかも。"],["p5468", "They might chase you to return it.", "返そうと追いかけてくるかもよ。"],["p5469", "Saying 'gochisosama' is the best thanks.", "「ごちそうさま」が一番のお礼だよ。"],["p5470", "Some upscale places add a service charge.", "高級店ではサービス料が加算されるところもあるよ。"],["p5471", "Taxi drivers give you exact change.", "タクシーの運転手もきっちりおつりをくれるよ。"],["p5472", "Just thank them and enjoy the savings.", "お礼を言って、浮いたお金を楽しもう。"]],
  r:[["How much should I leave for the waiter?", 0],["What happens if I leave some cash anyway?", 3],["Then how do I show I enjoyed the meal?", 4]],
  c:{sit:"食事を終えたレストランで、会計の前に友人と話す",t:[["So staff don't expect anything extra?", 1],["Why is there an extra ten percent on this bill?", 5],["Should I tell the taxi driver to keep the change?", 6]]}},
 {t:"第六百八十五歩 コインロッカーに荷物を預ける",d:"観光の前に駅で荷物を預けたい友人に、コインロッカーの使い方を説明する",p:[
  ["p5473", "Big stations have lockers near the gates.", "大きな駅には改札の近くにロッカーがあるよ。"],["p5474", "Lockers come in several sizes.", "ロッカーにはいくつかのサイズがあるんだ。"],["p5475", "Many take IC cards instead of coins.", "小銭の代わりにICカードが使えるものも多いよ。"],["p5476", "Keep the receipt. It has your PIN.", "レシートは取っておいて。暗証番号が書いてあるから。"],["p5477", "The fee is charged per day.", "料金は一日ごとにかかるの。"],["p5478", "Leave it too long and it gets moved.", "長く置きすぎると荷物を移されちゃうよ。"],["p5479", "They fill up fast on holidays.", "休日はすぐいっぱいになるよ。"],["p5480", "Snap a photo of the locker number.", "ロッカー番号の写真を撮っておいて。"]],
  r:[["Will my big suitcase fit in one of these?", 1],["I don't have any coins left.", 2],["What if I come back in a week?", 5]],
  c:{sit:"駅の構内で、スーツケースを引く友人とロッカーを探す",t:[["Where can I store my bag around here?", 0],["The machine printed a slip. Do I need to keep it?", 3],["I keep forgetting where I left my stuff.", 7]]}},
 {t:"第六百八十六歩 古いアルバムで懐かしむ",d:"実家の押し入れから出てきた古いアルバムを、友人と一緒にめくる",p:[
  ["p5481", "This takes me right back.", "一気にあの頃に引き戻される。"],["p5482", "I haven't seen these in years.", "これを見るのは何年ぶりだろう。"],["p5483", "Look how young my parents were here!", "ここの両親、すごく若い！"],["p5484", "I completely forgot about that haircut.", "あの髪型のこと、すっかり忘れてた。"],["p5485", "That was our old house by the river.", "それは川沿いにあった昔の家だよ。"],["p5486", "Summers felt so much longer back then.", "あの頃の夏はずっと長く感じたな。"],["p5487", "I can almost smell my grandma's kitchen.", "おばあちゃんの台所のにおいがしてきそう。"],["p5488", "Let's scan these before they fade.", "色あせる前にスキャンしておこう。"]],
  r:[["Who's the couple standing next to you?", 2],["Where was this picture taken?", 4],["Some of these are turning yellow already.", 7]],
  c:{sit:"大掃除の途中、実家の押し入れで見つけた古いアルバムを友人と開く",t:[["Look at this box of old albums I found.", 1],["Who's that kid with the bowl cut? Is that you?", 3],["Those summer trips look like they lasted forever.", 5]]}},
 {t:"第六百八十七歩 財布が戻ってきた安堵",d:"駅でなくした財布が交番に届いていたと知り、友人に気持ちを話す",p:[
  ["p5489", "What a relief!", "ああ、ほっとした！"],["p5490", "I can finally breathe again.", "やっと生きた心地がするよ。"],["p5491", "Someone actually turned it in.", "誰かがちゃんと届けてくれたんだ。"],["p5492", "Everything was still inside, even the cash.", "中身は全部無事で、現金まで残ってた。"],["p5493", "I was already canceling my cards.", "もうカードを止める手続きをしてたんだ。"],["p5494", "I really want to thank whoever found it.", "拾ってくれた人にお礼を言いたいな。"],["p5495", "My heart was pounding all morning.", "午前中ずっと心臓がばくばくしてた。"],["p5496", "I'm never keeping it in my back pocket again.", "もう二度と後ろのポケットには入れない。"]],
  r:[["Good news! The police station has your wallet.", 0],["Was anything missing when you got it back?", 3],["How did you lose it in the first place?", 7]],
  c:{sit:"交番から財布を受け取って出てきたところで、待っていた友人と合流する",t:[["So? Did you get it back?", 0],["They found it? Who brought it in?", 2],["Did you call the bank already?", 4]]}},
 {t:"第六百八十八歩 仕事が山積みで手いっぱい",d:"締め切りが重なった週、手伝いを申し出てくれた同僚に状況を話す",p:[
  ["p5497", "I'm completely swamped this week.", "今週は完全に手いっぱいなんだ。"],["p5498", "Everything landed on my desk at once.", "全部が一度に机に回ってきたの。"],["p5499", "I don't know where to start.", "どこから手をつけていいかわからない。"],["p5500", "I'm juggling three deadlines right now.", "今、締め切りを三つ同時に抱えてる。"],["p5501", "Could you take this report off my plate?", "この報告書、引き受けてもらえる？"],["p5502", "Let me make a list and prioritize.", "リストにして優先順位をつけてみる。"],["p5503", "Every time I finish one, two more appear.", "一つ終わるたびに二つ増えるんだ。"],["p5504", "I'll feel better once Friday's over.", "金曜が終われば楽になると思う。"]],
  r:[["You look buried. Is there anything I can do?", 4],["Why is your inbox so full today?", 1],["Maybe write everything down first?", 5]],
  c:{sit:"昼休み、デスクから動けない同僚に声をかける",t:[["You've barely looked up from your screen all day.", 0],["Try sorting out what's most urgent first.", 5],["When will things calm down for you?", 7]]}},
 {t:"第六百八十九歩 妹の発表会が誇らしい",d:"ピアノの発表会で堂々と弾ききった妹のことを、友人に話す",p:[
  ["p5505", "I'm so proud of my little sister.", "妹のことがすごく誇らしいの。"],["p5506", "She played without a single mistake.", "一つもミスせずに弾いたんだよ。"],["p5507", "She practiced every night for months.", "何か月も毎晩練習してたんだ。"],["p5508", "I got a little teary watching her.", "見ていてちょっと涙ぐんじゃった。"],["p5509", "She used to hide behind me at parties.", "昔はパーティーで私の後ろに隠れてたのに。"],["p5510", "The whole hall gave her a standing ovation.", "会場中がスタンディングオベーションだった。"],["p5511", "I couldn't stop clapping.", "拍手が止まらなかった。"],["p5512", "She's grown up so much.", "本当に大きくなったなあ。"]],
  r:[["You're beaming. What happened at the recital?", 0],["Wasn't she really shy as a kid?", 4],["How did the audience react?", 5]],
  c:{sit:"発表会の翌日、カフェで友人に動画を見せながら話す",t:[["So, how did your sister do last night?", 1],["She must have worked really hard for that.", 2],["You look like you're about to cry.", 3]]}},
 {t:"第六百九十歩 先生を「お母さん」と呼んだ日",d:"授業中に先生を「お母さん」と呼んでしまった話を、友人に打ち明ける",p:[
  ["p5513", "I wanted the floor to swallow me up.", "穴があったら入りたかった。"],["p5514", "I called my teacher Mom by accident.", "うっかり先生を「お母さん」って呼んじゃった。"],["p5515", "The whole class burst out laughing.", "クラス中がどっと笑ったの。"],["p5516", "My face turned bright red.", "顔が真っ赤になった。"],["p5517", "Thankfully, she just smiled and kept going.", "ありがたいことに先生は笑って続けてくれた。"],["p5518", "I'll never live this down.", "一生言われ続けるだろうな。"],["p5519", "It just slipped out.", "つい口から出ちゃったの。"],["p5520", "Please tell me I'm not the only one.", "私だけじゃないって言って。"]],
  r:[["Wait, what exactly did you say to her?", 1],["How did your teacher react?", 4],["Why did you even say that?", 6]],
  c:{sit:"放課後、真っ赤な顔で教室から出てきた友人に話しかける",t:[["I heard what you called her. Did you blush?", 3],["Did anyone notice?", 2],["I bet someone else has done that too.", 7]]}},
 {t:"第六百九十一歩 友人の昇進、うらやましくてうれしい",d:"昇進した親友に、少しのうらやましさも込めて祝福を伝える",p:[
  ["p5521", "I'm thrilled for you, honestly.", "本当に、心からうれしいよ。"],["p5522", "I'll admit I'm a little jealous.", "正直、ちょっとうらやましいけどね。"],["p5523", "Nobody deserves it more than you.", "あなた以上にふさわしい人はいないよ。"],["p5524", "You've earned every bit of it.", "全部あなたが努力で勝ち取ったものだよ。"],["p5525", "Now I want to step up my game.", "私も頑張らなきゃって気になった。"],["p5526", "Dinner's on me tonight.", "今夜の夕食は私のおごりね。"],["p5527", "You make it look so easy.", "なんでもないことみたいにやってのけるよね。"],["p5528", "Don't forget us little people.", "下っ端の私たちのことも忘れないでよ。"]],
  r:[["Be honest. Doesn't it bug you even a little?", 1],["So how should we celebrate?", 5],["What about your own career goals?", 4]],
  c:{sit:"昇進が決まったばかりの親友と、仕事帰りに待ち合わせる",t:[["I got the promotion!", 0],["I'm not sure I'm ready for this.", 2],["It all came together so smoothly.", 6]]}},
 {t:"第六百九十二歩 閉店するカフェで最後の一杯",d:"通い続けたカフェの最終営業日に、友人と最後のコーヒーを飲む",p:[
  ["p5529", "It's bittersweet being here today.", "今日ここにいるのはうれしくもあり、さみしくもある。"],["p5530", "This was my second living room.", "ここは私の第二のリビングだった。"],["p5531", "I wrote my whole thesis at that table.", "あのテーブルで卒論を全部書いたんだ。"],["p5532", "Let's order our usual one last time.", "最後にいつものを頼もう。"],["p5533", "I'm glad we came on the final day.", "最終日に来られてよかった。"],["p5534", "The owner remembered my name from day one.", "店主さんは最初の日から名前を覚えてくれた。"],["p5535", "Nothing else will feel quite the same.", "ほかのどこもここと同じにはならないよ。"],["p5536", "Let's take a photo by the window.", "窓ぎわで写真を撮ろう。"]],
  r:[["What should we get?", 3],["Why does this place mean so much to you?", 1],["You seem happy and sad at the same time.", 0]],
  c:{sit:"閉店当日のなじみのカフェで、窓ぎわの席に座る",t:[["Hard to believe today's the last day.", 0],["Didn't you study here all through college?", 2],["Let's get a picture before we go.", 7]]}},
 {t:"第六百九十三歩 講演を聞いてやる気がわく",d:"仕事帰りに聞いた講演会に刺激を受け、友人に興奮気味に話す",p:[
  ["p5537", "That talk really lit a fire under me.", "あの講演でほんとに火がついた。"],["p5538", "I'm itching to get started.", "早く始めたくてうずうずしてる。"],["p5539", "She made it sound so doable.", "すごく実現できそうに話してくれたの。"],["p5540", "I took pages of notes.", "何ページもメモを取ったよ。"],["p5541", "I'm starting my side project this weekend.", "今週末にサイドプロジェクトを始める。"],["p5542", "No more excuses for me.", "もう言い訳はしない。"],["p5543", "One line from her talk stuck with me.", "講演の一言がずっと心に残ってる。"],["p5544", "I wish I'd heard this years ago.", "何年も前に聞いておきたかった。"]],
  r:[["You look fired up. Good talk?", 0],["So when are you actually going to do something?", 4],["Which part stayed with you the most?", 6]],
  c:{sit:"講演会の会場を出て、駅へ向かいながら友人と話す",t:[["You're practically bouncing. Want to get started?", 1],["You've been putting this off for a long time.", 5],["What did you think of her advice?", 2]]}},
 {t:"第六百九十四歩 免許更新の長い待ち時間",d:"免許センターの待合室で、なかなか呼ばれずに友人と時間をもてあます",p:[
  ["p5545", "I'm bored out of my mind.", "退屈で死にそう。"],["p5546", "We've been sitting here forever.", "もうずっとここに座ってる。"],["p5547", "They've only called two numbers.", "まだ二つしか番号が呼ばれてない。"],["p5548", "My phone's about to die.", "スマホの電池が切れそう。"],["p5549", "I've read every poster on this wall.", "この壁のポスター、全部読んじゃった。"],["p5550", "Let's play a word game or something.", "しりとりか何かしようよ。"],["p5551", "I should have brought a book.", "本を持ってくればよかった。"],["p5552", "Time moves so slowly in here.", "ここは時間の進みがすごく遅い。"]],
  r:[["How's the line moving?", 2],["Why don't you just scroll on your phone?", 3],["Got any ideas to kill time?", 5]],
  c:{sit:"免許センターの待合室で、一時間以上番号を呼ばれずにいる",t:[["You keep sighing. Bored?", 0],["You've been staring at that wall for ages.", 4],["Didn't you bring anything to read?", 6]]}},
 {t:"第六百九十五歩 路上の歌声に心を動かされる",d:"駅前で歌うストリートミュージシャンの歌に足を止め、友人と感想を話す",p:[
  ["p5553", "Her voice gave me chills.", "彼女の歌声に鳥肌が立った。"],["p5554", "I couldn't walk past without stopping.", "素通りなんてできなかった。"],["p5555", "She's playing like nobody's watching.", "誰も見てないみたいに弾いてるね。"],["p5556", "That song really spoke to me.", "あの曲、すごく心に響いた。"],["p5557", "Now I want to play guitar again.", "またギターを弾きたくなってきた。"],["p5558", "Let's drop something in her case.", "ケースに何か入れていこう。"],["p5559", "I'm going to follow her online.", "ネットで彼女をフォローしよう。"],["p5560", "Talent like that deserves a bigger stage.", "あの才能はもっと大きな舞台にふさわしい。"]],
  r:[["You stopped so suddenly. What happened?", 1],["Should we leave her a tip?", 5],["Didn't you use to play in a band?", 4]],
  c:{sit:"夜の駅前で、ストリートミュージシャンの演奏が終わったところ",t:[["You've got goosebumps. Was it that good?", 0],["She doesn't seem to care about the crowd at all.", 2],["She should be playing in real concert halls.", 7]]}},
 {t:"第六百九十六歩 手書きのメモに胸が熱くなる",d:"退職する同僚の机に残されていた手書きのメモを読み、友人に話す",p:[
  ["p5561", "This note really touched me.", "このメモ、本当に心にしみた。"],["p5562", "She wrote it all by hand.", "全部手書きで書いてくれたんだ。"],["p5563", "I didn't think she noticed my help.", "手伝ってたこと、気づいてないと思ってた。"],["p5564", "It's the little things that get me.", "こういう小さなことにぐっとくるんだよね。"],["p5565", "I'm going to keep this forever.", "これはずっと取っておく。"],["p5566", "Nobody writes letters like this anymore.", "今どきこんな手紙を書く人はいないよ。"],["p5567", "I teared up a little at my desk.", "机でちょっと涙ぐんじゃった。"],["p5568", "I need to write her back.", "返事を書かなきゃ。"]],
  r:[["Why is that note pinned above your desk?", 4],["Couldn't she have just sent an email?", 1],["So, any plans to reply?", 7]],
  c:{sit:"退職した同僚から届いたメモを読んで、目をうるませている友人のそばに座る",t:[["What does the note say? You look moved.", 0],["Your eyes look a little red.", 6],["Handwritten letters are so rare these days.", 5]]}},
 {t:"第六百九十七歩 隣の重低音にちょっとイライラ",d:"夜遅くまで響く隣の部屋の音楽に、少しいらだちながら友人と話す",p:[
  ["p5569", "The bass is coming through the wall.", "重低音が壁ごしに響いてくる。"],["p5570", "It's starting to get on my nerves.", "だんだん気に障ってきた。"],["p5571", "I can't even hear the TV.", "テレビの音すら聞こえない。"],["p5572", "It's almost midnight on a weeknight.", "平日のもう真夜中なのに。"],["p5573", "Maybe they don't realize how loud it is.", "どれだけうるさいか気づいてないのかも。"],["p5574", "I'll knock and ask nicely.", "ノックしてやんわり頼んでみる。"],["p5575", "I don't want to start a feud.", "もめごとにはしたくないんだ。"],["p5576", "Fine, I'll wear earplugs for tonight.", "しかたない、今夜は耳栓をする。"]],
  r:[["What's that thumping sound?", 0],["Why not just call the landlord right away?", 6],["Can't you just let them have their fun?", 3]],
  c:{sit:"夜遅く、隣から音楽が響く部屋で友人と映画を見ようとする",t:[["I can't hear a word of this movie.", 2],["So, will you say something to them?", 5],["It really bothers you, huh?", 1]]}},
 {t:"第六百九十八歩 コンサート中止にがっかり",d:"楽しみにしていたコンサートが直前に中止になり、友人に気持ちを話す",p:[
  ["p5577", "I'm so bummed about the concert.", "コンサートのこと、すごくがっかりしてる。"],["p5578", "They canceled it the day before.", "前日に中止になったの。"],["p5579", "I was looking forward to it for months.", "何か月も前から楽しみにしてたのに。"],["p5580", "I even bought a new outfit.", "新しい服まで買ったんだよ。"],["p5581", "At least we'll get a full refund.", "少なくとも全額返金はされるけどね。"],["p5582", "Let's hope they reschedule soon.", "早く振替公演があるといいな。"],["p5583", "I guess it's out of our hands.", "私たちにはどうしようもないね。"],["p5584", "Let's still go out that night.", "それでもその夜は出かけようよ。"]],
  r:[["Did you hear? The show's off.", 0],["What about the money we paid?", 4],["So what do we do with our free evening?", 7]],
  c:{sit:"コンサート中止のメールを受け取った翌日、友人と話す",t:[["When did they announce it?", 1],["Any chance they'll pick a new date?", 5],["There's nothing we can do about it, right?", 6]]}},
 {t:"第六百九十九歩 思いがけない贈り物",d:"特に記念日でもないのに、友人から贈り物を受け取って驚く",p:[
  ["p5585", "You didn't have to do this!", "そんなことしなくてよかったのに！"],["p5586", "What's the occasion?", "何かのお祝い？"],["p5587", "This totally made my day.", "おかげで最高の一日になった。"],["p5588", "I never saw this coming.", "まったく予想してなかった。"],["p5589", "How did you know I wanted this?", "これが欲しかったって、どうしてわかったの？"],["p5590", "I'm almost speechless.", "言葉が出ないくらいだよ。"],["p5591", "I'll think of you every time I use it.", "使うたびにあなたのことを思い出すね。"],["p5592", "Now I owe you one.", "今度は私がお返ししなきゃ。"]],
  r:[["Here, this is for you.", 0],["It's not your birthday, but I got you something.", 1],["I hope you get lots of use out of it.", 6]],
  c:{sit:"何でもない平日、友人が小さな包みを差し出してくる",t:[["Open it! I couldn't wait to give it to you.", 3],["You seem lost for words.", 5],["Don't worry about returning the favor.", 7]]}},
 {t:"第七百歩 七百の歩み",d:"七百歩目の節目に、気持ちを細やかに伝えられるようになった自分を仲間と祝う",p:[
  ["p5593", "Seven hundred steps, can you believe it?", "七百歩だよ、信じられる？"],["p5594", "I can name my feelings now.", "今は自分の気持ちに名前をつけられる。"],["p5595", "Bittersweet used to be just a word.", "「ほろ苦い」は前はただの単語だった。"],["p5596", "Now I say what I mean.", "今は思ったことをそのまま言える。"],["p5597", "You always cheered me on.", "いつも応援してくれたね。"],["p5598", "I'm proud of how far we've come.", "ここまで来られたことが誇らしい。"],["p5599", "The path ahead still excites me.", "この先の道にまだわくわくしてる。"],["p5600", "Here's to the next hundred steps!", "次の百歩に乾杯！"]],
  r:[["So how many steps have we taken?", 0],["What's the biggest change in you?", 1],["Let's make a toast!", 7]],
  c:{sit:"七百歩目の夜、ずっといっしょに歩んできた仲間と乾杯の準備をする",t:[["We've come a long way, haven't we?", 5],["What's next for us?", 6],["I've always been in your corner.", 4]]}},
 {t:"第七百一歩 ややこしい家電の設定",d:"新しいエアコンの設定手順が複雑すぎて、友人に助けを求める",p:[
  ["p5601", "These instructions make no sense.", "この説明書、意味がわからない。"],["p5602", "I'm totally lost.", "完全にお手上げ。"],["p5603", "Which button am I supposed to press?", "どのボタンを押せばいいの？"],["p5604", "It says hold, but not for how long.", "「長押し」って書いてあるけど、何秒かは書いてない。"],["p5605", "I've read this page five times.", "このページ、五回も読んだよ。"],["p5606", "Could you walk me through it?", "順を追って教えてくれる？"],["p5607", "Why can't they just keep it simple?", "どうしてもっとシンプルにできないの？"],["p5608", "Oh, now it finally clicks.", "ああ、やっと腑に落ちた。"]],
  r:[["Need a hand with that remote?", 5],["Have you checked the manual again?", 4],["So you press this, then hold that. Make sense?", 7]],
  c:{sit:"新しいエアコンの前で、説明書を手に固まっている友人を見つける",t:[["You've been staring at that page forever.", 4],["Which step is tripping you up?", 2],["Look, you just press and hold the power button.", 7]]}},
 {t:"第七百二歩 スピーチ直前の緊張",d:"友人の結婚式でスピーチをする直前、控え室で緊張を打ち明ける",p:[
  ["p5609", "I've got butterflies in my stomach.", "胸がドキドキして落ち着かない。"],["p5610", "My hands keep shaking.", "手の震えが止まらない。"],["p5611", "What if my mind goes blank?", "頭が真っ白になったらどうしよう。"],["p5612", "I've rehearsed it a dozen times.", "十回以上リハーサルしたんだけどね。"],["p5613", "Let me run through the opening once more.", "もう一回だけ出だしを確認させて。"],["p5614", "Just keep my notes close by.", "メモはそばに置いておいて。"],["p5615", "Okay, deep breath. I can do this.", "よし、深呼吸。私ならできる。"],["p5616", "Wish me luck out there.", "うまくいくように祈ってて。"]],
  r:[["You look pale. Nervous?", 0],["Don't worry. You've practiced plenty.", 3],["They're calling your name. Ready?", 7]],
  c:{sit:"披露宴の控え室で、スピーチの順番を待つ友人に付き添う",t:[["How are you feeling?", 0],["Your hands are trembling.", 1],["Want to practice the first line with me?", 4]]}},
 {t:"第七百三歩 傘に入れてくれた人へ",d:"突然の雨の中、見知らぬ人が傘に入れて駅まで送ってくれた話をする",p:[
  ["p5617", "I'm so grateful to that stranger.", "あの見知らぬ人にすごく感謝してる。"],["p5618", "She shared her umbrella all the way.", "ずっと傘に入れてくれたの。"],["p5619", "She went out of her way for me.", "わざわざ遠回りしてくれたんだ。"],["p5620", "I didn't even catch her name.", "名前を聞きそびれちゃった。"],["p5621", "Small kindnesses like that stay with you.", "ああいう小さな親切って心に残るよね。"],["p5622", "It restored my faith in people.", "人っていいなとあらためて思えた。"],["p5623", "I wish I could thank her properly.", "ちゃんとお礼が言えたらいいのに。"],["p5624", "I want to pay it forward someday.", "いつか誰かに同じことをしたい。"]],
  r:[["How did you stay dry in that storm?", 1],["Did you get her contact info?", 3],["So how are you going to repay her?", 7]],
  c:{sit:"雨の夜、ずぶぬれにならずに帰宅した友人の話を聞く",t:[["So someone walked you to the station?", 1],["She didn't have to do that, you know.", 2],["Did you get to thank her?", 6]]}},
 {t:"第七百四歩 進まないレジの列",d:"スーパーの長いレジの列が進まず、友人とじりじりする",p:[
  ["p5625", "This line isn't moving at all.", "この列、ぜんぜん進まない。"],["p5626", "We've been standing here for ages.", "もうずいぶん長く並んでる。"],["p5627", "Only one register is open.", "レジが一つしか開いてない。"],["p5628", "I'm losing my patience here.", "だんだん我慢できなくなってきた。"],["p5629", "Maybe we should switch lines.", "列を変えたほうがいいかも。"],["p5630", "Of course the other line is faster now.", "案の定、隣の列のほうが速くなった。"],["p5631", "We'll miss the start of the movie.", "映画の始まりに間に合わなくなるよ。"],["p5632", "Next time, let's use self-checkout.", "次はセルフレジにしよう。"]],
  r:[["Why is everything taking so long?", 2],["That line over there looks shorter.", 4],["What's the rush, anyway?", 6]],
  c:{sit:"夕方のスーパーで、カゴを持って長い列に並ぶ",t:[["How long have we been in this line?", 1],["Typical. We picked the slowest line again.", 5],["Next time, should we try the self-service machines?", 7]]}},
 {t:"第七百五歩 静かな日曜日の満足感",d:"予定のない日曜日をのんびり過ごし、電話をくれた友人に気分を話す",p:[
  ["p5633", "I'm perfectly content right now.", "今、すっかり満ち足りてる。"],["p5634", "I haven't left the couch all morning.", "午前中ずっとソファから動いてない。"],["p5635", "Just coffee, a book, and the rain.", "コーヒーと本と雨の音だけ。"],["p5636", "There's nowhere I need to be.", "行かなきゃいけない所がどこにもない。"],["p5637", "This is exactly what I needed.", "まさにこういうのが必要だったの。"],["p5638", "I turned off all my notifications.", "通知を全部オフにしたんだ。"],["p5639", "I might bake something later.", "あとで何か焼くかも。"],["p5640", "Days like this are rare.", "こんな日はめったにないね。"]],
  r:[["Busy day? Got any plans?", 3],["Why didn't you answer my messages?", 5],["What are you up to today?", 2]],
  c:{sit:"日曜の昼、友人から「何してる？」と電話がかかってくる",t:[["You sound really relaxed.", 0],["Have you even gotten up today?", 1],["Any plans for the afternoon?", 6]]}},
 {t:"第七百六歩 朝飯前（piece of cake）",d:"心配していた運転免許の筆記試験が、思ったよりずっと簡単だったと友人に話す",p:[
  ["p5641", "Honestly, the test was a piece of cake.", "正直、試験は朝飯前だった。"],["p5642", "I finished with time to spare.", "時間を余らせて終わったよ。"],["p5643", "I was worried over nothing.", "心配して損した。"],["p5644", "The practice questions really paid off.", "練習問題をやったかいがあった。"],["p5645", "Most of the signs were easy to guess.", "標識のほとんどは簡単にわかった。"],["p5646", "The driving part will be harder.", "実技のほうが難しいだろうな。"],["p5647", "I barely slept last night, though.", "でも昨夜はほとんど眠れなかったけど。"],["p5648", "Let's celebrate with some ice cream.", "アイスでお祝いしよう。"]],
  r:[["So? How hard was the written test?", 0],["Did you have enough time to finish?", 1],["What's the next step after this?", 5]],
  c:{sit:"試験会場から出てきた友人を、外で待っていた友人が迎える",t:[["You're smiling! It went well, then?", 0],["I knew all that studying would help.", 3],["So it was easy, but you look exhausted.", 6]]}},
 {t:"第七百七歩 試験前の猛勉強（hit the books）",d:"期末試験が近づき、遊びの誘いを断って勉強に集中すると友人に伝える",p:[
  ["p5649", "I really need to hit the books.", "本気で勉強しなきゃ。"],["p5650", "Finals start in less than a week.", "期末まであと一週間もない。"],["p5651", "I've been putting it off too long.", "ずっと先延ばしにしすぎた。"],["p5652", "Can I take a rain check?", "また今度にしてもいい？"],["p5653", "I'm turning my phone off tonight.", "今夜はスマホの電源を切るよ。"],["p5654", "The library stays open until midnight.", "図書館は夜中まで開いてる。"],["p5655", "Want to study together this weekend?", "週末、一緒に勉強しない？"],["p5656", "Wish me luck.", "応援してね。"]],
  r:[["Want to go see a movie tonight?", 3],["Why the sudden rush to study?", 1],["Where are you going to study?", 5]],
  c:{sit:"放課後、友人が週末のカラオケに誘ってくる",t:[["We're all going to karaoke on Saturday. Coming?", 0],["You haven't opened your textbook all term, right?", 2],["Studying alone is so boring, though.", 6]]}},
 {t:"第七百八歩 高すぎる修理代（cost an arm and a leg）",d:"落として割れたスマホの修理見積もりが高額で、友人と対策を話す",p:[
  ["p5657", "Fixing this will cost an arm and a leg.", "直すのにものすごくお金がかかる。"],["p5658", "The screen alone costs half as much as a new phone.", "画面だけで新品の半額する。"],["p5659", "I should have bought a case.", "ケースを買っておけばよかった。"],["p5660", "Maybe it's time for a new one.", "新しいのに替える時期かも。"],["p5661", "My warranty ran out last month.", "保証は先月切れたんだ。"],["p5662", "I'll look for a cheaper repair shop.", "安い修理店を探してみる。"],["p5663", "It still works, just barely.", "まだ動くよ、ぎりぎりだけど。"],["p5664", "Lesson learned the expensive way.", "高い授業料を払って学んだよ。"]],
  r:[["How much did they quote you?", 0],["Wasn't it still under warranty?", 4],["Could you just keep using it like that?", 6]],
  c:{sit:"修理店から出てきた友人に、見積もりがどうだったか聞く",t:[["What did they say at the shop?", 0],["The official store is always so expensive.", 5],["A case would have saved you, you know.", 2]]}},
 {t:"第七百九歩 めったにない兄からの電話（once in a blue moon）",d:"ふだん連絡してこない兄から急に電話があり、友人にその驚きを話す",p:[
  ["p5665", "My brother calls once in a blue moon.", "兄が電話してくるなんてめったにない。"],["p5666", "So I knew something was up.", "だから何かあるとわかった。"],["p5667", "He's getting married next spring!", "来年の春に結婚するんだって！"],["p5668", "He sounded nervous but happy.", "緊張してたけどうれしそうだった。"],["p5669", "We talked for almost an hour.", "一時間近く話したよ。"],["p5670", "I should call him more often.", "もっと電話してあげなきゃ。"],["p5671", "We used to fight all the time.", "昔はしょっちゅうけんかしてた。"],["p5672", "He asked me to give a speech.", "スピーチを頼まれちゃった。"]],
  r:[["That was your brother? You look so surprised.", 0],["Why did he call out of nowhere?", 2],["Were you two close as kids?", 6]],
  c:{sit:"電話を切った直後、そばにいた友人に話しかけられる",t:[["How long were you two on the phone?", 4],["You don't talk to him much, do you?", 5],["So, will you have a role at the wedding?", 7]]}},
 {t:"第七百十歩 返事待ちの部屋探し（the ball is in their court）",d:"気に入った部屋に申し込んで家賃の交渉もし、あとは大家の返事を待つだけだと友人に話す",p:[
  ["p5673", "Now the ball is in their court.", "あとは向こう次第だね。"],["p5674", "I sent the application this morning.", "今朝、申込書を送った。"],["p5675", "I asked for a lower rent.", "家賃を下げてほしいとお願いした。"],["p5676", "They said they'd reply by Friday.", "金曜までに返事をくれるって。"],["p5677", "There's nothing more I can do.", "もうこっちにできることはない。"],["p5678", "I'm trying not to get my hopes up.", "期待しすぎないようにしてる。"],["p5679", "The view from the balcony is amazing.", "ベランダからの眺めが最高なの。"],["p5680", "I really hope they say yes.", "本当にオーケーしてほしい。"]],
  r:[["So, did you apply for that apartment?", 1],["When will you hear back?", 3],["What did you love about the place?", 6]],
  c:{sit:"内見から帰ってきた友人に、カフェで部屋のことを聞く",t:[["What happens next? Anything else you need to do?", 0],["Did you try to negotiate the price?", 2],["You must be so excited about it.", 5]]}},
 {t:"第七百十一歩 サプライズをばらしちゃった（spill the beans）",d:"友人の誕生日サプライズの計画を、うっかり本人に話してしまったと打ち明ける",p:[
  ["p5681", "I think I spilled the beans.", "私、ばらしちゃったかも。"],["p5682", "It just slipped out at lunch.", "お昼にぽろっと口から出ちゃった。"],["p5683", "I mentioned the cake by accident.", "うっかりケーキの話をしちゃったの。"],["p5684", "She pretended not to notice.", "彼女は気づかないふりをしてくれた。"],["p5685", "I feel terrible about it.", "本当に申し訳ない気持ち。"],["p5686", "Maybe we can change the plan.", "計画を変えられるかも。"],["p5687", "Let's move it to a different day.", "別の日にずらそう。"],["p5688", "I'm keeping my mouth shut from now on.", "これからは余計なことは言わない。"]],
  r:[["Why do you look so guilty?", 0],["How did she find out?", 1],["So the party's ruined, then?", 5]],
  c:{sit:"パーティーの準備仲間に、昨日の失言を報告する",t:[["What exactly did you say to her?", 2],["Did she seem to catch on?", 3],["Should we still do it on Saturday?", 6]]}},
 {t:"第七百十二歩 旅行プランのすり合わせ（on the same page）",d:"友人との旅行の前に、予算や過ごし方についての考えをそろえておく",p:[
  ["p5689", "Let's make sure we're on the same page.", "認識をそろえておこう。"],["p5690", "What's our budget for the whole trip?", "旅行全体の予算はいくら？"],["p5691", "I want at least one lazy day.", "一日はのんびりする日がほしい。"],["p5692", "Let's split everything down the middle.", "全部きっちり半分ずつにしよう。"],["p5693", "I'm fine with a cheap hotel.", "安いホテルでも平気だよ。"],["p5694", "Early mornings aren't really my thing.", "早起きはあまり得意じゃない。"],["p5695", "Let's write it all down.", "全部書き出しておこう。"],["p5696", "Good, we're totally in sync.", "よし、完全に意見が合ってるね。"]],
  r:[["Before we book anything, can we talk about the plan?", 0],["How should we handle the costs?", 3],["Where do you want to stay?", 4]],
  c:{sit:"旅行の前の週、カフェで友人と計画表を広げる",t:[["Where should we start with the planning?", 1],["I was thinking we'd go nonstop every day.", 2],["Want to start at six every morning?", 5]]}},
 {t:"第七百十三歩 大人からのピアノ（better late than never）",d:"子どものころの夢だったピアノを、大人になって習い始めたと友人に話す",p:[
  ["p5697", "Better late than never, right?", "遅くてもやらないよりはいい、でしょ？"],["p5698", "I finally started piano lessons.", "ついにピアノを習い始めたの。"],["p5699", "I always wanted to learn as a kid.", "子どものころからずっと習いたかった。"],["p5700", "My teacher is half my age.", "先生は私の半分の年齢なの。"],["p5701", "My fingers just refuse to cooperate.", "指が全然言うことを聞かない。"],["p5702", "I practice every night after dinner.", "毎晩夕食後に練習してる。"],["p5703", "It's humbling, but really fun.", "自分の未熟さを思い知らされるけど、すごく楽しい。"],["p5704", "Maybe I'll play for you someday.", "いつか弾いてあげるね。"]],
  r:[["You're starting piano at thirty-five?", 0],["What made you want to start?", 2],["How's it going so far?", 4]],
  c:{sit:"楽譜を持っている友人を見かけて、何を始めたのか聞く",t:[["Whose sheet music is that in your bag?", 1],["How often do you get to practice?", 5],["Can I hear you play sometime?", 7]]}},
 {t:"第七百十四歩 手抜きDIYの失敗（cut corners）",d:"壁に棚を自分で取り付けたが、手を抜いたせいで傾いてしまったと話す",p:[
  ["p5705", "I cut corners, and it shows.", "手を抜いたのが丸わかりだね。"],["p5706", "The shelf is already leaning.", "棚がもう傾いてる。"],["p5707", "I skipped the level to save time.", "時間を節約しようと水平器を使わなかった。"],["p5708", "I used the wrong screws, too.", "ネジも間違えてたの。"],["p5709", "Next time I'll follow the instructions.", "次は説明書どおりにやる。"],["p5710", "I have to take it all down.", "全部外さなきゃ。"],["p5711", "Could you give me a hand this weekend?", "今週末、手伝ってくれる？"],["p5712", "Doing it right takes longer.", "ちゃんとやると時間がかかるね。"]],
  r:[["Why is that shelf so crooked?", 0],["Did you use a level?", 2],["Can you fix it, or start over?", 5]],
  c:{sit:"遊びに来た友人が、壁の棚を見て首をかしげる",t:[["Something looks off about that shelf.", 1],["What kind of screws did you use?", 3],["Let me know if you need any help.", 6]]}},
 {t:"第七百十五歩 編み物のコツ（get the hang of it）",d:"始めたばかりの編み物に苦戦しながらも、少しずつ慣れてきたと友人に話す",p:[
  ["p5713", "I'm finally getting the hang of it.", "やっとコツがつかめてきた。"],["p5714", "The first scarf was a disaster.", "最初のマフラーは大失敗だった。"],["p5715", "I kept dropping stitches.", "目を落としてばかりだった。"],["p5716", "Watching videos helped a lot.", "動画を見たのがすごく役に立った。"],["p5717", "My hands remember the moves now.", "手が動きを覚えてきた。"],["p5718", "It's actually really relaxing.", "実はすごく癒やされるの。"],["p5719", "I'm making a hat for my nephew.", "甥っ子に帽子を編んでるの。"],["p5720", "You should try it with me.", "一緒にやってみなよ。"]],
  r:[["How's the knitting coming along?", 0],["How did your first project turn out?", 1],["Who's that little hat for?", 6]],
  c:{sit:"編み物をしている友人の隣に座って、手元をのぞきこむ",t:[["You're so fast now!", 4],["How did you learn? Did you take a class?", 3],["Doesn't it get boring?", 5]]}},
 {t:"第七百十六歩 夜勤続きの友人を励ます（hang in there）",d:"夜勤が続いて疲れている看護師の友人に、励ましの言葉をかける",p:[
  ["p5721", "Hang in there. You're almost done.", "がんばって。もう少しだよ。"],["p5722", "Only two more night shifts, right?", "夜勤はあと二回だけでしょ？"],["p5723", "You're doing an amazing job.", "本当によくやってるよ。"],["p5724", "Try to sleep when you can.", "寝られるときに寝てね。"],["p5725", "I'll drop off some dinner later.", "あとで夕飯を届けるね。"],["p5726", "Let's do something fun next week.", "来週は何か楽しいことしよう。"],["p5727", "Text me if you need anything.", "何かあったらメッセージして。"],["p5728", "You deserve a long vacation.", "長い休みをもらうべきだよ。"]],
  r:[["I'm so tired I can barely stand.", 0],["I haven't had a real meal in days.", 4],["I can't wait for this week to end.", 5]],
  c:{sit:"夜勤明けの友人から、疲れきった声で電話がかかってくる",t:[["I feel like giving up on this whole week.", 0],["I'm not sure I'm good at this job.", 2],["How many more of these do I have again?", 1]]}},
 {t:"第七百十七歩 パスタは難しくない（it's not rocket science）",d:"料理が苦手だという友人に、パスタのゆで方を一緒に教える",p:[
  ["p5729", "Relax, it's not rocket science.", "気楽にね、難しいことじゃないよ。"],["p5730", "Just boil plenty of water first.", "まずお湯をたっぷり沸かして。"],["p5731", "Add a good pinch of salt.", "塩をしっかりひとつまみ入れて。"],["p5732", "Stir it now and then.", "ときどきかき混ぜて。"],["p5733", "Taste a piece to check it.", "一本食べて確かめてみて。"],["p5734", "Save a little of the pasta water.", "ゆで汁を少し取っておいて。"],["p5735", "Look at you, you're a natural!", "ほら、才能あるじゃん！"],["p5736", "Next time, you're cooking for me.", "次はあなたが作ってね。"]],
  r:[["I'm hopeless in the kitchen.", 0],["How do I know when it's done?", 4],["What do I do while it's boiling?", 3]],
  c:{sit:"料理が苦手な友人の家で、一緒にパスタを作ることになる",t:[["Cooking always seems so complicated to me.", 0],["How much salt should I put in?", 2],["Hey, this actually tastes pretty good!", 6]]}},
 {t:"第七百十八歩 セールに出遅れた（miss the boat）",d:"狙っていた航空券のセールに出遅れ、売り切れてしまったと友人に話す",p:[
  ["p5737", "Looks like I missed the boat.", "乗り遅れちゃったみたい。"],["p5738", "The cheap tickets sold out overnight.", "安いチケットが一晩で売り切れた。"],["p5739", "I waited too long to decide.", "決めるのを待ちすぎた。"],["p5740", "Now they're twice the price.", "今は倍の値段だよ。"],["p5741", "I'll set an alert next time.", "次は通知を設定しておく。"],["p5742", "Maybe I'll go in the fall instead.", "代わりに秋に行こうかな。"],["p5743", "Everyone else grabbed theirs early.", "みんな早めに押さえてたのに。"],["p5744", "Oh well, there's always next year.", "まあいいや、来年もあるし。"]],
  r:[["Did you get those cheap flights?", 0],["How much are they now?", 3],["So you're not going this summer?", 5]],
  c:{sit:"セールの話を教えてくれた友人に、結果を聞かれる",t:[["Those flight deals ended yesterday. Did you book one?", 1],["How did you not get one in time?", 2],["You must be really disappointed.", 7]]}},
 {t:"第七百十九歩 天気次第の週末（play it by ear）",d:"雨予報の週末、予定をきっちり決めずに様子を見ようと友人と話す",p:[
  ["p5745", "Let's just play it by ear.", "その場の様子を見て決めよう。"],["p5746", "The forecast keeps changing.", "天気予報がころころ変わる。"],["p5747", "If it's sunny, let's hike.", "晴れたらハイキングしよう。"],["p5748", "If it rains, we'll find a museum.", "雨なら美術館でも探そう。"],["p5749", "There's no need to book anything.", "何も予約しなくていいよ。"],["p5750", "Let's check the sky Saturday morning.", "土曜の朝に空を見て決めよう。"],["p5751", "I'm easy either way.", "どっちでもいいよ。"],["p5752", "I'll text you when I wake up.", "起きたらメッセージするね。"]],
  r:[["So, what's the plan for Saturday?", 0],["What if it rains all day?", 3],["Should we reserve a table somewhere?", 4]],
  c:{sit:"金曜の夜、友人から週末の予定について電話がかかってくる",t:[["Have you seen the weather? It's all over the place.", 1],["Hiking or a museum, which do you prefer?", 6],["When should we decide, then?", 5]]}},
 {t:"第七百二十歩 高い買い物はひと晩考える（sleep on it）",d:"家具店で気に入ったソファを前に、即決せずひと晩考えると伝える",p:[
  ["p5753", "Let me sleep on it.", "ひと晩考えさせて。"],["p5754", "It's a big decision for me.", "私には大きな決断なの。"],["p5755", "It's way over my budget.", "予算を大きく超えてる。"],["p5756", "Could you hold it until tomorrow?", "明日まで取り置きしてもらえますか？"],["p5757", "I need to measure my living room.", "リビングの寸法を測らなきゃ。"],["p5758", "I love the color, though.", "でも色はすごく好き。"],["p5759", "I don't want to regret it later.", "あとで後悔したくない。"],["p5760", "I'll come back tomorrow either way.", "どっちにしても明日また来ます。"]],
  r:[["Shall I ring it up for you?", 0],["Are you sure it'll fit in your place?", 4],["What's stopping you from buying it?", 2]],
  c:{sit:"家具店でソファに座っていると、友人に「買っちゃえば？」と言われ、店員も声をかけてくる",t:[["Just buy it! You obviously love it.", 0],["This is the last one we have in stock, I'm afraid.", 3],["Why are you hesitating so much?", 6]]}},
 {t:"第七百二十一歩 古いパソコンに堪忍袋の緒が切れる（the last straw）",d:"何度もフリーズする古いノートパソコンに我慢の限界がきて、買い替えを決める",p:[
  ["p5761", "That was the last straw.", "もう我慢の限界だ。"],["p5762", "It froze in the middle of my presentation.", "プレゼンの最中に固まったの。"],["p5763", "Everyone just stared at the frozen screen.", "みんな固まった画面をじっと見てた。"],["p5764", "This laptop is older than my niece.", "このパソコン、姪より年上なんだよ。"],["p5765", "I've been patient for too long.", "ずっと我慢しすぎてた。"],["p5766", "I'm ordering a new one tonight.", "今夜新しいのを注文する。"],["p5767", "Can you help me pick one?", "選ぶの手伝ってくれる？"],["p5768", "I'll miss the old thing, honestly.", "正直、ちょっと名残惜しいけど。"]],
  r:[["You're finally replacing that laptop?", 0],["What happened during the meeting?", 1],["How did everyone react?", 2]],
  c:{sit:"パソコンを閉じてため息をつく同僚に、どうしたのか声をかける",t:[["Your laptop crashed again? That's the third time this week.", 0],["How old is that thing, anyway?", 3],["I know a lot about laptops if you need advice.", 6]]}},
 {t:"第七百二十二歩 未定の転勤（up in the air）",d:"転勤の話が出ているが、時期も行き先もまだ決まっていないと友人に話す",p:[
  ["p5769", "Everything is still up in the air.", "全部まだ宙ぶらりんなの。"],["p5770", "There might be a transfer next year.", "来年転勤になるかもしれない。"],["p5771", "They haven't told me where yet.", "どこへ行くかまだ言われてない。"],["p5772", "It could be Osaka or overseas.", "大阪か、海外かも。"],["p5773", "I can't plan anything right now.", "今は何も計画できない。"],["p5774", "I should know by the end of March.", "三月末にはわかるはず。"],["p5775", "Part of me is excited.", "少しわくわくしてる自分もいる。"],["p5776", "I'll miss this neighborhood, though.", "でもこの辺りを離れるのは寂しいな。"]],
  r:[["So, are you moving or not?", 0],["Where would they send you?", 3],["When will you find out for sure?", 5]],
  c:{sit:"友人から「来年の夏、一緒に旅行できる？」と聞かれる",t:[["Can you commit to a trip next summer?", 4],["Wait, your company might move you?", 1],["How do you feel about leaving?", 6]]}},
 {t:"第七百二十三歩 ちょっと体調が悪い（under the weather）",d:"少し体調をくずし、友人との食事の約束を延期してもらう",p:[
  ["p5777", "I'm feeling a bit under the weather.", "ちょっと体調が悪いんだ。"],["p5778", "It's probably just a cold.", "たぶんただの風邪。"],["p5779", "I don't want to give it to you.", "うつしたくないから。"],["p5780", "Can we push dinner to next week?", "夕食、来週にずらせる？"],["p5781", "I'm going to rest all weekend.", "週末はずっと休むよ。"],["p5782", "My throat is a little scratchy.", "喉が少しいがらっぽい。"],["p5783", "I'll make it up to you.", "この埋め合わせはするね。"],["p5784", "Thank you for understanding.", "わかってくれてありがとう。"]],
  r:[["You sound different. Are you okay?", 0],["Still on for dinner tomorrow?", 3],["Don't worry about it. Feel better soon.", 7]],
  c:{sit:"体調が悪い日に、友人から明日の約束について電話がかかってくる",t:[["Your voice sounds a little rough today.", 5],["I don't mind if you're a bit sick.", 2],["Oh no. I was really looking forward to it.", 6]]}},
 {t:"第七百二十四歩 ダメもとの抽選（a long shot）",d:"人気バンドのチケット抽選に、当たる見込みは低いと知りつつ申し込む",p:[
  ["p5785", "I know it's a long shot.", "望みが薄いのはわかってる。"],["p5786", "Thousands of people applied.", "何千人も申し込んだんだって。"],["p5787", "It doesn't hurt to try.", "やってみて損はない。"],["p5788", "The results come out on Friday.", "結果は金曜に出る。"],["p5789", "I entered under both our names.", "二人の名前で応募したよ。"],["p5790", "If we lose, we'll watch the stream.", "外れたら配信を見よう。"],["p5791", "I've never been lucky with these.", "こういうのに当たったためしがない。"],["p5792", "Keep your fingers crossed for me.", "当たるように祈ってて。"]],
  r:[["You think you'll actually get tickets?", 0],["When do you find out?", 3],["What if we don't get picked?", 5]],
  c:{sit:"抽選に申し込んだ友人に、カフェで当選の見込みを聞く",t:[["Why bother entering if the odds are so bad?", 2],["Did you enter just for yourself?", 4],["You're usually pretty lucky, aren't you?", 6]]}},
 {t:"第七百二十五歩 データが消えて振り出し（back to square one）",d:"保存していなかった資料のデータが消え、一からやり直すことになる",p:[
  ["p5793", "Well, I'm back to square one.", "さて、振り出しに戻った。"],["p5794", "The file just disappeared.", "ファイルが消えちゃった。"],["p5795", "I forgot to hit save.", "保存し忘れてた。"],["p5796", "Three days of work, gone.", "三日分の作業がパー。"],["p5797", "At least I remember the outline.", "少なくとも構成は覚えてる。"],["p5798", "The second draft might be better.", "書き直したほうがいいものになるかも。"],["p5799", "I'm turning on autosave right now.", "今すぐ自動保存をオンにする。"],["p5800", "Let me grab a coffee first.", "まずコーヒーを取ってくる。"]],
  r:[["How's the report coming along?", 0],["Didn't you back it up?", 2],["How much did you lose?", 3]],
  c:{sit:"締め切り前、パソコンを前に固まっている同僚に声をかける",t:[["You look like you've seen a ghost. What happened?", 1],["Can you remember any of what you wrote?", 4],["How will you stop this from happening again?", 6]]}}
];

ed", "「随時知らせる」。進展があるたびに報告するという約束。"],["return the favor", "「お返しをする」。協力を頼むときに添えると角が立たない。"],["walk you through", "「順を追って説明する」。デモや手順説明の定番表現。"],["pays for itself", "「元が取れる」。投資効果を示すときの説得力ある表現。"],["in place", "「導入されて機能している」。put new checks in place で対策済みを示す。"],["stick with it", "「あきらめずに続ける」。序盤が退屈な作品を薦めるときの定番。"],["live up to the hype", "「評判に見合う」。didn't live up to the hype で期待外れを表す。"],["hard to read", "「読み取りにくい」。表情や人の気持ちがわかりにくいときに使う。"],["never too late", "「遅すぎることはない」。大人の挑戦を励ます定番。"],["golden hour", "「日の出後・日没前の光がやわらかい時間帯」。写真好きの必須語。"],["dates back to", "「〜にさかのぼる」。年代や起源を説明する表現。"],["put it simply", "「簡単に言うと」。難しい話をかみくだく前置き。"],["add up", "「積み重なって大きくなる」。Small changes add up は小さな努力を励ます言葉。"],["double-check", "「念入りに再確認する」。AIの出力を扱うときの基本姿勢。"],["crowd the pan", "「フライパンに詰め込みすぎる」。温度が下がり焼き目がつかなくなる。"],["time trouble", "「持ち時間が足りない状態」。将棋やチェスでよく使う。"],["spot", "「見つける」。can't spot it で探しても見つからない様子を表す。"],["adjust", "「(目が)慣れる」。Let your eyes adjust は暗い場所での定番。"],["feel free to", "「遠慮なく〜して」。相手に気軽に頼むときの表現。"],["one-sided", "「一方的な・偏った」。報道や作品の偏りを指摘する語。"],["on the tip of my tongue", "「のどまで出かかっている」。思い出せそうで出ないとき。"],["stuck on", "「〜で行き詰まる」。I'm stuck on this clue でヒントが解けない状態を表す。"],["give it a try", "「試しにやってみる」。気軽にすすめるときの表現。"],["gave me chills", "「鳥肌が立った」。強く感動したときの表現。"],["left unsaid", "「言わずにおかれた」。行間の美を説明する表現。"],["wiggle room", "「（予算や予定の）余裕、遊び」。ぎりぎりにしないときの表現。"],["in person", "「実際に、直接」。see it in person で実物を見る。"],["one of a kind", "「唯一無二の、一点もの」。骨董や手作り品をほめるときに。"],["bundle", "「まとめる、セットにする」。付属品ごと売るときに。"],["put down roots", "「根を下ろす、定住する」。"],["out of habit", "「習慣で、つい癖で」。"],["unwind", "「くつろぐ、緊張をほぐす」。"],["consistency", "「一貫性、継続」。習慣づくりのキーワード。"],["one in, one out", "「ひとつ入れたらひとつ出す」。物を増やさないルール。"],["prior commitment", "「先約」。断る理由を丁寧に伝える表現。"],["made up my mind", "「決心した」。I've made up my mind で意思が固いことを示す。"],["recharged", "「充電された、元気を取り戻した」。"],["walk and talk", "「歩きながら話す」。ウォーキングミーティングの言い方。"],["believing in me", "「私（の力）を信じてくれる」。believe in は人の可能性を信じること。"],["getaway", "「小旅行、日常から離れる休暇」。"],["goes quiet", "「静かになる」。mind goes quiet で雑念が消える感覚 e a review tonight.", "今夜レビューを書くね。"], ["B", "Five stars from me too.", "ぼくも星五つだな。"]], "q": {"3": ["エマがこの店に来た理由は？", ["忙しい週のごほうび", "誕生日", "仕事の会議"]], "5": ["店の弱点は？", ["サービスが遅い", "料理がまずい", "高すぎる"]], "8": ["ケンの評価は？", ["星五つ", "星一つ", "まだ決めていない"]]}}, {"t": "雨の夜のタクシー", "d": "遅れそうな夜", "l": [["B", "To the station, please. Could you hurry?", "駅までお願いします。急いでもらえますか？"], ["A", "I'll try. It's raining, so the roads may be busy.", "やってみます。雨なので道が混んでいるかもしれません。"], ["B", "I hope not. My friend is waiting for me at dinner.", "混んでないといいな。友達が夕食を待ってるんです。"], ["A", "We're almost there. Shall I stop here?", "もうすぐです。ここで止めましょうか？"], ["B", "Yes, here is fine. Can I get a receipt?", "はい、ここで大丈夫です。領収書をもらえますか？"], ["A", "Of course. Here you are.", "もちろん。どうぞ。"], ["B", "Keep the change, please. Thank you!", "おつりはとっておいてください。ありがとう！"]], "q": {"3": ["ケンが急いでいる理由は？", ["友達が夕食を待っている", "飛行機に遅れそう", "会議がある"]], "5": ["ケンがほしいものは？", ["領収書", "傘", "地図"]], "7": ["ケンはおつりをどうした？", ["とっておいてもらった", "全部受け取った", "寄付した"]]}}, {"t": "歯が痛い日", "d": "歯医者と薬局", "l": [["A", "Ken, why are you holding your face?", "ケン、どうして顔を押さえてるの？"], ["B", "I have a toothache. It hurts when I eat something cold.", "歯が痛いんだ。冷たいものを食べると痛む。"], ["A", "You should see a dentist today.", "今日、歯医者に行ったほうがいいよ。"], ["B", "I'm a bit scared. Will it hurt?", "ちょっと怖いな。痛いかな？"], ["A", "Don't worry. It's probably a small cavity.", "心配しないで。たぶん小さな虫歯よ。"], ["B", "Okay, I'll go. Then I'll get some medicine at the pharmacy.", "わかった、行くよ。そのあと薬局で薬を買う。"], ["A", "Remember to ask how many to take.", "何錠飲めばいいか聞くのを忘れないでね。"]], "q": {"2": ["ケンの症状は？", ["冷たいものを食べると歯が痛い", "頭が痛い", "目がかゆい"]], "5": ["エマの予想は？", ["小さな虫歯", "骨折", "風邪"]], "7": ["エマが念を押したことは？", ["何錠飲むか聞く", "早く寝る", "水をたくさん飲む"]]}}, {"t": "新人の初日", "d": "仕事を教える", "l": [["A", "Welcome to the team, Ken. Let me show you around.", "チームへようこそ、ケン。中を案内するね。"], ["B", "Thank you. There's so much to remember.", "ありがとう。覚えることがたくさんあるね。"], ["A", "You'll get used to it. Don't hesitate to ask questions.", "すぐ慣れるよ。遠慮なく質問してね。"], ["B", "Could you look at my first report? Please be honest.", "最初の報告書を見てもらえる？正直に言ってね。"], ["A", "Overall, it's very good. Maybe you could add more details.", "全体的にとてもいいよ。もう少し詳しく書いてもいいかも。"], ["B", "Thanks for the advice. I'll fix it right away.", "アドバイスありがとう。すぐ直すよ。"], ["A", "Also, could you prepare the slides for Friday?", "それと、金曜日のスライドを用意してくれる？"], ["B", "Sure, I can do that. Consider it done.", "もちろん。任せて。"]], "q": {"3": ["エマが言ったことは？", ["遠慮なく質問して", "質問しないで", "明日来て"]], "6": ["報告書へのアドバイスは？", ["もっと詳しく書く", "短くする", "英語で書く"]], "8": ["ケンの返事の意味は？", ["任せて、やっておく", "できない", "考えておく"]]}}, {"t": "ふり返りの夜", "d": "ここまでの道", "l": [["B", "Looking back, I've grown a lot this year.", "ふり返ると、今年はとても成長したよ。"], ["A", "I agree. At first, you couldn't say anything in English.", "そうね。最初は英語で何も言えなかったもの。"], ["B", "Now I can have real conversations.", "今はちゃんと会話ができる。"], ["A", "What was the hardest part?", "いちばん大変だったのは？"], ["B", "Listening. But practicing every day really helped.", "聞き取り。でも毎日の練習が本当に役立った。"], ["A", "I'm glad you didn't give up.", "あきらめなくてよかったね。"], ["B", "Me too. I'm curious about what's next.", "ぼくも。次に何が来るか楽しみだ。"], ["A", "Let's keep going together.", "これからも一緒に進もう。"]], "q": {"3": ["最初のケンはどうだった？", ["英語で何も言えなかった", "英語がぺらぺらだった", "日本語が話せなかった"]], "5": ["いちばん大変だったことは？", ["聞き取り", "書くこと", "発音"]], "8": ["最後の二人の気持ちは？", ["一緒に進もう", "もうやめよう", "別々に学ぼう"]]}}, {"t": "湖のキャンプ", "d": "星空の夜", "l": [["A", "Ken, can you help me set up the tent?", "ケン、テントを張るのを手伝ってくれる？"], ["B", "Sure. But where are the poles?", "いいよ。でもポールはどこ？"], ["A", "Oh no. I think I left them in the car.", "しまった。車に置いてきたみたい。"], ["B", "No problem. I'll go get them.", "大丈夫。取ってくるよ。"], ["A", "While you're gone, I'll start the fire.", "そのあいだに火をおこしておくね。"], ["B", "Okay. And don't forget the bug spray this time!", "わかった。今回は虫よけを忘れないでね！"], ["A", "Ha ha. Look up, Ken. The stars are amazing.", "あはは。上を見て、ケン。星がすごいよ。"], ["B", "Wow. We can't see this in the city.", "わあ。都会ではこんなの見られないね。"]], "q": {"3": ["テントのポールはどこにあった？", ["車の中", "湖のそば", "家"]], "5": ["ケンが取りに行くあいだ、エマは何をする？", ["火をおこす", "料理を作る", "寝る"]], "8": ["二人は何に感動した？", ["星空", "湖の魚", "たき火の音"]]}}, {"t": "合わないセーター", "d": "返品と交換", "l": [["B", "Excuse me. I'd like to return this sweater.", "すみません。このセーターを返品したいのですが。"], ["A", "Of course. What's the problem with it?", "かしこまりました。どうなさいましたか？"], ["B", "It was a gift, but it doesn't fit.", "プレゼントだったんですが、サイズが合わなくて。"], ["A", "Do you have the receipt?", "レシートはお持ちですか？"], ["B", "No, but I have the gift receipt.", "いいえ、でもギフトレシートがあります。"], ["A", "That works. Would you like a refund or an exchange?", "それで大丈夫です。返金と交換、どちらになさいますか？"], ["B", "An exchange, please. Do you have a larger size?", "交換でお願いします。大きいサイズはありますか？"], ["A", "Yes, here you go. The fitting room is over there.", "はい、どうぞ。試着室はあちらです。"]], "q": {"3": ["なぜ返品したい？", ["サイズが合わない", "色がきらい", "こわれていた"]], "5": ["ケンは何を持っていた？", ["ギフトレシート", "普通のレシート", "何も持っていない"]], "8": ["ケンはどうすることにした？", ["大きいサイズと交換", "返金してもらう", "そのまま持って帰る"]]}}, {"t": "人ごみの駅", "d": "待ち合わせ", "l": [["A", "Ken, I'm at the station. Where are you?", "ケン、駅に着いたよ。どこにいる？"], ["B", "I'm at the north exit, next to the flower shop.", "北口の花屋のとなりにいるよ。"], ["A", "Hmm, I'm at the north exit too, but I can't find you.", "うーん、わたしも北口にいるけど見つからない。"], ["B", "What are you wearing?", "どんな服着てる？"], ["A", "A yellow coat and a big hat.", "黄色いコートと大きな帽子。"], ["B", "Wait, are you by the bakery? Turn around!", "待って、パン屋のそば？ふり向いて！"], ["A", "There you are! Sorry, there are so many people.", "いた！ごめん、人がすごく多くて。"], ["B", "No worries. Let's go before the movie starts.", "気にしないで。映画が始まる前に行こう。"]], "q": {"2": ["ケンはどこにいた？", ["北口の花屋のとなり", "南口の改札", "パン屋の中"]], "5": ["エマの服装は？", ["黄色いコートと大きな帽子", "赤いマフラー", "黒いジャケット"]], "8": ["二人はこれから何をする？", ["映画を見る", "買い物をする", "家に帰る"]]}}, {"t": "スピーチの日", "d": "わたしの物語", "l": [["A", "Are you nervous about your speech, Ken?", "スピーチ、緊張してる？ケン。"], ["B", "A little. It's my first speech in English.", "少しね。英語でスピーチするのは初めてなんだ。"], ["A", "What are you going to talk about?", "何について話すの？"], ["B", "My story. How I started learning English and why.", "自分の話。どうして、どうやって英語を始めたか。"], ["A", "That sounds great. Just speak slowly and smile.", "すてきね。ゆっくり話して、笑顔でね。"], ["B", "Okay. Wish me luck.", "わかった。うまくいくように祈ってて。"], ["A", "You did it, Ken! Everyone loved your speech.", "やったね、ケン！みんなスピーチを気に入ってたよ。"], ["B", "I'm proud of how far I've come. What's next for us?", "ここまで来られて誇らしい。次は何をしよう？"]], "q": {"2": ["ケンの気持ちは？", ["少し緊張している", "まったく平気", "とても眠い"]], "4": ["スピーチのテーマは？", ["英語を学んだ自分の話", "好きな映画", "旅行の計画"]], "8": ["スピーチの結果は？", ["みんなに喜ばれた", "失敗した", "中止になった"]]}}, {"t": "市場の値切り", "d": "古い時計", "l": [["A", "Look at this old watch, Ken. Isn't it beautiful?", "見て、ケン、この古い時計。きれいじゃない？"], ["B", "It is. How much is it?", "本当だ。いくら？"], ["A", "The sign says ninety dollars. That's a lot.", "札には九十ドルって書いてある。高いな。"], ["B", "Let me try. Excuse me, can you do any better?", "やってみるよ。すみません、もう少し安くなりませんか？"], ["A", "He says seventy, if we pay in cash.", "現金なら七十ドルでいいって。"], ["B", "What if we buy the small clock too?", "小さい置き時計も買ったらどうかな？"], ["A", "Both for one hundred! You're really good at this, Ken.", "二つで百ドルだって！ケン、うまいね。"], ["B", "It's a deal. My grandfather taught me.", "それで決まり。祖父に教わったんだ。"]], "q": {"3": ["時計の最初の値段は？", ["九十ドル", "七十ドル", "百ドル"]], "5": ["七十ドルになる条件は？", ["現金で払う", "二つ買う", "明日来る"]], "8": ["ケンは値切りをだれに教わった？", ["祖父", "エマ", "店の人"]]}}, {"t": "真夜中の水もれ", "d": "大家さんへの電話", "l": [["B", "Emma, wake up. There's water on the kitchen floor.", "エマ、起きて。台所の床に水がたまってる。"], ["A", "Oh no! Where is it coming from?", "うそ！どこから来てるの？"], ["B", "There's a leak under the sink.", "流しの下が水もれしてる。"], ["A", "I'll turn off the water. You call the landlord.", "水を止めるね。大家さんに電話して。"], ["B", "Hello, Mr. Brown? Sorry to call so late.", "もしもし、ブラウンさん？夜遅くにすみません。"], ["A", "What did he say?", "何て言ってた？"], ["B", "A plumber will come at nine tomorrow morning.", "明日の朝九時に配管工が来るって。"], ["A", "Good. Let's put some towels down and go back to bed.", "よかった。タオルを敷いて、寝直そう。"]], "q": {"3": ["水はどこからもれていた？", ["流しの下", "天井", "お風呂"]], "5": ["エマは何をする？", ["水を止める", "大家に電話する", "タオルを買いに行く"]], "8": ["配管工はいつ来る？", ["明日の朝九時", "今すぐ", "来週"]]}}, {"t": "誤解の夜", "d": "言葉のすれちがい", "l": [["A", "Ken, why did you tell everyone my idea was boring?", "ケン、どうしてみんなにわたしの案が退屈だって言ったの？"], ["B", "Wait, that's not what I meant.", "待って、そういう意味じゃないんだ。"], ["A", "Then what did you mean?", "じゃあどういう意味？"], ["B", "I said the first part was a bit slow. The rest was great.", "最初の部分が少しテンポが遅いって言ったんだ。残りはすごくよかった。"], ["A", "Oh. Lisa told me something different.", "あら。リサからは違うふうに聞いたの。"], ["B", "I see why you were upset. I should have told you myself.", "怒るのも無理ないね。直接きみに言うべきだった。"], ["A", "I'm sorry I got angry. Let's start over.", "怒ってごめんね。やり直そう。"], ["B", "Sure. Let's work on the first part together.", "もちろん。最初の部分を一緒に直そう。"]], "q": {"2": ["エマはなぜ怒っていた？", ["案が退屈だと言われたと思った", "約束を忘れられた", "ケンが遅刻した"]], "4": ["ケンが本当に言ったことは？", ["最初の部分のテンポが少し遅い", "全部つまらない", "何も言っていない"]], "8": ["最後に二人はどうする？", ["一緒に直す", "別々に作る", "リサに頼む"]]}}, {"t": "五年ぶりの再会", "d": "近況を語る", "l": [["A", "Ken? Is that really you? It's been ages!", "ケン？本当にあなた？すごく久しぶり！"], ["B", "Emma! I can't believe it. What have you been up to?", "エマ！信じられない。最近どうしてた？"], ["A", "A lot has happened. I moved to Canada for work.", "いろいろあったの。仕事でカナダに引っ越したんだ。"], ["B", "Wow. Do you speak English every day now?", "わあ。じゃあ毎日英語を話してるの？"], ["A", "Yes. It was hard at first, but now I love it.", "うん。最初は大変だったけど、今は大好き。"], ["B", "I changed jobs too. I teach English now.", "ぼくも転職したよ。今は英語を教えてる。"], ["A", "No way! You were so shy in class.", "うそ！授業ではすごく恥ずかしがり屋だったのに。"], ["B", "I know. Let's keep in touch this time.", "だよね。今度は連絡を取り合おう。"]], "q": {"3": ["エマはどこへ引っ越した？", ["カナダ", "アメリカ", "イギリス"]], "6": ["ケンの今の仕事は？", ["英語の先生", "通訳", "料理人"]], "8": ["最後に二人が約束したことは？", ["連絡を取り合う", "明日また会う", "一緒に旅行する"]]}}, {"t": "保留音", "d": "サポートへの電話", "l": [["B", "I've been on hold for twenty minutes.", "もう二十分も保留だよ。"], ["A", "Hang in there. I'll wait with you.", "がんばって。一緒に待ってあげる。"], ["B", "Finally! Hello? Yes, my internet stopped working again.", "やっと！もしもし？はい、またネットが止まったんです。"], ["A", "Tell them it's the third time this month.", "今月三回目だって伝えて。"], ["B", "This is the third time this month. Can you explain why?", "今月これで三回目です。理由を説明してもらえますか？"], ["A", "What did they say?", "何て言ってた？"], ["B", "They'll send a technician tomorrow and give us a discount.", "明日技術者を送って、割引もしてくれるって。"], ["A", "Great. Don't forget to ask for a reference number.", "よかった。受付番号をもらうのを忘れないでね。"]], "q": {"2": ["ケンはどのくらい待った？", ["二十分", "五分", "一時間"]], "5": ["ネットが止まったのは今月何回目？", ["三回目", "初めて", "二回目"]], "8": ["サポートの対応は？", ["明日技術者が来て割引もある", "何もしてくれない", "新しい機械を送る"]]}}, {"t": "新しい部屋さがし", "d": "内見の日", "l": [["A", "This apartment is bright. I love the big windows.", "この部屋は明るいね。大きな窓がすてき。"], ["B", "How much is the rent?", "家賃はいくら？"], ["A", "The agent says it's a little over our budget.", "不動産屋さんが、予算を少し超えるって。"], ["B", "Does that include utilities?", "うーん。光熱費とかは込み？"], ["A", "Yes, water and internet are included.", "うん、水道とネットは込みだって。"], ["B", "Then it's not so bad. How far is the station?", "それならそんなに悪くないね。駅までは？"], ["A", "Five minutes on foot. And pets are allowed!", "歩いて五分。それにペットも飼えるよ！"], ["B", "Let's think it over tonight and call tomorrow.", "今夜よく考えて、明日電話しよう。"]], "q": {"3": ["部屋の家賃は？", ["予算を少し超える", "とても安い", "予算ぴったり"]], "5": ["家賃に含まれているものは？", ["水道とネット", "電気とガス", "何もない"]], "8": ["二人はどうすることにした？", ["今夜考えて明日電話する", "今日契約する", "別の部屋を見る"]]}}, {"t": "言葉が出ない", "d": "お店での説明", "l": [["B", "Excuse me. I'm looking for something, but I forgot the word.", "すみません。探しているものがあるんですが、言葉を忘れちゃって。"], ["A", "No problem. What do you use it for?", "大丈夫ですよ。何に使うものですか？"], ["B", "You use it to cut paper. It's a kind of tool.", "紙を切るのに使います。道具の一種です。"], ["A", "Do you mean a pair of scissors?", "はさみのことですか？"], ["B", "No, it's smaller. It's similar to a knife, but safer.", "いいえ、もっと小さいんです。ナイフに似てるけど、もっと安全なものです。"], ["A", "Oh, you mean a box cutter!", "ああ、カッターのことですね！"], ["B", "Yes! That's the word I was looking for!", "そう！それが探してた言葉です！"], ["A", "They're in aisle five, next to the tape.", "五番通路の、テープのとなりにありますよ。"]], "q": {"3": ["ケンが探している物は何に使う？", ["紙を切る", "びんを開ける", "くぎを打つ"]], "6": ["探していた物は？", ["カッター", "はさみ", "ナイフ"]], "8": ["それはどこにある？", ["五番通路のテープのとなり", "レジの近く", "入口"]]}}, {"t"  "Let's make next year even better.", "来年はもっといい年にしようね。"], ["B", "Definitely. Have a happy New Year, Emma!", "もちろん。よいお年を、エマ！"]], "q": {"2": ["今は何月？", ["十二月", "一月", "十一月"]], "4": ["ケンのいちばんの思い出は？", ["温泉旅行", "同窓会", "マラソン"]], "8": ["二人の来年の目標は？", ["もっといい年にする", "引っ越す", "英語をやめる"]]}}, {"t": "新しいスマホ", "d": "設定に苦戦する夜", "l": [["B", "Emma, can you help me with my new phone?", "エマ、新しいスマホのこと、手伝ってくれる？"], ["A", "Sure. What's the problem?", "いいよ。どうしたの？"], ["B", "I can't log in. I forgot my password again.", "ログインできないんだ。またパスワードを忘れちゃった。"], ["A", "Tap Forgot password. They'll send you a code.", "「パスワードを忘れた」を押して。コードが送られてくるよ。"], ["B", "Got it. Now I need to make a new one.", "来た。じゃあ新しいのを作らなきゃ。"], ["A", "Use a long one, and don't use your birthday.", "長いのにしてね。誕生日は使わないで。"], ["B", "Okay. Should I write it down somewhere?", "わかった。どこかに書いておくべき？"], ["A", "Use a password manager. It's much safer.", "パスワード管理アプリを使って。そのほうがずっと安全。"]], "q": {"3": ["ケンが困っていることは？", ["パスワードを忘れた", "画面が割れた", "電池が切れた"]], "6": ["エマの忠告は？", ["誕生日を使わない", "短くする", "毎日変える"]], "8": ["エマのおすすめは？", ["パスワード管理アプリ", "ノートに書く", "友達に教える"]]}}, {"t": "台風の前の日", "d": "備えと花火の約束", "l": [["A", "A typhoon is coming tomorrow night.", "明日の夜、台風が来るって。"], ["B", "Then the fireworks festival will be canceled.", "じゃあ花火大会は中止だね。"], ["A", "Actually, they already moved it to next Saturday.", "実は、もう来週の土曜日に延期になったよ。"], ["B", "Good. Let's buy water and batteries today.", "よかった。今日、水と電池を買っておこう。"], ["A", "And bring the plants inside from the balcony.", "それとベランダの植木を中に入れよう。"], ["B", "Should we charge our phones too?", "スマホも充電しておく？"], ["A", "Yes, just in case the power goes out.", "うん、停電したときのためにね。"], ["B", "Then next Saturday, fireworks and a yukata!", "それで来週の土曜は、花火と浴衣だ！"]], "q": {"3": ["花火大会はどうなった？", ["来週の土曜日に延期", "中止で終わり", "予定どおり"]], "4": ["今日買うものは？", ["水と電池", "花火", "浴衣"]], "7": ["スマホを充電する理由は？", ["停電に備えて", "写真を撮るため", "ゲームをするため"]]}}, {"t": "ありがとうの花束", "d": "先輩の退職", "l": [["B", "Ms. Brown is retiring at the end of this month.", "ブラウンさんが今月末で退職するんだ。"], ["A", "Really? She taught me so much when I joined.", "本当？入社したとき、たくさん教えてくれた人だよ。"], ["B", "Let's get her flowers and a card from the team.", "チームから花とカードを贈ろうよ。"], ["A", "Great idea. I'll ask everyone to write a message.", "いいね。みんなにメッセージを書いてもらうね。"], ["B", "What will you write?", "エマは何て書く？"], ["A", "Thank you for always believing in me.", "いつも私を信じてくれてありがとう、って。"], ["B", "That's lovely. She'll be so happy.", "すてきだね。きっと喜ぶよ。"], ["A", "I'll miss her, but I wish her all the best.", "さみしくなるけど、幸せを願ってる。"]], "q": {"1": ["ブラウンさんはいつ退職する？", ["今月末", "来年", "来週"]], "3": ["チームから贈るものは？", ["花とカード", "時計", "旅行券"]], "6": ["エマが書くメッセージは？", ["いつも信じてくれてありがとう", "また会いましょう", "お疲れさまでした"]]}}, {"t": "月の一年", "d": "すずねと歩いた日々", "l": [["A", "Ken, do you know what day it is?", "ケン、今日が何の日か知ってる？"], ["B", "No idea. Did I forget something?", "さあ。何か忘れてた？"], ["A", "It's been one year since we started English.", "英語を始めてちょうど一年なの。"], ["B", "Wow, time flies. We've come a long way.", "わあ、早いね。ずいぶん成長したな。"], ["A", "Remember when you couldn't order coffee?", "コーヒーも注文できなかったころ、覚えてる？"], ["B", "Don't remind me! Now I read English picture books to my nephew.", "思い出させないで！今は甥っ子に英語の絵本を読んでるよ。"], ["A", "I'm proud of you. Let's celebrate tonight.", "あなたのこと、誇りに思うよ。今夜はお祝いしよう。"], ["B", "Cheers to the next step, and the next year!", "次の一歩と、次の一年に乾杯！"]], "q": {"3": ["今日は何の日？", ["英語を始めて一年", "ケンの誕生日", "結婚記念日"]], "5": ["昔のケンができなかったことは？", ["コーヒーを注文する", "電車に乗る", "メールを書く"]], "6": ["今のケンがしていることは？", ["甥に英語の絵本を読む", "英語を教える仕事", "英語で日記を出版"]]}}, {"t": "画面ごしの朝礼", "d": "在宅勤務の一日", "l": [["A", "Good morning! Are you working from home today?", "おはよう！今日は在宅勤務？"], ["B", "Yes. My son has a cold, so I'm staying home.", "うん。息子が風邪をひいたから、家にいるんだ。"], ["A", "I hope he feels better soon. Can you join the meeting at ten?", "早くよくなるといいね。十時の会議には出られる？"], ["B", "Sure. But my internet is a bit unstable today.", "うん。でも今日はネットが少し不安定なんだ。"], ["A", "Then turn your camera off if you need to.", "それなら、必要なときはカメラを切っていいよ。"], ["B", "Thank you. I'll share my screen for the sales report.", "ありがとう。売上報告は画面共有す
