  ["p3153", "What are you in the mood for?", "何が観たい気分？"],["p3154", "How about something light tonight?", "今夜は軽めのものはどう？"],["p3155", "I'm not really into horror.", "ホラーはあまり好きじゃないんだ。"],["p3156", "I've heard good things about this.", "これは評判がいいらしいよ。"],["p3157", "Is it too long, though?", "でも長すぎない？"],["p3158", "I've already seen that one.", "それはもう観たよ。"],["p3159", "Let's just pick something already.", "もういいかげん決めよう。"],["p3160", "I'll make some popcorn.", "ポップコーンを作るね。"]],
  r:[["Want to watch this scary one?", 2],["How about this big historical epic?", 4],["We've been scrolling for twenty minutes.", 6]],
  c:{sit:"家族と今夜観る映画を相談する",t:[["So what kind of movie do you feel like?", 1],["Have you seen this one yet?", 5],["This one got great reviews, you know.", 4]]}},
 {t:"第三百九十六歩 締め出された",d:"鍵を忘れて家に入れない",p:[
  ["p3161", "I locked myself out.", "鍵を中に置いたまま締め出されました。"],["p3162", "My keys are inside the apartment.", "鍵は部屋の中にあります。"],["p3163", "Do you have a spare key?", "合鍵はありますか？"],["p3164", "Could you call a locksmith?", "鍵屋さんを呼んでもらえますか？"],["p3165", "How much will it cost?", "いくらかかりますか？"],["p3166", "Can I wait at your place?", "お宅で待たせてもらえますか？"],["p3167", "I feel so silly right now.", "われながら情けないです。"],["p3168", "I'll keep a spare from now on.", "これからは合鍵を持っておきます。"]],
  r:[["Why are you standing out here?", 0],["The locksmith can come in an hour.", 5],["Don't worry, it happens to everyone.", 6]],
  c:{sit:"隣人に助けを求める",t:[["Hey, is something wrong?", 0],["Where are your keys?", 1],["I don't have a spare, sorry.", 3]]}},
 {t:"第三百九十七歩 山登り",d:"友人と山に登る",p:[
  ["p3169", "How far is the summit?", "山頂まではどのくらい？"],["p3170", "Can we take a short break?", "少し休憩してもいい？"],["p3171", "Make sure to drink water.", "ちゃんと水を飲んでね。"],["p3172", "The trail gets steep here.", "ここから道が急になるね。"],["p3173", "Watch your step on these rocks.", "この岩場は足元に気をつけて。"],["p3174", "The view is totally worth it.", "この景色のためなら登ったかいがある。"],["p3175", "We should head down before dark.", "暗くなる前に下りたほうがいい。"],["p3176", "My legs are going to hurt tomorrow.", "明日は足が筋肉痛になりそう。"]],
  r:[["I'm out of breath already.", 1],["Wow, look at that view!", 5],["It's getting late, isn't it?", 6]],
  c:{sit:"登山道で友人と話す",t:[["Come on, let's keep going.", 1],["I'm so thirsty already.", 2],["The sun is starting to set.", 6]]}},
 {t:"第三百九十八歩 ストレス解消",d:"ストレスの発散法を話す",p:[
  ["p3177", "I've been really stressed lately.", "最近、すごくストレスがたまっています。"],["p3178", "How do you usually unwind?", "ふだんはどうやって気分転換してる？"],["p3179", "I go for a long walk.", "長めの散歩に出かけます。"],["p3180", "Cooking helps me clear my head.", "料理をすると頭がすっきりします。"],["p3181", "I try to stay off my phone.", "スマホから離れるようにしています。"],["p3182", "A hot bath works wonders.", "熱いお風呂がよく効きます。"],["p3183", "Talking to friends helps a lot.", "友達と話すとすごく楽になります。"],["p3184", "Don't be too hard on yourself.", "自分を責めすぎないでね。"]],
  r:[["You seem tired. Is everything okay?", 0],["I just take a long bath. What about you?", 3],["I keep thinking I'm failing at everything.", 7]],
  c:{sit:"カフェで友人とストレスについて話す",t:[["You look exhausted. What's going on?", 0],["So what do you do to relax?", 2],["I made one mistake and I can't stop thinking about it.", 7]]}},
 {t:"第三百九十九歩 家具選び",d:"家具店でソファを選ぶ",p:[
  ["p3185", "We're looking for a sofa.", "ソファを探しています。"],["p3186", "It needs to fit a small room.", "狭い部屋に置ける大きさがいいです。"],["p3187", "Can I sit on this one?", "これに座ってみてもいいですか？"],["p3188", "Is the cover washable?", "カバーは洗えますか？"],["p3189", "Does it come in other colors?", "ほかの色もありますか？"],["p3190", "Do you offer delivery?", "配送はしてもらえますか？"],["p3191", "Does it need assembly?", "組み立ては必要ですか？"],["p3192", "We'll think it over.", "少し考えてみます。"]],
  r:[["Welcome! Are you looking for anything in particular?", 0],["This one only comes in gray, sadly.", 4],["So, shall I ring it up for you?", 7]],
  c:{sit:"家具店で店員と話す",t:[["Hello! Can I help you find something?", 0],["This sofa is quite large, though.", 1],["This one is our most comfortable model.", 2]]}},
 {t:"第四百歩 四百の歩み",d:"四百歩目を祝う",p:[
  ["p3193", "We've come four hundred steps!", "四百歩まで来ました！"],["p3194", "I never imagined getting this far.", "ここまで来られるとは思いませんでした。"],["p3195", "Every step has been worth it.", "どの一歩にも意味がありました。"],["p3196", "I can say so much more now.", "言えることがずっと増えました。"],["p3197", "Mistakes taught me the most.", "いちばんの先生は失敗でした。"],["p3198", "I'm proud of how far I've come.", "ここまで来た自分を誇りに思います。"],["p3199", "Let's celebrate this milestone together.", "この節目を一緒に祝いましょう。"],["p3200", "The moon is still waiting ahead.", "月はまだこの先で待っています。"]],
  r:[["How many steps have we taken now?", 0],["What helped you learn the most?", 4],["How do you feel about your progress?", 5]],
  c:{sit:"四百歩目を仲間と振り返る",t:[["Can you believe how far we've come?", 1],["What did you learn from all this?", 4],["So what's next for you?", 7]]}},
 {t:"第四百一歩 雨宿り",d:"急な雨で雨宿りする",p:[
  ["p3201", "It's really coming down out there.", "外はひどい降りだね。"],["p3202", "Let's wait under here for a bit.", "ここで少し待とう。"],["p3203", "I didn't bring an umbrella.", "傘を持ってこなかった。"],["p3204", "It should pass in a few minutes.", "数分でやむはずだよ。"],["p3205", "I'm completely soaked.", "びしょぬれだよ。"],["p3206", "Want to share my umbrella?", "傘に入っていく？"],["p3207", "Let's make a run for it.", "走って行っちゃおう。"],["p3208", "Looks like it's letting up.", "小降りになってきたみたい。"]],
  r:[["Oh no, I left my umbrella at home.", 5],["Should we wait a little longer?", 7],["We can't wait here all day.", 6]],
  c:{sit:"急な雨で友人と軒下に駆け込む",t:[["Wow, look at that rain!", 0],["You're dripping wet!", 4],["Do you think it'll stop soon?", 3]]}},
 {t:"第四百二歩 日曜大工",d:"棚を作るのを手伝う",p:[
  ["p3209", "Can you hold this board steady?", "この板をしっかり押さえてくれる？"],["p3210", "Pass me the screwdriver, please.", "ドライバーを取ってくれる？"],["p3211", "Let's measure it twice.", "念のため二回測ろう。"],["p3212", "I think it's a little crooked.", "少し曲がっていると思う。"],["p3213", "We need longer screws.", "もっと長いネジが要るね。"],["p3214", "Careful, the edge is sharp.", "気をつけて、端がとがってるよ。"],["p3215", "It's sturdier than it looks.", "見た目より頑丈だね。"],["p3216", "Not bad for our first try.", "はじめてにしては上出来だ。"]],
  r:[["Is it perfectly straight?", 3],["These screws aren't holding.", 4],["Will it really hold all my books?", 6]],
  c:{sit:"友人と棚を組み立てる",t:[["I'll start drilling now.", 0],["What do you need from the toolbox?", 1],["Okay, it's done. What do you think?", 7]]}},
 {t:"第四百三歩 理想の休日",d:"理想の休日について語る",p:[
  ["p3217", "My ideal day off is simple.", "わたしの理想の休日はシンプルです。"],["p3218", "I'd sleep in without an alarm.", "目覚ましなしで朝寝坊したいです。"],["p3219", "Then a slow breakfast by the window.", "それから窓辺でゆっくり朝食を。"],["p3220", "I'd spend the afternoon reading.", "午後は読書をして過ごしたいです。"],["p3221", "Maybe a walk by the sea.", "海辺を散歩するのもいいですね。"],["p3222", "I wouldn't check my email at all.", "メールは一切見ません。"],["p3223", "Dinner with close friends sounds perfect.", "親しい友人と夕食なんて最高です。"],["p3224", "What about you?", "あなたはどうですか？"]],
  r:[["How would you start your perfect day off?", 1],["Would you do any work at all?", 5],["And how would the day end?", 6]],
  c:{sit:"同僚と休日の過ごし方を話す",t:[["What's your idea of a perfect day off?", 0],["Would you get up early?", 1],["I'd go hiking all day. And you?", 4]]}},
 {t:"第四百四歩 時間の使い方",d:"時間管理のコツを話す",p:[
  ["p3225", "I never seem to have enough time.", "いつも時間が足りない気がします。"],["p3226", "I make a to-do list every morning.", "毎朝やることリストを作ります。"],["p3227", "I do the hardest task first.", "いちばん大変な作業から先にやります。"],["p3228", "I tend to put things off.", "ついものごとを後回しにしがちです。"],["p3229", "I try not to multitask.", "同時に複数のことをしないようにしています。"],["p3230", "Social media eats up my time.", "SNSに時間を取られてしまいます。"],["p3231", "I block out time for focus.", "集中する時間を確保しています。"],["p3232", "Learning to say no helped me.", "断れるようになって楽になりました。"]],
  r:[["How do you plan your day?", 1],["What's your biggest time waster?", 5],["Do you procrastinate at all?", 3]],
  c:{sit:"同僚と仕事の進め方を話す",t:[["How do you get so much done?", 2],["Where does all your time go?", 5],["Why is that report still not finished?", 3]]}},
 {t:"第四百五歩 食生活",d:"ふだんの食生活について話す",p:[
  ["p3233", "I'm trying to eat healthier.", "もっと健康的に食べるようにしています。"],["p3234", "I cook at home most days.", "ほとんど毎日、自炊しています。"],["p3235", "I've cut back on sweets.", "甘いものを控えるようにしました。"],["p3236", "I often skip breakfast, honestly.", "正直、よく朝ごはんを抜きます。"],["p3237", "I try to eat more vegetables.", "野菜を多めに食べるようにしています。"],["p3238", "Late-night snacks are my weakness.", "夜食がどうしてもやめられません。"],["p3239", "I don't believe in strict diets.", "厳しい食事制限はしない主義です。"],["p3240", "Everything in moderation, right?", "何事もほどほどが一番ですよね？"]],
  r:[["Do you eat out a lot?", 1],["Do you have any bad eating habits?", 5],["Are you on any special diet?", 6]],
  c:{sit:"友人と食生活について話す",t:[["You look great lately. What's your secret?", 0],["Do you eat a lot of sugar?", 2],["So you never eat junk food at all?", 7]]}},
 {t:"第四百六歩 席を譲る",d:"電車で席を譲る",p:[
  ["p3241", "Would you like to sit here?", "よかったら、ここに座りませんか？"],["p3242", "Please, take my seat.", "どうぞ、私の席に座ってください。"],["p3243", "I'm getting off soon anyway.", "どうせもうすぐ降りますから。"],["p3244", "It's no trouble at all.", "全然かまいませんよ。"],["p3245", "You look a bit pale.", "顔色が少し悪いですよ。"],["p3246", "I'm fine standing, thanks.", "立っていて平気です、ありがとう。"],["p3247", "That's very kind of you.", "ご親切にありがとうございます。"],["p3248", "Let me hold your bag for you.", "お荷物を持ちますよ。"]],
  r:[["Oh, I couldn't possibly take your seat.", 2],["Thank you, that's so thoughtful.", 3],["Do you need to sit down?", 5]],
  c:{sit:"電車で年配の人に席を譲る",t:[["Oh, thank you. But where will you sit?", 2],["I feel bad making you stand.", 3],["Could you help me with this heavy bag?", 7]]}},
 {t:"第四百七歩 道でばったり",d:"道で知人に偶然会う",p:[
  ["p3249", "Fancy running into you here!", "こんなところで会うなんて！"],["p3250", "What a small world!", "世間は狭いですね！"],["p3251", "It's been ages, hasn't it?", "ずいぶん久しぶりですね。"],["p3252", "What brings you to this neighborhood?", "この辺りにはどうして？"],["p3253", "I just moved nearby, actually.", "実は最近この近くに引っ越したんです。"],["p3254", "You haven't changed a bit.", "全然変わっていませんね。"],["p3255", "I'm in a bit of a rush.", "ちょっと急いでいるんです。"],["p3256", "Let's grab coffee sometime soon.", "近いうちにお茶でもしましょう。"]],
  r:[["Hey! Is that really you?", 0],["So, what are you doing around here?", 4],["Do you have time to chat for a bit?", 6]],
  c:{sit:"街角で昔の同僚にばったり会う",t:[["Wait, you know my cousin too?", 1],["Do you live around here these days?", 4],["Well, I'd better let you go. Take care.", 7]]}},
 {t:"第四百八歩 保護者会",d:"保護者会でほかの親と話す",p:[
  ["p3257", "Which class is your child in?", "お子さんは何組ですか？"],["p3258", "My daughter's in the same class.", "うちの娘も同じクラスです。"],["p3259", "Are you volunteering for anything this year?", "今年は何か係を引き受けますか？"],["p3260", "I signed up for the library committee.", "図書係に申し込みました。"],["p3261", "I can only help on weekends.", "手伝えるのは週末だけなんです。"],["p3262", "Let's swap contact info, just in case.", "念のため連絡先を交換しましょう。"],["p3263", "The meeting ran a bit long.", "会が少し長引きましたね。"],["p3264", "I'm still learning how things work.", "まだ勝手がよくわからなくて。"]],
  r:[["My son is in class three.", 1],["Did you sign up for any roles?", 3],["You're new to this school, right?", 7]],
  c:{sit:"保護者会のあとで別の保護者と話す",t:[["Hi, I'm Sota's mom. Nice to meet you.", 0],["We need someone to help with sports day.", 4],["Could I text you if I miss an announcement?", 5]]}},
 {t:"第四百九歩 着付け体験",d:"着物の着付けを体験する",p:[
  ["p3265", "I've always wanted to wear a kimono.", "ずっと着物を着てみたかったんです。"],["p3266", "Which pattern would suit me?", "どの柄が私に似合いますか？"],["p3267", "The obi feels a bit tight.", "帯が少しきついです。"],["p3268", "How do I walk in these?", "これでどう歩けばいいですか？"],["p3269", "Take small steps, right?", "小さな歩幅で歩くんですよね？"],["p3270", "Could you take a photo of me?", "写真を撮ってもらえますか？"],["p3271", "I feel like a different person.", "別人になった気分です。"],["p3272", "How long can I keep it on?", "いつまで着ていられますか？"]],
  r:[["Is this your first time in a kimono?", 0],["How does it feel? Too tight?", 2],["Well, what do you think of yourself?", 6]],
  c:{sit:"着付け体験で講師と話す",t:[["We have floral and striped patterns today.", 1],["These sandals take some getting used to.", 3],["There, the obi is tied. Is it comfortable?", 2]]}},
 {t:"第四百十歩 断捨離",d:"部屋の物を減らす",p:[
  ["p3273", "I'm finally decluttering my apartment.", "ついに部屋の断捨離をしています。"],["p3274", "I haven't worn this in years.", "これはもう何年も着ていません。"],["p3275", "It's hard to let things go.", "物を手放すのは難しいです。"],["p3276", "Does this still spark joy?", "これ、まだときめきますか？"],["p3277", "Let's donate what's still usable.", "まだ使える物は寄付しましょう。"],["p3278", "I keep things just in case.", "「いつか使うかも」ととっておいてしまいます。"],["p3279", "The room feels so much bigger.", "部屋がずっと広く感じます。"],["p3280", "Out of sight, out of mind.", "目に入らなければ忘れてしまうものです。"]],
  r:[["Why are there boxes everywhere?", 0],["Why are you keeping all these old cables?", 5],["Wow, what a difference!", 6]],
  c:{sit:"友人の片付けを手伝う",t:[["When did you last wear this sweater?", 1],["What should we do with these old toys?", 4],["You have so much stuff! Why?", 5]]}},
 {t:"第四百十一歩 早起き習慣",d:"朝型の生活に変える",p:[
  ["p3281", "I've started getting up at five.", "五時に起きるようにしました。"],["p3282", "The mornings are so peaceful.", "朝はとても穏やかです。"],["p3283", "I go to bed much earlier now.", "前よりずっと早く寝ています。"],["p3284", "The first week was really tough.", "最初の一週間は本当につらかったです。"],["p3285", "I get so much more done.", "前よりずっとはかどります。"],["p3286", "I'm not a morning person, though.", "でも、もともと朝型ではないんです。"],["p3287", "The early bird catches the worm.", "早起きは三文の徳。"],["p3288", "Coffee helps me wake up.", "コーヒーで目を覚ましています。"]],
  r:[["Don't you get sleepy at night?", 2],["Was it hard to adjust?", 3],["Why bother getting up so early?", 6]],
  c:{sit:"同僚と朝の習慣について話す",t:[["What time do you get up these days?", 0],["Has it helped your productivity?", 4],["How do you stay alert so early?", 7]]}},
 {t:"第四百十二歩 花屋で花束",d:"花屋で花束を作ってもらう",p:[
  ["p3289", "I'd like a small bouquet, please.", "小さな花束をお願いします。"],["p3290", "It's for a friend's birthday.", "友人の誕生日用です。"],["p3291", "Something bright and cheerful, maybe.", "明るくて元気な感じがいいかな。"],["p3292", "What's in season right now?", "今の季節の花は何ですか？"],["p3293", "Could you leave out the lilies?", "ユリは入れないでもらえますか？"],["p3294", "She doesn't like strong scents.", "彼女は強い香りが苦手なんです。"],["p3295", "Could you add a message card?", "メッセージカードを付けてもらえますか？"],["p3296", "Could you wrap it nicely?", "きれいに包んでもらえますか？"]],
  r:[["What's the occasion?", 1],["Any flowers you'd like to avoid?", 4],["Why no lilies, if you don't mind me asking?", 5]],
  c:{sit:"花屋で店員に花束を頼む",t:[["What kind of colors did you have in mind?", 2],["Would you like to include a note?", 6],["Is there anything you'd like me to leave out?", 4]]}},
 {t:"第四百十三歩 名刺交換",d:"初対面で名刺を交換する",p:[
  ["p3297", "Here's my card.", "名刺をどうぞ。"],["p3298", "Thank you. Here's mine.", "ありがとうございます。こちらが私のです。"],["p3299", "How do you pronounce your name?", "お名前はどうお読みしますか？"],["p3300", "I'm in charge of overseas sales.", "海外営業を担当しています。"],["p3301", "I've heard a lot about your company.", "御社のお噂はかねがね伺っています。"],["p3302", "Is this the best number to reach you?", "こちらの番号にご連絡すればよろしいですか？"],["p3303", "I'll send you an email later.", "後ほどメールをお送りします。"],["p3304", "I look forward to working together.", "ご一緒できるのを楽しみにしています。"]],
  r:[["Here's my business card.", 1],["What do you do at your company?", 3],["Shall we keep in touch?", 6]],
  c:{sit:"交流会で取引先候補と名刺を交換する",t:[["My name is a little tricky to pronounce.", 2],["You can call me on my mobile anytime.", 5],["Our team is really excited about this project.", 7]]}},
 {t:"第四百十四歩 歓迎会の幹事",d:"新人の歓迎会を企画する",p:[
  ["p3305", "I'm organizing the welcome party.", "歓迎会の幹事をしています。"],["p3306", "Does Friday evening work for everyone?", "金曜の夜でみんな大丈夫ですか？"],["p3307", "I've booked a place near the station.", "駅の近くの店を予約しました。"],["p3308", "Any food allergies I should know about?", "知っておくべき食物アレルギーはありますか？"],["p3309", "It's around four thousand yen each.", "一人四千円くらいです。"],["p3310", "Please let me know by Wednesday.", "水曜までに知らせてください。"],["p3311", "Could you say a few words?", "一言あいさつをお願いできますか？"],["p3312", "Thanks for coming, everyone!", "皆さん、来てくれてありがとう！"]],
  r:[["Who's handling the party this time?", 0],["How much should I bring?", 4],["When do you need my answer?", 5]],
  c:{sit:"同僚と歓迎会の準備について話す",t:[["Where are we having it?", 2],["What day are you thinking of?", 1],["As his manager, I'd love to welcome him.", 6]]}},
 {t:"第四百十五歩 相席",d:"混んだ店で相席する",p:[
  ["p3313", "Do you mind if I sit here?", "ここに座ってもいいですか？"],["p3314", "Go ahead, it's free.", "どうぞ、空いていますよ。"],["p3315", "Sorry to squeeze in like this.", "割り込むようですみません。"],["p3316", "Is this place always this busy?", "この店はいつもこんなに混んでいるんですか？"],["p3317", "What would you recommend here?", "ここのおすすめは何ですか？"],["p3318", "The ramen here is famous.", "ここはラーメンが有名なんです。"],["p3319", "Could you pass the napkins?", "紙ナプキンを取ってもらえますか？"],["p3320", "Enjoy the rest of your meal.", "ごゆっくり召し上がってください。"]],
  r:[["Excuse me, is this seat taken?", 1],["What's good here?", 5],["Well, I'm off. Nice chatting with you.", 7]],
  c:{sit:"混んだ食堂で知らない人と相席する",t:[["It's really packed. Are you looking for a seat?", 0],["Wow, look at that line outside!", 3],["I'm a regular here, actually.", 4]]}},
 {t:"第四百十六歩 お土産選び",d:"旅先でお土産を選ぶ",p:[
  ["p3321", "I need gifts for my coworkers.", "同僚へのお土産が必要です。"],["p3322", "Something individually wrapped would be best.", "個包装のものが一番いいです。"],["p3323", "Which one is the most popular?", "一番人気はどれですか？"],["p3324", "Does this need to be refrigerated?", "これは冷蔵が必要ですか？"],["p3325", "How long does it keep?", "日持ちはどのくらいしますか？"],["p3326", "It has to fit in my suitcase.", "スーツケースに入らないといけないんです。"],["p3327", "Can I try a sample?", "試食できますか？"],["p3328", "I'll take five boxes of these.", "これを五箱ください。"]],
  r:[["Who are you shopping for?", 0],["What sort of thing are you after?", 1],["How many would you like?", 7]],
  c:{sit:"土産物店で店員と話す",t:[["These cakes are made fresh every morning.", 4],["We also have this large decorative vase.", 5],["We have lots of sweets. Can I help?", 2]]}},
 {t:"第四百十七歩 免許の更新",d:"運転免許を更新する",p:[
  ["p3329", "I'm here to renew my license.", "免許の更新に来ました。"],["p3330", "Here's my notice and old license.", "通知書と古い免許証です。"],["p3331", "Where do I take the eye test?", "視力検査はどこで受けますか？"],["p3332", "Do I need to attend a lecture?", "講習を受ける必要がありますか？"],["p3333", "I haven't had any violations.", "違反は一度もしていません。"],["p3334", "Can I retake the photo?", "写真を撮り直せますか？"],["p3335", "I blinked in that one.", "目をつぶってしまいました。"],["p3336", "When will the new one be ready?", "新しい免許証はいつできますか？"]],
  r:[["How can I help you today?", 0],["Any traffic tickets in the last five years?", 4],["Is something wrong with your photo?", 6]],
  c:{sit:"免許センターの窓口で職員と話す",t:[["Please hand me your documents.", 1],["Next, you'll need to check your eyesight.", 2],["Your photo is done. Take a look.", 5]]}},
 {t:"第四百十八歩 衣替え",d:"季節の服を入れ替える",p:[
  ["p3337", "It's time to switch out my clothes.", "衣替えの時期です。"],["p3338", "I'm packing away the summer clothes.", "夏服をしまっています。"],["p3339", "This sweater smells a bit musty.", "このセーター、少しかび臭いです。"],["p3340", "I should wash these before storing them.", "しまう前に洗ったほうがいいですね。"],["p3341", "Where did my winter coat go?", "冬のコートはどこにいったかな？"],["p3342", "Vacuum bags save so much space.", "圧縮袋はすごく場所の節約になります。"],["p3343", "I barely wore this all season.", "この服、今シーズンほとんど着ませんでした。"],["p3344", "My closet is bursting at the seams.", "クローゼットがはちきれそうです。"]],
  r:[["Why is the bed covered in clothes?", 0],["How do you fit everything in?", 5],["Why do you want a bigger closet?", 7]],
  c:{sit:"家族と衣替えをする",t:[["Let's put these shirts straight into the box.", 3],["It's getting cold. Wear your coat.", 4],["What's that awful smell?", 2]]}},
 {t:"第四百十九歩 合鍵を作る",d:"鍵屋で合鍵を作る",p:[
  ["p3345", "I'd like a copy of this key.", "この鍵の合鍵をお願いします。"],["p3346", "Could you make two copies?", "二本作ってもらえますか？"],["p3347", "How long will that take?", "どのくらいかかりますか？"],["p3348", "It's for my apartment door.", "アパートのドア用です。"],["p3349", "This one sticks a little.", "これは少し引っかかります。"],["p3350", "Can I wait here for it?", "ここで待っていてもいいですか？"],["p3351", "What if it doesn't work?", "うまく使えなかったらどうなりますか？"],["p3352", "I'll keep the spare key at work.", "合鍵は職場に置いておきます。"]],
  r:[["How many do you need?", 1],["Is the copy working okay?", 4],["It'll be ready in about ten minutes.", 5]],
  c:{sit:"鍵屋で店員と話す",t:[["What can I do for you?", 0],["Is this key for a car or a house?", 3],["Where will you keep the extra key?", 7]]}},
 {t:"第四百二十歩 間違い電話",d:"間違い電話に対応する",p:[
  ["p3353", "I think you have the wrong number.", "番号をお間違えだと思います。"],["p3354", "There's no one here by that name.", "そういう名前の者はおりません。"],["p3355", "What number did you dial?", "何番におかけですか？"],["p3356", "No problem, it happens.", "大丈夫ですよ、よくあることです。"],["p3357", "Sorry, I must have dialed the wrong number.", "すみません、かけ間違えたようです。"],["p3358", "Who's calling, please?", "どちら様ですか？"],["p3359", "Let me double-check the number.", "番号を確かめ直します。"],["p3360", "Good luck finding them.", "見つかるといいですね。"]],
  r:[["Hello, is this the Grand Hotel?", 0],["Oh, I'm so sorry for bothering you.", 3],["Hello? Who is this?", 5]],
  c:{sit:"自宅に間違い電話がかかってくる",t:[["Hi, I'd like to order a large pizza.", 0],["Really? I'm sure I dialed correctly.", 2],["Sorry about that! Have a good evening.", 3]]}},
 {t:"第四百二十一歩 靴の修理",d:"靴の修理を頼む",p:[
  ["p3361", "The heel on this shoe broke.", "この靴のかかとが取れました。"],["p3362", "The soles are wearing thin.", "靴底がすり減ってきています。"],["p3363", "Can these still be fixed?", "これはまだ直せますか？"],["p3364", "They're my favorite pair.", "お気に入りの一足なんです。"],["p3365", "How much would that cost?", "それはいくらかかりますか？"],["p3366", "Could you polish them too?", "ついでに磨いてもらえますか？"],["p3367", "They look brand new!", "新品みたいです！"],["p3368", "I'll pick them up tomorrow.", "明日取りに来ます。"]],
  r:[["What happened to this one?", 0],["Why not just buy a new pair?", 3],["Here you are. What do you think?", 6]],
  c:{sit:"靴の修理店で店員と話す",t:[["Replacing the soles is a big job.", 4],["Anything else while I'm at it?", 5],["They'll be ready by five today.", 7]]}},
 {t:"第四百二十二歩 親の介護",d:"親の介護について話す",p:[
  ["p3369", "My mother needs more help lately.", "最近、母に手助けが必要になってきました。"],["p3370", "I visit her every weekend.", "毎週末、会いに行っています。"],["p3371", "It's hard to balance with work.", "仕事との両立が難しいです。"],["p3372", "We're looking into home care services.", "訪問介護サービスを調べています。"],["p3373", "My siblings and I take turns.", "きょうだいで交代しています。"],["p3374", "I try not to burn out.", "燃え尽きないように気をつけています。"],["p3375", "Taking a break isn't selfish.", "休むことはわがままではありません。"],["p3376", "Thanks for asking about her.", "母のことを気にかけてくれてありがとう。"]],
  r:[["How's your mom doing these days?", 0],["Do you handle everything yourself?", 4],["Are you getting any professional help?", 3]],
  c:{sit:"同僚と親の介護について話す",t:[["How often do you see her?", 1],["How do you manage with your job?", 2],["Let me know how your mom's doing, okay?", 7]]}},
 {t:"第四百二十三歩 筋肉痛",d:"運動後の筋肉痛について話す",p:[
  ["p3377", "My legs are so sore today.", "今日は脚がひどい筋肉痛です。"],["p3378", "I overdid it at the gym.", "ジムでやりすぎました。"],["p3379", "I can barely climb the stairs.", "階段を上るのもやっとです。"],["p3380", "It always hits me two days later.", "いつも二日後に来るんです。"],["p3381", "A hot bath should help.", "熱いお風呂に入れば楽になるはず。"],["p3382", "I skipped stretching. Big mistake.", "ストレッチを抜いたのが大失敗でした。"],["p3383", "No pain, no gain, right?", "痛みなくして得るものなし、ですよね？"],["p3384", "I'm taking it easy today.", "今日は軽めにしておきます。"]],
  r:[["Why are you walking so funny?", 0],["What did you do to yourself?", 1],["Are you coming to the gym tonight?", 7]],
  c:{sit:"友人と筋肉痛について話す",t:[["You should warm up before working out.", 5],["Wasn't your workout on Sunday? It's Tuesday.", 3],["Doesn't it hurt? Why keep training so hard?", 6]]}},
 {t:"第四百二十四歩 書道教室",d:"書道教室に通う",p:[
  ["p3385", "I've just started taking calligraphy lessons.", "書道を習い始めたところです。"],["p3386", "Holding the brush is harder than it looks.", "筆の持ち方は見た目より難しいです。"],["p3387", "My lines keep getting shaky.", "線がどうしても震えてしまいます。"],["p3388", "How much ink should I use?", "墨はどのくらいつければいいですか？"],["p3389", "Could you show me once more?", "もう一度見せてもらえますか？"],["p3390", "It really calms my mind.", "本当に心が落ち着きます。"],["p3391", "I'm practicing the same character again.", "同じ字をまた練習しています。"],["p3392", "Practice makes perfect, they say.", "練習あるのみ、と言いますよね。"]],
  r:[["Any new hobbies lately?", 0],["Why do you enjoy it so much?", 5],["You've written that character fifty times!", 7]],
  c:{sit:"書道教室で先生に教わる",t:[["Watch how I move the brush. Got it?", 4],["Your strokes look a little unsteady.", 2],["Now, dip your brush in the ink.", 3]]}},
 {t:"第四百二十五歩 パン屋",d:"パン屋でパンを選ぶ",p:[
  ["p3393", "Everything smells amazing in here.", "ここ、すごくいい香りがします。"],["p3394", "Which bread is freshly baked?", "焼きたてはどれですか？"],["p3395", "Could you slice this loaf?", "この食パンを切ってもらえますか？"],["p3396", "Thick slices, please.", "厚切りでお願いします。"],["p3397", "What's in this pastry?", "このパンには何が入っていますか？"],["p3398", "Is this one very sweet?", "これはすごく甘いですか？"],["p3399", "I'll take two croissants, please.", "クロワッサンを二つください。"],["p3400", "Could I have a separate bag?", "別の袋をもらえますか？"]],
  r:[["Welcome! Take your time looking around.", 0],["How would you like it sliced?", 3],["Do you want them all in one bag?", 7]],
  c:{sit:"パン屋で店員と話す",t:[["This loaf is our most popular one.", 2],["That's our new seasonal pastry.", 4],["This bun is filled with custard cream.", 5]]}},
 {t:"第四百二十六歩 ポイントカード",d:"カフェでポイントカードを使う",p:[
  ["p3401", "Can I get a stamp on my loyalty card?", "ポイントカードにスタンプを押してもらえますか？"],["p3402", "I left my card at home.", "カードを家に忘れてきました。"],["p3403", "Could you stamp it next time?", "次回まとめて押してもらえますか？"],["p3404", "How many stamps until a free drink?", "あといくつで無料のドリンクですか？"],["p3405", "I'd like to use my points today.", "今日はポイントを使いたいです。"],["p3406", "Is there an app version?", "アプリ版はありますか？"],["p3407", "My card is completely full.", "カードがいっぱいになりました。"],["p3408", "Do the points ever expire?", "ポイントに有効期限はありますか？"]],
  r:[["Do you have your stamp card with you?", 1],["No problem, I can look you up by phone number. Would you like to save your points or use them?", 4],["Paper cards are easy to lose, aren't they?", 5]],
  c:{sit:"カフェのレジで店員とポイントカードの話をする",t:[["Do you have your stamp card with you?", 1],["Would you like to save your points or use them?", 4],["Paper cards are easy to lose, aren't they?", 5]]}},
 {t:"第四百二十七歩 マイバッグ",d:"店でマイバッグを使う",p:[
  ["p3409", "I brought my own bag.", "マイバッグを持ってきました。"],["p3410", "No bag needed, thanks.", "袋は要りません、ありがとう。"],["p3411", "Could I get a paper bag?", "紙袋をもらえますか？"],["p3412", "How much is a plastic bag?", "レジ袋はいくらですか？"],["p3413", "Where can I recycle these bottles?", "このペットボトルはどこでリサイクルできますか？"],["p3414", "I'll pack it myself.", "自分で袋に詰めます。"],["p3415", "Every little bit helps.", "小さなことの積み重ねが大事です。"],["p3416", "I always forget my reusable bag.", "いつもエコバッグを忘れちゃうんです。"]],
  r:[["Would you like a bag for these?", 0],["Shall I put everything in the bag for you?", 5],["Do you really think reusable bags make a difference?", 6]],
  c:{sit:"スーパーのレジで店員と話す",t:[["Would you like a bag for these?", 0],["Shall I put everything in the bag for you?", 5],["Do you really think reusable bags make a difference?", 6]]}},
 {t:"第四百二十八歩 セールスお断り",d:"電話のセールスを断る",p:[
  ["p3417", "I'm not interested, thank you.", "興味ありません、ありがとうございます。"],["p3418", "How did you get this number?", "この番号をどこで知ったんですか？"],["p3419", "Please take me off your list.", "リストから外してください。"],["p3420", "I don't make decisions over the phone.", "電話では決めないことにしています。"],["p3421", "Could you send it in writing?", "書面で送ってもらえますか？"],["p3422", "I'm in the middle of something.", "今ちょっと手が離せないんです。"],["p3423", "I'll have to pass on that.", "それは遠慮しておきます。"],["p3424", "Please don't call again.", "もう電話しないでください。"]],
  r:[["Do you have a few minutes to hear about our offer?", 5],["Can you sign up right now, while we're talking?", 3],["You're on our customer list, so we'll keep you updated.", 2]],
  c:{sit:"自宅にかかってきた営業電話を断る",t:[["Do you have a few minutes to hear about our offer?", 5],["Can you sign up right now, while we're talking?", 3],["You're on our customer list, so we'll keep you updated.", 2]]}},
 {t:"第四百二十九歩 サブスク選び",d:"動画配信サービスを比べる",p:[
  ["p3425", "Which streaming service do you use?", "どの動画配信サービスを使っていますか？"],["p3426", "It has a better selection of dramas.", "ドラマの品ぞろえがいいんです。"],["p3427", "The monthly fee keeps going up.", "月額料金がどんどん上がっていますね。"],["p3428", "Is there a free trial?", "無料のお試し期間はありますか？"],["p3429", "I'm subscribed to way too many.", "契約しすぎているんです。"],["p3430", "Can you share an account with family?", "家族でアカウントを共有できますか？"],["p3431", "I'll cancel after this series ends.", "このシリーズが終わったら解約します。"],["p3432", "It's not worth the money.", "お金を払う価値はありません。"]],
  r:[["Why do you prefer that streaming service?", 1],["How much do you pay for all your subscriptions?", 4],["Are you going to keep paying for it?", 6]],
  c:{sit:"友人と動画配信サービスについて話す",t:[["Why do you prefer that one?", 1],["How much do you pay for all your subscriptions?", 4],["Are you going to keep paying for it?", 6]]}},
 {t:"第四百三十歩 髪型の失敗",d:"切りすぎた髪について話す",p:[
  ["p3433", "They cut it way too short.", "短く切られすぎました。"],["p3434", "Be honest, does it look weird?", "正直に言って、変ですか？"],["p3435", "It's not what I asked for.", "頼んだ髪型と違います。"],["p3436", "I showed them a photo, too.", "写真まで見せたのに。"],["p3437", "At least it'll grow back.", "まあ、そのうち伸びますけどね。"],["p3438", "I'm wearing a hat for a while.", "しばらく帽子をかぶります。"],["p3439", "It suits you better than you think.", "思っているより似合っていますよ。"],["p3440", "I'm not going back there.", "もうあの店には行きません。"]],
  r:[["Oh, you got a haircut!", 0],["Did you explain what you wanted?", 3],["Are you going to that salon again?", 7]],
  c:{sit:"美容院帰りに友人と髪型の話をする",t:[["Oh, you got a haircut!", 0],["Did you explain what you wanted?", 3],["Are you going to that salon again?", 7]]}},
 {t:"第四百三十一歩 声がかれた",d:"発表の前に声が出なくなる",p:[
  ["p3441", "I've lost my voice.", "声が出なくなりました。"],["p3442", "I can barely speak above a whisper.", "ささやき声くらいしか出ません。"],["p3443", "Could you present the first part?", "最初の部分を発表してもらえますか？"],["p3444", "I'll stick to the main points.", "要点だけに絞ります。"],["p3445", "I'll keep my part short.", "自分の担当は短くします。"],["p3446", "Do you have any throat drops?", "のど飴を持っていますか？"],["p3447", "Sorry, I sound terrible today.", "今日はひどい声ですみません。"],["p3448", "Could I use a microphone?", "マイクを使ってもいいですか？"]],
  r:[["Your voice sounds really hoarse. What happened?", 0],["How can I help with the presentation?", 2],["The room is big, and you're speaking so softly.", 7]],
  c:{sit:"発表直前に声が出なくなり同僚に相談する",t:[["Your voice sounds really hoarse. What happened?", 0],["How can I help with the presentation?", 2],["The room is big, and you're speaking so softly.", 7]]}},
 {t:"第四百三十二歩 食券機",d:"友人に食券機の使い方を教える",p:[
  ["p3449", "You order from this machine first.", "まずこの機械で注文します。"],["p3450", "Put your money in first.", "先にお金を入れてください。"],["p3451", "Then press the button for your dish.", "それから料理のボタンを押します。"],["p3452", "Don't forget your change.", "おつりを忘れずに。"],["p3453", "Hand the ticket to the staff.", "券を店員さんに渡してください。"],["p3454", "The top left is usually the bestseller.", "左上がたいてい一番人気です。"],["p3455", "It only takes cash, unfortunately.", "残念ながら現金しか使えません。"],["p3456", "You can choose how firm your noodles are.", "麺の固さを選べますよ。"]],
  r:[["Wait, where do I order?", 0],["Can I pay with my credit card?", 6],["Which one should I pick? I can't read the menu.", 5]],
  c:{sit:"ラーメン店で外国人の友人に食券機の使い方を教える",t:[["Wait, where do I order?", 0],["Can I pay with my credit card?", 6],["Which one should I pick? I can't read the menu.", 5]]}},
 {t:"第四百三十三歩 渋滞にはまる",d:"車で渋滞にはまる",p:[
  ["p3457", "We're stuck in traffic.", "渋滞にはまっています。"],["p3458", "There must be an accident ahead.", "この先で事故があったに違いありません。"],["p3459", "Let's try a different route.", "別の道を試しましょう。"],["p3460", "We're barely moving.", "ほとんど進んでいません。"],["p3461", "I'll text them we're running late.", "遅れると連絡しておきます。"],["p3462", "Should we take the next exit?", "次の出口で降りましょうか？"],["p3463", "It's bumper to bumper all the way.", "ずっと車がぎっしりです。"],["p3464", "We should have left earlier.", "もっと早く出ればよかったです。"]],
  r:[["Why aren't we moving at all?", 1],["They're expecting us at noon, you know.", 4],["If only we'd gotten up on time.", 7]],
  c:{sit:"友人の車で渋滞にはまる",t:[["Why aren't we moving at all?", 1],["They're expecting us at noon, you know.", 4],["If only we'd gotten up on time.", 7]]}},
 {t:"第四百三十四歩 防犯対策",d:"家の防犯について話す",p:[
  ["p3465", "Did you lock the back door?", "裏口の鍵、閉めた？"],["p3466", "We should install a security camera.", "防犯カメラを付けたほうがいいです。"],["p3467", "Let's get a motion sensor light.", "人感センサーライトを付けましょう。"],["p3468", "Don't post that we're away.", "留守にしていることは投稿しないで。"],["p3469", "Can you check the windows too?", "窓も確認してくれる？"],["p3470", "Better safe than sorry.", "用心するに越したことはありません。"],["p3471", "There was a break-in nearby.", "近所で空き巣があったんです。"],["p3472", "Let's ask a neighbor to watch the house.", "近所の人に家を見てもらいましょう。"]],
  r:[["Why the sudden interest in home security?", 6],["Isn't a camera a bit too much?", 5],["Who will keep an eye on things while we're away?", 7]],
  c:{sit:"家族と家の防犯について話す",t:[["Why the sudden interest in home security?", 6],["Isn't a camera a bit too much?", 5],["So who will watch the house while we're traveling?", 7]]}},
 {t:"第四百三十五歩 共有冷蔵庫",d:"職場の共有冷蔵庫について話す",p:[
  ["p3473", "Someone ate my yogurt again.", "また誰かにヨーグルトを食べられました。"],["p3474", "Is this container yours?", "この容器、あなたのですか？"],["p3475", "Let's label everything with our names.", "全部に名前を書きましょう。"],["p3476", "Something in there smells awful.", "中で何かひどいにおいがします。"],["p3477", "Could we clean it out on Friday?", "金曜日に中を片付けませんか？"],["p3478", "This has been here for weeks.", "これ、何週間も入ったままです。"],["p3479", "I'll put up a notice.", "貼り紙をしておきます。"],["p3480", "Feel free to throw it out.", "捨ててしまってかまいません。"]],
  r:[["Why do you look so annoyed?", 0],["How do we stop people taking each other's food?", 2],["Should I toss this old container of yours?", 7]],
  c:{sit:"同僚と職場の共有冷蔵庫について話す",t:[["Why do you look so annoyed?", 0],["How do we stop people taking each other's food?", 2],["Should I toss these old leftovers of yours?", 7]]}},
 {t:"第四百三十六歩 会議室の予約",d:"会議室の予約が重なる",p:[
  ["p3481", "I think I booked this room.", "この部屋、私が予約したと思うんですが。"],["p3482", "Could you check the calendar?", "カレンダーを確認してもらえますか？"],["p3483", "There must be a double booking.", "ダブルブッキングのようです。"],["p3484", "How much longer will you need it?", "あとどのくらい使いますか？"],["p3485", "We can move to the small room.", "小さい部屋に移れますよ。"],["p3486", "We'll wrap up in five minutes.", "五分で切り上げます。"],["p3487", "Sorry, we ran over time.", "すみません、時間をオーバーしました。"],["p3488", "Let's sort it out together.", "一緒に何とかしましょう。"]],
  r:[["Excuse me, we have this room booked from two.", 0],["The calendar says your booking ended at two.", 6],["So, is your meeting nearly finished?", 5]],
  c:{sit:"会議室を使っていたら、次に予約したチームが来た",t:[["Oh, are you waiting for this room?", 0],["Your meeting was supposed to end at two!", 6],["Excuse me, is your meeting nearly finished?", 5]]}},
 {t:"第四百三十七歩 婚約の知らせ",d:"友人から婚約の報告を受ける",p:[
  ["p3489", "Congratulations, that's wonderful news!", "おめでとう、素晴らしい知らせですね！"],["p3490", "How did he propose?", "どんなふうにプロポーズされたんですか？"],["p3491", "I had a feeling this was coming.", "そうなる気がしていました。"],["p3492", "Have you set a date yet?", "もう日取りは決まりましたか？"],["p3493", "Let me see the ring!", "指輪を見せて！"],["p3494", "You two are perfect for each other.", "二人はお似合いですね。"],["p3495", "I'm so happy for you.", "本当によかったですね。"],["p3496", "Let me know if you need any help.", "手伝えることがあったら言ってね。"]],
  r:[["Guess what? We're getting married!", 0],["Did you know he was going to ask me?", 2],["Planning a wedding is going to be so much work.", 7]],
  c:{sit:"友人から婚約の報告を受ける",t:[["Guess what? We're getting married!", 0],["Did you know he was going to ask me?", 2],["Planning a wedding is going to be so much work.", 7]]}},
 {t:"第四百三十八歩 迷い犬",d:"迷子の犬を見つける",p:[
  ["p3497", "This dog seems to be lost.", "この犬、迷子みたいです。"],["p3498", "It has a tag on its collar.", "首輪に名札が付いています。"],["p3499", "Is this your dog, by any chance?", "ひょっとして、あなたの犬ですか？"],["p3500", "Let's call the number on the tag.", "名札の番号に電話しましょう。"],["p3501", "He's a little scared, poor thing.", "ちょっと怖がっていて、かわいそうに。"],["p3502", "I found him near the park.", "公園の近くで見つけました。"],["p3503", "Should we take him to the police?", "警察に連れて行きましょうか？"],["p3504", "He's safe and sound now.", "もう無事ですよ。"]],
  r:[["Where did this dog come from?", 5],["Poor thing, is he hurt at all?", 7],["We can't find the owner anywhere.", 6]],
  c:{sit:"迷子の犬を保護して友人と相談する",t:[["Oh my goodness, Max! Where was he?", 5],["Is he okay? Did anything happen to him?", 7],["We can't find the owner anywhere.", 6]]}},
 {t:"第四百三十九歩 荷物の預かり",d:"隣人の荷物を預かる",p:[
  ["p3505", "A package came for you today.", "今日、お荷物が届きましたよ。"],["p3506", "I signed for it on your behalf.", "代わりにサインしておきました。"],["p3507", "Could you hold a package for me?", "荷物を預かってもらえますか？"],["p3508", "I'll be away until Sunday.", "日曜まで留守にします。"],["p3509", "It's pretty heavy, so be careful.", "けっこう重いので気をつけて。"],["p3510", "No problem, anytime.", "大丈夫ですよ、いつでもどうぞ。"],["p3511", "I owe you one.", "借りができましたね。"],["p3512", "Drop by whenever you're home.", "帰ったらいつでも寄ってください。"]],
  r:[["Thanks so much for taking my package.", 5],["When should I come pick it up?", 7],["Did the delivery person need a signature?", 1]],
  c:{sit:"隣人と預かった荷物について話す",t:[["Thanks so much for taking my package.", 5],["When should I come pick it up?", 7],["Did the delivery person need a signature?", 1]]}},
 {t:"第四百四十歩 虫が出た",d:"部屋に虫が出る",p:[
  ["p3513", "There's a huge bug in the kitchen!", "台所に大きな虫がいる！"],["p3514", "Can you get rid of it?", "退治してくれる？"],["p3515", "Don't kill it, just let it out.", "殺さないで、外に逃がして。"],["p3516", "Where did it go?", "どこに行った？"],["p3517", "Grab a cup and some paper.", "コップと紙を持ってきて。"],["p3518", "I can't stand bugs.", "虫は本当に苦手なんです。"],["p3519", "It must have come in through the window.", "窓から入ってきたに違いない。"],["p3520", "Let's put up a screen.", "網戸を付けよう。"]],
  r:[["Why are you screaming?", 0],["How do you think it got inside?", 6],["Want me to just squash it?", 2]],
  c:{sit:"ルームメイトと部屋に出た虫について話す",t:[["Why are you screaming?", 0],["How do you think it got inside?", 6],["Want me to just squash it?", 2]]}},
 {t:"第四百四十一歩 水漏れ",d:"管理会社に水漏れを連絡する",p:[
  ["p3521", "There's water leaking under the sink.", "シンクの下から水が漏れています。"],["p3522", "It started this morning.", "今朝から始まりました。"],["p3523", "I've turned off the water for now.", "とりあえず水を止めました。"],["p3524", "The floor is soaking wet.", "床がびしょびしょです。"],["p3525", "Can someone come today?", "今日来てもらえますか？"],["p3526", "It's getting worse by the hour.", "刻一刻とひどくなっています。"],["p3527", "I'm worried about the apartment below.", "下の部屋が心配です。"],["p3528", "I'll be home all afternoon.", "午後はずっと家にいます。"]],
  r:[["Thanks for calling. What's the problem?", 0],["Have you done anything about it yet?", 2],["When would be a good time for a plumber to visit?", 7]],
  c:{sit:"管理会社に電話で水漏れを伝える",t:[["Thanks for calling. What's the problem?", 0],["Have you done anything about it yet?", 2],["When would be a good time for a plumber to visit?", 7]]}},
 {t:"第四百四十二歩 返信が遅れて",d:"返信が遅れたことを友人に謝る",p:[
  ["p3529", "Sorry for the late reply.", "返信が遅くなってごめんなさい。"],["p3530", "Your message slipped my mind.", "メッセージのことをすっかり忘れていました。"],["p3531", "It's been a crazy week.", "怒涛の一週間だったんです。"],["p3532", "I read it and forgot to answer.", "読んだのに返事を忘れていました。"],["p3533", "Is the offer still open?", "あのお誘いはまだ有効ですか？"],["p3534", "Better late than never, right?", "遅れても返さないよりはいいよね？"],["p3535", "I'll reply faster next time.", "次はもっと早く返信します。"],["p3536", "Are we still on for Saturday?", "土曜日の予定はまだ大丈夫？"]],
  r:[["Finally! I thought you were ignoring me.", 0],["Busy with work again?", 2],["It took you three days to answer, huh?", 5]],
  c:{sit:"返信が遅れたことを友人に謝る",t:[["Finally! I thought you were ignoring me.", 0],["Busy with work again?", 2],["Took you three days to answer, huh?", 5]]}},
 {t:"第四百四十三歩 名前が出てこない",d:"知人の名前を思い出せない",p:[
  ["p3537", "Your name is on the tip of my tongue.", "お名前がのどまで出かかっています。"],["p3538", "Sorry, remind me of your name?", "すみません、お名前をもう一度伺えますか？"],["p3539", "I'm terrible with names.", "人の名前を覚えるのが本当に苦手で。"],["p3540", "We met at the conference, right?", "会議でお会いしましたよね？"],["p3541", "Your face is so familiar.", "お顔はすごく見覚えがあります。"],["p3542", "Of course, now I remember!", "そうだ、思い出しました！"],["p3543", "Please forgive me for forgetting.", "忘れてしまってすみません。"],["p3544", "Remind me where we met?", "どこでお会いしたんでしたっけ？"]],
  r:[["You don't remember me, do you?", 4],["It's Yuki. Yuki Tanaka from the marketing team.", 5],["Do you forget names often?", 2]],
  c:{sit:"久しぶりに会った知人の名前を思い出せない",t:[["You don't remember me, do you?", 4],["It's Yuki. Yuki Tanaka from the marketing team.", 5],["Do you forget names often?", 2]]}},
 {t:"第四百四十四歩 後輩への助言",d:"後輩に仕事のフィードバックをする",p:[
  ["p3545", "Do you have a minute to talk?", "少し話せる？"],["p3546", "Overall, you did a great job.", "全体的にとてもよくできていたよ。"],["p3547", "There's one thing to work on.", "一つ改善できる点があるんだ。"],["p3548", "Try to double-check the figures.", "数字はダブルチェックするようにしよう。"],["p3549", "Don't be too hard on yourself.", "自分を責めすぎないで。"],["p3550", "Feel free to ask me anything.", "何でも気軽に聞いてね。"],["p3551", "Everyone makes mistakes at first.", "最初はみんなミスするものだよ。"],["p3552", "Keep up the good work.", "その調子でがんばって。"]],
  r:[["I can't believe I made such a silly mistake.", 4],["I'm afraid to bother you with questions.", 5],["Thanks for the advice. I'll do my best.", 7]],
  c:{sit:"ミスをした後輩に声をかける",t:[["I can't believe I made such a silly mistake.", 4],["I'm afraid to bother you with questions.", 5],["Thanks for the advice. I'll do my best.", 7]]}},
 {t:"第四百四十五歩 テニスのダブルス",d:"テニスのダブルスでペアと話す",p:[
  ["p3553", "Nice shot!", "ナイスショット！"],["p3554", "I'll take the ones down the middle.", "真ん中の球は私が取ります。"],["p3555", "Sorry, that was my ball.", "ごめん、今のは私のボールでした。"],["p3556", "Let's switch sides.", "左右を入れ替えよう。"],["p3557", "Keep your eye on the ball.", "ボールから目を離さないで。"],["p3558", "Their serve is really strong.", "相手のサーブ、すごく強いね。"],["p3559", "Let's take it one point at a time.", "一点ずつ取っていこう。"],["p3560", "Good game, everyone.", "みんな、いい試合でした。"]],
  r:[["Who should take the balls in the middle?", 1],["Oops, we both went for that one.", 2],["We're down by a lot. What do we do?", 6]],
  c:{sit:"テニスのダブルスでペアと話す",t:[["Who should take the balls in the middle?", 1],["Oops, we both went for that one.", 2],["We're down by a lot. What do we do?", 6]]}},
 {t:"第四百四十六歩 一部だけ賛成",d:"企画案に部分的に賛成する",p:[
  ["p3561", "I agree with you up to a point.", "ある程度まではあなたに賛成です。"],["p3562", "That part makes perfect sense to me.", "その部分はとても納得できます。"],["p3563", "I'm not so sure about the budget, though.", "ただ、予算については少し疑問です。"],["p3564", "You have a point about the timing.", "時期についてはおっしゃる通りです。"],["p3565", "I see it a little differently.", "私は少し違う見方をしています。"],["p3566", "Can we keep the venue but change the date?", "会場はそのままで、日程だけ変えられますか？"],["p3567", "Let's meet each other halfway.", "お互いに歩み寄りましょう。"],["p3568", "I'm with you on most of it.", "ほとんどの点では同じ考えです。"]],
  r:[["Is there any part you're worried about?", 2],["We can't agree on everything. What now?", 6],["Which part should we keep, and which should we change?", 5]],
  c:{sit:"同僚とイベントの企画案について話し合う",t:[["Is there any part you're worried about?", 2],["We can't agree on everything. What now?", 6],["Which part should we keep, and which should we change?", 5]]}},
 {t:"第四百四十七歩 旅先を考え直す",d:"旅行先を考え直したいと伝える",p:[
  ["p3569", "I've been having second thoughts about Hawaii.", "ハワイのこと、考え直しているんです。"],["p3570", "On second thought, let's go somewhere quieter.", "やっぱり、もっと静かな所に行こうよ。"],["p3571", "I know I suggested it first.", "最初に言い出したのは私だけど。"],["p3572", "Something about it doesn't feel right anymore.", "なんだかもうしっくりこなくて。"],["p3573", "Would you mind if we reconsidered?", "考え直してもいいかな？"],["p3574", "The flights have gotten so expensive.", "航空券がすごく高くなっちゃって。"],["p3575", "I'm sorry for going back and forth.", "二転三転してごめんね。"],["p3576", "Let's sleep on it before booking.", "予約する前に一晩考えよう。"]],
  r:[["Is it the cost that's bothering you?", 5],["You keep changing your mind!", 6],["Should I book the tickets tonight?", 7]],
  c:{sit:"パートナーと旅行先について話し直す",t:[["Is it the cost that's bothering you?", 5],["You keep changing your mind!", 6],["Should I book the tickets tonight?", 7]]}},
 {t:"第四百四十八歩 上司にそっと提案",d:"上司に控えめに業務改善を提案する",p:[
  ["p3577", "May I make a small suggestion?", "ちょっと提案してもいいですか？"],["p3578", "Would it be worth trying a new approach?", "新しいやり方を試してみる価値はありますか？"],["p3579", "Just a thought, but what about weekly check-ins?", "思いつきですが、週一回の進捗確認はどうでしょう？"],["p3580", "It might save us some time.", "時間の節約になるかもしれません。"],["p3581", "I could draft a proposal, if you like.", "よろしければ企画書を書きますよ。"],["p3582", "Feel free to say no, of course.", "もちろん、遠慮なく却下してください。"],["p3583", "I've noticed the meetings run long.", "会議が長引きがちだと気づいたんです。"],["p3584", "We could try it for a month.", "一か月だけ試してみるのはどうでしょう。"]],
  r:[["What gave you this idea?", 6],["I'm not sure the whole team will want this.", 7],["How should we take this forward?", 4]],
  c:{sit:"上司に会議の進め方の改善を控えめに提案する",t:[["What gave you this idea?", 6],["I'm not sure the whole team will want this.", 7],["How should we take this forward?", 4]]}},
 {t:"第四百四十九歩 言いすぎた夜",d:"前の晩に言いすぎた友人に謝る",p:[
  ["p3585", "I owe you an apology for last night.", "昨夜のこと、謝らないといけないね。"],["p3586", "I shouldn't have said that.", "あんなこと言うべきじゃなかった。"],["p3587", "I was out of line.", "私が言いすぎたよ。"],["p3588", "I've regretted it ever since.", "あれからずっと後悔してる。"],["p3589", "That's not how I really feel.", "本心じゃないんだ。"],["p3590", "I was stressed, but that's no excuse.", "ストレスがたまってたけど、言い訳にはならないね。"],["p3591", "I hope we can put this behind us.", "このことは水に流せたらうれしい。"],["p3592", "Can I make it up to you?", "埋め合わせさせてくれる？"]],
  r:[["Did you really mean what you said?", 4],["Why were you so harsh yesterday?", 5],["Do you think we can move past this?", 6]],
  c:{sit:"前の晩に口論した友人に謝る",t:[["Did you really mean what you said?", 4],["Why were you so harsh yesterday?", 5],["Do you think we can move past this?", 6]]}},
 {t:"第四百五十歩 恩人への感謝",d:"恩師の送別会で深く感謝を伝える",p:[
  ["p3593", "I can't thank you enough.", "感謝してもしきれません。"],["p3594", "You believed in me when nobody else did.", "誰も信じてくれないとき、あなただけが信じてくれました。"],["p3595", "I wouldn't be here without you.", "あなたがいなければ今の私はありません。"],["p3596", "Your advice changed my whole career.", "あなたの助言で私のキャリアは一変しました。"],["p3597", "I'll never forget your kindness.", "ご親切は決して忘れません。"],["p3598", "I hope I can pay it forward.", "受けた恩を次の人に返していきたいです。"],["p3599", "You taught me to never give up.", "あきらめないことを教えてくれました。"],["p3600", "It means more than you know.", "あなたが思う以上に大きな意味があるんです。"]],
  r:[["I didn't do that much, really.", 2],["What's the most important thing I taught you?", 6],["How will you use what you've learned?", 5]],
  c:{sit:"恩師の送別会で感謝を伝える",t:[["I didn't do that much, really.", 2],["What's the most important thing I taught you?", 6],["How will you use what you've learned?", 5]]}},
 {t:"第四百五十一歩 休暇の申請",d:"上司に理由を添えて休暇を申請する",p:[
  ["p3601", "I'd like to request some time off.", "休暇をいただきたいのですが。"],["p3602", "My sister is getting married overseas.", "姉が海外で結婚式を挙げるんです。"],["p3603", "I'll finish the report before I leave.", "休む前に報告書は仕上げます。"],["p3604", "Mika has agreed to cover for me.", "ミカさんが代わりを引き受けてくれました。"],["p3605", "It would only be for one week.", "一週間だけの予定です。"],["p3606", "I'm giving you plenty of notice.", "早めにお伝えしておきます。"],["p3607", "I'll check my email once a day.", "メールは一日一回確認します。"],["p3608", "Is the end of May all right?", "五月末で大丈夫でしょうか？"]],
  r:[["What's the occasion?", 1],["Who will handle your clients while you're gone?", 3],["Will you be reachable if something urgent comes up?", 6]],
  c:{sit:"上司に休暇の理由と引き継ぎを伝える",t:[["What's the occasion?", 1],["So who will take care of your clients?", 3],["Will you be reachable if something urgent comes up?", 6]]}},
 {t:"第四百五十二歩 会議で聞き返す",d:"会議で発言の意味を確認する",p:[
  ["p3609", "Sorry, could you clarify that point?", "すみません、その点を明確にしていただけますか？"],["p3610", "What exactly do you mean by flexible?", "「柔軟に」とは具体的にどういう意味ですか？"],["p3611", "Could you give us an example?", "例を挙げていただけますか？"],["p3612", "Let me make sure I've got this right.", "正しく理解できているか確認させてください。"],["p3613", "Could you go over that again?", "もう一度説明していただけますか？"],["p3614", "Are you saying we should delay the launch?", "発売を延期すべきだということですか？"],["p3615", "Who will be responsible for that?", "それは誰の担当になりますか？"],["p3616", "When do you need this done by?", "いつまでに必要ですか？"]],
  r:[["We need a more flexible approach to scheduling.", 1],["I want everyone to send me their ideas soon.", 7],["The numbers say the timing is not ideal.", 5]],
  c:{sit:"会議で上司の発言の意味を確認する",t:[["We need a more flexible approach to scheduling.", 1],["I want everyone to send me their ideas soon.", 7],["Looking at the numbers, now is not a great time.", 5]]}},
 {t:"第四百五十三歩 決まったことの確認",d:"保護者の話し合いの最後に決定事項を確認する",p:[
  ["p3617", "So, to sum up today's discussion.", "では、今日の話し合いをまとめます。"],["p3618", "We've agreed on the date, right?", "日程は決まりましたよね？"],["p3619", "Let's go over the action items.", "やるべきことを確認しましょう。"],["p3620", "Who's taking care of the snacks?", "お菓子の担当は誰ですか？"],["p3621", "Sara will contact the school.", "学校への連絡はサラさんがします。"],["p3622", "We still need to decide the venue.", "会場はまだ決める必要があります。"],["p3623", "I'll send everyone a summary tonight.", "今夜みなさんにまとめを送ります。"],["p3624", "Did I miss anything?", "何か抜けていることはありますか？"]],
  r:[["Before we finish, is anything still undecided?", 5],["How will we remember all this?", 6],["Is someone going to call the principal?", 4]],
  c:{sit:"保護者の話し合いの最後に決定事項を確認する",t:[["Before we finish, is anything still undecided?", 5],["How will we remember all this?", 6],["Is someone going to call the principal?", 4]]}},
 {t:"第四百五十四歩 失敗の笑い話",d:"飲み会で自分の失敗談を面白く話す",p:[
  ["p3625", "You'll never guess what happened.", "何があったか、絶対当てられないよ。"],["p3626", "So there I was, totally lost.", "で、私は完全に迷子になってたわけ。"],["p3627", "I got on the wrong train entirely.", "まったく違う電車に乗っちゃったんだ。"],["p3628", "I ended up in a different city.", "気づいたら別の街にいたの。"],["p3629", "The funny part is, I didn't notice.", "笑えるのは、全然気づかなかったこと。"],["p3630", "Everyone in the car started laughing.", "車両のみんなが笑い出したんだ。"],["p3631", "I laugh about it now.", "今では笑い話だよ。"],["p3632", "Long story short, I missed the meeting.", "結局、会議に間に合わなかったってわけ。"]],
  r:[["Wait, how did you end up in another city?", 2],["So how did it all end?", 7],["Doesn't that story embarrass you?", 6]],
  c:{sit:"飲み会で電車を乗り間違えた失敗談を話す",t:[["Wait, how did you end up in another city?", 2],["So how did it all end?", 7],["Doesn't that story embarrass you?", 6]]}},
 {t:"第四百五十五歩 複合機の使い方",d:"新人に複合機の使い方を順に説明する",p:[
  ["p3633", "First, scan your ID card here.", "まず、ここで社員証をかざします。"],["p3634", "Then choose the copy option.", "次にコピーを選びます。"],["p3635", "Next, set the number of copies.", "それから部数を設定します。"],["p3636", "Make sure the paper size is right.", "用紙サイズが合っているか確認してね。"],["p3637", "After that, just press start.", "あとはスタートを押すだけです。"],["p3638", "If it jams, open this panel.", "紙が詰まったら、このパネルを開けてね。"],["p3639", "Don't forget to log out afterward.", "終わったらログアウトを忘れずに。"],["p3640", "That's all there is to it.", "それだけのことです。"]],
  r:[["What if the paper gets stuck?", 5],["Is there anything to do when I'm finished?", 6],["Wait, that's really it?", 7]],
  c:{sit:"職場の新人に複合機の使い方を説明する",t:[["What if the paper gets stuck?", 5],["Is there anything to do when I'm finished?", 6],["Wait, that's really it?", 7]]}},
 {t:"第四百五十六歩 人生の転機",d:"友人と人生の転機について語る",p:[
  ["p3641", "Everything changed when I turned thirty.", "三十歳になって、すべてが変わりました。"],["p3642", "Losing my job was a blessing in disguise.", "失業は、思わぬ幸運でした。"],["p3643", "That's when I started to paint.", "絵を描き始めたのはその頃です。"],["p3644", "Looking back, it was a turning point.", "振り返ると、あれが転機でした。"],["p3645", "I had to start over from scratch.", "ゼロからやり直さなければなりませんでした。"],["p3646", "It taught me what really matters.", "本当に大切なものを教えてくれました。"],["p3647", "I was terrified at the time.", "当時はすごく怖かったです。"],["p3648", "I would do it all again.", "もう一度でも同じ道を選びます。"]],
  r:[["How did you feel when you lost your job?", 6],["Any regrets about that time?", 7],["What did that experience teach you?", 5]],
  c:{sit:"友人と人生の転機について語り合う",t:[["How did you feel when you lost your job?", 6],["Any regrets about that time?", 7],["What did that experience teach you?", 5]]}},
 {t:"第四百五十七歩 親友の決断を後押し",d:"留学を迷う親友に助言する",p:[
  ["p3649", "If I were you, I'd go for it.", "私があなたなら、挑戦するよ。"],["p3650", "You'll regret it if you don't try.", "やらなかったら後悔するよ。"],["p3651", "What's the worst that could happen?", "最悪でもどうなるっていうの？"],["p3652", "You can always come back.", "いつでも戻ってこられるよ。"],["p3653", "Have you talked it over with your family?", "家族とはよく話し合った？"],["p3654", "I'd make a list of pros and cons.", "私なら良い点と悪い点を書き出すね。"],["p3655", "Trust your gut on this.", "この件は直感を信じて。"],["p3656", "Whatever you decide, I'm behind you.", "どう決めても、私は応援してるよ。"]],
  r:[["What would you do in my shoes?", 0],["But what if it doesn't work out abroad?", 3],["I can't think clearly. Is there a practical way to decide?", 5]],
  c:{sit:"留学を迷う親友に相談される",t:[["What would you do in my shoes?", 0],["But what if it doesn't work out abroad?", 3],["I can't think clearly. Is there a practical way to decide?", 5]]}},
 {t:"第四百五十八歩 老後の夢",d:"夫婦で退職後の夢を語り合う",p:[
  ["p3657", "I'd love to live by the sea.", "海のそばで暮らしたいな。"],["p3658", "I want to travel without rushing.", "急がずにゆっくり旅をしたい。"],["p3659", "Maybe we could open a little cafe.", "小さなカフェを開くのもいいかも。"],["p3660", "I'd finally have time to read.", "やっと読書の時間ができるね。"],["p3661", "We should start saving for it now.", "今から貯金を始めないとね。"],["p3662", "I want to stay active and healthy.", "元気に体を動かしていたい。"],["p3663", "Let's not wait too long, though.", "でも、先延ばしにしすぎないようにしよう。"],["p3664", "As long as we're together.", "一緒にいられればそれでいい。"]],
  r:[["Where would you like to live after retiring?", 0],["How do we make that dream realistic?", 4],["What if we can't do everything we dream of?", 7]],
  c:{sit:"夫婦で退職後の暮らしについて語り合う",t:[["Where would you like to live after retiring?", 0],["How do we make that dream realistic?", 4],["What if we can't do everything we dream of?", 7]]}},
 {t:"第四百五十九歩 しぶしぶ同意",d:"チームの決定にしぶしぶ従う",p:[
  ["p3665", "Fine, I'll go along with it.", "わかりました、それに従います。"],["p3666", "It's not my first choice.", "第一希望ではないですけど。"],["p3667", "I still have some doubts.", "まだ少し疑問はあります。"],["p3668", "But I'm not going to block it.", "でも、反対して邪魔するつもりはありません。"],["p3669", "Let's see how it goes.", "様子を見てみましょう。"],["p3670", "Can we review it next month?", "来月見直せますか？"],["p3671", "I'll give it my full effort.", "全力で取り組みます。"],["p3672", "As long as everyone's on board.", "みんなが賛成しているなら。"]],
  r:[["So, are you okay with the majority decision?", 0],["You don't sound very excited about it.", 1],["Will you still work hard on it?", 6]],
  c:{sit:"多数決で決まったチームの方針について話す",t:[["So, are you okay with the majority decision?", 0],["You don't sound very excited about it.", 1],["Will you still work hard on it?", 6]]}},
 {t:"第四百六十歩 謝罪を受け入れる",d:"約束をすっぽかした同僚の謝罪を受け入れる",p:[
  ["p3673", "Thanks for saying that.", "そう言ってくれてありがとう。"],["p3674", "Don't worry about it.", "気にしないで。"],["p3675", "I appreciate you being honest.", "正直に話してくれてうれしいよ。"],["p3676", "It happens to the best of us.", "誰にでもあることだよ。"],["p3677", "Let's just move on.", "もう前に進もう。"],["p3678", "I was a little hurt, honestly.", "正直、ちょっと傷ついたけどね。"],["p3679", "Just let me know next time.", "次からは連絡だけしてね。"],["p3680", "We're good, really.", "本当に、もう大丈夫だよ。"]],
  r:[["Are you still angry with me?", 7],["Were you upset when I didn't show up?", 5],["How can I avoid this in the future?", 6]],
  c:{sit:"約束をすっぽかした同僚から謝られる",t:[["Are you still angry with me?", 7],["Were you upset when I didn't show up?", 5],["How can I avoid this in the future?", 6]]}},
 {t:"第四百六十一歩 がっかりを伝える",d:"リフォームの仕上がりへの不満を丁寧に伝える",p:[
  ["p3681", "To be honest, I'm a bit disappointed.", "正直なところ、少しがっかりしています。"],["p3682", "It's not quite what we discussed.", "打ち合わせた内容とは少し違います。"],["p3683", "The color is much darker than expected.", "色が思っていたよりずっと暗いです。"],["p3684", "I don't mean to be difficult.", "困らせるつもりはないんですが。"],["p3685", "Could you take another look at it?", "もう一度見ていただけますか？"],["p3686", "I'd appreciate it if you fixed this.", "ここを直していただけるとありがたいです。"],["p3687", "The rest looks great, though.", "ほかの部分はとても素敵ですけどね。"],["p3688", "When could you come back?", "いつまた来ていただけますか？"]],
  r:[["So, how do you like the new kitchen?", 0],["What exactly isn't right?", 2],["I'm sorry. Is everything else okay?", 6]],
  c:{sit:"リフォーム業者に仕上がりの不満を丁寧に伝える",t:[["So, how do you like the new kitchen?", 0],["What exactly isn't right?", 2],["I'm sorry. Is everything else okay?", 6]]}},
 {t:"第四百六十二歩 揺れる気持ち",d:"海外転勤の打診に迷う気持ちを友人に話す",p:[
  ["p3689", "I'm torn about the transfer.", "転勤のことで迷っているんだ。"],["p3690", "Part of me wants to go.", "行きたい気持ちもあるんだけど。"],["p3691", "But I'd miss everyone here.", "でも、ここのみんなと離れるのは寂しい。"],["p3692", "I can't make up my mind.", "なかなか決められないんだ。"],["p3693", "It's a once-in-a-lifetime chance.", "一生に一度のチャンスだからね。"],["p3694", "I have mixed feelings about it.", "複雑な気持ちなんだ。"],["p3695", "I need a little more time.", "もう少し時間が必要なんだ。"],["p3696", "My heart says yes, my head says no.", "心は行けと言うけど、頭はやめろと言うんだ。"]],
  r:[["What's holding you back?", 2],["Why would you even consider it?", 4],["Can you give your boss an answer by tomorrow?", 6]],
  c:{sit:"海外転勤の打診について友人に打ち明ける",t:[["What's holding you back?", 2],["Why would you even consider it?", 4],["Can you give your boss an answer by tomorrow?", 6]]}},
 {t:"第四百六十三歩 自分の非を認める",d:"議論のあと自分の間違いを認める",p:[
  ["p3697", "You were right, and I was wrong.", "あなたが正しくて、私が間違っていました。"],["p3698", "I stand corrected.", "訂正を受け入れます。"],["p3699", "I should have checked the numbers.", "数字を確認しておくべきでした。"],["p3700", "I jumped to conclusions.", "早とちりしてしまいました。"],["p3701", "Thanks for pointing that out.", "指摘してくれてありがとう。"],["p3702", "I'll be more careful next time.", "次はもっと気をつけます。"],["p3703", "Let me correct the slides.", "スライドを修正させてください。"],["p3704", "That's a lesson learned.", "いい教訓になりました。"]],
  r:[["So, who was right in the end?", 0],["Sorry to point out your error in front of everyone.", 4],["The client sees these slides tomorrow.", 6]],
  c:{sit:"データを確認し、同僚の指摘が正しかったと認める",t:[["So, who was right in the end?", 0],["Sorry to point out your error in front of everyone.", 4],["The client sees these slides tomorrow.", 6]]}},
 {t:"第四百六十四歩 優先順位をつける",d:"家族で今年の出費の優先順位を話し合う",p:[
  ["p3705", "Let's figure out what matters most.", "何がいちばん大事か考えよう。"],["p3706", "The car repair has to come first.", "車の修理が最優先だね。"],["p3707", "The new sofa can wait.", "新しいソファは後回しでいいよ。"],["p3708", "We can't afford everything this year.", "今年は全部は買えないよ。"],["p3709", "What's at the top of your list?", "あなたのいちばんの優先は何？"],["p3710", "Let's put the trip on hold.", "旅行はいったん保留にしよう。"],["p3711", "Safety should be our priority.", "安全を優先すべきだよ。"],["p3712", "Let's revisit this in the fall.", "秋にまた話し合おう。"]],
  r:[["Can't we just buy everything we need?", 3],["What about the vacation we planned?", 5],["And the furniture? The old sofa is so worn out.", 2]],
  c:{sit:"家族で今年の出費の優先順位を話し合う",t:[["Can't we just buy everything we need?", 3],["What about the vacation we planned?", 5],["And the furniture? The old sofa is so worn out.", 2]]}},
 {t:"第四百六十五歩 相手の立場で考える",d:"取引先に腹を立てる同僚をなだめる",p:[
  ["p3713", "Try to see it from their side.", "相手の立場から見てみて。"],["p3714", "They're probably under pressure too.", "向こうもきっとプレッシャーを抱えているよ。"],["p3715", "I'd feel the same way in your place.", "私があなたでも同じ気持ちになると思う。"],["p3716", "Maybe they just didn't understand.", "単に理解していなかったのかも。"],["p3717", "I get why you're upset.", "怒る気持ちはわかるよ。"],["p3718", "It's not personal, I think.", "個人的な攻撃ではないと思うよ。"],["p3719", "Why not ask them directly?", "直接聞いてみたら？"],["p3720", "Let's give them the benefit of the doubt.", "ここは善意に解釈してあげよう。"]],
  r:[["Why are they always so rude to me?", 5],["Should I just wait and complain to my boss?", 6],["Maybe they did it on purpose to annoy us.", 7]],
  c:{sit:"取引先に腹を立てる同僚をなだめる",t:[["Why are they always so rude to me?", 5],["Should I just wait and complain to my boss?", 6],["Maybe they did it on purpose to annoy us.", 7]]}},
 {t:"第四百六十六歩 海外で口座開設",d:"現地の銀行で口座を開く",p:[
  ["p3721", "I'd like to open a checking account.", "普段使いの口座を開きたいのですが。"],["p3722", "I just moved here for work.", "仕事でこちらに引っ越してきたばかりです。"],["p3723", "Here's my passport and work permit.", "パスポートと就労許可証です。"],["p3724", "Is there a minimum balance requirement?", "最低残高の条件はありますか？"],["p3725", "Are there any monthly fees?", "月々の手数料はかかりますか？"],["p3726", "How long until my debit card arrives?", "デビットカードはいつ頃届きますか？"],["p3727", "Can I set up online banking today?", "今日ネットバンキングの設定もできますか？"],["p3728", "I'll need to transfer money from Japan.", "日本から送金する必要があるんです。"]],
  r:[["How can I help you today?", 0],["Your new card will come by mail.", 5],["Would you like access to our mobile app?", 6]],
  c:{sit:"現地の銀行の窓口で口座開設の手続きをする",t:[["Are you new to the area?", 1],["We'll need to see some identification.", 2],["Will you be receiving funds from abroad?", 7]]}},
 {t:"第四百六十七歩 賃貸契約の署名",d:"部屋の賃貸契約を結ぶ",p:[
  ["p3729", "Could you walk me through the lease?", "賃貸契約の内容を説明していただけますか？"],["p3730", "How much is the security deposit?", "敷金はいくらですか？"],["p3731", "Does the rent include utilities?", "光熱費は家賃に含まれていますか？"],["p3732", "Does this lease allow subletting?", "この契約で又貸しは認められていますか？"],["p3733", "What happens if I break the lease early?", "途中解約するとどうなりますか？"],["p3734", "When is rent due each month?", "家賃は毎月いつまでに払えばいいですか？"],["p3735", "I'd like a copy for my records.", "控えを一部いただきたいです。"],["p3736", "Where exactly do I sign?", "どこに署名すればいいですか？"]],
  r:[["Are you ready to put your name on it?", 7],["You might get transferred back to Japan, right?", 4],["We keep the original here at the office.", 6]],
  c:{sit:"不動産会社で賃貸契約書の内容を確認して署名する",t:[["You'll also need to pay a deposit.", 1],["The rent here is very reasonable.", 2],["Paying late will cost you a fee.", 5]]}},
 {t:"第四百六十八歩 電気とネットの開通",d:"新居の電気とネットを申し込む",p:[
  ["p3737", "I'd like to set up electricity service.", "電気の利用を申し込みたいのですが。"],["p3738", "I'm moving in on the first.", "一日に入居します。"],["p3739", "What plans do you offer for internet?", "ネットにはどんなプランがありますか？"],["p3740", "Is there an installation fee?", "工事費はかかりますか？"],["p3741", "Can a technician come this week?", "今週中に作業員の方に来てもらえますか？"],["p3742", "Is a contract required for that plan?", "そのプランは契約期間の縛りがありますか？"],["p3743", "I'll be home all afternoon.", "午後はずっと家にいます。"],["p3744", "Could you put it in my name?", "名義は私にしてもらえますか？"]],
  r:[["When would you like service to begin?", 1],["Our technician can come Thursday. What time suits you?", 6],["The fastest plan is also the cheapest monthly.", 5]],
  c:{sit:"新居の電気とインターネットを電話で申し込む",t:[["Thanks for calling the power company.", 0],["Our installers are booked up lately.", 4],["Setup takes about two hours on site.", 3]]}},
 {t:"第四百六十九歩 海外オフィス初出社",d:"海外支社に初めて出社する",p:[
  ["p3745", "Hi, I'm Yuki. I just started today.", "こんにちは、ユキです。今日から働き始めました。"],["p3746", "I transferred from the Tokyo office.", "東京オフィスから異動してきました。"],["p3747", "Where should I put my things?", "荷物はどこに置けばいいですか？"],["p3748", "Who should I ask about my login?", "ログイン情報は誰に聞けばいいですか？"],["p3749", "Is there a dress code here?", "ここに服装の決まりはありますか？"],["p3750", "Everyone seems really friendly.", "皆さんとても親切そうですね。"],["p3751", "I'm still finding my way around.", "まだ社内の勝手がわかっていないんです。"],["p3752", "Thanks for showing me around.", "案内してくれてありがとう。"]],
  r:[["I don't think we've met before.", 0],["Where were you working before this?", 1],["Did you find the meeting room okay?", 6]],
  c:{sit:"海外支社への初出社の日に同僚とあいさつを交わす",t:[["So what do you think of the team so far?", 5],["This is your desk, by the way.", 2],["Well, that's the whole floor.", 7]]}},
 {t:"第四百七十歩 多国籍な同僚とランチ",d:"様々な国出身の同僚と昼食で雑談する",p:[
  ["p3753", "Where are you originally from?", "もともとはどちらのご出身ですか？"],["p3754", "How long have you lived here?", "ここに住んでどれくらいですか？"],["p3755", "What do you miss most about home?", "故郷で一番恋しいものは何ですか？"],["p3756", "I'd love to visit someday.", "いつか行ってみたいです。"],["p3757", "Is this a typical lunch back home?", "これは地元ではよくあるお昼ご飯ですか？"],["p3758", "We have something similar in Japan.", "日本にも似たようなものがあります。"],["p3759", "How did you end up here?", "どういう経緯でここに来たんですか？"],["p3760", "That sounds like quite an adventure.", "なかなかの冒険ですね。"]],
  r:[["You should come to Lisbon sometime.", 3],["It's a kind of dumpling with meat inside.", 5],["I came here on a sailboat, believe it or not.", 7]],
  c:{sit:"いろいろな国から来た同僚とランチをしながら雑談する",t:[["I'm not from here, actually.", 0],["I've been away from Brazil a long time.", 2],["It's a long story, really.", 6]]}},
 {t:"第四百七十一歩 お辞儀を説明する",d:"同僚に日本のお辞儀の習慣を説明する",p:[
  ["p3761", "It's a way of showing respect.", "敬意を示す方法なんです。"],["p3762", "The deeper the bow, the more formal.", "深くお辞儀するほど丁寧になります。"],["p3763", "We usually bow instead of shaking hands.", "握手の代わりにお辞儀するのが普通です。"],["p3764", "It's become almost automatic for me.", "私にはほとんど無意識の動作です。"],["p3765", "Foreigners aren't expected to do it perfectly.", "外国の方は完璧にする必要はありません。"],["p3766", "A slight nod is fine among friends.", "友人同士なら軽く会釈で十分です。"],["p3767", "I even bow on the phone sometimes.", "電話中にお辞儀することもあるくらいです。"],["p3768", "It's similar to a firm handshake here.", "こちらのしっかりした握手に似ています。"]],
  r:[["Why do Japanese people bow their heads so often?", 0],["Do you bow to your friends too?", 5],["I'm worried I'll get it wrong in Tokyo.", 4]],
  c:{sit:"日本のお辞儀に興味を持った同僚に習慣を説明する",t:[["Does everyone bow the same way?", 1],["You bowed to me without thinking!", 3],["So do you shake hands in Japan?", 2]]}},
 {t:"第四百七十二歩 ホームシックの夜",d:"友人にホームシックの気持ちを打ち明ける",p:[
  ["p3769", "I've been feeling a bit homesick.", "最近ちょっとホームシックなんだ。"],["p3770", "I miss my mom's cooking.", "母の手料理が恋しい。"],["p3771", "Everything here still feels unfamiliar.", "ここではまだ何もかもなじめなくて。"],["p3772", "It hits me most at night.", "夜になると特にこたえるんだ。"],["p3773", "Talking about it helps, actually.", "話すと実は楽になるよ。"],["p3774", "I know it'll pass eventually.", "いつかは過ぎるってわかってる。"],["p3775", "Maybe I just need some routine.", "生活のリズムが必要なのかも。"],["p3776", "Thanks for checking in on me.", "気にかけてくれてありがとう。"]],
  r:[["You've been quiet lately. Everything okay?", 0],["Is it worse at any particular time?", 3],["What do you miss the most?", 1]],
  c:{sit:"夜遅く、心配して訪ねてきた友人にホームシックを打ち明ける",t:[["I noticed you seemed down, so I came by.", 7],["Do you want to talk, or would you rather not?", 4],["Do you think you'll feel this way forever?", 5]]}},
 {t:"第四百七十三歩 手巻き寿司パーティー",d:"友人に手巻き寿司を振る舞う",p:[
  ["p3777", "Help yourselves to whatever you like.", "好きなものを自由に取ってね。"],["p3778", "Put a little rice on the seaweed.", "海苔にご飯を少しのせてね。"],["p3779", "Then add your fillings and roll.", "それから具をのせて巻くんだよ。"],["p3780", "Don't overfill it, or it'll fall apart.", "具を入れすぎると崩れちゃうよ。"],["p3781", "A little soy sauce goes a long way.", "醤油はちょっとで十分だよ。"],["p3782", "This one's cucumber, for the vegetarians.", "これはベジタリアン向けのきゅうりだよ。"],["p3783", "It's a typical home party dish.", "家でのパーティーの定番料理なんだ。"],["p3784", "There's plenty more, so dig in.", "まだたくさんあるから、どんどん食べて。"]],
  r:[["How do I start? I've never done this.", 1],["Is there anything without fish?", 5],["My roll keeps falling apart!", 3]],
  c:{sit:"現地の友人を自宅に招いて手巻き寿司を振る舞う",t:[["Do people eat this at restaurants in Japan?", 6],["Can I take the salmon and the egg?", 0],["I've put the rice down. What next?", 2]]}},
 {t:"第四百七十四歩 ビザ窓口の順番待ち",d:"移民局の窓口で書類を提出する",p:[
  ["p3785", "I have an appointment at ten thirty.", "十時半に予約しています。"],["p3786", "Here's my completed application form.", "記入済みの申請書です。"],["p3787", "I brought copies of everything.", "すべてコピーを持ってきました。"],["p3788", "Which window should I go to?", "どの窓口に行けばいいですか？"],["p3789", "Do I need to take a number?", "番号札を取る必要がありますか？"],["p3790", "Is this photo the right size?", "この写真はサイズ合っていますか？"],["p3791", "Roughly how long is the wait?", "待ち時間はだいたいどれくらいですか？"],["p3792", "When can I expect a decision?", "結果はいつ頃わかりますか？"]],
  r:[["Do you have an appointment?", 0],["We'll also need copies of your documents.", 2],["Please have a seat until we call you.", 6]],
  c:{sit:"移民局の窓口で予約した手続きのために書類を提出する",t:[["Decisions are made by our review team.", 7],["Photos must meet strict requirements.", 5],["I'll also need the application form itself.", 1]]}},
 {t:"第四百七十五歩 地元のサッカークラブ",d:"社会人サッカークラブに参加を申し込む",p:[
  ["p3793", "Are you taking new members?", "新しいメンバーを募集していますか？"],["p3794", "I played a bit in college.", "大学で少しやっていました。"],["p3795", "Any position is fine with me.", "どのポジションでも構いません。"],["p3796", "When and where do you practice?", "練習はいつどこでやっていますか？"],["p3797", "Is there a membership fee?", "会費はありますか？"],["p3798", "Do I need my own cleats?", "スパイクは自分で用意しますか？"],["p3799", "I'd love to try a session first.", "まずは一回参加してみたいです。"],["p3800", "It's a great way to meet people.", "人と知り合うのにうってつけですね。"]],
  r:[["Have you played before?", 1],["What position do you usually play?", 2],["Would you like to sign up today?", 6]],
  c:{sit:"地元の社会人サッカークラブの練習場で参加を申し込む",t:[["Hi there! Interested in joining?", 0],["We play on grass, by the way.", 5],["Most of us joined to make friends.", 7]]}},
 {t:"第四百七十六歩 かかりつけ医の予約",d:"電話で診療所の予約を取る",p:[
  ["p3801", "I'd like to book an appointment.", "予約を取りたいのですが。"],["p3802", "I'm a new patient here.", "こちらは初診です。"],["p3803", "Do you accept my insurance?", "私の保険は使えますか？"],["p3804", "Is anything available this week?", "今週空いている枠はありますか？"],["p3805", "Mornings work best for me.", "午前中が一番都合がいいです。"],["p3806", "Should I bring anything with me?", "何か持っていくものはありますか？"],["p3807", "Could I see a female doctor?", "女性の医師に診てもらえますか？"],["p3808", "I'll arrive early to fill out forms.", "早めに行って書類を記入します。"]],
  r:[["Have you visited us before?", 1],["What time of day suits you?", 4],["You'll have some paperwork the first time.", 7]],
  c:{sit:"近所の診療所に電話して初めての予約を取る",t:[["Good morning, Riverside Clinic.", 0],["The schedule is pretty full right now.", 3],["Do you have a preference for the doctor?", 6]]}},
 {t:"第四百七十七歩 チップの相場",d:"現地の同僚にチップの習慣を聞く",p:[
  ["p3809", "How much do people usually tip?", "みんな普通どれくらいチップを払うの？"],["p3810", "We don't really tip in Japan.", "日本ではあまりチップを払わないんだ。"],["p3811", "Do I tip for takeout too?", "テイクアウトでもチップは払うの？"],["p3812", "Is the tip already included here?", "ここはチップがもう含まれてる？"],["p3813", "I never know what's expected.", "何が期待されているのか全然わからなくて。"],["p3814", "What about taxis and hairdressers?", "タクシーや美容院はどうなの？"],["p3815", "I'd hate to seem rude.", "失礼だと思われたくないんだ。"],["p3816", "So I just add the tip on the card?", "じゃあチップはカードで上乗せすればいいの？"]],
  r:[["You look confused by the bill.", 4],["Don't they tip in your country?", 1],["Restaurants are fifteen to twenty percent.", 5]],
  c:{sit:"レストランで現地の同僚にチップの習慣をたずねる",t:[["Just write the tip amount on the slip.", 7],["Why are you so worried about tipping?", 6],["Large groups often get a service charge.", 3]]}},
 {t:"第四百七十八歩 定期券を作る",d:"駅で交通機関の定期券を作る",p:[
  ["p3817", "I'd like a monthly pass, please.", "一か月定期をお願いします。"],["p3818", "Does it cover buses too?", "バスにも使えますか？"],["p3819", "Can I load it onto my phone?", "スマホに入れられますか？"],["p3820", "Is there a discount for commuters?", "通勤者向けの割引はありますか？"],["p3821", "How do I top it up?", "チャージはどうやってするんですか？"],["p3822", "What if I lose the card?", "カードをなくしたらどうなりますか？"],["p3823", "Does it renew automatically?", "自動で更新されますか？"],["p3824", "I commute downtown every weekday.", "平日は毎日都心に通っています。"]],
  r:[["What kind of ticket do you need?", 0],["How often do you travel?", 7],["The pass expires at the end of the month.", 6]],
  c:{sit:"駅の窓口で通勤用の定期券を作る",t:[["This card is valid on trains across the city.", 1],["Keep it safe. It's not registered.", 5],["You'll need to add money for extra trips.", 4]]}},
 {t:"第四百七十九歩 感謝祭の食卓",d:"同僚の家の感謝祭の夕食に招かれる",p:[
  ["p3825", "Thank you so much for having me.", "お招きいただきありがとうございます。"],["p3826", "This is my first Thanksgiving.", "感謝祭は初めてなんです。"],["p3827", "I brought some Japanese sweets.", "日本のお菓子を持ってきました。"],["p3828", "Is there a tradition I should know?", "知っておくべき習わしはありますか？"],["p3829", "Everything looks absolutely delicious.", "どれも本当においしそうですね。"],["p3830", "I'm thankful for such kind colleagues.", "こんなに優しい同僚に恵まれて感謝しています。"],["p3831", "Could you pass the cranberry sauce?", "クランベリーソースを取ってもらえますか？"],["p3832", "I couldn't eat another bite.", "もう一口も食べられません。"]],
  r:[["Is this your first time celebrating with us?", 1],["We go around and share what we're grateful for.", 5],["Would you like some more pie?", 7]],
  c:{sit:"同僚の家で開かれる感謝祭の夕食会に招かれる",t:[["Come in! We're so glad you made it.", 0],["What's in that box you're holding?", 2],["Dinner's ready! Grab a plate.", 4]]}},
 {t:"第四百八十歩 実家への船便",d:"郵便局で日本の実家に荷物を送る",p:[
  ["p3833", "I'm sending this to Japan.", "これを日本に送りたいです。"],["p3834", "What's the cheapest shipping option?", "一番安い発送方法は何ですか？"],["p3835", "How long will it take by sea?", "船便だとどれくらいかかりますか？"],["p3836", "It's just clothes and some books.", "中身は服と本だけです。"],["p3837", "Do I fill out a customs form?", "税関申告書は記入が必要ですか？"],["p3838", "Can I get a tracking number?", "追跡番号はもらえますか？"],["p3839", "It's not urgent at all.", "まったく急ぎではありません。"],["p3840", "Could I buy a box here?", "ここで箱を買えますか？"]],
  r:[["Where is this package going?", 0],["What's inside the box?", 3],["Do you need it there quickly?", 6]],
  c:{sit:"郵便局の窓口で日本の実家に荷物を送る",t:[["Air mail is fast but expensive.", 1],["Sea mail is much slower, of course.", 2],["You'll be able to follow it online.", 5]]}},
 {t:"第四百八十一歩 実家とビデオ通話",d:"日本の家族とビデオ通話する",p:[
  ["p3841", "Can you hear me okay?", "ちゃんと聞こえる？"],["p3842", "Your screen just froze.", "画面が固まっちゃった。"],["p3843", "It's early morning here.", "こっちは早朝だよ。"],["p3844", "Work is keeping me busy.", "仕事で忙しくしてるよ。"],["p3845", "I'm eating well, don't worry.", "ちゃんと食べてるから心配しないで。"],["p3846", "Say hi to Grandma for me.", "おばあちゃんによろしく伝えて。"],["p3847", "I'll try to visit this winter.", "この冬は帰れるようにするね。"],["p3848", "Let's talk again next weekend.", "また来週末に話そう。"]],
  r:[["Are you taking care of yourself?", 4],["When are you coming home?", 6],["Isn't it the middle of the night there?", 2]],
  c:{sit:"時差のある日本の家族とビデオ通話で近況を話す",t:[["You look tired. How's the new job?", 3],["Grandma's asleep, but she misses you.", 5],["Should we hang up for today?", 7]]}},
 {t:"第四百八十二歩 免許の切り替え",d:"日本の免許を現地の免許に切り替える",p:[
  ["p3849", "I'd like to exchange my Japanese license.", "日本の免許を切り替えたいのですが。"],["p3850", "Do I need to take a road test?", "実技試験を受ける必要がありますか？"],["p3851", "Here's the official translation.", "こちらが公式の翻訳文です。"],["p3852", "Is an eye test required?", "視力検査は必要ですか？"],["p3853", "How long is the new license valid?", "新しい免許の有効期間はどれくらいですか？"],["p3854", "Can I keep driving in the meantime?", "それまでの間も運転していいですか？"],["p3855", "I've been driving for over ten years.", "十年以上運転しています。"],["p3856", "Do you need proof of address?", "住所の証明は必要ですか？"]],
  r:[["What can I do for you today?", 0],["Your license is in Japanese. We can't read it.", 2],["Processing takes about three weeks.", 5]],
  c:{sit:"運転免許センターで日本の免許の切り替えを申請する",t:[["How much experience do you have behind the wheel?", 6],["Some applicants must pass a practical exam.", 1],["Your new license will arrive by mail.", 4]]}},
 {t:"第四百八十三歩 定時で帰る文化",d:"定時退社が当たり前の職場に戸惑う",p:[
  ["p3857", "Everyone leaves right at five here.", "ここではみんな五時ぴったりに帰るね。"],["p3858", "In Japan, overtime is pretty common.", "日本では残業がかなり一般的なんだ。"],["p3859", "I feel guilty leaving before my boss.", "上司より先に帰るのは気が引けて。"],["p3860", "Is it okay to stay a little late?", "少し残っても大丈夫かな？"],["p3861", "It's a nice change, honestly.", "正直、いい変化だよ。"],["p3862", "I actually have time for hobbies now.", "今は趣味の時間もあるんだ。"],["p3863", "Work-life balance really matters here.", "ここでは仕事と生活のバランスが本当に大事なんだね。"],["p3864", "I'm still getting used to it.", "まだ慣れている途中なんだ。"]],
  r:[["Why are you still at your desk?", 2],["Do people work late in Japan?", 1],["So what do you do with your evenings now?", 5]],
  c:{sit:"定時退社が当たり前の職場について現地の同僚と話す",t:[["Have you adjusted to our hours yet?", 7],["So, do you like finishing on time?", 4],["What surprised you most about our office?", 0]]}},
 {t:"第四百八十四歩 語学学校の初日",d:"現地の語学学校で自己紹介する",p:[
  ["p3865", "I'm here for the evening class.", "夜間クラスに来ました。"],["p3866", "I can read better than I speak.", "話すより読む方が得意です。"],["p3867", "I want to talk with my neighbors.", "近所の人と話せるようになりたいです。"],["p3868", "Please correct me when I'm wrong.", "間違えたら直してください。"],["p3869", "Could you speak a bit slower?", "もう少しゆっくり話していただけますか？"],["p3870", "I moved here for my husband's job.", "夫の仕事でこちらに移りました。"],["p3871", "What does that word mean?", "その単語はどういう意味ですか？"],["p3872", "I'm nervous, but excited too.", "緊張していますが、楽しみでもあります。"]],
  r:[["Why did you decide to move here?", 5],["How are you feeling on your first day?", 7],["What's your goal for this course?", 2]],
  c:{sit:"現地の言葉を学ぶ語学学校の初日に先生と話す",t:[["Which class are you looking for?", 0],["How would you rate your skills so far?", 1],["I'll try not to correct you too often.", 3]]}},
 {t:"第四百八十五歩 海外生活一年目",d:"一年の海外生活を友人とふり返る",p:[
  ["p3873", "I can't believe it's been a year.", "もう一年経ったなんて信じられない。"],["p3874", "The first month was really tough.", "最初の一か月は本当に大変だった。"],["p3875", "I've grown a lot, I think.", "すごく成長したと思う。"],["p3876", "This place feels like home now.", "ここが今では家のように感じる。"],["p3877", "I couldn't have done it without you.", "あなたがいなかったら無理だった。"],["p3878", "My English has come a long way.", "英語はずいぶん上達したよ。"],["p3879", "I'm thinking of staying another year.", "もう一年いようかと思ってる。"],["p3880", "Let's celebrate this weekend.", "今週末にお祝いしよう。"]],
  r:[["Happy anniversary of your arrival!", 0],["Do you still miss Japan?", 3],["What's next for you?", 6]],
  c:{sit:"海外生活一年の節目に、支えてくれた友人とふり返る",t:[["Remember how lost you were at first?", 1],["You barely needed my help this year.", 4],["We should mark the occasion somehow.", 7]]}},
 {t:"第四百八十六歩 五分で提案する",d:"役員の前で短く提案を伝える",p:[
  ["p3881", "I'll keep this brief.", "手短にお話しします。"],["p3882", "Let me start with the problem.", "まず課題からお話しします。"],["p3883", "Our customers keep asking for this.", "お客様からこの要望が繰り返し届いています。"],["p3884", "Here's what we're proposing.", "私たちの提案はこちらです。"],["p3885", "This slide sums it up.", "このスライドが要点です。"],["p3886", "The upside is significant.", "見込める効果は大きいです。"],["p3887", "We'd need two more engineers.", "エンジニアがあと二人必要です。"],["p3888", "I'm happy to take questions.", "ご質問をお受けします。"]],
  r:[["You have five minutes, so go ahead.", 0],["What exactly are you asking for?", 6],["Thanks, that was very clear.", 7]],
  c:{sit:"役員会議で新サービスの提案を五分で説明する",t:[["Why should we care about this?", 2],["So what is your actual plan?", 3],["Is that the key slide?", 4]]}},
 {t:"第四百八十七歩 即答できない質問",d:"質疑応答で答えにくい質問に対応する",p:[
  ["p3889", "That's a great question.", "いい質問ですね。"],["p3890", "Let me make sure I understand.", "理解が正しいか確認させてください。"],["p3891", "Are you asking about cost or timing?", "費用のことですか、時期のことですか？"],["p3892", "I don't have that figure on hand.", "その数字は今手元にありません。"],["p3893", "I'll follow up by email today.", "今日中にメールでお答えします。"],["p3894", "That's outside the scope of this project.", "それはこのプロジェクトの範囲外です。"],["p3895", "Can we take that offline?", "その件は後ほど個別にお話しできますか？"],["p3896", "Does that answer your question?", "これでお答えになっていますか？"]],
  r:[["What was our churn rate last quarter?", 3],["Could we discuss the whole budget now?", 6],["Will this also fix the billing system?", 5]],
  c:{sit:"発表後の質疑で、すぐに答えられない質問に落ち着いて対応する",t:[["Do you know the exact revenue impact?", 3],["When can you send me the details?", 4],["Sorry, my question was a bit confusing.", 1]]}},
 {t:"第四百八十八歩 会議を本題に戻す",d:"脱線した会議を進行役として立て直す",p:[
  ["p3897", "Let's get back on track.", "本題に戻りましょう。"],["p3898", "We're running short on time.", "時間が押しています。"],["p3899", "Let's park that for now.", "その件はいったん保留にしましょう。"],["p3900", "I'd like to hear from everyone.", "皆さんの意見を聞きたいです。"],["p3901", "Maria, what's your take?", "マリアさん、あなたの意見は？"],["p3902", "Can we agree on next steps?", "次のステップで合意できますか？"],["p3903", "Who's going to own this?", "これは誰が担当しますか？"],["p3904", "Let's wrap up here.", "ここで締めましょう。"]],
  r:[["And another thing about the office party...", 0],["We still have three items left.", 1],["That's everything on the agenda.", 7]],
  c:{sit:"議題から話がそれてきた定例会議を進行役として立て直す",t:[["Sorry, I got off topic again.", 0],["That idea really needs a separate meeting.", 2],["Maria hasn't said anything yet.", 4]]}},
 {t:"第四百八十九歩 仕事を任せる",d:"チームメンバーに仕事を割り振る",p:[
  ["p3905", "I'd like you to take this on.", "この仕事をお願いしたいです。"],["p3906", "You're the right person for this.", "あなたが適任です。"],["p3907", "Here's what success looks like.", "目指すゴールはこういうことです。"],["p3908", "You have full authority on this.", "この件はあなたに一任します。"],["p3909", "Check in with me on Friday.", "金曜日に一度報告してください。"],["p3910", "Let me know if you get stuck.", "行き詰まったら言ってください。"],["p3911", "Does the deadline work for you?", "この締め切りで大丈夫ですか？"],["p3912", "What do you need from me?", "私から何か必要なものはありますか？"]],
