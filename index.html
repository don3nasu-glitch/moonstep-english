<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Moonstep English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a phone app; a vertical path of waxing moons is the lesson map. Single dark world by choice. */
:root{
  color-scheme:dark;
  --night:#0b1026; --deep:#141b3d; --panel:#1c2550; --line:#34407a;
  --ink:#e9ecff; --dim:#9aa3d4;
  --flame:#4fb4ff; --flame-ink:#06203a; --moon:#f3e3a6;
  --ok:#6fe0a8; --ng:#ff8a8a;
  --display:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,var(--deep),var(--night) 70%) fixed var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
#app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
.sub{color:var(--dim);font-size:.85rem;margin:0}
.stats{display:flex;gap:10px}
.stat{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{font-size:.75rem;color:var(--dim);font-weight:400}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--moon)}
.stat span{font-size:.75rem;color:var(--dim);letter-spacing:.08em}
.bar{height:8px;background:var(--panel);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--flame);transition:width .3s}
.bar.timer i{background:var(--moon);width:100%;animation:drain 6s linear forwards}
@keyframes drain{to{width:0}}
.path{display:flex;flex-direction:column;gap:14px}
.node{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:inherit;font:inherit;cursor:pointer}
.unit{display:flex;flex-direction:column;gap:8px}
.unit:nth-child(even) .node{flex-direction:row-reverse;text-align:right}
.unit:nth-child(even) .say{align-self:flex-end}
.node[disabled]{opacity:.4;cursor:default}
.node div{min-width:0;flex:1}
.moon{flex:none;width:64px;height:64px;border-radius:50%;background:var(--moon);box-shadow:0 0 24px -4px var(--moon)}
.m0{box-shadow:inset 44px 0 0 0 var(--deep),0 0 18px -6px var(--moon)}
.m1{box-shadow:inset 26px 0 0 0 var(--deep),0 0 22px -5px var(--moon)}
button{font:inherit}
.btn{background:var(--flame);color:var(--flame-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4}
button:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}
.top .bar{flex:1}
.x{background:none;border:0;color:var(--dim);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.kind{color:var(--flame);font-size:.8rem;letter-spacing:.1em;font-weight:700}
.prompt{font-size:1.35rem;font-weight:700;margin:0;overflow-wrap:anywhere}
.line{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;margin:0;font-size:1.1rem}
.say{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;width:auto;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;text-align:left;cursor:pointer}
.opt.sel{border-color:var(--flame);background:var(--deep)}
.slot{min-height:60px;border-bottom:2px solid var(--line);padding:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid}
.fb.ok{border-color:var(--ok);color:var(--ok)} .fb.ng{border-color:var(--ng);color:var(--ng)}
.fb p{margin:0;color:var(--ink)}
.heard{color:var(--dim);font-size:.9rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.row .btn{padding-inline:10px;font-size:.95rem}
.big{font-family:var(--display);font-size:3rem;color:var(--moon);margin:0;font-variant-numeric:tabular-nums}
#app{min-height:100%}
.dock{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;margin-top:auto;padding-block:16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--night) 28%)}
.left{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile{min-height:44px;font-size:1.05rem;transition:transform .08s}
.slot{align-items:center}
.slot .tile{border-color:var(--flame)}
.slot:empty::before{content:"下の単語をタップして並べます";color:var(--dim);font-size:.85rem;align-self:center}
.tile:active,.opt:active,.btn:active,.say:active,.cta:active,.node:active{transform:scale(.97)}
.btn,.opt,.say,.cta{transition:transform .08s}
.fb{animation:rise .22s ease-out}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{min-width:44px;min-height:44px}
.say{min-height:44px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--flame);color:var(--flame-ink);border-color:var(--flame);font-weight:700}
.set{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
textarea{box-sizing:border-box;resize:none;width:100%;min-height:84px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.8rem;overflow-wrap:anywhere}
textarea:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding-block:24px}
.dots{display:flex;gap:8px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--moon)}
.cta{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:linear-gradient(135deg,var(--panel),var(--deep));border:1px solid var(--flame);border-radius:16px;padding:18px;color:var(--ink);cursor:pointer;box-shadow:0 0 28px -12px var(--flame)}
.cta b{font-family:var(--display);font-size:1.45rem;line-height:1.3}
.cta .go{align-self:flex-end;color:var(--flame);font-weight:700;margin-top:4px}
.tag{font-family:var(--body);font-size:.68rem;font-weight:700;color:var(--flame-ink);background:var(--flame);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.lock{flex-direction:row;align-items:center;gap:12px;opacity:.45;padding:4px 0}
.lock h2{font-size:1rem}
.moon.sm{width:26px;height:26px;box-shadow:inset 18px 0 0 0 var(--deep)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.ng{border-color:var(--ng);color:var(--ng)}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .5s ease-out}
.moon.big{width:112px;height:112px;margin-block:8px}
.moon.big.m1{box-shadow:inset 44px 0 0 0 var(--deep),0 0 30px -6px var(--moon)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gd{display:flex;gap:12px;align-items:center}.gd img{width:60px;height:60px;border-radius:50%;flex:none;border:2px solid #f3e3a6;box-shadow:0 0 18px rgba(190,160,255,.55)}
.gd div{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:4px 16px 16px 16px;padding:10px 14px;line-height:1.6}.gd small{display:block;color:#f3e3a6;font-size:.75rem;letter-spacing:.08em}
.pic{width:168px;height:168px;border-radius:50%;border:2px solid #f3e3a6;box-shadow:0 0 36px rgba(190,160,255,.6)}.pic.s{width:112px;height:112px}
/* v21: 押せる立体ボタン・曲がる道・下から出る判定シート・実績 */
.btn{box-shadow:0 4px 0 #2b7fc0;margin-bottom:4px}.btn:active{transform:translateY(4px)!important;box-shadow:0 0 0 #2b7fc0}
.btn.ghost{box-shadow:0 4px 0 var(--line)}.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.opt,.tile{box-shadow:0 3px 0 var(--line)}.opt:active,.tile:active{transform:translateY(3px)!important;box-shadow:0 0 0 var(--line)}
.opt.sel{box-shadow:0 3px 0 var(--flame)}
.top .bar{height:14px;border-radius:14px}.top .bar i{border-radius:14px;background:linear-gradient(180deg,#8fd0ff,var(--flame));transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.combo{color:#ffb35c;font-weight:700;font-size:.9rem;white-space:nowrap;animation:pop .3s}
@keyframes pop{from{transform:scale(.4)}60%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.dock.sheet{margin-inline:-16px;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;animation:up .25s ease-out;gap:12px}
.dock.sheet.ok{background:#123a2e;border-top:2px solid var(--ok)}.dock.sheet.ng{background:#3f1b25;border-top:2px solid var(--ng);animation:up .25s ease-out,shake .35s .2s}
@keyframes up{from{transform:translateY(100%)}}
.sheet .shh{display:flex;gap:12px;align-items:center}.sheet .shh img{width:52px;height:52px;border-radius:50%;border:2px solid currentColor;flex:none}
.sheet.ok .shh{color:var(--ok)}.sheet.ng .shh{color:var(--ng)}
.sheet .shh b{display:block;font-size:1.25rem}.sheet .xp{font-size:.85rem;font-weight:700}
.sheet p{margin:0;color:var(--ink)}
.sheet.ok .btn{background:var(--ok);color:#06281b;box-shadow:0 4px 0 #3c9a70}.sheet.ng .btn{background:var(--ng);color:#3a0a12;box-shadow:0 4px 0 #b65561}
.hud{display:flex;align-items:center;gap:8px}.hud .chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .sp{flex:1}.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--flame) calc(var(--p)*1%),var(--line) 0);display:inline-grid;place-items:center}.ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.03em;margin:0;font-size:1rem;white-space:nowrap}.pn:has(.popb){margin-top:54px}.hud .chip{padding:6px 9px;font-size:.9rem}.hud{gap:6px}.hud .say{padding:8px 12px}.brand{font-size:.92rem}
.path{align-items:center;gap:0;padding-bottom:12px}
.stage{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;background:linear-gradient(135deg,#2a2f6e,#1c2550);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:22px}
.stage b{font-family:var(--display);font-size:1.1rem}.stage span{color:var(--dim);font-size:.8rem}
.pn{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x));margin-top:26px;position:relative}
.orb{width:78px;height:72px;border-radius:50%;border:0;cursor:pointer;font-size:1.05rem;font-weight:700;letter-spacing:.05em;color:#6b5510;background:radial-gradient(circle at 35% 30%,#fff6cf,var(--moon) 60%);box-shadow:0 7px 0 #b39a4b,0 0 28px -4px var(--moon);transition:transform .08s}
.orb:active{transform:translateY(6px);box-shadow:0 1px 0 #b39a4b}
.orb.new{color:#06203a;font-size:1.5rem;background:radial-gradient(circle at 35% 30%,#c5e6ff,var(--flame) 65%);box-shadow:0 7px 0 #2b7fc0,0 0 0 8px rgba(79,180,255,.18),0 0 34px -2px var(--flame);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 7px 0 #2b7fc0,0 0 0 14px rgba(79,180,255,.08),0 0 40px 0 var(--flame)}}
.orb.lock{background:#273061;box-shadow:0 7px 0 #1a2148;color:#5d679c;cursor:default;font-size:1.2rem}
.pn .nm{font-size:.82rem;font-weight:700;text-align:center;max-width:170px;line-height:1.35}.pn.off .nm{color:#5d679c}
.pn .popb{position:absolute;top:-34px;background:var(--ink);color:var(--night);font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:10px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap;z-index:1}
.pn .popb::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.say.mini{min-height:34px;padding:4px 12px;font-size:.78rem;align-self:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:rgba(11,16,38,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{display:flex;width:100%;max-width:480px}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:8px 2px 10px;font-size:.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button i{font-style:normal;font-size:1.35rem;line-height:1.2}.tabs button.on{color:var(--flame);font-weight:700}
.tabs em{position:absolute;top:4px;left:54%;background:var(--ng);color:#3a0a12;font-style:normal;font-weight:700;font-size:.65rem;border-radius:999px;padding:0 6px}
.tabpad{height:64px;flex:none}
.week{display:flex;justify-content:space-between;gap:6px}.week div{flex:1;text-align:center;font-size:.72rem;color:var(--dim)}
.week i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);margin-bottom:4px;font-style:normal;font-size:1rem}
.week .on i{background:var(--moon);border-color:var(--moon);color:#6b5510;box-shadow:0 0 14px -2px var(--moon)}.week .td{color:var(--ink);font-weight:700}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:.72rem;color:var(--dim);line-height:1.4}
.bdg i{display:block;font-style:normal;font-size:1.9rem;filter:grayscale(1) opacity(.3)}.bdg b{display:block;color:var(--ink);font-size:.8rem}
.bdg .got{border-color:var(--moon);box-shadow:0 0 18px -8px var(--moon)}.bdg .got i{filter:none}
.lv{display:flex;align-items:center;gap:14px}.lv .n{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem;color:#6b5510;background:radial-gradient(circle at 35% 30%,#fff6cf,var(--moon) 60%);box-shadow:0 0 26px -4px var(--moon)}
.lv div{flex:1}
.stats.g4{flex-wrap:wrap}.stats.g4 .stat{flex:1 1 40%}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.cf i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.newb{background:linear-gradient(135deg,#3a3270,#1c2550);border:1px solid var(--moon);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;animation:pop .45s}.newb i{font-style:normal;font-size:2rem}.newb span{display:block;color:var(--moon);font-size:.75rem;font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{min-height:62px;background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:.92rem;line-height:1.35;transition:transform .08s}
.mc.sel{border-color:var(--flame);box-shadow:0 3px 0 var(--flame);background:var(--deep)}.mc.fin{border-color:var(--ok);color:var(--ok);box-shadow:none;opacity:.55;animation:pop .3s}.mc.bad{border-color:var(--ng);color:var(--ng);animation:shake .35s}
</style>
</head>
<body>
<div id="app"></div>
<script>
// c: 話題がつながる3往復の台本 {sit:状況, t:[[相手のセリフ, 返事にするフレーズの番号]×3]}。無いユニットは r から3つ選ぶ
// p: [phrase_id（変更しない）, 英語, 日本語, 場面]  r: [相手のセリフ, 返事にするフレーズの番号, 状況]  v: [phrase_id, 元フレーズの番号, 英語, 日本語]
const UNITS=[
 {t:"第一歩 出会い",d:"名乗る・あいさつする",p:[
  ["p001","Nice to meet you.","はじめまして。"],["p002","What's your name?","お名前は何ですか？"],["p003","My name is Rei.","私の名前はレイです。"],["p004","Where are you from?","どこの出身ですか？"],
  ["p005","I'm from Japan.","日本出身です。"],["p006","How are you today?","今日の調子はどうですか？"],["p007","I'm good, thank you.","元気です、ありがとう。"],["p008","Please say that again.","もう一度言ってください。"]],
  r:[["What's your name?",2],["Where are you from?",4],["How are you today?",6],["I'm Tom. I'm from Leeds.",7,"聞き取れなかったので、もう一度お願いする"]],
  c:{sit:"旅先で、となりの席の人に話しかけられる",t:[["Hi! I'm Tom. What's your name?",2],["Nice to meet you, Rei. Where are you from?",4],["Oh, Japan! I'd love to visit someday. Anyway, nice to meet you.",0]]},
  v:[["v001",4,"I'm from Canada.","カナダ出身です。"],["v002",4,"I'm from Australia.","オーストラリア出身です。"]]},
 {t:"第二歩 旅立ち",d:"道をたずねる・助けを求める",p:[
  ["p009","Where is the station?","駅はどこですか？"],["p010","How much is this?","これはいくらですか？"],["p011","Can you help me?","助けてもらえますか？"],["p012","I'm looking for a map.","地図を探しています。"],
  ["p013","See you tomorrow.","また明日。"],["p014","I don't understand.","わかりません。"],["p015","Turn left at the corner.","角を左に曲がってください。"],["p016","How long does it take?","時間はどのくらいかかりますか？","駅まで歩く時間をたずねる"]],
  r:[["Do you need directions?",0,"駅を探している"],["You look lost. What do you need?",3],["I have to go now. See you tomorrow!",4]],
  c:{sit:"知らない町で道に迷い、通りがかりの人に声をかけられる",t:[["Hello. Are you all right?",2],["Of course. What do you need?",0],["Go straight and turn left at the bank.",7]]},
  v:[["v003",3,"I'm looking for a taxi.","タクシーを探しています。"],["v004",3,"I'm looking for my phone.","携帯電話を探しています。"]]},
 {t:"第三歩 仲間",d:"好みを話す・意見を言う",p:[
  ["p017","What do you like to do?","何をするのが好きですか？"],["p018","I like listening to music.","音楽を聴くのが好きです。"],["p019","Let's go together.","一緒に行きましょう。"],["p020","What do you think?","どう思いますか？"],
  ["p021","That sounds great.","それはいいですね。","誘いや提案を聞いて"],["p022","I agree with you.","あなたに賛成です。"],["p023","Can I ask you a question?","質問してもいいですか？"],["p024","I'll do my best.","精いっぱい頑張ります。"]],
  r:[["What do you like to do?",1],["Let's try the new cafe.",4],["I think we should leave early.",5]],
  c:{sit:"新しくできた友人と、週末の話をする",t:[["What do you like to do on weekends?",1],["Me too! There is a free concert in the park on Saturday.",4],["I have two tickets. Do you want to come?",2]]},
  v:[["v005",1,"I like cooking.","料理が好きです。"],["v006",1,"I like reading.","読書が好きです。"]]},
 {t:"第四歩 食事",d:"注文する・感想を言う",p:[

const slug=en=>en.toLowerCase().replace(/[^a-z ]/g,"").trim();
const ALL=UNITS.flatMap((u,i)=>u.p.map((p,j)=>({id:p[0],u:i,j,en:p[1],ja:p[2],note:p[3]})));
const VARS=UNITS.flatMap((u,i)=>(u.v||[]).map(v=>({id:v[0],u:i,en:v[2],ja:v[3],base:u.p[v[1]][1]})));
const KIND={match:"ペアを見つける",meaning:"意味を選ぶ",build:"英語に組み立てる",listen:"聞き取る",speak:"声に出す",reply:"会話で返事をする",flash:"英語で口に出す"};
const GOAL=50, KEY="moonstep-english-v1", GAP=[1,3,7,14,30];

try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}

{ // 旧版の記録：英文キーは同じフレーズのIDへ移し、位置キーは別フレーズに引き継がせず破棄して知らせる
  const M={},IDS=new Set();ALL.concat(VARS).forEach(a=>{M[slug(a.en)]=a.id;IDS.add(a.id)});
  Object.keys(S.rev).forEach(k=>{if(IDS.has(k))return;if(M[k]&&!S.rev[M[k]])S.rev[M[k]]=S.rev[k];else if(!M[k])S.notice=1;delete S.rev[k]});
}

const roll=()=>{if(S.day!==day(0)){S.day=day(0);S.dayXp=0}};roll();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const AUD={},AUDL={};
ALL.concat(VARS).forEach(a=>AUD[a.en]=a.id);
UNITS.forEach((u,i)=>{u.r.forEach((r,k)=>AUDL[r[0]]=`r${i}_${k}`);if(u.c)u.c.t.forEach((t,k)=>AUDL[t[0]]=`c${i}_${k}`)});
let audOk=false,audFail=0,noAudio=false,enVoice=null;
function pickVoice(){ // 端末の読み上げを使う場合は、英語の声を明示的に選ぶ（日本語の声で英語を読ませない）
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const score=v=>(/^en[-_]US/i.test(v.lang)?4:0)+(/Samantha|Ava|Allison|Google US English|Aria|Jenny|Natural|Enhanced|Premium/i.test(v.name)?3:0)-(/compact|espeak/i.test(v.name)?3:0);
    enVoice=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){enVoice=null}
}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
function tts(t){try{if(!enVoice)pickVoice();const u=new SpeechSynthesisUtterance(t);if(enVoice)u.voice=enVoice;u.lang=enVoice?enVoice.lang:"en-US";u.rate=S.rate==="slow"?.7:.9;speechSynthesis.speak(u)}catch(e){}}
function speak(t,line){
  if(recState==="rec"||recState==="pending")return;
  try{player.pause();if(voice)voice.pause();speechSynthesis.cancel()}catch(e){}
  const key=line?AUDL[t]||AUD[t]:AUD[t]||AUDL[t];
  if(!key||!voice||noAudio)return tts(t);
  try{
    voice.src="audio/"+key+".mp3?v=3";voice.playbackRate=S.rate==="slow"?.8:1;
    const pr=voice.play();
    if(pr&&pr.then)pr.then(()=>{audOk=true},e=>{if(e&&e.name==="AbortError")return;if(e&&e.name==="NotAllowedError")return; // 途中で次の音声に切り替えた／自動再生が止められた
      audFail++;if(!audOk&&audFail>=2)noAudio=true;tts(t)}); // ファイルが無い環境では端末の読み上げに切り替える
  }catch(e){tts(t)}

const gd=t=>`<div class="gd"><img src="${IMG_F}" alt="すずね"><div><small>すずね</small>${t}</div></div>`;
function hello(nDue,next){ // 案内役のひとこと（学習の状況に合わせる）
  if(!Object.keys(S.rev).length)return "はじめまして。案内役のすずねです。最初の一歩を、いっしょに踏み出しましょう。";
  if(nDue)return `おかえりなさい。今日は${nDue}件、前に言えた文を確かめましょう。忘れかけた頃がいちばん身につきます。`;
  if(S.dayXp>=goal())return "今日の目標は達成です。よくがんばりましたね。続きは明日でも大丈夫ですよ。";
  if(next<0)return "すべての歩みを歩ききりましたね。6秒チャレンジで、口の速さを磨きましょう。";
  if(S.streak>=3)return `${S.streak}日連続ですね。その積み重ねが、いちばんの力になります。`;
  return "今日も3分だけ、声に出してみましょう。小さな一歩で十分です。";
}
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
function badges(){ // 実績。いまの学習記録から毎回計算する
  const u=Object.keys(S.done).length,r=Object.keys(S.rev).length,st=Math.max(S.streak,S.maxStreak||0);
  return [["first","🌒","最初の一歩","歩みを1つクリア",u>=1],["u5","🌓","五つの歩み","歩みを5つクリア",u>=5],["u10","🌔","十の歩み","歩みを10クリア",u>=10],["u20","🌕","満月","全20の歩みをクリア",u>=20],
    ["s3","🔥","三日つづけた","3日連続で学習",st>=3],["s7","🔥","一週間","7日連続で学習",st>=7],["s30","🔥","ひと月","30日連続で学習",st>=30],
    ["p50","📖","50の言葉","50文を学習",r>=50],["p100","📚","100の言葉","100文を学習",r>=100],["p160","🏛","すべての言葉","160文を学習",r>=160],
    ["pf1","✨","満ちた一歩","ミスなしでクリア",(S.perfect||0)>=1],["pf10","💎","磨かれた歩み","ミスなしで10回クリア",(S.perfect||0)>=10],
    ["c10","⚡","10連続正解","1回の学習で10連続正解",(S.bestCombo||0)>=10],["t5","💬","会話の達人","3往復の会話を5回",sum(S.talk)>=5],["x1000","⭐","1000 XP","合計1000XPを獲得",S.xp>=1000]];
}
const tabs=on=>{const n=due().length;return `<div class="tabpad"></div><nav class="tabs"><div>${[["home","🌙","ホーム"],[n?"review":"flash","⚡",n?"復習":"特訓"],["book","📖","フレーズ帳"],["stats","🏅","記録"]].map(([k,ic,t],x)=>`<button data-${k} class="${on===x?"on":""}"><i>${ic}</i>${t}${x===1&&n?`<em>${n}</em>`:""}</button>`).join("")}</div></nav>`};
function home(){
  clearTimeout(timer);recClear();L=null;roll();
  const pct=Math.min(100,S.dayXp/goal()*100),nDue=due().length;
  const notice=S.notice?`<p class="fb ng">教材更新に伴い学習記録をリセットしました。XP・連続日数は保持しています。</p>`:"";if(S.notice){delete S.notice;save()}
  const next=UNITS.findIndex((u,i)=>!S.done[i]); // 次に進むユニット（順番に解放）
  const cont=next>=0?`<button class="${nDue?"btn ghost":"cta"}" data-unit="${next}">${nDue?`${next?"つづきから":"はじめる"}：${UNITS[next].t}`:`<span class="sub">${next?"つづきから":"はじめる"}</span><b>${UNITS[next].t}</b><span class="sub">${UNITS[next].d}。約3分</span><span class="go">はじめる →</span>`}</button>`:"";
  const cta=nDue?`<button class="cta" data-review><span class="sub">まずはここから</span><b>今日の復習 ${nDue}件</b><span class="sub">別の日でも口で言えるかを確かめます</span><span class="go">復習する →</span></button>${cont}`
    :cont||`<button class="cta" data-flash><span class="sub">すべての歩みをクリア</span><b>6秒チャレンジ</b><span class="sub">学んだフレーズを10本、すばやく口に出す</span><span class="go">挑戦する →</span></button>`;
  const X=[0,46,72,46,0,-46,-72,-46];
  app.innerHTML=`${notice}<header class="hud"><p class="brand">Moonstep English</p><span class="sp"></span><span class="chip" aria-label="連続日数">🔥 ${S.streak}</span><span class="chip" aria-label="今日のXP"><span class="ring" style="--p:${pct}"></span>${Math.min(S.dayXp,goal())}/${goal()}</span><button class="say" data-settings aria-label="設定">⚙</button></header>
  ${gd(hello(nDue,next))}
  ${cta}
  <div class="path">${UNITS.map((u,i)=>{const n=S.done[i]||0,open=i===0||S.done[i-1],cur=i===next;
    const st=i%5?"":`<div class="stage"><b>ステージ ${i/5+1}</b><span>第${i+1}〜${i+5}歩</span></div>`;
    return st+`<div class="pn ${open?"":"off"}" style="--x:${X[i%8]}px">${cur?`<span class="popb">${i?"つづきから":"はじめる"}</span>`:""}<button class="orb ${cur?"new":open?"":"lock"}" ${open?`data-unit="${i}"`:"disabled"} aria-label="${u.t}${open?"":"（まだ開いていません）"}">${cur?"▶":open?"★".repeat(Math.min(n,3)):"🔒"}</button><span class="nm">${u.t}</span>${n?`<button class="say mini" data-talk="${i}">💬 会話に挑戦${S.talk[i]?` ${S.talk[i]}回`:""}</button>`:""}</div>`}).join("")}</div>${tabs(0)}`;
}
function stats(){
  clearTimeout(timer);recClear();L=null;roll();
  const lv=Math.floor(S.xp/200)+1,into=S.xp%200,bs=badges(),wd="日月火水木金土";
  const week=[-6,-5,-4,-3,-2,-1,0].map(n=>{const d=day(n),on=S.days[d]>0;return `<div class="${on?"on":""} ${n?"":"td"}"><i>${on?"✓":""}</i>${n?wd[new Date(d+"T12:00:00").getDay()]:"今日"}</div>`}).join("");
  app.innerHTML=`<header class="hud"><p class="brand">記録</p><span class="sp"></span><button class="say" data-settings aria-label="設定">⚙</button></header>

function setup(q){

function pickM(side,n){ // ペア合わせ：英語と日本語を1枚ずつ選ぶ

  const o=q.cards[q.msel[0]][q.msel[1]];

let ac=null;
function sfx(ok,cb){const up=1+Math.min(cb||0,8)*.06; // 正誤の短い効果音。タップ操作のあとだけ鳴る。S.sfx===false で消音

    (ok==="win"?[[523,0],[659,.12],[784,.24],[1047,.38]]:ok?[[660*up,0],[880*up,.09]]:[[220,0]]).forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+t;

  app.innerHTML=`${cf}<header class="done"><img class="pic s" src="${IMG_B}" alt="すずね"><h1>${L.mode==="talk"?"会話が、つながった。":miss.length?"一歩、進んだ。":"満ちた一歩。"}</h1><p class="sub">${first-miss.length} / ${first} 問を一度で通過</p></header>
  ${gd(L.mode==="talk"?"最後まで会話を続けられましたね。本番でも、きっと同じように話せます。":miss.length?"迷った文は、明日もう一度いっしょに確かめましょう。つまずいた所ほど、よく残ります。":"ぜんぶ一度で言えましたね。とてもきれいな一歩でした。")}
  <div class="stats g4"><div class="stat"><b>⭐ +<i id="cu" style="font-style:normal">${xp}</i></b><span>獲得XP</span></div><div class="stat"><b>${acc}%</b><span>一度で通過</span></div><div class="stat"><b>⚡ ${L.best||0}</b><span>最大の連続正解</span></div><div class="stat"><b>🔥 ${S.streak}</b><span>連続日数</span></div></div>
  ${fresh.map(b=>`<div class="newb"><i>${b[1]}</i><div><span>新しい実績</span><b>${b[2]}</b><p class="sub">${b[3]}</p></div></div>`).join("")}
  ${miss.length?`<h2>明日もう一度確認する文</h2><div class="opts">${miss.map(a=>`<button class="opt" data-hear="${a.id}">${a.en}<br><span class="sub">${a.ja}</span></button>`).join("")}</div>`:""}
  <div class="dock">${nx>=0?`<button class="btn" data-unit="${nx}">次の歩みへ：${UNITS[nx].t}</button><button class="btn ghost" data-home>道にもどる</button>`:`<button class="btn" data-home>道にもどる</button>`}</div>`;
  if(typeof requestAnimationFrame!=="undefined"&&document.getElementById("cu")){let v=0;const t=setInterval(()=>{v=Math.min(xp,v+Math.max(1,xp/20|0));const e=document.getElementById("cu");if(!e||v>=xp)clearInterval(t);if(e)e.textContent=v},35)}
}
const canRec=typeof navigator!=="undefined"&&navigator.mediaDevices&&typeof MediaRecorder!=="undefined";
const player=typeof Audio!=="undefined"?new Audio():{pause(){},play(){}};
const voice=typeof Audio!=="undefined"?new Audio():null; // 模範音声の再生用
// recState: idle | pending（許可待ち） | rec | done | blocked。recSeq は録音要求の番号で、画面移動・採点・非表示・エラーのたびに進めて古い要求を無効にする
let rec=null,recUrl="",recState="idle",recSeq=0,recNote="";
const redraw=()=>{if(L&&L.q[L.i])draw()};
const tracksOff=st=>{try{st&&st.getTracks().forEach(t=>t.stop())}catch(e){}};
async function recStart(){
  if(recState==="pending"||recState==="rec")return; // 連打で要求を重ねない
  recClear();speechSynthesis.cancel();if(voice)voice.pause();
  const my=++recSeq,live=()=>my===recSeq;
  let st=null;
  recState="pending";redraw();
  try{
    st=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!live()||document.hidden){tracksOff(st);if(live()){recState="idle";redraw()}return} // 待機中に移動・非表示になった要求は開始しない
    const chunks=[],r=new MediaRecorder(st);r.st=st;
    r.onerror=()=>{tracksOff(st);if(!live())return;recSeq++;rec=null;recState="blocked";redraw()}; // 要求を無効化するので、後から届く停止イベントは再生用データを作らない
    r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=()=>{tracksOff(st);if(!live())return;rec=null;if(r.keep){recUrl=URL.createObjectURL(new Blob(chunks,{type:r.mimeType}));recState="done"}else recState="idle";redraw()};
    rec=r;r.start();recState="rec";
  }catch(e){tracksOff(st);if(!live())return;rec=null;recState="blocked"} // 拒否、または許可後の開始失敗。どちらもマイクを離す
  redraw();
}
function recStop(keep){if(rec&&rec.state!=="inactive"){rec.keep=keep;try{rec.stop()}catch(e){tracksOff(rec.st);recSeq++;rec=null;recState="blocked";redraw()}}} // 保存して停止
function recCancelPending(){if(recState==="pending"){recSeq++;recState="idle"}} // 許可待ちだけを取り消す
function recClear(){ // 破棄：現在の要求・録音を無効化し、マイクをその場で離す
  const r=rec;recSeq++;rec=null;recNote="";
  if(r){r.keep=false;try{if(r.state!=="inactive")r.stop()}catch(e){}finally{tracksOff(r.st)}}
  player.pause();if(recUrl){URL.revokeObjectURL(recUrl);recUrl=""}
  recState="idle";
}
function recPlay(){
  const my=recSeq,fail=()=>{if(my!==recSeq)return;recNote="録音を再生できませんでした。録音なしでも続けられます。";redraw()}; // 古い再生の失敗は新しい画面に出さない
  speechSynthesis.cancel();if(voice)voice.pause();player.src=recUrl;
  try{const pr=player.play();if(pr&&pr.catch)pr.catch(fail)}catch(e){fail()}
}
function recUI(){
  if(!canRec)return "";
  if(recState==="blocked")return `<p class="heard">マイクを使えませんでした。録音なしでも進めます。許可の画面が出ない場合は、ブラウザーの設定でこのサイトのマイクを許可してください。</p><button class="btn ghost" data-rec>録音を再試行</button>`;
  if(recState==="pending")return `<button class="btn ghost" disabled>マイクを準備中…</button>`;
  if(recState==="rec")return `<button class="btn" data-recstop>■ 停止（録音中）</button>`;
  if(recState==="done")return `<div class="row"><button class="btn ghost" data-recplay>自分の声を聞く</button><button class="btn ghost" data-rec>録り直す</button></div>${recNote?`<p class="heard">${recNote}</p>`:""}`;
  return `<button class="btn ghost" data-rec>自分の声を録音する</button>`;
}
if(document.addEventListener)document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)return;
  if(recState==="pending"){recCancelPending();redraw()}
  else recStop(true);
});
UNITS.forEach(u=>{if(u.c&&(u.c.t.length!==3||new Set(u.c.t.map(t=>t[1])).size!==3||!u.c.t.every(t=>u.p[t[1]])))console.error("会話台本の条件違反（3往復・別々の有効な返事）:",u.t);const ok=u.r.filter(r=>Number.isInteger(r[1])&&u.p[r[1]]).map(r=>r[1]);if(u.p.length!==8||ok.length!==u.r.length||new Set(ok).size<2)console.error("教材データの条件違反（8文・会話の対象は有効な番号で、異なるものが2つ以上）:",u.t)});
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset,q=L&&L.q[L.i];
  if("unit" in d)start("unit",+d.unit);
  else if("talk" in d)start("talk",+d.talk);
  else if("review" in d)start("review");
  else if("flash" in d)start("flash");
  else if("home" in d||"quit" in d)home();
  else if("book" in d)book();
  else if("stats" in d)stats();
  else if("settings" in d){askReset=false;settings()}
  else if("intro" in d)intro(+d.intro);
  else if("introdone" in d){S.seen=1;save();home()}
  else if("set" in d){const k=d.set.split(":")[0],v=d.set.slice(k.length+1);S[k]=k==="sfx"?v==="true":k==="goal"?+v:v;save();settings()}
  else if("hearsample" in d)speak("Nice to meet you.");
  else if("copy" in d){
    const sel=()=>{const x=document.getElementById("exp");if(x){x.focus();x.select()}};
    const fail=()=>{setMsg="自動でコピーできませんでした。文字列を選択したので、そのままコピーしてください。";settings();sel()};
    try{navigator.clipboard.writeText(document.getElementById("exp").value).then(()=>{setMsg="コピーしました。";settings()},fail)}catch(e){fail()}
  }
  else if("import" in d){if(importCode(document.getElementById("imp").value))setMsg="学習記録を読み込みました。";else setErr="読み込めませんでした。文字列が途中で切れていないか確かめてください。";settings()}
  else if("reset" in d){askReset=true;settings()}
  else if("resetno" in d){askReset=false;settings()}
  else if("resetyes" in d){S=Object.assign(BLANK(),{rate:S.rate,sfx:S.sfx,goal:S.goal,seen:1});roll();save();askReset=false;setMsg="学習記録を消しました。";settings()}
  else if("hear" in d){const a=ALL.concat(VARS).find(a=>a.id===d.hear);if(a)speak(a.en)}
  else if("say" in d)(q.line&&!q.done&&!q.open?speak(q.line,1):speak(q.p.en));
  else if("next" in d){L.i++;show()}
  else if(q.done)return;
  else if("reveal" in d)reveal();
  else if("m" in d){const a=d.m.split(":");pickM(+a[0],+a[1])}
  else if("opt" in d){q.sel=+d.opt;draw()}
  else if("tile" in d){q.pick.push(+d.tile);draw()}
  else if("un" in d){q.pick.splice(+d.un,1);draw()}
  else if("check" in d)grade(q.opts?q.opts[q.sel].id===q.p.id:norm(q.pick.map(k=>q.tiles[k]).join(" "))===norm(q.p.en));
  else if("self" in d)grade(d.self==="1");
  else if("rec" in d)recStart();
  else if("recstop" in d)recStop(true);
  else if("recplay" in d)recPlay();
});
(S.seen||S.xp>0||Object.keys(S.done).length)?home():intro(0);
</script>
