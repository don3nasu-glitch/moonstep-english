資格を取った"]]}}, {"t": "京都ひとめぐり", "d": "友人を案内する", "l": [["B", "Welcome to Kyoto, Emma! How was the train ride?", "京都へようこそ、エマ！電車はどうだった？"], ["A", "Long, but I'm so excited. Where should we go first?", "長かったけど、すごくわくわくしてる。最初はどこへ行く？"], ["B", "Let's start with an old temple near here.", "まずはこの近くの古いお寺から始めよう。"], ["A", "Wonderful. Do I need to take off my shoes?", "すてき。靴は脱がなきゃいけない？"], ["B", "Only inside some buildings. I'll tell you when.", "建物によってはね。そのときは教えるよ。"], ["A", "Thank you. After that, can we try some street food?", "ありがとう。そのあと屋台の食べ物を試せる？"], ["B", "Of course. The rice crackers here are famous.", "もちろん。ここのおせんべいは有名なんだ。"], ["A", "You're the best guide. I'm glad I came.", "最高のガイドね。来てよかった。"]], "q": {"3": ["最初に行く場所は？", ["近くの古いお寺", "東京タワー", "デパート"]], "4": ["エマの質問は？", ["靴を脱ぐ必要があるか", "写真をとってもいいか", "入場料はいくらか"]], "7": ["この辺りで有名なものは？", ["おせんべい", "おにぎり", "アイスクリーム"]]}}, {"t": "ジューンの結婚式", "d": "招待状が届いた", "l": [["A", "Look, Ken! June sent us a wedding invitation.", "見て、ケン！ジューンから結婚式の招待状が来たよ。"], ["B", "How exciting! When is it?", "わくわくするね！いつ？"], ["A", "Next spring, at a garden by the sea.", "来年の春、海辺の庭園だって。"], ["B", "What should I wear? A suit and tie?", "何を着ればいい？スーツにネクタイ？"], ["A", "It says smart casual. No tie needed.", "きれいめカジュアルって書いてある。ネクタイはいらないよ。"], ["B", "Good. Do people give cash or a gift?", "よかった。お祝いは現金？それとも贈り物？"], ["A", "In her country, people usually give a gift from a list.", "彼女の国では、リストから贈り物を選ぶのが普通なの。"], ["B", "Then let's choose something together tonight.", "じゃあ今夜いっしょに選ぼう。"]], "q": {"3": ["式の場所は？", ["海辺の庭園", "教会", "ホテル"]], "5": ["服装の指定は？", ["きれいめカジュアル", "スーツにネクタイ", "着物"]], "7": ["ジューンの国のお祝いは？", ["リストから贈り物を選ぶ", "現金を包む", "手紙だけ"]]}}, {"t": "鍵をなくした夜", "d": "締め出された", "l": [["B", "Emma, are you home? I'm locked out!", "エマ、家にいる？締め出されちゃった！"], ["A", "Oh no. Where are your keys?", "大変。鍵はどこ？"], ["B", "I think I left them at the office.", "会社に置いてきたみたい。"], ["A", "Do you want to wait at my place?", "うちで待つ？"], ["B", "Yes, please. I'll call the landlord.", "うん、お願い。大家さんに電話するよ。"], ["A", "Here's some tea. Did you get through?", "お茶どうぞ。電話つながった？"], ["B", "Yes. He's coming with a spare key in an hour.", "うん。一時間後に合鍵を持って来てくれるって。"], ["A", "Good. Let's have dinner while we wait.", "よかった。待つあいだに夕飯にしよう。"]], "q": {"3": ["ケンの鍵はどこにある？", ["会社", "車の中", "カバンの底"]], "5": ["ケンが電話する相手は？", ["大家さん", "鍵屋", "警察"]], "7": ["大家さんはいつ来る？", ["一時間後", "明日の朝", "十分後"]]}}, {"t": "回転寿司デビュー", "d": "はじめての回る寿司", "l": [["A", "Ken, the plates are moving! How does this work?", "ケン、お皿が動いてる！どういうしくみ？"], ["B", "Just take any plate you like. The color shows the price.", "好きなお皿を取るだけ。色で値段がわかるんだ。"], ["A", "This is fun! Can I order something that isn't on the belt?", "楽しい！回ってないものも注文できる？"], ["B", "Sure. Use the touch screen right there.", "うん。そこのタッチパネルを使って。"], ["A", "I'll try the salmon. Where's the green tea?", "サーモンにしてみる。緑茶はどこ？"], ["B", "Put some powder in your cup and add hot water here.", "粉をカップに入れて、ここからお湯を注ぐんだ。"], ["A", "Wow, it's all self-service. I love it.", "わあ、全部セルフなのね。気に入った。"], ["B", "When you're done, we just count the plates.", "食べ終わったら、お皿の数を数えるだけだよ。"]], "q": {"2": ["値段の見分け方は？", ["お皿の色", "お皿の形", "お寿司の大きさ"]], "4": ["特別な注文の方法は？", ["タッチパネル", "店員を呼ぶ", "紙に書く"]], "8": ["会計の方法は？", ["お皿の数を数える", "重さをはかる", "レシートを見る"]]}}, {"t": "四百歩目の約束", "d": "すずねと次の山へ", "l": [["B", "Emma, we just finished our four hundredth step!", "エマ、四百歩目を歩き終えたよ！"], ["A", "Four hundred! I can't believe how far we've come.", "四百！ここまで来たなんて信じられない。"], ["B", "Remember when ordering coffee was scary?", "コーヒーの注文がこわかったころ、覚えてる？"], ["A", "Now you help tourists at the station.", "今では駅で観光客を助けてるもんね。"], ["B", "And you talk with clients in English every day.", "エマは毎日英語でお客さんと話してるし。"], ["A", "What should we aim for next?", "次は何を目指そうか？"], ["B", "Let's climb a real mountain. Then talk about it in English.", "本物の山に登ろう。それを英語で話すんだ。"], ["A", "Deal. One step at a time, together.", "決まり。一歩ずつ、いっしょにね。"]], "q": {"1": ["二人が達成したことは？", ["四百歩目", "四百キロ歩いた", "四百語覚えた"]], "4": ["今のケンがしていることは？", ["駅で観光客を助ける", "英語を教える", "通訳の仕事"]], "7": ["次の目標は？", ["本物の山に登って英語で話す", "海外に住む", "試験に合格する"]]}}, {"t": "海ぞいのドライブ", "d": "レンタカーを借りる", "l": [["A", "Hi, we booked a small car for two days.", "こんにちは、小型車を二日間予約しています。"], ["B", "Can we add insurance? I'm not used to driving here.", "保険をつけられますか？ここでの運転に慣れていなくて。"], ["A", "Good idea. Did they say we need to return it with a full tank?", "いい考えね。満タンで返さないといけないって言ってた？"], ["B", "The clerk says yes. There's a gas station near the airport.", "店員さんがそうだって。空港の近くにガソリンスタンドがあるよ。"], ["A", "Great. Can you check the car for scratches before we leave?", "よかった。出発前に車に傷がないか確認してくれる？"], ["B", "Sure. I'll take photos of the bumper, just in case.", "うん。念のため、バンパーの写真を撮っておくね。"], ["A", "Okay, seat belts on. Let's drive along the coast!", "よし、シートベルトをして。海ぞいを走ろう！"], ["B", "I'll be the navigator. Turn left at the next light.", "ぼくがナビ係ね。次の信号を左だよ。"]], "q": {"2": ["ケンが保険をつけたい理由は？", ["ここでの運転に慣れていない", "車が古い", "雨が降りそう"]], "6": ["ケンは何の写真を撮る？", ["バンパー", "海", "エマ"]], "8": ["次の信号でどうする？", ["左に曲がる", "右に曲がる", "まっすぐ進む"]]}}, {"t": "ゲームの夜", "d": "ボードゲームで盛り上がる", "l": [["B", "I brought a new board game. Want to play?", "新しいボードゲームを持ってきたよ。やる？"], ["A", "Sure! How do you play it?", "いいね！どうやって遊ぶの？"], ["B", "Roll the dice and collect cards. The rules are simple.", "サイコロを振ってカードを集めるんだ。ルールは簡単だよ。"], ["A", "Okay. Whose turn is it?", "わかった。だれの番？"], ["B", "Yours. Oh no, you just took my best card!", "エマの番。ああ、ぼくのいちばんいいカードを取られた！"], ["A", "Sorry, that's how the game works.", "ごめんね、そういうゲームでしょ。"], ["B", "Wait, did you just win again?", "待って、また勝ったの？"], ["A", "I did! Beginner's luck. One more round?", "勝った！ビギナーズラックね。もう一回やる？"]], "q": {"3": ["ゲームのルールは？", ["サイコロを振ってカードを集める", "絵を描いて当てる", "質問に答える"]], "5": ["エマがしたことは？", ["ケンのいちばんいいカードを取った", "ルールを変えた", "サイコロを落とした"]], "8": ["エマは勝因を何と言った？", ["ビギナーズラック", "練習の成果", "ケンが手を抜いた"]]}}, {"t": "にわか雨", "d": "雨宿りの出会い", "l": [["A", "Oh no, it's pouring! Let's wait under this roof.", "うわ、どしゃ降り！この屋根の下で待とう。"], ["B", "Good idea. I didn't bring an umbrella today.", "いい考え。今日は傘を持ってこなかったんだ。"], ["A", "Me neither. The forecast said sunny all day.", "私も。天気予報は一日中晴れだったのに。"], ["B", "Look, there's a small cafe right behind us.", "見て、すぐ後ろに小さなカフェがあるよ。"], ["A", "Perfect timing. Let's have some hot tea there.", "ちょうどいいね。そこで温かいお茶を飲もう。"], ["B", "This place is cozy. I never noticed it before.", "ここ、居心地がいいね。前は気づかなかった。"], ["A", "Sometimes the rain brings us something nice.", "雨がいいものを運んでくれることもあるね。"], ["B", "True. Look, the sky is clearing up already.", "そうだね。見て、もう晴れてきたよ。"]], "q": {"3": ["天気予報は何と言っていた？", ["一日中晴れ", "午後から雨", "雪"]], "4": ["ケンが見つけたものは？", ["小さなカフェ", "傘の店", "バス停"]], "8": ["最後の空のようすは？", ["晴れてきた", "雷が鳴った", "さらに暗くなった"]]}}, {"t": "ばったり再会", "d": "駅前で旧友に", "l": [["B", "Emma? Is that you? What a small world!", "エマ？きみなの？世間はせまいね！"], ["A", "Ken! I haven't seen you since college!", "ケン！大学以来だね！"], ["B", "You haven't changed a bit. Do you live around here?", "全然変わってないね。この辺に住んでるの？"], ["A", "I just moved here last month for work.", "先月、仕事でこっちに引っ越してきたの。"], ["B", "Really? My office is right across the street.", "本当？ぼくの会社、道の向かいなんだ。"], ["A", "No way! We should have lunch sometime.", "うそ！今度ランチしようよ。"], ["B", "Definitely. Here's my card. Call me anytime.", "ぜひ。これ、ぼくの名刺。いつでも電話して。"], ["A", "I will. It's so good to see you again.", "そうする。また会えて本当にうれしい。"]], "q": {"2": ["二人が最後に会ったのは？", ["大学時代", "高校時代", "去年"]], "4": ["エマが引っ越した理由は？", ["仕事", "結婚", "留学"]], "7": ["ケンが渡したものは？", ["名刺", "ハンカチ", "地図"]]}}, {"t": "相席のランチ", "d": "混んだ食堂で", "l": [["A", "Excuse me, is this seat taken?", "すみません、この席空いていますか？"], ["B", "No, go ahead. It's really crowded today.", "空いてますよ、どうぞ。今日はすごく混んでますね。"], ["A", "Thank you. What do you recommend here?", "ありがとう。ここのおすすめは何ですか？"], ["B", "The fried fish set is great, and it's cheap.", "魚のフライ定食がおいしくて、安いですよ。"], ["A", "I'll try it. Do you come here often?", "それにします。よく来るんですか？"], ["B", "Almost every day. My office is nearby.", "ほぼ毎日。会社が近いので。"], ["A", "Then I'll see you again, I guess. I'm Emma.", "じゃあ、また会いそうですね。エマです。"], ["B", "Nice to meet you. I'm Ken. Enjoy your lunch.", "はじめまして、ケンです。ランチを楽しんで。"]], "q": {"2": ["お店のようすは？", ["すごく混んでいる", "がらがら", "閉店まぎわ"]], "4": ["ケンのおすすめは？", ["魚のフライ定食", "カレー", "ラーメン"]], "6": ["ケンがよく来る理由は？", ["会社が近い", "店主の友人", "家が近い"]]}}, {"t": "ころもがえ", "d": "クローゼットの整理", "l": [["B", "It's getting cold. Time to switch our clothes for the season.", "寒くなってきたね。衣替えの時期だ。"], ["A", "Let's put the summer clothes in boxes.", "夏服を箱にしまおう。"], ["B", "Do you really wear this shirt? It still has the tag.", "このシャツ、本当に着る？まだ値札がついてるよ。"], ["A", "Okay, okay. Let's donate the ones we don't wear.", "わかった、わかった。着ない服は寄付しよう。"], ["B", "Good. If we haven't worn it in a year, it goes.", "いいね。一年着てないものは手放そう。"], ["A", "Look how much space we have now!", "見て、こんなに場所が空いた！"], ["B", "It feels great. My closet was bursting at the seams.", "気持ちいい。クローゼットがはちきれそうだったんだ。"], ["A", "Now let's take the winter coats out.", "じゃあ冬のコートを出そう。"]], "q": {"3": ["ケンが見つけたシャツのようすは？", ["まだ値札がついている", "穴があいている", "色あせている"]], "5": ["手放す服の基準は？", ["一年着ていないもの", "色の濃いもの", "古いブランド"]], "8": ["最後に出すものは？", ["冬のコート", "水着", "帽子"]]}}, {"t": "筆と墨", "d": "はじめての書道", "l": [["A", "Ken, you're taking a calligraphy class?", "ケン、書道の教室に通ってるの？"], ["B", "Yes. My teacher says I should relax my wrist.", "うん。先生に手首の力を抜けって言われる。"], ["A", "That sounds hard. What are you writing today?", "難しそう。今日は何を書くの？"], ["B", "The character for dream. It's my favorite word.", "「夢」という字。好きな言葉なんだ。"], ["A", "Can I try too?", "私もやってみていい？"], ["B", "Sure. Hold the brush straight, and go slowly.", "もちろん。筆をまっすぐ持って、ゆっくりね。"], ["A", "Oh no, mine looks like a spider!", "ああ、私のはクモみたい！"], ["B", "Don't worry. Practice makes perfect.", "気にしないで。習うより慣れろ、だよ。"]], "q": {"2": ["先生のアドバイスは？", ["手首の力を抜く", "もっと速く書く", "筆を強く握る"]], "4": ["今日書く字は？", ["夢", "愛", "空"]], "7": ["エマの字は何に見えた？", ["クモ", "花", "魚"]]}}, {"t": "焼きたての香り", "d": "町のパン屋", "l": [["B", "Smell that? The bakery just opened.", "このにおい、わかる？パン屋さんが開いたんだ。"], ["A", "It smells amazing. Let's go in.", "すごくいいにおい。入ろう。"], ["B", "Everything here is baked fresh every morning.", "ここのは全部、毎朝焼きたてなんだ。"], ["A", "What's this round one?", "この丸いのは何？"], ["B", "It's a melon bun. It doesn't taste like melon, though.", "メロンパン。でもメロンの味はしないんだ。"], ["A", "Really? Then why is it called that?", "本当？じゃあ、なんでそう呼ぶの？"], ["B", "Because of its shape. Try one. It's sweet and crispy.", "形のせいだよ。食べてみて。甘くてサクサクだよ。"], ["A", "Wow, it's delicious. I'll buy three more.", "わあ、おいしい。あと三つ買う。"]], "q": {"3": ["このパン屋の特徴は？", ["毎朝焼きたて", "一日中安売り", "夜だけ開く"]], "5": ["メロンパンの味は？", ["メロンの味はしない", "メロンの味が強い", "しょっぱい"]], "8": ["エマはいくつ追加で買う？", ["三つ", "一つ", "十個"]]}}, {"t": "旅の行き先会議", "d": "意見が分かれた夜", "l": [["A", "For our summer trip, I really want to go to Hawaii.", "夏の旅行、どうしてもハワイに行きたいな。"], ["B", "I agree up to a point, but it's really expensive.", "ある程度は賛成だけど、すごく高いよ。"], ["A", "That's true. What do you have in mind?", "たしかに。何か考えがあるの？"], ["B", "How about Okinawa? The beaches are just as beautiful.", "沖縄はどう？ビーチも同じくらいきれいだよ。"], ["A", "Good point. And the flight is shorter, too.", "いい指摘ね。それに飛行時間も短いし。"], ["B", "We could stay longer with the money we save.", "浮いたお金で長く泊まれるしね。"], ["A", "Okay, you've changed my mind. Okinawa it is!", "わかった、気が変わった。沖縄に決まり！"], ["B", "Great. Let's save Hawaii for our anniversary.", "よし。ハワイは記念日のためにとっておこう。"]], "q": {"2": ["ケンがハワイに迷う理由は？", ["費用が高い", "遠すぎる", "暑すぎる"]], "4": ["ケンの提案は？", ["沖縄", "北海道", "京都"]], "8": ["ハワイはいつ行く？", ["記念日", "来月", "行かない"]]}}, {"t": "言いすぎた翌朝", "d": "仲直りの朝食", "l": [["B", "Emma, about last night. I'm really sorry.", "エマ、ゆうべのことだけど……本当にごめん。"], ["A", "You hurt my feelings, Ken.", "傷ついたよ、ケン。"], ["B", "I know. I was tired, but that's no excuse.", "わかってる。疲れてたけど、言い訳にはならない。"], ["A", "Thank you for saying that. I said some things too.", "そう言ってくれてありがとう。私もいろいろ言っちゃった。"], ["B", "Can we start over? I made you breakfast.", "やり直せるかな？朝ごはん作ったんだ。"], ["A", "Pancakes? Okay, apology accepted.", "パンケーキ？わかった、許してあげる。"], ["B", "Next time, let's talk when we're both calm.", "次からは、二人とも落ち着いてから話そう。"], ["A", "Deal. Now, pass me the syrup, please.", "約束ね。じゃあ、シロップ取って。"]], "q": {"3": ["ケンが「言い訳にならない」と言ったのは？", ["疲れていたこと", "忙しかったこと", "お酒を飲んだこと"]], "6": ["ケンが作った朝ごはんは？", ["パンケーキ", "オムレツ", "おにぎり"]], "7": ["次からの約束は？", ["落ち着いてから話す", "けんかしない", "手紙で伝える"]]}}, {"t": "笑える失敗談", "d": "飲み会のひとコマ", "l": [["A", "Ken, tell everyone about your first day at work!", "ケン、入社初日の話をみんなにしてよ！"], ["B", "Oh no. Okay, so I was very nervous that morning.", "うわ。じゃあ……その朝、すごく緊張してたんだ。"], ["A", "And then what happened?", "それで、どうなったの？"], ["B", "I walked into the wrong office and gave my speech.", "間違ったオフィスに入って、あいさつしちゃったんだ。"], ["A", "No way! Didn't anyone stop you?", "うそ！だれも止めなかったの？"], ["B", "They just clapped politely. Then someone asked who I was.", "みんな礼儀正しく拍手してくれた。それから、だれかが『どちらさま？』って。"], ["A", "That's the funniest thing I've ever heard.", "今まで聞いた中でいちばんおもしろい話だよ。"], ["B", "Laugh all you want. I always check the door sign now.", "好きなだけ笑って。今はいつも扉の表示を確認してるよ。"]], "q": {"2": ["その朝のケンの気持ちは？", ["とても緊張していた", "眠かった", "楽しみだった"]], "4": ["ケンの失敗は？", ["違うオフィスであいさつした", "遅刻した", "名前を間違えた"]], "8": ["今ケンが必ずすることは？", ["扉の表示を確認する", "早く家を出る", "メモを書く"]]}}, {"t": "いつかの夢", "d": "縁側で語る未来", "l": [["B", "Emma, what do you want to do when you retire?", "エマ、退職したら何がしたい？"], ["A", "I'd love to live by the sea and grow vegetables.", "海のそばに住んで、野菜を育てたいな。"], ["B", "That sounds peaceful. I want to travel around the world.", "穏やかでいいね。ぼくは世界中を旅したい。"], ["A", "Where would you go first?", "最初はどこに行く？"], ["B", "Maybe South America. I've always wanted to see the mountains.", "南米かな。ずっと山を見てみたかったんだ。"], ["A", "Then send me postcards. In English, of course!", "じゃあ絵はがきを送ってね。もちろん英語で！"], ["B", "I will. And I'll visit your garden when I'm back.", "送るよ。帰ってきたら、きみの畑に遊びに行く。"], ["A", "I'll have fresh tomatoes waiting for you.", "とれたてのトマトを用意して待ってる。"]], "q": {"2": ["エマの夢は？", ["海のそばで野菜を育てる", "山で暮らす", "お店を開く"]], "5": ["ケンが最初に行きたい場所は？", ["南米", "ヨーロッパ", "アフリカ"]], "6": ["エマのお願いは？", ["英語で絵はがきを送る", "写真を撮る", "おみやげを買う"]]}}, {"t": "新しい街の部屋", "d": "海外で部屋を借りる", "l": [["A", "Ken, I found an apartment near the university!", "ケン、大学の近くにアパートを見つけたよ！"], ["B", "Great news. Did you sign the lease yet?", "いい知らせだね。もう契約書にサインした？"], ["A", "Not yet. The landlord wants two months' rent as a deposit.", "まだ。大家さんが敷金に家賃二か月分ほしいって。"], ["B", "That's normal here. Read the contract carefully, though.", "ここではよくあることだよ。でも契約書はよく読んでね。"], ["A", "Good idea. Are utilities included in the rent?", "そうする。光熱費は家賃に含まれてるのかな？"], ["B", "Ask about the internet, too. Setting it up can take weeks.", "ネットのことも聞いて。開通まで何週間もかかることがあるから。"], ["A", "Weeks? I can't live without Wi-Fi!", "何週間も？Wi-Fiなしじゃ生きられない！"], ["B", "You can use my Wi-Fi until then. I'm right next door.", "それまでうちのWi-Fiを使っていいよ。すぐ隣だから。"]], "q": {"3": ["敷金はいくら？", ["家賃二か月分", "家賃一か月分", "いらない"]], "6": ["ネットについての注意は？", ["開通まで何週間もかかる", "とても高い", "遅い"]], "8": ["ケンはどこに住んでいる？", ["すぐ隣", "大学の寮", "駅の近く"]]}}, {"t": "はじめての職場", "d": "多国籍チームのランチ", "l": [["B", "How was your first week at the new office?", "新しい職場の最初の一週間はどうだった？"], ["A", "Busy, but everyone is friendly. We had lunch together today.", "忙しいけど、みんな親切。今日はいっしょにランチしたの。"], ["B", "Where are your coworkers from?", "同僚はどこの出身？"], ["A", "Brazil, India, and Canada. I'm the only one from Japan.", "ブラジル、インド、カナダ。日本からは私だけ。"], ["B", "Did they ask you anything about Japan?", "日本について何か聞かれた？"], ["A", "Yes. They asked why we bow so much.", "うん。どうしてそんなにお辞儀するのかって。"], ["B", "What did you tell them?", "なんて答えたの？"], ["A", "I said it's like a handshake. It shows respect.", "握手みたいなものだって言った。敬意を表すのよ、って。"]], "q": {"2": ["エマの最初の一週間は？", ["忙しいけどみんな親切", "ひまだった", "大変で泣いた"]], "4": ["同僚の出身に含まれないのは？", ["フランス", "ブラジル", "インド"]], "8": ["お辞儀を何にたとえた？", ["握手", "笑顔", "あいさつ状"]]}}, {"t": "故郷の味", "d": "ホームシックの夜に", "l": [["A", "Ken, you look a little down tonight.", "ケン、今夜はちょっと元気ないね。"], ["B", "I miss home. I really want some miso soup.", "家が恋しくて。すごくみそ汁が飲みたい。"], ["A", "I know that feeling. Let's make Japanese food together!", "その気持ちわかる。いっしょに和食を作ろう！"], ["B", "Can we find miso around here?", "この辺でみそって手に入るかな？"], ["A", "There's an Asian market downtown. Let's go now.", "街なかにアジア食材の店があるよ。今から行こう。"], ["B", "Let's invite our neighbors, too. They love trying new food.", "お隣さんも呼ぼうよ。新しい料理を試すのが好きなんだ。"], ["A", "Good idea. Hand-rolled sushi is easy for a party.", "いいね。手巻き寿司ならパーティーでも簡単だよ。"], ["B", "Thanks, Emma. I feel better already.", "ありがとう、エマ。もう元気が出てきた。"]], "q": {"2": ["ケンが飲みたいものは？", ["みそ汁", "緑茶", "コーヒー"]], "5": ["みそはどこで手に入る？", ["街なかのアジア食材の店", "駅の売店", "インターネットだけ"]], "7": ["パーティーで作るものは？", ["手巻き寿司", "天ぷら", "カレー"]]}}, {"t": "一年目の手紙", "d": "海外生活をふり返る", "l": [["B", "Emma, it's been one year since we moved abroad.", "エマ、海外に引っ越してちょうど一年だね。"], ["A", "Time flies. Remember our first trip to the bank?", "早いね。初めて銀行に行った日、覚えてる？"], ["B", "I couldn't understand a single word the clerk said.", "窓口の人の言うこと、ひと言もわからなかった。"], ["A", "And now you chat with her every week.", "今では毎週おしゃべりしてるのにね。"], ["B", "What surprised you most this year?", "この一年で一番驚いたことは？"], ["A", "How kind strangers were when I was lost.", "道に迷ったとき、知らない人たちがすごく親切だったこと。"], ["B", "Let's write a letter to ourselves for next year.", "来年の自分たちに手紙を書こうよ。"], ["A", "Great idea. Dear future me, keep going!", "いい考え。未来の私へ、その調子でがんばれ！"]], "q": {"1": ["今日は何の日？", ["海外に引っ越して一年", "結婚記念日", "エマの誕生日"]], "3": ["初めて銀行に行った日に何があった？", ["窓口の人の言葉がわからなかった", "口座を作れなかった", "カードをなくした"]], "6": ["エマが一番驚いたことは？", ["知らない人の親切さ", "物価の高さ", "天気の悪さ"]]}}, {"t": "役員の前で", "d": "はじめての提案プレゼン", "l": [["A", "I'm presenting my proposal to the directors tomorrow.", "明日、役員の前で提案を発表するの。"], ["B", "That's big. How long do you get?", "大舞台だね。持ち時間はどれくらい？"], ["A", "Just five minutes, and then questions.", "たった五分。そのあと質疑応答。"], ["B", "Questions are the scary part. What if you don't know an answer?", "質問がこわいところだよね。答えがわからなかったら？"], ["A", "I'll say I'll follow up by email.", "後でメールで回答しますって言うつもり。"], ["B", "Good thinking. Want to practice on me tonight?", "賢いね。今夜ぼく相手に練習する？"], ["A", "Yes, please. Ask me the hardest questions you can.", "ぜひ。できるだけ難しい質問をして。"], ["B", "Deal. I'll be the grumpiest director ever.", "任せて。史上最も気難しい役員になるよ。"]], "q": {"3": ["発表の持ち時間は？", ["五分", "十分", "三十分"]], "5": ["答えられない質問にはどうする？", ["後でメールで答える", "想像で答える", "質問を無視する"]], "7": ["エマはケンに何を頼んだ？", ["できるだけ難しい質問をすること", "スライドを作ること", "代わりに発表すること"]]}}, {"t": "締め切り前夜" day! Did she cry?", "大事な日だね！泣いた？"], ["A", "No, she was thrilled. She showed everyone the gap.", "ううん、大喜び。みんなにすきまを見せてた。"], ["B", "Is the tooth fairy visiting tonight?", "今夜は歯の妖精が来るの？"], ["A", "Yes, but I have no idea how much to leave.", "うん、でもいくら置けばいいかわからなくて。"], ["B", "We gave our kids one dollar per tooth.", "うちは歯一本につき一ドルだったよ。"], ["A", "Just a dollar? Mia expects a whole treasure chest.", "一ドルだけ？ミアは宝箱を丸ごと期待してるよ。"], ["B", "Then add a tiny note from the fairy.", "それなら妖精からの小さな手紙を添えたら？"]], "q": {"1": ["ミアの歯はいつ抜けた？", ["今日のお昼", "昨日の夜", "今朝"]], "3": ["ミアはどんな反応だった？", ["大喜びでみんなに見せた", "泣いてしまった", "恥ずかしがって隠した"]], "6": ["ケンの家では歯一本につきいくらだった？", ["一ドル", "五ドル", "十セント"]]}}, {"t": "網棚のリュック", "d": "電車に置き忘れたかばん", "l": [["B", "I left my backpack on the train this morning.", "今朝、電車にリュックを置き忘れたんだ。"], ["A", "Oh no! Did you call the lost and found?", "えっ！遺失物係に電話した？"], ["B", "Right away. I described the red tag on it.", "すぐにね。付いてる赤いタグのことを伝えた。"], ["A", "Smart. What was inside?", "さすが。中には何が入ってたの？"], ["B", "My laptop and a guidebook, but not my passport.", "ノートパソコンとガイドブック。パスポートは入ってなかった。"], ["A", "Thank goodness. Have they found it yet?", "よかった。もう見つかった？"], ["B", "Yes! It's waiting at the last station on the line.", "うん！終点の駅で保管されてる。"], ["A", "Then let's grab lunch on the way there.", "じゃあ、取りに行く途中でお昼を食べよう。"]], "q": {"3": ["ケンは遺失物係に何を伝えた？", ["リュックに付いた赤いタグ", "電車に乗った時刻", "自分の住所"]], "5": ["パスポートはどうなっていた？", ["リュックに入っていなかった", "リュックに入っていた", "駅で見つかった"]], "7": ["リュックはどこで保管されている？", ["終点の駅", "警察署", "空港"]]}}, {"t": "写真と違う部屋", "d": "予約サイトとの落差", "l": [["A", "Our room looks nothing like the photos online.", "部屋がネットの写真と全然違う。"], ["B", "Where's the balcony? The listing showed a huge one.", "バルコニーはどこ？掲載では大きいのがあったのに。"], ["A", "And it smells like smoke in here.", "それに、ここたばこ臭いよ。"], ["B", "Let's go down and talk to the front desk.", "下に行ってフロントに話そう。"], ["A", "I'll bring the screenshot of our booking.", "予約画面のスクショを持っていくね。"], ["B", "Good idea. Stay calm but firm.", "いい考え。落ち着いて、でもはっきりね。"], ["A", "They moved us to the top floor. Look at this view!", "最上階に移してくれた。この眺めを見て！"], ["B", "Totally worth complaining. Let's open the balcony door.", "言ってみたかいがあったね。バルコニーのドアを開けよう。"]], "q": {"2": ["予約サイトの掲載には何があった？", ["大きなバルコニー", "屋外プール", "広いキッチン"]], "5": ["エマはフロントに何を持っていく？", ["予約画面のスクリーンショット", "部屋の鍵", "パスポート"]], "7": ["相談の結果どうなった？", ["最上階の部屋に移った", "全額返金された", "別のホテルに移った"]]}}, {"t": "走れ、乗り継ぎ", "d": "遅れた便と次の便", "l": [["B", "We landed forty minutes late. Our connection leaves soon.", "四十分遅れて着いた。乗り継ぎ便がもうすぐ出るよ。"], ["A", "Which gate? I'll check the screen.", "何番ゲート？画面で確認する。"], ["B", "Gate twenty-two. That's in the other terminal!", "二十二番。反対側のターミナルだ！"], ["A", "There's a shuttle train. Come on, run!", "シャトル列車があるよ。ほら、走って！"], ["B", "We made it, but the door just closed.", "着いたけど、ちょうど扉が閉まった。"], ["A", "Excuse me, can you rebook us on the next flight?", "すみません、次の便に振り替えてもらえますか？"], ["B", "Good news. Two seats tonight, and a meal voucher.", "朗報だよ。今夜の便に二席と、食事券ももらえた。"], ["A", "So dinner's on the airline. Not bad at all.", "じゃあ夕食は航空会社持ちね。悪くないじゃない。"]], "q": {"1": ["飛行機はどのくらい遅れて着いた？", ["四十分", "二十分", "二時間"]], "3": ["乗り継ぎのゲートはどこにあった？", ["反対側のターミナル", "すぐ隣のゲート", "到着したゲートと同じ場所"]], "7": ["振り替えの結果、何を得た？", ["今夜の便の二席と食事券", "ホテルの宿泊券", "翌朝の便のビジネス席"]]}}, {"t": "教会裏の食堂", "d": "地元の人に聞いた穴場", "l": [["A", "Every restaurant on this street has a tourist menu.", "この通りの店はどこも観光客向けメニューだね。"], ["B", "Let's ask that woman at the flower shop.", "あの花屋の女性に聞いてみよう。"], ["A", "She said locals eat at a tiny place behind the church, with no sign.", "地元の人は教会の裏の看板もない小さな店で食べるって。"], ["B", "No sign outside? That's usually a good sign.", "外に看板なし？たいていそれはいい兆しだよ。"], ["A", "She told us to order the fish stew.", "魚の煮込みを頼むといいって言われた。"], ["B", "And to say Rosa sent us.", "それと、ローザの紹介だって言えってね。"], ["A", "This stew is incredible, and so cheap.", "この煮込み最高。しかもすごく安い。"], ["B", "Let's go back tomorrow and buy some of her flowers.", "明日戻って、彼女の店で花を買おう。"]], "q": {"3": ["地元の人が食べる店はどこにある？", ["教会の裏", "駅の前", "花屋の二階"]], "5": ["何を頼むようにすすめられた？", ["魚の煮込み", "肉の串焼き", "野菜のスープ"]], "8": ["ケンは明日何をしようと言っている？", ["花屋で花を買う", "教会を見学する", "別の町へ移動する"]]}}, {"t": "そっけない返信", "d": "文面の誤解を解く", "l": [["A", "Did I do something to upset you?", "わたし、何か気に障ることした？"], ["B", "No! Why would you think that?", "まさか！どうしてそう思ったの？"], ["A", "Your reply yesterday was just one word: 'Fine.'", "昨日の返信、「いいよ」の一言だけだったから。"], ["B", "Oh no. I was rushing between meetings.", "しまった。会議の合間で急いでたんだ。"], ["A", "It sounded so cold, honestly.", "正直、すごく冷たく聞こえた。"], ["B", "I'm really sorry. It came out wrong.", "本当にごめん。変な伝わり方しちゃった。"], ["A", "That's okay. I'm glad I asked.", "いいよ。聞いてよかった。"], ["B", "Next time, I'll add a smiley face, I promise.", "次は笑顔の絵文字をつけるよ、約束する。"]], "q": {"3": ["エマが気にしたケンの返信は？", ["一言だけの返事", "長すぎる返事", "返事がなかったこと"]], "4": ["ケンの返信が短かった理由は？", ["会議の合間で急いでいた", "エマに怒っていた", "スマホが壊れていた"]], "8": ["ケンは次からどうすると約束した？", ["笑顔の絵文字をつける", "返信するのをやめる", "手紙で返事をする"]]}}, {"t": "わからなかった冗談", "d": "冗談の意味を聞く", "l": [["B", "That joke went right over my head.", "さっきの冗談、全然ピンとこなかった。"], ["A", "The one about the baker?", "パン屋さんの話のやつ？"], ["B", "Yes. Everyone laughed, but I just smiled.", "うん。みんな笑ってたけど、ぼくは笑顔でごまかした。"], ["A", "It's a pun. The baker said he's 'on a roll.'", "だじゃれだよ。パン屋さんが「on a roll」って言ったの。"], ["B", "Oh! A roll is a kind of bread.", "あ！ロールってパンの一種か。"], ["A", "Exactly. It also means you're doing great.", "そう。それに「絶好調」って意味もあるの。"], ["B", "That's actually clever. I'll laugh twice to catch up.", "実はうまいね。遅れた分、二回笑っておく。"], ["A", "Next time, just ask me. Nobody minds.", "次からは遠慮なく聞いて。誰も気にしないよ。"]], "q": {"3": ["みんなが笑ったとき、ケンはどうした？", ["笑顔でごまかした", "大声で笑った", "部屋を出た"]], "4": ["冗談の種類は？", ["だじゃれ", "なぞなぞ", "ものまね"]], "6": ["on a roll のもう一つの意味は？", ["絶好調である", "道に迷っている", "おなかがすいている"]]}}, {"t": "不合格の夜", "d": "落ちこむ友人に寄りそう", "l": [["B", "I didn't pass the certification exam.", "資格試験、受からなかった。"], ["A", "Oh, I'm so sorry. That's really rough.", "ああ、本当に残念だったね。つらいよね。"], ["B", "I studied every night for six months.", "半年間、毎晩勉強したのに。"], ["A", "I know. You put so much into it.", "知ってる。あんなにがんばってたもんね。"], ["B", "Maybe I should just give up.", "もう、あきらめたほうがいいのかも。"], ["A", "No need to decide anything tonight.", "今夜は何も決めなくていいよ。"], ["B", "You're right. I'm just exhausted.", "そうだね。ただ疲れてるだけかも。"], ["A", "Let's get some ramen. My treat.", "ラーメン食べに行こう。わたしのおごり。"]], "q": {"3": ["ケンはどのくらい勉強した？", ["半年間、毎晩", "一週間だけ", "週末だけ一年間"]], "6": ["エマはケンに何と言った？", ["今夜は何も決めなくていい", "すぐに再受験すべきだ", "別の資格を目指すべきだ"]], "8": ["エマはケンをどこに誘った？", ["ラーメン屋", "カラオケ", "映画館"]]}}, {"t": "読書会の小さな提案", "d": "押しつけずに提案する", "l": [["B", "Only three people talked at book club tonight.", "今夜の読書会、話したのは三人だけだった。"], ["A", "I have a thought, if you want to hear it.", "ちょっと思いついたことがあるんだけど、聞く？"], ["B", "Of course. I'm out of ideas.", "もちろん。もうお手上げなんだ。"], ["A", "What if we tried smaller groups of four?", "四人ずつの小さなグループにしてみるのはどう？"], ["B", "Interesting. Why smaller groups, though?", "おもしろいね。でも、どうして少人数？"], ["A", "It might help the quieter people speak up.", "おとなしい人も発言しやすくなるかも。"], ["B", "Let's try it next month and see.", "来月試して様子を見よう。"], ["A", "Great. I'm happy to help set it up.", "いいね。準備なら喜んで手伝うよ。"]], "q": {"1": ["今夜の読書会で話したのは何人？", ["三人", "四人", "全員"]], "4": ["エマの提案は？", ["四人ずつの小グループにする", "読書会をやめる", "課題の本を短くする"]], "7": ["ケンはいつ提案を試すことにした？", ["来月", "明日", "来年"]]}}, {"t": "はじめてのカボチャ彫り", "d": "ハロウィンの準備", "l": [["A", "Have you ever carved a pumpkin before?", "カボチャを彫ったことある？"], ["B", "Never. We don't really do this in Japan.", "一度もない。日本ではあまりやらないから。"], ["A", "First, cut a lid around the stem.", "まず、へたのまわりをふたのように切って。"], ["B", "Okay. Now I scoop out all this goop?", "よし。次はこのどろどろを全部かき出すの？"], ["A", "Yes, but save the seeds. We'll roast them later.", "そう、でも種はとっておいて。あとで焼くから。"], ["B", "I want a friendly face, not a scary one.", "怖い顔じゃなくて、やさしい顔にしたいな。"], ["A", "Then give it a big, crooked smile.", "じゃあ、大きくてゆがんだ笑顔にしたら。"], ["B", "Done. It looks a little like my boss, actually.", "できた。実はちょっと上司に似てる。"]], "q": {"3": ["エマが最初にするよう言ったことは？", ["へたのまわりにふたを切る", "顔の下書きをする", "ろうそくを入れる"]], "5": ["種はどうする予定？", ["あとで焼く", "庭にまく", "捨てる"]], "6": ["ケンはどんな顔にしたい？", ["やさしい顔", "怖い顔", "泣き顔"]]}}, {"t": "シークレットサンタの正体", "d": "職場のプレゼント交換", "l": [["B", "Someone left a mug on my desk this morning.", "今朝、誰かがぼくの机にマグカップを置いていった。"], ["A", "Oh, it must be from your Secret Santa.", "あ、シークレットサンタからだね。"], ["B", "It says, 'World's Okayest Coworker.'", "「世界一そこそこの同僚」って書いてある。"], ["A", "That's hilarious. Any idea who drew your name?", "最高。誰があなたの名前を引いたか見当つく？"], ["B", "No clue. The note is typed, not handwritten.", "全然。メモは手書きじゃなくて印刷なんだ。"], ["A", "Clever. Your Santa doesn't want to get caught.", "賢いね。あなたのサンタはばれたくないんだよ。"], ["B", "Wait, you're smiling. Was it you?", "待って、にやにやしてる。きみでしょ？"], ["A", "My lips are sealed until the party.", "パーティーまでは口にチャックだよ。"]], "q": {"1": ["机に置いてあったものは？", ["マグカップ", "カード", "チョコレート"]], "5": ["メモの特徴は？", ["手書きではなく印刷", "差出人の名前があった", "日本語で書かれていた"]], "8": ["エマはいつまで秘密にすると言った？", ["パーティーまで", "年明けまで", "明日の朝まで"]]}}, {"t": "屋上のカウントダウン", "d": "大みそかのパーティー", "l": [["A", "Grab your coat. Everyone's going up to the roof.", "コートを持って。みんな屋上に行くよ。"], ["B", "The roof? It's freezing out there.", "屋上？外は凍えるほど寒いよ。"], ["A", "You can see fireworks over the whole city from there.", "あそこから街じゅうの花火が見えるの。"], ["B", "Fine, but I'm bringing my hot chocolate.", "わかった、でもホットチョコは持っていくよ。"], ["A", "Two minutes left. Did you make a resolution?", "あと二分。抱負は決めた？"], ["B", "Learn to cook something besides instant noodles.", "インスタント麺以外の料理を覚えること。"], ["A", "Here we go! Ten, nine, eight...", "始まるよ！十、九、八…"], ["B", "Happy New Year! Look at all those colors!", "あけましておめでとう！あの色を見て！"]], "q": {"2": ["ケンが最初に屋上を渋った理由は？", ["外がとても寒いから", "高い所が怖いから", "眠いから"]], "4": ["ケンが屋上に持っていくものは？", ["ホットチョコレート", "シャンパン", "毛布"]], "6": ["ケンの新年の抱負は？", ["インスタント麺以外の料理を覚える", "毎朝走る", "早起きする"]]}}, {"t": "裏庭の独立記念日", "d": "七月四日のバーベキュー", "l": [["B", "So why does everyone celebrate on July Fourth?", "それで、どうしてみんな七月四日にお祝いするの？"], ["A", "It marks the day the country declared independence.", "国が独立を宣言した日なの。"], ["B", "And the way to celebrate is burgers and fireworks?", "で、そのお祝いがハンバーガーと花火？"], ["A", "Pretty much. Plus parades and lots of flags.", "だいたいね。それにパレードと旗がたくさん。"], ["B", "My burger is perfect. Who's the grill master?", "ぼくのバーガー、完璧だ。グリル担当は誰？"], ["A", "My uncle. He guards that grill all summer.", "おじさん。夏のあいだずっとあのグリルを守ってるの。"], ["B", "When do the fireworks start?", "花火はいつ始まるの？"], ["A", "Once it's dark. Let's save a spot on the lawn.", "暗くなったらね。芝生に場所を取っておこう。"]], "q": {"2": ["七月四日は何の日？", ["国が独立を宣言した日", "建国者の誕生日", "戦争が終わった日"]], "6": ["グリル担当は誰？", ["エマのおじさん", "ケン", "エマのお父さん"]], "8": ["花火はいつ始まる？", ["暗くなったら", "正午", "夕食の前"]]}}, {"t": "新しい路線の初乗り", "d": "開業日の電車で", "l": [["A", "Fancy seeing you here on opening day!", "開業日にこんなところで会うなんて！"], ["B", "I had to try it. My commute used to take an hour.", "乗ってみたくて。前は通勤に一時間かかってたんだ。"], ["A", "How long does it take now?", "今はどのくらい？"], ["B", "About twenty-five minutes, door to door.", "家から会社まで二十五分くらい。"], ["A", "That's huge. You'll finally have time for breakfast.", "すごい差だね。やっと朝ごはんの時間ができるね。"], ["B", "Exactly. And the seats are so comfortable.", "そのとおり。それに座席がすごく快適なんだ。"], ["A", "Enjoy it now. It'll be packed by next week.", "今のうちに楽しんで。来週には満員だよ。"], ["B", "Then I'll just have to get up earlier.", "じゃあ、もっと早起きするしかないね。"]], "q": {"2": ["ケンの以前の通勤時間は？", ["一時間", "二十五分", "十五分"]], "6": ["ケンが新しい電車で気に入った点は？", ["座席が快適", "駅がきれい", "運賃が安い"]], "7": ["エマは来週どうなると言っている？", ["電車が満員になる", "電車が運休する", "運賃が上がる"]]}}, {"t": "さよならパン屋", "d": "なじみの店の閉店", "l": [["B", "Did you see the sign on Rosie's Bakery?", "ローズィーズ・ベーカリーの貼り紙、見た？"], ["A", "I did. I almost cried in the street.", "見た。道ばたで泣きそうになった。"], ["B", "The owners are retiring after thirty years.", "オーナー夫婦が三十年やって引退するんだって。"], ["A", "They deserve it, but I'll miss their cinnamon rolls.", "ゆっくり休んでほしいけど、あのシナモンロールが恋しくなるな。"], ["B", "Their last day is this Saturday.", "最終日は今週の土曜日だよ。"], ["A", "Let's go first thing and buy a dozen.", "朝いちばんに行って、一ダース買おう。"], ["B", "And let's bring them a card from the neighborhood.", "それと、近所のみんなからのカードを持っていこう。"], ["A", "Perfect. I'll start collecting messages tonight.", "いいね。今夜からメッセージを集め始めるね。"]], "q": {"3": ["パン屋が閉店する理由は？", ["オーナーが引退する", "家賃が上がった", "お客さんが減った"]], "5": ["最終日はいつ？", ["今週の土曜日", "今週の日曜日", "来月の初め"]], "7": ["ケンは何を持っていこうと提案した？", ["近所のみんなからのカード", "花束", "手作りのケーキ"]]}}, {"t": "湖畔の流星群", "d": "街の明かりを離れて", "l": [["A", "The news says the meteor shower peaks tonight.", "ニュースで、今夜流星群がピークだって。"], ["B", "Really? Let's drive up to the lake.", "本当？湖まで車で行こうよ。"], ["A", "Good idea. The city lights are too bright here.", "いいね。ここは街の明かりが明るすぎるし。"], ["B", "I'll bring blankets and a thermos of hot tea.", "毛布と、水筒に温かいお茶を入れて持っていくよ。"], ["A", "Lie back and let your eyes adjust first.", "まず寝そべって、目を暗さに慣らしてね。"], ["B", "There goes one! It was so bright!", "流れた！すごく明るかった！"], ["A", "Did you make a wish?", "願いごとした？"], ["B", "I wished that we could do this every year.", "毎年こうして見られますようにって。"]], "q": {"2": ["二人はどこへ行く？", ["湖", "山の展望台", "海辺"]], "4": ["ケンが持っていくものは？", ["毛布と温かいお茶", "望遠鏡", "お弁当"]], "8": ["ケンの願いごとは？", ["毎年こうして流星群を見ること", "明日晴れること", "新しい車を買うこと"]]}}, {"t": "マラソンの日曜日", "d": "通行止めとブランチ", "l": [["B", "Our brunch place is right on the marathon route.", "ブランチのお店、マラソンのコース沿いだよ。"], ["A", "Oh no. The roads close at seven, right?", "しまった。道路は七時に通行止めになるよね？"], ["B", "Yes, until about noon.", "うん、昼ごろまでね。"], ["A", "Let's take the subway and push brunch back.", "地下鉄で行って、ブランチを遅らせよう。"], ["B", "Good plan. We could cheer for a while first.", "いい案だね。先にしばらく応援してもいいし。"], ["A", "My coworker is running. She's wearing a pink cap.", "同僚が走るの。ピンクの帽子をかぶってるって。"], ["B", "Then let's make a sign with her name on it.", "じゃあ、彼女の名前を書いた応援ボードを作ろう。"], ["A", "Sounds good. Pancakes taste better after cheering, anyway.", "いいね。応援のあとのパンケーキは格別だしね。"]], "q": {"3": ["通行止めはいつまで？", ["昼ごろまで", "夕方まで", "一日じゅう"]], "4": ["エマの提案は？", ["地下鉄で行き、ブランチを遅らせる", "タクシーで行く", "ブランチを中止する"]], "6": ["エマの同僚の目印は？", ["ピンクの帽子", "黄色いシャツ", "青い旗"]]}}, {"t": "夜勤明けのコーヒー", "d": "看護師のエマと朝のカフェで", "l": [["A", "Morning! Well, it feels like evening. I just finished a night shift.", "おはよう！といっても夜みたいな気分。夜勤が終わったところなの。"], ["B", "You look exhausted. How long was it?", "疲れてるね。何時間だったの？"], ["A", "Twelve hours. Three new patients came in after midnight.", "十二時間。夜中過ぎに新しい患者さんが三人来たの。"], ["B", "How do you even stay awake that long?", "そんなに長くどうやって起きていられるの？"], ["A", "Coffee, teamwork, and a lot of walking up and down the halls.", "コーヒーとチームワーク、それに廊下を何往復も歩くこと。"], ["B", "I could never do that. I fall asleep at ten.", "僕には絶対無理だ。十時には寝ちゃうもん。"], ["A", "Honestly, a thank-you from a patient keeps me going.", "正直、患者さんからの「ありがとう」が支えなの。"], ["B", "Then let me buy your breakfast. Go home and sleep after.", "じゃあ朝ごはんをおごらせて。そのあと帰って寝てね。"]], "q": {"1": ["エマは今どんな状況？", ["夜勤を終えたところ", "これから夜勤に行く", "今日は休みの日"]], "3": ["夜中過ぎに何があった？", ["新しい患者が三人来た", "停電が起きた", "同僚が早退した"]], "8": ["ケンは何を申し出た？", ["朝食をおごる", "家まで車で送る", "夕食を作る"]]}}, {"t": "週末の畑仕事", "d": "ケンが叔父の農場を手伝う", "l": [["B", "I spent the weekend helping on my uncle's farm.", "週末は叔父さんの農場を手伝ってたんだ。"], ["A", "That sounds peaceful. How was it?", "のどかそうだね。どうだった？"], ["B", "Peaceful? I was up before five, picking tomatoes.", "のどか？五時前に起きてトマトを摘んでたよ。"], ["A", "On a Saturday? Your uncle must be tough.", "土曜日に？叔父さん、タフなんだね。"], ["B", "He does it every single day, even in the rain.", "叔父さんは毎日やってるんだ、雨の日でもね。"], ["A", "So what was the hardest part for you?", "で、ケンにとって一番大変だったのは？"], ["B", "Bending over all day. My back still hurts.", "一日中かがんでること。まだ腰が痛いよ。"], ["A", "Well, I hope he paid you in tomatoes, at least.", "せめてトマトでお礼をもらえたといいね。"]], "q": {"1": ["ケンは週末どこにいた？", ["叔父の農場", "祖母の家", "市民農園"]], "3": ["ケンは何時前に起きた？", ["五時", "六時", "七時"]], "7": ["ケンにとって一番大変だったことは？", ["一日中かがむこと", "雨の中で働くこと", "重い箱を運ぶこと"]]}}, {"t": "ドラゴンがアヒルに", "d": "翻訳の仕事の失敗談", "l": [["A", "I made the funniest mistake at work this week.", "今週、仕事でめちゃくちゃ面白いミスをしたの。"], ["B", "You're translating that fantasy game, right?", "あのファンタジーゲームを翻訳してるんだよね？"], ["A", "Yes. I translated the final boss as a giant duck.", "そう。ラスボスを巨大なアヒルって訳しちゃったの。"], ["B", "A duck? What was it supposed to be?", "アヒル？本当は何だったの？"], ["A", "A dragon. I was tired and typed the wrong word.", "ドラゴン。疲れてて違う単語を打っちゃったの。"], ["B", "Did anyone catch it before the release?", "発売前に誰か気づいた？"], ["A", "My editor did. She laughed for ten minutes straight.", "編集者が気づいたよ。十分間ずっと笑ってた。"], ["B", "Honestly, a duck boss sounds like a better game.", "正直、アヒルのボスのほうが面白いゲームになりそう。"]], "q": {"2": ["エマが翻訳しているものは？", ["ファンタジーゲーム", "料理本", "映画の字幕"]], "5": ["ラスボスは本当は何だった？", ["ドラゴン", "ヘビ", "ワシ"]], "7": ["ミスに気づいたのは誰？", ["エマの編集者", "ケン", "ゲームのプレイヤー"]]}}, {"t": "車掌さんの忘れ物", "d": "車掌のケンが見つけたもの", "l": [["B", "Guess what a passenger left on my train today.", "今日、お客さんが電車に何を忘れていったと思う？"], ["A", "An umbrella? You must get hundreds of those.", "傘？そういうのは山ほどあるでしょ。"], ["B", "Not this time. A whole birthday cake.", "今回は違うんだ。誕生日ケーキまるごと。"], ["A", "No way! Did anyone come back for it?", "うそ！誰か取りに戻ってきた？"], ["B", "A panicked dad called the station an hour later.", "一時間後に、慌てたお父さんが駅に電話してきたよ。"], ["A", "I hope the cake survived the trip.", "ケーキが無事だったといいけど。"], ["B", "Perfectly. I kept it in the staff room fridge.", "完璧に無事。職員用の部屋の冷蔵庫に入れておいたんだ。"], ["A", "You're officially the hero of that birthday party.", "あなたはもう、その誕生日パーティーのヒーローだね。"]], "q": {"3": ["今日の忘れ物は何だった？", ["誕生日ケーキ", "傘", "財布"]], "5": ["駅に電話してきたのは誰？", ["慌てた父親", "別の駅の駅員", "忘れた子ども本人"]], "7": ["ケンはケーキをどこに保管した？", ["職員用の部屋の冷蔵庫", "運転席", "駅のロッカー"]]}}, {"t": "はじめての銭湯", "d": "エマが近所の銭湯をはじめて体験する", "l": [["A", "So this is a sento? It looks like an old temple.", "ここが銭湯？古いお寺みたいだね。"], ["B", "Lots of them do. We pay at the front, then split up.", "そういう所が多いんだ。受付で払って、そこから別々だよ。"], ["A", "Right, men and women bathe separately. What else should I know?", "そうか、男女別に入るんだね。他に知っておくことは？"], ["B", "Wash your whole body at the showers before you get in.", "入る前に洗い場で全身を洗ってね。"], ["A", "Got it. And my towel? Can I take it into the bath?", "わかった。タオルは？湯船に持って入っていい？"], ["B", "Keep it out of the water. Most people rest it on their head.", "お湯にはつけないで。頭にのせる人が多いよ。"], ["A", "On my head? Okay, I'll try to look like a local.", "頭に？じゃあ地元の人っぽくやってみる。"], ["B", "Meet me here after. The first cold milk is on me.", "終わったらここで会おう。最初の冷たい牛乳はおごるよ。"]], "q": {"2": ["受付で払ったあとどうする？", ["男女別に分かれる", "一緒に湯船に入る", "タオルを借りに行く"]], "4": ["湯船に入る前にすることは？", ["全身を洗う", "牛乳を飲む", "髪を乾かす"]], "8": ["ケンは何をおごると言った？", ["冷たい牛乳", "夕食", "入浴料"]]}}, {"t": "コンビニで荷物を受け取る", "d": "エマの荷物がなぜかコンビニに届いた", "l": [["A", "My package went to a konbini instead of my apartment.", "私の荷物、アパートじゃなくてコンビニに届いたの。"], ["B", "That's pretty common. You probably chose konbini pickup by mistake.", "よくあるよ。たぶん間違えてコンビニ受け取りを選んだんだね。"], ["A", "Oops. So what do I need to bring?", "しまった。じゃあ何を持っていけばいい？"], ["B", "Just the email with the barcode. Show it at the register.", "バーコード付きのメールだけ。レジで見せればいいよ。"], ["A", "That's it? No ID or anything?", "それだけ？身分証とかはいらないの？"], ["B", "Usually not. While we're there, you can pay your gas bill too.", "普通はいらないよ。ついでにガス代も払えるよ。"], ["A", "At a convenience store? Japan never stops surprising me.", "コンビニで？日本には驚かされてばかり。"], ["B", "Wait until you try the coffee machine. That's my favorite part.", "コーヒーマシンを試したらもっと驚くよ。僕の一番のお気に入り。"]], "q": {"1": ["エマの荷物はどこに届いた？", ["コンビニ", "アパート", "郵便局"]], "4": ["レジで何を見せる？", ["バーコード付きのメール", "パスポート", "レシート"]], "6": ["ケンはついでに何ができると言った？", ["ガス代を払う", "切手を買う", "写真を印刷する"]]}}, {"t": "鳥居の前で", "d": "ケンがエマに神社でのお参りの仕方を教える", "l": [["A", "There's a big red gate. So this is a shrine, right?", "大きな赤い門がある。ここは神社だよね？"], ["B", "Exactly. That's a torii. Temples don't usually have them.", "そのとおり。あれは鳥居。お寺には普通ないんだ。"], ["A", "What's everyone doing at that little fountain?", "みんなあの小さな水場で何してるの？"], ["B", "Rinsing their hands and mouths. It's a way to purify yourself.", "手と口をすすいでるんだ。身を清める作法だよ。"], ["A", "Okay, done. Now I just toss in a coin and pray?", "よし、できた。あとはお賽銭を入れてお祈りするだけ？"], ["B", "Bow twice, clap twice, make your wish, then bow once more.", "二回お辞儀、二回拍手、願い事をして、最後にもう一回お辞儀。"], ["A", "Twice, twice, once. I'll whisper it so I don't forget.", "二回、二回、一回。忘れないように小声で唱えるね。"], ["B", "Just don't clap at the temple next door. The manners differ there.", "でも隣のお寺では手をたたかないでね。作法が違うから。"]], "q": {"2": ["鳥居についてケンは何と言った？", ["お寺には普通ない", "お寺にしかない", "最近作られた"]], "4": ["水場で人々は何をしている？", ["手と口をすすいで清めている", "水を飲んで休んでいる", "お守りを洗っている"]], "8": ["隣のお寺で気をつけることは？", ["手をたたかない", "靴を脱がない", "写真を撮らない"]]}}, {"t": "年賀状を書く夜", "d": "十二月、はがきを書き続けるケンにエマが尋ねる", "l": [["A", "You've been writing postcards all evening. Who are they for?", "一晩中はがきを書いてるね。誰宛て？"], ["B", "Everyone. They're nengajo, New Year's cards for friends and coworkers.", "みんなだよ。年賀状っていう、友だちや同僚への新年のはがきなんだ。"], ["A", "But it's still December. That seems a little early.", "でもまだ十二月だよ。ちょっと早くない？"], ["B", "If I post them soon, they all arrive on New Year's Day.", "早めに出せば、全部元日に届くんだ。"], ["A", "That's clever. And why does each card have the same animal on it?", "うまくできてるね。それに、どうして全部のはがきに同じ動物が描いてあるの？"], ["B", "It's next year's zodiac animal. Each year has its own.", "来年の干支の動物なんだ。年ごとに決まってるんだよ。"], ["A", "So cute. Could I send you one, too?", "かわいい。私もケンに一枚送っていい？"], ["B", "Of course. Just add a handwritten line. That's what makes it special.", "もちろん。手書きでひとこと添えてね。それが特別なものにしてくれるんだ。"]], "q": {"2": ["ケンが書いているのは何？", ["年賀状", "クリスマスカード", "引っ越しの案内"]], "4": ["早めに出すとどうなる？", ["元日に届く", "料金が安くなる", "くじが当たる"]], "6": ["はがきに描かれている動物は何？", ["来年の干支の動物", "ケンのペット", "今年の干支の動物"]]}}, {"t": "うっかり「お母さん」", "d": "エマが料理教室の先生をうっかり「お母さん」と呼んでしまう", "l": [["A", "I did something so embarrassing at cooking class today.", "今日の料理教室で、すごく恥ずかしいことしちゃった。"], ["B", "Oh no. What happened? Did you burn something?", "あらら。どうしたの？何か焦がした？"], ["A", "Worse. I asked the teacher a question and called her Mom.", "もっとひどいの。先生に質問して「お母さん」って呼んじゃった。"], ["B", "Out loud? In front of everyone?", "声に出して？みんなの前で？"], ["A", "Yes. The whole room went quiet, then everyone burst out laughing.", "そう。部屋がしんとして、それからみんな大笑い。"], ["B", "How did the teacher take it?", "先生はどう受け止めたの？"], ["A", "She just smiled and said, \"Yes, dear?\" I wanted to disappear.", "にっこり笑って「なあに？」って。消えてしまいたかった。"], ["B", "Honestly, that's adorable. She probably loved it.", "正直、かわいい話だよ。先生もきっと喜んでたよ。"]], "q": {"1": ["エマはどこで恥ずかしい思いをした？", ["料理教室", "職場の会議", "英会話カフェ"]], "3": ["エマは先生を何と呼んだ？", ["お母さん", "おばあちゃん", "お姉さん"]], "7": ["先生の反応は？", ["笑って返事をした", "怒って黙った", "授業を中断した"]]}}, {"t": "中止になったライブ", "d": "楽しみにしていたライブが中止になり、二人で別の夜を考える", "l": [["B", "Did you see the email? The concert on Saturday is canceled.", "メール見た？土曜日のコンサート、中止だって。"], ["A", "You're kidding. I've been counting down the days for months.", "うそでしょ。何か月も前から指折り数えてたのに。"], ["B", "The singer lost her voice, apparently. They're sorry, of course.", "歌手の声が出なくなったらしい。もちろん謝ってたけど。"], ["A", "I'm so bummed. I even learned all the lyrics.", "すごくがっかり。歌詞まで全部覚えたんだよ。"], ["B", "At least they're giving everyone a full refund.", "少なくとも全員に全額返金してくれるって。"], ["A", "That helps a little. Any word on a new date?", "それはちょっと救いだね。振替の日程は出てる？"], ["B", "Not yet. But let's not waste Saturday night.", "まだ。でも土曜の夜を無駄にするのはやめよう。"], ["A", "Karaoke, then? I can still sing every song.", "じゃあカラオケは？全曲歌えるのは変わらないし。"]], "q": {"3": ["コンサートが中止になった理由は？", ["歌手の声が出なくなった", "会場が使えなくなった", "チケットが売れなかった"]], "5": ["チケット代はどうなる？", ["全額返金される", "半額だけ返金される", "返金されない"]], "8": ["エマは土曜の夜に何をしようと提案した？", ["カラオケ", "映画", "家で夕食"]]}}, {"t": "駅前の歌声", "d": "帰り道、ケンが駅前の路上ミュージシャンに心を動かされる", "l": [["B", "Hold on. Can we stop here for a minute?", "ちょっと待って。ここで少し止まってもいい？"], ["A", "Sure. Oh, that singer with the guitar? She's really good.", "いいよ。ああ、あのギターの歌手？すごく上手だね。"], ["B", "Her voice gives me chills. She sings like nobody's listening.", "声に鳥肌が立つよ。誰も聞いてないみたいに歌ってる。"], ["A", "You look like you're somewhere else entirely.", "どこか別の世界にいるみたいな顔してるよ。"], ["B", "I played guitar in college. I haven't touched it in years.", "大学でギターを弾いてたんだ。もう何年も触ってない。"], ["A", "Maybe tonight's the night to pick it back up.", "今夜がまた手に取るきっかけかもね。"], ["B", "Maybe. First, let's leave something in her case.", "かもね。まずは彼女のケースに何か入れていこう。"], ["A", "Good idea. And you're playing for me next weekend.", "いいね。それと、来週末は私のために弾いてもらうから。"]], "q": {"3": ["ケンは歌声を聞いてどうなった？", ["鳥肌が立った", "眠くなった", "耳をふさいだ"]], "5": ["ケンが大学時代にしていたことは？", ["ギターを弾いていた", "歌手として活動していた", "ピアノを習っていた"]], "8": ["エマはケンに何を頼んだ？", ["来週末にギターを弾くこと", "一緒に歌うこと", "チケットを買うこと"]]}}, {"t": "何もしない日曜日", "d": "予定のない日曜日、エマが満ち足りた気分でケンからの電話に出る", "l": [["B", "Hey, you sound sleepy. Did I wake you up?", " const AUD={},AUDL={};
ALL.concat(VARS).forEach(a=>AUD[a.en]=a.id);
STORIES.forEach((st,n)=>st.l.forEach((l,k)=>AUDL[l[1]]=`s${n}_${k}`));
UNITS.forEach((u,i)=>{u.r.forEach((r,k)=>AUDL[r[0]]=`r${i}_${k}`);if(u.c)u.c.t.forEach((t,k)=>AUDL[t[0]]=`c${i}_${k}`)});
let audOk=false,audFail=0,noAudio=false,enVoice=null;
function pickVoice(){ // 端末の読み上げを使う場合は、英語の声を明示的に選ぶ（日本語の声で英語を読ませない）
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const score=v=>(/^en[-_]US/i.test(v.lang)?4:0)+(/Samantha|Ava|Allison|Google US English|Aria|Jenny|Natural|Enhanced|Premium/i.test(v.name)?3:0)-(/compact|espeak/i.test(v.name)?3:0);
    enVoice=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){enVoice=null}
}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
let slowOnce=false; // 🐢ボタン：次の1回だけゆっくり再生
function tts(t){try{if(!enVoice)pickVoice();const u=new SpeechSynthesisUtterance(t);if(enVoice)u.voice=enVoice;u.lang=enVoice?enVoice.lang:"en-US";u.rate=slowOnce?.6:S.rate==="slow"?.7:.9;slowOnce=false;speechSynthesis.speak(u)}catch(e){}}
function speak(t,line){
  if(recState==="rec"||recState==="pending")return;
  try{player.pause();if(voice)voice.pause();speechSynthesis.cancel()}catch(e){}
  const key=line?AUDL[t]||AUD[t]:AUD[t]||AUDL[t];
  if(!key||!voice||noAudio)return tts(t);
  try{
    voice.src="audio/"+key+".mp3?v=4";voice.playbackRate=slowOnce?.7:S.rate==="slow"?.8:1;if(voice.preservesPitch!==undefined)voice.preservesPitch=true;slowOnce=false;
    const pr=voice.play();
    if(pr&&pr.then)pr.then(()=>{audOk=true},e=>{if(e&&e.name==="AbortError")return;if(e&&e.name==="NotAllowedError")return; // 途中で次の音声に切り替えた／自動再生が止められた
      audFail++;if(!audOk&&audFail>=2)noAudio=true;tts(t)}); // ファイルが無い環境では端末の読み上げに切り替える
  }catch(e){tts(t)}
}

function hello(nDue,next){const h=hello0(nDue,next);return S.nm&&Object.keys(S.rev).length?`${esc(S.nm)}さん、${h}`:h}
function hello0(nDue,next){ // 案内役のひとこと（学習の状況に合わせる）
  if(!Object.keys(S.rev).length)return "はじめまして。案内役のすずねです。最初の一歩を、いっしょに踏み出しましょう。";
  if(nDue)return `おかえりなさい。今日は${nDue}件、前に言えた文を確かめましょう。忘れかけた頃がいちばん身につきます。`;
  if(S.dayXp>=goal())return "今日の目標は達成です。よくがんばりましたね。続きは明日でも大丈夫ですよ。";
  if(next<0)return "すべての歩みを歩ききりましたね。6秒チャレンジで、口の速さを磨きましょう。";
  if(S.streak>=3)return `${S.streak}日連続ですね。その積み重ねが、いちばんの力になります。`;
  return "今日も3分だけ、声に出してみましょう。小さな一歩で十分です。";
}

  return [["first","🌒","最初の一歩","歩みを1つクリア",u>=1],["u5","🌓","五つの歩み","歩みを5つクリア",u>=5],["u10","🌔","十の歩み","歩みを10クリア",u>=10],["u20","🌕","二十の歩み","歩みを20クリア",u>=20],["u40","🌖","四十の歩み","歩みを40クリア",u>=40],["uall","🌝","満月",`全${UNITS.length}の歩みをクリア`,u>=UNITS.length],
    ["s3","🔥","三日つづけた","3日連続で学習",st>=3],["s7","🔥","一週間","7日連続で学習",st>=7],["s30","🔥","ひと月","30日連続で学習",st>=30],
    ["p50","📖","50の言葉","50文を学習",r>=50],["p100","📚","100の言葉","100文を学習",r>=100],["p160","🏛","160の言葉","160文を学習",r>=160],["p320","🏯","320の言葉","320文を学習",r>=320],["p480","🗻","480の言葉","480文を学習",r>=480],

function story(n){ // 1行ずつ読み進め、決まった所で理解クイズ

  let card="",foot="";

function importCode(code){ // 文字列から学習記録を読み込む。形が違うものは受け付けない

    if(!o||typeof o!=="object"||Array.isArray(o)||!o.rev||typeof o.rev!=="object"||!o.done||typeof o.done!=="object")throw 0;
    const ids=new Set(ALL.concat(VARS).map(a=>a.id)),n=BLANK();
    n.xp=Math.max(0,+o.xp||0);n.streak=Math.max(0,+o.streak||0);n.last=typeof o.last==="string"?o.last:"";
    UNITS.forEach((u,i)=>{if(+o.done[i]>0)n.done[i]=+o.done[i];if(o.talk&&+o.talk[i]>0)n.talk[i]=+o.talk[i]});
    Object.keys(o.rev).forEach(k=>{const r=o.rev[k];if(ids.has(k)&&r&&/^\d{4}-\d\d-\d\d$/.test(r.due))n.rev[k]={step:Math.min(4,Math.max(0,+r.step||0)),due:r.due}});

}

function start(mode,unit){

    const rs=shuffle(UNITS[unit].r).slice(0,2),ph=shuffle(ALL.filter(a=>a.u===unit&&!rs.some(r=>r[1]===a.j)));let pi=0,ri=0; // 会話2文＋残り6文＝8文を一度ずつ

    const vs=shuffle(VARS.filter(v=>v.u===unit));if(vs[0])q.push({p:vs[0],type:"flash"});
    q.push({p:q[0].p,type:"cloze"}); // 最初に意味を見た文を、穴埋めで思い出す
    q.splice(5,0,{p:ph[0],type:"match",unit}); // 途中の息抜き：英語と意味のペア合わせ

    const c=UNITS[unit].c;

      :shuffle(UNITS[unit].r).slice(0,3).map(r=>({p:ALL.find(a=>a.u===unit&&a.j===r[1]),type:"flash",line:r[0],sit:r[2],hear:true}));
  }else if(mode==="review"){

function setup(q){

  const others=f=>{const seen=new Set([q.p.en,q.p.ja]);return shuffle(ALL.filter(a=>a.id!==q.p.id&&f(a))).filter(a=>{if(seen.has(a.en)||seen.has(a.ja))return false;seen.add(a.en);seen.add(a.ja);return true}).slice(0,2)}; // 同じ文・同じ訳が選択肢に重ならないように
  if(q.type==="match"){const ps=shuffle(ALL.filter(a=>a.u===q.unit)).slice(0,4);q.cards=[shuffle(ps).map(a=>({id:a.id,t:a.en,e:1})),shuffle(ps).map(a=>({id:a.id,t:a.ja}))];q.fin={};q.msel=null;q.bad=null}

  if(c.e)speak(c.t);
  if(!q.msel||q.msel[0]===side){q.msel=[side,n];return draw()}
  const o=q.cards[q.msel[0]][q.msel[1]];
  if(o.id===c.id){q.fin[c.id]=1;q.msel=null;sfx(true,Object.keys(q.fin).length);if(Object.keys(q.fin).length===4)return grade(true);return draw()}

}

  else if(L&&L.mode==="story"&&"sl" in d){speak(STORIES[L.n].l[+d.sl][1],1);(L.rv=L.rv||{})[+d.sl]=1;sdraw()}
  else if(L&&L.mode==="story"&&"sn" in d){L.k++;speak(STORIES[L.n].l[L.k-1][1],1);sdraw()}
  else if(L&&L.mode==="story"&&"so" in d){const k=L.k;if(!L.ans[k]){const ok=+d.so===0;L.ans[k]={sel:+d.so};L.total++;if(ok)L.right++;sfx(ok);try{navigator.vibrate&&navigator.vibrate(ok?12:[30,40,30])}catch(e){}sdraw()}}
  else if(L&&L.mode==="story"&&"send" in d)send();
  else if("weak" in d)start("weak");
  else if("dict" in d)start("dict");
  else if("talkr" in d){const du=UNITS.map((u,i)=>i).filter(i=>S.done[i]);if(du.length)start("talk",du[Math.random()*du.length|0])}
  else if("buy" in d){if((S.gem||0)>=50&&(S.frz||0)<2){S.gem-=50;S.frz=(S.frz||0)+1;save()}stats()}
  else if("home" in d||"quit" in d)home();
  else if("book" in d)book();
  else if("stats" in d)stats();
  else if("settings" in d){askReset=false;settings()}
  else if("intro" in d)intro(+d.intro);
  else if("igoal" in d){S.goal=+d.igoal;save();intro(PAGES.length-1)}
  else if("introdone" in d){S.seen=1;save();home()}
  else if("set" in d){const k=d.set.split(":")[0],v=d.set.slice(k.length+1);S[k]=k==="sfx"||k==="stja"?v==="true":k==="goal"?+v:v;save();applyFs();settings()}
  else if("nm" in d){const e=document.getElementById("nm");S.nm=(e&&e.value||"").trim().slice(0,12);save();setMsg=S.nm?"呼び名を保存しました。":"呼び名を消しました。";settings()}
  else if("here" in d){const e=document.querySelector(".orb.new");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})}
  else if("hearsample" in d)speak("Nice to meet you.");
  else if("ics" in d){const e=document.getElementById("rt"),t=/^\d\d:\d\d$/.test(e&&e.value)?e.value:"20:00";S.rt=t;save();
    const dt=day(0).replace(/-/g,"")+"T"+t.replace(":","")+"00",u=(location.protocol.startsWith("http")&&!/claude|anthropic/.test(location.host))?location.href.split("#")[0]:"https://don3nasu-glitch.github.io/moonstep-english/";
    const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Moonstep English//JA","BEGIN:VEVENT","UID:moonstep-daily-"+Date.now()+"@moonstep","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+dt,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:🌙 月の歩み（英会話）","DESCRIPTION:すずねが待っています。今日の一歩を進めましょう。","URL:"+u,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:英会話の時間です","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
    try{const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);a.download="moonstep-reminder.ics";document.body.appendChild(a);a.click();a.remove();setMsg="カレンダー用のファイルを開きました。追加すると、毎日 "+t+" に通知が届きます。"}catch(x){setMsg="この環境ではカレンダーに追加できませんでした。"}settings()}
  else if("copy" in d){
    const sel=()=>{const x=document.getElementById("exp");if(x){x.focus();x.select()}};
    const fail=()=>{setMsg="自動でコピーできませんでした。文字列を選択したので、そのままコピーしてください。";settings();sel()};
    try{navigator.clipboard.writeText(document.getElementById("exp").value).then(()=>{setMsg="コピーしました。";settings()},fail)}catch(e){fail()}
  }
  else if("import" in d){if(importCode(document.getElementById("imp").value))setMsg="学習記録を読み込みました。";else setErr="読み込めませんでした。文字列が途中で切れていないか確かめてください。";settings()}
  else if("reset" in d){askReset=true;settings()}
  else if("resetno" in d){askReset=false;settings()}
  else if("resetyes" in d){S=Object.assign(BLANK(),{rate:S.rate,sfx:S.sfx,goal:S.goal,seen:1});roll();save();askReset=false;setMsg="学習記録を消しました。";settings()}
  else if("hear" in d){const a=ALL.concat(VARS).find(a=>a.id===d.hear);if(a)speak(a.en)}
  else if("say" in d)(slowOnce=d.say==="slow",q.line&&!q.done&&!q.open?speak(q.line,1):speak(q.p.en));
  else if("go" in d)show();
  else if("next" in d){L.i++;show()}
  else if(q.done)return;
  else if("reveal" in d)reveal();
  else if("m" in d){const a=d.m.split(":");pickM(+a[0],+a[1])}
  else if("opt" in d){q.sel=+d.opt;draw()}
  else if("tile" in d){q.pick.push(+d.tile);draw()}
  else if("un" in d){q.pick.splice(+d.un,1);draw()}
  else if("check" in d&&q.type==="write"){const e=document.getElementById("wr");q.text=e&&e.value||"";grade(wn(q.text)===wn(q.p.en))}
  else if("check" in d)grade(q.opts?q.opts[q.sel].id===q.p.id:norm(q.pick.map(k=>q.tiles[k]).join(" "))===norm(q.p.en));
  else if("self" in d)grade(d.self==="1");
  else if("sr" in d)srStart();
  else if("rec" in d)recStart();
  else if("recstop" in d)recStop(true);
  else if("recplay" in d)recPlay();
});
function applyFs(){try{document.documentElement.style.fontSize=S.fs==="l"?"18px":""}catch(e){}}applyFs();
(S.seen||S.xp>0||Object.keys(S.done).length)?home():intro(0);
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
