  ["p2345", "I'd like to report a theft.", "盗難を届けたいです。"],["p2346", "My bike was stolen.", "自転車が盗まれました。"],["p2347", "It was locked outside the station.", "駅の外に鍵をかけて停めていました。"],["p2348", "It's a blue bike with a basket.", "かごのついた青い自転車です。"],["p2349", "I noticed it this morning.", "今朝気づきました。"],["p2350", "Do you need the serial number?", "製造番号は必要ですか？"],["p2351", "Will you contact me if you find it?", "見つかったら連絡してもらえますか？"],["p2352", "Could I get a copy of the report?", "届出の控えをもらえますか？"]],
  r:[["Good afternoon. What happened?", 1],["Can you describe it?", 3],["When did you notice it was gone?", 4]],
  c:{sit:"交番で盗難を届ける",t:[["Hello. How can I help you?", 0],["I'm sorry to hear that. What was taken?", 1],["Okay. Where did you leave it?", 2]]}},
 {t:"第二百九十五歩 助けを申し出る",d:"具合の悪い人に声をかける",p:[
  ["p2353", "Are you all right?", "大丈夫ですか？"],["p2354", "Do you need some help?", "手伝いましょうか？"],["p2355", "Here, sit down for a minute.", "ちょっと座ってください。"],["p2356", "Do you want some water?", "お水飲みますか？"],["p2357", "Should I call an ambulance?", "救急車を呼びましょうか？"],["p2358", "Is there someone I can call for you?", "だれか連絡できる人はいますか？"],["p2359", "Take your time.", "ゆっくりでいいですよ。"],["p2360", "I'll stay with you until help arrives.", "助けが来るまで一緒にいます。"]],
  r:[["I feel dizzy…", 2],["I think I'm okay now, but my phone is dead.", 5],["The ambulance is on its way. You don't have to wait.", 7]],
  c:{sit:"駅のホームで座りこむ人を見かける",t:[["Oh… I feel a little sick.", 0],["Not really. I need to sit down.", 2],["Sorry, I'll get up in just a moment.", 6]]}},
 {t:"第二百九十六歩 ペットを迎える",d:"ペットを飼い始める",p:[
  ["p2361", "We just adopted a puppy.", "子犬を迎えたばかりです。"],["p2362", "We got her from a shelter.", "保護施設から引き取りました。"],["p2363", "She's still getting used to the house.", "まだ家に慣れているところです。"],["p2364", "I'm training her to sit.", "お座りの練習をしています。"],["p2365", "She chewed my shoes again.", "また靴をかじられました。"],["p2366", "Can I pet your dog?", "あなたの犬をなでてもいいですか？"],["p2367", "How old is he?", "何歳ですか？"],["p2368", "Having a pet changed my life.", "ペットを飼って人生が変わりました。"]],
  r:[["Oh, a new dog? So cute!", 0],["Where did you find her?", 1],["How is she at home?", 4]],
  c:{sit:"散歩中に近所の人と話す",t:[["What a cute puppy! Is she yours?", 0],["She's so calm. Does she listen to you?", 3],["Well, puppies are always chewing things.", 4]]}},
 {t:"第二百九十七歩 味の好み",d:"料理の味を細かく頼む",p:[
  ["p2369", "Could you make it less spicy?", "辛さを控えめにできますか？"],["p2370", "Extra spicy, please.", "激辛でお願いします。"],["p2371", "No onions, please.", "玉ねぎ抜きでお願いします。"],["p2372", "Could I have the sauce on the side?", "ソースは別にしてもらえますか？"],["p2373", "Is it very salty?", "塩辛いですか？"],["p2374", "Could you add a little more salt?", "もう少し塩を足してもらえますか？"],["p2375", "I'd like it well done.", "よく焼いてください。"],["p2376", "It's just right.", "ちょうどいいです。"]],
  r:[["This dish is quite spicy. Is that okay with you?", 0],["How would you like your steak?", 6],["How does it taste?", 7]],
  c:{sit:"タイ料理店で注文する",t:[["Our curry is very spicy. Is that okay?", 0],["Of course. Anything else?", 2],["Your noodles come with a peanut sauce.", 3]]}},
 {t:"第二百九十八歩 キャンセル規定",d:"予約のキャンセル規定を確認する",p:[
  ["p2377", "What's your cancellation policy?", "キャンセル規定はどうなっていますか？"],["p2378", "Is it free to cancel?", "無料でキャンセルできますか？"],["p2379", "What's the deadline to cancel?", "いつまでキャンセルできますか？"],["p2380", "Will I get a full refund?", "全額返金されますか？"],["p2381", "Can I change the date instead?", "かわりに日付を変更できますか？"],["p2382", "I need to cancel my booking.", "予約をキャンセルしなければなりません。"],["p2383", "Could you confirm the cancellation by email?", "キャンセルをメールで確認していただけますか？"],["p2384", "I understand. Thanks for explaining.", "わかりました。説明ありがとうございます。"]],
  r:[["You can cancel for free until three days before.", 3],["Sorry, it's too late for a refund.", 4],["Okay, your booking is canceled.", 6]],
  c:{sit:"ホテルに電話して予約について聞く",t:[["Hello, Grand Hotel. How can I help?", 0],["You can cancel for free until two days before.", 3],["Yes, as long as you cancel in time.", 4]]}},
 {t:"第二百九十九歩 サプライズ",d:"誕生日サプライズを計画する",p:[
  ["p2385", "Let's throw her a surprise party.", "彼女にサプライズパーティーを開こう。"],["p2386", "Don't tell her anything.", "彼女には何も言わないでね。"],["p2387", "I'll keep her busy until seven.", "七時まで彼女を引きとめておくね。"],["p2388", "Who's bringing the cake?", "ケーキはだれが持ってくる？"],["p2389", "Turn off the lights. She's coming!", "電気を消して。来たよ！"],["p2390", "Happy birthday, Lisa!", "誕生日おめでとう、リサ！"],["p2391", "Did you have any idea?", "まったく気づいてなかった？"],["p2392", "We wanted to make your day special.", "特別な日にしたかったんだ。"]],
  r:[["Lisa's birthday is next Friday. Any ideas?", 0],["I'm so bad at keeping secrets.", 1],["Wow! I can't believe you did all this!", 7]],
  c:{sit:"友人たちとサプライズを計画する",t:[["It's Mia's birthday on Saturday!", 0],["Great idea! But how do we keep it a secret?", 2],["Quick! I hear her at the door!", 4]]}},
 {t:"第三百歩 三百の歩み",d:"ここまでを祝う",p:[
  ["p2393", "Three hundred steps! I can't believe it.", "三百歩！信じられない。"],["p2394", "I remember my very first lesson.", "最初のレッスンを覚えています。"],["p2395", "Back then, I couldn't say a word.", "あのころは一言も言えませんでした。"],["p2396", "Now I can talk about almost anything.", "今ではほとんど何でも話せます。"],["p2397", "It was worth every minute.", "費やした時間すべてに価値がありました。"],["p2398", "Thank you for walking beside me.", "となりを歩いてくれてありがとう。"],["p2399", "Let's keep going.", "進み続けよう。"],["p2400", "The moon is still waiting.", "月はまだ待っています。"]],
  r:[["Do you remember how you started?", 1],["How has your English changed?", 3],["So, are you going to stop here?", 6]],
  c:{sit:"英会話の先生と三百歩をふり返る",t:[["Three hundred steps. How do you feel?", 0],["What was it like at the beginning?", 2],["And now?", 3]]}},
 {t:"第三百一歩 ネット通販の返品",d:"ネットで買った物を返品する",p:[
  ["p2401", "The item arrived damaged.", "商品が壊れて届きました。"],["p2402", "It's not what I ordered.", "注文したものとちがいます。"],["p2403", "I'd like to start a return.", "返品手続きを始めたいです。"],["p2404", "Do I need to print the label?", "ラベルを印刷する必要がありますか？"],["p2405", "Who pays for return shipping?", "返送料はだれが払いますか？"],["p2406", "Can I drop it off at a store?", "店舗に持ち込めますか？"],["p2407", "When will I get my money back?", "いつ返金されますか？"],["p2408", "I've attached a photo of the damage.", "破損の写真を添付しました。"]],
  r:[["What's wrong with your order?", 0],["Can you show us the problem?", 7],["We'll send you a free return label.", 3]],
  c:{sit:"通販サイトのチャットで問い合わせる",t:[["Hello! How can I help you today?", 0],["I'm so sorry. Can you send us a picture?", 7],["Got it. You can return it for free.", 3]]}},
 {t:"第三百二歩 ポッドキャスト",d:"好きな番組を紹介する",p:[
  ["p2409", "I listen to podcasts on my way to work.", "通勤中にポッドキャストを聞いています。"],["p2410", "This one is about history.", "これは歴史の番組です。"],["p2411", "The hosts are really funny.", "司会の人たちがすごくおもしろいです。"],["p2412", "Each episode is about twenty minutes.", "一回は二十分くらいです。"],["p2413", "It's great for listening practice.", "リスニングの練習にぴったりです。"],["p2414", "I'll send you the link.", "リンクを送りますね。"],["p2415", "Have you heard of it?", "聞いたことありますか？"],["p2416", "I've learned so much from it.", "それからたくさん学びました。"]],
  r:[["What do you do on the train?", 0],["Can a learner understand it?", 4],["I'd like to try it.", 5]],
  c:{sit:"同僚とおすすめの番組の話をする",t:[["You always have earphones in. What are you listening to?", 0],["Cool. What kind of show is it?", 1],["Sounds interesting. Can you send it to me?", 5]]}},
 {t:"第三百三歩 茶道体験",d:"日本文化の体験を案内する",p:[
  ["p2417", "This is a traditional tea ceremony.", "これは伝統的な茶道です。"],["p2418", "Please sit like this.", "このように座ってください。"],["p2419", "Turn the bowl twice before you drink.", "飲む前に茶わんを二回回します。"],["p2420", "It's okay if your legs hurt.", "足が痛くなっても大丈夫ですよ。"],["p2421", "The sweets go well with the bitter tea.", "お菓子は苦いお茶によく合います。"],["p2422", "Take a moment to enjoy the quiet.", "静けさを味わってみてください。"],["p2423", "Each movement has a meaning.", "一つひとつの動作に意味があります。"],["p2424", "How did you like it?", "いかがでしたか？"]],
  r:[["What is this event?", 0],["Why do you turn the bowl?", 6],["My legs are falling asleep!", 3]],
  c:{sit:"海外の友人を茶道体験に連れて行く",t:[["Where are we? It's so quiet.", 0],["Okay, I'm sitting. What do I do now?", 2],["My legs hurt a little.", 3]]}},
 {t:"第三百四歩 雨の日の観光",d:"雨で観光の予定を変える",p:[
  ["p2425", "It's pouring outside.", "外はどしゃ降りです。"],["p2426", "Let's go to a museum instead.", "かわりに博物館に行こう。"],["p2427", "Maybe it'll clear up this afternoon.", "午後には晴れるかもしれないね。"],["p2428", "We can go to the tower tomorrow.", "タワーは明日行けるよ。"],["p2429", "Let's buy some umbrellas.", "傘を買おう。"],["p2430", "There's a great indoor market nearby.", "近くにすてきな屋内市場があります。"],["p2431", "Rainy days have their own charm.", "雨の日には雨の日のよさがあります。"],["p2432", "Let's take it easy today.", "今日はのんびりしよう。"]],
  r:[["Oh no, look at the rain. What now?", 1],["The weather report says the rain will stop later.", 2],["I'm a little tired from walking yesterday.", 7]],
  c:{sit:"旅行中の雨の朝",t:[["Look outside. It's raining so hard.", 1],["Good idea. But I really wanted to see the tower.", 3],["Okay. Let's just relax today.", 6]]}},
 {t:"第三百五歩 送別のあいさつ",d:"送別会であいさつをする",p:[
  ["p2433", "I can't believe this is my last day.", "今日が最後の日だなんて信じられません。"],["p2434", "I've learned so much here.", "ここでたくさん学びました。"],["p2435", "You've all been so kind to me.", "みなさん、とても親切にしてくださいました。"],["p2436", "I'll never forget my time here.", "ここでの時間は決して忘れません。"],["p2437", "Please keep in touch.", "これからも連絡を取り合いましょう。"],["p2438", "If you're ever in Japan, let me know.", "日本に来ることがあれば知らせてください。"],["p2439", "This isn't goodbye. It's see you later.", "さよならじゃなくて、またね、です。"],["p2440", "Thank you for everything.", "本当にいろいろありがとうございました。"]],
  r:[["We're going to miss you so much.", 2],["Will you come back to visit?", 6],["Do you have any final words?", 7]],
  c:{sit:"職場の送別会で",t:[["Come on, give us a speech!", 0],["We'll really miss you.", 2],["Any last words?", 7]]}},
 {t:"第三百六歩 トレーナー",d:"パーソナルトレーナーと話す",p:[
  ["p2441", "I want to get stronger.", "もっと強くなりたいです。"],["p2442", "I have a bad knee.", "ひざが悪いんです。"],["p2443", "How many sets should I do?", "何セットやればいいですか？"],["p2444", "Can you check my form?", "フォームを見てもらえますか？"],["p2445", "I need a short break.", "少し休憩が必要です。"],["p2446", "That was tough, but I did it.", "きつかったけど、やりきりました。"],["p2447", "What should I eat after training?", "トレーニングのあとは何を食べればいいですか？"],["p2448", "See you next week.", "また来週。"]],
  r:[["So, what's your goal?", 0],["Any injuries I should know about?", 1],["Great job today! How do you feel?", 5]],
  c:{sit:"ジムでトレーナーと初回の面談",t:[["Hi, I'm Mike. What brings you here?", 0],["Good. Before we start, any health problems?", 1],["Okay, let's go easy on your legs today.", 2]]}},
 {t:"第三百七歩 ヨガ",d:"ヨガ教室に参加する",p:[
  ["p2449", "This is my first yoga class.", "ヨガのクラスは初めてです。"],["p2450", "I'm not very flexible.", "体はあまりやわらかくありません。"],["p2451", "Can I use one of your mats?", "マットを一枚借りてもいいですか？"],["p2452", "I can't reach my toes.", "つま先に手が届きません。"],["p2453", "Breathe in, breathe out.", "吸って、吐いて。"],["p2454", "I feel so relaxed now.", "今とてもリラックスしています。"],["p2455", "Is there a beginner class?", "初心者クラスはありますか？"],["p2456", "I'll come again on Thursday.", "木曜日にまた来ます。"]],
  r:[["Hi! Have you done yoga before?", 0],["Don't worry if you can't do every pose.", 1],["How was the class?", 5]],
  c:{sit:"ヨガ教室の受付で",t:[["Hello! Is this your first time here?", 0],["No problem. Everyone starts somewhere.", 2],["Here you go. Just move at your own pace today.", 1]]}},
 {t:"第三百八歩 スキー場",d:"スキー場で道具を借りる",p:[
  ["p2457", "I'd like to rent skis for the day.", "一日スキーを借りたいです。"],["p2458", "My boot size is twenty-six.", "ブーツのサイズは二十六です。"],["p2459", "These boots are too tight.", "このブーツはきつすぎます。"],["p2460", "Where can I buy a lift ticket?", "リフト券はどこで買えますか？"],["p2461", "Which slope is for beginners?", "どのコースが初心者向けですか？"],["p2462", "I keep falling down.", "何度も転んでしまいます。"],["p2463", "Can I take a lesson?", "レッスンを受けられますか？"],["p2464", "The view from the top is amazing.", "山頂からの眺めはすごいです。"]],
  r:[["Good morning. Are you renting skis or a snowboard?", 0],["How do the boots feel?", 2],["How's your first day going?", 5]],
  c:{sit:"レンタルショップで",t:[["What can I do for you?", 0],["Sure. What's your boot size?", 1],["Try these on. How do they feel?", 2]]}},
 {t:"第三百九歩 ビーチ",d:"海辺で過ごす",p:[
  ["p2465", "Did you bring sunscreen?", "日焼け止め持ってきた？"],["p2466", "The water is a little cold.", "水は少し冷たいね。"],["p2467", "Let's swim out to the rock.", "岩まで泳いでいこう。"],["p2468", "Watch out for the waves.", "波に気をつけて。"],["p2469", "I'm getting a sunburn.", "日焼けしてきちゃった。"],["p2470", "Let's rent an umbrella.", "パラソルを借りよう。"],["p2471", "Let's watch the sunset here.", "ここで夕日を見よう。"],["p2472", "I could stay here forever.", "ずっとここにいられそう。"]],
  r:[["The sun is really strong today.", 0],["My shoulders are turning red.", 5],["It's getting late. Should we go?", 6]],
  c:{sit:"友人と海水浴に来る",t:[["What a perfect beach day!", 0],["Ouch, the sun is so hot.", 5],["Look, the sky is turning orange.", 6]]}},
 {t:"第三百十歩 星空の下で",d:"夜空の下で将来を語る",p:[
  ["p2473", "Look at all those stars.", "見て、あんなにたくさんの星。"],["p2474", "Do you ever think about the future?", "将来のことを考えることってある？"],["p2475", "I want to live abroad someday.", "いつか海外で暮らしたいな。"],["p2476", "I'm not sure what I want yet.", "まだ何がしたいかわからない。"],["p2477", "Whatever happens, I'll be okay.", "何があっても大丈夫だと思う。"],["p2478", "I'm glad we had this talk.", "この話ができてよかった。"],["p2479", "Let's meet here again in ten years.", "十年後にまたここで会おう。"],["p2480", "Make a wish!", "願いごとをして！"]],
  r:[["Hey, a shooting star!", 7],["Where do you see yourself in ten years?", 3],["It's getting cold. Let's go back.", 5]],
  c:{sit:"キャンプの夜に友人と話す",t:[["It's so quiet out here.", 0],["Yeah. Do you know what you want to do?", 3],["Same here, honestly. But we'll figure it out.", 4]]}},
 {t:"第三百十一歩 水族館",d:"水族館を楽しむ",p:[
  ["p2481", "When is the dolphin show?", "イルカショーは何時ですか？"],["p2482", "Look, there's a sea turtle!", "見て、ウミガメ！"],["p2483", "This tunnel is like being underwater.", "このトンネル、海の中にいるみたい。"],["p2484", "Can we touch the starfish?", "ヒトデにさわれますか？"],["p2485", "What do penguins eat?", "ペンギンは何を食べるの？"],["p2486", "Let's sit in the front row.", "最前列に座ろう。"],["p2487", "We might get wet!", "ぬれるかもね！"],["p2488", "Let's buy a souvenir at the gift shop.", "ギフトショップでおみやげを買おう。"]],
  r:[["The show starts in ten minutes.", 5],["Look, there are starfish in this pool.", 3],["Look, the dolphins are splashing a lot!", 6]],
  c:{sit:"水族館で友人と見て回る",t:[["Where should we go first?", 0],["We still have time. Let's look at the turtles.", 1],["Okay, the show is starting. Let's find seats.", 5]]}},
 {t:"第三百十二歩 遊園地",d:"遊園地で遊ぶ",p:[
  ["p2489", "Let's ride the roller coaster first.", "まずジェットコースターに乗ろう。"],["p2490", "How long is the wait?", "待ち時間はどのくらい？"],["p2491", "I'm scared of heights.", "高い所がこわいんです。"],["p2492", "That was so much fun!", "すごく楽しかった！"],["p2493", "Let's do it again!", "もう一回乗ろう！"],["p2494", "I feel a little dizzy.", "ちょっと目が回る。"],["p2495", "Let's take a break and get some food.", "休憩して何か食べよう。"],["p2496", "Let's end with the Ferris wheel.", "最後は観覧車にしよう。"]],
  r:[["Wow, look at that line for the roller coaster.", 1],["Want to try the big drop ride?", 2],["That ride spun us around so much!", 5]],
  c:{sit:"遊園地の入口で",t:[["We're here! What should we ride first?", 0],["Oh no, the line is so long.", 1],["That ride was crazy. Want to go again?", 4]]}},
 {t:"第三百十三歩 ボウリング",d:"ボウリングで遊ぶ",p:[
  ["p2497", "What size shoes do you wear?", "靴のサイズはいくつ？"],["p2498", "This ball is too heavy for me.", "このボールはわたしには重すぎる。"],["p2499", "Strike! I did it!", "ストライク！やった！"],["p2500", "I got a gutter ball again.", "またガターだ。"],["p2501", "Nice shot!", "ナイスショット！"],["p2502", "Who's winning?", "だれが勝ってる？"],["p2503", "One more game?", "もう一ゲームやる？"],["p2504", "I'll beat you next time.", "次は勝つからね。"]],
  r:[["All ten pins! How did you do that?", 2],["Oh no. It went right into the side.", 3],["I won by just two points!", 7]],
  c:{sit:"友人とボウリング場で",t:[["Do you want this ball?", 1],["Okay, try this lighter one.", 2],["No way! You beat me this game.", 6]]}},
 {t:"第三百十四歩 カラオケ",d:"カラオケで歌う",p:[
  ["p2505", "What song do you want to sing?", "何の曲を歌いたい？"],["p2506", "You go first.", "先に歌って。"],["p2507", "I'm a terrible singer.", "歌はすごく下手なんです。"],["p2508", "Let's sing this together.", "これ一緒に歌おう。"],["p2509", "You have a great voice!", "いい声してるね！"],["p2510", "Can you turn the volume down?", "音量を下げてくれる？"],["p2511", "Let's extend for thirty minutes.", "三十分延長しよう。"],["p2512", "My throat hurts from singing.", "歌いすぎてのどが痛い。"]],
  r:[["Okay, who wants to sing first?", 1],["Come on, it's your turn!", 2],["Our time is almost up.", 6]],
  c:{sit:"同僚とカラオケに行く",t:[["Okay, the room is ours for one hour!", 0],["Oh, I love this song! Should I go first?", 1],["That was fun! What should we sing next?", 3]]}},
 {t:"第三百十五歩 料理コンテスト",d:"料理コンテストに出る",p:[
  ["p2513", "I entered a cooking contest.", "料理コンテストに出ました。"],["p2514", "We had one hour to cook.", "調理時間は一時間でした。"],["p2515", "My hands were shaking.", "手がふるえていました。"],["p2516", "The judges said it was creative.", "審査員は独創的だと言ってくれました。"],["p2517", "I didn't win, but I learned a lot.", "優勝はしなかったけど、たくさん学びました。"],["p2518", "Next year, I'll try a dessert.", "来年はデザートに挑戦します。"],["p2519", "Everyone's food looked amazing.", "みんなの料理がすごくおいしそうでした。"],["p2520", "I'm proud I took part.", "参加したことを誇りに思います。"]],
  r:[["So, how did the contest go?", 4],["Were you nervous?", 2],["What will you make next time?", 5]],
  c:{sit:"コンテストのあと家族と話す",t:[["How did it go?", 4],["What did the judges say?", 3],["So, will you try again?", 5]]}},
 {t:"第三百十六歩 祭りの準備",d:"地域の祭りの準備を手伝う",p:[
  ["p2521", "Can I help with anything?", "何か手伝えることはありますか？"],["p2522", "Where should I put these chairs?", "このいすはどこに置けばいいですか？"],["p2523", "I can carry the heavy boxes.", "重い箱を運べます。"],["p2524", "Should I hang these lanterns?", "この提灯を飾ればいいですか？"],["p2525", "We need more hands over here.", "こっちに人手が必要です。"],["p2526", "Let's take a quick break.", "少し休憩しましょう。"],["p2527", "It looks beautiful now.", "すてきになりましたね。"],["p2528", "I'm glad I could help.", "お手伝いできてよかったです。"]],
  r:[["We're short on volunteers today.", 0],["These lanterns go along the street.", 3],["We finished early because of you!", 7]],
  c:{sit:"町内会の人と祭りの準備をする",t:[["Oh, are you here to help?", 0],["Great. Could you set up the chairs?", 1],["Over by the stage. That's the last job. You were a big help!", 7]]}},
 {t:"第三百十七歩 迷子",d:"迷子の子どもを助ける",p:[
  ["p2529", "Are you lost?", "迷子になったの？"],["p2530", "What's your name?", "お名前は？"],["p2531", "Who did you come with?", "だれと来たの？"],["p2532", "Let's go find your mom together.", "一緒にお母さんを探そう。"],["p2533", "Don't worry, you're safe.", "心配しないで、大丈夫だよ。"],["p2534", "Let's ask the staff for help.", "スタッフの人に助けてもらおう。"],["p2535", "Can you describe your mom?", "お母さんはどんな人？"],["p2536", "Look, there she is!", "ほら、あそこにいるよ！"]],
  r:[["I can't find my mommy…", 4],["She has a red bag and long hair.", 5],["I think I see my mommy's red bag!", 7]],
  c:{sit:"ショッピングモールで泣いている子を見つける",t:[["I can't find my mommy…", 3],["I looked everywhere, but I can't see her.", 5],["I think I hear my mommy calling me!", 7]]}},
 {t:"第三百十八歩 落とし物を届ける",d:"拾った物を届ける",p:[
  ["p2537", "I found this wallet on the street.", "道でこの財布を拾いました。"],["p2538", "It was near the bus stop.", "バス停の近くにありました。"],["p2539", "I didn't open it.", "中は開けていません。"],["p2540", "Should I fill out a form?", "用紙に記入したほうがいいですか？"],["p2541", "I hope the owner gets it back.", "持ち主のもとに戻るといいのですが。"],["p2542", "Excuse me, did you drop this?", "すみません、これを落としましたか？"],["p2543", "No need to thank me.", "お礼なんていいですよ。"],["p2544", "Anyone would have done the same.", "だれでも同じことをしたはずです。"]],
  r:[["Hello. How can we help you?", 0],["Where exactly did you find it?", 1],["Oh, my keys! Thank you so much!", 6]],
  c:{sit:"駅の窓口に財布を届ける",t:[["Hello. What can I do for you?", 0],["Got it. Did you look inside?", 2],["We'll contact the owner right away.", 4]]}},
 {t:"第三百十九歩 夜行バス",d:"夜行バスで移動する",p:[
  ["p2545", "Is this the bus to Osaka?", "これは大阪行きのバスですか？"],["p2546", "Where can I put my suitcase?", "スーツケースはどこに置けますか？"],["p2547", "Do you mind if I recline?", "座席を倒してもいいですか？"],["p2548", "Could you close the curtain?", "カーテンを閉めてもらえますか？"],["p2549", "How long is the rest stop?", "休憩はどのくらいですか？"],["p2550", "I couldn't sleep at all.", "全然眠れませんでした。"],["p2551", "We're arriving early.", "早めに着きそうです。"],["p2552", "I'll take the train next time.", "次は電車にします。"]],
  r:[["You can't bring that big suitcase on board.", 1],["We'll take a rest stop here.", 4],["Good morning! How was your night?", 5]],
  c:{sit:"夜行バスに乗って目的地へ",t:[["Tickets, please. Where are you going?", 0],["Yes, this is the right bus. Any bags?", 1],["Good morning! Did you sleep well?", 5]]}},
 {t:"第三百二十歩 旅の作戦会議",d:"友人と旅の計画を立てる",p:[
  ["p2553", "Where should we go this summer?", "この夏はどこに行こうか？"],["p2554", "How about somewhere by the sea?", "海の近くはどう？"],["p2555", "Let's set a budget first.", "まず予算を決めよう。"],["p2556", "I'll look up flights tonight.", "今夜飛行機を調べるね。"],["p2557", "Should we stay in a hotel or a guesthouse?", "ホテルとゲストハウス、どっちに泊まる？"],["p2558", "Let's not plan every minute.", "全部の時間を予定で埋めるのはやめよう。"],["p2559", "I'll make a shared list.", "共有リストを作るね。"],["p2560", "I can't wait!", "待ちきれない！"]],
  r:[["I have a week off in August!", 0],["How much can we spend?", 2],["So, it's decided. Okinawa in August!", 7]],
  c:{sit:"カフェで友人と旅の計画を立てる",t:[["So, about our trip. Any ideas?", 1],["I love that! But what about money?", 2],["Okay. I'll check hotels then.", 3]]}},
 {t:"第三百二十一歩 納豆に挑戦",d:"友人に日本の食べ物をすすめる",p:[
  ["p2561", "Have you ever tried natto?", "納豆を食べたことある？"],["p2562", "It's fermented soybeans.", "発酵させた大豆だよ。"],["p2563", "It's a bit sticky.", "ちょっとねばねばしてるよ。"],["p2564", "Mix it well first.", "まずよく混ぜてね。"],["p2565", "Most people either love it or hate it.", "好きか嫌いか、はっきり分かれるよ。"],["p2566", "It's really good for you.", "体にすごくいいんだ。"],["p2567", "Don't worry if you don't like it.", "気に入らなくても気にしないで。"],["p2568", "You're braver than me!", "わたしより勇気あるね！"]],
  r:[["What is this? It smells strong.", 1],["Whoa, it makes strings when I lift it!", 2],["I actually like it!", 7]],
  c:{sit:"朝ごはんに海外の友人と",t:[["What's in this little box?", 1],["Can I just eat it like this?", 3],["Okay, it's interesting. Not bad!", 7]]}},
 {t:"第三百二十二歩 英語のちがい",d:"イギリス英語とアメリカ英語",p:[
  ["p2569", "In America, they say elevator.", "アメリカでは elevator と言います。"],["p2570", "In Britain, it's a lift.", "イギリスでは lift です。"],["p2571", "Do you say apartment or flat?", "アパートは apartment？それとも flat？"],["p2572", "The spelling is different too.", "つづりもちがいます。"],["p2573", "I learned American English at school.", "学校ではアメリカ英語を習いました。"],["p2574", "Your accent sounds British.", "あなたのなまりはイギリス風ですね。"],["p2575", "Both are correct.", "どちらも正しいです。"],["p2576", "Where did you learn English?", "英語はどこで習いましたか？"]],
  r:[["Let's take the lift to the fifth floor.", 1],["I live in a small flat in London.", 2],["Which is right, color with or without a u?", 6]],
  c:{sit:"イギリス出身の同僚と話す",t:[["I'll meet you by the lift.", 1],["That's right. Americans say elevator.", 6],["So, where did you learn your English?", 4]]}},
 {t:"第三百二十三歩 通訳ボランティア",d:"通訳ボランティアをする",p:[
  ["p2577", "I'm a volunteer interpreter.", "ボランティアの通訳です。"],["p2578", "I'll translate for you.", "わたしが通訳します。"],["p2579", "Please speak slowly so I can translate.", "通訳できるよう、ゆっくり話してください。"],["p2580", "Let me check that word.", "その単語を確認させてください。"],["p2581", "He's asking about the schedule.", "彼は予定について聞いています。"],["p2582", "Could you say that one more time?", "もう一度言っていただけますか？"],["p2583", "I hope I helped.", "お役に立てたならうれしいです。"],["p2584", "It was a great experience.", "すばらしい経験でした。"]],
  r:[["Excuse me, do you speak English?", 0],["Sorry, I tend to talk fast.", 2],["You helped us so much today!", 6]],
  c:{sit:"観光案内所でボランティア通訳をする",t:[["Hi. Does anyone here speak English?", 0],["Great. Could you tell me what the guide just asked?", 4],["That was perfect. You made our day.", 6]]}},
 {t:"第三百二十四歩 字幕なし",d:"字幕なしで映画を観る",p:[
  ["p2585", "Let's watch it without subtitles.", "字幕なしで観よう。"],["p2586", "I caught most of it.", "ほとんど聞き取れました。"],["p2587", "They talk really fast.", "すごく早口ですね。"],["p2588", "Sorry, I missed that joke.", "すみません、今の冗談を聞き逃しました。"],["p2589", "Can we rewind a little?", "少し巻き戻せますか？"],["p2590", "I understood more than I expected.", "思ったより理解できました。"],["p2591", "Let's turn on English subtitles.", "英語字幕をつけよう。"],["p2592", "I want to watch it again.", "もう一回観たいです。"]],
  r:[["Why is everyone laughing?", 3],["Did you understand the whole movie?", 1],["That was hard to follow, right?", 5]],
  c:{sit:"友人の家で映画を観る",t:[["Ready? Should I turn on the subtitles?", 0],["Ha ha, that line was so funny.", 3],["So, how much did you understand?", 5]]}},
 {t:"第三百二十五歩 わたしの夢",d:"自分の夢をスピーチする",p:[
  ["p2593", "Today, I'd like to talk about my dream.", "今日はわたしの夢についてお話しします。"],["p2594", "When I was a child, I loved maps.", "子どものころ、地図が大好きでした。"],["p2595", "I dreamed of seeing the world.", "世界を見ることを夢見ていました。"],["p2596", "English was the key to that door.", "英語はその扉の鍵でした。"],["p2597", "I've already visited five countries.", "もう五か国を訪れました。"],["p2598", "My next goal is to work abroad.", "次の目標は海外で働くことです。"],["p2599", "Dreams change, and that's okay.", "夢は変わるもの。それでいいんです。"],["p2600", "Thank you for listening.", "ご清聴ありがとうございました。"]],
  r:[["Please begin your speech.", 0],["Have you made any progress toward your dream?", 4],["What a great speech!", 7]],
  c:{sit:"英語のスピーチ大会で",t:[["Our next speaker, please.", 0],["Please go on. What was your dream as a child?", 2],["And what comes next for you?", 5]]}},
 {t:"第三百二十六歩 寝坊",d:"寝坊した朝",p:[
  ["p2601", "I overslept!", "寝坊した！"],["p2602", "My alarm didn't go off.", "目覚ましが鳴らなかった。"],["p2603", "I have to leave in five minutes.", "五分で出なきゃ。"],["p2604", "Have you seen my keys?", "わたしの鍵、見なかった？"],["p2605", "I'll grab breakfast on the way.", "朝ごはんは途中で買うね。"],["p2606", "I'm going to miss my train.", "電車に乗り遅れちゃう。"],["p2607", "I'll text my boss that I'll be late.", "上司に遅れるって連絡するね。"],["p2608", "Tomorrow I'll set two alarms.", "明日は目覚ましを二つかけよう。"]],
  r:[["Wake up! It's already eight!", 0],["Why didn't you get up earlier?", 1],["You didn't eat anything!", 4]],
  c:{sit:"寝坊した朝、家族に起こされる",t:[["Hey, aren't you late for work?", 0],["Your keys are on the table. Hurry!", 5],["Do you want some toast for the road?", 4]]}},
 {t:"第三百二十七歩 コインランドリー",d:"コインランドリーを使う",p:[
  ["p2609", "How do I use this machine?", "この機械はどう使うんですか？"],["p2610", "Do I need to buy detergent?", "洗剤は買う必要がありますか？"],["p2611", "How long does the dryer take?", "乾燥機はどのくらいかかりますか？"],["p2612", "Is this machine free?", "この機械は空いていますか？"],["p2613", "I think it's out of order.", "故障しているみたいです。"],["p2614", "Can I leave my clothes here?", "服をここに置いておいてもいいですか？"],["p2615", "My sweater shrank!", "セーターが縮んじゃった！"],["p2616", "I'll come back in forty minutes.", "四十分後に戻ります。"]],
  r:[["You look a little lost. First time here?", 0],["That washer isn't spinning at all.", 4],["Oh no, did you wash that in hot water?", 6]],
  c:{sit:"コインランドリーで常連さんに話しかける",t:[["Need some help with the machines?", 0],["You put coins here, and the soap is free.", 2],["About forty minutes. Will you wait here?", 7]]}},
 {t:"第三百二十八歩 家電を買う",d:"家電を選んで買う",p:[
  ["p2617", "I'm looking for a new fridge.", "新しい冷蔵庫を探しています。"],["p2618", "Which one uses less electricity?", "どれが電気代が安いですか？"],["p2619", "Does it come with a warranty?", "保証はついていますか？"],["p2620", "Can you deliver it this weekend?", "今週末に配達できますか？"],["p2621", "Will you take the old one away?", "古いのを引き取ってもらえますか？"],["p2622", "Is there a quieter model?", "もっと静かなモデルはありますか？"],["p2623", "It won't fit in my kitchen.", "うちの台所に入りません。"],["p2624", "I'll take this one.", "これにします。"]],
  r:[["Can I help you find anything?", 0],["This model has a five-year guarantee.", 3],["Do you need help with your old fridge?", 4]],
  c:{sit:"家電量販店で店員と話す",t:[["Hi. What are you shopping for today?", 0],["This one is very popular. It's energy-saving, too.", 5],["Yes, this one is much quieter. Anything else?", 3]]}},
 {t:"第三百二十九歩 海外発送",d:"海外に荷物を送る",p:[
  ["p2625", "I'd like to send this to Canada.", "これをカナダに送りたいです。"],["p2626", "What's the cheapest way?", "一番安い方法は何ですか？"],["p2627", "How long will it take by airmail?", "航空便だとどのくらいかかりますか？"],["p2628", "Can I track it online?", "ネットで追跡できますか？"],["p2629", "It's a birthday present.", "誕生日のプレゼントです。"],["p2630", "Should I write the contents in English?", "中身は英語で書くべきですか？"],["p2631", "Please handle it with care.", "取り扱いに注意してください。"],["p2632", "Do you sell boxes here?", "ここで箱は売っていますか？"]],
  r:[["Where is it going?", 0],["Airmail takes about a week.", 3],["What's inside the box?", 4]],
  c:{sit:"郵便局の窓口で",t:[["Hello. How can I help you?", 0],["Sure. Airmail or sea mail?", 1],["Sea mail is cheaper but takes two months.", 2]]}},
 {t:"第三百三十歩 紅葉狩り",d:"紅葉を見に行く",p:[
  ["p2633", "The leaves are turning red.", "葉が赤くなってきました。"],["p2634", "This is the best time to see them.", "今がいちばんの見ごろです。"],["p2635", "Let's walk along the river.", "川沿いを歩こう。"],["p2636", "The colors are so vivid.", "色がとても鮮やかです。"],["p2637", "It's getting chilly.", "肌寒くなってきました。"],["p2638", "Let's get something warm to drink.", "温かいものを飲もう。"],["p2639", "I want to take a photo here.", "ここで写真を撮りたい。"],["p2640", "Autumn is my favorite season.", "秋がいちばん好きな季節です。"]],
  r:[["Look at those trees! They're amazing.", 3],["The wind is so cold today.", 4],["Which season do you like best?", 7]],
  c:{sit:"友人と紅葉の名所を歩く",t:[["Wow, look at the colors!", 3],["Should we keep walking?", 2],["I'm getting a little cold.", 5]]}},
 {t:"第三百三十一歩 大掃除",d:"年末の大掃除",p:[
  ["p2641", "Let's clean the whole house today.", "今日は家じゅうを掃除しよう。"],["p2642", "I'll do the windows.", "窓はわたしがやるね。"],["p2643", "Where should we put these old things?", "この古い物はどこに置く？"],["p2644", "Let's throw this away.", "これは捨てよう。"],["p2645", "I found my old photo album!", "昔のアルバムが出てきた！"],["p2646", "Don't get distracted!", "気をとられないで！"],["p2647", "The house looks so clean now.", "家がすごくきれいになった。"],["p2648", "Let's order dinner tonight.", "今夜は出前を頼もう。"]],
  r:[["Where do you want to start?", 1],["Do you still need this broken lamp?", 3],["Wow, everything is sparkling!", 6]],
  c:{sit:"年末に家族で大掃除をする",t:[["Okay, let's start! Which part will you take?", 1],["Why did you stop cleaning? What's that?", 4],["Ooh, let me see! Look how young we were!", 5]]}},
 {t:"第三百三十二歩 新年の抱負",d:"新年の目標を話す",p:[
  ["p2649", "What's your New Year's resolution?", "新年の抱負は何？"],["p2650", "I want to read one book a month.", "月に一冊本を読みたいです。"],["p2651", "I'm going to save more money.", "もっとお金をためるつもりです。"],["p2652", "I'll try to sleep earlier.", "早く寝るようにします。"],["p2653", "I want to travel somewhere new.", "どこか新しい場所に旅したいです。"],["p2654", "Last year I didn't keep mine.", "去年は守れませんでした。"],["p2655", "Let's check on each other in June.", "六月にお互い確認し合おう。"],["p2656", "This year will be great.", "今年はいい年になるよ。"]],
  r:[["Happy New Year! Any goals this year?", 1],["Did you keep last year's resolution?", 5],["How will we keep each other on track?", 6]],
  c:{sit:"新年に友人と目標を話す",t:[["Happy New Year! So, what's your goal this year?", 1],["Nice! Did you have a goal last year too?", 5],["Then let's help each other this year.", 6]]}},
 {t:"第三百三十三歩 献立",d:"夕食の献立を決める",p:[
  ["p2657", "What should we have for dinner?", "夕飯は何にしよう？"],["p2658", "We have chicken and some vegetables.", "鶏肉と野菜が少しあるよ。"],["p2659", "How about curry?", "カレーはどう？"],["p2660", "We had pasta yesterday.", "昨日パスタだったよ。"],["p2661", "Let's make something light.", "軽いものにしよう。"],["p2662", "I'll make the salad.", "サラダはわたしが作るね。"],["p2663", "Do we need to go shopping?", "買い物に行く必要ある？"],["p2664", "Dinner will be ready in twenty minutes.", "夕飯はあと二十分でできるよ。"]],
  r:[["I'm hungry. Any ideas for dinner?", 2],["Want pasta tonight?", 3],["Can I help with anything?", 5]],
  c:{sit:"夕方、家族と夕食を決める",t:[["What's for dinner tonight?", 2],["Again? We had curry on Monday.", 4],["Okay, I'll make soup. Can you make something too?", 5]]}},
 {t:"第三百三十四歩 宿題を手伝う",d:"子どもの宿題を手伝う",p:[
  ["p2665", "Let's look at your homework together.", "一緒に宿題を見よう。"],["p2666", "Which part is hard?", "どこが難しい？"],["p2667", "Read the question again slowly.", "問題をもう一度ゆっくり読んで。"],["p2668", "Try to solve it yourself first.", "まず自分で解いてみて。"],["p2669", "You're almost there!", "もうちょっとだよ！"],["p2670", "That's right! Good job.", "正解！よくできたね。"],["p2671", "Let's take a short break.", "少し休憩しよう。"],["p2672", "I'm proud of you for not giving up.", "あきらめなかったあなたを誇りに思うよ。"]],
  r:[["I don't understand this math problem.", 1],["Can you just tell me the answer?", 3],["I did it! I finally got it!", 7]],
  c:{sit:"子どもの算数の宿題を見る",t:[["I can't do this problem.", 1],["This one. I don't get the question.", 2],["Oh! The answer is twelve?", 5]]}},
 {t:"第三百三十五歩 祖父母の家",d:"祖父母の家をたずねる",p:[
  ["p2673", "Grandma, we're here!", "おばあちゃん、来たよ！"],["p2674", "You look well.", "元気そうだね。"],["p2675", "Something smells delicious.", "何かいいにおいがする。"],["p2676", "Tell me about when you were young.", "若いころの話を聞かせて。"],["p2677", "I brought some photos of my trip.", "旅行の写真を持ってきたよ。"],["p2678", "Let me help you with the dishes.", "お皿洗いを手伝うね。"],["p2679", "Take care of yourselves.", "体に気をつけてね。"],["p2680", "I'll visit again soon.", "また近いうちに来るね。"]],
  r:[["Oh, it's so good to see you!", 1],["I made your favorite beef stew.", 2],["Do you really have to leave already?", 7]],
  c:{sit:"久しぶりに祖父母の家に行く",t:[["Oh, look who's here!", 1],["We're fine, thanks. Dinner is almost ready.", 2],["Tell us about your trip!", 4]]}},
 {t:"第三百三十六歩 レビューを書く",d:"商品やお店のレビューを書く",p:[
  ["p2681", "I'd give it four stars.", "星四つです。"],["p2682", "The quality is better than I expected.", "品質は思ったよりよかったです。"],["p2683", "Shipping was fast.", "発送が早かったです。"],["p2684", "The staff were very friendly.", "店員さんがとても親切でした。"],["p2685", "The only problem was the noise.", "唯一の問題は騒音でした。"],["p2686", "I would definitely come back.", "絶対にまた来ます。"],["p2687", "It's a little overpriced.", "少し割高です。"],["p2688", "I'd recommend it to my friends.", "友だちにすすめたいです。"]],
  r:[["How would you rate the hotel?", 0],["Was there anything you didn't like?", 4],["Would you go there again?", 5]],
  c:{sit:"ホテルのアンケートに答える",t:[["How was your stay with us?", 0],["Wonderful! Anything we could improve?", 4],["We appreciate your feedback. Will you stay with us again?", 5]]}},
 {t:"第三百三十七歩 写真に一言",d:"SNSの投稿にコメントする",p:[
  ["p2689", "Great shot!", "いい写真！"],["p2690", "Where was this taken?", "これどこで撮ったの？"],["p2691", "You look so happy.", "すごく楽しそう。"],["p2692", "I'm so jealous!", "うらやましい！"],["p2693", "Congrats on the new job!", "新しい仕事おめでとう！"],["p2694", "This made me smile.", "これ見て笑顔になったよ。"],["p2695", "Miss you guys!", "みんなに会いたい！"],["p2696", "Let's catch up soon.", "近いうちに近況を話そうね。"]],
  r:[["Check out my photo from Hawaii!", 3],["Look at my puppy wearing a hat!", 5],["We had a class reunion last night!", 6]],
  c:{sit:"友人の投稿にコメントする",t:[["Just got back from Paris!", 3],["Here's me at the top of the Eiffel Tower!", 2],["I miss you! Let's meet up this weekend.", 7]]}},
 {t:"第三百三十八歩 議事録",d:"会議のあとに要点を送る",p:[
  ["p2697", "Here's a quick summary of today's meeting.", "今日の会議の簡単なまとめです。"],["p2698", "We agreed on three points.", "三つの点で合意しました。"],["p2699", "Tom will handle the budget.", "予算はトムが担当します。"],["p2700", "The deadline is the end of the month.", "締め切りは月末です。"],["p2701", "Please let me know if I missed anything.", "抜けがあれば教えてください。"],["p2702", "Our next meeting is on Monday.", "次の会議は月曜日です。"],["p2703", "I've attached the slides.", "スライドを添付しました。"],["p2704", "Thanks, everyone, for your input.", "みなさん、ご意見ありがとうございました。"]],
  r:[["Can you send everyone the notes?", 0],["Who's in charge of the money?", 2],["When do we need to finish?", 3]],
  c:{sit:"会議のあと上司に頼まれる",t:[["Could you send a summary to the team?", 0],["Good. Who's taking care of the budget?", 2],["Great. Did you include the slides, too?", 6]]}},
 {t:"第三百三十九歩 ふり返り会",d:"プロジェクトをふり返る",p:[
  ["p2705", "What went well?", "何がうまくいった？"],["p2706", "What could we improve?", "何を改善できる？"],["p2707", "Communication was our strength.", "コミュニケーションが強みでした。"],["p2708", "We underestimated the time.", "時間を甘く見ていました。"],["p2709", "Next time, let's start earlier.", "次はもっと早く始めよう。"],["p2710", "I learned a lot from this project.", "このプロジェクトでたくさん学びました。"],["p2711", "Let's write these lessons down.", "この教訓を書きとめておこう。"],["p2712", "Great teamwork, everyone.", "みんな、すばらしいチームワークでした。"]],
  r:[["Let's start our project review.", 0],["Why were we late with the first version?", 3],["Any advice for the next project?", 4]],
  c:{sit:"チームでプロジェクトをふり返る",t:[["The project is finished. Let's review it.", 0],["Communication was good. What else?", 1],["Good question. We were always rushing at the end.", 4]]}},
 {t:"第三百四十歩 同窓会",d:"同窓会で旧友に会う",p:[
  ["p2713", "You haven't changed at all!", "全然変わってないね！"],["p2714", "What are you doing these days?", "最近は何してるの？"],["p2715", "Do you remember our math teacher?", "数学の先生、覚えてる？"],["p2716", "We used to sit together in class.", "授業でとなりの席だったよね。"],["p2717", "Are you still in touch with anyone?", "今もだれかと連絡とってる？"],["p2718", "Time really flies.", "時がたつのは本当に早いね。"],["p2719", "Let's take a group photo.", "みんなで写真を撮ろう。"],["p2720", "Let's not wait ten years next time.", "次は十年も待たないようにしよう。"]],
  r:[["Wow, is that really you? It's been ten years!", 0],["It's so great to see you. We have so much to talk about!", 1],["This was so much fun. When's the next one?", 7]],
  c:{sit:"十年ぶりの同窓会で",t:[["Oh my gosh, look at you!", 0],["Ha, you're too kind! It's been forever.", 1],["I'm a teacher now. Oh, look! Who's that man by the door?", 2]]}},
 {t:"第三百四十一歩 ゴミ出しのルール",d:"ゴミの出し方を確認する",p:[
  ["p2721", "Which day is for burnable trash?", "燃えるゴミは何曜日ですか？"],["p2722", "Where do I put plastic bottles?", "ペットボトルはどこに出せばいいですか？"],["p2723", "Do I need to wash them first?", "先に洗う必要がありますか？"],["p2724", "Should I remove the labels?", "ラベルははがすべきですか？"],["p2725", "What about old batteries?", "古い電池はどうすればいいですか？"],["p2726", "I'm sorry, I didn't know the rules.", "すみません、ルールを知りませんでした。"],["p2727", "Is there a list in English?", "英語のリストはありますか？"],["p2728", "I'll be more careful.", "もっと気をつけます。"]],
  r:[["Excuse me, you can't put that out today.", 5],["Burnable trash is on Tuesdays and Fridays.", 1],["Here's a guide for new residents.", 6]],
  c:{sit:"アパートの管理人と話す",t:[["Excuse me, plastic isn't collected today.", 5],["It's okay. Plastic goes out on Wednesdays.", 2],["Yes, please rinse them. Here's a guide, too.", 6]]}},
 {t:"第三百四十二歩 電車のマナー",d:"電車で気持ちよく過ごす",p:[
  ["p2729", "Would you like to sit here?", "ここに座りませんか？"],["p2730", "Excuse me, I'm getting off.", "すみません、降ります。"],["p2731", "Could you move your bag a little?", "かばんを少しよけてもらえますか？"],["p2732", "Please go ahead.", "お先にどうぞ。"],["p2733", "Sorry, did I step on your foot?", "すみません、足を踏みましたか？"],["p2734", "Is this seat taken?", "この席は空いていますか？"],["p2735", "Could you turn your music down?", "音楽の音量を下げてもらえますか？"],["p2736", "Thanks, that's very kind.", "ありがとう、ご親切に。"]],
  r:[["Oh, my legs are so tired today.", 0],["Ouch! My foot!", 4],["Sure, I'll move my bag.", 7]],
  c:{sit:"混んだ電車の中で",t:[["Excuse me, may I get by?", 3],["Hey, watch out!", 4],["It's fine. Oh, you can sit here if you want.", 7]]}},
 {t:"第三百四十三歩 家族旅行",d:"家族旅行を計画する",p:[
  ["p2737", "Where should we go as a family?", "家族でどこに行こうか？"],["p2738", "Let's find a place the kids will enjoy.", "子どもが楽しめる所を探そう。"],["p2739", "How about a hot spring resort?", "温泉リゾートはどう？"],["p2740", "We need a room for five people.", "五人用の部屋が必要です。"],["p2741", "Let's drive instead of flying.", "飛行機じゃなくて車で行こう。"],["p2742", "Grandpa wants to come too.", "おじいちゃんも来たいって。"],["p2743", "Let's book early to save money.", "節約のために早めに予約しよう。"],["p2744", "It'll be a trip to remember.", "思い出に残る旅になるね。"]],
  r:[["Summer vacation is coming. Any plans?", 0],["Will everyone fit in one room?", 3],["Flights are so expensive this year.", 4]],
  c:{sit:"家族で夏の旅行を話し合う",t:[["Where do you want to go this summer?", 2],["Sounds good! But how will we get there?", 4],["Great. And what about Grandpa?", 5]]}},
 {t:"第三百四十四歩 ドライブで迷う",d:"ドライブ中に道に迷う",p:[
  ["p2745", "I think we're lost.", "道に迷ったみたい。"],["p2746", "The GPS isn't working.", "カーナビが動いていない。"],["p2747", "Let's pull over and check the map.", "車を止めて地図を確認しよう。"],["p2748", "Did we miss the exit?", "出口を通り過ぎた？"],["p2749", "Let's ask someone for directions.", "だれかに道を聞こう。"],["p2750", "We need to turn around.", "Uターンしないと。"],["p2751", "We're running low on gas.", "ガソリンが少なくなってきた。"],["p2752", "At least the view is nice.", "少なくとも景色はいいね。"]],
  r:[["Where are we? This doesn't look right.", 0],["The sign said 'Airport' back there.", 3],["Look, the gas light just came on.", 6]],
  c:{sit:"友人とドライブ中に",t:[["Wait, where are we?", 0],["Let's check the map on your phone.", 2],["Okay. We need to go back the way we came.", 5]]}},
 {t:"第三百四十五歩 年の瀬",d:"一年の終わりにあいさつする",p:[
  ["p2753", "This year went by so fast.", "今年はあっという間でした。"],["p2754", "Thank you for everything this year.", "今年はいろいろありがとうございました。"],["p2755", "I couldn't have done it without you.", "あなたがいなかったらできませんでした。"],["p2756", "What was your favorite moment?", "いちばんの思い出は何？"],["p2757", "I'm looking forward to next year.", "来年が楽しみです。"],["p2758", "Let's make next year even better.", "来年はもっといい年にしよう。"],["p2759", "Have a happy New Year!", "よいお年を！"],["p2760", "See you next year!", "また来年！"]],
  r:[["Can you believe it's December already?", 0],["I had such a great year.", 3],["This is my last day before the holidays.", 6]],
  c:{sit:"年末の職場で同僚にあいさつする",t:[["Can you believe it's almost the end of the year?", 0],["It really did. Next year will be busy, too.", 4],["Nice. See you in January!", 6]]}},
 {t:"第三百四十六歩 スマホの乗り換え",d:"新しいスマホに乗り換える",p:[
  ["p2761", "I'd like to switch to a new phone.", "新しいスマホに替えたいです。"],["p2762", "Can I keep my phone number?", "電話番号はそのまま使えますか？"],["p2763", "How do I move my photos?", "写真はどうやって移せばいいですか？"],["p2764", "Which plan is the cheapest?", "どのプランがいちばん安いですか？"],["p2765", "I don't need much data.", "データはあまり使いません。"],["p2766", "Is there a student discount?", "学割はありますか？"],["p2767", "How long is the contract?", "契約期間はどのくらいですか？"],["p2768", "Can you help me set it up?", "設定を手伝ってもらえますか？"]],
  r:[["What brings you in today?", 0],["How much data do you use each month?", 4],["Here's your new phone. Anything else?", 7]],
  c:{sit:"携帯ショップで機種変更する",t:[["Hi! How can I help you today?", 0],["Sure. Let me show you our latest models.", 1],["No problem. Now, which plan would you like?", 3]]}},
 {t:"第三百四十七歩 ネットが遅い",d:"家のネットの不調を直す",p:[
  ["p2769", "The internet is really slow today.", "今日はネットがすごく遅い。"],["p2770", "Have you tried restarting the router?", "ルーターを再起動してみた？"],["p2771", "The Wi-Fi keeps disconnecting.", "Wi-Fiが何度も切れる。"],["p2772", "Maybe too many devices are connected.", "つながっている機器が多すぎるのかも。"],["p2773", "Let me check the cables.", "ケーブルを確認してみるね。"],["p2774", "It's working again!", "また動くようになった！"],["p2775", "I'll call the internet company.", "ネット会社に電話するよ。"],["p2776", "Let's move the router closer.", "ルーターを近くに移そう。"]],
  r:[["My video keeps stopping. What's wrong?", 0],["I already turned it off and on.", 4],["The signal is weak in my room.", 7]],
  c:{sit:"家族とネットの不調について話す",t:[["My movie won't load. What's going on?", 0],["I already restarted the router. Still slow.", 4],["You fixed a loose cable? Let's try the movie again.", 5]]}},
 {t:"第三百四十八歩 パスワード",d:"パスワードを忘れたとき",p:[
  ["p2777", "I forgot my password.", "パスワードを忘れました。"],["p2778", "I can't log in.", "ログインできません。"],["p2779", "I didn't get the reset email.", "リセットのメールが届きません。"],["p2780", "Did you check your spam folder?", "迷惑メールフォルダは確認した？"],["p2781", "My account is locked.", "アカウントがロックされています。"],["p2782", "I need to verify my identity.", "本人確認が必要です。"],["p2783", "I'll use a password manager from now on.", "これからはパスワード管理アプリを使います。"],["p2784", "Don't use the same password everywhere.", "同じパスワードを使い回さないで。"]],
  r:[["Why can't you open your email?", 1],["We sent you a link five minutes ago.", 2],["I use one password for every site.", 7]],
  c:{sit:"同僚とパスワードのトラブルについて話す",t:[["You look upset. What's wrong?", 0],["Did you request a reset link?", 2],["That happened to me too. My reset email never came.", 3]]}},
 {t:"第三百四十九歩 英語日記",d:"英語で日記を書く",p:[
  ["p2785", "I write a diary in English every night.", "毎晩英語で日記を書いています。"],["p2786", "I only write three sentences.", "三文だけ書きます。"],["p2787", "I write about what happened today.", "今日あったことを書きます。"],["p2788", "I look up words I don't know.", "知らない単語を調べます。"],["p2789", "Reading old entries is fun.", "昔の日記を読むのが楽しいです。"],["p2790", "My writing has improved a lot.", "書く力がかなり上がりました。"],["p2791", "Could you check my grammar?", "文法を見てもらえますか？"],["p2792", "Writing helps me think in English.", "書くと英語で考えられるようになります。"]],
  r:[["How do you practice writing?", 0],["Doesn't that take a lot of time?", 1],["Can I see an example?", 6]],
  c:{sit:"英語の先生と勉強法を話す",t:[["Your writing is getting better. What's your secret?", 0],["That's great. How long does it take?", 1],["Wonderful. Can I read some?", 6]]}},
 {t:"第三百五十歩 英語サークル",d:"英語サークルに参加する",p:[
  ["p2793", "Is this the English club?", "ここは英語サークルですか？"],["p2794", "I'm a little nervous.", "少し緊張しています。"],["p2795", "I'd like to join.", "参加したいです。"],["p2796", "How often do you meet?", "どのくらいの頻度で集まりますか？"],["p2797", "What topics do you talk about?", "どんな話題を話すんですか？"],["p2798", "Can I bring a friend next time?", "次回、友だちを連れてきてもいいですか？"],["p2799", "That was really fun.", "すごく楽しかったです。"],["p2800", "See you next week!", "また来週！"]],
  r:[["Hi! Are you new here?", 1],["We meet every Wednesday evening.", 5],["So, how was your first meeting?", 6]],
  c:{sit:"英語サークルの見学に行く",t:[["Hi there! Can I help you?", 0],["Yes, it is! Come on in.", 1],["Don't worry. Everyone's friendly here.", 2]]}},
 {t:"第三百五十一歩 花火大会",d:"花火大会に行く",p:[
  ["p2801", "Let's get there early for a good spot.", "いい場所を取るために早めに行こう。"],["p2802", "I'll bring a picnic blanket.", "レジャーシートを持っていくね。"],["p2803", "It's so crowded!", "すごく混んでるね！"],["p2804", "Here it comes!", "始まるよ！"],["p2805", "Look, that one was huge!", "見て、今のすごく大きかった！"],["p2806", "My favorite is the gold one.", "金色のがいちばん好き。"],["p2807", "Let's leave before the crowd.", "混み合う前に帰ろう。"],["p2808", "What a perfect summer night.", "最高の夏の夜だね。"]],
  r:[["The fireworks start at seven thirty.", 0],["Look, the sky is getting dark.", 3],["That was the finale. It's over.", 6]],
  c:{sit:"花火大会の前に友人と出かける準備をする",t:[["The fireworks start in an hour. Should we head out soon?", 0],["Good idea. What should we bring?", 1],["Look outside. The sky is clear and the breeze is cool.", 7]]}},
 {t:"第三百五十二歩 暑さ対策",d:"夏の暑さをしのぐ",p:[
  ["p2809", "It's boiling today.", "今日はうだるように暑い。"],["p2810", "Make sure you drink enough water.", "水を十分に飲んでね。"],["p2811", "Let's stay in the shade.", "日陰にいよう。"],["p2812", "I need to cool down.", "体を冷やさないと。"],["p2813", "Let's get some shaved ice.", "かき氷を食べよう。"],["p2814", "Turn on the air conditioner.", "エアコンをつけて。"],["p2815", "Don't stay in the sun too long.", "日なたに長くいないでね。"],["p2816", "I can't wait for autumn.", "秋が待ち遠しい。"]],
  r:[["I feel a little dizzy in this heat.", 3],["Let's sit on that bench in the sun.", 2],["Which season are you looking forward to?", 7]],
  c:{sit:"真夏の午後に友人と歩く",t:[["It's so hot today, isn't it?", 0],["Yeah. I'm sweating so much.", 3],["There's a shop over there.", 4]]}},
 {t:"第三百五十三歩 台風",d:"台風に備える",p:[
  ["p2817", "A typhoon is coming this weekend.", "今週末、台風が来ます。"],["p2818", "Let's bring the plants inside.", "植木を中に入れよう。"],["p2819", "We should buy some water and food.", "水と食料を買っておこう。"],["p2820", "Charge your phone tonight.", "今夜スマホを充電しておいて。"],["p2821", "The trains might stop.", "電車が止まるかもしれない。"],["p2822", "Let's stay home tomorrow.", "明日は家にいよう。"],["p2823", "Stay away from the windows.", "窓から離れていて。"],["p2824", "I hope it passes quickly.", "早く過ぎ去るといいな。"]],
  r:[["Have you heard the weather forecast?", 0],["The store will be closed tomorrow.", 2],["The wind is getting really strong.", 6]],
  c:{sit:"台風の前日に家族と話す",t:[["I just saw the news. There's a big storm coming.", 0],["What do we need to do to get ready?", 2],["The trains might stop. What about work?", 5]]}},
 {t:"第三百五十四歩 梅雨",d:"雨の季節を過ごす",p:[
  ["p2825", "It's been raining for days.", "何日も雨が続いています。"],["p2826", "My laundry won't dry.", "洗濯物が乾きません。"],["p2827", "Everything feels damp.", "何もかもじめじめしています。"],["p2828", "Don't forget your umbrella.", "傘を忘れないでね。"],["p2829", "The hydrangeas are beautiful in the rain.", "雨の中のアジサイがきれいです。"],["p2830", "Let's watch a movie at home.", "家で映画を観よう。"],["p2831", "I like the sound of rain.", "雨の音が好きです。"],["p2832", "The rainy season will end soon.", "梅雨はもうすぐ明けるよ。"]],
  r:[["Why are your clothes hanging inside?", 1],["It's raining again. What should we do?", 5],["I'm tired of this weather.", 7]],
  c:{sit:"梅雨の朝、同居人と話す",t:[["Oh no, it's raining again.", 0],["And my clothes are still wet.", 1],["At least the flowers look nice.", 4]]}},
 {t:"第三百五十五歩 お花見",d:"お花見を楽しむ",p:[
  ["p2833", "The cherry blossoms are in full bloom.", "桜が満開です。"],["p2834", "Let's have a picnic under the trees.", "木の下でピクニックをしよう。"],["p2835", "I'll save us a spot.", "場所を取っておくね。"],["p2836", "The petals are falling like snow.", "花びらが雪みたいに舞っている。"],["p2837", "They only last about a week.", "一週間くらいしかもちません。"],["p2838", "Let's come back at night to see them lit up.", "夜にライトアップを見に来よう。"],["p2839", "This is my favorite time of year.", "一年でいちばん好きな時期です。"],["p2840", "Pass me a rice ball, please.", "おにぎりを取ってくれる？"]],
  r:[["How are the cherry blossoms this year?", 0],["Why is everyone in such a hurry to see them?", 4],["Look at the pink petals everywhere!", 3]],
  c:{sit:"公園で友人とお花見をする",t:[["Look at the cherry trees!", 0],["Let's come back for another picnic tomorrow!", 2],["Great. Now, who's hungry? I made rice balls.", 7]]}},
 {t:"第三百五十六歩 卒業",d:"卒業の日に",p:[
  ["p2841", "I can't believe we're graduating.", "卒業するなんて信じられない。"],["p2842", "Congratulations on graduating!", "卒業おめでとう！"],["p2843", "I'll miss seeing you every day.", "毎日会えなくなるのがさびしいな。"],["p2844", "What are you doing after graduation?", "卒業後はどうするの？"],["p2845", "I'm starting a new job in April.", "四月から新しい仕事を始めます。"],["p2846", "Let's stay friends forever.", "ずっと友だちでいよう。"],["p2847", "Can I take a photo with you?", "一緒に写真を撮ってもいい？"],["p2848", "Thank you for these wonderful years.", "すばらしい年月をありがとう。"]],
  r:[["We made it! We're graduating today!", 0],["So, what's next for you?", 4],["Promise you'll keep in touch?", 5]],
  c:{sit:"卒業式のあと友人と話す",t:[["We did it! Today's the big day!", 0],["So, what's your plan now?", 4],["Before we go, I want to remember this moment.", 6]]}},
 {t:"第三百五十七歩 新学期",d:"新しいクラスで自己紹介する",p:[
  ["p2849", "Hi, I'm new in this class.", "こんにちは、このクラスに新しく来ました。"],["p2850", "Can I sit next to you?", "となりに座ってもいい？"],["p2851", "Which club are you in?", "どの部活に入ってるの？"],["p2852", "I recently moved here from Osaka.", "最近、大阪から引っ越してきました。"],["p2853", "Could you show me around?", "案内してもらえる？"],["p2854", "Where's the cafeteria?", "食堂はどこ？"],["p2855", "Let's have lunch together.", "お昼を一緒に食べよう。"],["p2856", "I'm glad I met you.", "会えてよかった。"]],
  r:[["Hey, I haven't seen you before.", 0],["Where are you from?", 3],["Do you know where everything is?", 4]],
  c:{sit:"新しい学校の初日",t:[["Hi! Are you the new student?", 0],["Nice to meet you. Where did you live before?", 3],["Cool. It's almost lunchtime, and I'm starving.", 6]]}},
 {t:"第三百五十八歩 祝われる",d:"誕生日を祝ってもらう",p:[
  ["p2857", "Oh, you didn't have to do this!", "まあ、こんなことしてくれなくてよかったのに！"],["p2858", "I'm so touched.", "すごく感動した。"],["p2859", "This is the best birthday ever.", "最高の誕生日だよ。"],["p2860", "How did you keep it a secret?", "どうやって秘密にしてたの？"],["p2861", "I love it. Thank you.", "すごく気に入った。ありがとう。"],["p2862", "Let's cut the cake!", "ケーキを切ろう！"],["p2863", "I'm another year older.", "また一つ年をとりました。"],["p2864", "I'm lucky to have friends like you.", "あなたたちみたいな友だちがいて幸せです。"]],
  r:[["Surprise! Happy birthday!", 0],["Here's a little present from all of us.", 4],["The candles are all out. What's next?", 5]],
  c:{sit:"友人たちにサプライズで祝われる",t:[["Surprise! Happy birthday!", 0],["We all planned it together. Do you like it?", 4],["There, the candles are all out!", 5]]}},
 {t:"第三百五十九歩 引退する人へ",d:"退職する人にことばを贈る",p:[
  ["p2865", "Congratulations on your retirement.", "ご退職おめでとうございます。"],["p2866", "You taught me so much.", "たくさんのことを教えていただきました。"],["p2867", "We'll really miss you here.", "いなくなると、とてもさびしくなります。"],["p2868", "What are your plans now?", "これからのご予定は？"],["p2869", "Enjoy your free time.", "自由な時間を楽しんでください。"],["p2870", "Please come and visit us.", "ぜひ遊びに来てください。"],["p2871", "You'll always be part of this team.", "あなたはずっとこのチームの一員です。"],["p2872", "Thank you for all your hard work.", "長い間お疲れさまでした。"]],
  r:[["Well, today is my last day.", 0],["I'm going to travel and learn to paint.", 4],["I'll miss all of you too.", 6]],
  c:{sit:"退職する上司にあいさつする",t:[["Well, this is my last week here.", 0],["It was a pleasure working with you.", 1],["I'll miss you all. Please take care.", 6]]}},
 {t:"第三百六十歩 季節がめぐる",d:"一年の季節をふり返る",p:[
  ["p2873", "Spring was full of new beginnings.", "春は新しい始まりでいっぱいでした。"],["p2874", "Summer was hot, but fun.", "夏は暑かったけど楽しかった。"],["p2875", "In autumn, I started a new hobby.", "秋には新しい趣味を始めました。"],["p2876", "Winter gave me time to think.", "冬は考える時間をくれました。"],["p2877", "Every season taught me something.", "どの季節も何かを教えてくれました。"],["p2878", "I'm a different person now.", "今のわたしは前とちがいます。"],["p2879", "I'm ready for another year.", "次の一年を迎える準備ができています。"],["p2880", "Let's see what the next season brings.", "次の季節が何を運んでくるか見てみよう。"]],
  r:[["Which season was the best for you?", 4],["Do you feel you've changed this year?", 5],["So, how do you feel about the new year?", 6]],
  c:{sit:"年の終わりに友人とふり返る",t:[["This year flew by. How was it for you?", 4],["That's nice. Do you feel different now?", 5],["So, what about next year?", 6]]}},
 {t:"第三百六十一歩 読み聞かせ",d:"子どもに英語の絵本を読む",p:[
  ["p2881", "Come sit in a circle.", "輪になって座って。"],["p2882", "Today's story is about a brave bear.", "今日のお話は勇敢なクマのお話です。"],["p2883", "What do you think will happen next?", "次はどうなると思う？"],["p2884", "Can you find the bird in this picture?", "この絵の中に鳥を見つけられる？"],["p2885", "Let's say it together!", "一緒に言ってみよう！"],["p2886", "That's a great guess!", "いい予想だね！"],["p2887", "The end. Did you like it?", "おしまい。気に入った？"],["p2888", "I'll bring another book next week.", "来週また別の本を持ってくるね。"]],
  r:[["What's the story today?", 1],["I think the bear will find his mom!", 5],["I want one more story, please!", 7]],
  c:{sit:"図書館で子どもたちに絵本を読む",t:[["We're ready for story time!", 0],["What's the book about today?", 1],["Can we hear another story?", 7]]}},
 {t:"第三百六十二歩 料理を教える",d:"友人に料理を教える",p:[
  ["p2889", "First, wash your hands.", "まず手を洗ってね。"],["p2890", "Cut the onions like this.", "玉ねぎはこう切ってね。"],["p2891", "Be careful, the pan is hot.", "気をつけて、フライパンが熱いよ。"],["p2892", "Stir it slowly.", "ゆっくり混ぜて。"],["p2893", "Add a pinch of salt.", "塩をひとつまみ入れて。"],["p2894", "Let it simmer for ten minutes.", "十分間とろ火で煮て。"],["p2895", "Taste it and see.", "味見してみて。"],["p2896", "You're a natural!", "才能あるね！"]],
  r:[["Okay, where do we start?", 0],["Ouch! Why is this so hot?", 2],["Wow, I made this myself!", 7]],
  c:{sit:"友人に家でカレーを教える",t:[["Okay, I'm ready to cook!", 0],["Done. Now what?", 1],["It smells amazing! Is it ready?", 6]]}},
 {t:"第三百六十三歩 車を買う",d:"車の販売店で話す",p:[
  ["p2897", "I'm looking for a small family car.", "小さめのファミリーカーを探しています。"],["p2898", "Can I take it for a test drive?", "試乗してもいいですか？"],["p2899", "How many miles does it get per gallon?", "燃費はどのくらいですか？"],["p2900", "Is it new or used?", "新車ですか、中古ですか？"],["p2901", "What's included in the price?", "価格には何が含まれていますか？"],["p2902", "Can I pay in installments?", "分割で払えますか？"],["p2903", "I'd like to think about it.", "少し考えたいです。"],["p2904", "I'll take it.", "これにします。"]],
  r:[["What kind of car do you need?", 0],["Would you like to drive it?", 1],["The price is very reasonable for this model.", 4]],
  c:{sit:"車の販売店で",t:[["Hello! Are you looking for a new car?", 0],["This model is very popular with families.", 1],["So, how was the test drive?", 7]]}},
 {t:"第三百六十四歩 旅行保険",d:"旅行保険に入る",p:[
  ["p2905", "Do I need travel insurance?", "旅行保険は必要ですか？"],["p2906", "What does it cover?", "何が補償されますか？"],["p2907", "Does it cover lost luggage?", "荷物の紛失は補償されますか？"],["p2908", "What if I get sick abroad?", "海外で病気になったらどうなりますか？"],["p2909", "How much does it cost per day?", "一日いくらですか？"],["p2910", "Can I buy it online?", "ネットで入れますか？"],["p2911", "Where do I call in an emergency?", "緊急時はどこに電話すればいいですか？"],["p2912", "I'll print a copy just in case.", "念のため控えを印刷しておきます。"]],
  r:[["We recommend travel insurance for long trips.", 1],["It covers medical costs and flight delays.", 2],["Here's the emergency number. Keep it with you.", 7]],
  c:{sit:"旅行会社で保険について聞く",t:[["Your trip is all booked. Would you like insurance?", 0],["It covers lost bags and flight delays.", 3],["It's about five dollars a day.", 5]]}},
 {t:"第三百六十五歩 月の一年",d:"一年分の歩みを祝う",p:[
  ["p2913", "It's been a whole year.", "まるまる一年になりました。"],["p2914", "I've walked three hundred sixty-five steps.", "三百六十五歩を歩きました。"],["p2915", "Some days were hard.", "大変な日もありました。"],["p2916", "But I never gave up.", "でも、あきらめませんでした。"],["p2917", "Now English feels like a friend.", "今では英語が友だちのように感じます。"],["p2918", "I want to keep walking.", "歩き続けたいです。"],["p2919", "Thank you for every step.", "一歩一歩に感謝します。"],["p2920", "Here's to the next year!", "次の一年に乾杯！"]],
  r:[["How long have you been studying now?", 0],["Was it always easy?", 2],["What will you do now?", 5]],
  c:{sit:"一年をふり返るスピーチをする",t:[["Please tell us about your year.", 0],["Wow. Was it difficult?", 2],["What's your next goal?", 5]]}},
 {t:"第三百六十六歩 在宅勤務",d:"家で仕事をする日々",p:[
  ["p2921", "I'm working from home today.", "今日は在宅勤務です。"],["p2922", "My internet is a bit unstable.", "ネットが少し不安定です。"],["p2923", "Can you hear me okay?", "声はちゃんと聞こえていますか？"],["p2924", "Let me share my screen.", "画面を共有しますね。"],["p2925", "I'll be offline for an hour.", "一時間ほど席を外します。"],["p2926", "It's hard to separate work and life.", "仕事と生活を分けるのが難しい。"],["p2927", "I miss chatting with coworkers.", "同僚との雑談が恋しいです。"],["p2928", "I set up a small desk at home.", "家に小さな机を用意しました。"]],
  r:[["Are you coming to the office today?", 0],["Could you show us the slides?", 3],["What's the hardest part about remote work?", 5]],
  c:{sit:"オンライン会議で同僚と話す",t:[["Hi, are you in the office today?", 0],["Your voice is breaking up a little.", 1],["Can we see the report you mentioned?", 3]]}},
 {t:"第三百六十七歩 副業",d:"本業のかたわらで稼ぐ",p:[
  ["p2929", "I started a side job recently.", "最近、副業を始めました。"],["p2930", "I do it on weekends.", "週末にやっています。"],["p2931", "Is your company okay with it?", "会社的には大丈夫なの？"],["p2932", "It's allowed if I report it.", "届け出れば認められています。"],["p2933", "It's not much money yet.", "まだ大した稼ぎではありません。"],["p2934", "I'm learning a lot from it.", "そこから学ぶことが多いです。"],["p2935", "I want to turn it into a business.", "いずれ事業にしたいです。"],["p2936", "I need to manage my time better.", "もっと時間をうまく使わないと。"]],
  r:[["When do you find time for it?", 1],["Doesn't your boss mind?", 3],["Are you making good money?", 4]],
  c:{sit:"同僚と副業について話す",t:[["I heard you're doing something on the side.", 0],["Wait, is that even allowed here?", 3],["So is it paying well?", 4]]}},
 {t:"第三百六十八歩 転職を考える",d:"友人に転職の相談をする",p:[
  ["p2937", "I'm thinking about changing jobs.", "転職を考えているんだ。"],["p2938", "I feel stuck at my current job.", "今の仕事で行き詰まっていて。"],["p2939", "I want more of a challenge.", "もっとやりがいがほしい。"],["p2940", "The pay isn't the main reason.", "給料が一番の理由じゃないんだ。"],["p2941", "I've updated my resume.", "履歴書を新しくしたよ。"],["p2942", "I have an interview next week.", "来週、面接があるんだ。"],["p2943", "Should I tell my boss first?", "先に上司に言うべきかな？"],["p2944", "I don't want to burn any bridges.", "円満に辞めたいんだ。"]],
  r:[["Why do you want to leave?", 1],["Is it about the money?", 3],["Have you applied anywhere yet?", 5]],
  c:{sit:"カフェで友人に悩みを打ち明ける",t:[["You look worried. What's going on?", 0],["Really? I thought you liked your job.", 1],["So what's your next step?", 5]]}},
 {t:"第三百六十九歩 昇進の知らせ",d:"昇進を伝える・祝う",p:[
  ["p2945", "I got promoted to manager!", "マネージャーに昇進したよ！"],["p2946", "Congratulations, you deserve it.", "おめでとう、あなたならふさわしいよ。"],["p2947", "I'm excited but a little nervous.", "うれしいけど少し緊張してる。"],["p2948", "I'll have a team of five.", "五人のチームを持つことになる。"],["p2949", "It's a big responsibility.", "責任が重いです。"],["p2950", "Your hard work paid off.", "努力が報われたね。"],["p2951", "Let's celebrate this weekend.", "今週末にお祝いしよう。"],["p2952", "I couldn't have done it alone.", "一人ではできなかったよ。"]],
  r:[["Guess what? I have big news.", 0],["How many people will you lead?", 3],["You must be so proud of yourself.", 7]],
  c:{sit:"友人に昇進を報告する",t:[["You look happy! What happened?", 0],["Wow! Will you have people under you?", 3],["We should do something special for you.", 6]]}},
 {t:"第三百七十歩 反対意見",d:"会議でやんわり反対する",p:[
  ["p2953", "I see your point, but...", "おっしゃることはわかりますが…"],["p2954", "I have a slightly different view.", "少し違う意見があります。"],["p2955", "I'm not sure that will work.", "それがうまくいくかはわかりません。"],["p2956", "Can I play devil's advocate?", "あえて反対の立場から言ってもいいですか？"],["p2957", "What about the cost?", "費用はどうでしょう？"],["p2958", "Have we considered other options?", "ほかの選択肢は検討しましたか？"],["p2959", "Let's look at the data first.", "まずデータを見てみましょう。"],["p2960", "I'm open to other ideas.", "ほかのアイデアも歓迎です。"]],
  r:[["So we all agree on the new plan, right?", 1],["Does anyone have any other concerns?", 4],["This is the only way to do it.", 5]],
  c:{sit:"会議で企画案に意見を述べる",t:[["I think we should launch next month.", 0],["Why do you have doubts?", 4],["Well, what do the numbers say?", 6]]}},
 {t:"第三百七十一歩 給料の交渉",d:"昇給や条件を話し合う",p:[
  ["p2961", "I'd like to discuss my salary.", "給与についてご相談したいです。"],["p2962", "I've taken on more responsibilities.", "担当する仕事が増えました。"],["p2963", "I believe I deserve a raise.", "昇給に値すると考えています。"],["p2964", "Here's what I've achieved this year.", "今年の成果はこちらです。"],["p2965", "Is there any flexibility?", "調整の余地はありますか？"],["p2966", "What about more vacation days?", "休暇を増やすのはどうでしょう？"],["p2967", "I'd appreciate it if you'd consider it.", "ご検討いただけるとありがたいです。"],["p2968", "When can we talk about it again?", "いつまた話し合えますか？"]],
  r:[["So, what did you want to talk about?", 0],["Why do you think you need a raise?", 1],["Our budget is really tight this year.", 5]],
  c:{sit:"上司と面談する",t:[["Come in. What's on your mind?", 0],["Okay. Why do you think you deserve a raise?", 3],["I can't promise more money right now.", 5]]}},
 {t:"第三百七十二歩 クレーム対応",d:"お客さまの苦情を受ける",p:[
  ["p2969", "I'm very sorry for the trouble.", "ご迷惑をおかけして申し訳ありません。"],["p2970", "Could you tell me what happened?", "何があったか教えていただけますか？"],["p2971", "I completely understand your frustration.", "お怒りはごもっともです。"],["p2972", "Let me look into it right away.", "すぐにお調べします。"],["p2973", "May I have your order number?", "ご注文番号をいただけますか？"],["p2974", "We'll send a replacement today.", "本日、代わりの品をお送りします。"],["p2975", "Thank you for your patience.", "お待ちいただきありがとうございます。"],["p2976", "We'll make sure it doesn't happen again.", "再発しないよう徹底いたします。"]],
  r:[["The item I got was broken!", 0],["I've been waiting for weeks!", 2],["This is the third time this happened!", 7]],
  c:{sit:"電話で客の苦情を受ける",t:[["I'm really upset about my order.", 0],["The box arrived completely crushed.", 3],["Fine. But what are you going to do about it?", 5]]}},
 {t:"第三百七十三歩 騒音トラブル",d:"隣人に音のことを伝える",p:[
  ["p2977", "Sorry to bother you.", "お邪魔してすみません。"],["p2978", "The noise is a little loud at night.", "夜の音が少し大きくて。"],["p2979", "I have to get up early.", "朝早く起きないといけなくて。"],["p2980", "I didn't realize it was so loud.", "そんなにうるさいとは気づきませんでした。"],["p2981", "I'll be more careful.", "もっと気をつけます。"],["p2982", "Thanks for understanding.", "ご理解ありがとうございます。"],["p2983", "Please let me know anytime.", "いつでも言ってくださいね。"],["p2984", "Maybe we can put down a rug.", "ラグを敷いたらいいかもしれません。"]],
  r:[["Oh, hello. Can I help you?", 0],["Is the music too loud?", 1],["I'm so sorry about that.", 5]],
  c:{sit:"隣人の部屋を訪ねる",t:[["Hi! What's up?", 0],["Is something wrong?", 1],["Oh no, I'm really sorry. I'll keep it down.", 5]]}},
 {t:"第三百七十四歩 保険の相談",d:"保険の窓口で話を聞く",p:[
  ["p2985", "I'm looking into health insurance.", "医療保険を検討しています。"],["p2986", "What does this plan cover?", "このプランは何が補償されますか？"],["p2987", "How much is the monthly premium?", "月々の保険料はいくらですか？"],["p2988", "Is there a waiting period?", "待機期間はありますか？"],["p2989", "Can I change the plan later?", "あとでプランを変えられますか？"],["p2990", "I'd like to compare a few options.", "いくつか比べてみたいです。"],["p2991", "I need some time to think.", "少し考える時間がほしいです。"],["p2992", "Could I get that in writing?", "書面でいただけますか？"]],
  r:[["What kind of insurance are you interested in?", 0],["This plan is about forty dollars a month.", 5],["So, would you like to sign up today?", 6]],
  c:{sit:"保険の窓口で説明を受ける",t:[["Hello. How can I help you today?", 0],["This plan covers hospital stays and surgery.", 2],["Would you like to sign the contract now?", 6]]}},
 {t:"第三百七十五歩 検査結果",d:"医師から検査の結果を聞く",p:[
  ["p2993", "Are my test results back?", "検査結果は出ましたか？"],["p2994", "Is everything okay?", "問題はありませんか？"],["p2995", "What do these numbers mean?", "この数値はどういう意味ですか？"],["p2996", "Is it anything serious?", "深刻なものですか？"],["p2997", "Do I need any more tests?", "追加の検査は必要ですか？"],["p2998", "What should I change in my diet?", "食事で何を変えるべきですか？"],["p2999", "When should I come back?", "次はいつ来ればいいですか？"],["p3000", "That's a relief.", "それを聞いて安心しました。"]],
  r:[["There's one result I want to talk about.", 3],["Mostly good, but one number is a little high.", 4],["Everything looks normal.", 7]],
  c:{sit:"診察室で医師と話す",t:[["Please have a seat. I have your results here.", 1],["Most of your numbers look healthy.", 7],["You should make a few lifestyle changes.", 5]]}},
 {t:"第三百七十六歩 ジムに入会",d:"スポーツジムに申し込む",p:[
  ["p3001", "I'd like to join the gym.", "ジムに入会したいです。"],["p3002", "Is there a trial session?", "体験はありますか？"],["p3003", "What are your opening hours?", "営業時間は何時から何時ですか？"],["p3004", "Is it open on holidays?", "祝日もやっていますか？"],["p3005", "Do you offer personal training?", "パーソナルトレーニングはありますか？"],["p3006", "Can I cancel anytime?", "いつでも解約できますか？"],["p3007", "Do I need to bring a towel?", "タオルは持参ですか？"],["p3008", "I'm trying to get in shape.", "体を鍛えようとしています。"]],
  r:[["Welcome! Are you a member?", 0],["We're open from six to eleven.", 3],["What are your fitness goals?", 7]],
  c:{sit:"ジムの受付で話す",t:[["Hi there! How can I help?", 0],["Great. So what made you decide to join?", 7],["The contract is for one year.", 5]]}},
 {t:"第三百七十七歩 家庭菜園",d:"ベランダで野菜を育てる",p:[
  ["p3009", "I started a vegetable garden.", "家庭菜園を始めました。"],["p3010", "I'm growing tomatoes on my balcony.", "ベランダでトマトを育てています。"],["p3011", "They need lots of sunlight.", "日光がたくさん必要です。"],["p3012", "I water them every morning.", "毎朝、水をやっています。"],["p3013", "The leaves are turning yellow.", "葉が黄色くなってきました。"],["p3014", "Bugs keep eating my lettuce.", "虫がレタスを食べてしまいます。"],["p3015", "I finally picked my first tomato.", "ついに初めてトマトを収穫しました。"],["p3016", "It tastes better when you grow it yourself.", "自分で育てるとおいしい。"]],
  r:[["How often do you water them?", 3],["Is something wrong with your plants?", 4],["Any news from your garden?", 6]],
  c:{sit:"友人と家庭菜園の話をする",t:[["So what's new with you lately?", 0],["Oh, nice! What are you growing?", 1],["How are they doing so far?", 6]]}},
 {t:"第三百七十八歩 寄付を頼まれる",d:"街頭で寄付を頼まれる",p:[
  ["p3017", "What's the donation for?", "何のための寄付ですか？"],["p3018", "How will the money be used?", "お金はどう使われますか？"],["p3019", "Sure, I'd be happy to help.", "ええ、喜んで協力します。"],["p3020", "Can I donate online instead?", "代わりにオンラインで寄付できますか？"],["p3021", "I don't have any cash on me.", "今、現金を持っていなくて。"],["p3022", "Sorry, not today.", "すみません、今日はやめておきます。"],["p3023", "Do you have a pamphlet?", "パンフレットはありますか？"],["p3024", "Good luck with your campaign.", "活動がんばってください。"]],
  r:[["Would you like to make a donation?", 0],["It goes to local animal shelters.", 2],["We only take cash, I'm afraid.", 3]],
  c:{sit:"街頭で募金を呼びかけられる",t:[["Excuse me! Can you spare a moment for a donation?", 0],["It helps children in need around the world.", 2],["Thank you! We collect donations in cash here.", 4]]}},
 {t:"第三百七十九歩 地域の清掃",d:"ご近所の清掃活動に参加する",p:[
  ["p3025", "I'd like to join the cleanup.", "清掃活動に参加したいです。"],["p3026", "What time does it start?", "何時に始まりますか？"],["p3027", "Should I bring my own gloves?", "軍手は持参したほうがいいですか？"],["p3028", "Where should I put this trash?", "このゴミはどこに置けばいいですか？"],["p3029", "Let's separate the bottles and cans.", "ビンと缶を分けましょう。"],["p3030", "Can you hold this bag open?", "袋を開けて持っていてもらえますか？"],["p3031", "The park looks so much better.", "公園がずいぶんきれいになったね。"],["p3032", "Count me in next time too.", "次回もぜひ参加させてください。"]],
  r:[["We're meeting at the park at nine.", 2],["Okay, the cleanup is all done!", 6],["We do this every month, you know.", 7]],
  c:{sit:"町内会の人と清掃に参加する",t:[["Hi! Are you interested in our community cleanup?", 0],["Great! It's this Sunday, starting at nine sharp.", 2],["Great job, everyone! We're finished.", 6]]}},
 {t:"第三百八十歩 東京を案内する",d:"海外の友人を案内する",p:[
  ["p3033", "Welcome to Tokyo!", "東京へようこそ！"],["p3034", "What do you want to see most?", "一番見たいものは何？"],["p3035", "This area is famous for street food.", "このあたりは屋台の食べ物で有名だよ。"],["p3036", "Let's take the train from here.", "ここから電車に乗ろう。"],["p3037", "Be careful, it gets crowded.", "気をつけて、混むからね。"],["p3038", "This temple is very old.", "このお寺はとても古いんだ。"],["p3039", "Want to try something local?", "地元の物を食べてみる？"],["p3040", "I hope you're enjoying your stay.", "滞在を楽しんでくれているといいな。"]],
  r:[["I'm so hungry. Where can we eat?", 2],["How do we get to the next place?", 3],["Is it always this busy here?", 4]],
  c:{sit:"来日した友人を出迎える",t:[["Hi! I finally made it!", 0],["I'm starving. Any food spots nearby?", 2],["Wow, look at all these people!", 4]]}},
 {t:"第三百八十一歩 美容院",d:"美容院で髪型を伝える",p:[
  ["p3041", "I'd like a haircut, please.", "カットをお願いします。"],["p3042", "Just a trim, please.", "毛先をそろえる程度でお願いします。"],["p3043", "Not too short, please.", "短くしすぎないでください。"],["p3044", "I'd like to change my style.", "髪型を変えたいです。"],["p3045", "Something like this photo.", "この写真みたいな感じで。"],["p3046", "Could you thin it out a bit?", "少しすいてもらえますか？"],["p3047", "I usually part it on the left.", "いつも左で分けています。"],["p3048", "I love it, thank you!", "気に入りました、ありがとう！"]],
  r:[["How much should I take off?", 1],["Do you have a style in mind?", 4],["How does it look?", 7]],
  c:{sit:"美容師と髪型の相談をする",t:[["Hi! What are we doing today?", 0],["Do you want to keep the same length?", 3],["All done. Take a look in the mirror.", 7]]}},
 {t:"第三百八十二歩 クリーニング店",d:"服をクリーニングに出す",p:[
  ["p3049", "I'd like these dry-cleaned.", "これをドライクリーニングでお願いします。"],["p3050", "There's a stain on this shirt.", "このシャツにしみがあります。"],["p3051", "Can you get it out?", "落とせますか？"],["p3052", "When will it be ready?", "いつ仕上がりますか？"],["p3053", "Is same-day service available?", "当日仕上げはできますか？"],["p3054", "Please be careful with this.", "これは丁寧に扱ってください。"],["p3055", "I'm here to pick up my suit.", "スーツを受け取りに来ました。"],["p3056", "Here's my claim ticket.", "これが引換券です。"]],
  r:[["I see a coffee stain on the collar.", 2],["It'll be ready on Friday.", 4],["Do you have your receipt?", 7]],
  c:{sit:"クリーニング店の受付で話す",t:[["Hi. What can I do for you today?", 0],["Is there anything I should know about these?", 1],["We can finish it by Thursday.", 4]]}},
 {t:"第三百八十三歩 銀行の窓口",d:"銀行で口座を開く",p:[
  ["p3057", "I'd like to open an account.", "口座を開きたいです。"],["p3058", "What do I need to bring?", "何を持ってくればいいですか？"],["p3059", "Here's my ID.", "身分証明書です。"],["p3060", "Is there a monthly fee?", "毎月の手数料はかかりますか？"],["p3061", "Can I get a debit card?", "デビットカードは作れますか？"],["p3062", "I'd like to send money abroad.", "海外に送金したいです。"],["p3063", "How long does a transfer take?", "振り込みはどのくらいかかりますか？"],["p3064", "Could you explain that again?", "もう一度説明していただけますか？"]],
  r:[["Good morning. What can I do for you?", 0],["May I see some identification?", 2],["You can also send money from our app.", 6]],
  c:{sit:"銀行の窓口で手続きする",t:[["Next, please. How can I help?", 0],["Sure. Can I see your passport?", 2],["Your account is ready. Anything else?", 4]]}},
 {t:"第三百八十四歩 引っ越しの見積もり",d:"引っ越し業者に見積もりを頼む",p:[
  ["p3065", "I'd like a moving estimate.", "引っ越しの見積もりをお願いしたいです。"],["p3066", "I'm moving next month.", "来月引っ越します。"],["p3067", "It's a two-bedroom apartment.", "寝室が二つあるアパートです。"],["p3068", "Do you offer packing services?", "荷造りサービスはありますか？"],["p3069", "I have a piano to move.", "運びたいピアノがあります。"],["p3070", "Is that the final price?", "それが最終的な金額ですか？"],["p3071", "Weekdays are cheaper, right?", "平日のほうが安いですよね？"],["p3072", "I'll get back to you soon.", "近いうちにご連絡します。"]],
  r:[["When are you planning to move?", 1],["Any large or heavy items?", 4],["We can do it for nine hundred dollars.", 5]],
  c:{sit:"引っ越し業者に電話する",t:[["Thank you for calling. How can I help?", 0],["How big is your current place?", 2],["That comes to about one thousand dollars.", 5]]}},
 {t:"第三百八十五歩 退職のあいさつ",d:"職場を去るときのあいさつ",p:[
  ["p3073", "Today is my last day here.", "今日が最終日です。"],["p3074", "Thank you for everything.", "今まで本当にありがとうございました。"],["p3075", "I learned so much from you.", "あなたから多くを学びました。"],["p3076", "I'll miss working with you all.", "皆さんと働けなくなるのはさびしいです。"],["p3077", "Let's keep in touch.", "これからも連絡を取り合いましょう。"],["p3078", "I'm starting a new job next month.", "来月から新しい仕事を始めます。"],["p3079", "Please come visit anytime.", "いつでも遊びに来てください。"],["p3080", "I wish you all the best.", "皆さんのご活躍を祈っています。"]],
  r:[["So what are your plans now?", 5],["We'll really miss you here.", 3],["Here's my new email address.", 4]],
  c:{sit:"送別会で同僚と話す",t:[["I can't believe you're leaving us.", 1],["What are you going to do next?", 5],["Don't be a stranger, okay?", 4]]}},
 {t:"第三百八十六歩 眼鏡店",d:"眼鏡を新しく作る",p:[
  ["p3081", "I'd like to get new glasses.", "新しい眼鏡を作りたいのですが。"],["p3082", "My eyesight has gotten worse lately.", "最近、視力が落ちてきました。"],["p3083", "Could you check my eyes first?", "先に視力を測ってもらえますか？"],["p3084", "I'm looking for lightweight frames.", "軽いフレームを探しています。"],["p3085", "Do these suit my face?", "この眼鏡、顔に合っていますか？"],["p3086", "Can I get anti-glare lenses?", "反射防止のレンズにできますか？"],["p3087", "How long will they take?", "仕上がりまでどのくらいかかりますか？"],["p3088", "These feel a little tight.", "これは少しきつく感じます。"]],
  r:[["What brings you in today?", 0],["Any preference for the frames?", 3],["How do they feel on you?", 7]],
  c:{sit:"眼鏡店で店員と話す",t:[["We can start by choosing your frames.", 2],["Sure. What kind of frames do you want?", 3],["Here you go. Try these on.", 4]]}},
 {t:"第三百八十七歩 献血",d:"はじめての献血に行く",p:[
  ["p3089", "This is my first time donating.", "献血は今回がはじめてです。"],["p3090", "I'm a little nervous about needles.", "注射針が少し苦手です。"],["p3091", "I had a good breakfast.", "朝ごはんはしっかり食べてきました。"],["p3092", "I'm not taking any medication.", "薬は何も飲んでいません。"],["p3093", "How long does it usually take?", "ふつうはどのくらいかかりますか？"],["p3094", "I feel a bit lightheaded.", "少しくらくらします。"],["p3095", "Should I rest for a while?", "しばらく休んだほうがいいですか？"],["p3096", "I'm glad I could help.", "役に立ててうれしいです。"]],
  r:[["Have you donated with us before?", 0],["Have you eaten anything today?", 2],["Are you feeling okay?", 5]],
  c:{sit:"献血会場で看護師と話す",t:[["Is this your first donation?", 0],["Are you on any prescriptions right now?", 3],["You look a little pale. How are you feeling?", 5]]}},
 {t:"第三百八十八歩 結婚式に招かれて",d:"友人の結婚式に出席する",p:[
  ["p3097", "Congratulations to you both!", "お二人とも、おめでとうございます！"],["p3098", "You look absolutely beautiful.", "本当にきれいです。"],["p3099", "The ceremony was so moving.", "式に心を打たれました。"],["p3100", "How do you know the couple?", "新郎新婦とはどういうご関係ですか？"],["p3101", "We went to college together.", "大学の同級生なんです。"],["p3102", "I'm so happy for them.", "二人のことが本当にうれしいです。"],["p3103", "Let's raise a glass to them.", "二人に乾杯しましょう。"],["p3104", "Thank you for inviting me.", "招待してくれてありがとう。"]],
  r:[["So are you a friend of the bride?", 4],["I'm so glad you could make it.", 7],["How did you like the ceremony?", 2]],
  c:{sit:"披露宴で隣の席の人と話す",t:[["Hi, I'm Lisa. I don't know many people here.", 3],["I'm actually the groom's cousin. And you?", 4],["What did you think of the vows?", 2]]}},
 {t:"第三百八十九歩 レンタカー",d:"旅先で車を借りる",p:[
  ["p3105", "I have a reservation under Tanaka.", "田中の名前で予約しています。"],["p3106", "I'd prefer an automatic, please.", "オートマ車でお願いします。"],["p3107", "Does the price include insurance?", "料金に保険は含まれていますか？"],["p3108", "Do I need to fill the tank?", "ガソリンは満タンで返すべきですか？"],["p3109", "Can I return it at the airport?", "空港で返却できますか？"],["p3110", "There's a scratch on the door.", "ドアに傷があります。"],["p3111", "How do I adjust the mirrors?", "ミラーはどう調整しますか？"],["p3112", "I'd like to add another driver.", "運転者をもう一人追加したいです。"]],
  r:[["Do you have a booking with us?", 0],["Manual or automatic?", 1],["Please check the car for damage first.", 5]],
  c:{sit:"レンタカー会社のカウンターで話す",t:[["Good morning. What name is the booking under?", 0],["We have a manual car available.", 1],["You can drop it off at any of our branches.", 4]]}},
 {t:"第三百九十歩 ベビーシッター",d:"子どもを預けるときの説明",p:[
  ["p3113", "Thanks for coming on short notice.", "急なお願いなのに来てくれてありがとう。"],["p3114", "Bedtime is around eight thirty.", "寝る時間は八時半ごろです。"],["p3115", "She's allergic to peanuts.", "この子はピーナッツアレルギーです。"],["p3116", "There's pasta in the fridge.", "冷蔵庫にパスタがあります。"],["p3117", "No screens after dinner, please.", "夕食後はテレビやスマホを見せないでください。"],["p3118", "Call me if anything comes up.", "何かあったら電話してください。"],["p3119", "We'll be back by eleven.", "十一時までには帰ります。"],["p3120", "He might ask for a story.", "お話をせがむかもしれません。"]],
  r:[["What should I give them for dinner?", 3],["When do they usually go to sleep?", 1],["What time will you be home?", 6]],
  c:{sit:"出かける前にシッターに説明する",t:[["Is there anything they can't eat?", 2],["Should I put them to bed at some point?", 1],["What if there's an emergency?", 5]]}},
 {t:"第三百九十一歩 ピクニック",d:"公園でピクニックをする",p:[
  ["p3121", "Let's find a spot in the shade.", "日陰の場所を探そう。"],["p3122", "I'll spread out the blanket.", "レジャーシートを広げるね。"],["p3123", "I made some sandwiches for everyone.", "みんなの分のサンドイッチを作ったよ。"],["p3124", "Did anyone bring something to drink?", "誰か飲み物を持ってきた？"],["p3125", "Watch out for the ants.", "アリに気をつけて。"],["p3126", "It's the perfect day for this.", "まさにピクニック日和だね。"],["p3127", "Let's take our trash home.", "ゴミは持ち帰ろう。"],["p3128", "Who wants to play frisbee?", "フリスビーしたい人いる？"]],
  r:[["It's so sunny right here.", 0],["I'm starving. What did you bring?", 2],["Okay, are we all packed up?", 6]],
  c:{sit:"公園で友人とピクニックの準備をする",t:[["Where should we sit?", 0],["I'm getting really thirsty.", 3],["What should we do with the leftovers and wrappers?", 6]]}},
 {t:"第三百九十二歩 ボードゲーム",d:"友人とボードゲームで遊ぶ",p:[
  ["p3129", "Can you explain the rules again?", "ルールをもう一回説明してくれる？"],["p3130", "Whose turn is it now?", "今は誰の番？"],["p3131", "I think it's your move.", "君の番だと思うよ。"],["p3132", "That's a clever strategy.", "それはうまい作戦だね。"],["p3133", "Wait, is that even allowed?", "待って、それってありなの？"],["p3134", "I'm definitely losing this one.", "今回は完全に負けてるな。"],["p3135", "You're too good at this.", "強すぎるよ。"],["p3136", "Let's play one more round.", "もう一回やろう。"]],
  r:[["Okay, I'm still a little confused.", 0],["Who goes next?", 2],["Good game, everyone!", 7]],
  c:{sit:"友人の家でボードゲームをする",t:[["Sorry, I wasn't paying attention. Who's up?", 2],["I'm going to trade all my cards at once.", 4],["I'm way ahead of everyone now.", 5]]}},
 {t:"第三百九十三歩 音楽フェス",d:"野外の音楽フェスを楽しむ",p:[
  ["p3137", "Who are you most excited to see?", "一番楽しみなのは誰？"],["p3138", "Their set starts at sunset.", "夕暮れから彼らの出番だよ。"],["p3139", "Let's get closer to the stage.", "ステージにもっと近づこう。"],["p3140", "The sound is incredible here.", "ここは音がすごくいいね。"],["p3141", "Let's meet by the main gate.", "メインゲートのそばで落ち合おう。"],["p3142", "I lost my voice from singing.", "歌いすぎて声がかれちゃった。"],["p3143", "My feet are killing me.", "足が痛くてたまらない。"],["p3144", "Let's come back next year.", "来年もまた来よう。"]],
  r:[["What time is that band playing?", 1],["If we get separated, where should we meet?", 4],["How are you holding up?", 6]],
  c:{sit:"フェス会場で友人と話す",t:[["This lineup is amazing, isn't it?", 0],["Ready for the main act? It's starting soon.", 2],["What's wrong with your voice?", 5]]}},
 {t:"第三百九十四歩 回転寿司",d:"回転寿司を案内する",p:[
  ["p3145", "You can order from the tablet.", "タブレットから注文できます。"],["p3146", "The plate color shows the price.", "皿の色で値段がわかります。"],["p3147", "Just take whatever looks good.", "おいしそうなものを取ればいいんです。"],["p3148", "This one has no wasabi.", "これはわさび抜きです。"],["p3149", "The green tea is free.", "緑茶は無料です。"],["p3150", "Put your empty plates here.", "空いた皿はここに入れてください。"],["p3151", "Try the seared salmon.", "炙りサーモンを食べてみて。"],["p3152", "I'm getting full already.", "もうお腹いっぱいになってきた。"]],
  r:[["How do I know what each plate costs?", 1],["I can't handle spicy things.", 3],["Any recommendations for me?", 6]],
  c:{sit:"海外の友人を回転寿司に連れていく",t:[["How do I order something that's not on the belt?", 0],["Are some plates more expensive than others?", 1],["Where do the finished plates go?", 5]]}},
 {t:"第三百九十五歩 今夜の映画選び",d:"家で観る映画を決める",p:[
